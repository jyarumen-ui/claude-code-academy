nX発信アカウント一覧【ジャンル別】\n[リンク]\n\nプロフィール作成 GPTs\n[リンク]\n\nXプロフィール設定マニュアル\n[リンク]\n\n【今週のタスク】\n[リンク]\n\n─\n\n@なまいきくん @あか@運営  お世話になっています。 私も渡辺さんと同様にプロフィールとアカウントについてお聞きしたいことがあります。  ①プロフィール、アカウントについての質問  ②提供して頂いたGPTsを用いて発信コンセプト、発信の10要素、プロフィール作成をしました。  発信コンセプト Who：誰に向けて発信するか？ 【読者の現状】 AI副業に興味がある 30代会社員（収入300万円台後半） で、実績やレベル感は 副業未経験・ゼロから何を始めていいかわからない状態  【悩み・課題】 初期費用がかかりそうで不安 本業にバレるのではないかと心配 副業禁止の会社でもできるか不安 情報が多すぎて何を信じていいかわからない 自分でも本当にできるのか不安  What：どんなゴールに連れて行くか？ 半年で安定的に月30万円を稼げるようになる  【理想の状態】 会社の給料以外に毎月30万円入るので将来の不安が減る 趣味や旅行に我慢せず自由にお金を使える 貯金や投資にまわせて余裕のある生活を送れる 自分に自信がついて他のことにもチャレンジできる   How：どんなロードマップで連れて行くか？ 初期費用ゼロで始められるAI副業を選ぶ 顔出し不要・匿名での発信方法を身につける 最初の収益化（1〜5万円）を達成 効率化＆仕組み化して10万円へ 複数手法を組み合わせて月30万円を安定化  発信の10\n\n─\n\n質問させてください。  ❶質問のおおまかなテーマ 　プロフィールについて  ❷現在の状態、目指すゴール 　・アカウント作成、アカウント名、プロフィール文を作ったところ。（AIジャンルです） 　・合格点のプロフィールを作ることがゴール。  ❸自分なりの意見や仮説 　・コンセプトは、「AI時代と言われているのに食わず嫌いでいじってこなかったけど、生成AIにチャレンジしていく人」。 　・そそっかしくドジな雰囲気で名前はそそっ子、忙しく動いていて、愛されイメージでカワウソのアイコンを描きました。AI使えない人設定なので、アイコンとヘッダーはあえてAIで生成したものではないほうが良いと考えました。 　・実際にAIを勉強する様子、いじっていく様子を発信していく予定です。 　・「それ違うよ！」と突っ込みたくなるような感じだったり、「これなら自分にも活用できそう」とわくわくするような発信を目指していこうと考えています。  ❹質問内容 　・このコンセプトでスタートしてよろしいでしょうか？ 　・プロフィールはこれでよろしいでしょうか？  以下、アカウントです。 [リンク]  ご回答のほどよろしくお願いいたします。","sourceUrl":"","createdAt":"2026-01-01T00:00:00.000Z"},{"id":"topic-1779713999200-rgtsdl","title":"アカウントコンセプト設計｜\"あなただけの切り口\"を見つける方法","category":"profile","content":"## この教材で学ぶこと\n「何を発信すればいいか分からない」という悩みは、コンセプトが決まっていないのが原因です。\nコンセプトとは「誰のために・何を・なぜあなたが発信するのか」の一文です。\n\n---\n\n## ステップ1：自分の「リアルな経験」を書き出す\n\nXで伸びるのは「すごい実績」ではなく「リアルなプロセス」です。\n\n書き出してほしいこと：\n- 過去に経験した失敗・苦労・挫折\n- 今まさに取り組んでいること\n- 人と比べて「特殊だな」と感じる経験\n- お金・仕事・人間関係で悩んできたこと\n\n---\n\n## ステップ2：ターゲットを「一人の人物」としてイメージする\n\n「副業に興味がある人」→ 抽象的すぎてNG\n「27歳・会社員・手取り22万・副業で月3万稼ぎたい・でも何から始めればいいか全くわからない」→ OK\n\nターゲットが具体的になるほど、刺さるポストが書けます。\n\n---\n\n## ステップ3：「○○な人が○○になれる」コンセプト文を作る\n\nテンプレート：\n```\n[ターゲット] が [ゴール] になれる\n[差別化ポイント（なぜあなたが発信するか）]\n```\n\n例：\n```\n副業ゼロ円スタートの会社員が月3万稼げるようになる\n借金1500万→AI×Xで逆転中のリアルドキュメント発信\n```\n\n---\n\n## ステップ4：競合と被らない「切り口」を見つける\n\n同じジャンルでも切り口が違えば差別化できます。\n\n| ジャンル | 切り口の例 |\n|---------|----------|\n| AI副業 | 失敗だらけの初心者目線 |\n| AI副業 | 主婦が育児しながら挑戦 |\n| AI副業 | 借金持ちの逆転ドキュメント |\n| AI副業 | 会社員が副業1年でどこまで行けるか |\n\n重要：「すごい人の発信」より「自分と同じ境遇の人が頑張っている発信」の方が共感を生みます。\n\n---\n\n【講師の実際の発言・事例】\n\n@Yusuke＠講師 さん はじめまして。 いつもお世話になっております、 初質問させていただきます。  Lv2-5まで受講完了しましたので、 アカウント設計の添削をお願いします。  ①質問のおおまかなテーマ アカウントのコンセプト設計の添削。 発信ジャンルはAIの予定です。  ②現在の状態、目指すゴール アカウント設計して3ヶ月後に月200万円稼ぐための土台を作りたいです。  ③自分なりの意見や仮説 ターゲットは自分と同じような状態の人をイメージしています。 ・子育て世帯、忙しくて家族との時間がとれない、このままサラリーマンでいいのか•教育費などお金に対して漠然とした不安のある方 →AI副業で時間とお金を手に入れる  他の発信者との差別化として、以下を織り込んでおりますが、逆に読者の方からするととっつきにくくなるのではと迷っています。ご意見いただきたいです。 ・年収1000万 新卒年収350万から2回転職で達成、でもカツカツ、余裕ない ・CFP 入金力アップからの安定運用で自動化等発信テーマが増やせる   ④質問内容 設計コンセプトを以下記載します。 よろしくお願いいたします。   Who：誰に向けて発信するか？  【読者の現状】 副業全般やAI・X運用に興味がある20代後半〜40代の会社員（主に子育て世帯ターゲット）で、実績やレベル感は完全初心者〜未行動（収益0）  【悩み・課\n\n─\n\n私も発信コンセプトAIでちょっと引っかかった部分があったので、拓巳（コウタ）さんも同じ考えなのかどうか分かりませんが、私が感じた内容を勝手に追記させていただきます。  これから約3か月間はアカウントを育成する期間で、アカウント育成後に商材を決定してマネタイズを目指していくという流れになると思うのですが、発信コンセプト設計AIでは、最初に売りたい商材のことを詳しく答えることになるので、 「ジャンルとかターゲットとかは決まっているけど、ゴールとか提供手段とか、自分の理想と合う商材があるかどうか分からないのに理想論で答えてしまって良いのかなぁ」 と、少し悩んでしまった部分がありました。（結局、有名な方の商材の内容等を参考にしつつ、理想論で進めてしまいましたが…笑）\n\n─\n\n@なまいきくん  @Yusuke＠講師  @あか@運営   ❶質問のおおまかなテーマ プロフィール、コンセプトの方向性について  ❷現在の状態、目指すゴール  •現在の状態 [リンク]  AIアカウントを準備中となります。  •目指すゴール 直近は、AIジャンルの高単価アフィで3ヶ月後に月100万マネタイズが目標です。  ❸自分なりの意見や仮説 まだ実績はないですが、これからちゃんと学んでおきたいと思いAIジャンルに決めました。  実績がないので、まずはAI初心者をターゲットに自ら学びながらAIのノウハウ、情報、知識を発信。  慣れてきたらAI副業にもチャレンジし、実績がでてきたら既存フォロワーも育てつつ、AI副業の領域にも展開していこうかと考えております。  ❹質問内容 プロフィールの内容、コンセプトの方向性に改善点などあればご教示頂きたいです！\n\n─\n\n@なまいきくん   @Yusuke＠講師  @あか@運営   いつもお世話になっております。 Xアカウントにつきましてご相談させていただきます‍  ❶ 質問のおおまかなテーマ 　アイコンとプロフィールの添削をお願いします [リンク]  ❷ 現在の状態・目指すゴール •現在の状態 [リンク] ・目指すゴール 　スキマ時間でAI副業ジャンルの運用で、ターゲットは30代主婦やサラリーマンです。 　AIジャンルの高単価アフィで3ヶ月後に月100万マネタイズが目標です。  ❸自分なりの意見や仮説 ・家庭と仕事で忙しくても、スキマ時間で稼げる。的な感じで発信を検討しています。 現段階では実績がないため、現状のみを記入しています。  ❹ 質問内容 アイコン、ヘッダー、プロフィールの内容、コンセプトの方向性に改善点などあればご教示お願いします。   お忙しいところ恐れ入りますが、ご回答のほどよろしくお願いします。\n\n─\n\n@なまいきくん  @Yusuke＠講師  @あか@運営   お世話になっております。 質問お願い致します。  ❶アカウントについて発信の方向性についての質問です。  ❷現在の状態:高単価アフィのジャンル・発信内容に躓いています。  目指すゴール:発信コンセプトを決めて、アカウントを育てたい  ❸ 激辛くんのアフィの教科書を元にそこにBrainアフィを置いてアフィ実況をして行こうと思っていました。 が、アフィリンクは置かない方がいいということで、方向を変えようと思いました。  ターゲットは、 何かしらの副業を始めたいが何をしたらいいのかわからない。 みんな実績が凄すぎて、少し不信感がある。 もっと実際にやっているところを見たいと思っている。 仕事でAIを触ることがないAI初心者。 時間がない、体力もない40代   前にやっていた恋愛アカで少しnoteが売れた経験があるので、恋愛コンテンツを元に恋愛アカを始めたストーリー運用。 ただ、高単価アフィに女性恋愛ジャンルがないので、AI×noteはどうかと考えています。 (AIジャンル)  恋愛アカの運用をいれるのは、 アカウントを運用している様子が見れるので信頼されやすい。 初心者が副業始める時に、実績がないと稼ぐ系には入りづらいので実績作り。 私自身占いアカの経験もありますが恋愛の方が簡単だった。 鑑定書は作るのが大変だけど、noteなら","sourceUrl":"","createdAt":"2026-01-01T00:00:00.000Z"},{"id":"topic-1779713999210-xjzwad","title":"フック（冒頭文）の書き方｜最初の1行で読者を止める技術","category":"hook","content":"## この教材で学ぶこと\nXのタイムラインは「流し見」されます。\nユーザーは1秒未満でスクロールするかどうかを決めます。\nフック（冒頭の1〜2行）が弱ければ、どんな良い内容でも読まれません。\n\n---\n\n## フックの5パターン\n\n### ①「数字」を入れる\n数字は具体性を生み、信頼感を高めます。\n```\n✗「フォロワーを増やす方法があります」\n✓「3ヶ月でフォロワー0→500にした方法を公開します」\n```\n\n### ②「問いかけ」で自分事にさせる\n読者が「これ自分のことだ」と感じると止まります。\n```\n✗「副業について話します」\n✓「副業を始めたいけど何から始めればいいかわからない人へ」\n```\n\n### ③「逆説・意外性」で好奇心を引く\n「え、なんで？」と思わせると続きを読みたくなります。\n```\n✗「継続が大事です」\n✓「毎日投稿しても伸びない本当の理由」\n```\n\n### ④「共感ストーリー」で感情に訴える\n「あの頃の私」を書くと読者が共感します。\n```\n✓「半年前の私はフォロワー0、何を書けばいいかもわからなかった」\n```\n\n### ⑤「警告・損失」で危機感を持たせる\n「このままだと損する」という感覚は行動を促します。\n```\n✓「これを知らずにポストを書き続けると、永遠に伸びません」\n```\n\n---\n\n## よくあるNGフック\n- 「今日も一日頑張ります！」→ 読者に何のメリットもない\n- 「〜について書きました」→ 結論を先に言う方が良い\n- 「おはようございます」で始まる→ 完全にスルーされる\n\n---\n\n## 練習方法\n自分のポストを書いたら、最初の1〜2行だけ抜き出して「これだけ見て続きを読みたいと思うか？」を自問する。\n\n---\n\n【講師の実際の発言・事例】\n\nこのアルゴハックほんとバグです...講義の5-2-6-3あたりの冒頭フックを応用させて、リプツリー作るだけで 投稿開始1時間で万インプになりました...。  [リンク]\n\n─\n\n第22回目講義お疲れ様でした！\n\n復習しやすいように講義スライドとテンプレ資料を配布しますのでご確認ください！\n\n【講義スライド】\n\nはじめに\n[リンク]\n\n品質を決めるコンテンツ設計\n[リンク]\n\nコンテンツの作成方法\n[リンク]\n\nリリース前の細部の調整\n[リンク]\n\n【テンプレ資料】\n\n粗ステップの書き出しPDF\n[リンク]\n\nマインドマップ例PDF\n[リンク]\n\n[リンク]\n\n[リンク]\n\n[リンク]\n\nスライドテンプレート\n[リンク]\n\n記事の例\n[リンク] (編集済)\n2026年2月6日金曜日 18:22\n\n─\n\n第22回目講義お疲れ様でした！  復習しやすいように講義スライドとテンプレ資料を配布しますのでご確認ください！  【講義スライド】  はじめに [リンク]  品質を決めるコンテンツ設計 [リンク]  コンテンツの作成方法 [リンク]  リリース前の細部の調整 [リンク]  【テンプレ資料】  粗ステップの書き出しPDF [リンク]  マインドマップ例PDF [リンク]  [リンク]  [リンク]  [リンク]  スライドテンプレート [リンク]  記事の例 [リンク] (編集済)\n2026年2月6日金曜日 18:22\n\n─\n\nご回答ありがとうございます   センスあるとおっしゃっていただけてめちゃくちゃ嬉しいです！  プロフはもっとテンポ良い方が良いということですね！ 属性を出すのは、プロフィール文の冒頭ということで合っていますでしょうか？それともアカウント名の右側でしょうか？  どんどん発信していきます\n\n─\n\n@Yusuke＠講師 さん お世話になっております！  スクール生の方のアイコンを元にアイコン作成してみたのですが、キャラ感あり覚えやすいアイコンになってますでしょうか？？   またポスト作成してみましので添削いただけますと幸いです！ よろしくお願いいたします  ■ポスト1 副業の動画ばっか見てる人、そろそろ気づいた方がいいw 動画見て「勉強した気」になってる時点で、正直もう負けてるw 「何からやればいいんだろ〜」って悩んでる間に 行動してるやつは、とっくに1円稼いでる いいからまず1回やれ メルカリ入れて家のゴミ1個出すだけでいい それだけで上位10%の“やってる側”に入れる まだ見てるだけの人は、この先もずっと同じ 人生変えたい人だけ保存しとけ  ■目的 認知獲得：行動してない初心者を“1歩動かす  ■想定読者 「情報収集ばっかで動けてない副業初心者」  ■工夫した点 ① フックで「動画ばっか見てる人」で自分ごと化してもらう ②「勉強した気になってる時点で負け」で イラッとする一言入れ感情動かす ③「行動してるやつは1円稼いでる」で 自分だけ遅れてる感を作る ④「メルカリでゴミ1個出せ」簡単かつ脳死できること   ■ポスト2 スキルない。副業経験ない。お金もない。 それでも稼ぎたいならインスタやれ。 在庫なし。初期費用ほぼ0。 スマホ1台で始められる。 なのに副業やりたいって言","sourceUrl":"","createdAt":"2026-01-01T00:00:00.000Z"},{"id":"topic-1779713999220-mcdtwt","title":"インセンティブ設計｜いいね・RT・返信が増える「仕掛け」の作り方","category":"hook","content":"## この教材で学ぶこと\nバズるポストには「読者が反応したくなる理由」が意図的に設計されています。\nこれを「インセンティブ設計」と言います。\n反応率が高いポスト＝アルゴリズムに乗りやすく、フォロワーが増えます。\n\n---\n\n## 反応が生まれる5つの動機\n\n### ①「同意したくなる」\n「それな！」と思わせると自然にいいねが押されます。\n```\n例：「副業始める前に会社を辞めるのは絶対にやめた方がいい」\n→ 会社員が「わかる！」と反応する\n```\n\n### ②「教えたくなる（マウント欲）」\n人は知識をひけらかしたいものです。意見を求めるとRTされます。\n```\n例：「AIツール、皆さんは何を一番使っていますか？」\n→ コメントしたくなる\n```\n\n### ③「自分事に引き付けられる」\n「これ私のことだ」と感じると保存・RTされます。\n```\n例：「副業を始めて3ヶ月、全然稼げない人に伝えたいこと」\n→ 同じ状況の人がRT\n```\n\n### ④「議論したくなる（あえて反対意見を書く）」\n賛否が分かれる内容は返信・引用RTが増えます。（ただし炎上注意）\n```\n例：「量より質という考えはX初心者には間違っている」\n```\n\n### ⑤「感謝したくなる（有益すぎる情報）」\n「無料でこんな情報を？」と思うとシェアしたくなります。\n```\n例：「知らないと損するAI副業ツール5選（全部無料）」\n```\n\n---\n\n## 実践チェックリスト\nポストを書いたら「この投稿を見た人はどんな気持ちになるか？」を考える。\n- [ ] 「わかる！」と思える内容か\n- [ ] 「自分もこれだ」と思える内容か\n- [ ] 続きを読みたい・保存したいと思えるか\n- [ ] 誰かに教えたいと思えるか\n\n---\n\n【講師の実際の発言・事例】\n\nいつもと時間が異なります\n\n第10回目の講義を\n\n明日10/25(土)の\"15時\"より行います！ \n\n内容は\n\n・【X運用必殺技２】インセンティブ設計術\n\n・売上を爆発的に伸ばすインセンティブ設計の活用テクニック\n\nこちらになります！\n\n前回の講義では、なまいきくん式X運用の必殺技１つ目としてストーリー型運用をお伝えしましたが、\n\n今回の講義は、なまいきくん式X運用の必殺技2つ目として\n\n読者を思いのままに動かし、インプ・反応率が爆上がりする悪魔的テクニック【インセンティブ設計】を解説していきます！\n\nインセンティブ設計をマスターすれば、ポストした瞬間に大量のいいねがつき、普通のポストにも何十件とリプが届く状態を狙って作れます！\n\n今回もなまいきくんがリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！\n\n繰り返しになりますが、明日の講義だけ15時から行うので、\n\nカレンダーに入れるなりして時間間違えないようお願いします！\n\n─\n\n【2周目講義】\n\n2周目講義の第9回目を\n\n本日1/25(日)の21時より行います！ \n\n内容は\n\n・【X運用必殺技２】インセンティブ設計術\n\n・売上を爆発的に伸ばすインセンティブ設計の活用テクニック\n\nこちらになります！\n\n前回の講義では、なまいきくん式X運用の必殺技１つ目としてストーリー型運用をお伝えしましたが、\n\n今回の講義は、なまいきくん式X運用の必殺技2つ目として\n\n読者を思いのままに動かし、インプ・反応率が爆上がりする悪魔的テクニック【インセンティブ設計】を解説していきます！\n\nインセンティブ設計をマスターすれば、ポストした瞬間に大量のいいねがつき、普通のポストにも何十件とリプが届く状態を狙って作れます！\n\n今回もリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！ (編集済)\n2026年1月25日日曜日 20:03\n\n─\n\n昨日出したポストがバズリ始めてるので、取り急ぎ共有します↓\n[リンク]\n\nちなみにこの１ポストだけでフォロワー350人以上増えてますね！\n（まだ伸びてるのでもう少し増えるかと）\n\n【ポストの意図】\n目を引く＆反応したくなるようにしてバズらせ狙い。\n他の要素としては、投資の教育、知識を学ぶことの教育、基準値の高さを見せつける。\n\n★目を引く\n→投資本めっちゃ買いまくって積んでインパクト出す。こういうの他に誰もやってなかった。\n他の人が先にやってたら微妙。\n\n★反応したくなる\n→反応ポイントは大体こんな感じ：\n\n・これ自分も買った、これいい本だよ\n\n・本ばっか読んでも意味ないよ、実践のほうが大事\n\n・金使いすぎ、資金管理したほうがいい\n\n・気合入ってますね、凄いですね\n\n・独学でやってるから本読んだこと無いわ\n\n・後ろにうつってるハゲ薬\n\n【Yusukeメモ】\nやっぱ投資界隈は教えたがりのオッサンみたいな人が多い。ポストで読者に意見聞いたりするの良さそう。思ったより本の選定は良いっぽいからちゃんと勉強しよ。にしても買いすぎた、読む時間無え\n\n─\n\n回答ありがとうございます。 追加で質問させていただけたらと思います。  ❶ ジャンル選定と今後の運用設計についての追加質問です。  ❷ 前回の回答で、 ・現状のアカウントは「AIジャンルというより占いジャンルに見える」 ・AIメインならバズ狙い、占いメインなら実績×ストーリー運用 という整理をしていただきました。  現在は実績はほぼなく、大きな成功体験やトラブルも起きていない状態です。 そのため、「読者がエンタメとして追いたくなるストーリー」をどのように作るべきかで悩んでいます。  ❸ 上記の回答を踏まえ、今の自分がやるべきことについて以下のように仮定しています。  ・まずはジャンルを曖昧にせず、どちらかにハッキリ寄せる必要がある ・現段階では 　「投稿を続ける → 反応を見る → 書きやすい型が残る → 最後まで残った“癖”が強みになる」 　という流れを作ることが重要なのではないか ・差別化や強みは最初から見つけるものではなく、運用の中で自然に浮かび上がってくるものだと考えています ・伸びているポストについては、 　「この人は何者か」ではなく 　「なぜこの文章・構成・言葉選びが伸びたのか」 　という視点で観察・分析することが今の自分に必要だと感じています  一方で、以下の点についてはまだ整理しきれていません。  ・AIと占い、現状どちらをメインにする方が現実的なのか ・実績やトラ\n\n─\n\n田中のアカウント公開と、実際に買収してアカウント開始したところから、月870万円売り上げるまでに至った全ポストをスクール生限定で公開しようとは思ってるのですが、\n\nそれに加えて、僕も皆さんと同じく0から新アカウント始めて売り上げや裏側の数字をリアルタイムで全公開していけば、初期運用のイメージだいぶつきやすいかなーと思ったりするんですがいかがですか？\n\nかなり労力かかるので、正直なところちょいグダってはいるのですが、反応多そうやったら頑張りますww\n\nちょっとスタンプ待ってますね！","sourceUrl":"","createdAt":"2026-01-01T00:00:00.000Z"},{"id":"topic-1779713999224-gybaoe","title":"ポスト構成の基本｜読まれる文章の3つの型","category":"post-structure","content":"## この教材で学ぶこと\n「何を書くか」より「どう構成するか」の方が読まれるかどうかを左右します。\n3つの基本型を覚えるだけで、ポストの質が大幅に上がります。\n\n---\n\n## 型①：PASONA型（悩み→共感→解決）\n最も基本的な説得の型です。商品紹介・有益情報ポストに向いています。\n\n```\nP（Problem   ）：「副業で稼げなくて悩んでいませんか？」\nA（Agitation ）：「実は多くの人がこの1つのミスで失敗しています」\nS（Solution  ）：「解決策は○○をするだけです」\nO（Offer     ）：「具体的には3つのステップで…」\nN（Narrowing ）：「これはXを今すぐ伸ばしたい人限定の方法です」\nA（Action    ）：「今日から試してください」\n```\n\n---\n\n## 型②：起承転結型（ストーリー系）\n体験談・実績報告・感動系ポストに向いています。\n\n```\n起：「半年前の私はフォロワー0でした」（状況設定）\n承：「毎日投稿しても全く伸びず、何度も諦めかけました」（問題）\n転：「ある日、フックの書き方を変えたら1ポストで300いいねがついた」（転換）\n結：「今日からでも遅くありません。最初の1行だけを変えてみてください」（教訓）\n```\n\n---\n\n## 型③：リスト型（有益情報特化）\n「〇つのこと」系のポストはシェアされやすく、保存もされます。\n\n```\n「X初心者が最初にやるべき5つのこと\n\n①プロフィールを整える\n②毎日3投稿する\n③同ジャンルの人に返信する\n④バズった投稿を分析する\n⑤固定ポストを設定する\n\nこの5つだけで最初の100フォロワーは取れます」\n```\n\n---\n\n## 改行・読みやすさのルール\n- 1文が長くなったら改行する\n- 3〜4行ごとに空行を入れる\n- 体言止めを活用する（「〜です」→「〜」）\n- 箇条書きは3〜7個が読みやすい\n\n---\n\n【講師の実際の発言・事例】\n\n@なまいきくん  @Yusuke＠講師  @あか@運営   お世話になっております！ 質問お願いいたします  ❶質問のおおまかなテーマ 発信方向性チェックとプロフィール添削 [リンク]  ❷現在の状態、目指すゴール 現在の状態：コンセプト決定（AI×ライティング） 目指すゴール: アカウントとコンセプトの確定  ❸自分なりの意見や仮説 ・アイコンはクセが強いキャラと視認性を意識。ヘッダーは実績が何もないので一旦アイコンに合いそうなもので選びました。 ・プロフィールは実績がないので自分の立ち位置と今やってることだけを記載してます。 ・コンセプトは Who：文章が書ければ稼げると分かっているのに、文章が書けずに毎回詰んでしまう20〜30代の副業初心者 What：文章作成が苦手な初心者がAIライティングで発信できる人になる 　　　発信できるようになったら、副業で収益化できるようにする（高単価アフィにつなげる） 　　　月10万稼げる仕組みを持つ How：①書けないを解決する 　　　②発信できる人にする 　　　③Xで集客できるようにする 　　　④note、プロンプト、GPTsをリリースして収益を作る 　　　⑤仕組み化 で考えています。  ❹質問内容 ・アカウントで修正した方がいい箇所はありますでしょうか？ ・このコンセプトでスタートしてよいでしょうか？  よろしくお願いいたします！ (編集済\n\n─\n\n回答ありがとうございます。 追加で質問させていただけたらと思います。  ❶ ジャンル選定と今後の運用設計についての追加質問です。  ❷ 前回の回答で、 ・現状のアカウントは「AIジャンルというより占いジャンルに見える」 ・AIメインならバズ狙い、占いメインなら実績×ストーリー運用 という整理をしていただきました。  現在は実績はほぼなく、大きな成功体験やトラブルも起きていない状態です。 そのため、「読者がエンタメとして追いたくなるストーリー」をどのように作るべきかで悩んでいます。  ❸ 上記の回答を踏まえ、今の自分がやるべきことについて以下のように仮定しています。  ・まずはジャンルを曖昧にせず、どちらかにハッキリ寄せる必要がある ・現段階では 　「投稿を続ける → 反応を見る → 書きやすい型が残る → 最後まで残った“癖”が強みになる」 　という流れを作ることが重要なのではないか ・差別化や強みは最初から見つけるものではなく、運用の中で自然に浮かび上がってくるものだと考えています ・伸びているポストについては、 　「この人は何者か」ではなく 　「なぜこの文章・構成・言葉選びが伸びたのか」 　という視点で観察・分析することが今の自分に必要だと感じています  一方で、以下の点についてはまだ整理しきれていません。  ・AIと占い、現状どちらをメインにする方が現実的なのか ・実績やトラ\n\n─\n\nお疲れ様です！いつも皆さんの成果報告に刺激を受けて、参考にさせていただいております。  9/21〜運用開始し、65日目の11/25にフォロワー0→2000人を達成しました！！  なまいきさん始め、運営の皆様、いつも絡んでいただいてるAI系の皆様、このディスコードでたくさんのことを学ばせていただいてるスクール生の皆様、本当にいつも感謝しております  ここにくるまで意識したことを私なりにお話しさせていただきます。  ・スクール参加と同時にXアプリをダウンロード ・TwitterがXに変わったことも数ヶ月前まで知らなかった ・ポストはもちろん、Xはほぼ見たこともありませんでした  そんな状態からのスタートだったので、私はこの中の誰よりもXを知らないと言っても過言ではありません…w  完全ゼロスタートで右も左もわからなかったので、マインド革命から始まり、毎週の講義をひたすら見返しました。今も毎日見てます。おそらく7周はしました(笑)  講義通りに進めていても、初心者すぎる私はハテナが大量に出現し、なまいきさんや運営さんへ質問したいことが山ほどありました。そこで思い切ってアドバンスプランへ移行を決意しました。  旦那が10年勤めた会社を懲戒解雇になり、収入がゼロになって、絶体絶命の大ピンチでしたが、逆にもうここで人生逆転するしがないと思い、独身時代からコツコツ貯めた貯金を使い果たしました！！\n\n─\n\n教育記事完全攻略講義を\n4/25(土)の21時より行います！\n\n内容は\n【教育記事完全攻略】\n・教育記事の本質（気づき→期待感→不足感の3ステージ）\n・実際に売れている記事4本の構造分解\n・自分の記事を組む6ステップ（目的から執筆までの順番）\nこちらになります！\n\n前回のマーケティング全体像の講義で、\n集客→リスト化→教育コンテンツ→CTAの流れと、\n一番勝敗が分かれるのが教育だ、という話をしましたよね。\n\n今回は【教育記事完全攻略】として、\nその教育を「記事」という形でどう設計すればいいのか、\n考え方の根本からパート1〜3で一気通貫で話していきます！\n\nノウハウを並べるだけじゃなくて、\n読者が自分からCTAを踏みたくなる感情の設計図を、\n自分の頭で組めるようになるのがゴールです。\n\n講義が終わったあとには、\nいきなり書き始める前に何を決めるべきかが見えて、\n添削で書き直しになる前に、方向と構成を固められるはずです！\n\n今回もリアルタイムで講義を行い、\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！\n\n─\n\n教育記事完全攻略講義を 4/25(土)の21時より行います！  内容は 【教育記事完全攻略】 ・教育記事の本質（気づき→期待感→不足感の3ステージ） ・実際に売れている記事4本の構造分解 ・自分の記事を組む6ステップ（目的から執筆までの順番） こちらになります！  前回のマーケティング全体像の講義で、 集客→リスト化→教育コンテンツ→CTAの流れと、 一番勝敗が分かれるのが教育だ、という話をしましたよね。  今回は【教育記事完全攻略】として、 その教育を「記事」という形でどう設計すればいいのか、 考え方の根本からパート1〜3で一気通貫で話していきます！  ノウハウを並べるだけじゃなくて、 読者が自分からCTAを踏みたくなる感情の設計図を、 自分の頭で組めるようになるのがゴールです。  講義が終わったあとには、 いきなり書き始める前に何を決めるべきかが見えて、 添削で書き直しになる前に、方向と構成を固められるはずです！  今回もリアルタイムで講義を行い、 その場で質問にも答えるので、是非リアルタイムでご参加くださいー！","sourceUrl":"","createdAt":"2026-01-01T00:00:00.000Z"},{"id":"topic-1779713999224-gsgdns","title":"バズポスト解剖｜伸びる投稿の「意図」を分析する","category":"post-structure","content":"## この教材で学ぶこと\nバズったポストをただ「いいな」で終わらせるのはもったいない。\n「なぜ伸びたのか？」を分析できると、再現性が生まれます。\n\n---\n\n## バズポストの4要素\n\n### ①「目を引く」（視覚的インパクト）\nタイムラインで他と違って見える工夫が必要です。\n- 他の人がやっていない画像・切り口\n- 数字・記号で視線を止める\n- 改行で「空間」を作る\n\n### ②「反応したくなる」（インセンティブ）\n見た人が「いいね・RT・返信」したくなる仕掛けがある。\n→ 前ページ「インセンティブ設計」参照\n\n### ③「教育価値がある」（有益性）\n読んで何かを学べる・気づきがある内容。\n→ 「へー、そうなんだ」「これ使える」と思わせる\n\n### ④「基準値を示す」（ポジショニング）\n「この人はこのレベルの人だ」と伝わる内容。\n→ 数字・実績・思考の深さで「信頼できる人」と思わせる\n\n---\n\n## バズ分析の実践方法\n伸びているアカウントを5つ選び、直近1ヶ月のバズポストを10件集める。\n\n各ポストについて以下を書き出す：\n1. フック（最初の1〜2行）は何か？\n2. どの「反応したくなる動機」を使っているか？\n3. ターゲット（誰が反応するか）は誰か？\n4. 構成の型（PASONA・起承転結・リスト）はどれか？\n\nこれを繰り返すことで「伸びるパターン」が分かるようになります。\n\n---\n\n## 実践課題\n自分のジャンルでバズっているアカウントを3つフォローし、\n毎日1件「このポストが伸びた理由」を分析してメモする。\n\n---\n\n【講師の実際の発言・事例】\n\nお疲れ様です！いつも皆さんの成果報告に刺激を受けて、参考にさせていただいております。  9/21〜運用開始し、65日目の11/25にフォロワー0→2000人を達成しました！！  なまいきさん始め、運営の皆様、いつも絡んでいただいてるAI系の皆様、このディスコードでたくさんのことを学ばせていただいてるスクール生の皆様、本当にいつも感謝しております  ここにくるまで意識したことを私なりにお話しさせていただきます。  ・スクール参加と同時にXアプリをダウンロード ・TwitterがXに変わったことも数ヶ月前まで知らなかった ・ポストはもちろん、Xはほぼ見たこともありませんでした  そんな状態からのスタートだったので、私はこの中の誰よりもXを知らないと言っても過言ではありません…w  完全ゼロスタートで右も左もわからなかったので、マインド革命から始まり、毎週の講義をひたすら見返しました。今も毎日見てます。おそらく7周はしました(笑)  講義通りに進めていても、初心者すぎる私はハテナが大量に出現し、なまいきさんや運営さんへ質問したいことが山ほどありました。そこで思い切ってアドバンスプランへ移行を決意しました。  旦那が10年勤めた会社を懲戒解雇になり、収入がゼロになって、絶体絶命の大ピンチでしたが、逆にもうここで人生逆転するしがないと思い、独身時代からコツコツ貯めた貯金を使い果たしました！！\n\n─\n\n本日の講義であった成果報告をさせていただきます！  ＜概要＞ 30後半のおっさんがAIで得た収入最低75円から4カ月で550万円まで売上増加 それまでの大まかな流れや思考が参考になればと思います。  ＜大まかな流れ＞ ・スクール加入前は2800フォロワー、AI系で発信、noteやLINEスタンプで最低75円程度の収益 ・スクール加入後からフォロワー増加、5ドル程度の収入がちらほら ・激辛くんとの関係構築⇒激辛出版の名の下でBrain発売⇒売上550万  ＜これまでの成果＞ ・8月にスクール加入後からインプ爆上がり⇒4カ月で約4000フォロワー増 ・最低75円程度の収益から4カ月で550万達成 ・トレンド入り2回、最高64万インプ、1日最大300フォロワー増 ・LINEリストが1700名超え  ＜やったこと＞ ・スクール入ってから言われたリプ・いいね回りの初期運用から興味づけ発信 ・収益額を大きく見せて稼いでる感を演出（5ドルって何かすごそうに見えますよねｗ） ・激辛くんとの関係を作るために突然企画された飲み会に飛び入り参加 ・激辛くんが呼んだ飲み会全てに参加して偶然Brainの共同制作機会を獲得 ・商材を「サムネ生成」というニッチなところにしたので、商品コンセプトを「脱AI画像」として商品化 ・理想の未来の見せ方が難しかったので、プロ級のサムネをAIで作ることで誰でも「伝え方」を爆\n\n─\n\n久々の成果報告になります。 AIの高単価アフィをさせていただいており、初日の1件目から55万円の成約できました！！  公式LINE登録→note配布→公式LINEで個別相談→個別面談(セールス) という流れで販売しました。  反省点として、日々の発信で、投資すること・行動することの教育が甘く、グダがあるユーザーが流れてきたことで、個別チャットでグダを消すためにラリーが増えて苦戦しました。  なまいきさんが仰る、ただバズることを目的としたポストがいかに無駄か痛感しているので、講義動画を何度も見返して、日々の発信でしっかり教育かけていきます。  教育記事や、個別LINEでのやり取りに関しては、ほぼ講義内容に沿って作り込んでいるので、改めて講義動画の素晴らしさに感動しました。 この最高の環境に、本当に感謝しております！！  そして、いつも絡んで頂いて本当にありがとうございます！ この成果報告で皆様のモチベーションを高めるきっかけとなれば嬉しいです！！  まだまだ伸ばしていい報告できるように頑張ります\n\n─\n\nお疲れ様です！  講義のリスト取り→教育記事→個別チャットの流れで、1週間で13件の面談が終わり、561万円のご成約をいただきました！  Xど素人が、運用開始3ヶ月でここまで来れると思っていませんでした...。  あと面談は14件残ってるので、ここから売上どのくらい伸びるか楽しみです！  LINEで個別相談する中で、見込み客の悩みや理想の未来が見えてきたので、日々のポストでそこを擦りながら発信していきます。  まだまだ始まったばかりなのでここからさらにぶち抜きます  僕らのためにたくさん動いてくださってる運営の皆様、一緒に頑張ってくださる受講生の皆様、いつもありがとうございます！！\n\n─\n\n本当に感覚バグってるんですけど  わずか2日、成約4件で売上が330万になりましたが少ないなとか思ってる自分がマジで怖いです。  普通に考えたらBrainで330万作るために100部以上売らないといけないのが、たった4件で到達してるのがヤバすぎます。  デベロゴンさん、あるまじろさん、ねるるさん、いちごさん！、まみやさんなどのエグい成果にはならないかもですが、どこまで伸びるか楽しみです (編集済)\n2026年4月26日日曜日 20:04","sourceUrl":"","createdAt":"2026-01-01T00:00:00.000Z"},{"id":"topic-1779713999239-kvyyhq","title":"X初期運用の鉄則｜0フォロワーから最初の100人を作るロードマップ","category":"material","content":"## この教材で学ぶこと\n「フォロワーが全然増えない」のは、正しい初期戦略を知らないからです。\n最初の100フォロワーは特別な方法があります。\n\n---\n\n## フェーズ1（0〜50フォロワー）：まず「存在を知ってもらう」\n\nこの段階では質より量です。\n毎日最低3投稿を続けながら、**積極的に他者のツイートに返信**します。\n\n返信のポイント：\n- 自分のジャンルで伸びているアカウントの投稿に返信する\n- 「〇〇さんの言う通りです」だけはNG（ただの同意はスルーされる）\n- 自分の経験・意見を1〜2行加えて「価値のある返信」にする\n\n目標：1日20件の返信を2週間続ける\n\n---\n\n## フェーズ2（50〜100フォロワー）：「固定ポスト」で来た人を必ずフォローさせる\n\nプロフに来た人を逃さないために固定ポストを設定します。\n\n固定ポストに入れる内容：\n- 自分が何者かがわかる（コンセプト）\n- フォローする理由（何を発信しているか）\n- 実績・体験（信頼できる根拠）\n\n---\n\n## 継続のマインドセット\n\n最初の3ヶ月は結果が出なくて当然です。\nこれはXアルゴリズムの仕組みで、どんな人も最初は見えていません。\n\n数字が伸びなくても続けられる人の特徴：\n- 「今日も学んだことを書けた」で満足できる\n- 毎日投稿を「習慣」として捉えている\n- 1週間単位・1ヶ月単位で変化を見ている（1日単位で一喜一憂しない）\n\n---\n\n## まとめ：初期運用チェックリスト\n- [ ] 毎日3投稿を続けている\n- [ ] 毎日20件以上の返信をしている\n- [ ] 固定ポストにコンセプトが書いてある\n- [ ] 1ヶ月単位で数字を記録している\n- [ ] バズアカウントの分析を週1回やっている\n\n---\n\n【講師の実際の発言・事例】\n\n田中のアカウント公開と、実際に買収してアカウント開始したところから、月870万円売り上げるまでに至った全ポストをスクール生限定で公開しようとは思ってるのですが、\n\nそれに加えて、僕も皆さんと同じく0から新アカウント始めて売り上げや裏側の数字をリアルタイムで全公開していけば、初期運用のイメージだいぶつきやすいかなーと思ったりするんですがいかがですか？\n\nかなり労力かかるので、正直なところちょいグダってはいるのですが、反応多そうやったら頑張りますww\n\nちょっとスタンプ待ってますね！\n\n─\n\n第3回目講義お疲れ様でした！\n\n取り急ぎ復習しやすいように講義スライドと、資料の配布だけ行いますのでご確認ください！\n\n【講義スライド】\n\n4-1:X運用の基本思考を理解しよう\n[リンク]\n\n4-2:アカウントパワーを高めるには？\n[リンク]\n\n4-3：アカウントパワーを上げる鉄板ルーティン\n[リンク]\n\n4-4：基本すぎて誰も語らないXの動作について\n[リンク]\n\n4-5：他人の力を使ってアカウントパワーを高める方法\n[リンク]\n\n【講義関連資料】\n\n厳選ポストネタ集\n[リンク]\n\nXポスト作成AI\n[リンク]\n\n初期運用ルーティン\n[リンク]\n\n─\n\n第4回目の講義を\n\n9/13(土)の21時より行います！\n\n内容は\n\n・初期垢を爆速で伸ばす立ち回り\n・興味付けポストの作り方\n・フェーズ別ポスト戦略\n\nこちらになります！\n\n前回の講義ではX初期運用の基本ルーティンを一通り理解してもらいましたが、\n\n今回話していく興味付けポストを習得できれば、\n\n初期垢でも万インプ出せたり、フォロワーも数十人〜数百人レベルで一気に増やしていけますね！\n\n今回もなまいきくんがリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！\n\n─\n\n第3回目講義お疲れ様でした！  取り急ぎ復習しやすいように講義スライドと、資料の配布だけ行いますのでご確認ください！  【講義スライド】  4-1:X運用の基本思考を理解しよう [リンク]  4-2:アカウントパワーを高めるには？ [リンク]  4-3：アカウントパワーを上げる鉄板ルーティン [リンク]  4-4：基本すぎて誰も語らないXの動作について [リンク]  4-5：他人の力を使ってアカウントパワーを高める方法 [リンク]  【講義関連資料】  厳選ポストネタ集 [リンク]  Xポスト作成AI [リンク]  初期運用ルーティン [リンク]\n\n─\n\n【ガチ0運用企画開始！！】\n\n突然ですが、実績0スタートでも、Xは伸ばせるし、マネタイズは出来るんだぞってことを身をもって証明すべく、\n\nそして、実績がなく悩んでるスクール生の成果を底上げすべく、\n\n講師ゆうすけが実績完全ゼロのジャンルで、完全リアルタイム実況を開始することにしました！\n\nスクールのサポートや他の業務もあるので、正直あまり時間は取れず片手間の運用にはなってしまうのですが、\n\nそのぶん本業やりながら発信していく人の参考にはなるかなと！\n\n1日1〜2時間くらいは頑張って時間作りつつ運用していくつもりです！\n\nちなみに、投資経験はマジでゼロです！\n\n積立NISAもちゃんと始めたのは去年からっていう感じのレベルですw\n\nなので実際にマネタイズをしていくのはかなり先になるかなと！\n\n長期的な売り上げを最大化するため、最低でも半年〜1年くらいは普通にプレイヤーとして運用しながら伸ばしていく予定です！\n\n実況に関しては、\n\n＃【講師実況】0からアカ育成\n\nというチャンネルを新しくdiscord内に設置しています！\n\nこちらのチャンネルで、運用の際考えてることやポストの意図など、\n\n思考の部分も共有しつつ実況していきますね！\n\nあと運用を見ていて気になったことや疑問などがあれば、なんでも聞いてくださいね！\n\n完全ゼロのアカウントからリアルタイムで伸ばしていく裏側見れる機会はそうそう","sourceUrl":"","createdAt":"2026-01-01T00:00:00.000Z"},{"id":"topic-1779713999255-bazyuq","title":"ストーリー型発信｜実績ゼロでもフォロワーが増える「ドキュメント発信」","category":"material","content":"## この教材で学ぶこと\n「自分には実績がないから発信できない」は間違いです。\nむしろ「今まさに挑戦している途中」の方が伸びやすい時代です。\n\n---\n\n## なぜストーリー発信が刺さるのか\n\n人は「完成した成功者」より「自分と同じ境遇で今まさに戦っている人」に共感します。\n\n例：\n- 「月収1000万を達成した起業家」→ 遠すぎて共感できない\n- 「借金1500万抱えて今月0円から副業を始めた」→ リアルで応援したくなる\n\n読者は「この人と一緒に成長したい」という気持ちでフォローします。\n\n---\n\n## ストーリー発信の3つの型\n\n### ①「今日の進捗」型（最も簡単）\n```\n「副業AI挑戦 Day14\n\n今日やったこと：\n・Claudeで記事を3本生成\n・そのうち1本をnoteに投稿\n・0いいね（泣）\n\nでも今日初めてGoogleアナリティクスの設定できた。\n小さくても前進してる。明日も投稿します」\n```\n\n### ②「失敗公開」型（共感が高い）\n```\n「正直に言います。\n\n先週立てた計画、全部できませんでした。\n\n原因は○○と○○。\n来週は△△だけに絞ってやります。\n\n失敗も全部記録します」\n```\n\n### ③「気づき」型（有益性が高い）\n```\n「副業2ヶ月やって気づいたこと\n\n最初は「稼ぐ方法」を探していた。\n今は「続ける仕組み」を作ることの方が100倍大事だとわかった。\n\n完璧な方法より、毎日少しずつ進める習慣の方が強い」\n```\n\n---\n\n## 実践：ストーリー発信ネタ帳\n\n迷ったらこの5つから選ぶ：\n1. 今日やったこと（作業記録）\n2. 今日失敗したこと\n3. 今日学んだこと（スクールや本から）\n4. 数字の変化（フォロワー・収益・アクセス数）\n5. 今日思ったこと・感じたこと（感情ログ）\n\n---\n\n【講師の実際の発言・事例】\n\n第9回目の講義を\n\n本日10/18(土)の21時より行います！ \n\n内容は\n\n・実績ゼロからでも最短で伸ばせる！ストーリー型運用の極意\n\n・ストーリー型運用３つのケーススタディ\n\n・最短で伸ばす！ストーリー型運用の設計方法\n\nこちらになります！\n\nこれまでの講義では、リプや引用で交流するなどコツコツ伸ばす方法を多く語ってきましたが、\n\n今回の講義では、発信でストーリー(物語)を作ることでエンタメでデカく伸ばす運用方法を解説していきます！\n\nストーリー型運用ができれば、見込み客のマインドシェアを強烈に奪うことができ、\n\nプロモーションで爆発的に売っていくための起爆剤になります！\n\n今回もなまいきくんがリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！\n\n─\n\nいつもと時間が異なります\n\n第10回目の講義を\n\n明日10/25(土)の\"15時\"より行います！ \n\n内容は\n\n・【X運用必殺技２】インセンティブ設計術\n\n・売上を爆発的に伸ばすインセンティブ設計の活用テクニック\n\nこちらになります！\n\n前回の講義では、なまいきくん式X運用の必殺技１つ目としてストーリー型運用をお伝えしましたが、\n\n今回の講義は、なまいきくん式X運用の必殺技2つ目として\n\n読者を思いのままに動かし、インプ・反応率が爆上がりする悪魔的テクニック【インセンティブ設計】を解説していきます！\n\nインセンティブ設計をマスターすれば、ポストした瞬間に大量のいいねがつき、普通のポストにも何十件とリプが届く状態を狙って作れます！\n\n今回もなまいきくんがリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！\n\n繰り返しになりますが、明日の講義だけ15時から行うので、\n\nカレンダーに入れるなりして時間間違えないようお願いします！\n\n─\n\nそれこそ今近々の話で言うとぴよまるさん（スクール生ではなく自社スタッフ）のローンチ一緒にやってて思うのですが、\n\nやっぱりリアルで会って一緒に進めると、進捗が半端ないし、一気にポストの伸びも変わるので、ローンチ合宿をサポートとして取り入れるのもアリやなと思いましたね！\n\nただ当然ですが死ぬほど僕の負担かかるので、これに関してはプレミアムメンバー限定とか、合宿は別途費用をいただいてみたいな形になるかもですが！\n\nとはいえローンチ合宿は今思いついてる成果を本当に超最大限まで高めるための話なので、\n\n全プランの全員の成果を引き上げるための施策はもう別に50個くらいアイデアあるのでこちらも順次実施していきますね！\n\nぴよまるさんポスト↓\n（合宿前との比較するといいかも）\n\n[リンク]\n\n─\n\n@なまいきくん  @Yusuke＠講師  @あか@運営   お世話になっております。 10/11に質問させていただいた内容に関連して、恐れ入りますが再度ご質問させてください。（リアルタイム講義に追いつけておらず、こちらでのご質問多くなり申し訳ございません。）  ❶質問のおおまかなテーマ 買収したアカウントのアカウント設計とアカウントパワーについて（講義3おまけ、講義4-1の内容に関連）  ❷現在の状態、目指すゴール 以前ご回答いただいた内容を参考にして、買収したアカウントで以下のようなAIジャンルのアカウントを運営しようとしております。  投資・自己啓発中心の発信→AIを副業ツールとしてだけではなく、これから必須の知識＝資産として学べる場を提供するために、主に以下を発信予定。 ・AIで文章を作るスキル ・AIで収益を生む仕組み ・AIを自分の分身のように動かす考え方  目指すゴール 既存フォロワーの規模を活かしつつ、新規フォロワーにもアプローチしてアカウントの表示パワーを高めたい。  ❸自分なりの意見や仮説 既存フォロワーには以下の要因によりほぼタイムラインにポストが表示されておらず、アカウント規模のレバレッジが効かずアカウントの表示パワーが思ったより伸びないのではないかということが悩み。 また、既存のアカウントに引きづられて美女・金持ちブランディングを続けようとしているが、教師型\n\n─\n\n【2周目講義】\n2周目講義の第8回目を\n\n本日1/18(日)の21時より行います！\n\n内容は\n\n・実績ゼロからでも最短で伸ばせる！ストーリー型運用の極意\n\n・ストーリー型運用３つのケーススタディ\n\n・最短で伸ばす！ストーリー型運用の設計方法\n\nこちらになります！\n\nこれまでの講義では、リプや引用で交流するなどコツコツ伸ばす方法を多く語ってきましたが、\n\n今回の講義では、発信でストーリー(物語)を作ることでエンタメでデカく伸ばす運用方法を解説していきます！\n\nストーリー型運用ができれば、見込み客のマインドシェアを強烈に奪うことができ、\n\nプロモーションで爆発的に売っていくための起爆剤になります！\n\n今回もリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！","sourceUrl":"","createdAt":"2026-01-01T00:00:00.000Z"},{"id":"topic-1779713999255-jvizvm","title":"ファン化の仕組み｜フォロワーを「応援してくれる人」に育てる方法","category":"material","content":"## この教材で学ぶこと\nフォロワー数より「ファン数」の方が重要です。\nファンとは「あなたの投稿を楽しみにしてくれる人」「あなたの商品を買ってくれる人」のことです。\n\n---\n\n## ファン化の3ステップ\n\n### ステップ1：「認知」させる\nバズポストや有益情報でプロフに来てもらう。\n\n### ステップ2：「信頼」を積み上げる\n継続的な発信・リアルな体験共有・返信対応で「この人は本物だ」と思わせる。\n\n信頼を積み上げる行動：\n- 毎日一定のテーマで発信する（一貫性）\n- 読者の返信に必ず答える\n- 失敗・弱みもさらけ出す（完璧を演じない）\n\n### ステップ3：「行動」させる\n信頼が積み上がったら、LINE登録・商品購入・シェアなどの行動を促す。\n\n---\n\n## ファンとフォロワーの違い\n\n| フォロワー | ファン |\n|---------|------|\n| なんとなくフォローしている | 毎日投稿を楽しみにしている |\n| 商品を見ても買わない | 「あなたの商品だから」買う |\n| いつでもフォロー解除する | 長期的に応援してくれる |\n\n---\n\n## ファン化に効く発信パターン\n\n①「読者の声に答える」\n→ 質問や感想に丁寧に返信すると「見てくれている」感が生まれる\n\n②「自分のビフォーアフターを見せる」\n→ 「半年前の自分」と「今の自分」を比べる投稿は共感・感動を生む\n\n③「弱みをさらけ出す」\n→ 完璧でない姿を見せると「親近感」が生まれ、ファンが増える\n\n---\n\n## まとめ\nファンを作るには「この人を応援したい」と思わせることが全て。\nそのためには「等身大のリアルな発信」が最も強い武器です。\n\n---\n\n【講師の実際の発言・事例】\n\n皆さんお疲れ様です！！！  遂に高単価アフィで初成約取れましたぁあああああああ  66万着金です  昨年末なまいきさんから高単価アフィの一次募集が開始されたときに、挑戦したい旨をお伝えし、説明を受けたり、個別面談用のLINEを作成してもらったり、運営の方には色々動いていただきました  私の方では1/17(土)に公式LINEとオプチャを開設して、少しずつリスト取りを始めました！  開設から明日で2週間になりますが、現在の登録者は下記になります。 公式LINE→261名 オプチャ→227名  公式LINEで個別質問を受け付ける形で運用しているので、何名か「副業やりたいです」とか「稼ぎ方教えてください」など問い合わせがくるようになったので、それぞれ個別に対応していました。  その中で見込みのある人は個別チャットでじわじわ教育し、スクールに興味をしめしたタイミングで個別面談の案内をしました。  なまいきさんやゆうすけさんにご指摘いただきましたが、誰でも簡単に面談できる訳ではないということをきちんと伝え、特別に案内するようなニュアンスで面談に誘導しました！！！  公式LINE開設と高単価アフィの提携開始から2週間弱で成果が出ると思ってなかったので、驚きです！！！  これもなまいき式X運用を日々実践し、読者の教育とファン化が少しずつできていた結果かなと思っています！！！  正直まだまだ課題は山\n\n─\n\nお疲れ様です！  講義のリスト取り→教育記事→個別チャットの流れで、1週間で13件の面談が終わり、561万円のご成約をいただきました！  Xど素人が、運用開始3ヶ月でここまで来れると思っていませんでした...。  あと面談は14件残ってるので、ここから売上どのくらい伸びるか楽しみです！  LINEで個別相談する中で、見込み客の悩みや理想の未来が見えてきたので、日々のポストでそこを擦りながら発信していきます。  まだまだ始まったばかりなのでここからさらにぶち抜きます  僕らのためにたくさん動いてくださってる運営の皆様、一緒に頑張ってくださる受講生の皆様、いつもありがとうございます！！\n\n─\n\n【なまスク高単価アフィ途中経過報告】  X参入3ヶ月・初ローンチの途中経過です。 ローンチも動画を何回も見ながらほぼ自分でやったので上手くできてたのかは分かりません。  導線は初ローンチなので一番初心者向けのシンプルなやつにして、 noteプレゼント企画→公式LINE登録してもらってnote(教育記事)読んでもらう→個別チャット→個別面談です。  現在29人個別面談完了 成約額2332～3322万円となってます。 現在スタンダードorアドバンスなどで検討中の方が5人ほどいて再面談の結果待ちです。既に最低で2332万以上の売上を作れてこのスキームのヤバさを体感してます。  残り面談数が15人＋3/31にローンチしてからいまだにチャットを複数人 しておりあと4〜5人ぐらいは面談数が増えそうなので、 最終3000〜4000万ぐらいになるかな？と予測してます。  ただ今回めちゃくちゃ失敗したのは、初ローンチなので どれぐらい個別チャットが来るのが予想がつかず、蓋を開けてみたら最終的には130人ぐらいチャットがきて、到底、1人では返せない人数が来てしまったので、緊急でなまいきさんやセールスの人たちに手伝ってもらうことになりました。3/31〜4/10の今までチャットが多すぎてほぼポストやリプ周りもできなくなってます。(この間にはポストをできていたらさらに売り上げが伸ばせたと思います)   チャ\n\n─\n\n第19回目の講義を\n\n本日12/27(土)の21時より行います！ \n\n内容は\n\n・売れる教育導線の作り方\n・教育導線の作り方\n・月600万円売れた高単価アフィ事例の紹介\n・教育コンテンツの作り方\n\nこちらになります！\n\n前回までの講義でリスト獲得方法については理解できたと思いますが、\n\nLINEに集めてリスト化できたから終わり！というわけではなく、\n\nセールスに繋げる前に見込み客の熱量をどれだけ上げられるか（教育できるか）、によって最終的な成約率や売上は大きく変わってきます。\n\nこの教育コンテンツを一度作っておけば、\n\nLINEに入ってくれた読者を最大効率でセールスに繋げられるし、皆んなは集客だけに全力を注ぐことができます！\n\n今回もリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！\n\n─\n\n第26回目の講義を\n3/7(土)の21時より行います！\n\n内容は\n【企画の作り方 実践編】\n・フォロワーの購買欲を爆発させるローンチ企画の全技術\n・教育×拡散×リスト獲得が同時に回るローンチ動画の作り方 \n・ライブだからこそ伝わるSpaceの使い方\n・LINE配信にしかできない重要な役割\nこちらになります！\n\n前回のLv.22ではローンチの呼吸として、\nポストで2〜3週間かけて興味づけ・教育・商品告知の流れを作る方法を学びました。\n\nただ、ポストだけでは「気になる」止まりで「欲しい！今すぐ買う！」まで持っていけないケースが多い。\n\n今回は【企画の作り方 実践編】として、\nポストの教育だけでは突破できない壁を、ローンチ動画・Space・LINE配信の3つの企画パーツで一撃で突破する具体的な設計方法を全て解説します。\n\nローンチ動画1本で売上の7割が決まると言っても過言ではなく、「教育しながら拡散しながらリストを取る」好循環の仕組みを作れるようになります。\n\nさらにSpaceのリアルタイムの本物感で信頼を積み上げ、LINE配信で全パーツを確実に読者の手元に届けることで、販売した瞬間に爆発的に売れる状態を作れるようになります。\n\n講義後には初回ローンチの全手順が明確になり、実際に商品を売るローンチを組めるようになります。\nまず1回やって「売る経験」を積むことが全てのスタートです。\n\n今回","sourceUrl":"","createdAt":"2026-01-01T00:00:00.000Z"},{"id":"topic-1779713999271-slgcty","title":"マネタイズの全体像｜Xから収益を生み出す3つのルート","category":"material","content":"## この教材で学ぶこと\nXで稼ぐ方法は大きく3つあります。\nどれが自分に合うかを理解した上で、計画を立てることが大切です。\n\n---\n\n## ルート①：アフィリエイト（初心者に最も入りやすい）\n\n他社の商品を紹介して報酬をもらう仕組みです。\n自分の商品がなくてもすぐに始められます。\n\n流れ：\n```\nX発信でフォロワーを集める\n→ LINE登録に誘導\n→ LINEで有益情報を配信しながら信頼を積む\n→ おすすめ商品を紹介\n→ 購入されたら報酬発生\n```\n\n特徴：初期投資ゼロ・商品作り不要・でも単価が低め\n\n---\n\n## ルート②：コンテンツ販売（単価が高い）\n\n自分の知識・経験をnoteやPDFにまとめて販売します。\n\n向いている人：\n- 特定のジャンルで実績・経験がある（失敗含む）\n- 「〇〇の方法」をわかりやすく説明できる\n\n始め方：\n1. まずnote無料記事で反応を見る\n2. 反応が良いテーマで有料コンテンツを作る\n3. Xで告知→購入\n\n---\n\n## ルート③：スクール・コーチング（最高単価）\n\n自分の経験・知識を「人に直接教える」サービスです。\n月額制・個別指導・コミュニティ運営など形式は様々。\n\n向いている人：\n- 教えることが好き\n- 「一緒にやる」型のサポートが得意\n- ある程度フォロワー・実績が積み上がっている\n\n---\n\n## 初心者が最初に目指すこと：「ゼロイチ」\n\nまず大きな収益より「最初の1円」を作ることが大事です。\n\nゼロイチを達成するロードマップ：\n1. アカウント育成（3ヶ月：フォロワー300〜1000人）\n2. LINEリスト獲得（固定ポスト・プレゼント企画）\n3. 教育コンテンツ配信（LINE読者の信頼を積む）\n4. 最初のセールス（アフィリエイト or 低価格コンテンツ）\n\n---\n\n## 大事なこと\n「稼ぐ方法」を探し続けるより、「続ける仕組み」を作る方が100倍大事。\n3ヶ月続けられた人だけが選択肢を持てます。\n\n---\n\n【講師の実際の発言・事例】\n\n@Yusuke＠講師  はじめまして。 L2-5まで完了しましたので添削よろしくお願いします。   Who：誰に向けて発信するか？ 【読者の現状】  AI活用に興味がある20代後半〜40代の主婦・ママで、実績やレベル感は収益0円〜月1万円未満・副業挫折経験あり 【悩み・課題・思い込み】  ・子育てでまとまった作業時間が取れない  ・過去に副業で失敗して自信がない  ・詐欺や怪しい副業が怖い  ・スマホだけでできる副業を探している  ・1人だと継続できない  ・何から始めればいいかわからない   What：どんなゴールに連れて行くか？ 3ヶ月で月10万円を達成し、最終的に在宅で月50万円を安定して稼ぐ 【理想の状態・ベネフィット】  ・夫に収入面で頼らなくてよくなる（精神的自立）  ・子どもとの時間を優先しながら収入を得られる  ・子どもにやりたいことを我慢させない  ・家で完結する働き方ができる   How：どんなロードマップで連れて行くか？ 完全コピーテンプレで実践スタート スマホ×AIで作業を最小化（スキマ時間設計） 無理のない発信を習慣化 初収益（0→1）を達成 型化して月10万→50万へ拡張   発信の10要素 ・他の副業に比べた「AI×アフィリエイト」の魅力（在宅・低リスク・スマホ完結）  ・他の人と違う「ママでもできる×超シンプル設計」の強み  ・3ヶ月で月10万→月5\n\n─\n\n@Yusuke＠講師   お世話になっております。  AIマネタイズおよび高単価アフィリエイトについてご相談です。  私は将来的にAIスクールのアフィリエイトで収益を得ることを目標にしています。そのため、まずは自分自身がAIで収益を出さなければならないと考え、マネタイズを急いできました。  しかし現状は、収益化の見込みが立たない状態が続いています。  このような状況で、Xで何を発信すべきなのか分からなくなってしまいました。  流行りのAIトピックに乗ればインプレッションを伸ばすことは可能かもしれません。しかし、自分に実績がない状態でフォロワーを増やしても、最終的なマネタイズにつながらないのではないかと感じています。  そこでお聞きしたいのは、  ・実績がない段階でもXを伸ばす意味はあるのでしょうか？ ・収益化の見込みが立っていない今、自分は何を軸に発信すべきなのでしょうか？  今の自分にとって、X発信を続ける合理的な理由があるのかを知りたいです。\n\n─\n\n@Yusuke＠講師 さん  お世話になっております！ Lv.2.8アカウント作成まで進みましたので、アカウントの添削お願いします  ①発信コンセプト ②発信の10要素 ③アカウントプロフィール  ーーー ①発信コンセプト   Who：誰に向けて発信するか？  【読者の現状】  SNSで稼ぐ方法・自動収益・個人で稼ぐスキルに興味がある 将来に不安を感じていて本業以外の収入源を作りたい20代後半〜30代男性会社員で、実績やレベル感は副業を調べている段階〜月0〜1万円レベル・インスタをやろうとして止まっている人  【読者の悩み・課題】     •    失敗してお金を無駄にするのが怖い     •    副業をやりたいけど何から始めればいいかわからない     •    AIをどう使えばいいかわからない     •    インスタはセンスがないと無理だと思っている     •    SNSで本当に稼げるのか怪しいと思っている  ⸻   What：どんなゴールに連れて行くか？  副業初心者でも最短3ヶ月で副業0→1（月10万円）を達成する  【ゴールに到達した理想の状態】     •    毎月＋10万円の余裕ができる     •    好きなことにお金を使える     •    将来の不安が減る     •    会社を辞める選択肢が生まれる     •    収入源が2つ以上になる \n\n─\n\nお世話になっております。 別アカウントのコンセプトを考えてみましたので、フィードバックをいただけますでしょうか。 こちらはスマホ内職のスクール販売を考えております。こちらは当方で別途アフィリエイト提携している商品になります。  ①発信コンセプト  Who：誰に向けて発信するか？ スマホ副業・在宅ワーク・育児しながら稼ぐ方法に興味がある、20代〜40代の男女、特に子育て中のママ・未就学児ママ・小学生ママ・専業主婦・パート主婦・地方在住の女性で、実績やレベル感は副業未経験〜月1万円未満の初心者層   What：どんなゴールに連れて行くか？ 最短即日で収益ゲット。その後、30日で月5万円の副収入を達成し、完全在宅・スマホのみで月30万円を目指せる土台を作る   How：どんなロードマップで連れて行くか？ スマホ内職に対する不安や思い込みをなくす 手順通りに実践して、即日で初成果を出す 1日10分以上の作業を習慣化する 家事・育児などの合間を使って月5万円を作る さらに時間を投下して月10万〜30万円を目指す  ② 発信の10要素 他の副業に比べたスマホ内職の魅力 他のスマホ内職と比べたあなたの手法の魅力 30日で月5万円までのロードマップ スマホ内職を始めて得られた変化 スマホ内職で自由度が増した生活の様子 実績の積み上げ報告 初心者が最初に何をすればいいか スマホ内職に対するよくある誤\n\n─\n\nご回答いただき、ありがとうございます。 ③の考え方が合っており、安心いたしました。  またポスト削除不要の旨、承知いたしました。 「フォロー：100弱、フォロワー：4,500弱」のため、フォローの整理は一旦せずに運用していくことにいたします。  重ねてのご質問で恐縮ですが、以下2点にご回答いただけますと幸いです。  ＝＝＝  ❶テーマ 買収後の運用方針について  ❷現在の状態、目指すゴール 直近のポストはInstagramマネタイズに関する内容が多くございます。固定ポストではInstagramマネタイズのコンテンツ販売（深夜マーケット）をしており、それなりの販売数を出している状況です。こちらを裏垢マネタイズに寄せていき、高単価アフィリエイトに繋げていきたいです。  ❸自分なりの意見や仮説 ”これまではInstagramマネタイズを推していたが、今は裏垢がアツい”というようなニュアンスで、「新たにチャレンジ→成果→教育→アフィリエイト」というストーリー型運用がマッチしているかと考えました。  ❹質問内容 ❷と❸を踏まえて、運用方針は合っておりますでしょうか？ 恐れ入りますが、私自身が未だLV.2までの完了のため、これから先のカリキュラムにて該当の質問内容に関する回答があり、思考がクリアになるのであれば先走った質問をしてしまい申し訳ございません。 回答および、ご意見等も併せていただけま","sourceUrl":"","createdAt":"2026-01-01T00:00:00.000Z"},{"id":"topic-1779713999271-wyjkuq","title":"添削の基準｜「良いポスト」と「悪いポスト」の違いを理解する","category":"feedback","content":"## この教材で学ぶこと\n自分のポストが「なぜ伸びないのか」を分析するための基準を身につけます。\n\n---\n\n## 良いポストの5条件\n\n### ①「最初の1〜2行で続きを読みたくなる」\nタイムラインで止まってもらえるフックがある。\n\n### ②「具体的な数字・固有名詞がある」\n```\n悪：「副業で稼げるようになりました」\n良：「副業3ヶ月目で初めて月1万円を達成しました」\n```\n\n### ③「読者のメリットが明確」\n「この投稿を読んで読者は何を得られるか」が明確。\n読者は常に「自分に何の得があるか」で判断します。\n\n### ④「適切な改行で読みやすい」\n1文が長い・改行がないポストは読まれません。\n目安：2〜3行ごとに改行・空行を入れる。\n\n### ⑤「行動を促す締め」\n最後に「フォローしてください」「保存推奨」「どう思いますか？」などで反応を促す。\n\n---\n\n## よくあるNGパターン\n\n### NG①「自分語りが強すぎる」\n```\n「今日も頑張りました。疲れたけど充実してます。明日も頑張ります！」\n→ 読者に何のメリットもない。日記をXに書いている状態。\n```\n\n### NG②「抽象的すぎる」\n```\n「努力すれば夢は叶います！諦めないことが大切です！」\n→ 具体性がなく記憶に残らない。\n```\n\n### NG③「結論が最後すぎる」\n```\n「最近色々と試行錯誤してきて、失敗もたくさんして、\n 周りに助けてもらいながら、やっと少しずつ分かってきたのですが、\n 大事なのは○○です」\n→ 結論を最初に言う。\n```\n\n### NG④「誰に向けて書いているか不明」\nターゲットが不明確なポストは誰にも刺さりません。\n「副業に興味がある人」→「副業を始めたい30代会社員」に絞る。\n\n---\n\n## 添削の手順（自分でやる方法）\n1. 書いたポストを見直す\n2. 「最初の1行だけ見て続きを読みたいか？」\n3. 「読者に何のメリットがあるか？」\n4. 「具体性はあるか（数字・固有名詞）？」\n5. 「読みやすいか（改行・長さ）？」\n\n---\n\n【講師の実際の発言・事例】\n\n@Yusuke＠講師   初めまして、初投稿になります。 よろしくお願いいたします。 Lv2のタスク、 ・発信コンセプト ・アカウントプロフィール ・アイコン＆ヘッダー こちら3点の添削をしていただきたいと思います。お忙しいとは思いますが、どうぞよろしくお願いいたします。    Who：誰に向けて発信するか？  【読者の現状】 恋愛・モテ・マッチングアプリ・コミュニケーション能力向上に興味がある 23〜30代の若手会社員〜30代で恋愛経験が少ない男性で、友達はいるが女性経験はほぼない層  〖実績やレベル感〗 LINEが続かず既読スルーされる／マッチングしても会話が続かない／何を話せばいいかわからない状態  【悩み・課題・思い込み】 •    マッチングしても会話が続かずフェードアウトする •    沈黙が怖くて無理に話して空回りする •    面白いことを言わなきゃとプレッシャーを感じている •    既読スルーされると「自分に魅力がない」と感じてしまう •    コミュ力は才能で、自分にはどうにもならないと思っている •    陰キャの自分がモテるのは無理だと感じている •    テクニックを覚えればなんとかなると勘違いしている •    世に出ている恋愛テクニックは“元からモテる男向け”で再現できていない   What：どんなゴールに連れて行くか？  1ヶ月で既読スルーされない\n\n─\n\n指摘ありがとうございます。 マネタイズに繋がらない具体的な理由は、 コンテンツの内容自体が売れる型になっていないということでしょうか？それとも、私からコンテンツを購入する理由がないということでしょうか？  以下に私の理学療法士としての経験の強みから話を『聞く』ことに特化させた解決手段へ変更した場合のコンセプト設計修正版を載せます。  修正①：Whoの読者現状を「恋愛全般に悩む男性」→「会話・LINEに詰まっている男性」に絞りました。 理由としては、「非モテ全般」を対象としていましたが、これでは男性発信者と同じ土俵になってしまうため、「マッチング後の会話・LINEに詰まっている」に絞ることで、PTの傾聴スキルが直接的な解決手段として機能すると考えました。  修正②：思い込みリストに「聞く力を知らない」を追加しました。 理由として、私の発信の核心である「聞く力」への気づきを、読者の悩みの構造に組み込ませようと考えました。「テクニックが通用しない→実は聞き方の問題だった」という気づきの導線が出来るのではと考えました。  競合のアカウントとの差別化が出来る強みは『聞く』に特化している点だと考えています。 長文になりましたが、添削のほどどうぞよろしくお願いいたします。    Who：誰に向けて発信するか？ 【読者の現状】 マッチングアプリでマッチングはできるが、そこから先の会話・LINEが続\n\n─\n\n@なまいきくん   @Yusuke＠講師  @あか@運営   いつもお世話になっております。 Xアカウントにつきましてご相談させていただきます‍  ❶ 質問のおおまかなテーマ 　アイコンとプロフィールの添削をお願いします [リンク]  ❷ 現在の状態・目指すゴール •現在の状態 [リンク] ・目指すゴール 　スキマ時間でAI副業ジャンルの運用で、ターゲットは30代主婦やサラリーマンです。 　AIジャンルの高単価アフィで3ヶ月後に月100万マネタイズが目標です。  ❸自分なりの意見や仮説 ・家庭と仕事で忙しくても、スキマ時間で稼げる。的な感じで発信を検討しています。 現段階では実績がないため、現状のみを記入しています。  ❹ 質問内容 アイコン、ヘッダー、プロフィールの内容、コンセプトの方向性に改善点などあればご教示お願いします。   お忙しいところ恐れ入りますが、ご回答のほどよろしくお願いします。\n\n─\n\n@なまいきくん  @Yusuke＠講師  @あか@運営   お世話になります。 質問失礼致します！  ❶質問のおおまかなテーマ アイコンとプロフィール添削  ❷現在の状態、目指すゴール  現在の状態：女攻略ジャンルに 目指すゴール: 最適なプロフィール設計  ❸自分なりの意見や仮説 ・アイコンはブルーロックのいさぎをイメージして作成しています。成り上がり系みたいなイメージです。 ・プロフは実績をかけるだけ書いてます。 ・コンセプトは30代で非モテの男性向けに効率よく女遊びしたい層向けに発信しています。  ❹質問内容 ・この方向性でいいか？それとももっとます向けにネトナンという括りなどにして広げたほうがいいか？ ・プロフィール設計の改善策を教えていただきたいです ・もしこのアカウントじゃ成果でないということであればアカウント買収します！  よろしくお願いいたします (編集済)\n2025年11月23日日曜日 21:02\n\n─\n\n@なまいきくん  @Yusuke＠講師  @あか@運営   お世話になっております。Yusuke講師、現状課題分析ありがとうございました！ プロフィールを編集しましたので、フィードバックをお願いいたします。   ❶質問のおおまかなテーマ プロフィールを編集しました。フィードバックをお願いしたいです。  ❷現在の状態、目指すゴール 現在の状態：プロフィール画像にモブ感ありと指摘をいただきました。また、プロフィール欄の文の修正をいただきました。 目指すゴール：プロフィールのモブ感を改善し、プロフィール文を最適化したい。  ❸自分なりの意見や仮説 現状課題分析で指摘いただいた内容を考慮し、画像は少し抜け感のあるものを採用しました。ハムスターをベースとし抜け感を出し、ジト目にして差別化しました。 プロフィールも指摘いただいたので、不要な部分を削除し「誰が」と「現在取り組んでいること」を書きました。  ❹質問内容 プロフィール画像のモブ感を払拭できているか？ プロフィール欄はAI副業について発信していくうえで最適な文言になっているか？ この2点についてフィードバックいただきたいです。 お忙しいところ恐れ入れいますが、よろしくお願いいたします。","sourceUrl":"","createdAt":"2026-01-01T00:00:00.000Z"},{"id":"topic-1779713999290-rbqknn","title":"初心者Q&A集｜よくある疑問と講師の回答まとめ","category":"feedback","content":"## この教材で学ぶこと\nスクール生が実際に悩んだこと・質問したことへの講師の回答をまとめました。\n\n---\n\n## Q1：「何をポストすればいいか分からない」\n**A：「今日やったこと・学んだこと・失敗したこと」の3つだけで始める**\n\n最初は「正しい情報」より「自分のリアル」の方が価値があります。\n「今日スクールでフックの書き方を学んだ。早速試してみる」\nこれだけで立派なポストになります。\n\n---\n\n## Q2：「フォロワーが増えない」\n**A：自分のタイムラインだけに投稿しても誰にも見つかりません**\n\n解決策：毎日20件以上、自分のジャンルで伸びているアカウントに返信する。\n「〇〇さんの言う通りです！」だけはNG。自分の意見・体験を1文加える。\n\n---\n\n## Q3：「発信ジャンルが決まらない」\n**A：まず「自分の失敗・苦労体験」を10個書き出す**\n\n「すごい実績がないと発信できない」は思い込みです。\nリアルな失敗体験こそが最強のコンテンツです。\n決まらないまま動き出してOK。発信しながら絞っていきます。\n\n---\n\n## Q4：「文章を書くのが苦手」\n**A：型（テンプレート）を使う**\n\nうまい文章を書く必要はありません。\n「フック→説明→まとめ」の型に当てはめるだけで形になります。\n最初は「ポスト構成の基本」教材の型をそのままコピーしてOKです。\n\n---\n\n## Q5：「モチベーションが続かない」\n**A：「結果」ではなく「行動」を目標にする**\n\n「フォロワー100人増やす」→ 自分ではコントロールできない\n「毎日3投稿する」→ 自分でコントロールできる\n\n行動目標に変えることで、継続しやすくなります。\n成果報告チャンネルで小さな達成を共有すると仲間が応援してくれます。\n\n---\n\n## Q6：「思考放棄した質問をしてしまう」\n**A：質問の前に「自分はこう考える」を必ず書く**\n\n「どうすればいいですか？」だけの質問はNGです。\n「自分は○○だと考えているが、△△の部分で悩んでいる」という形式で質問する。\n自分で考える力がつくことが、長期的に稼ぐ力に直結します。\n\n---\n\n【講師の実際の発言・事例】\n\n【グループ質問の利用方法】\n\n講義の学習効果を最大化するため\nグループ質問を解放します！\n\nこちら積極的に質問してもらうことで\n自分1人では解決できない悩みを即解消できますし\n\n他のメンバーの質問も見ることで\n1人でやってるだけでは\n決して辿り着かなかった視点も得られます。\n\n存分に活用してください！\n\n以下質問時のルールだけ共有しておきます。\n\n・質問の際のルール\n\n①すでに授業で扱った内容に関する質問のみを可とします。\n\nチームなまいきメンバーが成果出るようにカリキュラムを組んでいるので、\nまだ授業で扱ってない先走った内容の質問は、一旦なしでお願いします！\n\n②完全に思考放棄するのは絶対に辞めること\n\nポスト何やればいいですか？\nアイコン何がいいと思いますか？\nローンチでどうすればいいですか？\n\nみたいな何も考えずに\nとりあえずぶん投げるみたいなのは禁止です\n\n当然サポートはしますが\n今後個人で稼いでいきたいなら\n自分で適切な解を捻り出すという業務は一生付きまといます\n\n思考放棄＝個人で稼ぐ道の断念なので\n必ず自分で考えられるだけ考えてから質問してください\n\nただ、悩みすぎも良くないので\n行き詰まったら即質問してください！\n\n③思考回路を必ず記載すること\n\n一番大事なのは具体事例のインプットや添削ではなく\nそもそもの思考回路をビジネスで結果が出るようなものに変えていくことです\n\n\n─\n\n【グループ質問の利用方法】  講義の学習効果を最大化するため グループ質問を解放します！  こちら積極的に質問してもらうことで 自分1人では解決できない悩みを即解消できますし  他のメンバーの質問も見ることで 1人でやってるだけでは 決して辿り着かなかった視点も得られます。  存分に活用してください！  以下質問時のルールだけ共有しておきます。  ・質問の際のルール  ①すでに授業で扱った内容に関する質問のみを可とします。  チームなまいきメンバーが成果出るようにカリキュラムを組んでいるので、 まだ授業で扱ってない先走った内容の質問は、一旦なしでお願いします！  ②完全に思考放棄するのは絶対に辞めること  ポスト何やればいいですか？ アイコン何がいいと思いますか？ ローンチでどうすればいいですか？  みたいな何も考えずに とりあえずぶん投げるみたいなのは禁止です  当然サポートはしますが 今後個人で稼いでいきたいなら 自分で適切な解を捻り出すという業務は一生付きまといます  思考放棄＝個人で稼ぐ道の断念なので 必ず自分で考えられるだけ考えてから質問してください  ただ、悩みすぎも良くないので 行き詰まったら即質問してください！   ③思考回路を必ず記載すること  一番大事なのは具体事例のインプットや添削ではなく そもそもの思考回路をビジネスで結果が出るようなものに変えていくことです\n\n─\n\n@なまいきくん @あか@運営  お世話になっています。 私も渡辺さんと同様にプロフィールとアカウントについてお聞きしたいことがあります。  ①プロフィール、アカウントについての質問  ②提供して頂いたGPTsを用いて発信コンセプト、発信の10要素、プロフィール作成をしました。  発信コンセプト Who：誰に向けて発信するか？ 【読者の現状】 AI副業に興味がある 30代会社員（収入300万円台後半） で、実績やレベル感は 副業未経験・ゼロから何を始めていいかわからない状態  【悩み・課題】 初期費用がかかりそうで不安 本業にバレるのではないかと心配 副業禁止の会社でもできるか不安 情報が多すぎて何を信じていいかわからない 自分でも本当にできるのか不安  What：どんなゴールに連れて行くか？ 半年で安定的に月30万円を稼げるようになる  【理想の状態】 会社の給料以外に毎月30万円入るので将来の不安が減る 趣味や旅行に我慢せず自由にお金を使える 貯金や投資にまわせて余裕のある生活を送れる 自分に自信がついて他のことにもチャレンジできる   How：どんなロードマップで連れて行くか？ 初期費用ゼロで始められるAI副業を選ぶ 顔出し不要・匿名での発信方法を身につける 最初の収益化（1〜5万円）を達成 効率化＆仕組み化して10万円へ 複数手法を組み合わせて月30万円を安定化  発信の10\n\n─\n\n@なまいきくん  @Yusuke＠講師  @あか@運営   お世話になっております。 質問させてください。   ❶質問のおおまかなテーマ コンセプト、プロフィールついて ❷現在の状態、目指すゴール ・現在、物販の方で高単価アフィリエイトに繋げる方向で 進めていきたいと思っています。 AIを使って、xのプロフィール作成やコンセプト作りしました。ご確認お願いいたします。  ❸ コンセプトは、  物販に興味がある副業初心者の会社員で、「今の給料に＋5～10万円の副収入を得て、将来的に脱サラを目指している人」。 実績やレベル感は「これから物販を始めたい、もしくは始めたばかりの段階」の人達に 発信していきたいと思っています。  ❹質問内容 このコンセプトでスタートしてよろしいでしょうか？ ・プロフィールの確認 よろしくお願いいたします。 以下アカウントです。  [リンク]  只今プレミアム審査中で編集できないのですが 名前の方をゆめり @スマホ1台で叶える自由副業に変える予定です。 ご確認お願いいたします。\n\n─\n\n@なまいきくん  @Yusuke＠講師  @あか@運営   ❶質問のおおまかなテーマ プロフィール、コンセプトの方向性について  ❷現在の状態、目指すゴール  •現在の状態 [リンク]  AIアカウントを準備中となります。  •目指すゴール 直近は、AIジャンルの高単価アフィで3ヶ月後に月100万マネタイズが目標です。  ❸自分なりの意見や仮説 まだ実績はないですが、これからちゃんと学んでおきたいと思いAIジャンルに決めました。  実績がないので、まずはAI初心者をターゲットに自ら学びながらAIのノウハウ、情報、知識を発信。  慣れてきたらAI副業にもチャレンジし、実績がでてきたら既存フォロワーも育てつつ、AI副業の領域にも展開していこうかと考えております。  ❹質問内容 プロフィールの内容、コンセプトの方向性に改善点などあればご教示頂きたいです！","sourceUrl":"","createdAt":"2026-01-01T00:00:00.000Z"},{"id":"topic-1779713999290-hlzhtq","title":"なまいきくんからのメッセージ｜稼ぐために絶対に変えるべき思考","category":"instructor","content":"## このメッセージで伝えること\nスクールで成果を出す人と出ない人の決定的な違いをお伝えします。\n\n---\n\n## 一番大事なのは「思考放棄しないこと」\n\n「何をポストすればいいですか？」\n「アイコン何がいいですか？」\n「ローンチはどうすればいいですか？」\n\nこれらは全部「思考放棄した質問」です。\n\n自分で稼ぐということは、一生「答えを自分で出す」業務が続きます。\n誰かに聞いて答えを出してもらっていると、独立しても何もできません。\n\n「行き詰まった → すぐ質問」は良い。\n「考えてもいない → すぐ質問」はNG。\n\n---\n\n## 成果を出す人の3つの習慣\n\n### ①行動量が圧倒的に多い\n悩んでいる時間より動いている時間の方が長い。\n「完璧な方法を探す」より「まず動いて改善する」の方が早い。\n\n### ②失敗を公開する\n失敗を隠す人は成長が遅い。\n失敗を公開する人は2つの得をする：\n- 共感してくれるフォロワーが増える\n- 自分の失敗を言語化することで再現しない\n\n### ③PDCAが速い\n試す → 振り返る → 改善する → また試す\nこのサイクルを週単位でやれている人は必ず伸びます。\n\n---\n\n## 長期的な視点を持つ\n\n最初の3ヶ月は成果が出なくて当然です。\n種を蒔き続けた人だけが、半年後・1年後に刈り取れます。\n\n焦りは禁物。でも「明日から始める」も禁物。\n今日この瞬間に動き出した人が、半年後に笑えます。\n\n---\n\n## チームなまいきとして\nスクールは「一人で戦う場所」じゃありません。\n成果報告・悩み共有・学び共有をどんどんやってください。\n仲間の進捗が自分のモチベーションになります。\n\n---\n\n【講師の実際の発言・事例】\n\n【結果を出す人と出せない人の決定的な違い】\n\n30DAYSマインド講座は見てますか？\n\nあちらはマインド講座と銘打ってますが、Xマネタイズの基礎も一通り学べるまさにはじめたての今の時期には持ってこいの神動画講義になってます。\n\nもうこれでもかってくらい僕の思考を存分に語り尽くしてるので、\n\n是非1度聞いて終わりじゃなくて家事の合間や、散歩中など暇さえあれば聞いてもらって、徹底的にマインドを刷り込ませてください。\n\nそして、今回はあちらのマインド教材に入れてなかったが、絶対に知っておくべき、結果が出る人の考え方を共有します。\n\n成功する人と、いつまでも足踏みしている人両者を分ける差は、才能でも知識量でもありません。\n\nたったひとつの思考法です。\n\nそれは「準備はほどほどに、まずは行動。そしてその後に修正」\n \n・結果が出ない人の共通点\n\n結果が出ない人は、例外なく「準備の段階」で止まります。\n\n「もっと知識をつけてから」「環境を整えてから……」\n\nそうやって完璧なスタートを夢見て、結局いつまでも走り出せない。\n\n完璧な準備なんて、そもそも存在しないのに、、\n\n・結果を出す人の思考\n\n一方で成果を出す人は違います。未完成でも構わない。とにかく走り出す。そこで得たリアルな経験こそが、最高の教材になると知っているから。\n\n行動はゴールを一発で射抜くためのものではたりません。まず撃つことで的\n\n─\n\n重要\n\n【高単価アフィに関する連絡】\n\n8月に入会した人が4ヶ月経つので、事前に伝えてたカリキュラム通り、プラン順に優先順位をつけた上で、\n\n高単価アフィの第1次案内を始めていきます！\n\n最初に１つだけ注意しておくと、希望者のみの案内になるので、全員が高単価アフィをする必要はありませんし、提携は完全に自由です。\n\nこれは繰り返し言ってる通り、マネタイズ手法云々というより、質の高いお客さんを多く集めてくる能力がマネタイズにおいて1番重要で、\n\nこれさえ出来ればマネタイズなんて全く難しくないです。\n\n高単価アフィでしかマネタイズ出来ないなんてことはありませんし、\n\n高単価アフィはあくまでマネタイズ手法の１つではあるのと、マネタイズの手数は多い方がいいので、他の手法に関しても講義では解説していきますが、\n\n高単価アフィを実施したい人は、提携を存分に活用してください！\n\nまた、高単価アフィの提携は希望者のみに、別途契約を結んで行うものになるので、(別途費用がかかることはありません)\n\n高単価アフィに関しては、スクールの1年間のサポート期間に関わらず、僕らがこの仕組みを継続できる限りは提携し続けることが可能です。\n\nですので、まだマネタイズ基準を満たしてないという人や、長期的な売上を最大化するためにもっとアカウントを伸ばしてから始めたいという人は、\n\nスクールの残り期間を考えて焦る必要はなく\n\n─\n\n重要  【高単価アフィに関する連絡】  8月に入会した人が4ヶ月経つので、事前に伝えてたカリキュラム通り、プラン順に優先順位をつけた上で、  高単価アフィの第1次案内を始めていきます！  最初に１つだけ注意しておくと、希望者のみの案内になるので、全員が高単価アフィをする必要はありませんし、提携は完全に自由です。  これは繰り返し言ってる通り、マネタイズ手法云々というより、質の高いお客さんを多く集めてくる能力がマネタイズにおいて1番重要で、  これさえ出来ればマネタイズなんて全く難しくないです。  高単価アフィでしかマネタイズ出来ないなんてことはありませんし、  高単価アフィはあくまでマネタイズ手法の１つではあるのと、マネタイズの手数は多い方がいいので、他の手法に関しても講義では解説していきますが、  高単価アフィを実施したい人は、提携を存分に活用してください！  また、高単価アフィの提携は希望者のみに、別途契約を結んで行うものになるので、(別途費用がかかることはありません)  高単価アフィに関しては、スクールの1年間のサポート期間に関わらず、僕らがこの仕組みを継続できる限りは提携し続けることが可能です。  ですので、まだマネタイズ基準を満たしてないという人や、長期的な売上を最大化するためにもっとアカウントを伸ばしてから始めたいという人は、  スクールの残り期間を考えて焦る必要はなく\n\n─\n\n【ガチ0運用企画開始！！】\n\n突然ですが、実績0スタートでも、Xは伸ばせるし、マネタイズは出来るんだぞってことを身をもって証明すべく、\n\nそして、実績がなく悩んでるスクール生の成果を底上げすべく、\n\n講師ゆうすけが実績完全ゼロのジャンルで、完全リアルタイム実況を開始することにしました！\n\nスクールのサポートや他の業務もあるので、正直あまり時間は取れず片手間の運用にはなってしまうのですが、\n\nそのぶん本業やりながら発信していく人の参考にはなるかなと！\n\n1日1〜2時間くらいは頑張って時間作りつつ運用していくつもりです！\n\nちなみに、投資経験はマジでゼロです！\n\n積立NISAもちゃんと始めたのは去年からっていう感じのレベルですw\n\nなので実際にマネタイズをしていくのはかなり先になるかなと！\n\n長期的な売り上げを最大化するため、最低でも半年〜1年くらいは普通にプレイヤーとして運用しながら伸ばしていく予定です！\n\n実況に関しては、\n\n＃【講師実況】0からアカ育成\n\nというチャンネルを新しくdiscord内に設置しています！\n\nこちらのチャンネルで、運用の際考えてることやポストの意図など、\n\n思考の部分も共有しつつ実況していきますね！\n\nあと運用を見ていて気になったことや疑問などがあれば、なんでも聞いてくださいね！\n\n完全ゼロのアカウントからリアルタイムで伸ばしていく裏側見れる機会はそうそう\n\n─\n\n現在ClaudeCodeなどが話題ですが、これからなまいきスクールでもガンガンAIを取り入れて、誰も追随できない最強のX運用集団を作り上げていきます。\n\nそこで、がっつりAIにコミットしてゴリゴリ開発していけるメンバーを募集します。\n\n求める人材：\n・業務にコミットできる（一日最低５時間～）\n・最低限のエンジニアリング知識\n・AIを駆使してスピード重視の開発ができる\n・新しいことをガンガン学び、最新技術を取り入れていける\n・自ら思考して提案が出来る\n\n業務内容：\nX運用関係の各種AIツールやシステム開発、データ収集・分析、業務効率化など\n\nちなみに、単なる外注や作業者ではなく、スクール運営側としての人材を募集します。\n\n現状でもなまいきスクール経済圏の売上は2桁億超え、今後は100億を超えてくるようなデカいビジネスにしていきます。\n\nそんな組織の中で、運営メンバーと密に関わりながらビジネスしていくことになるので、圧倒的な成長は約束されています。\n\n報酬は応相談かつ成果に応じて上げていくので、我こそはという方は個別のグループLINEで以下情報添えてご連絡お願いします！\n\n【AI開発チーム応募】\n・１日の業務可能時間：\n・エンジニアリング経験：\n・AI開発スキル：\n・意気込み：","sourceUrl":"","createdAt":"2026-01-01T00:00:00.000Z"},{"id":"topic-1779713999309-yyaiym","title":"Yusuke講師実況レポート｜ゼロから実際にアカウントを育てた記録","category":"instructor","content":"## この教材について\n講師Yusukeが「完全ゼロから実際にXアカウントを育てる」実況記録です。\n「実績なしでもXは伸ばせる」を身をもって証明するために始まりました。\n\n---\n\n## スタート条件\n- 投資経験：ゼロ（積立NISAを去年から始めたレベル）\n- 運用時間：1日1〜2時間\n- 目標：最低半年〜1年かけてフォロワーを育てる\n\n「すごい実績がない状態でも、正しい方法でやれば伸びる」を実証する。\n\n---\n\n## バズポストの実例と思考プロセス\n\n**投資本を大量購入して積み上げた写真を投稿**\n→ 1ポストでフォロワー350人以上増加\n\n**ポストの意図を公開します：**\n\n目を引く理由：\n「投資本を山積みにする」他の誰もやっていない視覚インパクト\n\n反応が生まれる理由：\n- 「私もこの本持ってる」→ 親近感コメント\n- 「本ばかり読んでも意味ない」→ 意見コメント\n- 「気合入ってますね」→ 応援コメント\n\n→ 賛否両論を意図的に作ることで反応率が上がる\n\n---\n\n## アカウント設計1〜4日目の思考\n\n1日目：ジャンル決定（投資初心者目線）\n2日目：プロフィール整備・固定ポスト設定\n3日目：同ジャンルアカウントへの返信20件\n4日目：初投稿・反応分析\n\nポイント：最初から完璧を求めない。まず「動く」こと。\n\n---\n\n## 学べること\n1. 実績ゼロスタートの実際の戦略\n2. バズポストを生み出す思考プロセス\n3. 副業と本業を両立した時間管理の方法\n\n---\n\n【講師の実際の発言・事例】\n\n昨日出したポストがバズリ始めてるので、取り急ぎ共有します↓\n[リンク]\n\nちなみにこの１ポストだけでフォロワー350人以上増えてますね！\n（まだ伸びてるのでもう少し増えるかと）\n\n【ポストの意図】\n目を引く＆反応したくなるようにしてバズらせ狙い。\n他の要素としては、投資の教育、知識を学ぶことの教育、基準値の高さを見せつける。\n\n★目を引く\n→投資本めっちゃ買いまくって積んでインパクト出す。こういうの他に誰もやってなかった。\n他の人が先にやってたら微妙。\n\n★反応したくなる\n→反応ポイントは大体こんな感じ：\n\n・これ自分も買った、これいい本だよ\n\n・本ばっか読んでも意味ないよ、実践のほうが大事\n\n・金使いすぎ、資金管理したほうがいい\n\n・気合入ってますね、凄いですね\n\n・独学でやってるから本読んだこと無いわ\n\n・後ろにうつってるハゲ薬\n\n【Yusukeメモ】\nやっぱ投資界隈は教えたがりのオッサンみたいな人が多い。ポストで読者に意見聞いたりするの良さそう。思ったより本の選定は良いっぽいからちゃんと勉強しよ。にしても買いすぎた、読む時間無え\n\n─\n\n夜分遅くにメンション失礼します\n\n実況運用しているアカウントの\n\nアカ設計＆運用1～4日目の思考\n\nを記事にしましたので共有いたします！\n\n[リンク]\n\n─\n\nYusuke＠講師\n がメッセージをチャンネルにピン留めしました。ピン留めされたメッセージを全て表示。\n — \n2026/01/30 3:04\n2026年1月30日金曜日 3:04\n\n─\n\nこのチャンネルは講師Yusukeが、完全ゼロから実際にアカウントを運用・解説していくチャンネルになります！\n\n実績0スタートでも、Xは伸ばせるし、マネタイズは出来るんだぞってことを身をもって証明すべく、\n\nそして、実績がなく悩んでる全てのスクール生の成果を底上げすべく、\n\nリアルタイムでガンガン裏の思考や情報をシェアしていきます\n\nスクールのサポートや他の業務もあるので、正直あまり時間は取れず片手間の運用にはなってしまうのですが、\n\nそのぶん本業やりながら発信していく人の参考にはなるかなと！\n\n1日1〜2時間くらいは頑張って時間作りつつ運用していくつもりです！\n\nちなみに、投資経験はマジでゼロです！\n\n積立NISAもちゃんと始めたのは去年からっていう感じのレベルですw\n\nなので実際にマネタイズをしていくのはかなり先になるかなと！\n\n長期的な売り上げを最大化するため、最低でも半年〜1年くらいは普通にプレイヤーとして運用しながら伸ばしていく予定です！\n\n運用を見ていて気になったことや疑問などがあれば、なんでも聞いてくださいね！\n\n完全ゼロのアカウントからリアルタイムで伸ばしていく裏側見れる機会はそうそうないので、是非勉強しまくってください！\n\n─\n\n@Yusuke＠講師 さん 初歩の質問ですが失礼します！ アイコン・名前などはどういう考えで決めたかなどをお聞きしたいです！ (編集済)\n2026年2月26日木曜日 4:43","sourceUrl":"","createdAt":"2026-01-01T00:00:00.000Z"},{"id":"topic-1779713999318-kfcxfi","title":"なまいきスクールの学び方｜最短で成果を出すための取り組み方","category":"instructor","content":"## この教材で学ぶこと\nスクールをどう活用すれば最短で結果が出るか、学び方を解説します。\n\n---\n\n## スクールの目的を理解する\n\nこのスクールの目的：**Xで集客してマネタイズできる個人になること**\n\n手段ではなく目的に集中してください。\n「毎日投稿する」「教材を全部見る」は手段です。\n「Xで稼げるようになる」が目的です。\n\n---\n\n## 質問チャンネルの正しい使い方\n\n**良い質問の形：**\n「○○について講義で学びました。自分では△△と理解しましたが、□□の部分で迷っています。どのように考えればいいでしょうか？」\n\n**NGの質問：**\n「ポスト何を書けばいいですか？」（考えてから来てください）\n\n質問の質を高めることで：\n- 自分の理解が深まる\n- 講師からより良いフィードバックをもらえる\n\n---\n\n## 成果報告チャンネルを積極的に使う\n\n「フォロワー2人増えた」「初めて10いいねがついた」\nどんな小さな成果でも報告してください。\n\n報告するメリット：\n1. 仲間から応援されてモチベが上がる\n2. 「また報告するために頑張ろう」という好循環が生まれる\n3. 自分の成長記録になる\n\n---\n\n## スクールのルール\n\n①自分で考えてから質問する（思考回路を書く）\n②ネガティブな発言・他責発言はしない\n③仲間の成果を一緒に喜ぶ\n④スクール生同士で独自コミュニティを作らない（規約）\n\n---\n\n## まとめ：スクール活用3か条\n1. **講義を見たらすぐに実践する**（1日以内）\n2. **迷ったらすぐ質問する**（でも思考してから）\n3. **小さな成果でも報告する**（仲間と一緒に成長する）\n\n---\n\n【講師の実際の発言・事例】\n\n全体のルールはまたまとめますが、取り急ぎ先に言っておくと、なまいきスクール生が、他のなまいきスクール生メンバーにセールスかける、商品を売り込むのは一切禁止です。\n\nお互いがお互いに売り込むみたいなことになれば収集がつかなくなるのでこちらだけ把握しておいてください。\n\nまた、怪しい勧誘行為や、営業をかけられたなどあればすぐに運営(LINEグル)までご連絡ください。即座に対応します。\n\n─\n\n以前にも連絡してる通りですが、健全なコミュニティを維持するため、\n\nスクール生同士の売り込み行為、外部誘導は一切禁止です！\n\n高単価アフィに関してもスクール生を流したとて無効になりますのでこちら厳重注意でお願いします！\n\nまた、セールス行為は勿論、万が一怪しい行為を行ってる人を見かけたら直ちに運営まで報告お願いします\n\n─\n\nないとは思いますが、明らかな嘘を付いたり、売上画面の捏造したりで、\n\n反応取るためなら何でもやっていい精神で発信すると、長期的に見た時に1番大事なアカウントの信頼が削れますし、\n\n自分1人だけでなく、周りのスクール生や提携先にも多大な迷惑をかけるので、\n\n興味付けを最大化させたい気持ちは分かりますが、節度を保って発信に当たってくださいね！\n\nまた、この辺のラインは自分じゃ中々判断出来ないかもなので、危うそうであれば運営からも注意していくので、その際は素直に改善するようお願いします！\n\n全員が自信を持って、このコミュニティは誠実にビジネスに取り組んでると、心の底から言えるような環境を作り上げていきましょう\n\n─\n\nお忙しい中、ご回答いただきありがとうございます。  発信コンセプトを再度作り直しました。添削いただいてもよろしいでしょうか？まだ伝わっていない点、抽象的でわかりにくい点があればご指摘いただけると幸いです。   Who：誰に向けて発信するか？  【読者の現状】 投資・資産運用・お金の増やし方・脱サラ/独立に興味がある30代〜40代の会社員で、実績やレベル感は投資未経験〜実践できていない段階。残業が多く時間がなく、SNSやネットの情報に振り回されて何から始めればいいかわからない状態。  【悩み・課題】  投資は難しそうで怖い 何から始めればいいかわからない 損をするのが怖くて行動できない 独学で学んでも情報が多すぎて迷う SNSで言っていることがバラバラで混乱する 再現性のあるやり方がわからない 仕事が忙しくて勉強や検証の時間が取れない 投資で脱サラは一部の人だけだと思っている スクールや情報商材が怪しくて信用できない 将来のお金に不安があるのに行動できていない 給料だけでは厳しいと感じている   What：どんなゴールに連れて行くか？  6〜12ヶ月で、忙しい会社員でも1日10分で再現できる投資スキルを身につけ、月30万円を安定して狙えるようになる  【理想の状態・ベネフィット】  給料以外に毎月30万円の収入源がある安心感 会社に依存しなくていい精神的余裕 将来の老後資金の不安が大\n\n─\n\nご回答ありがとうございます。再度発信コンセプトをブラッシュアップしました。 確認いただけますでしょうか？  発信コンセプト    思想・信念  ■思想の核  会社の給料だけじゃ不安。 でも仕事のあとに、勉強みたいに長時間チャートを見るトレードは続かない。 だから自分は、1日10分でできて月30万を目指せるトレードをしている。  ⸻  ■信念  会社員が仕事しながら資産を増やすなら、長時間チャートを見るトレードは続かない\n,\n仕事で忙しいのに考えることが多いトレードはしんどい\n,\nSNSや人の意見を見すぎると、逆に迷う\n,\nチャートを見すぎると、感情的なトレードをして負けやすい\n,\nだから、見る時間は短い方がいい\n,\n考えることも少ない方がいい\n,\n仕事をしながら続けるなら、1日10分ほどでできる方がいい\n,\nAIは、調べる手間や振り返る手間を減らすために使う\n,\n ⸻  ■理想  給料以外に毎月の収入源を持てる人を増やす\n,\n将来のお金が不安な会社員に、現実的な選択肢を増やす\n,\n仕事を続けながらでも、お金を増やせる人を増やす\n,\n家族や生活を崩さずに、収入を増やせる人を増やす\n,\nいつか辞めたいと思っている会社員が、辞められる側に近づける状態を作る\n,\n ⸻  ■ストーリー（共感の核）  会社員で消耗 ↓ 先出しでも独学でも負ける ↓ 情報を見すぎて迷う ↓ 仕事のあとに長時間チ","sourceUrl":"","createdAt":"2026-01-01T00:00:00.000Z"},{"id":"topic-1779713999329-vqwzhx","title":"AI×X発信の実践｜AIツールを使ったポスト作成の正しい方法","category":"discord","content":"## この教材で学ぶこと\nAIを使えばポスト作成が楽になります。\nただし「AIが生成したまま使う」のは間違いです。正しい使い方を学びます。\n\n---\n\n## AIで効率化できること\n\n| 作業 | AIの使い方 |\n|-----|---------|\n| ネタ出し | 「○○ジャンルのポストテーマを20個出して」 |\n| フック作成 | 「このテーマで5種類のフックを作って」 |\n| 文章の改善 | 「このポストをXらしく書き直して」 |\n| プロフ改善 | 「このプロフを見て改善点を教えて」 |\n| 構成作成 | 「このテーマでPASONA型のポストを書いて」 |\n\n---\n\n## AIをうまく使うコツ：ペルソナを設定する\n\n```\n「あなたは副業初心者向けにAI×X発信をしているアカウントです。\n借金1500万からAIで逆転を目指すキャラクターで、\n失敗も全部公開するリアルな発信スタイルです。\n以下のテーマで140字のXポストを3つ作ってください。\nテーマ：今日AIツールで初めて記事を書いた体験」\n```\n\nペルソナが具体的なほど、自分らしい文章が生成されます。\n\n---\n\n## AI生成をそのまま使ってはいけない理由\n\nAIの文章は「それっぽいがリアルでない」ことが多い。\n読者はAI臭い文章を敏感に察知します。\n\n必ずやること：\n1. AIに生成させる\n2. 自分の実体験・感情を1〜2文加える\n3. 自分の言葉に置き換える（語尾・表現）\n4. 読み直して「自分らしいか」確認する\n\n---\n\n## 実践の流れ\n1. このツール（なまいきAI）でテーマを選ぶ\n2. AIにポストのたたき台を生成させる\n3. 自分の言葉でカスタマイズする\n4. 実際に投稿する\n5. 反応を見て改善する\n\n---\n\n## 大事なこと\nAIはあくまで「道具」。\nあなたのリアルな体験・感情・個性こそが最大の差別化です。\n\n---\n\n【講師の実際の発言・事例】\n\n【！緊急告知！】\n\n突然ですが、週明け 10/6 (月) の21:00～より\n\nなまいきスクール内での【AI活用ワークショップ】を開催します✨️\n\nなんと、講師としてレクチャーしてくれるのは...\n\n現在AIジャンルでアカウントを爆伸びさせている、なおきさんです！\n[リンク]\n\nなおきさんは豊富なAI知識があるのはもちろんのこと、\n\nスクール受講開始１ヶ月で＋2,000フォロワー、現在フォロワー数5,000人、\n\nポストでも数万インプ越えのバズを連発しており、\n\nXのAI界隈ではトップレベルに勢いがあるプレイヤーです\n\n今回は、そんななおきさんが、\n\nX運用に役立つAI活用法をスクール内でシェアしてくれます↓\n\n【ワークショップ内容（予定）】\n\n・なおきさん流:ChatGPTの活用法シェア\n・X運用で使える！便利なAIツール紹介\n・実際の画面を見ながら学ぶ、便利なAIの使い方\n・実演！簡単にできるAIアプリ作成\n\nこの機会に、AI活用を学んでX運用を加速させちゃいましょう！\n\nご都合のつく方はぜひご参加ください (編集済)\n2025年10月3日金曜日 1:47\n\n─\n\n現在ClaudeCodeなどが話題ですが、これからなまいきスクールでもガンガンAIを取り入れて、誰も追随できない最強のX運用集団を作り上げていきます。\n\nそこで、がっつりAIにコミットしてゴリゴリ開発していけるメンバーを募集します。\n\n求める人材：\n・業務にコミットできる（一日最低５時間～）\n・最低限のエンジニアリング知識\n・AIを駆使してスピード重視の開発ができる\n・新しいことをガンガン学び、最新技術を取り入れていける\n・自ら思考して提案が出来る\n\n業務内容：\nX運用関係の各種AIツールやシステム開発、データ収集・分析、業務効率化など\n\nちなみに、単なる外注や作業者ではなく、スクール運営側としての人材を募集します。\n\n現状でもなまいきスクール経済圏の売上は2桁億超え、今後は100億を超えてくるようなデカいビジネスにしていきます。\n\nそんな組織の中で、運営メンバーと密に関わりながらビジネスしていくことになるので、圧倒的な成長は約束されています。\n\n報酬は応相談かつ成果に応じて上げていくので、我こそはという方は個別のグループLINEで以下情報添えてご連絡お願いします！\n\n【AI開発チーム応募】\n・１日の業務可能時間：\n・エンジニアリング経験：\n・AI開発スキル：\n・意気込み：\n\n─\n\n初回講義お疲れ様でした！\n\n取り急ぎ復習や今週のタスクこなしやすいように講義スライドと、GPTs含む資料の配布だけ行いますのでご確認ください！\n\n【講義スライド】\n\n２−１売れるアカウントの初期設計〜はじめに〜\n[リンク]\n\n２−２Xマネタイズの全体像\n[リンク]\n\n２−３発信テーマの決め方\n[リンク]\n\n２−４発信コンセプトを決める\n[リンク]\n\n２−５プロフィール設計を学ぶ\n[リンク]\n\n【講義関連資料】\n\n高単価案件ジャンル一覧\n[リンク]\n\n発信コンセプト設計AI\n[リンク]\n\n発信コンセプト設計AIの使い方\n[リンク]\n\nX発信アカウント一覧【ジャンル別】\n[リンク]\n\nプロフィール作成 GPTs\n[リンク]\n\nXプロフィール設定マニュアル\n[リンク]\n\n【今週のタスク】\n[リンク] (編集済)\n2025年8月24日日曜日 2:44\n\n─\n\n第2回講義お疲れ様でした！\n\n取り急ぎ復習や今週のタスクこなしやすいように講義スライドと、GPTs含む資料の配布だけ行いますのでご確認ください！\n\n【講義スライド】\n\n3-1　はじめに「ポスト作成【入門】」\n[リンク]\n\n3-2　何のためにポストするのか？\n[リンク]\n\n3-3　5分でできる！ポスト作成3ステップ\n[リンク]\n\n3-4　伸びるポストの作り方\n[リンク]\n\n3-5　ポスト作成会について\n[リンク]\n\n【講義関連資料】\n\n厳選ポストネタ集\n[リンク]\n\nアルゴ攻略note\n[リンク]\n\nポスト作成GPTs\n[リンク]\n\nChatGPT使い方マニュアル\n[リンク]\n\n─\n\n初回講義の動画アーカイブとスライド、資料を改めて配布します！\n\n確認してタスクを進めていってください！\n\n【講義アーカイブ】\n[リンク]\n\n【講義スライド】\n\n２−１売れるアカウントの初期設計〜はじめに〜\n[リンク]\n\n２−２Xマネタイズの全体像\n[リンク]\n\n２−３発信テーマの決め方\n[リンク]\n\n２−４発信コンセプトを決める\n[リンク]\n\n２−５プロフィール設計を学ぶ\n[リンク]\n\n【講義関連資料】\n\n高単価案件ジャンル一覧\n[リンク]\n\n発信コンセプト設計AI\n[リンク]\n\n発信コンセプト設計AIの使い方\n[リンク]\n\nX発信アカウント一覧【ジャンル別】\n[リンク]\n\nプロフィール作成 GPTs\n[リンク]\n\nXプロフィール設定マニュアル\n[リンク]\n\n【今週のタスク】\n[リンク]","sourceUrl":"","createdAt":"2026-01-01T00:00:00.000Z"},{"id":"topic-1779713999338-nkfavl","title":"成果を出す人の共通点｜スクール内の成功事例から学ぶ","category":"discord","content":"## この教材で学ぶこと\nスクール内で実際に成果を出している人に共通するパターンを解説します。\n\n---\n\n## 短期（1〜2ヶ月）で変化が出た人の行動パターン\n\n### パターン①「毎日投稿を欠かさない」\n例外なく毎日3投稿以上している。\n質が低くても続けることで「場数」が増え、PDCAが回る。\n\n### パターン②「講師の添削を即実行する」\nアドバイスをもらったその日にポストを修正して再投稿。\n「分かった」で終わらせず、必ず実行に移している。\n\n### パターン③「失敗を公開し続ける」\n「今日全然伸びなかった」「計画通りにできなかった」を隠さずに発信。\nこれが共感を生み、ファンを作る。\n\n### パターン④「数字を毎日記録している」\nフォロワー数・インプレッション・いいね数を毎日メモ。\n変化を数字で把握することで改善ポイントが分かる。\n\n---\n\n## 成果報告チャンネルの活用が上手な人の特徴\n\n- 「いいねが初めて10を超えた！」など小さな成果も報告する\n- 「なぜ伸びたか」の分析も一緒に書く\n- 他の人の報告に積極的にリアクションする\n\n→ コミュニティ全体のモチベーションが上がり、自分も上がるという好循環\n\n---\n\n## 成果が出ていない人のパターン\n\n❌「完璧なポストを作ろうとして投稿できない」\n→ 対策：70点でもいいので毎日投稿する\n\n❌「一人で悩んで止まっている」\n→ 対策：質問チャンネルを使う・成果報告する\n\n❌「数字が伸びないとすぐ諦める」\n→ 対策：1週間・1ヶ月単位で見る。最初の3ヶ月は誰でも伸びない\n\n---\n\n## まとめ\n成果を出す公式：\n**行動量 × PDCAの速さ × コミュニティ活用 = 成長スピード**\n\n---\n\n【講師の実際の発言・事例】\n\n【高単価アフィ成果報告】 皆さんお世話になっております！  2/27~3/1のセミナーローンチの成果報告をさせていただきます！  現時点での成果は、  成約金額：4,532万円 決済金額：2,854万円  となってます！ （今はほぼ落ち着いているのであとは決済金額が成約金額に近づいていくのを祈るだけです…！）  僕は、X運用自体、スクールに入る1ヶ月前から始めた初心者で、これまで副業でnoteで稼いだことがあるとはいえ、月100万のようなかっこいい実績はなく、平均すると月20~40万くらいだったので、 それと比較すると、今回の高単価アフィの月間売上はnoteの【約１００倍】で、 あらためて高単価アフィがバグってることを認識しました…！  すでにねるるさん、カザマさん、いちごさんが成果報告されてますが、高単価アフィは嘘偽りなくバグスキームだと思います！  今回のローンチは、 ⁠成果報告⁠ でも詳細な反省点に触れましたが、直前の1週間でシャドウバンになったり、そもそも興味付けが弱く、ローンチの呼吸が浅すぎたせいで、後半にキャンセルや未着席が続出してしまい、セールスマンの方々にお手間をとらせてしまうなど反省点がとても多いローンチでした。  そんな中でもローンチの最後の最後までバックアップしてくださったなまいきさん、スタッフの方々、圧倒的に高い成約率で決めてくださっているセールスマンの方々\n\n─\n\nちょっとでも伸びた！とかでいいので、ガンガン報告していってください！\n\nその報告が皆のモチベになるし、自分から成果報告することで、また成果報告するために頑張ろう！となって、さらに成果出るめちゃ好循環に入るので！\n\n─\n\n【高単価アフィ成果報告】  月間売上1億突破！  お疲れ様です！  プレミアム会員の先行テスト部隊ということで、  実施させていただいてた高単価アフィですが、8月に実施して売上がほぼ確定したので、共有します！  ・8月26,27日にセミナー ・9月22,23日に追加セミナー  って感じで合計4回セミナーやって、販売したのですが、数値は以下です！ （売上以外は、僕の数え間違いありそうなので、全部「約」です。笑  案件:なまいきスクールアフィ(Xマネタイズ) セミナー着席：1,200人ぐらい(正確に応募フォームとかなかったのでざっくりです) 個別面談数：約260件 成約数：約107件 成約率：約41% 成約金額：¥131,599,400 決済総額：¥112,276,815  正直、集客は雑でしたが、セミナーのコンセプトよかったのと、商品力が強いので、割と強めに押せたのがよかったです！！  結局、セミナー売りは、コンセプトゲーだなって感じましたね  あとは、 ・セールスマンの成約率が高い(40%超ええぐいw) ・商品単価が高い ってのも売上が伸びた要因です！  自社でスクール売ってますが、自社より、2~10倍高いので、売上もビビるぐらい伸びたし、自社売るより純利益も多かったですwww  ガチでこの環境用意してくれたことに感謝です （ほんまにコスパよく売上伸ばす、ってことだけ考えたら、高単\n\n─\n\n本日の講義であった成果報告をさせていただきます！  ＜概要＞ 30後半のおっさんがAIで得た収入最低75円から4カ月で550万円まで売上増加 それまでの大まかな流れや思考が参考になればと思います。  ＜大まかな流れ＞ ・スクール加入前は2800フォロワー、AI系で発信、noteやLINEスタンプで最低75円程度の収益 ・スクール加入後からフォロワー増加、5ドル程度の収入がちらほら ・激辛くんとの関係構築⇒激辛出版の名の下でBrain発売⇒売上550万  ＜これまでの成果＞ ・8月にスクール加入後からインプ爆上がり⇒4カ月で約4000フォロワー増 ・最低75円程度の収益から4カ月で550万達成 ・トレンド入り2回、最高64万インプ、1日最大300フォロワー増 ・LINEリストが1700名超え  ＜やったこと＞ ・スクール入ってから言われたリプ・いいね回りの初期運用から興味づけ発信 ・収益額を大きく見せて稼いでる感を演出（5ドルって何かすごそうに見えますよねｗ） ・激辛くんとの関係を作るために突然企画された飲み会に飛び入り参加 ・激辛くんが呼んだ飲み会全てに参加して偶然Brainの共同制作機会を獲得 ・商材を「サムネ生成」というニッチなところにしたので、商品コンセプトを「脱AI画像」として商品化 ・理想の未来の見せ方が難しかったので、プロ級のサムネをAIで作ることで誰でも「伝え方」を爆\n\n─\n\n昨日のタスク早速取り掛かってますか？\n\nキックオフでも言った通り、結局1番大事なのは実践なので、\n\nこのなまいきスクールでは限りなく実践しやすくなるよう、マニュアルの提供や、GPTsの配布を行っていきます。\n\n実際、昨日のコンセプト設計GPTsを使えば、以下のような今後の発信の指針が即作れます。\n\n1回ここでコンセプト固めちゃえば、今後の発信で迷うことも限りなく少なくなるので必ず本日中に取り掛かってくださいね！\n\n発信コンセプト設計まとめ(実際にスクール生が15分でつく
