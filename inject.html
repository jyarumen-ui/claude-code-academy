al","content":"アカウント添削会 受講済みにする 受講済み","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/fKzRxGr5UoR1/lesson/OG8oWj6pvk1u","createdAt":"2026-05-15"},{"id":"scr-1779455314509-pwzmln","title":"質問会 | なまいきスクール会員サイト","category":"material","content":"メインレッスン 質問回答 受講する 成果報告 受講する","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/3VsISpdLJfkL","createdAt":"2026-05-15"},{"id":"scr-1779455314509-tzgbpg","title":"4-3 アカウントパワーを上げる鉄板ルーティン | なまいきスクール会員サイト","category":"material","content":"4-3 アカウントパワーを上げる鉄板ルーティン それでは 着実にアカウントパワーを育てるための 鉄板ルーティンについて 解説していきます！ 初期垢は「待ち」では 伸びない件について まず前提として、 初期のアカウントは、 ただポストしているだけじゃ伸びません 。 （=待ちの運用） 初期はポスト数を増やす のは もちろんのこと、 誰も見てくれないんだったら、 こっちから積極的にアクションを仕掛けて 相手に認知させていく必要 があります。 例えば、 攻めたい界隈の発信者に 自発フォローを飛ばして、 積極的にリプで認知させたりなど。 ここでの目的は アルゴリズムに アクティブだと認識させ、 アカウントパワーを育てること そのために 最低限これだけは毎日やっとけ というルーティンをお伝えしていきます🔥 鉄板ルーティンの概要 「自発アクション」「返しアクション」 の２種類あります！ 自発：こちらから攻める行動 返し：相手の反応に確実にリアクションする 具体的にいうと、 ポストは継続しながら 自発でフォローやいいね、リプをして きっちりと認知を広げつつ 相手からのリアクションには 確実に反応して「返してくれる人」 という印象を作る こと。 👆これ重要！ これらを日々のルーティンとして 確実に抜け漏れなく 毎日やっていくのが大事です！ 自発アクション ✅ ポスト 1日5~10回程度 ポスト作成GPTs と ネタ一覧 を使って 1日5~10ポスト をしていきます！ 初期は全然見られないので 少し多すぎるくらいポストしてOK！ ✅ 自発フォロー 頻度は8人×3セット フォローする ↓↓↓ フォロー通知がいく ↓↓↓ 興味を持った人が プロフィールやポストを見にくる ↓↓↓ 一定確率でフォローされる という 地道な営業活動 です。 なまいきくんの場合は、 アカウント買収するのと 運用がうまいので あまりやりませんが、 センスがなくても一定伸ばせる ので フォロワー300~500人超えるまで は やっていきましょう。 ３セットと書いてあるのは、 一度にやりすぎると制限がかかる 可能性があるためです！ 回避策として、 朝・昼・晩 に３回に分けて アクションしていきましょう！ ✅ 自発いいね 8回×3セット フォローと同じく、 いいねで 相手に直接通知を送ります！ 狙うのはもちろん、 属性が近くてアクティブなアカウント 。 属性認知も強まる ので アルゴ的に有効ですね！ ✅ 自発リプ 1日3回×3セット 同じ界隈の発信者のポスト に リプを自発で送っていきます！ リプしておくと、 その人のフォロワーにも 見られやすくなる ので 「界隈の人に顔を覚えてもらう」 という意味でも有効です👌 ✅ 引用リポスト 1日3回ペース 他人のポストを引用すると、 その人にリポストしてもらえる 可能性が高いのでプラス です！ 直近の1時間で 30件以上いいねが来ている 伸びてるアカウントを狙っていきます🔥 ⚠️注意事項： 短時間でまとめてやらないように 注意してください！ スパムだと思われて、 制限がかかる可能性があります！ 各セット1時間は間を空けて アクションするようにしてください！ 返しアクション 毎日昼12時と夜21時など 通知チェックと返しアクションを 習慣にしていきましょう！ ✅引用してくれた人 →いいね&リプ&リポスト ✅リプくれた人 →返信&いいね ✅フォローしてくれた人 →プロフィール確認 →発信テーマと近ければ 多くね？ 的なポスト 作業してる様子 ちゃんとやってる感 学んでる感 下手な人多くね？という感情ポスト 界隈の他の人への愚痴 このポストについても、 構成要素をパクって使える要素にしたので 利用してみてください👇 ■他の発信者への疑問、反論 ・ これってどうなの？？ 的な疑問提示 ・ 微妙な人多すぎでしょ という愚痴 ・ 正直、こうじゃね？？ という本音 ・ 無駄なことしすぎじゃね？ という本音 【具体例】 モノ売るにしてもフォロワー増やすにも、人の心を動かす必要があるから、当たり障りないやつが1番論外。アンチ出来ないかな？とかビビってたら終わり。アンチがいないやつにファンはいない。 ■他のプレイヤーへの疑問、思い ・こうしたらいいのに… ・これやっちゃっててもったいない 【具体例】 めちゃポテンシャルあるアカウントを運用が鬼下手いがために、犬死にさせとるやつが多すぎてなんかモヤモヤしてくるからもはや俺にアカウント譲って欲しいわ。 ■学んでる様子とアウトプット ・これ読んでるけど結構いいこと書いてあるわ ・これ買ってみたけど、薄くて読むのやめた ・これ結構アツいか","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/ihib0t9yKtcd/lesson/Irno2dxD8t21","createdAt":"2026-05-15"},{"id":"scr-1779455314509-ldwpul","title":"5-1 初期垢を爆速で伸ばす立ち回り | なまいきスクール会員サイト","category":"material","content":"5-1 初期垢を爆速で伸ばす立ち回り 前回はXの 基本ルーティンということで ・アカウントパワーを伸ばすには？ ・具体的な日々のルーティン ・他人を使って伸ばす方法 みたいな部分を 実戦ベースで語ってきました。 アカウントパワーを高めるには ①コツコツと日々のルーティンを継続する ②立ち回りで注目を集める ③他人の力を使って伸ばす という３つの方法がありますよ。 みたいな話をしましたが、 今回はその中の②。 初速を伸ばす立ち回りで 短期間で注目を集める について、 具体的な運用テクニック を 解説していきます！ Lv.5の内容 なぜ初期垢は伸びないのか？ 興味付けポストとは何か？ 興味付けポストの作り方 フェーズ別の興味付けの違い【超重要】 今回は 重要な講義 です！ X運用において 最も重要な「興味付け」の技術 を、 ゼロからマスターしてもらいます。 ちょっとハイレベルですが、 何度も復習してぜひ習得してください🔥 なぜ初期垢は伸びないのか？ まず前提として、 「Xの初期アカウント」 や、 「長期間放置したアカウント」 は、 何をポストしても反応が取れません。 ※これは買収したアカウントでも同じ 原因は以下の2点。 見てくれる人がいない アクティブなフォロワーがいないため、 ポストが誰にも見られない。 誰もあなたに興味がない アカウントが誰からも 注目されていないため、 良いポストをしても反応されません。 この状態では、 そもそも反応が取れないから インプレッションも広がらないし この状況で 「商品が欲しくなる教育ポスト」 「価値提供のノウハウポスト」 をしてもガチでほぼ意味ないと思ってOKです！ 長文ポストとかも無意味 です。 すべての土台となる「興味付け」 そこで重要になるのが 「興味付け」 です。 いきなり 何かを教育したり ノウハウを伝えようとする んじゃなくて 「なんかおもろいことやってんな」 「こいつなんかすごそうやな」 「自分が知らん情報もってそうやな」 みたいに思わせて興味を持たせる。 この人は、 自分の知らない情報を持っている人だ という ブランディングを確立 して 「話を聞く体勢」 を 読者に作らせることが X運用のはじめの一歩です。 初期垢は誰も見てない、 興味ないからその状態で 教育やノウハウの投稿は無意味。 まずは興味を持たせて 「すげぇ情報持ってそうな人」 ブランディングを確立しましょう！ イメージですが… Lv.4のアカウントパワー解説 でも 似たような表現を使ったのですが、 読者の興味度合い についても ゲージが存在する とイメージしてください。 【興味ゲージが低い状態】 読者はあなたに興味がないため、 何をポストしても反応されない。 【興味ゲージが高い状態】 読者はあなたに興味があるため、 ポストに反応される。 なまいきくんのポストの いいねやリプ、インプが多い のは 「１つ１つのポストが良い」 というのもあるかもですが、 その前の前提として しっかりと興味付けしてるので なまいきくんに ”興味関心が高い” から 何をポストしてもそれなりに伸びる みたいな感じだと思ってください！ これを踏まえて、 アカウントの状態を考えていくと ✅ 初期アカウントを運用する場合 興味ゲージは「0」、 「誰こいつ？」 の状態です。 そこから、 興味を引き上げていって 「なんか気になるな、誰か知らんけど」 「はじめてみるけどすごそうやな」 という状態まで持ってくのが最優先です。 ✅ 長く放置してインプが 落ちたアカウントの場合 これも 一旦、興味ゲージが ゼロになった と思ってください。 興味ゲージが下がっているため、 すぐに今まで通りの運用をしても 絶対に伸びません。(←重要) 実績とか、成果報告とかをポスト して 興味ゲージを一旦高めてから、 本題の発信に入っていかないといけません！ 興味付けゲージを高める ↓↓↓ 注目が集まって 反応率がアップする ↓↓↓ 教育やノウハウ投稿も 伸びるようになる そのためにみんな、 実績画像を載せたり とか 動いてる様子を見せたり とかして 必死で興味付けしてます。 「始めから言いたいことが言える」 と思ったら大間違いです。 Xでは興味を持たれないと 発言権はゼロ だと思ってくださいw だからこそ、 X運用においてトップクラスに重要なのが 「興味付けポスト」 なのです。 短期間でアカウントを伸ばしている人は、 100%この 「興味付け」 を徹底しています。 というか、 強烈な興味付けによって 短期でフォロワーをブチ伸ばして そのまま収益化する人がほとんど 。 爆伸びする人 ＝興味付け特化の人 みたいな感じだと思ってください。 まず 興味ゲージ を高め、 安定して反応が取れる状態 を作ってから、 本格的な発信をすることが重要です。 それでは早速、 興味付けゲージを高めるためのポスト。 「興味付けポスト」 について 詳しく掘り下げていきます！ 興味付けポストとは何か？ そもそも、 興味付けってなんなん？？ となると思うので、 まずは例を挙げていきますね！ 2023年 なまいき垢 運用初期 2023年4月に運用開始して 4月末に420万円→2000人 9月に3400万円→8000人 実際に初期にやってた 興味付けポストを上げていきます👇 別垢のTipsの実績で興味付け さらに別垢で興味付け アフィの実績で興味付け(画像なし) アフィの実績 リスト増加数で興味付け 別垢でこれだけ売れた Tips出したらこんな売れた LINE登録者がこんな増えてる 知らん場所から収入あった アフィでこんだけ売れた etc. 2025年にきち垢 運用初期 ほぼゼロから1ヶ月で 2,000フォロワー達成。 安定してインプ2,000〜1万を 出せるように。 補足：にきちは、なまいきくんが運用サポートしてたアカウントです。 友達に教えて成果出た メルカリで利益が出た 今日だけで利益〇〇円 etc. まずはこんな感じで 「なんかよくわからんけどすごそう」 「どうやってんの？？」 と思わせるような投稿を 「興味付けポスト」 っていうんだな というのだけ理解してください！ 興味付けポスト=実績ではない ここで伝えておきたい、 めちゃくちゃ重要なポイントは 興味付け≠実績 ということ。 「興味を引くには、 すごい実績を出せばいいんでしょ？」 みたいに思ってる人が多いですが、 それはちょっと違うので注意。 シンプルに実績ばかり出してても、 同じ実績だと飽きられる、見慣れる ありきたり感が出てしまう からですね！ 例えばなまいきくんが 毎日Tipsの売上画像を投稿し続けたとして 最初は すごい思うけど3日もすれば 「またこれか」 ってなりますよね。 みんなと同じような実績を見せても、 「はいはい、またそのパターンね」 って埋もれちゃうだけ。 あと、 界隈の人が同じような実績を 頻繁に上げてたりしたら 読者が見慣れちゃってるので 最初から反応が低いです。 他の発信者と同じ種類の ありきたりな実績や行動をしてても 興味は惹けない あくまでも「興味」なので 目新しさがポイント になります。 こいつ、 なんか俺の知らない情報もってんな 俺が知らないノウハウで稼いでるな 多分俺と同じノウハウだけど なんで15分でできんねやろ？？ なんで俺より稼げてんねやろ？？？ 読者の頭の中に、 こういう「？」を浮かばせること。 これこそが、 「自分が知らない“何か”を持っている」 っていうキャラ作りにつながって、 強烈な興味を生み出す 元になる。 【具体例】なまいきくんの投稿 俺はじめて売ったTIPSまじでマーケとか一切知らずに適当に売って300万いったし、それで甘えてなんもビジネス力みたいなん身についてないんよな。この垢使えんくなって属人性ないアカウント運用してるんやけどまじでムズいなーって日々思ってる。 （300万の売上画像つき） このポストも単なる実績じゃなくて 「マーケとか一切知らずに」 「適当に売って」 という部分で読者に 「自分にもできるかも？」 と思わせつつ 「属人性ないアカウント運用してるんやけど」 という部分で どんなアカウント運用してんのやろ？ と興味を持たせる。 大事なのは 「知らない\"情報\"・\"ノウハウ\"」 を持っていると感じさせること。 単に実績を自慢するのではなく、 情報やノウハウに興味が向く ようにして、 「「「 それを持っている俺 」」」 という立ち位置を取りましょう。 それでは、 次から具体的な興味付けポストの 作り方を解説していきます！ 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/ihib0t9yKtcd/lesson/3CPu3bwsKnr3","createdAt":"2026-05-15"},{"id":"scr-1779455314509-qtquyx","title":"12-1 ゼロからわかる ４つのマネタイズ完全解説 | なまいきスクール会員サイト","category":"material","content":"12-1 ゼロからわかる ４つのマネタイズ完全解説 ここまでの講義で アカウントを作ってから 十分に アカウントパワー を 育てるまでに 必要なことを話してきました。 Lv.2で提示した マネタイズ可能域 の数字は 達成できている⁠⁠でしょうか？ ・平均インプ500〜1000以上 ・フォロワー300人以上 ・いいねも10〜20件ほど 最初は 最低ライン として ・平均インプ 500〜1000以上 ・フォロワー 300人以上 ・いいねも 10〜20件 ほど この基準を示しましたが、 スクール生の 伸びを 見てると ・平均インプ1000前後 ・フォロワー500〜1000人 ・いいねも20件程度 これくらいとれてる人も 相当数いるように感じます！ そしてここからいよいよ マネタイズ編に入っていきます まだ アカウントパワー が ・平均インプ1000前後 ・フォロワー300人以上 ・いいねも20件程度 この マネタイズ可能域 に 達していない場合は・・・ 焦らずLv.11まで を見直して まずはアカウントパワー上げを 継続して続けてください。 また先ほど示した数値とは別に ・ いかに読者に興味を持たれているか？ ・ 学ぶ対象として見られてるか？ という定性的な部分も重要です。 例えばDMやリプライに ・教えてください！ ・それどうやってやるんですか？ みたいに連絡がくるようになるか？ 運用してると肌感として 読者の 興味度合い を感じることが あると思いますが、 定性的な部分 の方も数値以上に 重要な項目 だと思うので 今回の講義の後半で この部分には触れようかなと思います。 それでは早速始めていきましょう！ ゼロからわかる マネタイズ攻略 今回の講義では ゼロからわかるマネタイズ攻略！ ということで これから マネタイズ編 に入るための 入門的な内容を話していきます。 Xの読者を見ていると ガチの初心者は あまりマネタイズのイメージがついてない そんな人が多くいるイメージ。 例えば、 とりあえずフォロワー集めたら マネタイズできるんじゃね？ 運用はしてるけど何で 収益化すればいいか考えてなかった... みたいな思考で 運用しちゃってる人 も多いです。 運用は本来 マネタイズから逆算 すべきなので マネタイズ知識がないのは Xにおいては 致命的 。 そういう点で Xの中でマネタイズは 初心者がぶつかる デカい壁の1つ。 なので、今回は具体的すぎる手法に 入る前の 準備段階 として マネタイズってどんな手法があるのか？ Xで集客してからマネタイズに 繋げるまでの流れや構造は どうなっているのか？ マネタイズに入るまでに どんな準備が必要なのか？ というマネタイズ編の 全体像的な話 をしていきます！ 中には最初から 「俺は高単価アフィだけ やる！」 と手法を絞ってる人もいると思いますが そういう人にも 必ず今回の内容は見て欲しい です。 というのも 高単価アフィに絞るにせよ 複数の 収益化手法 を知っとかないと、 必ず売上のアッパー(上限)が低くなるから。 例えば、 なまいきくんの部下がやったように 最低限のアカウントパワーをつける ↓↓↓ XTEPをひたすらぶん回す ↓↓↓ LINEで面談に案内 という 1つのスキーム を 全員がおこなった 場合には 必ず飽和する可能性があるのです。 高単価アフィは飽和しなくても みんなが XTEPを回す手法 しかしらないと 確実に旨みは下がりますね。 そこで ・noteを使った手法 ・セミナーを使った手法 ・低単価アフィを使った手法 などなど いろんな手法を知っていたら 複数の マネタイズ手法 を使うことで 他の人と違った集客 が可能になります。 ということでまず最初に マネタイズするための 大きな 4つの手法 を紹介していきますね。 運用については 知識がついてきたと思いますが まだマネタイズについては 初心者も同然の人も多いはず。 一旦初心に戻って しっかりマスターしていきましょう！ 4つの基礎的な マネタイズ手法 まずは マネタイズ手法 の概要 についてお話ししていきましょう！ SNSマネタイズ系 の 教材 って TipsやBrainを見ると無限にありますよね… ・極秘マネタイズ手法！ ・ブルーオーシャン手法！ ・ 裏アフィ戦略 etc. あたかも 目新しい手法 が あるように見せてますが、 基本的にマネタイズ手法は 以下の 4つ しかありません。 ・高単価アフィ ・コンサル・スクール ・アフィリエイト ・コンテンツ販売 簡単にいうと、 ・自分の商品を売るのか？ ・他人の商品を売るのか？ ・高単価か低単価か？ 違いはたったこれだけ。 なので、 極秘マネタイズ手法！ ブルーオーシャン手法！ 裏アフィ戦略 etc. などの手法が 目新しく 見えても、 ・自分の商品を売るのか？ ・他人の商品を売るのか？ ・高単価か低単価か？ ↑ 99％の場合はこれを 言い換えてるだけ なのです！ なまいきくんも今までいろんな手法で マネタイズしてきましたが 極論、以下の 4つ しかしてません。 まずそれぞれの概要をさくっと説明します。 ①コンサルスクール販売 直接指導が難しくサポートの手間で コスパは低め だけども単価は高く稼ぎやすいイメージ コンサル・スクール販売 この2つはただ名称が違うだけで ほぼ同じなのですが ・個人でやってたらコンサル ・チームで仕組み化してたらスクール くらいの認識でOKかなと！ コンサル販売のメリットは 60〜100万円の高単価が多いので、 わりと簡単に 月100万円以上 が狙えること。 Xのビジ系で 2ヶ月目で 月200万円 とか言ってたら、 大抵の場合は 2ヶ月目でコンサル生を 3人くらいとっただけ の場合が多いですw あと、初心者の場合は 顧客理解 にもめちゃくちゃ繋がるし 指導実績 を作りやすいので 目的意識を持って コンサルをしてみるのはおすすめですね！ なまいきくんの場合も、 最初の頃はマチアプ垢で 講習をとっていました。 Xで集客 ↓↓↓ LINEやDMで連絡をもらう ↓↓↓ Zoomやリアル面談 ↓↓↓ 月10万とかで講習 講義の内容的には 服の買い出しに同行 ↓↓↓ Zoomやリアル面談 ↓↓↓ マチアプの写真撮影 プロフやチャットについては、 基本マニュアルをわたす ↓↓↓ たまにアドバイス という流れでやっていました。 ただし、 コンサルは 自分の工数 を使うので 売上にアッパーがきやすいのと いつまで経っても暇になれない… というのが課題です。 時間を作りたければ、 ・スクール化して仕組み化する ・コンテンツとかに移行する しかありません。 ②コンテンツ販売 単価が低く めっちゃ稼げる訳ではないが コスパも良くて 難易度も比較的低め コンテンツ販売は、 note、Tips、Brainとかで 自分が持ってる 知識やスキル を 記事・動画 にして販売する方法です。 なまいきくんは以前まで コンテンツ販売 を 1番推して発信してきました。 理由としては コンテンツを作っておいたら 売れ続ける資産性があること 1対複数で価値提供できるので 稼働に縛られずに売上を伸ばせること などが挙げられます。 実際、 僕もなまいき垢を始めて2年間は コンテンツ で 2億円 売っていました。 さらにコンテンツ販売をやっておくと、 商品作り ↓↓↓ 集客 ↓↓↓ 販売 という一通りの経験を 自力で積むことができますし その過程で 非常にマーケ力が上がるので 学習的な意味ではおすすめです！ また、 高単価アフィをやる場合も 低単価コンテンツを売る → その特典として面談に誘導 コンテンツ自体は販売しないけど 特典やプレゼントとして コンテンツを使う みたいな戦略を組むことも できるようになるので、 コンテンツ販売 自体は非常に 有効な手段と言えるでしょう。 ただ、 これにも課題があって… 「コンテンツ販売だけで稼ぎきろう！」 と思うと多くの人にとっては そこまでおすすめできません。 なぜかというと、 コンテンツ販売 →一撃で超でかく稼ぐためには ハードルが高い手法だから。 例えば、 高単価にして数を売ろうにも Xマネタイズ教材を買うならThe.Xでよくね？ （👉界隈で強い人の教材を買っちゃう） ということが起こってしまうのです・・・ コンセプトで差別化する！ 独自の経験を入れる！ とかも言われますが 顧客目線になったら なまいきくんのコンテンツ を 買っとくのが安牌 という思考になるはずです。 また、単価的な面でも、 5万円、10万 はハードルが高いので、 ある程度の実績がある→3万円 実績が小さい→5000円 などの壁にぶち当たります。 それなら、 利益率 は 50％ になったとしても The.Xをアフィってた方が 権威性のある商品で売れやすいし 利益も高いからコスパ良くね？ みたいな発想になると思います。 なので コンテンツ販売 については、 手法自体は 優秀 で 価値がある けど それだけで稼ぎ切るのはハードルが高い みたいな感じで思ってください。 ただし、 コンテンツ自体で 超デカく稼ぐ のが むずかしかったとしても そこから 高単価アフィ に繋げれば より アツいリスト を 面談に流すことができるのです！ つまり、 コンテンツを読んでもらい、 コンテンツの中で 濃い教育をすることも可能 だということ。 例えば 低単価noteを販売して 特典受け取りはコチラ！ みたいな流れで リスト獲得 したら めちゃくちゃ 決まりやすくなります！ 実際、 ・田中の高単価アフィ攻略note を購入し、 note経由 でなまいきスクールに入った人 ・そうじゃない人 この2パターンでは スクール入会直後や 面談での熱量が全然違いました！ それくらい コンテンツ販売 を マーケティングに活用するのは 効果的。 だからこそ、 高単価アフィをやるから コンテンツ販売は知らなくていいや・・ みたいな考えは 超もったいないです！！ なので、 今後 コンテンツ についても 学べる機会 を作ろうかと思っています。 ③アフィリエイト 単価が低いが難易度も低い 初心者が取り組みやすい アフィリエイトは、 月20万円 くらいサクッと稼ぎたいなら Tipsアフィとかは非常にハードルが低く 商品も 作らなくて良い ので 楽に達成できます！ でも、初心者の人は 「アフィリエイトの 仕組みがわかんないな？」 と思う人もいるので軽く説明しましょう。 アフィリエイトの仕組み 広告主が売って欲しい商品を アフィリエイターに掲載してもらう ↓↓↓ アフィリエイターは企業の代わりに お客さんを集めて商品を紹介して売る これがアフィリエイトの流れです。 アフィリエイトのメリットとしては、 企業 →集客や教育を代わりにやってもらえる アフィリエイター →他社の良い商品を販売できる などのメリットがありますね。 そして、お客さんが商品を買うと その 報酬の一部 が アフィリエイター に 支払われます。 簡単に言うと 紹介ビジネス です。 ビジ界隈からすると 低いと感じるかもですが、 一般に報酬率は 10〜20％ くらいが相場です。 触れたことがある人が多いアフィだと、 ・Tipsアフィ ・Brainアフィ ・アダアフィ(エロ動画のアフィ) ・ツール系のアフィリエイト などがありますね。 なまいきくんはやったことないですが もしもアフィリエイト みたいな サイトに登録すると、 ・転職サービス ・ネットサーバー などの アフィリエイトもできたりします。 なまいき垢では 1番最初期には ダイレクト出版 の アフィリエイトで稼ぎました。 500円 の書籍を売って 2000円の報酬 が手に入るという 好条件の案件でしたw ※現在は終了しています。 ちなみにですが！！ なぜ500円の書籍なのに 2000円の報酬が 出せるのかわかりますか？ ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/gcftwclZ5VXk/lesson/YXcAXNClZfwf","createdAt":"2026-05-15"},{"id":"scr-1779455314509-gfqkfw","title":"お知らせ一覧 | なまいきスクール会員サイト","category":"material","content":"お知らせ 2025年9月28日 ⚠️必読⚠️なまいきスクールのルール","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/news","createdAt":"2026-05-15"},{"id":"scr-1779455314509-nelbsl","title":"Lv.4 講義QA | なまいきスクール会員サイト","category":"material","content":"Lv.4 講義QA Lv.4の内容でいただいた質問に回答しました！ Q-1：ポストのインプレッションがフォロワーの20%以下だとアカウントパワーが低いという認識で合ってますか？ A-1：大体そんなイメージ。20%なら悪くはなくボチボチという感じだけど、5%とかになると渋い。50%はかなり高い。フォロワー数が少なくても、アカウントパワーが高いと伸びていく。Xもアカウントパワーが高いアカウントを露出させる。 Q-2：大手に絡むと、アカウントパワー狙ってんなと思われないでしょうか？ A-2：そんなこと思う人はあんまりいない。しかも、大手にもメリットがある(アカウントパワー上がる)からむしろ嬉しい。基本的には気にしなくて良い。たまにリプ嫌いな人もいるけど、原則気にしなくて良い。 Q-3：AIアフィの実績があって、AI副業系の高単価アフィに繋げる際、絡む順番は、AI✖️アフィ、AI副業、ビジネス系の順番で絡みにいけばいい？ A-3：はい、合ってます Q-4：別界隈の大手と繋がっても意味ないですか？ A-4：意味がないことはないけど、例えばなまいきくんのアカウントに、物販に興味ある人は少ないし、自分のアカウントを物販としての属性認知させるのにも有効ではないので、なるべく同じジャンルの大手に絡んだ方がいい。 Q-5：反応悪いポストは消した方がいい？ A-5：別に消さなくてもいい。なまいきくんが消してるのは半分自己満、数字が低いのを残したくない。 Q-6：投資系で発信して、種銭が少ない人に占いやAIを勧める場合、普段のポストから複数テーマで発信していい？ A-6：NG。ポストは投資系に絞って興味づけして、リストインした人に対して最後の最後に誘導先を示してあげる感じ。 Q-7：黒歴史はいつから出したらいい？ A-7：最初から出してもぜんぜんいい。黒歴史は定期的に出していく。一回だけ出してもぜんぜん覚えられないから、定期的に小出ししてキャラをフォロワーに浸透させていく。最初、多出ししてもいいけど、その場合は、先に実績提示してすごいやつ認定されてから出した方がギャップになってより興味を引けるからおすすめ Q-8：本アカとサブ垢を絡ませたら属性認知の影響をうける？ A-8：影響は受ける。だから原則として、ジャンルが違うなら絡ませない方がいい。それこそ同端末で絡ませるとシャドウバンになったりするのでNG。 Q-9：AI関連だと、よくこのプロンプトでこれができます！みたいなのを垂れ流してる人がいるので、「実際やってみました！すごい！」みたいな絡み方をすると良いかなぁと思っていますが、基本はこんな感じでいいですか？ A-9：良い。自分のアイコンをちっこい人形にして出力するプロンプトとかあったら、それ実際に実践して載せるとか。 Q-10：他人の力でアカウントを伸ばすパートで、結構勝負を挑む印象あります。The.Xの15万フォロワーの方や、The.Impactは、某プラットフォームの社長には勝ち、TheImpactの売り上げ勝負は、なまいき軍団の敗北という結論になったと思いますが、大手に勝負を仕掛ける時は、勝てる見込みがあるものを見つけたうえで、どうにか勝つ方がいいのでしょうか？それとも、負けても、盛り上がればOKなのでしょうか？(ローンチ商品など、自分の見込み客に発信が届く内容の勝負の前提で) A-10：大手との勝負は表面的なもの。本来の勝負は自分の売上が出ること。表面で負けても、それによって本来より売上が出たならそれは本質的には勝ち。売上が出ればOK。表面勝負にも勝つに越したことはないが。 Q-11：FFは同じ属性の人の方がいいですか？FF比は気にした方がいいですか？ A-11：FFは同じ属性の方がいい。FF比はそこまで気にしなくてもいいけど、フォロー数がフォロワー数の2倍とかは見栄えが良くない。1:1とかなら良い。 Q-12：リプ返信は早くした方がアルゴ的にいい？ A-12：そこは人間的な反応を重視した方がいい。その観点で行くと、早い方が相手は嬉しい場合が多い。ただ、毎回即返信するのもしんどいと思うからそこまで速度は気にしなくて良い。 Q-13：ポストのブースト機能は使った方がいい？ A-13：つかわなくていい。40万円分使ったことあるけど、同属性に認知とることがXは大事だけど、ブーストはランダムに露出するから、属性認知狂う。アカウントパワーも落ちる。通報もされる。次の投稿の反応が下がる Q-14：フォロワーが1000、インプが500〜1000のアカウントの場合、大手に絡むことはやっていった方がいい？それともポストに力を入れた方がいい？塩梅が知りたい。 A-14：このフェーズはまずフォロー周りは要らない。リプ周りはやった方がいい。ポスト出しつつ、リプ周りとかでいい。 Q-15：いいね20とリプ8の時間間隔は空けた方がいい？ A-15：これくらいなら感覚値でいうと、開けなくていい Q-16：自分の発信ジャンルにアクティブな外国人さんがそこそこいます。フォローやいいねするのは日本人に絞った方がいいなどはあるでしょうか？（外国人とは絡まない方が良いという決まりはあるのでしょうか？） A-16：外国人は日本のスクールを買わないと思うから要らない。フォロー、リプ周りも要らない。 Q-17：アカウント買収したらdmは削除した方がいい？ A-17：凍結リスクはないから、どうでもいい。シャドウバン、垢BANリスクになるのは、リプ周り、いいね周りやりすぎるとか、エロ画像出すとか、暴力的な発言、差別的な発言、ヘイトスピーチ、宗教的なもの、陰謀論、機械的なことをするなど、 Q-18：アカウント買収ではなく全くの新規垢でスタートの場合、コツコツ型運用で、毎日8人×3セット。1日24人自発フォローしていくとFF比が、極端にフォロー＞フォロワー になるかなと思いますが最初は割り切ってよいのでしょうか。あるいは、ある程度、フォローしたら解除していく作業も必要でしょうか。 A-18：FF比が明らかにフォロー数の比率が高ければ解除してもいい。積極的に解除する必要はないし、フォロー数が増えてるなら、フォロワー数も増えてるはずなので、ポストに力を入れる方向性に重きをおくべき。普通はフォロー数だけがフォロワー数に比べて極端に増えることは起きない。それが起きるのはポストがバグってるだけ。あとは、アクション周りの属性を変えるなど。こういうの質問は系は、そうなったら聞いて。 Q-19：運用初期は仮想敵批判をガンガンした方がいい？ A-19：いいっちゃいいけど、あくまで見込み客が噛み付くような手段(気にしてる内容)を仮想的にした方がいい。AI発信してて物販はあまり噛みつかれないから、論争も起きないと思う。 Q-20：ポストで実績報告して権威性持たせるところはエアプでも大丈夫ですか？？ A-20：スクールとしては推奨できない。実績ないなら上手い見せ方で欲求喚起できるようにするなど工夫すればぜんぜんいける。東カレの足跡画面を見せて、明言はせずにマッチめっちゃしてるように見せるなど Q-21：AI界隈について、真面目なコンテンツ作成系とAI美女系は別ものと思って絡まない方が無難でしょうか。美女系だとアダ認定されるのかと思い、どこまで広げていいのか迷ってました。 A-21：先にコンテンツ作成系の核をつくっていって、その後に美女系まで広げるほうがいい Q-22：初歩的な質問なのですが、実績も無く、自身の売り方（手法）も自分は無いのですが、この場合はポストで実績や手法はなるべくポストしない方が良いのでしょうか？それか嘘でも少し実績報告するのか、エアプでも手法出した方が良いのでしょうか？自分的には嘘ついてまで出す必要無いのかなと思ってますが、教育フェーズらへんまで来たら教育考えるの大変だなと思ったので、なまいきさんの考えが知りたいです。 A-22：実績が求められないジャンルに行く方がいい。ビジネス系で実績ないのに発信するのはむずい。それなら恋愛系とかAI系とかにすればいい。ビジネス系はエアプの方が伸ばすのむずいから、実績出してから発信した方が最終的に伸びやすいまである。 Q-23：AI界隈で先ほど話にあがった、小さい人形を作るプロンプトを応用して「さらに動画にするプロンプトを作ってみた。いいねが多ければあとで公開するかも。」みたいな手法で差別化を図ることも有効でしょうか？ A-23：引用で、さらに〇〇したコンテンツ作ったから反応多かったら公開しますわ！みたいなプレゼント企画はウザいから、いるんすかね？とかで留める方がいい。 Q-24：見込み客外にリーチしてしまったポストは属性認知が下げるのを防ぐためにポストを削除するほうがいいでしょうか？（まだ反響がある場合） A-24：バズりすぎたら消した方がいい。10万インプ超えたら、見込み以外にリーチしてる可能性が高いから消した方がいい。属性認知バグるし、通報やアカウントパワー低下になるリスクがあるから。 Q-25：認知獲得ポストをするのではなく、コツコツ型で交流して認知拡大してく認識で合ってますか？日々のポストはGPTsで興味付けをメインに発信してくみたいな。 A-25：同時並行がベスト。最初はポストが伸びないから交流もするようなイメージ。 Q-26：買収したアカウントは別端末で運用していった方がよろしいでしょうか？ A-26：同じ端末でもOK。ただ、その条件として、その端末で凍結をくらったことがない、同端末内で絡み合わない、と言うことを徹底。 Q-27：立ち上げ1週間でシャドウバン状態ですが、いいねやフォローなどルーティン活動は行っていいですよね？ A-27：何もしないこと、放置。 Q-28：ビジネス系の発信をしている垢で全く他の界隈(ナンパ系とかエロ系)の方からフォローされたのですが、この場合フォローバックはしていった方が良いのでしょうか？ A-28：しない方がいい。属性認知バグるから、. Q-29：ナンパ系垢のサブ垢でしれっとマネタイズ(投資系の話)をしたらそれなりに伸びたのですが、あまりし続けない方が良いでしょうか？個人的にはサブ垢ではナンパの話をしつつ、でも金稼ぐ行為も必要だよね的な 恋愛系×金稼ぎのポジションとれたらなぁとも思っていますが、運用的には避けた方が無難でしょうか。先ほどクローズドの環境で出した方がいいかも的な話があったので。 A-29：多少はいいけど、どっちをベースにするかは決めた方がいい。じゃないと、両方伸びにくくなるみたいなことになる。ベストはサブ垢を作ること。 Q-30：スタートのシャドウバン回避のためにoldアカか、そこそこのフォロワーがいるアカウントの購入を検討してます。oldアカの場合国産外国産って関係合ったりしますか？ A-30：国産外国産は関係ない。5年前とかに作られている、1000ポストとかあるならoldアカとしていい感じ。 Q-31：今はAI副業でやってるのですが、AI副業ではなくテーマをAI×画像生成などでマネタイズ向きじゃない方向で発信してスクールに誘う感じですか？スクール入る人は目的がお金稼ぐ為に入ってくると思うのですが、AIで稼ぐ以外でも集客出来るのでしょうか？ A-31：AIでスキルを身につける系の内容も需要もある。今の現状のベスト(実績など)で行動する。 Q-32：自分が売りたいジャンルの属性にリーチするのが基本だと思うのですが「自分が稼いでい手法の魅力」を語るために少しずらした界隈外から引っ張ってくるのはアリでしょうか？たとえば、僕自身がブログで失敗してきた経験から、ブロガー向けに発信しつつ、最終的に「実績作るには裏垢が最強である」という興味付をしていきたいと思っています。ブログ運用の経験はあるので、発信そのものはしやすいのですが、、、ただこれだと「裏垢によるコンテンツ販売の界隈」からはズレ過ぎるのでは？という懸念もあります。大変お手数ではございますが、なまいきさんの見解を聞かせて頂きたいです。 A","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/oyuMJdIzdjEt/lesson/BgYAW1EhlElA","createdAt":"2026-05-15"},{"id":"scr-1779455314509-unumsp","title":"21-2 【ローンチ全体像編】売上最大化のためのローンチの呼吸 | なまいきスクール会員サイト","category":"material","content":"21-2 【ローンチ全体像編】売上最大化のためのローンチの呼吸 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/TbPMeym6A3YH/lesson/34v3wPthyczE","createdAt":"2026-05-15"},{"id":"scr-1779455314509-hfsiqv","title":"2-5 プロフィール設計をしよう | なまいきスクール会員サイト","category":"material","content":"2-5 プロフィール設計をしよう それでは、本記事のテーマ 「プロフィール設計の方法」 をお話しします。 はじめにいっておくと、 プロフィールは 定石通りにやっておくのが 一番楽でハズレがない です。 その理由は ２つ！ ✅️ 結局はポストで決まる ✅️ いれるべき要素は決まっている 「この人はどんな人なのか？」 パッと見でわかり興味を惹ければOK！ まずは、 プロフィール作成するときに 持っておくべきスタンス を説明します。 そのスタンスとは、 キャラを尖らせる あくまでも 自分のアバター であり、 自分自身ではない という意識を持つことで 運用ハードルが下がる。 そして、 印象にも残りやすくなる SNSは 印象ゲー です。 記憶に残らないと意味がありません。 なのでキャラを尖らせて 「こいつはこういう人間なんだ」 って捉えやすくすることが大事です。 例えば、 なまいきくん垢も100%本人か？ というと 60%くらい。 残り40%は 「こんな人間だったらおもしろい」 という逆算から来ています。 なので、プロフィール設計のときも 「アカウント=自分」じゃなくて、 「アカウント=キャラクター」 のイメージを持っていくべきです。 プロフィールの作り方 プロフィールは、 5つの要素 からできています。 ✅️ 名前 ✅️ アイコン ✅️ ヘッダー ✅️ プロフィール文 ✅️ 固定ポスト これらの作り方を説明します。 1️⃣ 名前の設定 ポイント： 呼びやすい/理解しやすいこと ✅️ ひらがな/カタカナ2~6文字 記憶に残ってなんぼ 覚えるのにコストがかかるのはNGです。 例：なまいきくん、ぶんじろう、あぱぱ 👆️覚えやすいですよね！ ちなみに、 肩書き、発信テーマ、実績を つけることで なんの人か分かりやすくなります。 例：「〇〇 電脳せどり」 「〇〇@アフィ月435万」 2️⃣ アイコンの設定 ポイント：視認しやすいこと ✅️ 人間、動物、キャラなど ダメな例：AIイラスト、実写 こういう系は埋もれるし、 既視感がでてしまいます。 アイコン設定は、 キャラを一発で認識 されて モブらない のが大事。 ちなみに、 アニメキャラに寄せると そのキャラのイメージを借りれるので 楽です 例えば👇️ あぱぱ垢は 緑谷出久（僕のヒーローアカデミア） を元にしています。 3️⃣ ヘッダーの設定 ヘッダー内容の選択肢は2つ ✅️ 選択肢１：発信テーマ 例：物販垢 アパレルブランド１年で 25,000,000円売った ノウハウ垂れ流しX ✅️ 選択肢２：実績画像 例：なまいきくん垢 Tipsの売上画像 2024年の1億2800万円 どちらもパッと見てわかりやすいですよね！ なので、ヘッダー画像は 実績がパッと入ってくるか 発信テーマがドーンとくるか のどちらかにしましょう。 💡 補足ポイント 💡 スマホで見たときに文字が はっきり見えるサイズで いれるようにしましょう。 4️⃣ プロフィール文の設定 プロフィール文には 次の4つを入れていく ✅️ 今やってること ✅️ 実績(数字‧具体) ✅️ 自分の立ち位置 ✅️ 興味付け要素 １つずつ解説します👇️ ４つのポイント ✅️ 自分の立ち位置 ｢高卒ニートのチー牛おぢ｣ ｢限界フルタイムワーママ｣ ✅️ 今やってること 自分が今やっている内容など ✅️ 実績(数字‧具体的に) なまいきくんなら半自動で1億 ✅️ 興味付け要素 フル自動で…(簡易性) ノーリスクで…(低リスク) 1日20分以下で…(簡易性) 初月〇〇できた… とある物販では⋯(不完全情報) プロフィール文のダメな例🙅 ❌️ 関係ないことを書く 関係のない実績、経歴を書いても 意味ありません。 ❌️ 趣味はカフェ巡り 関係のない趣味、 好きなことなどもいりません。 必要のないことは書かなくていい！ 💡補足ポイント1 ✅️ ギャップを入れる なまいきくん の例 「1億 vs 高卒ニート」 20代サラリーマン の例 ポンコツリーマン vs 5000万円越え 他にも 会社員、ママなのに クソ稼いでる！ ガキなのに ノウハウが本格！ こんな感じで ギャップをあえて作っておくことで ”なんやこいつ？” と思われやすくなります。 💡補足ポイント2 ✅️ パワーワードを入れる 半自動 限界 ポンコツ 無能 借金地獄 など 興味をひくようなワードを 入れてください。 5️⃣ 固定ポストの設定 LINE導線、プレゼントを置いてもいいけど 最初は多分置くものがないはずです。 運用初期では自己紹介、 実績を固定に入れる ★とにかく興味を惹かれるもの ✅️ 何を呟いてるのか？ ✅️ どんな実績があるのか？ ✅️ 普段何してる人間なのか？ ✅️ どういう経歴なのか？ 実績を載せている例👇️ 思いつかない場合は、 競合のアカウントを10個 みましょう！ そうすると、 実績こんなこと書いてるな... こんなアイコンが多いな... など、他の人を見ることで イメージは掴める はずです！ もちろん、 競合アカウントリスト を用意してます。 ＞＞ X発信アカウント一覧【ジャンル別】 👆️こちらを参考に プロフ作成してください！ プロフ設計で忘れちゃダメなこと それは、 プロフで悩みすぎないこと 。 あとでいくらでも変えられるし 最低限整えたら差がつきにくいです 。 Xマネタイズで大事なのは、 ポストやマネタイズです。 このルールだけ守って、 パパッと 運用スタート しましょう！ プロフィール作成GPTsについて プロフィールの与えるインパクトは ぶっちゃけ 反応の母体を作るという目的が重要であり、数字は目安 Q-9：AI副業プロジェクトで進捗がない期間ができてしまうが、田中さんの時もそうだったか？ A-9：リアルでやっている限り、進捗のない時間は全然ある。進捗がない時こそ、田中さんの過去を深掘りしたり、「何やってんの？」と問いかけたりして、なるべくネタを作る工夫をする。むしろ、ほとんどの期間は変化がないのが普通 Q-10：失敗する可能性が高い挑戦を始めるべきか、成功を確実視できる状態で始めるべきか？ A-10：失敗したら失敗したで、長期的に美味しいように持っていくしかない。失敗もネタになり、そこからまた頑張る姿を見せれば応援してくれるファンが生まれるため、挑戦しない者が一番負けている。失敗してもそれをどうストーリーに繋げるか（例：Xの研究をさらに深める）が重要。 Q-11：実際に起こっていない事件をポストとして、フィクションとノンフィクションを織り交ぜるのはどうか？ A-11：倫理観の問題や個人のスタンスによる。話者としては、ノンフィクションに少し客色（感情表現を3倍にするなど）を加える程度を推奨している。完全に嘘（フィクション）をつくと、それがバレた際にアカウントが終わり、その後の発信すべてが嘘に見られてしまうリスクがある。 Q-12：文次郎の運用は最初からナンパ系のポストをしていたのか？ A-12：そもそも浪人垢（ネタtwitter）から文次郎に転生しているため、ゼロポスト目からいきなりナンパを始めているわけではない Q-13：AI副業発信で、本人が金銭的に「底辺」であることを全面に出して良いか？ A-13：短期的なマウントを取るよりも、多少時間がかかってもストーリー型に乗せて後のファンを作る方が重要。底辺であることをスタート状態として受け入れ、そこからうまくいく過程を「セット」で見せることで、信憑性が最大化し、成果が最大化する Q-14：感情日記（内省ツール）は今でも続けているか？ A-14：つけていない。Xの投稿がその代わりになっている Q-16：教える立場の人がポンコツ感を出すと「この人大丈夫か」と思われるのでは？ A-16：ポンコツからうまくいったという流れがないと厳しい。ポンコツはあくまで、後の成功を際立たせ、 「うまくいくことがあった上でのポンコツ」 であるべき Q-17：女の子やギャンブルといったネタは伸びやすいか？ A-17：伸びやすいかどうはどうでもいい。伸びた先で何かに意味があるのか（収益化の目的に沿っているか）が大事。発信ジャンル（例：婚活）とネタ（例：女の子と遊びまくる）が合致していないと意味がない Q-18：旦那が会社をクビになりニートなので、AIを使って再就職を目指すストーリーはありか？ そのストーリーを何の商品に繋げるか難しい。 A-18：いいと思う。例として 「クソ旦那を稼がせるなんちゃら」 といったフックも面白いだろう。 そのストーリーは、AI自体がめちゃくちゃヤバいという点に対する興味付けとして非常に強い。そのストーリーを通じてAIへの興味付けができれば、具体的なAIの手段（商品）へと繋げられる Q-19：「ポンコツ」感について A-19：ポンコツはあくまでスタート地点であり、最終的に成功して初めて意味を持つ。ポンコツの状態で教えるべきではない Q-20：ストーリーの作成とリアリティ A-20：常に「どうなれば熱いのか」「どうあれば湧くのか」という読者視点で考えるのが大事。リアルな感情をそのまま日記のようにポストするだけでは面白くない。 Q-21：初期のイメージとギャップ A-21：アイコンや発言から「おじさん」と思われていたが、実際に会うと若いので、そのギャップがファンを惹きつける要素にもなっている 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/sGUl9xSASdx3/lesson/fyp0Y8lkbumC","createdAt":"2026-05-15"},{"id":"scr-1779455314509-ieoifb","title":"アカウント添削会1 | なまいきスクール会員サイト","category":"material","content":"アカウント添削会1 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/DrpvsdmjeMwm/lesson/L1Q9QJuVV5yE","createdAt":"2026-05-15"} タイズまで繋げました。 ① Xでストーリー型運用で集客 ② オープンチャットに誘導 ③ 裏垢攻略セミナーに誘導 ④ 個別ロードマップ作成会に誘導 Xでまずストーリー型運用をして 認知を広げながら裏垢への 興味付けを強めていきます。 今回は協業だったので、 なまいき垢でストーリー型運用をして 集客を手伝ってあげています。 注目が集まったところで オープンチャットに集客。 そのオプチャを起点に 情報発信をして教育をしながら、 裏垢攻略のセミナーに誘導 。 セミナーの最後で 個別のロードマップ作成会 に誘導して 個別セールス という流れを作りました。 つ・ま・り！ X運用の段階では、 裏垢に興味を持たせながら オプチャに集客できればOK というイメージを持ってください。 ストーリー型運用の流れ それではここから、 具体的なストーリーの流れ を 事例をもとに見ていきます。 このローンチでは なまいきくんが裏垢攻略に挑戦！ どれだけ稼げるのか！ というテーマで ストーリー型の運用 をしました。 流れはこんな感じです👇 なまいきくんが裏垢に挑戦する ↓↓↓ なまいきくんが勘違いして暴走する ↓↓↓ 事件が起こる ↓↓↓ 事件の内容が明かされる ↓↓↓ のんびりくんにセミナーで 詳しく解説してもらいますね！ 具体的に見ていきましょう！ ①⁠⁠⁠⁠ なまいきくんが裏垢挑戦を決定！ リアルタイム感を出したいので、 まずは どのジャンルに挑戦してほしいか の アンケートから始めました👇 投票の結果、 もちろん裏垢に決定します👇 ②さっそく裏垢に挑戦するも…暴走 裏垢に挑戦してさっそく なまいきくんが 暴走スタート します👇 あえて 「フォロワーと」 ということで 誰と何してるんや！ という興味を掻き立て、 禁断な感じを出してますw 「ごめんな、楽しんでくるぜ」 というのを事前に入れることで こいつ何やってんだろ？？ という興味を少し入れてます。 そして… この画像を見た瞬間に、 フォロワーの頭の中には 「これから何がおこるんや…」 「どんなエロい撮影会をしようとしてるんだ…」 という ”期待感” が広がります。 つまり、 続きを追わざるを得なくなりますw さらにそこから ラブホに移動して撮影 が始まります👇 「お前何してんねん！！！」 というリプが飛んできそうな、 エロい撮影会の様子を実況していきます。 先に言っておきますが、 裏垢にはエロ画像は必要ありません（） さらにいうと、 こんないやらしいポーズで 写真を撮らせる必要もありません。 ストーリー型運用の企画 として 撮影協力してもらってます笑 この段階が1番注目が集まってたので、 オプチャに誘導をスタートしました👇 ③事件が起こる さて…順風満帆に見えた エロガキのなまいきくん。 ここで事件が起こります👇 ポイントは あえてすぐ本題に入らずに、 悲しい出来事が起きました、、 もうショックすぎて 立ち直れないです、、 と内容をぼかして興味付けを挟むこと。 さらに何ポストか 焦らしをいれていきます。 これによって、 読者が続きが気になって しょうがない状態 になります。 ④事件が明かされる そしてついに、 「悲しい出来事」 の内容が明かされます👇 裏垢師匠ののんびりくんに、 裏垢にエロ画像いらないです… という指摘をされます。 いちおう、 ここの戦略目的を説明しておくと エロ画像撮影会で注目を集めたい エロ画像がいらない教育をしたい という２つがあります。 特に重要なのが２つ目で、 裏垢マネタイズ においては 女の子じゃないとできないんじゃない？ エロ画像が必要なんじゃない？ というグダが想定されてました。 それを単に 「裏垢にはエロ画像不要」 と言葉でポストしても インパクトが弱くて伝わらないので、 あえて 茶番の撮影会 をして、 のんびりくんに指摘させることで 強烈に教育 をいれています。 ⑤セミナーに繋げる さて、ここまで来たら、 ストーリー型運用は完了 です！ 裏垢への注目も集まってますし、 必要な教育も入れられました。 そこで 俺と同じようなミスせずに スタートダッシュ切れるように のんびりくんに教えてもらいましょう！ という文脈で セミナーに誘導しました👇 ちょっと流れをまとめると なまいきくんが裏垢に挑戦する ↓↓↓ なまいきくんが勘違いして暴走する ↓↓↓ 事件が起こる ↓↓↓ 事件の内容が明かされる ↓↓↓ のんびりくんにセミナーで 詳しく解説してもらいますね！ こんな感じの流れになっています。 この企画で重要なポイントは なまいきくんが実績を ほぼ使ってないこと です。 実際は裏垢に挑戦して 1週間で140万円ほど稼げた のですが、 オプチャ誘導の段階 では あまり実績を出し  ③認知拡大 より多くの人に知ってもらうこと ポストを伸ばす 誰かに持ち上げてもらう 誰かとコラボして認知を伸ばす なんでもいいので、 認知を伸ばすこと。 今の３つまとめると より多くの人に知ってもらい(認知拡大) AIに属性を認知した上で(属性認知) 反応率を高めておくこと(エンゲージメント) この３つを高めれば、 アカウントパワーは勝手に育ってきます。 そしてその結果として、 Lv.2の全体像でお話しした ・フォロワー500人以上 ・平均インプ500~1000人 を超えるレベルまで アカウントパワーが育ったら マネタイズをスタート できます。 じゃあどうやったら、 この３つが上がるか？ 方法は大きく３つに分かれます。 ①コツコツ型 ②立ち回り型 ③他力活用型 それぞれ軽く深掘りすると… ①コツコツ型 日々の交流をルーティン化 して 着実にコツコツと アカウントパワーを伸ばす方法。 初期垢では属性認知ができてないので アルゴリズムは 「誰と絡んでいるか？」 「どれだけアクティブか？」 を見ています。 そこで、 毎日のポスト、いいね、リプ、 引用などを繰り返すこと で ”アクティブなアカウント” を認定されて属性認知も進みます。 さらに、 参入したい界隈の人に いいねやリプをしとけば、 強制的に認知を広めることが可能 なので 初期は絶対にこのムーブをした方がいいです。 フォロワーや影響力がなくてもできて お金もかかりません。 初期垢でポストだけで伸ばすのは 論外だと思っておきましょう🔥 ②立ち回り型 初期垢専用の立ち回り をマスターして アカウントパワーを高める方法。 初期垢で一番大事なもの。 それは 有益情報 でも、 教育テクニック でもありません。 初期垢では、 誰もあなたを知らないし 興味も持ってない状態 なので その段階で 頑張って発信をしたところで まず無意味なの です。 誰もあなたを知らない状態で 重要になるのが 「圧倒的な興味付け」 です。 「なんかこいつ強そうやな」 「新参だけどすごいやつかも」 「ちょっと注目しとこうかな」 と思わせるような興味付け。 そして、 初期垢で興味付けをするための 定番の立ち回り みたいなものがあります。 この運用方法はなまいきくんが 新規垢を立ち上げるときに 鉄板でやってますね！ マスターすると破壊力はえぐいですが、 戦略が必要なので難易度は少し高い です。 ③他力活用型 大手や他人の力を借りて アカウントパワーを高める方法。 Xでは大手や勢いがある人に リプや引用されるだけで 一気にフォロワーやインプが増えます。 なのでこのやり方では どうやって他人を巻き込んでいくか？ が肝になります。 初期から爆発的に伸びる人は このムーブがうまい人が多いですね！ この３つのうち、 ②は短期間で伸ばせる爆発力があり 他人に頼らずにできるので魅力的ですが、 それなりに熟練度 が必要です。 この立ち回り については Lv.5をまるまる使って詳しく掘り下げます！ そして③については、 人脈や権威とかの特別な条件 が 必要になるパターンが多いです。 せっかく なまいきスクールに入ってる人 は こういう繋がりを作る場 としても 利用してほしいですが、 普通の人は 再現しにくいのが他力活用。 そこで、 初心者にとって超大事になるのが ①コツコツ型を着実にこなすこと です。 もっと具体的にいうと 「これやっとけば属性認知されるし、エンゲージも高まるし、認知もある程度広がっていくよね」 という行動を毎日のルーティンに落とし込んで、コツコツ継続すること。 脳筋パワー作業 が 一番再現性高く伸びますw 多くの初期垢で反応がとれないのは、 この初期のパワー貯めなしに いきなりポストで伸ばそうとするから 。 なので、 最初は基本ルーティンを学びましょう。 金稼ぎにおいて大事なのが 最初からむずいスキルを いくつも身につけようとしないこと 。 これをやっちゃうと 時間がいくらあっても足りません。 まずは今すぐできるルーティンで アカウントパワーを高めつつ よりマネタイズにおいて重要な、 次のステップの準備 をしましょう！ それではここから、 具体的なルーティンを掘り下げましょう。 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/oyuMJdIzdjEt/lesson/gAEtzSwfznL7","createdAt":"2026-05-15"},{"id":"scr-1779455314509-hvbeyw","title":"15-3 フロントポストの作り方 | なまいきスクール会員サイト","category":"material","content":"15-3 フロントポストの作り方 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/B5c2IvB2AwtE/lesson/iY39vaMBWIsU","createdAt":"2026-05-15"},{"id":"scr-1779455314509-outqcc","title":"3-1 はじめに「ポスト作成【入門】」 | なまいきスクール会員サイト","category":"material","content":"3-1 はじめに「ポスト作成【入門】」 それでは、ここから 「ポスト作成【入門】」 に入っていきます。 突然ですが質問です。 Xのポスト内容を ぽんぽん思いつく ことができますか？ 何をポストすれば 稼げるアカウントになれるか 言語化 できますか？ 初心者の よくある挫折ポイント ですが、 ✅️ １つ作るのに時間かかる ✅️ ポストが思いつかない 場合によっては、 1日分のポスト作成に5時間 かかる人もいます。 最低限の「ポスト作成力」 があって ようやく スタート地点 に立てるのです。 なので、今回は ポスト作成の基礎を しっかりマスターしてきましょう！ 今週のねらい 1️⃣ ポストが作れない、 ネタがない状態から 完全に卒業する！ 2️⃣「売るためのポスト」 「目的を持ったポスト」を 短時間で作れるようにする！ 「ポスト作成【入門】」では 1️⃣ ポスト作成の目的 2️⃣ ポストネタ50選 3️⃣ 伸びるポストのコツ 4️⃣ ポスト作成GPTsの使い方 5️⃣ ポスト作成ルーティン 基本的な ポスト作成で必要な知識 を マスターしてもらいます。 Xを見ていると ポストが 目的化 してる人が多いです。 「目的はないけどポストするか…」 「思いつかないからノウハウ呟いとこ」 「とりあえずインプ稼ぎを…」 👆️これでポストしても 意味がない 。 ポストを考える際は、 この目的意識が重要！ 現時点では、 ❌️「ポスト内容が思いつかない！」 ❌️「何ポストしていいかわからん！」 という人が多いと思いますが、 全て見終わる頃には 「〇〇のためにポストする！ （なんのために）」 「この内容でポストするぞ！ （何をポストする）」 「ポストの作り方は⋯ （どうやって作る）」 すべて即答できるようになるはずなので ぜひ気合い入れていきましょう！ 次の記事では 何のためにポストするのか？ を解説していきます！ TODOリスト 動画講義を視聴して、 ポスト作成について理解しよう！ 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/IMgvAdDhz9MJ/lesson/GIPX6t5PcDAW","createdAt":"2026-05-15"},{"id":"scr-1779455314509-ijetzq","title":"20-2 売上をデカく左右する無料部分について | なまいきスクール会員サイト","category":"material","content":"20-2 売上をデカく左右する無料部分について 文章だけで億売ったセールスレター特講： https://namaikilog.com/free-contents/syoaku-sales/ 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/yKK1BqLQVU8l/lesson/jjMLjBtmXCJB","createdAt":"2026-05-15"},{"id":"scr-1779455314509-izorzo","title":"15-3 実演 フロントポストの作り方 | なまいきスクール会員サイト","category":"material","content":"15-3 実演 フロントポストの作り方 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/B5c2IvB2AwtE/lesson/EdmBmW5pIFto","createdAt":"2026-05-15"},{"id":"scr-1779455314509-weaebn","title":"7-1 爆速で伸ばしたければ界隈で認知を取れ | なまいきスクール会員サイト","category":"material","content":"7-1 爆速で伸ばしたければ界隈で認知を取れ それではLv.7では、 最短を伸ばすための 界隈型運用の極意 を伝授していきます。 Lv.5でも プレイヤー型の運用 という 初期垢伸ばしの戦略 を話しましたが、 今回はまた別角度から 初期垢を爆速で伸ばしていくための 立ち回り を語っていきます。 まず前提として… よくXで正しいとされてる 「X運用ノウハウ♪」 はだいたい間違ってます。 Xで有益情報を発信していたら 発信に興味がある人が集まってきて 彼らに商品を売れば稼げる。 これは一見正しそうに見せるのですが、 残念ながら実際はうまくいきません。 それはもちろん、 初期垢にはフォロワーがいないから 。 ❌普通の運用 有益なポストをしていたら お客さんが集まってくる これだと、 まず核になるフォロワーがいない ので 伸ばすのにめちゃくちゃ時間がかかり ます。 以前にレバレッジの話をしましたが、 自分１人の影響力だけで コツコツフォロワーを0から集めよう としても 無人島で叫んで集客してるようなもん なので、 最低でも半年〜１年は時間がかかる と思ってください。 じゃあ、 なまいきくん式の運用法 はと言うと… ⭕️なまいきくんの伸ばし方 すでに人が集まってる場所から フォロワーを引っ張ってくる なまいきくん式の場合は、 ゼロから集めようとせず すでに人が集まってる場所（界隈）から 人を引っ張ってくる方法 を取ります。 これ詳しく説明しますが、 これを 「界隈型の運用」 と呼びます。 まだあまりピンときてないと思うので、 具体的に解説しますね！ 界隈型運用の極意 Xには界隈という 「村」 があります。 これについては、 前の講義でも触れました。 ・コンテンツ販売界隈 ・ナンパ界隈 ・浪人界隈 ・物販界隈 ・ライター界隈 ・AI界隈 etc. ゼロから自分の発信力だけ で 集客してたら1日+10人とか が 限界かもしれませんが、 すでに見込み客が集まってる 界隈に狙いを定めて認知を取れれば 一気に+200人、+500人 と増やすこと も 何もむずかしくありません。 図にするとこんなイメージです。 A界隈：人口20,000人→ +1500人 C界隈：人口50,000人→ +3500人 A界隈：人口80,000人→ +5000人 という感じで、 それぞれの界隈から たった数%集めるだけ でも、 簡単に 1万フォロワー くらいを 集めることが可能 です。 ✅ゼロから自分で集客をする ✅すでに人がいる場所で認知をとる この 手法と難易度の違い を まずは理解してください。 わかりやすく比較すると、 こんな感じイメージです👇 ✅ 普通の運用方法 人通りのない場所に店を開いて １人で頑張って店に呼び込みをするのか？ ✅ なまいきくん式 界隈型運用 すでに人で賑わってる商店街や デパートに出店するか？ という違い。 もっと極論いっちゃえば、 誰もいない教室に30人連れてくる より 人がいる教室でデカい声で奇声発したほう が 早く注目集めれるよねって感じですw なまいきくんは常に 「他人の力を使って伸ばせ」 と言っていますが、 なまいきくん式の運用方法はまさに 界隈の集客パワーを使って 短期間でフォロワーを増やす方法 です。 ゼロから人を集める必要がなくて、 ただすでにいる人の 興味を引くだけ なので 慣れると非常に早く楽に伸ばせます。 なまいき垢の場合 なまいき垢を最初育てたときも 界隈型の運用 を使いました。 当時、 勢いがあったとある界隈で 月1000万円以上売っている 発信者の話 を聞きました。 リサーチがてら、 その人の商材やアカウントを見てみると 商材はへぼい 運用もそこまでうまくない 実績でも勝てそう というのがわかったので、 最初はそこの界隈を狙いました。 上手く界隈に馴染めるように アカウントの雰囲気、名前 商材のパッケージの雰囲気 などはその界隈に寄せてましたね！ 当時販売した商材 フォロワー増加的には 月1000人ペース で増えていて、 そのおかげもあって 運用2ヶ月目で月420万円稼げました。 ナンパ垢を運用してたときも 同じやり方を使って 1日1000人増やしたこともありますw 短期間でフォロワーを集めたければ というのを まずはイメージとして頭の中に 持っておいてください！ それでは次の項目で、 具体的にどうやって界隈の中で 認知をとっていくのか？ というノウハウを語っていきます。 まだまだ 初期垢の人が大半 だと思いますが、 ここで 超差がついてくる重要フェーズ ですし むしろ 初期の立ち上げさえ突破しちゃえば、 マネタイズはすぐそこなので 頑張っていきましょう！ 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/SmN29szfV1nk/lesson/oJl6FNYlTtWh","createdAt":"2026-05-15"},{"id":"scr-1779455314509-ffucog","title":"20-3 真似すればできる売上の初速をつける施策 | なまいきスクール会員サイト","category":"material","content":"20-3 真似すればできる売上の初速をつける施策 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/yKK1BqLQVU8l/lesson/iaLGFgIakyFj","createdAt":"2026-05-15"},{"id":"scr-1779455314509-dwnqww","title":"SNSマーケティング完全攻略③〜過去の講義との共通点〜 | なまいきスクール会員サイト","category":"material","content":"SNSマーケティング完全攻略③〜過去の講義との共通点〜 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/cafUI3QFQSfy/lesson/lCt7kvyJPdVs","createdAt":"2026-05-15"},{"id":"scr-1779455314509-wpejfo","title":"13-1 売上を最大化する資産について | なまいきスクール会員サイト","category":"material","content":"13-1 売上を最大化する資産について 今回のLv.13は 電話セールス&商品作成なし 一撃で高報酬を狙えちゃう 高単価アフィ入門講義 というテーマで話していきます！ 前回の講義では ゼロからのマネタイズ入門講義 ということで ・マネタイズの種類 ・全体像を俯瞰してみる みたいな話をしてきました！ 最初の講義から一貫して話してきた 逆ピラミッド型 にお客さんを集めて セールスにつなげていく部分 だとか、 SNSにおいて お客さんを商品案内や面談に 連れてくるための６つのステップ みたいな部分を 1つ1つ掘り下げて説明したので 前回説明した マネタイズの概念や流れの部分 については、しっかり復習して 頭に叩き込んでもらえればと！ 今回はいよいよ 高単価アフィに関する重要な項目 に入っていきます。 さっそく その説明に入りたいところですが…！！ ちょっとその前に 売り上げを最大化する資産について というお話をしていこうと思います。 マネタイズに入る前に 売上を最大化する資産 の考え方を 知っておかないと 目先の利益 を追い求めるあまり 長期的に利益 を生み出してくれる資産を 自分でゴリゴリ削ってしまって 最初は ちょっと稼げた のに いつの間にか全然売上が立たない ゴミアカウント になってしまった… みたいな最悪な状況に なってしまうこともあるんですよね。 特に、 初心者ほどマネタイズを 焦ってしまう傾向 があるので 大事な話 だと思って聞いてください。 売上を最大化する 資産の考え方 なまいきくんは いつもXを運用するときに アカウントの資産性 を意識しています。 資産 →長期にわたって継続的に お金を生み出してくれるもの Xのいろんな発信者を見てると 有名な発信者が TipsやBrain を出したら なんでもかんでも アフィ参戦 して ひたすら目先のお金を 拾っている人が多いです。 もちろんスクール生の中でも 早く売上を立てるために Tipsアフィ しちゃおう！ という人もたくさんいると思います。 ただ以前から 雑談の中では何度か伝えてますが ぶっちゃけアフィとかで 安易に換金してしまうのは デカく稼ぐという目的では おすすめできません。 むしろ、 『絶対NG』くらいに 思っておいた方がいいです。 もしXマネタイズの目的が ・目先の小銭を稼ぐ ・資金がないから早めに収益化したい とかであれば もちろんお好きにどうぞ。 ですが、 売上最大化 という視点で見ると 焦ってアフィで換金しちゃうのは めちゃくちゃもったいない。 というのも せっかく目の前のアツいリストを 少額で「他人」に流してしまっている 行為と同じだから。 僕らが今まで何の目的で Xを運用してきたか？ を考えてみてください。 アツいリスト を 集めてくる目的ですよね？？？ 今まで、画像にある赤い枠の 見込み度の高い読者 を集めるために ひたすらX運用をしてきました。 アフィというのは 他人の商材に人を流す ということ。 つまりこれは、 せっかくピラミッドの最下層まで 連れてきたのに、 あと1歩で 1撃50万円、100万円 になる 可能性のある読者を たった 数千円から1万円程度 の報酬で 他人に流してしまう ことになるわけで。 もちろん 有料noteとかの自社商品 であれば、 商品を売ることで ファン化 につながったり することもあります。 実際、 ・田中のnoteを買った人 ・読んでない人 を比べると、 圧倒的に前者の方が 食いつきが高かったですね。 今まで The.Xや掌握などを読んできた読者 の ファン化度合いは その他の人よりも高いです。 他にも仲間内で 相性の良い商品 を 紹介し合うとかであれば 身内でフォロワーを囲い込める ので まだいいかもしれません。 でも、戦略もなく 目先の利益を求めて 赤の他人の商品をアフィしちゃうと、 せっかく育てたリストを 安く他者へ流す ことになってしまいます。 アフィは すぐに利益が出る ので 調子が良いと感じるかもしれないし ライバルが アフィで数万円 を 稼いでいるのを見ると ちょっと焦る気持ちが 出てしまうかもですが… ただ、 目先の利益 だけのアフィは 自分の 将来の利益を削り、 先に収穫している ような状態。 リストというのは 自分で囲って育てる ↓↓↓ 十分に熱量を高める ↓↓↓ 一気にマネタイズ この流れがトータルで見て 圧倒的に売上が出る方法。 さらにいうと 焦って アカウントが育ちきってない段階 で マネタイズしちゃうのも、 おすすめしていません。 Xでいろんな発信者を 見てて思いますが、 非モテ童貞みたいなセールス をやってしまって、 顧客を逃してる人が めちゃくちゃ多いです。 イメージしてほしいのですが ナンパで女の子と喋っているときに 全然食いつきが上がっていない状態 で 「ホテル行こう('◉⌓◉’)」 とか言っちゃったら 普通に逃げられますよね？？w いやいや急すぎるだろ的な。 もうちょっと雰囲気を作って 関係を深めたらいけたかもなのに、 ちょっとオファーが早いだけで ・こいつめっちゃグイグイくるな ・非モテ感えぐいな という雰囲気が出てしまうと。 これはセールスも一緒で たいして 食いつき が上がってない 読者の熱量 が上がってない状態で ・ひたすら他人の商品をアフィ ・セールスの投稿を連発 とかしてたら、 「こいつ業者やん…」 「たいして実績もないやろ…」 と感じられてしまいます。 ピラミッドの上部分で焦ってセールス ↓↓↓ 売れないどころではなく 読者が死んでいく と思っておいてください。 セールスにおいては タイミングが命 なので、 マネタイズを焦ると 資産を大きく削ってしまう ことになります。 この 危険性 を語ってる人が ほぼいないので マネタイズの具体的な話に入り、 周りが見えなくなる前に 重要なことなので話しておきました！ あと追加で 語弊のないように 認識の統一 をしておくと ・平均インプ→500〜1000以上 ・フォロワー300人以上 ・いいねも10~20件ほど 最初の講義で、 マネタイズ可能ライン として 上記の数値を示しましたが、 あくまでもこれは ❌ゴリゴリマネタイズできる最強の状態 ◎初心者が運用して マネタイズに着手できる最低ライン の数字です。 具体的に どういう数字かというと Xで ・XTEP ・プレゼント企画 ・軽いローンチ とかの企画をしたときに 最低限の初期の反応を取れるような フォロワーやいいねの水準 。 最初の段階では 初心者が集客にもっと苦戦 する ことを想定していたので、 ・平均インプ→500〜1000以上 ・フォロワー300人以上 ・いいねも10~20件ほど これらの数値を マネタイズ可能ライン として提示しましたが、 ぜひ反応が取れてきた人は ・平均インプ→1000以上 ・フォロワー→1000~2000人 ・いいねも20〜30件 こちらの水準を目指して アカウントをしっかり育ててください！ 実際なまいきくんも 運用をはじめて ちゃんとマネタイズしたのは 半年くらい後 だし 2年間、変なアフィとかをせず 低単価だけ売って育ててきた からこそ 2025年に 10億円 近い 売上を立てることができました。 クライアントの のんびりくんも 当時、 本人は焦っていましたが 最初の数ヶ月はほぼ何も売らずに アカウント育成だけをして パワーを貯めたからこそ 一撃 2500万円 その半年後に 7500万円 というでかい売上を 立てることができています。 マネタイズ期が近づくにつれ、 ライバルの伸びや売上が目に入って 不安に思ったり 焦って収益化を急いじゃったり する人がいますが、 デカく稼げる人は 常に長期目線で考えている んですよね。 資産性のないセールスをして アカウントを 削ってしまう のが めちゃくちゃもったいないので、 まだ アカウントパワー が育ってない人は 焦らずしっかりと運用を継続して 長期ででかいリターンを 狙って育てていきましょう！！ それではここから 高単価アフィの具体的な内容 に入っていきます！ 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/sS3dZSLvJ41O/lesson/XkUoLh8JRtgC","createdAt":"2026-05-15"},{"id":"scr-1779455314509-zxzgqb","title":"8−1 Xがうまい人の頭の中と運用改善の考え方 | なまいきスクール会員サイト","category":"material","content":"8−1 Xがうまい人の頭の中と運用改善の考え方 それでは今回はLv.8 XでのPDCAの回し方と 伸びる運用者の心構え というテーマでお話ししていきます！ X運用スクールをはじめて １ヶ月半ほど経ちましたが… 調子はいかがでしょうか？ 1番はじめに 目標として ３ヶ月目で以下の数値 を マネタイズ可能域 として提示しました👇 これに近づけてきてますか？ おそらくですが、 元からアカウントがあった人 は 講義内容を実践してもらえたら インプ・フォロワー数は かなり上がってるかな と思います。 一方で ゼロから運用の人 は 現段階ではまだ軌道に乗るか は 微妙な時期ですが まだ伸びてない人 ちょっと伸びたけど停滞してる人 も心配する必要はありません。 なぜなら、 1番大事なのは自分で数値を見て 運用改善の施策を打てることだから です。 なまいきくんの場合は、 常に数値を見ています。 ポストした直後の初速 30分後、1時間後のインプの伸び 1日後にどれだけ伸びているか？ リスト数はどれだけ増えてるか？ フォロワーの増減は？ etc. 特に運用に力を入れてる時期は ポスト直後はこまめにチェックしてます。 Xではあまりこういう 地味な部分は言いませんが、 これだけ数値を見ているからこそ アルゴリズム変化には 誰よりも早く気が付きます し そのおかげで X始めてから５年以上 、 常に伸ばし続けることができています。 なので、 今回の講義ではなまいきくんが 具体的にどの数値を見ているのか？ そして、 どんな施策を打っていけば それぞれの数値が改善するのか？ という部分を詳しく 掘り下げていこうと思います！ 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/DXou0EuAyBQd/lesson/SUjw2WEFQPDQ","createdAt":"2026-05-15"},{"id":"scr-1779455314509-klryor","title":"今週のタスク（Lv.5 初期の運用戦略） | なまいきスクール会員サイト","category":"material","content":"今週のタスク（Lv.5 初期の運用戦略） TODOリスト 今週のタスクを完了しましょう！ 1.動画講義を視聴する 5-1 初期垢を爆速で伸ばす立ち回り 5-2 興味付けポストの作り方 5-3 フェーズ別ポスト戦略 2.プレイヤー型の自分像を明確にしよう 自分が発信するジャンルの プレイヤーとしてどんな様子を見せるか？ どんな実績を見せるか？ どんな日常を発信するか？ どんな行動の様子を見せるか？ を箇条書きにして書き出しましょう！ 例： ・物販で実際に仕入れてる様子 ・利益を出ました報告 ・同業者と利益情報を交換してる様子 ・仲間に教えてる様子 ・物販プレイヤーとしての自慢風独り言 軸がブレないように メモ書き程度に3~7個くらい 書き出しておくだけでOKです！ 3.運用に興味付けポストを取り入れる そろそろ運用にも慣れたと思うので 5-2、3を参考にプレイヤ オワコンです😇 こういう言葉で 読者の興味 を引きます。 ポイント3：読者アクション ✅️ どんな反応をして欲しいのか？ ポストを見た読者に どんな反応をして欲しいのか？ いいね・リポスト リプ・引用リポスト etc これを決めてポストを作ることで 「インプが伸びてエンゲージも高い」 つまり 反応が取れるポスト になります。 詳しく知りたい方は コラムの「アルゴ攻略note」 を読んでください👇️ ＞＞アルゴ攻略note 細かいアルゴは日々変わりますが、 変わらない本質部分 があります。 その考え方 について説明しています！ そして今回、 ✅️ ターゲット ✅️ 読者アクション ✅️ フック この3つを組み込んだ 「Xポスト作成GPTs」 も用意しました。 ＞＞ポスト作成GPTs ＞＞ChatGPT使い方マニュアル 使い方は👆️使い方マニュアルに 記載されていますが、 流れはこんな感じです。 Xポスト作成GPTsの使い方 1️⃣ポストの文字を指定 2️⃣ポスト元ネタを送信 3️⃣ターゲット、フック、 読者アクションを選ぶ STEP3： 反応が取れる ポストに仕上げる AIが出した記事 を 軽く修正 して投稿 時間にして 3分程度 で完了です。 ここについては、次の講義で 「伸びるポスト作成のコツ」 を説明しているので、 どこに着眼すればよいか？ 何を意識したら良いのか？ など確認してみてください！ 他にも、 口調を自分のキャラ に合わせたり 知識で肉付け してもOK。 最初は 「ポストネタ集」 から 切り口を探していけばOKです！ 慣れてくると 自分でポストのアイデアが 思いつくようになります！ この流れでやれば 5分足らずで 1ポスト作成 できるようになります。 GPTs自体にも 伸びるポストの要素を インストール してあるので 反応がとりやすいポストが作成可能です！ ⚠️ポスト作成の注意点 最後にポストについての 心構え・注意点 を説明します。 ⚠️注意点① 最初は反応が取れなくて当たり前 というマインドを持つこと。 ゼロからの運用なら いいねもリプも来ないし インプも100以下です。 野球で例えると バットの振り方を習ったような段階です。 すぐに成果は出ません。 しかし、それでOKです！ 初期はどれだけ良いポストをしても 読者が 興味を持ってない ので インプも反応も来ません。 初期の運用方法 は、 Lv.5 で説明予定なので 今は練習だと割り切って、 「サクサク作れるようになること」 を目標に今は作業してください！ ⚠️注意点② ポストは 意図を持って作ってください 「ポストの目的」の講義でも話しましたが、 ポストは目的意識が大事 。 「ただポストが作れる」 では正直 意味がありません。 「誰に向けて刺しに行くポストなのか？」 「読者にどんな感情になってほしいのか？」 ここをいちいち 言語化して意識してください。 まとめ ポスト作成の流れ 3ステップ 1️⃣投稿ネタを選ぶ 2️⃣文章化してポスト作成 3️⃣反応が取れるよう仕上げる こんな流れを説明してきました！ ⚠️注意点 ①最初は反応なくて当たり前精神 ②ポスト作成は目的意識を持つべし 今週のタスク ✅️ タスクその１ 厳選ポストネタ集に目を通しましょう。 ＞＞【特典】厳選ポストネタ集 ポストの基本はパターンゲームです。 「切り口×テーマ」 でネタを決めて どう反応がとれる文章に落とすか？ を考えるだけです。 切り口のパターンを知るために 一通りネタ集に目を通してください。 ✅️ タスクその２ ポストを30個作成しましょう ＞＞ポスト作成GPTs 初期は 1日5ポストが最低ライン です。 目立ちたいなら 10ポストくらいしたほうがいいです。 練習の意味も兼ねて できるだけ多く作成し、 実際に投稿しましょう！ 次の記事では 「反応率UP！伸びるポストのコツ」 を解説します！ TODOリスト 1.厳選ポストネタ集に 目を通しましょう ＞＞厳選ポストネタ集 に目を通しましょう！ 切り口のパターンを知るために まず一通りネタ集に目を通ておきましょう ポスト作成について詳しく知りたい方は ＞＞コラム：アルゴ攻略note を読んでください！ 2.ポストを30個作成しましょう ＞＞ポスト作成GPTs を利用してポストを作りましょう！ ＞＞ChatGPT使い方マニュアル ↑使い方はこちら！ 練習の意味も兼ねて 少しでも多くポストを作成して 実際に投稿していきましょう！ 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/IMgvAdDhz9MJ/lesson/x9caDxAnVFrz","createdAt":"2026-05-15"},{"id":"scr-1779455314509-xeulqh","title":"Lv.10 講義QA | なまいきスクール会員サイト","category":"material","content":"Lv.10 講義QA Lv.10の内容でいただいた質問に回答しました！ Q-1：ポストの重要性って言うと、教育の重要性と同義ですか？ A-1：そうですね。ポストの五つの目的（認知、関係構築、教育、リストなど）全てに関わります。結局、教育だけをしていてもリストがいなければ意味がないし、数が多いだけでも見込みが低かったら意味がないため、教育は本当に大事です。 Q-2：スペースに参加するインセンティブはどういうものがありますか？ A-2：無限にあります。 ▪ 例として、文字よりも音声媒体の方が情報量が多く、頭に入るという事前教育をしておくことで、音声の価値を上げることが挙げられます。 ▪ また、文字に残るとやばいような倫理的にアウトな裏情報でも、スペースなら口が滑って言ってしまうかもしれない、といった期待感をポストしておくこと。 ▪ 「100万稼げるロードマップ」のような特典提供だけでなく、単純に生粋君の顔が見られるかもしれないといった同期（インセンティブ）も考えられます。 ▪ とにかく、「スペースやるんで来てください」という告知だけではなく、 来たくなるような動機（インセンティブ） を作るのが重要です。 Q-3：100人の雑草からもフォロワーを伸ばすのに今みたいにお話はインセンティブ戦略は効果的ですか？ A-3：100人しかいなかったら、インセンティブ設計をしても見られる数が少ないので、この内容は違うと思います。興味付けを強めたり、交流を増やしたりする方が良いです。そもそもベースとして、もっと見られる数を増やさないとどうしようもない、という段階です。 ▪ （補足：読者に仕掛けるインセンティブ設計は、仕掛ける読者があまりいないため、通知を仕掛ける数を増やした方が良い、つまり土台作りが先である、という意味合い。） Q-4：まだ初期段階でフォローしてフォロワーを増やしているんですが、同じジャンルの業者的なアカウントをフォローしてもよろしいでしょうか？ A-4：状況や目的（例：市場リサーチのため、フォロワーを増やすため）が分からないため、何とも言えないです。目的を書いてもらえれば答えやすいです。 前へ 受講済みにする 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/lmKPPner7s0L/lesson/a0USQyg8GWOj","createdAt":"2026-05-15"},{"id":"scr-1779455314509-bukdig","title":"リアルインタビュー | なまいきスクール会員サイト","category":"material","content":"リアルインタビュー 受講済みにする 受講済み","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/7rAS9p6n7r5a/lesson/D7k1VTrV13hD","createdAt":"2026-05-15"},{"id":"scr-1779455314509-gmzxzw","title":"3-2 何のためにポストするのか？ | なまいきスクール会員サイト","category":"material","content":"3-2 何のためにポストするのか？ それでは、本記事のテーマ 「ポスト作成の方向性とコツ」 についてお話しします。 なんのためにポストするの？ Xを見ていると、上級者の人でも 目的意識を持たずにポストしている人 がいっぱいいる。 例えば ✅️ 思ったことをポストする ✅️ 学びをアウトプットする ✅️ 有益情報をポストする ✅️ 伸びてる投稿を真似てポストする これくらいの 認識に 止まってる人が非常に多いです。 そういう人は残念ながら、 この運用でデカく伸びることはありません！ 他の 「X運用の教材」 をみても、 ✅️ 伸びやすい投稿の型 ✅️ 反応が取れるキラーワード みたいな情報が語られていますが、 こういう 枝葉ノウハウを使ってるだけでは 成果が出ることは一生ない！ なぜなら、Xが伸びるか否かは １つ１つのポストの問題じゃないからです。 例えば、 なまいきくんの運用アカウントは １つ１つのポストが全て素晴らしいか？ というと そうではありません。 文章力もそこそこ だし、 一見、 意味のないポスト もある。 単体ではイマイチなポスト もある。 ✅️ じゃあなんで なまいきくんは常に 伸びているのか？ それは ”ポスト全体” で見たときに、 「見込み客が集まって」 「商品が売れるように」 ということ 考えてポスト しているから。 これこそが、 Lv.2で話した 「情報発信=山登り」 の考え方であり、 今から説明する、 「ポスト作成の目的」 になります。 目的を押さえておかない限り、 どれだけポストをしてフォロワーが増えても 意味がないし売上に繋がりません。 仮にフォロワーが伸びたとしても、 ✅️ 成果が出る理由を言語化できてない ✅️ 運ゲー状態なので 安定した集客ができない 👆️こんな状態になってしまいます。 まず前提として、 「ポスト作成の目的」 をおさえます。 ↑これ頭に入れておいてください。 ポスト作成の目的とは？ 「ポスト作成の目的」 はXのビジネス運用において、 大きく分けて５つあります。 1️⃣ 認知獲得すること 2️⃣ 興味付けすること 3️⃣ 関係構築すること 4️⃣ 教育すること 5️⃣ リストインすること ※ 「興味付けや関係構築も教育に入る」 など 厳密には要素に被りがありますが わかりやすくこの５つです。 それぞれ深掘りしていくと、 1️⃣ 認知獲得すること インプレッションをとって 見込み客層に対して、 「こいつ見たことある」 と思わせる状態を作ります。 2️⃣ 興味付けすること 「こいつおもろそうやな」 「自分が知らん情報持ってそう」 と興味を持たせて 発信を見る姿勢 にさせます。 3️⃣ 関係構築すること リプ‧引用などで絡み、 市場に馴染んで不信感をなくす 同じ界隈の人に絡んで 信頼関係 を構築します。 4️⃣ 教育すること 金を稼ぎたいと思ってる読者の 欲を刺激 して、 \"情報を欲しく\"させる 他の手法で稼ぐ選択肢を消して 自分の教える手法に限定 していきます。 5️⃣ リストインすること 「相談のる」 「プレゼント渡す」 理由をつけてLINEやDMに誘導し 直接連絡を取れる状態 にします。 わかりやすくすると、 認知してもらい ↓↓↓ こいつおもろいやん ↓↓↓ ある程度の関係構築をした上で ↓↓↓ 欲望を揺さぶって こいつの手法いいやんと思わせ ↓↓↓ こいつの情報知りたい！ と公式LINEに誘導する あとは セールスマンが売ってくれて チャリーンとお金が入ってきます💰️ 極論、全てのポストが この5つのどれかの目的 のために 作られるべきなのです。 ノウハウポスト であっても、 単なるノウハウまとめは あまり意味がありません。 読者が 知らない知識 を出して 「こいつ詳しそうやな」 と興味を持たせる みたいな 目的意識が重要 です。 例えば、 インプ獲得であれば、 「認知獲得」 を満たすことになるけど、 この 「目的意識」 がないとあくまでも 見込み客に認知をとること が重要なので、 無駄にバズ狙いして 関係ない層にインプ取っても 効果は薄くてコスパが悪い 。 初心者はこんな感じで 効果の低いポストしがち なので、 「目的のないポストはするな」 これを 心に留めておきましょう！ 今回のまとめ ポスト作成の5つの目的 1️⃣ 認知獲得すること 2️⃣ 興味付けすること 3️⃣ 関係構築すること 4️⃣ 教育すること 5️⃣ リストインすること そして、全てのポストは 5つの目的のどれかを担うべきです。 目的のないポストはしない 👆️これ 重要 です。 ポスト作成のノウハウを知る前に 目的意識 を持っておかないと 見当違いなポスト になってしまいます。 ⚠️この記事は繰り返し見てください！ 次の講義では、 え、ポストってどう作るの？ 簡単にできないの？ というみなさんのために、 なまいき式「厳選ポストネタ集」 を活用した、 5分でできる！ ポスト作成3ステップ について解説していきます！ もうポスト作成に 悩む必要はありません。 それでは 5分でできる！ポスト作成3ステップ に入っていきましょう！ TODOリスト 動画講義を視聴して、なんのために ポスト作成するのか理解しよう！ 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/IMgvAdDhz9MJ/lesson/S8NIhvl97WFr","createdAt":"2026-05-15"},{"id":"scr-1779455314509-dmbcvd","title":"4-4 基本すぎて誰も語らないXの動作について | なまいきスクール会員サイト","category":"material","content":"4-4 基本すぎて誰も語らないXの動作について Xを見ていると、 正直僕が代わりに運用したら楽勝に伸びるな 、 というアカウントがたくさんあります。 今はインプもほぼついてないけど、 僕が２〜３日も運用したら 余裕で5000インプ以上出せるな… みたいな感じです。 これは、 ポストや立ち回りなど の テクニック的な部分 だけに 言えることではありません。 普段、どんなアカウントに 交流していくのか？ どんなリプをしていくのか？ どうやって引用するのか？ という基礎的な部分においても、 あー、もったいないことしてるな。 みたいなパターンが多くあります。 ですが、こういった部分は 基礎的すぎて誰も語ることがありません 。 だからこそ みんな我流でやっていて 差がつくポイント にもなります。 （よくいう”立ち回り”のうちの１つですが、 地味なのでスルーされがち。） せっかく スクールとして ゼロから順番に学べる ので そこを少し掘り下げていこうと思います。 ある程度、運用経験がある人でも 下手くそな人ばかりなので 「自分は大丈夫だ」 と思わずに 復習のつもりでみてください。 どんなアカウントに 交流していけばいいのか？ 交流対象の選び方 「いいねやフォローをルーティン化しろ」 「リプで絡んでいけ」 という話をしましたが、 もちろん無差別にフォローやいいねをしても ほとんど意味がありません。 フォロワー100人のアカウント が 1万フォロワー越えの発信者 に リプしたところで 返信がくる確率は極めて低いですし、 逆によくわからん趣味垢に 必死でリプしても、 「何この業者キモ…」 と思われて終了です。 フォローやいいね、リプの目的 が 交流を増やして アカウントパワー を育てること 属性認知 を育てること である以上、 目的に沿ったポストをせねばなりません。 そこでいいねやリプで 狙うべきアカウントの最低条件 は ① フォロワー数が近い(同じ~少し上) ② アクティブにポストしてる ③ 自分と関連性が高いジャンル この３つを押さえてること。 自分のフォロワー数が500人なら 800から2000人くらいの規模 で 毎日動いてリプや引用で 人と絡んでるアカウント を探します。 もっと具体的に考えていくと… Xには 「界隈」 という概念があります。 Xにおけるジャンルごとの 「村」 みたいなものです。 先ほどの記事で挙げたこの図の、 １つ１つが界隈 だと思ってください。 ビジネス界隈の中にも ・ライター界隈 ・Webデザイン界隈 ・動画編集界隈 ・コンテンツ販売界隈 ・プログラミング界隈 ・AI副業界隈 みたいに分かれていてる感じ。 厳密にいうと さらにその中にも 「Aさんの界隈」 「Bさんの界隈」 みたいに分かれてます。 そして、 界隈の中にはいろんな発信者 がいます。 大きく４つに分けると わかりやすいです。 ✅ 大手アカウント インプ2000~5000以上 ついてて フォロワーも1万人以上 いるような 影響力があるアカウント。 ここに引用されたりとか 注目されると一気にフォロワーが 増加する可能性 があります。 認知されるだけでも かなりのインパクト。 ✅ 中堅アカウント 「中堅アカウント」 は 少し下がって フォロワー1000~5000人 で そこそこ勢いがあるアカウント。 成長中なので、 大手アカウントよりも引用したら リポストやリプをもらいやすい です。 ✅ 大手の周辺（常連リプ勢・腰巾着系） 大手垢や中堅垢のリプ欄 を見ると いつもいる ”常連” たち。 この層が一番アクティブで、 ここに混ざることで 「界隈の空気」 に入りやすくなりますし、 大手からも 「よく見る人」 として 認知されやすくなります。 ✅ 初心者 フォロワー300人以下のアカウント。 比較的リアクションも返って来やすく、 距離が近いので信頼構築をしやすい。 自分の攻め込みたい界隈の 大きく分けてこの４種類のターゲットに 積極的にアクションして こちらの存在を気づかせましょう 。 とくにいきなり大手はむずいので、 少し上くらいのフォロワー数の人 から 徐々に狙ってく のがおすすめです。 ある程度の規模のアカウントと 交流できるようになると その下から認知されやすくなります！ 特にフォロワーは少ないけど、 インプが伸びている 例）1000フォロワーだけど 2000~5000インプ出てる人 みたいな人は 運用がうまく伸び盛り なので、 そういう人に絡んでおくだけでも おこぼれで勢いがつきやすいです。 実践ステップ ① 大手5人、中堅1 事の8割は完了 しています。 なので、 今までのパートでは ひたすらピラミッドに 流れてくる人数を 最大化 しつつ 熱量を上げるための技術を 11回の講義＋添削＋質問会 で 徹底的に伝授してきました。 実際にこれまでの講義で かなりインプが取れたり フォロワーが伸びたりして 勢いがついている人も結構います。 大事なのは 今までの内容と これからの マネタイズ に関する話は 決して 無関係なわけ じゃなく、 繋がっている ということ。 なので この ピラミッドの流れのイメージ を まずは持っておいてください。 そして、ここから先の内容で 伝えていくのは 見込み上げした読者 ↓↓↓ セールスマンへ繋ぐ ここのマネタイズの部分。 しっかりと学んでおかないと、 「せっかくフォロワーを集めたのに、 全然に売上に繋がらん・・・」 という悲劇が起きてしまいますし 見込み度をあげた人のうち、 ・10％しか セールスにつなげないのか？ ・50、70％ をつなげるのか？ によって売上も 5倍、7倍 になります。 差がつきやすい部分 なので、 ちゃんと知識をつけていきましょう！ マネタイズステップを 具体的に見てみよう じゃあ ここから先の マネタイズステップ を 詳しく見ていきましょう。 まず機能的な部分だけを見ると XなどのSNSで集客 ↓↓↓ LINEなどのリストへ という流れになります。 もちろん Xで 直接セールス もできますが、 Xはアルゴリズムの性質上 全員には配信を届けられません。 特に高単価を売る場合、 リスト化して 何度もアプローチできるように LINE登録者を集めておくのが効果的。 なので、 見込み上げをして リストを取るためにX運用をする くらいのイメージを 持った方がわかりやすいかなと！ そしてセールスにつながっていきます。 一連の流れとしては以下の感じ。 XなどのSNSで集客 ↓↓↓ LINEなどのリストへ ↓↓↓ セールスレターを流す 個別面談に誘導して商品をセールス ざっくりこの 流れ を 頭の中に入れといてください。 ただ、ここまで 講義を見た人はわかると思いますが ・Xの人が簡単にLINEを登録してくれるか？ ・個別面談に参加してくれるのか？ と言われたら そんなに簡単 ではありません。 そこで 何かしらの教育やインセンティブ が必要になるのです。 お客さんの状態を しっかり 変化させる ために より 細分化 して マネタイズの流れ を見ると、 認知を広げる ↓↓↓ 見込み上げ ↓↓↓ 導線に向けて食いつき上げ ↓↓↓ リスト化 ↓↓↓ セールスマンへつなぐ ↓↓↓ 個別面談 こんな感じになりますね。 すでにやってきたのは、 認知を広げる ↓↓↓ 見込み上げ この2つの部分。 さらにリストに流す前に 再度食いつき上げとして 興味づけを入れていきます。 Xでいうローンチでの事前プロモーション のようなイメージ。 この段階(導線に向けて食いつき上げ)で、 「 どれだけ熱量をあげられるか？」 が 重要になります。 ここ次第で リストになる人数 が 大きく変わってくるので！ そして 十分に興味を持ってくれたところで リスト に落としていきます。 リストにしていく際には、 プレゼントなどの わかりやすいインセンティブ を使うのが 1番効果的 です！ そのために、 プレゼント企画やXTEP を 活用しましょう。 リストにつなげるために 簡単な特典 コンテンツを用意する 必要がありますが、 今の時代はAIもあるので、 うまく使えばかなり時短 になります。 コンテンツの用意の仕方 は 後の講義でお話ししますね！ LINEへのリスト化ができたら、 最後はセールスマンに つなぐステップ。 セールスマンにつなぐ ステップは スクール生からすると 最後の難関と言えるでしょう。 高単価アフィをする人が 多いと思うので その前提で詳しく見ていくと… まず セールスマンに繋ぐために 何をすればいいのでしょうか？ 代表的なものを挙げると、 ・教育記事を流す →その最後に面談へ誘導 ・動画コンテンツで教育 →その最後に面談へ誘導 ・顧客と個別でチャット →会話の流れで個別面談へ誘導 ・セミナーを開催 →その最後で面談に誘導 などのものがあります。 なまいきくんの部下(田中)が 販売した事例では 個別チャットで 直接お客さんとやりとり ↓↓↓ 「ロードマップ作成しますよ」 「個別アドバイスしますよ」 という流れで 個別面談に誘導しました。 高単価アフィ じゃなく コンテンツ を売る場合も 手順はほとんど変わらなくて、 誘導先が 個別面談が 『人間』 なのか セールスレターという 『文章』 なのか というだけの違いです。 今回の講義の最初に マネタイズ方法は 4つ しかない という話をしましたが ・高単価アフィ ・コンサル・スクール ・アフィリエイト ・コンテンツ販売 どの手法を選んでも、 この大きなマネタイズの流れは変わりません。 全体をもう一度見てみると Xで集客 ↓↓↓ 読者の見込み度を上げる ↓↓↓ 再度食いつき上げとして興味づけ そして プレゼント企画 XTEPなどでリスト化 ↓↓↓ 教育記事(動画)、セミナー、チャットで セールスマンに繋ぐ教育や 自然な流れを作る ↓↓↓ 個別面談やセールスレター(ゴール) 「この 流れ は大変だな・・・」 と思うかもしれませんが、 マネタイズの流れによって 一撃で 10万、20万のリターン が得られる と思えば期待値は高くなります。 さらにお客さん視点で感覚的に わかりやすく流れを整理すると まだまだ客(認知拡大) ↓↓↓ 興味を持つ(見込み上げ)→Lv.11までの話 ↓↓↓ 興味ポストで食いつきアップ ↓↓↓ LINE登録(プレゼント企画など) ↓↓↓ 面談への教育 (チャットやセミナー教育記事) ↓↓↓ セールス(個別面談) この一連の流れが Xマネタイズの土台で、 基礎基本 になります。 金稼ぎが苦手な人は ・アフィリエイト ・コンサル販売 ・note など、 目先の『手法名』 ばかりに 目を奪われて マネタイズの 全体像(流れ) が 頭に入っていません。 ですがここまで 講義を聞いている人は わかると思いますが、 たとえば noteと高単価アフィ って パッと見は違う手法に見えるけど、 ・最後のセールス部分 →noteを売る ・最後のセールス部分 →個別面談でコンサルを売る という違いでしかありません。 それ以前にある、 マネタイズまでの流れ自体は ほとんど変わらない のです。 まだまだ客(認知拡大) ↓↓↓ 興味を持つ(見込み上げ) ↓↓↓ 食いつきアップ (導線に向けて食いつき上げ) ↓↓↓ LINE登録(リスト化) ↓↓↓ 面談への教育 (セールスマンに繋ぐ) 今回の講義の内容が 理解できてない場合 ・この後の講義が全て理解不能に ・武器を手にしたけど使い方がわからん という 悲しい状態になってしまうので 今回の講義 特にこの 『12ー3』 については 確実に何度も見返して 流れを頭に入れておいてください。 講義の内容をマスターし いつでもこの流れが作れる！ という状態になれば、 なまいきくんみたいに サクッ と商品を作って デカく稼ぐ！ みたいなことも可能になりますし、 TipsやBrainアフィ をするときも どう売ったら売上が最大化するのか ということが 手に取るようにわかってきます。 もっというと X以外のSNS(Youtubeやインスタなど ) を使った場合も、 認知拡大 ↓↓↓ 見込み上げ ↓↓↓ 導線に向けて食いつき上げ ↓↓↓ リスト化 ↓↓↓ セールスマンにつなぐ ↓↓↓ 個別面談 この流れの 入り口が変わるだけ で マネタイズまでの 手順は一緒 です。 なので長期的には 別のSNSに展開 することも可能。 そして 今回は マネタイズの流れ を 徹底解説してきましたが この内容を把握すれば マネタイズまでに 具体的に何を準備していけばいいか が明確になります。 Lv.12の最後では このマネタイズまでに やっておくべき準備 についてまとめて マネタイズに備えていこうと思います！ 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/gcftwclZ5VXk/lesson/RbJJXUG4Gmp7","createdAt":"2026-05-15"},{"id":"scr-1779455314509-xronds","title":"教育記事完全攻略②〜売れている記事4本を追っていく〜 | なまいきスクール会員サイト","category":"material","content":"教育記事完全攻略②〜売れている記事4本を追っていく〜 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/ypISHOtWAVVp/lesson/K9ZZqksTSZif","createdAt":"2026-05-15"},{"id":"scr-1779455314509-atlpfo","title":"リアルインタビュー | なまいきスクール会員サイト","category":"material","content":"メインレッスン リアルインタビュー 受講する","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/7rAS9p6n7r5a","createdAt":"2026-05-15"},{"id":"scr-1779455314509-rjjkuv","title":"Lv.8 講義QA | なまいきスクール会員サイト","category":"material","content":"Lv.8 講義QA Lv.8の内容でいただいた質問に回答しました！ Q-1：ポストの平均インプレッション（インプ）について、伸びにくい教育系のポストは計算から除外した方が良いか？ A-1：無作為に全てのポストを含めて1日の平均インプとして見れば良い。伸びにくいものを含めての平均インプであるため、除外すると意味がなくなる Q-2：初期段階での1日のポストの合計インプの目標はどれくらいか？ A-2：本当に初期であれば、合計1000インプ（例えば100インプのポストを10本）を目標にすると良い。 Q-3：ポスト数としてカウントするのは、単体のポストのみか、それともリプライ（リプ）や引用を含めた数か？ A-3：リプは含めなくて良いが、引用ポストは含めて良い。例えば、「1日5ポスト」という基準は、ポストと引用を含めての話である。 Q-4：どのくらいのフォロワー数、インプ数になったらリスト（LINEやメルマガ）を取り始めても良いか？ A-4：理想は3,000フォロワー程度を確保してからリスト獲得を始める方が良い。これは、上流の層（認知・フォロワー）を確保しておかないと、無理にリストを刈り取った際に母数が減ってしまい、長期的な収穫（売上）が難しくなるためである。ただし、月30万円程度の売上を目指すだけであれば、1,000フォロワーから回しても良いかもしれない Q-5：プロフィールにLINEを置いているが、特典を作って今から集客（リスト獲得）すべきか？ A-5：今の段階では流さなくても良い。まだ認知層やフォロワー層を育てている段階であり、見込み度の低い層にリストイン施策を打っても反応が取れず、コスパが悪い。まず上流（認知・フォロワー）の数をためて、見込みを高めていくことを優先すべきである Q-6：リストインはメルマガ経由からLINEに入った数だけカウントしているか？ A-6：講演者自身の場合は、LINEとメルマガを同時に取っており、両方を見ている。 Q-7：リストが増えた（1ヶ月で600人）が、バックエンドがない場合、どのように活用していけばいいか？ A-7：バックエンドがなくても、SNSの更新などを続けることで、リストとの接触頻度を増やしておくことが重要である。企画などの機会に活用すれば良い。 Q-8：彼女とのデートの様子のストーリーズは、恋愛アカウントの「プレイヤー感」を出すのに効果があるか？ A-8：効果がある。彼女ができるまでの過程を深掘りするよりも、シンプルに彼女との幸せな暮らしを発信していくと良い Q-9：ポストは変化球的に短文・長文・画像ポストなどを色々した方がいいのか、またはコンセプトに沿って淡々と発信すべきか？ A-9：文字の長さや画像の種類といった「小手先」のテクニックは本質ではない。長文か短文か、画像付きかそうでないかは、内容として継続して追いかけたくなるか、また教育のため長文が必要か、といった観点で判断すべきである。毎日決まりきったパターン（例：毎日何時に投稿、長文1つ、画像2つなど）で運用すると、テンプレ感が出て「キモさ」につながるため、むしろやめた方が良い。 Q-10：恋愛アカウントの発信について、女性が非モテ男子に女性心理を伝える内容は弱いか？ A-10：弱い（当たりにくい）パターンである。これは、女性の発信者は「魚が魚の釣り方を教えている」ようなイメージを持たれやすく、説得力が弱いと判断されることが多いためである。 Q-10：恋愛アカウントの発信について、女性がヒモテ男子に女性心理を伝える内容は弱いか？ A-10：弱い（当たりにくい）パターンである。これは、女性の発信者は「魚が魚の釣り方を教えている」ようなイメージを持たれやすく、説得力が弱いと判断されることが多いためである。 Q-11：占いの鑑定士として活動しているが、専門的なジャンル（急星気学）を発信するか、高単価に繋がる「占い師として稼ぐ方法」といったコンセプトが良いか？ A-11：高単価に繋がる「占い師として稼ぐ方法」といったコンセプトの方が良い。これは、ターゲットが「占い師になりたい人」ではなく「占い師になってお金を稼ぎたい人」になるため、高単価のアフィリエイトや自社商品への繋がりが明確である。 Q-12：複数アカウントを作る場合、テーマ（ジャンル）を分けた方が良いか？ A-12：分けた方が良い。 Q-13：フォロー回りやいいね回りなどの初期の行動は、どのタイミングまでやるべきか？ A-13：いいね回りは続けても損はないため、やり続けても良い。フォロー回りは、フォロワーが500人を超えるくらいになると多くなりすぎる印象があるため、300人くらいまではやっても良い Q-14：アカウントコンセプトを変更し、インプが減りフォロワー増加率が鈍化した場合、このまま続けるべきか、アカウントをバイアスすべきか？ (まさやさん) A-14：属性認知がバグっている可能性が高い。既存のフォロワー層と新しい発信内容が合っていない場合、アカウントが伸びにくい。 Q-15：自分の商材を売る場合、自分の話す価値を高める教育は重要か？ (まさやさん) A-15：重要である。自分か自分以外かに関わらず、セールスをする人物が時間を割いてくれていることに対し、相手に「ありがとう」と思ってもらう教育が大切である。 Q-16：プレイヤー段階であれば、教育ポストの割合は5ポストに1個くらいで大丈夫か？ A-16：ポストを単体の「教育ポスト」として扱うのではなく、プレイヤーの活動をアウトプットするポストの中に教育的なメッセージを混ぜていくという感覚が良い。これにより、行動の重要性などを暗に示すことができる。 Q-17：質問をする際に、どのような点に注意すべきか？ (回答の中で言及されたメタアドバイス) A-17：質問をする際には、単純に答え（例: YES/NO）を聞くのではなく、「自分はこう思ったが、ここが原因で、このような解決策が良いと考えた」という思考回路を乗せてほしい。原因と解決策を特定し、その思考の部分でミスっていると一生ミスり続けることになるため、正しい思考回路を身につけることが大事である Q-18：女性フォロワーが少ないのはなぜか？ A-18：講演者のアイコンが「おっさん」であることや、発信内容が尖っていると思われていることが原因の一つとして考えられる。女性をターゲットにする場合は、アイコンや発信内容を調整することで、女性層を増やせる可能性がある。 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/DXou0EuAyBQd/lesson/NStWhhsBTHlI","createdAt":"2026-05-15"},{"id":"scr-1779455314509-szzelv","title":"おまけ：【緊急】これ知らなきゃ損します...！X最新アルゴ&バグ級で伸びるエグい裏ワザ | なまいきスクール会員サイト","category":"material","content":"おまけ：【緊急】これ知らなきゃ損します...！X最新アルゴ&バグ級で伸びるエグい裏ワザ こちらは以前有料販売した アルゴリズム解説noteです。 アルゴリズムは変化しますが、 ここに書いてある内容は 本質に近いのでずっと使えますし ポスト作成のフロー や、 X運用のスタンス としても有益なので ぜひ目を通しておいてください！ それでは本編に進みます👇 今まで黙っていた、 ガチの極秘情報を暴露します。 これを知らずに Xでポストしている人 、 本当に全員が損をしているかもしれません。 「インプとりまくっちゃおう🔥」 「これ集客しまくるぜぇぇぇええ🔥」 と思ってポストしてるつもりが、 逆にXのアカウントパワーを下げちゃってる… という可能性もあります。 正直なところ、 これを公開するメリットは あまりありません。 直近のなまいきくんポストを 見てもらうとわかるのですが、、 今はあんま力いれてないのに、 ほとんど1万インプ超えてます👇 8.7万インプ 2万インプ 1.9万インプ 9.2万インプ 3.4万インプ 今は今日のノウハウ知ってたら ガチでインプとるの簡単だと思うw え、それって なまいきくんだからできたんじゃ…？😡 というありがちな疑問にも あえてお答えしておくと ちょろっと友達にアルゴリズム教えたら、 すぐにコレです👇 ちなみに、 新規で立ち上げたばっかの垢でも 5000インプくらいは普通に出てるし、 伸びてるポストは2~5万は狙えるので えぐいフィーバータイム来てますw 今までのなまいきくんXは、 インプは出るけど地味に運用が むずかしかったんですが、 今のアルゴはやり方さえ 知ってれば無双できちゃうw だから、 本当は内緒にして、 一人で甘い蜜を啜ろう🤤 と思っていたのですが… 「なまチルだけ無双状態」 とい すこと禁止 発信ジャンルによっては、ビジネス目的で発信しているアカウントを忌み嫌うところもあります。 そのため、なまいきスクールに入ってると知られると、界隈からの印象が悪くなり、マネタイズが難しくなることに繋がります。 自ら公表しているアカウント以外で、「なまいきスクール生」「自分と同じビジネススクール生」ということは他言無用でお願いします。 仲間の脚を引っ張る行為は、大いに信頼を失い、仲間からの援助を受けられなくなります（その分、自分のXも伸ばしにくくなります）。 厳重に注意してください。 ⑤同じスクール生にXのDMなどで、「講義内容等, ビジネス的な質問をすること」禁止 特に伸びてるスクール生に対して、DMや公式LINEにスクール生の方から多々連絡くるケースが散見されていますが、 スクール生にこういった質問など時間をとらせてしまう行為は禁止です！ スクール生は切磋琢磨して伸ばし合う関係ではありますが、講師ではないので、そういった質問は、講義内、もしくは、(質問可能プランの方は)講師へご質問ください！ あと、大体の質問は講義で説明しているので、何回も何十回も講義を見返して理解度を高めましょう！ また、Discordも用意しているので、雑談部屋、ジャンル別部屋なども活用していってください！ 以上ルール5点 皆さんが集中して学び、最短で成果を出せる環境を守るため、把握と徹底をよろしくお願いいたします！ 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/5y6Isv53E5QP/lesson/cWx7hozF1k8R","createdAt":"2026-05-15"},{"id":"scr-1779455314509-sxetej","title":"Lv3. 講義QA | なまいきスクール会員サイト","category":"material","content":"Lv3. 講義QA Lv.3の内容でいただいた質問に回答しました！ Q-1：ポストの目的「認知獲得〜リスト獲得」それぞれの比率ってありますか？ A-1：フェーズ次第。アカウント立ち上げフェーズならそもそも認知がまだ全然取れてない。なら主なポストは認知になる。ある程度見込み客が取れてきたら、興味づけ、関係構築、教育、リスト獲得、などどんどん下に落としていく。ただ、ポストの役割はキッパリ分れるものではなくて、複数の目的を掛け持ちしてる場合がほとんどなので、グラデーションで、このポストは〇〇がメインの目的、くらいの認識でいい。ポストの要素がこの5つというより、ポストの目指すべき方向性が5つある、というイメージ。 Q-2：バーベキューの写真を上げるとしたらポストの役割は何に当たりますか？ A-2：文言によって変わってくる。もし、「Xと繋がった人とバーベキューなう」という文言だったら興味づけになる。「Xマネタイズをするべき。そうしたらこうやって好きな時間にバーベキューできるようになる」という文言なら教育になる。写真自体には意味がない。 Q-3：ポストの目的が機能しているかを確認できる指標はある？（認知ならインプ数など） A-3：見込み客かを判別する方法はなかなかない。普段のポストへの反応を全体的に見て予測するしかない。「こういうノウハウ興味ある？」とかの反応とかも見つつ。数値的指標はない。フォロワーが伸びてるから認知が取れてる、というわけでもない。例えば、なまいきくんのアカウントのエロ系の業者のフォロワーが増えても、それは見込み客が増えてるわけではない＝認知が取れてるわけではない。教育度合いも数値的指標はない。リスト獲得はLINE登録数でわかるけど。 Q-4：最終的にはGPTsを使わず、自分でポスト作れるようになった方がいい？ A-4：後々3〜4ヶ月後くらいには自分で考えて作れるようになれたら最高。ただ、最初はまず作ることが最重要なため、GPTsを使って作っていってOK。 Q-5：「認知獲得」と「興味づけ」の明確な違いはある？ A-5：認知獲得は、知ってもらうこと。興味づけは、知ってもらった上で、興味を持ってもらうこと。例えば、なまやまきんにくんを知っている人の中でも、興味ある人とない人に分かれる。ピラティスを知っている人の中でも、興味ある人と興味ない人の2つに分かれる。 Q-6：裏垢講座のアフィをするために、チャトレ（チャットレディ）界隈のアカウントを買収するのはありですか？ A-6：ターゲットが「アダルトで稼ぎたい」という思考は共通しているので、アリ。 Q-7：逆算思考という話で、売る商品を先に知っておいた方がいいと思うのですが、、 A-7：全然いらない。商品の解像度の違い。個別具体的なところまで知る必要はなくて、なまいきくんなら「Xで稼げる」系の何かを出そう、くらい粗くしか普段は決めていない。その方が、相手が求めてるものを確かめてから後出しで訴求できるので売れやすくなる。（AI系の商品を求めてる人がいるなら、なまいきくんのスクールもAI講座という見せ方ができたりする） Q-8：ポストの文字数は？ A-8：初期フェーズは短文8割、長文2割くらいでOK。興味持たれてない人の長文は読まれない。短文で読ませた方がいい。 Q-9：ポストはリアルタイムと予約投稿、どちらがいい？ A-9：リアルタイムの方が初期反応が確認できるからオススメ。なまいきくんは初速が悪かったら投稿消したりしてる、時間的にキツイ人は予約投稿でもいい。アルゴ的には影響ない。 Q-10：いいね周りはした方がいい？ A-10：いいね周りで強制的に認知とれるからやった方がいい。ただ、いいね周りに頼るとよくない。あくまで自分のポストを見させるのが目的なので、いいね周りだけじゃダメ。他にも、リプは認知目的だったり、関係構築の目的の時もあったりする。 Q-11：ターゲットは変えていっていい？ A-11：はい。固定する必要はない。サラリーマンに向けたり、主婦に向けたり、ニートに向けたり、いろんな層に向けて発信して反応を見ていっていい。ペルソナ(具体的なターゲット層)みたいに層を狭めるのは売上を減らすだけ。ビジネス系なら、「お金を稼ぎたい人」くらいざっくりターゲット持っていい。 Q-12：アフィ案件と、自分の手法は違ってもいい？ A-12：違っても全然いい。見せ方を工夫して合ってるように見せられればOK。 Q-13：ポスト削除して上げ直すのはダメ？ A-13：なまいきくんの経験上、連投するとインプが落ちる。だから、ポスト削除して上げ直すのは推奨しない。 Q-14：アフィ先の手法を批判して見込み客集めても売れる？ A-14：売れる。みんなそこまで手法にこだわりはない。 Q-15：アカウント差別化について A-15：差別化は大事。ターゲットを絞り込むのは不要。コンセプトの差別化は大事。他の手法と比べた優位性など。 Q-16：1ヶ月30万の実績を持ってるけど、1ヶ月60万の実績をだしてから興味づけした方がいい？初心者層がターゲット。 A-16：1ヶ月30万でもう興味づけしちゃっていい。初心者からしたら30も60も変わらない。実績に天井はないから、今あるベストを出していった方がいい。 Q-17：GPTsに聞いたら、1日2ポストがベストと出てきた A-17：1日5ポスト推奨。ただ、あくまで目安。あくまで１番大事なのは、ポストの目的。 Q-18：競艇と競輪アカがあって、層的にお金使うことに抵抗はない人たちなのですが、今後物販や投資などアフィに繋げられやすいと考えてるけど合ってるか？ A-18：やってみないと分からないけど、娯楽的な投資（短期的快楽）と、ビジネス的な投資（長期的快楽）は違う気がする。 Q-19：未経験（興味ある）層に発信した方がいい？ A-19：はい。その方が層が多いから見込み客が多く取れる。中上級者に教えられるだけの実績やこだわりがあるならそっちに発信してもいいけど。 Q-20：固定ポストはどんなのおく？ A-20：プロフィールはそんなに重要じゃないから、固定ポストも最初はおかなくても別にいい。リストとりたいタイミングでおくくらい。実績貼っといてもいいけど誤差。普段のポストの方が大事。 Q-21：買収がまだ難航してるんだけど、練習用で自分で作成した垢でポストしていい？ A-21：はい。買収は必須じゃないから。買収した方が楽なだけ。 Q-22：現在、実践してないけど発信できる？ A-22：過去の実績などを載せてもいい Q-23：アフィ案件の単価や報酬は教えてもらえる？ A-23：はい。しっかり教えます Q-24：投資系の発信をする時、そもそものタネ銭を作る段階の人は、物販とかの他のジャンルのスクールをアフィしてもいい？ A-24：はい。むしろそれが鉄板パターン。投資系はどんなジャンルにでも繋げられるから強い。 Q-25：ありきたりな手法でも人を集められる？ A-25：できます。見せ方次第で、新規感（裏技感）を出せる。 Q-26：ポストの数値は記録した方がいい？ A-26：普段のポストは記録せず、見るくらいでいい。XTEPは記録した方がいいが。 Q-27：シャドバンの時は放置した方がいい？ A-27：はい。何も触らない方がいい Q-28：オールドアカウントについて A-28：凍結リスクを下げるのが目的。マネタイズが早くなることはない。 Q-29：完璧主義にならずにGPTsでどんどん作っていった方がいい？ A-29：今あるベストを出していくこと。どんどん上手くなるから、まずは実践することが大事。大枠を外さなければいい。そのための厳選ポストネタ集がある。 Q-30：インプが伸びたけどいいねやリプの反応が少ないのは、内容が悪いから？ A-30：トレンドをワードを入れてればインプだけは伸びたりする。目的に沿ってるけど、反応が悪い時もあるから、なんとも言えない。 Q-31：半年発信が止まってる人もアカウント買収対象にしていい？ A-31：はい。趣味垢は安く買えるからコスパがいい。マネタイズ垢の方がマネタイズはしやすいけど、高くつく。 Q-32：質問のしかた A-32：思考回路を添削したいから、思考回路を出してもらいたい。いくら具体を添削してもキリがない。根本の考えを変えれば自分で質のいい具体を出せるようになる。 Q-33：アダアフィ界隈は実績を出してない人やマネタイズしようとしてる人に厳しいのですが、その場合は、界隈をずらして、SNS✖️アダルトみたいにして発信した方がいい？ A-33：はい。SNS✖️アダルトマネタイズ、くらいでいい。結果的に裏垢を売ると思うのでアダアフィに限定する必要はない。 Q-34：垢買収と新規垢でマネタイズのスピードはどれくらい変わる？ A-34：リスト次第。すでにリストがいる状態だったら1日目からでもマネタイズできるし、リストがなければ買収してもリストを自分で取らないといけないし。 Q-35：400フォロワーのアカウントあるけど使った方がいい？見せかけのフォロワーがいた方が伸びやすい気がするけど。 A-35：誤差。どっちでもいい。 Q-36：リスト獲得や教育のタイミング A-36：1000インプ。500フォロワー、平均20いいねくらいが目安。教育の目安は、フォロワーがいる段階から始まる。 Q-37：毎回CTAした方がいい？ A-37：毎回直接的にCTAしなくていい。間接的にそういう雰囲気を出すのは大事 Q-38：なまチル同士で絡むのは？ A-38：アカウントパワーが弱い同士で絡んでもほぼ意味ない。身内向けの発信になっても新規が取れない。 Q-39：毎回コンセプトは固定した方がいい？ A-39：ポスト単位でちょくちょくコンセプトや切り口をずらしていい。なまいきくんも毎回Xマネタイズの発信をしてるわけではない。 Q-40：投稿する時間帯 A-40：1時間は間隔をあける。連投はインプが下がるから。後は自由。 Q-41：アカウント買収の選考基準 A-41：リストを取り始められる基準と一緒。1000インプ。500フォロワー、平均20いいね。結局、マネタイズまでのステップをショートカットするのが買収なので、基準は何も変わらない。 Q-42：オススメのジャンル別買収垢のリストアップは？ A-42：それはできない。スクール生がバチり合うことになるし、自分で探す力がつかないし、相手にスパムだと思われたりするから。 Q-43：田中はなんで物販を今も続けてるの？高単価アフィの方が稼げるのに A-43：物販をしてた方が物販の発信をしやすくて、結果的に高単価アフィも跳ねるから。リアルタイム性が出せたり。レバレッジの素みたいなかんじ。 Q-44：アカウント買収の注意点は？ A-44：契約書をちゃんと巻く。お互いの絡み合って反応あげて数値感バグってる垢は買収しないようにする。フォロワー買ってる垢も買わない。くらい 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/IMgvAdDhz9MJ/lesson/Sl6DBtgFyLPk","createdAt":"2026-05-16"},{"id":"scr-1779455314509-sysccn","title":"15-2 番外編コーナー XTEPのネタの探し方 | なまいきスクール会員サイト","category":"material","content":"15-2 番外編コーナー XTEPのネタの探し方 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/B5c2IvB2AwtE/lesson/7kbtrGhno1XX","createdAt":"2026-05-16"},{"id":"scr-1779455314509-ebfuut","title":"18-3 売れる商品で一番大事なこと | なまいきスクール会員サイト","category":"material","content":"18- ど停滞してる 1段目： Xを動かしてるけど 伸びてないし稼げてない 0段目： 情報発信やSNS運用に興味があるけど 特にやったことはない人たち この時に 狙うターゲットは 「0~1段目」 つまり 0段目：情報発信をしたことがない人 👆️この人たちに Xアツいじゃん！ Xってそんな稼げんの？？ となるような興味付けをして X運用をスタートしたくなる ポストをしましょう。 1段目： Xを動かしてるけど伸びない、 稼げない人 この人たちに👇️ こうやったら伸びるよ X伸ばすとこんないいことあるよ など Xで稼ぐノウハウ、伸ばすノウハウ を 知りたくなるようなポスト をしましょう。 0段目の人を1段目に、 1段目の人を2段目に登らせる意識が 大事です 実は、 知識はあるのに伸びない人 が やりがちな NG行動が👇️ ❌️ 自分が有益だと思うこと ❌️ 自分が伝えたいこと をポストしてしまうこと。 例えば👇️ X運用系の発信で 実際にあったNGポスト事例 売り上げる方法がローンチしかない人は今後どんどんキツくなる。実際コンテンツ作ってローンチって流れに市場も飽き始めてるしな。逆に今稼ぎまくってるのは裏でこっそり売ってる奴ら。フロントは継続的な集客に特化して、後ろの仕組みでガッツリ売るパターン。2ヶ月目で月3ケタ万超えてる別垢もこれ。 これ...ボツです。 理由は、 ターゲットが狭すぎるから。 そもそもローンチできる人 というのが 100人いたら1~2人くらい しかいないです。 フォロワーの 90%は0~1段目 にいるので、 コアすぎる知識は 「興味の対象外」 レベル感でいうと、 「何発信していいかわからない」 「アカウントをまだ持ってない」 👆️ここが０〜１段目になります。 ０〜１段目 の彼らは深いノウハウとか、 鋭い考察とかを別に求めてないので 基本は 完全ゼロイチの初心者 にむけて わかりやすさを重視したポスト を 作りましょう！ 2️⃣ 冒頭一文目で 興味付けを強める ポストが伸びる流れはこの３ステップ ポストが目に止まる ↓↓↓ 最後まで読む ↓↓↓ アクション だからこそ冒頭で、 「これ、気になるな」 「自分に関係ありそうだな」 と思われないと 絶対にインプは伸びません。 例えば、👇️このポストなら 「AIが」 →トレンドなテーマ 「知らなきゃヤバい話」 →損失回避 「今すぐ読め。絶対。」 →強調 👇️このポストなら 「Xで売上でないから萎えた」 →1段目のターゲット狙い 「マジでビジネス理解してなさすぎ。 そりゃ稼げない。」 →損失回避 特に影響力の小さいアカウントほど 冒頭にこだわらないと見られません。 3️⃣ 具体度をあげる 想像して欲しいのですが、 ポスト見てる人は 通勤電車とかで ボーッとXを眺めています。 このときに 抽象度の高い言葉 は まず目に留まらず スルーされてしまう のです。 例えば… ❌️ ビジネスで一番大事なのは集客 ⭕️ Xで一番稼げるのは 「フォロワー集め」がうまいやつ 「集客」 だと抽象度が高いですよね。 それに対して 「フォロワー集め」 だと 具体的な表現でわかりやすいです！ 言ってることは一緒だけど、 言葉がむずいと目に留まらない。 なるべく具体的に、 中学生でも一発で理解できる言葉 で リライトするようにしましょう！ 4️⃣ 市場で話題になってるテーマに触れる 同じ界隈の ３〜４人が同じテーマ について 意見を述べて 軽い論争 になるときがある 定期的に起こる例だと、 奢る・奢られ論争 など ビジネス系なら 👆️こんな感じです。 こういうときは、 テーマに注目が集まってる ので 触れるだけでインプが伸ばしやすい 。 5️⃣ 必ず「目的意識」を持つ ポストで一番気をつけるのは 「冒頭の興味付け」 というのだけ 頭に留めておいてください！ そのポストでどう思わせたいか？ を必ず 言語化 できるようにしておきましょう。 例えば ✅️「Xアツくね？？？」と思わせたい ✅️「物販再現性ありそう」と思わせたい ✅️ 高単価アフィに興味を持たせたい ✅️「こいつ詳しそうだな」と思わせたい etc... 結局、 目的意識 がないと 「ポストしないよりマシ」 くらいの効果しか得られません。 この商品が売りたい ↓↓↓ だから読者にこう思わせたい ↓↓↓ だからこのポストをしよう 👆️本来の考え方 はこれです。 なので、 これは誰に向けて どう思わせるためにポストしましたか？ これに 即答 できるように 常に考えてポストしましょう！ 反応率UP！伸びるポストのコツ ということで 反応がとれる良いポストの 5つのポイント を解説しました！ 1️⃣ 階段の0~1段目にいる人に向けて 次の段に進ませる意識でポストす を考えるのが 慣れない人にはそれだけむずいんだ と思います。 ポストにおいては どんな文章でポストするのか？ よりも 何をポストするのか？ という ネタの方がずっと大事 なので、 まずはそこをマスターしてください。 ポストのライティングについては、 Lv.3で お渡ししたGPTsがかなり好評 で 実際に 「5000インプとれた！」 「10000インプ出た！」 みたいな報告も 届いているのでぜひご活用ください。 ポストネタの考え方 ぶっちゃけですが、 なまいきくんは普段からチマチマ ポストネタなんて考えてません。 普段からXを見まくってますし、 常に思考しまくってるので、 Xを動かすときには すでにポストしたい内容がある状態 です。 なのでネタに困ることは 基本的にありませんし トイレで2分で完成させたりします。 （慣れたらこうなると思います。） ただ、初心者は思いつかないと思うので 重要な２つの思考フレーム をお伝えしておくと 「６つの教育」と「グダ消し思考」 です。 厳密にいうと、 「グダ消し」も「６つの教育」に 含まれますが特に重要なので あえて分けて説明します。 1.６つの教育ポスト 普段のポストで使いやすい型 先ほどのチャプターで 「ポストは教育が大事」 と言いましたが その土台になるのが ６つの教育 です。 これはなまいきくんが作った言葉ではなく、 ネットビジネス業界で使われてる言葉 です。 ① 目的の教育 ② 信用の教育 ③ 問題点の教育 ④ 手段の教育 ⑤ 行動の教育 ⑥ 投資の教育 それぞれ説明していきます。 ①目的の教育 「〇〇したい」という 欲求を抱かせる 教育 例えば、 理想の未来 をポストしたり 過去からの変化(Before After) を ポストしたり。 「俺が理想の状態を体現してるよ〜」 というのを見せつけて 欲求喚起するような教育だと思ってください。 お金面 での理想の状態を見せる 時間・環境・ライフスタイル での理想 性 についての理想 優越感や承認欲求的 な理想 etc. なんでもあります。 「満員電車に乗らなくて良くなった」 「ウザイ上司より稼いでる優越感」 「童貞だったのに セフレに困らなくなった」 「月１で旅行に行ける」 「毎日のように 10万円以上振り込まれる」 「ほぼ自動化したので暇すぎる…w」 「今日も日給10万円 チャリーン！」etc. これ身につけるとこんなやべーよ。 こんな最強の未来が手に入るよ。 というのを見せつけます。 これとかも 目的の教育 になりますね👇 ・複数のマネタイズポイントがある ・月収がかなり安定する ・月商1000万円超えれた これはライフスタイル的な部分👇 よくある詐欺広告だと 「旅をしながら自由に稼いでます」 「カフェで好きな場所で仕事してます」 みたいなのがありますが、 これもゴリゴリの目的の教育ですねw 「広告が出てる＝効果がある」 ということです。 【ポイント①】 切り口をストックしましょう！ 目的の教育の切り口 なんて ジャンルによって無限にあります。 フォロワーが伸びる インプが増える 日給〇〇万円 旅しながら稼げる 寝ててもお金が入ってくる 会社辞めてウザイ上司からおさらば モテるようになった 利益率が高すぎるw 共通のものもあれば、 ジャンルごとに違うものもある。 競合のポストを見て 感情が動いた事例をストック しましょう。 【ポイント②】 イメージしやすくして 欲求を掻き立てる べし 目的の教育は 視覚的に見せた方 が 欲求が絶対に動きやすい ので 画像をつけるのがおすすめです！ 売上画像 何か魅力的なことをしてる画像 etc. 【ポイント③】 リアルタイム性 があると より刺さります。 「アフィで10万円稼いだ！」 よりも 「 鮨食ってたら10万円 稼げちゃってて黒字！ 」 とかの方が、リアル感があって 「なんかいいな」 と思いますよね。 ポストの中でも 目的の教育 は かなり重要度が高くて 結局、人間っていうのは 「こいつ羨ましいな」 「なんでこいつだけ良い思いしてんだ」 「こいつのやり方知りたいな」 と思うからこそ、 発信を追ってくれます。 ② 信用の教育 読者に 信用・共感 してもらう 目的の教育を入れると 「俺もアフィ学びたい！」 「物販やって自由な生活したい！」 みたいな欲求は出てきますが そこで次にぶち当たるのが こいつちょっと怪しいな… 詐欺じゃね？？？ ちゃんと信用できるやつなん？ というところ。 仮に高単価アフィをするとして 読者の立場に立ってみると 怪しいやつの案件に入りたくないですよね… そこで大事なのが、 信用を得るための発信 をすること。 具体的にいうと 過去のダメダメさを語る サクセスストーリーを語る 失 ルマガですね。 具体的にどんな場面で どうやって活用してきたのか？ というのも話してるので、 かなり勉強になると思います。 今週も盛りだくさんですが、 復習もしつつどんどん実践してきましょう🔥 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/sGUl9xSASdx3/lesson/rlcGrr00hFjF","createdAt":"2026-05-16"},{"id":"scr-1779455314510-vtkwfn","title":"11-2 価値観を操る12の教育要素（前編） | なまいきスクール会員サイト","category":"material","content":"11-2 価値観を操る12の教育要素（前編） では、 価値観教育 について話していきます！ これは教育における ”土台作り” だと思ってください。 前提として… お客さんは大きく分けて ２種類 います。 絶望客（まだまだ客） →商品購入から1番遠いお客さん 理想客（今すぐ客） →今すぐにでも商品を買いたい客 価値観を操るには 「どんな価値観をもってる人を」 「どんな価値観に変えるか？」 を理解してないといけないので それぞれが持っている マインドを少し掘り下げておくと… ❌ 絶望客の価値観 手法や商品に 興味がない あなたのことを 信用してない 現状のままでいいや… と思ってる リスク を取りたくない お金 を払いたくない（無料でやりたい） 努力したくない 勉強する のはめんどくさい 自分には 目標達成できない と思ってる 手法に 再現性を感じない 誰かに 依存して 稼げるようにしてほしい 行動したくない この価値観のお客さんは 自分が成果が出てない原因 にも もちろん気がついてないですし どんな手段が目標達成に最適か もわかっていません。 もし仮に絶望客の価値観の人が セールスマンの前に来たとして、 １〜２時間ほどの限られた時間で熱量を上げて 商品を売り切るのは至難の技 です。 僕も 優秀なセールスチーム を抱えて いろんな案件のセールスをしてますが、 やっぱり顧客が 絶望客ばかり だと セールスの難易度は激上がり して 「成約率・成約単価」 も大きく下がります。 そして… この 「絶望客」 の状態だと 商品が売れないだけでなく 仮に売れたとしても 行動力が低いし リスクが取れない人 なので 成果を出させるのが めちゃくちゃ大変 です。 もっというと、 絶望客は他責な人が多い ので 炎上やクレームに繋がりやすい です。 じゃあ一方で、 理想客はどんな価値観を持ってるのか？ というと… ⭕️理想客の価値観 〇〇さんみたいになりたい ！ 〇〇さんみたいな生活がしたい ！ 〇〇さんの発信は 信頼できる ！ 自分の 問題点 に気づいてる 問題を 解決する手段 もわかっている あなたの 手段は再現性 があって 自分に最適 だと思ってる お金を使って知識や時間を買う のは重要！ ある程度の リスクを取る のも重要！ ビジネスは 自責で行動する のが大事！ チャンスを掴むには言われたことに 素直に即行動する のが大事！ こういうマインドを持ってたら 商品を売るのも簡単ですし 自分で 「必要だ」 と感じて買ってるので クレームになるリスクも少ない。 さらにいうと、 行動も早いし学習意欲があるので めちゃくちゃ成果が出やすくなります 。 で、あれば… 僕らが発信においてやるべきは、 「絶望客」 の価値観 を 「理想客」 の価値観に 変えていくこと 。 ・なまいきくんは怪しい… ・今度やろう… ・副業って危ないんじゃ？ ・貯金しといたほうがいい… ・自分には無理だ… ↓↓↓みたいな価値観を↓↓↓ ・なまいきくんの情報は全部追う！ ・X運用はリスク低く稼げる！ ・知識投資して早く成果を出そう！ ・自分なら絶対にできる！ ・学んだことは即実践！ こんな感じで、 読者を変化させていくイメージ を まず頭の中に持ってください。 「価値観を変える！」 「価値観を書き換える！」 と考えると、 むずかしそうな印象を 受けると思いますが、 実は価値観を変えることは 何もむずかしくありません。 なぜか？ 絶望客を理想客に変えるために 伝えるべきメッセージは パターンが決まっているから です。 そして、 そのパターンがこれから伝えていく 12の教育要素 になってきます。 12の要素と言いましたが、 実は過去の講義ですでに、 前半の６つは伝えています。 何かわかりますか？？ パッと出てくる人は、 よく復習できてる証拠 です。 この６つの要素っていうのが Lv.6-2で紹介した 「６つの教育」 です。 ＞＞復習：6-2 濃いフォロワーをバンバン集客するポスト作成論 ちょっと30秒ほど時間をとって ６つの教育を思い出してみてください。 ・ ・ ・ いけましたか？ ①目的の教育 ②信用の教育 ③問題点の教育 ④手段の教育 ⑤投資の教育 ⑥行動の教育 基本的にビジネス用語は あまり覚える必要はないですが ６つの教育については、 ビジネスの基礎になる大事な要素 なので スッと出てくるようにするのがおすすめです🔥 復習：人を動かす「６つの教育」 すでに一度学習済みなので、 まずはサクッと復習していきましょう。 １.目的の教育 〇〇さんみたいになりたい！ と 欲求を喚起 するための教育 具体的には… 儲けてる様子を発信する モテてる様子を発信する 理想のライフスタイルを見せつける 過去からの変化(Before After)を見せる 商品を売るための第一条件は 「興味を持たれていること」 です。 これさえ突破できていれば、 とりあえずなんとかなります。 興味を持たれてないと、 ２つ目以降の教育が全て無意味になる ので 目的の教育は興味フックの役割を果たす 最も重要な教育要素です。 大事な要素なので、 少し深掘りしておくと… 理想を見せて興味付けするなら デカい実績が必要じゃない？？ と思い込んでる人が非常に多いです。 これについては、 半分はYESで、半分NO 。 まず前提として、 情報発信っていうのは 読者との「差分」が価値になる ので、 何かの「実績」や「理想状態」 は 絶対に必要になってきます。 ここに関して、 エアプで理想っぽく見せる ことも 不可能ではないですが、 自信を持ってドヤるためにも 最低限の努力はしたほうがいい と思っています。 ですが、 「デカい実績が必要か？」 というとそんなことなくて 例えば、 単発で１万円を稼げた実績 でも （小さい実績） 寝てたら1万円入ってたわ、 こういう収入源いくつか持ってると めちゃ最高だよねw スマホちょっと触ってたら 1万円儲かっちゃったわ これエグすぎるっしょw とか言うことによって、 たくさんの収入源があるように 錯覚させることは可能 です。 簡単そうに見せる 労力低そうに見せる ”当たり前”そうに見せる こういう ちょっとした 見せ方の工夫 だけ で 羨ましい状態 は誰でも作れます。 ここがうまくなると 目的の教育が非常に得意になる ので うまい人を見つけたら ぜひ分析してみてください。 ２.信用の教育 読者に信用＆共感してもらう教育 どれだけ良いことを言っても 「こいつ怪しいな…」 「ちょっと信用できないな…」 と思われていると、 説得力が激減してしまいます。 そこを払拭する 信用の教育 として こんな要素を発信に入れていきます。 具体的には… 過去のストーリーを語る 過去の失敗談を語る お客さんの声や実績を入れる 発信の思いや理念を語る 成果の証拠を見せつける 信用の教育で1番有効なのは 「こいつ、俺と同じだったのか！」 と思わせること。 俺と同じようなレベルだったのに 今はこんなに稼いでるのか… たった数年前まではこいつも ただのサラリーマンだったのか… という感覚になると、 急に親近感が湧くはずです。 つまり、大事なのは 読者との共通点を作ること 。 共通点を作って お前と同じ状態から成り上がったよ！ というのを伝えるために ストーリーや過去話を使ってください。 ３.問題点の教育 読者がうまくいってない原因を伝えて 問題意識を増幅 する。 人間っていうのは 悩みの原因がわかる と それを解決しよう と動きます。 逆にいうと原因がわからなければ そもそもどの手段をとっていいか 不明なので動けないわけです。 そこで、 問題点の教育 では うまくいっていない原因 原因を放置すると起こる最悪の未来 具体的な損失額や損失時間 手遅れになる恐怖 etc. を伝えて 問題意識 を煽っていきます。 簡単に例を挙げると あなたが痩せれないのは 体質の問題 なので 体質に合ったダイエット をしない限り 一生痩せれませんよ？ それどころか合わない方法やっちゃうと 逆にストレスで太ったり体調崩したりする ので まず体質を把握しないと結構ヤバいです。 みたいな感じですね！ 危機感を煽るのも重要で、 原因がわかったところで 読者の８割は 「まぁいっか」 で終わるので 放置する恐怖を煽って 「ヤバいな」「行動しないとな」 というのを認識させます。 ４.手段の教育 自分が押し出したい手段 と その 魅力 を伝えていきます。 教育では 他の手段 の中から 「この手段が1番いいな」 と思ってもらわないといけないので 手段の教育 は 言わずもがな重要ですね！ 具体的には 簡易性、資産性、コスパの良さ リスクの低さ、即効性 再現性の高さ（うまくいってる事例紹介） 他の手段と比べた優位性 などなどを、 発信の中で伝えていきます。 みたいなのも、 手段の教育に入ってきます。 あと、ただ自分の手段を おすすめするだけじゃなくて 元手が1000万円以上ない人が 株やったところでほぼ増えないので無駄 みたいに、やんわり 他の手段 を 選択肢から消していく のも大事ですね。 ここまでで、 理想を見せて 興味付けしつつ欲求喚起 ↓↓↓ 信用の教育で信頼獲得 ↓↓↓ 問題点の教育で 読者に問題意識を植え付けて ↓↓↓ 手段の教育でおすすめの 解決手段を紹介 という流れができました。 ここまでがうまくいくと 「あ、この手段いいな」 「もっと学んでみたいな」 みたいな気持ちになってきます。 となると残るは、 金銭面のグダ であったり、 行動することへのマインドブロック です。 ５.投資の教育 知識や環境に投資するのを ”当たり前”にする教育 お金を払うことに関する抵抗感 を 「マネグダ」 と言ったりしますが 読者はいざ自己投資という段階になると 恐怖心でグダります 。 これを無くして お金を払う行為を 正当化してあげる教育 ですね！ 具体的には 独学によって生まれる機会損失 自分が自己投資してリターンを得た話 自分が環境や知識に投資してる様子を見せる みたいな感じですね！ 子供の学費であれば、 予備校や大学に何百万円払う のに 大人になって自分のスキルとか 学びにお金を使う人ってほぼいません よね。 ただ大人になってからの学びの方が 100倍収入に直結する ので、 これやっとくことで差がつきます。 みたいな話をしておくだけでも、 「自己投資って大事なんだ」 みたいな教育になります。 これをやってあげて 「自己投資するのは当たり前」 「学びにお金を使うべき」 という雰囲気ができると セールス段階でのグダがなくなるので 超セールスが決まりやすく なります。 ６.行動の教育 今行動する重要性を伝えます。 「今」というのが重要 で、 人間は知識をつけても行動しません。 「今は忙しいから」 「ちょっと準備ができたら」 「もう少し暇になったら」 と言って後回しにします。 これがフォロワーの 当たり前のマインドだと、 成果も出ないですし 商品を出したときにも絶対渋られるので 「即断即決は美徳」 「すぐに動く奴が勝つ」 「フッ軽な奴が成果出す」 「行動せず学んでるだけのやつはゴミ」 みたいな教育を入れておくのが重要です。 例えば なまいきくんのコンサル生 だと、 深夜の２時にいきなり呼び出して タクシーで飛んできてもらう… とかもあるのですが、 これくらいの行動力が当たり前 という基準値を普段から刷り込んでおくと 変なグダをする人がいなくなります。 ちょっと使えるテクニック ここでちょっと補足ですが、 読者に 何かしらの行動 を 当たり前にしてもらいたいときは 「ラベリング」 というテクニックを使うのがおすすめです。 簡単ですが、 非常に強力です。 やり方はシンプルで 行動が遅いやつ＝弱者、ゴミ、稼げない すぐ動くフッ軽＝成功する、センスある みたいな感じで、 やっても","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/LhLTttKrKd1j/lesson/LP3tyN4d6cgZ","createdAt":"2026-05-16"},{"id":"scr-1779455314510-ijybnv","title":"9-3 エンタメでインプ爆伸びストーリー型運用の設計術 | なまいきスクール会員サイト","category":"material","content":"9-3 エンタメでインプ爆伸びストーリー型運用の設計術 それではここから、 具体的なストーリー型運用の組み方 と ポイント を解説していきます！ ストーリー型運用において むずかしい部分は ただストーリーを見せるだけ ではあまり意味がないということ。 以前、Xでストーリー型運用について 軽くしゃべった際に 「わかった！」 「とりあえずストーリーにして ポストすればいいね！」 と勘違いしちゃって、 表面だけをパクって １ミリもおもしろくない リアルタイム発信をしている人 が 量産されてしまいました。 もちろん、 それでも多少の拡散効果はありますが 本来のストーリー型運用の 10% くらいしか効果を発揮できません。 せっかくストーリー型運用したのに滑った！ となるともったいないので、 ポイントをしっかり押さえていきましょう。 ストーリー型運用のポイント ストーリー型運用においては ２つの軸が重要になります。 それがこの２つ ① ネタのおもしろさ ② ストーリーの見せ方 簡単に例えると、 漫才の「ネタ」がおもしろいのか？ 「しゃべり」がおもしろいのか？ という違いです。 ①ネタのおもしろさ ネタの面白さっていうのは そもそもストーリーとして 見せようとしてるネタが面白いのか？ という部分です。 そもそも 喋るネタ が そこまでおもしろくないのに 喋り方で挽回するのって大変ですよね？？ 逆に 「ゲイバーに行って童貞卒業した話」 であれば滑る方がむずかしい。 それと同じで、 ストーリー型運用においても ストーリーにするネタが 興味を惹かれる内容なのか？ というのが大前提として重要です。 ②ストーリーの見せ方 おもしろいネタを決めた上で じゃあどういう流れで見せたら おもしろくなるかな？ というのを考えます。 ネタが 「内容」 であれば、 こちらは 「伝え方」 の部分です。 他にもポイントはあるのですが、 まず 強烈におもしろいネタ を考えて、 次に 見せ方としてのストーリー を設定する。 これをある程度決まった状態で ストーリー型運用をスタートすると うまくいきやすいかなと思うので、 この２軸をもとに 具体的な設計の考え方 を伝えていきます！ ①おもしろいネタを考える まず「何が起こるとおもろいか？」 を考える 細かいストーリーに入る前に、 まずはどんなネタならおもしろいか？ というのを考えていきます。 結局、ストーリー型運用の成否は ネタの強さが1番デカい要因 です。 企画の切り口がおもしろければ、 「なんかおもろいことやってんな」 と注目なんて勝手に集まるので まずは 目立つ企画を考えること に 1番のリソースを割きましょう。 ネタを考える上で 需要な要素はコレ！ というのを伝えると… 大きくこの３つです。 「目新しさ」 「変化率」 「事件性」 それぞれ深掘りしていきます。 要素① 目新しさ 他人が誰もやっていなくて、 新規性があること これがめちゃくちゃ重要です。 例えば 「田中の高単価アフィ実践記」の場合… 日本語も絶望的な 超へっぽこ部下 が 高単価アフィという新しいスキーム に 挑戦するのがおもしろい というのがあります。 もし仮に、 高単価アフィというスキームが広まった後 で 普通の人 が高単価アフィ実践記を 出したところで 「へぇ〜」 くらいの感情しか湧かないので そこまでのインパクトはありません。 超へっぽこな部下が 新しいスキームに という新規性が重要です。 他にも 手取り17万円のサラリーマンが 全財産50万円を仮想通貨投資して 3ヶ月で1000万円を目指す過程を 全公開する企画 とかあれば、 非常に注目されるでしょうし 貯金0円から半年で1000万円を稼ぐ 全裏側をリアルタイム公開する チャレンジ とかも、 あまり事前に宣言して裏側を見せる人が いないので目立つかもしれません。 逆に noteで0→1突破する裏側を見せます くらいの企画だと、 やっている人がちょこちょこいる ので 別の部分で何か 新規性 を出さない と 伸ばしにくいかなと思います。 他人がやってないこと 他人がやれないこと 他人がやりたくないこと など考えていくと、 プレッシャーはかかりますが おもろい企画が考えられます。 要素② 変化率 ストーリーのおもしろさは 「スタート地点」と「ゴール地点」 が離れていればいるほど上がります。 さらにいうと、 その変化を出す期間が短いほど インパクトはでかいですね！ 結局、 田中の高単価アフィ企画 が伸びたのも 超へっぽこで無能な田中 ３ヶ月で870万円を達成 という差がえげつなくでかくて 「え、そんなんいけるのアツくね？？」 となったからです。 え、じゃあデカい実績がいるじゃん… と思うかもですが、 ここで言いたいのは そういうことではありません。 実績がそこまでデカくないなら、 あえてスタート地点を下げちゃう というのも１つの選択肢 です。 スタート地点がへぼければ、 ゴールとの差がデカくなります。 大事なのは 実績のデカさではなく 「差」 です。 ナンパ師が女遊びしても 別におもしろくないけど、 チビデブチー牛コミュ障陰キャ が ナンパで童貞卒業する からおもしろい。 （ぶんじろうの例） みたいな感覚です。 ちょい小太りが痩せるよりも マックのハンバーガーが主食の 体重110kg越えが痩せるから おもしろい。 学年ドベのギャルが 慶應に合格するからおもしろい。 （ビリギャル） という感覚をまずは持ってください。 田中の高単価アフィ企画は、 田中が異常にへぼいからおもしろい のです。 この 異様に覇気のない様子 を見てください。 この田中が稼ぐからおもしろいのです。 だからこそ、 へぼさ をストーリーの序盤で 徹底的に刷り込みました 。 ここの差分をどう作るのか？ どの地点の人が、 何を達成したらアツい！となるか？ ここを徹底的に考えてください。 要素③ 事件性 ストーリー型運用において 予期しないトラブルを発生させる というのは必須級に重要です。 次の展開が予想できちゃうアニメが おもしろくないように X運用においても 「どうせ成功するんでしょ」 というのが見えてると おもしろくありません。 次がどうなるか読めない からこそ 発信を見続けたくなるのです。 のんびりくんの裏垢攻略ローンチは この 事件性を使って目立たせた典型例 ですね！ 「裏垢0→1実践記」 という企画が目新しいか？ というと割と 普通のテーマ です。 さらに、 挑戦するのがなまいきくん なので 単にデカく稼いだとしても 「まぁなまいきくんだしね」 「どうせ稼げるに決まってる」 という反応になるはず。 つまり、 ❌ 新規性 ❌ 変化率 という感じですね！ そこで、 この時は裏垢マネタイズとは 関係のないところでなまいきくんが 無駄な暴走をしてエロ画像を撮りまくる という事件性のフックを入れました。 エロは強烈なフックになりますし、 「こいつ何やってんの？！」 となるので 次が読めなくてワクワクします。 警察に捕まりそうになる 貯金ゼロになってホームレス生活をする アカウントが凍結されてしまう 1000万円の借金をする PCデータを全削除してしまう 性病にかかって動けなくなる etc. ぶっちゃけ内容はなんでもいいので 「え、そんなこと起こる！？」 「やばくね、、、？」 「なまいきくん大丈夫？？」 となるような 事件性があるフック を作りましょう。 いったん軽くまとめると 目新しさ・変化率・事件性 この３つを軸に考えると、 より注目が集まるような ストーリーの切り口が決まります。 少しムズイと感じるかもですが、 結局考えているのは 何がどうなればアツいのか？ という１点だけ。 別にストーリーにしても アツくない内容をストーリー型で 発信したところであまり意味がない ので まずは ネタの強さ を考えましょう。 そして、 もし仮にネタが弱いと感じるなら スタート地点を極限に下げて 変化率を大きく見せる 事件性をいれることで 別軸で注目を集められるようにする などなど、 興味付けを高めるような 工夫を考えていきましょう！ ここが決まってしまえば、 基本的にストーリーの詳細は そこまで重要ではありません。 というか、 ストーリー自体は そのときに起こる出来事 、 周りの環境 によって都度変わってくるので 100%テンプレ通りの ストーリー型運用をするなんてのは そもそも不可能 です。 それよりもまずは、 ネタをしっかりと考えて これやったらおもろいやろ！ 絶対注目されるやろ！ という状態を作ること。 ここに頭を使いましょう。 その上でここから、 ストーリーのシナリオを作るための ポイントを解説していきます！ ストーリーにはある程度の 土台になる型 があります。 これを理解しておくことで、 ストーリー型運用をしやすくなるので ぜひ頭に入れておいてください！ ②ストーリーの シナリオを考える ストーリーの大まかな流れを考えます。 まず前提として、 僕自身は細かいシナリオは考えずに その場その場に合わせた内容で ストーリー型運用 をしていますが あとからポストを分析すると この構成になっていることが多いです。 「起承転結型ストーリー」 ①起：〇〇をします！と宣言 ②承：途中経過を配信、続きへの期待感 ③転：ピンチorチャンス ④結：失敗 or 成功 + オチ 最初にエピソードの開始として 「こんなことをします！」 と宣言して 少し後に行動してる 途中経過をポスト します。 それによって “物語が進んでる感” や リアルタイム性が出てきます。 そしてその次のポストは 「転」 で 状況の 上振れ下振れ を出します。 ここれフォロワーの熱が上がり、 手に汗握る展開になってきます。 最後にハッピーエンドか バッドエンドを用意してオチにします。 だいたい バッドエンド の方が ウケがいいのでただ伸ばしたい場合は バッドエンドで終えることも多いです。 最初に紹介した ぶんじろう垢の事例 をもとに 分析していきましょう。 起：物語の始まり、宣言 どんな出来事が起こるのか宣言します。 これだと 浪人界隈の囲われ姫 と エンカ(リアルで会う)してホテルに行く という出来事の始まりを示します。 これだけだと ただの現状報告なので、 次のポストで物語が進んでいくこと を表現します。 承：途中経過 期待度を高めつつ、 読者に応 terial","content":"10-2 売上を爆発的に伸ばすインセンティブ設計の活用テクニック それでは次に、 インセンティブ設計 を使って 自社商品の販売 や アフィで売上を伸ばすため の 具体的方法をお伝えしていきます。 正直かなりムズイ内容です。 まだ理解度30%くらいでも 全然OKなので ゆっくり進めていきましょう！ 突然ですが、質問です。 あなたはこれから、 新商品をTipsでリリースしよう と考えています。 このときに、 売上に影響する 変数 は どんなものがあるでしょうか？ わかりやすくいうと、 何の数字が伸びれば 売上が伸びていくでしょうか？？ 30秒ほど時間を取って ちょっと考えてみてください。 ・ ・ ・ 🕰️ シンキングタイム30秒 ・ ・ ・ はい、準備はいいですか？ 僕がパッと思いつくものを挙げると こんな感じになります👇 教育ポストのインプの伸び いいね・リプで絡んでくれる人の多さ プレゼントの感想を書いてくれる人数 事前スペースに参加する人数 通知オンにしてくれる人の多さ 商品を売ってくれる アフィリエイターの数＆熱量 売りたい商材のテーマに 興味を持ってくれる人数 一緒に盛り上げてくれる 大手発信者の人数 etc. 教育ポスト が伸びれば、 それだけ 母数 が増えますし いいねやリプが高ければ、 それだけ ファン化されてる証拠 ですし、 企画したときに拡散されやすく なります。 プレゼント企画の 感想を書く人 が多ければ それだけ 企画が拡散されます 。 通知オンにしてくれる人 が 多いほど 企画の初速 が伸びます。 アフィリエイターが多いほど 祭り感 が出ますし、 リリース後も売上が後伸び します。 他にも 大手発信者 を巻き込めれば 一気にたくさんのフォロワー外部に 認知を広めること が可能です。 スペースに多くの人が参加したら それだけ多くの人にリアルタイムで 濃い教育 をかけられます。 などなど… 他にもあげていけば、 売上をアップさせる変数は たくさんある と思います。 では、質問その２！ それぞれの変数を伸ばすには、 何をすればいいと思いますか？ たくさんあるので、 １つだけ例にとると… 例えば、 スペースに参加する人数を 最大化するには何をすれば いいと思いますか？ どうやったらより多くの人が スペースに参加したくなりますか？ 小手先テクニックでもいいので、 パッと思いつくものを30秒で 出してください。 ・ ・ ・ 🕰️ シンキングタイム30秒 ・ ・ ・ はい、 それでは出していくと… Xでしつこく予告をする LINE・メールで予告をする 「スペースでやばいこと話しちゃいます...」 と事前に興味付けしておく 「本当に有益な濃い情報は スペースとかリアルタイムの場所で出る」 みたいな教育をしておく スペースに参加する人を優遇する ブランディングをしておく 通知オン させておいて スペースに気づきやすくさせる スペースの序盤で有益情報を話して 「有益すぎます！」 とリプさせる 毎回有益なスペースをして 「聞き逃したらもったいない」 と印象づけておく スペースの録音をあえて残さない etc. 事前にしっかりと 予告を入れるのはもちろんのこと 今日のスペースで やばいこと話しちゃいます... みたいな事前の興味付けでも 参加度合いが変わってきます。 さらに 本当に有益な濃い情報はスペースとか リアルタイムの場所でが出る みたいな教育をしておけば スペースで情報を拾おう！ という思考の人が増えるでしょう。 スペースに参加する 頻繁にリプで絡んでくれる みたいなアクティブなファンを 圧倒的な太客扱い するのも効果的です。 スペースに参加する ↓↓↓ なまいきくんに 覚えてもらえる ↓↓↓ なまいきくんに 認知されて名前呼ばれたいから スペースに参加しよう こういう現象も起こります。 スペースの序盤で有益情報を話して 「有益すぎます！」 とリプさせる とかもいいですよね。 スペース開催ポストのリプ欄に 「有益すぎますw」 「これ聞き逃したらもったいねぇ…」 「これえぐいですねww」 とかが大量についてたら、 スペースが気になって 参加しちゃう人も増えるでしょう。 スペースの録音をあえて残さない みたいなのも効果的で 「前のとき聞き逃して、 録音手に入らなかった… 次はリアルタイム参加しよ」 と思う人が非常に増えます。 こちらはゲリラ開催で 雑談スペースをしたときのポスト です👇 リプ欄はこんな感じになっています 「すんごい面白かったです！！」 「内容濃すぎて作業どころじゃないw」 「通知オン大正解です！！」 「マジで最高でした！！」 こういうリプ欄を見た人は 「うわ…見逃したわ…」 と後悔して 次からは通知オンで リアルタイム参加するはずです。 色々言いましたが、 これら１つ１つが スペースに参加する インセンティブ になってきます。 スペースはポストよりも 圧倒的に濃い情報を伝えれますし 人柄も伝わりやすいので 参加した人と参加してない人では ファン化度合いに大きな差がつきます。 なので、 なまいきくんはスペースに 参加してもらう という １つのアクションにおいても これだけのインセンティブを 用意してます。 単に告知だけ して スペースを開く人よりも これだけインセンティブを用意して ”参加させる人” の方が 参加者はめちゃくちゃ増えます。 スペースに参加する人の 熱量も人数も全然違います。 なまいきくんの商品リリース前の プロモーションを見ても おそらく表面しか真似できません 。 「あ、スペースやったら売れるんだな」 という解像度しか、 多くの人はわからないでしょう。 ですが、 別に売れている理由は スペースをやったからではありません 。 これだけの インセンティブを用意して 参加させたからこそ、 圧倒的な威力を出せてるのです。 なまいきくん ＝影響力があるから稼げてる と思ってる人が多いですし、 実際それもありますが こんな感じでちゃんと インセンティブを用意してるからこそ 影響力がついてきてる のを まずは理解してください。 影響力は待っていてもつきません。 センスがあれば伸びるわけでもありません。 正直、 ここまで裏側を理解してる人は ほとんどいないので、 もしインセンティブ設計を理解して 30〜50％ でも活かせれば、 Xでは かなり上位 に入れます 。 今の段階で 理解しきれなくてもOKなので イメージだけでも掴んでください。 そして… 当たり前ですが、 スペースに参加してもらうのは 売上を伸ばす変数の1つ でしかありません。 本来であれば、 アフィしてもらう ポストに注目してもらう 商品テーマに興味を持ってもらう 通知オンしてもらう プレゼントを受け取ってもらう プレゼントの感想を書いてもらう みたいな感じで、 売上を伸ばす変数 が無限にあって それぞれの変数に対して 複数のインセンティブ がついてきます。 さらにいうと、 スペースに確実に参加させるために 「通知オン」しといてもらいたい！ となれば、 通知オンさせる という行動にも インセンティブ が必要になります。 これを頭の中で 無意識レベルでできる ようになると 信じられないレベルで 読者を思い通りに動かせて 反応率が劇的に上がります 。 セミナーから面談に繋げたいな… と思ったら、 じゃあ明日の午後に セミナーの告知ポスト をしよう。 その告知ポストを見てもらうための インセンティブとして軽く ストーリー型運用 を入れとこうかな。 みたいな思考で 戦略を立てることが可能です。 他にも、 商品売りたいけど フォロワー少ないんだよな と思ったときに じゃあ、 少ないフォロワーでも デカく売上を立てるには 大手発信者を巻き込む のが早いな ↓↓↓ それなら、 どんなインセンティブ を用意すれば、 大手の〇〇さんは リプや引用したくなるかな？ という思考ができます。 この思考を１つ持っとくだけで 無限に施策なんて思いつけると 思いませんか？？？ 具体的な施策よりも、 この考え方が1番重要なので まずはそこを押さえてください。 ということで、 インセンティブ設計の 基本の考え方をお伝えしました！ では、ここからは どうやったらインセンティブ設計を 自力で考えることができるのか？ という具体的な頭の使い方を ３つのステップで解説していきます！ インセンティブ設計の手順 なまいきくん自身は もはや感覚でやっていますが あえて言語化していくと こんなステップになります。 ①目的を決める ②目的に影響する変数を出す ③各変数を最大化する インセンティブを設置する それぞれ掘り下げていきます！ 【ステップ１】目的を決める 何をしたいのか？ という目的を決めます。 ローンチの売上を伸ばしたい Tipsアフィでこれだけ売りたい 無料面談に誘導したい などなど、 なんでもいいです。 インセンティブ設計は 目標から逆算して考えるので まずはここを明確にしましょう。 【ステップ２】 目的に影響する変数を洗い出す 先ほど、Tipsローンチの例で いろんな 売上に影響する変数 を 洗い出してもらったように 商品テーマに多くの人が興味を持つ 長文教育ポストのインプが伸びる アフィで紹介してくれる人が多い プレゼントの受け取りが多い 感想を書いてくれる人が多い スペースの参加者が多い などなど、 目的（多くの場合は売上）に影響する 変数を具体的に洗い出します。 ビジネス初心者の方は、 まだこれらの変数が どう売上に影響するか を 言語化できないと思うので 軽く説明しておくと… ■商品テーマに興味を持ってくれる人の多さ まずは 「Xマネタイズ」 について 商品を売りたいと仮定すると Xの魅力やハードルの低さを語ったり 実績をどんどん見せていったりして、 興味を持たせないといけないですよね。 ■教育ポストを見てくれてる人数 ローンチ期間において、 インプ数は無視できない数字 です。 １つ１つのポストが 商品販売において教育につながる 大事なポストなので、 教育ポストのインプが伸びる ＝教育がかかる人数が増える ＝商品の売上がぶち上がる だからこそ、 僕はローンチ期間は特に インプが伸びるように運用しています。 ■通知オンしてくれてる人の多さ 𝕏でなまいきくんを 通知オンしてくれてる人が 多ければ多いほど、 ポストしたときの 初速がつきやすくなります。 ・ポストして数秒で10いいね以上つく ・Spaceを開いたら 最初から100人以上が参加 ・商品を出すときは400人以上が事前待機 などなど、 こんな芸当が可能なのは 通知オン勢が多いから です。 現状のXでは アルゴリズムによってフォローしてても ポストが流れてこないことがあります。 ですが、 通知オンしてもらうと、 アルゴリズム無視で強制的に ポストを見てもらえる し 、 特に熱量があるフォロワーに 確実に届けられるので、 非常に有利になります。 通知オンして読者が 常にポストを見張っておいてくれれば 教育するのはありえないほど簡単です。 ■アフィで紹介してくれる人の数＆熱量 僕はローンチで Tipsを使うことが多いですが、 アフィ機能があることによって 競合の発信者が大量に紹介してくれます 。 アフィしてくれる人が増える ↓↓↓ ローンチ自体が盛り上がる ↓↓↓ 商品の総売上がアップする 彼らが紹介してくれるのは ・良い商品でおすすめできるから ・紹介したら儲かりそうだから という２つがあると思っていて、 ただ良い商品というだけで アフィに参戦してくれる人はごく一部です。 「いかに紹介しやすい商品にするか？」 「いかに紹介したいなと思わせるか？」 こういう思考を持っておくと、 「アフィしてくれる人」 という変数を アップさせることができます。 また、 ただXのポストで紹介するだけでなく、 ・紹介記事を書いてくれる","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/lmKPPner7s0L/lesson/C39KOszvwZ45","createdAt":"2026-05-16"},{"id":"scr-1779455314510-iescds","title":"14-2 XTEPリスト獲得の流れ | なまいきスクール会員サイト","category":"material","content":"14-2 XTEPリスト獲得の流れ XTEPってなに？ XTEPについて あまりイメージが湧いてない人も 多いと思うので、 最初に XTEPでリスト獲得する流れ を ざっくりと話していきます。 XTEPでリスト獲得する流れは 大きくわけて 4ステップ 1.XTEPを使って企画ポストする ↓↓↓ 2.読者がリプをする ↓↓↓ 3.シクリプでプレゼント配布する ↓↓↓ 4.受け取りの際にLINE登録させる 1つずつみていきましょう！ 1.XTEPを使って企画ポストする 【5日間プレゼント企画】 メルかがり仕入れ×ブランド転売で 副業初心者が月利5〜10万円を 最短で達成した手法を無料公開！ 副業にありがちな 「作業してるのに結果が出ない…」 を抜け出して、 ちゃんと売れて、 ちゃんと利益が出る動線が手に入る。 この手法を使って: ・初月から利益5万円& 翌月に月利10万円を突破した初心者 ・副業迷子だった会社員が 4ヶ月で月利30万えを安定化 ・在庫抱えて赤字だった人が 半年後に月利50万円達成 など、成果布告あり 【受け取り方】 ①フォロー ②いいね＆リポスト ③「初心者」とリプ まずはXで 企画用ポスト を投稿。 受け取り方については フォロー いいね リポスト 特定のワードをリプ など 自由にXTEP上で設定可能。 2.読者がリプをする 設定したアクションに応じて 読者がリプを送ってくれます。 画像の場合は、 受け取り方法を リプに 好きな絵文字 を送ってと 指定していますね。 3.シクリプで プレゼント配布をする シークレットリプライ という アクションした人にしか見れない リプで プレゼントが配布 されます。 4.受け取りの際にLINE登録させる そして、 プレゼント受け取りの タイミングで LINEに登録 してもらいます。 1.XTEPを使って企画ポストする ↓↓↓ 2.読者がリプをする ↓↓↓ 3.シクリプでプレゼント配布する ↓↓↓ 4.受け取りの際にLINE登録させる 副業系のX を見てる人なら この流れは見たことがあるはず。 ただ、具体的に どんな手順でこの企画を作っていくの？ という部分は おそらくわからないと思います。 効率の悪い間違った手順 で やってる人も多くいるのでは... ということで ここからは バズるXTEP企画を作成する より具体的な手順 をみていきましょう！ XTEP企画作成の手順 それでは 具体的にどうやって XTEPを使ってリスト獲得 していくのか？ という部分を話していきますね！ 事前に言っておくと 次回のLv.15の講義では Kくんが XTEPを使った集客術 について ノウハウを共有 してくれます。 Kくん自身 XTEPの代理店 もやっていて なまいきくんよりも XTEPについては データを大量に集めている ので XTEPを活用するプレイヤーの視点 から 具体的な手法を伝えてくれるはず。 なので今回の講義では 流れや考え方のポイント というのを 中心に押さえていってください。 XTEP企画作成の手順は 大きくわけて以下のステップ。 1.バズってるXTEP投稿をリサーチ ↓↓↓ 2.XTEPネタを洗い出す ↓↓↓ 3.企画用ポストの作成 ↓↓↓ 4.シクリプ誘導文を作成 ↓↓↓ 5.プレゼントの中身作成 具体的な説明をする前に まず 大事な考え方 を 話していくのですが、 XTEPにおいて 「プレゼントの中身」は あまり重要じゃありません。 もちろん プレゼントの中で 教育 ができると マーケ全体の観点では アツい ですが プレゼント内容が薄かったとしても XTEPでリスト獲得は可能。 プレゼント内容は 受け取った後しかわからないので リスト獲得数への影響は 小さい んですよね。 じゃあプレゼントよりも 重要なのは何か？というと、 XTEP企画ポストのバズる切り口 ＝企画コンセプト これです。 なんなら バズる切り口 を考えることに 9割以上の労力 をかけてOK！ 先ほど5つのステップを 1.バズってるXTEP投稿をリサーチ ↓↓↓ 2.XTEPネタを洗い出す ↓↓↓ 3.企画用ポストの作成 ↓↓↓ 4.シクリプ誘導文を作成 ↓↓↓ 5.プレゼントの中身作成 この順番で提示しましたが、 プレゼントを作るのは 最後の最後に設定 して 必ず 「フロントのポスト」 を先に作り、 フロントのポストに合わせて プレゼントを用意する 手順 でやってください。 これは実際に、 部下の田中を 指導してたときのチャットです。 中身からじゃなくて 元ポストから作りたいですね 先に中身から作るほど無駄なことないです そもそも元ポストが 微妙だったら即ボツなので。 今あるものじゃなくて いくら良いプレゼントを 労力かけて用意しても、 その企画ポストや切り口が 魅力的じゃなければ XTEPが伸びることはありません。 これはもちろん ・プレゼント企画 ・エバー導線 ・セミナー開催 ・ローンチ などでも同じことが言えますね！ セミナーの内容がいくらよくても、 切り口がありきたりで おもしろくなければ たいして集客できないし、 集客数が少ない のに めちゃくちゃ労力かけて セミナーしても コスパが悪い です。 例えば マッチングアプリで そもそも プロフ画像がへぼい と いくら性格が良くて 実物がかっこよかったとしても そもそもマッチしないですよね？ プレゼントの中身を 最初から作り込んじゃう のは めちゃくちゃダサい プロフ画像のまま デートでのトーク術とかを 磨いてるような状態 。 まずはウケのいい プロフ画像を作ろうぜ！ というイメージ。 「ウケる切り口」を考えて ↓↓↓ そこに「コンテンツ」を持ってくる という思考法は、 かなりマーケ寄りの考え方 で X界隈の人がもってません。 ただし どんな企画であったとしても ウケる切り口 から入らないと 無駄な労力を使って 大滑りをかますことになるので 絶対頭に入れておいてください。 それでは、 先程話した視点を持ちつつ それぞれのステップを見ていきます！ 1.バズってるXTEP投稿をリサーチ とにかくまずは リサーチ 。 「ウケる切り口」 と言っても 何がウケるかは市場を見ないと わからない ので まず 競合のXTEPやプレゼント企画 から 伸びてるものを探しましょう。 やり方としては Xの検索窓にワードを入れて検索 「いいね」＋「欲しい人」 「いいね」「配布」 「いいね」＋「リプ」 「いいね」＋「配りま
