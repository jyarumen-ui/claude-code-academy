　AIジャンルの高単価アフィで3ヶ月後に月100万マネタイズが目標です。  ❸自分なりの意見や仮説 ・家庭と仕事で忙しくても、スキマ時間で稼げる。的な感じで発信を検討しています。 現段階では実績がないため、現状のみを記入しています。  ❹ 質問内容 アイコン、ヘッダー、プロフィールの内容、コンセプトの方向性に改善点などあればご教示お願いします。   お忙しいところ恐れ入りますが、ご回答のほどよろしくお願いします。\n\n---\n\n@なまいきくん  @Yusuke＠講師  @あか@運営   初めての質問です。  ❶質問のおおまかなテーマ 発信コンセプトについて  ❷現在の状態、目指すゴール 現在の状態：スクールに入り、ジャンルはAIで決定 ・AIを普段から利用し、AIの魅力・可能性を感じている ・まず実店舗での集客事例（webマーケティング事例）があるのでジャンルとしてはAI×SNS(集客） ・X/インスタ/スレッズで同じソースを配信しスクール系に誘導しマネタイズをしようかと考えている  目指すゴール：発信コンセプトを決めて、アカウントを育てていきたい  ❸自分なりの意見や仮説 【ターゲット読者の現状】  ・40代以上の社畜 ・PCも苦手の方 ・本業が忙しい ・現在の職種に漠然と不安を頂いている ・AIを利用して未来を変えたい（副業も視野） ・ビジネス初心者／何から始めればいいかわからない層。 ・40代以降でも遅くない稼ぎ方に興味がある ・40代男性会社員・夫婦家庭持ちの会社員    Who：誰に向けて発信するか？  【ターゲットの悩み・課題】  ・自分はパソコンが苦手だから無理そう ・何から始めればいいのかわからない ・40代から新しいことを始めるのは遅いと感じている ・AIは若い人や詳しい人しか使いこなせないと思っている ・今後AIを利用しないといけないと感じている ・難しい設定や専門用語が多そうで拒否感がある ・本業と家庭が忙しくて作業・副業の時間が取れない   What：どんなゴールに連れていくか？ 3～6ヶ月で“40代未経験からAIを利用してAI人材になり付加価値として収益化の仕組みを作り、AI活用or副業で月30〜100万円を達成する 【ゴール達成後の理想の状態】 AIを使いこなせる自信がつく（AI人材） 毎月の生活費に余裕ができる 将来への漠然とした不安が減る 定年後にも続けられる収入源\n\n---\n\n回答ありがとうございます。追加で質問させていただければと思います。 ❶ジャンル選定と発信の進め方について追加で質問です。  ❷「実績がなくてもAIや投資など伸ばしやすいジャンルで発信していく」「ある程度の成果を出す過程をストーリーとして発信していく」というアドバイスをいただきました。 また、「複数アカウント運用よりも1つのアカウントに集中する方が伸びやすい」とのことも理解しました。  現在はレベル1のカリキュラムを終えた段階で、ジャンルやコンセプトを決めきれずにいます。 最終的なゴールは「高単価アフィを月100〜300万円で安定して売ること」です。  ❸現時点で自分なりに考えていることとしては、 ・マネタイズへの説得力を出すには、やはり何らかの“実績”が必要では？と感じています。 ・ただしアカウント設計の段階では、実績による差別化よりも「発信内容でどれだけ読者を惹きつけるか」が重要になるのかな？と思っています。 ・「ゴールから逆算して考える」という点も、まだレベル1を終えた段階では抽象的にしか考えられておらず、「高単価アフィを売る→そのために○○人集客→そのために××のような投稿をする...」程度のイメージしか持てていません。  ❹以上を踏まえて、以下の3点を伺いたいです。 ① 現時点では“実績づくり”よりも“発信内容の磨き込み”を優先すべきでしょうか？ ② 実績がない段階でも読者を集められる差別化軸は、アカウント設計時にどのように考えるべきでしょうか？（プロフはカリキュラムに則り定石通りに作る予定ですので、この段階では差別化は難しいと考えています） ③ 「ゴールから逆算思考」はどのレベル帯で具体化していくのが適切でしょうか？（現時点では抽象的すぎて手が動かせない状態です）\n\n---\n\n初回講義お疲れ様でした！\n\n取り急ぎ復習や今週のタスクこなしやすいように講義スライドと、GPTs含む資料の配布だけ行いますのでご確認ください！\n\n【講義スライド】\n\n２−１売れるアカウントの初期設計〜はじめに〜\n\n２−２Xマネタイズの全体像\n\n２−３発信テーマの決め方\n\n２−４発信コンセプトを決める\n\n２−５プロフィール設計を学ぶ\n\n【講義関連資料】\n\n高単価案件ジャンル一覧\n\ n\n---\n\n@Yusuke＠講師  いつもお世話になっております。  ポストについて2点質問があります。  【現状】 今までnoteやブログ投稿した際のお知らせ（記事タイトル＋URL or 文章＋URL）として使っていた、フォロワー数250人程度でまったく反応のなかった投資垢で、今週からポストを開始して3日目という状況となります。  【質問】 ・本文にハッシュタグは入れた方が良いのでしょうか？ ・note投稿した際に、文章＋URLのポストをしていますが、継続して問題ないでしょうか？  どうか宜しくお願いいたします。\n\n---\n\n@Yusuke＠講師 さん お世話になっております！  スクール生の方のアイコンを元にアイコン作成してみたのですが、キャラ感あり覚えやすいアイコンになってますでしょうか？？   またポスト作成してみましので添削いただけますと幸いです！ よろしくお願いいたします  ■ポスト1 副業の動画ばっか見てる人、そろそろ気づいた方がいいw 動画見て「勉強した気」になってる時点で、正直もう負けてるw 「何からやればいいんだろ〜」って悩んでる間に 行動してるやつは、とっくに1円稼いでる いいからまず1回やれ メルカリ入れて家のゴミ1個出すだけでいい それだけで上位10%の“やってる側”に入れる まだ見てるだけの人は、この先もずっと同じ 人生変えたい人だけ保存しとけ  ■目的 認知獲得：行動してない初心者を“1歩動かす  ■想定読者 「情報収集ばっかで動けてない副業初心者」  ■工夫した点 ① フックで「動画ばっか見てる人」で自分ごと化してもらう ②「勉強した気になってる時点で負け」で イラッとする一言入れ感情動かす ③「行動してるやつは1円稼いでる」で 自分だけ遅れてる感を作る ④「メルカリでゴミ1個出せ」簡単かつ脳死できること   ■ポスト2 スキルない。副業経験ない。お金もない。 それでも稼ぎたいならインスタやれ。 在庫なし。初期費用ほぼ0。 スマホ1台で始められる。 なのに副業やりたいって言いながら インスタすら始めない人多すぎ。 正直それで「稼げない…」って 言ってるの普通に意味不明。 副業で1円も稼げてないなら まずインスタ始めるところから。 インスタ副業やってる人いる？リプで教えて。   ■目的  認知獲得：「まだ何も始めていない、あるいは稼げていない0〜1段目スキルがない初心者  ■想定読者： 副業に興味はあるが、何から始めていいかわからない0段目の人  ■工夫した点 ① フ\n\n---\n\n0921\n•ポスト\n-lv6目的教育意識したポスト(ターゲット:主婦層、AI界隈)\n-冒頭フック実践\n•いいね、リプ周り、リポスト\n•買収垢リストリサーチ\n•盗撮系画像生成(生成中)\n•マインド講座聞き流し\n•経営者と呑み、ネタ作り\n•新規ツール生成練習\n•6時起き(早起き) (編集済)\n2025年9月22日月曜日 1:57\n\n---\n\n万インプ出ました！\n\n行動・投資の教育ポストです。\n\n伸びた理由は2点です。\n①冒頭で「年商億〜数千万稼いでる人」とフックになる文を書く\n②「まともな人間なんて1人もいなかった」と書くことで、「どういうこと？どんな奴？」と詳細を気にならせて下の文章まで読ませる。","sourceUrl":"","createdAt":"2026-01-01T00:00:00.000Z"},{"id":"topic-1779711128741-dvvlio","title":"インセンティブ設計｜読者が反応・拡散したくなる仕掛け","category":"hook","content":"【インセンティブ設計の原則】\n反応率を上げるには「読者が反応したくなる理由」を意図的に作る。\n\n■ 反応ポイントの種類：\n・同意したくなる（「それな！」と思わせる）\n・教えたくなる（「実は○○ですよ」と言いたくなる）\n・自分事に引き付けられる（「自分もこれだ」）\n・意見を言いたくなる（議論を誘発する）\n・感謝したくなる（有益すぎて共有したくなる）\n\n■ 実践ポイント：\nインプレッション＝届く人数。反応率＝その中で動いてくれた人数。\nどちらも設計次第で上げられる。\n\n---\n\nいつもと時間が異なります\n\n第10回目の講義を\n\n明日10/25(土)の\"15時\"より行います！ \n\n内容は\n\n・【X運用必殺技２】インセンティブ設計術\n\n・売上を爆発的に伸ばすインセンティブ設計の活用テクニック\n\nこちらになります！\n\n前回の講義では、なまいきくん式X運用の必殺技１つ目としてストーリー型運用をお伝えしましたが、\n\n今回の講義は、なまいきくん式X運用の必殺技2つ目として\n\n読者を思いのままに動かし、インプ・反応率が爆上がりする悪魔的テクニック【インセンティブ設計】を解説していきます！\n\nインセンティブ設計をマスターすれば、ポストした瞬間に大量のいいねがつき、普通のポストにも何十件とリプが届く状態を狙って作れます！\n\n今回もなまいきくんがリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！\n\n繰り返しになりますが、明日の講義だけ15時から行うので、\n\nカレンダーに入れるなりして時間間違えないようお願いします！\n\n---\n\n【2周目講義】\n\n2周目講義の第9回目を\n\n本日1/25(日)の21時より行います！ \n\n内容は\n\n・【X運用必殺技２】インセンティブ設計術\n\n・売上を爆発的に伸ばすインセンティブ設計の活用テクニック\n\nこちらになります！\n\n前回の講義では、なまいきくん式X運用の必殺技１つ目としてストーリー型運用をお伝えしましたが、\n\n今回の講義は、なまいきくん式X運用の必殺技2つ目として\n\n読者を思いのままに動かし、インプ・反応率が爆上がりする悪魔的テクニック【インセンティブ設計】を解説していきます！\n\nインセンティブ設計をマスターすれば、ポストした瞬間に大量のいいねがつき、普通のポストにも何十件とリプが届く状態を狙って作れます！\n\n今回もリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！ (編集済)\n2026年1月25日日曜日 20:03\n\n---\n\n昨日出したポストがバズリ始めてるので、取り急ぎ共有します↓\n\nちなみにこの１ポストだけでフォロワー350人以上増えてますね！\n（まだ伸びてるのでもう少し増えるかと）\n\n【ポストの意図】\n目を引く＆反応したくなるようにしてバズらせ狙い。\n他の要素としては、投資の教育、知識を学ぶことの教育、基準値の高さを見せつける。\n\n★目を引く\n→投資本めっちゃ買いまくって積んでインパクト出す。こういうの他に誰もやってなかった。\n他の人が先にやってたら微妙。\n\n★反応したくなる\n→反応ポイントは大体こんな感じ：\n\n・これ自分も買った、これいい本だよ\n\n・本ばっか読んでも意味ないよ、実践のほうが大事\n\n・金使いすぎ、資金管理したほうがいい\n\n・気合入ってますね、凄いですね\n\n・独学でやってるから本読んだこと無いわ\n\n・後ろにうつってるハゲ薬\n\n【Yusukeメモ】\nやっぱ投資界隈は教えたがりのオッサンみたいな人が多い。ポストで読者に意見聞いたりするの良さそう。思ったより本の選定は良いっぽいからちゃんと勉強しよ。にしても買いすぎた、読む時間無え\n\n---\n\n@あか@運営  @Yusuke＠講師  @なまいきくん    いつも大変にお世話になっております。  発信スタイルと取り扱い内容の割合についてご相談させていただきたく書き込み致します   【アカウント】 ピチュン@ポケモンせどり @moon_sight22   【質問】 現在の発信スタイルと投稿内容のバランスについてご相談させてください。  【要点】 ポケモンカードせどりと初心者向けオールジャンルせどりの投稿割合の最適解について知りたい  私の発信テーマは大きく2つあります。 1つ目がポケモンカードのせどり、2つ目が初心者でもすぐに実践できるオールジャンルのせどり（釣具・スポーツ用品・アパレルなど）です。  ポケモンカードについては、以前Yusukeさんとも話していましたが、ポケカをメインに取り扱っている層は資産に余裕がある方が多く、せどり自体への理解も高いため、反応は非常によく、フォロワーやインプもかなり伸びます。 一方で、ポケモンカード背取りに特化しすぎると、物販スクールへの導線や「再現性のあるせどり」という文脈が弱くなってしまう懸念があり、現在はあえて初心者向けのオールジャンル背取りも並行して発信しています。  実際の数値感としては、 ポケモンカードの投稿はインプレッション・フォロワー増加ともに非常に強い オールジャンル背取りは、ポケカ投稿に引っ張られる形で、フォロワー数の割には安定して伸びている  収益面では、 ポケモンカード背取り：月10〜15万円 初心者向けオールジャンル背取り：月5万円前後（初心者でもできる範囲に抑えている）  現在は ポケモンカード50％：初心者向けオールジャンル50％ という投稿バランスで運用しています。  この状況を踏まえた上で、 この50:50のバランスは妥当でしょうか？  ポケモンカードについて発信すると、とにかくフォロワーの伸びが良\n\n---\n\n回答ありがとうございます。 追加で質問させていただけたらと思います。  ❶ ジャンル選定と今後の運用設計についての追加質問です。  ❷ 前回の回答で、 ・現状のアカウントは「AIジャンルというより占いジャンルに見える」 ・AIメインならバズ狙い、占いメインなら実績×ストーリー運用 という整理をしていただきました。  現在は実績はほぼなく、大きな成功体験やトラブルも起きていない状態です。 そのため、「読者がエンタメとして追いたくなるストーリー」をどのように作るべきかで悩んでいます。  ❸ 上記の回答を踏まえ、今の自分がやるべきことについて以下のように仮定しています。  ・まずはジャンルを曖昧にせず、どちらかにハッキリ寄せる必要がある ・現段階では 　「投稿を続ける → 反応を見る → 書きやすい型が残る → 最後まで残った“癖”が強みになる」 　という流れを作ることが重要なのではないか ・差別化や強みは最初から見つけるものではなく、運用の中で自然に浮かび上がってくるものだと考えています ・伸びているポストについては、 　「この人は何者か」ではなく 　「なぜこの文章・構成・言葉選びが伸びたのか」 　という視点で観察・分析することが今の自分に必要だと感じています  一方で、以下の点についてはまだ整理しきれていません。  ・AIと占い、現状どちらをメインにする方が現実的なのか ・実績やトラブルがない状態でも、連載のように追ってもらえるストーリーは作れるのか ・成功ポストのリサーチ方法として、 　おすすめ欄で見つけたポストから過去投稿を遡るやり方で問題ないのか ・現時点でアフィリエイトリンクを用意しておくべきか、それとも集客・運用力強化を優先すべきか ・「厳選ポストネタ集」を軸に投稿を作っていく判断が正しいのか  ❹ 以上を踏まえて、以下について確認させてください。  ① 現在のフェ\n\n---\n\n田中のアカウント公開と、実際に買収してアカウント開始したところから、月870万円売り上げるまでに至った全ポストをスクール生限定で公開しようとは思ってるのですが、\n\nそれに加えて、僕も皆さんと同じく0から新アカウント始めて売り上げや裏側の数字をリアルタイムで全公開していけば、初期運用のイメージだいぶつきやすいかなーと思ったりするんですがいかがですか？\n\nかなり労力かかるので、正直なところちょいグダってはいるのですが、反応多そうやったら頑張りますww\n\nちょっとスタンプ待ってますね！\n\n---\n\n第5回目の講義を\n\n明日9/20(土)の21時より行います！ \n\n内容は\n\n・ポストがどう売上に影響するか？\n・濃いフォロワーをバンバン集客する方法\n・反応が取れるポストを作る方法\n\nこちらになります！\n\nこれまでの講義で最低限のポストは作れる状態になってもらったので、\n\n今回はより上を目指して、ポストの質を上げるテクニックや方法について語っていきます！\n\nこれをマスターできれば、\n\nそのへんの”なんちゃって発信者”よりも圧倒的に運用がうまくなりますし\n\nライバル弱くね？？となるはずですw\n\n今回もなまいきくんがリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！\n\n---\n\n第5回目講義お疲れ様でした！\n\n取り急ぎ復習しやすいように講義スライドを配布しますのでご確認ください！\n\n【講義スライド】\n\n6-1 ポストがどう売上に影響するか？\n\n6-2 濃いフォロワーをバンバン集客する方法\n\n6-3 反応が取れるポストを作る方法","sourceUrl":"","createdAt":"2026-01-01T00:00:00.000Z"},{"id":"topic-1779711128757-shvmhe","title":"ポスト構成の基本｜PASONA・起承転結・教育型の3パターン","category":"post-structure","content":"【3大ポスト構成パターン】\n\n■ PASONA型（問題提起→共感→解決）\nP（問題）：「○○で悩んでいませんか？」\nA（共感）：「私も同じでした」\nS（解決策）：「これで解決できました」\nO（提案）：「具体的な方法は…」\nN（行動）：「今すぐ○○してください」\nA（成果）：「これで○○になれます」\n\n■ 起承転結型（ストーリー系）\n起：状況設定\n承：問題発生\n転：気づき・転換点\n結：解決・教訓\n\n■ リスト型（有益情報特化）\n「○○な人に刺さる□個のこと」→箇条書きで具体的に\n\n---\n\n@なまいきくん  @Yusuke＠講師  @あか@運営   お世話になっております！ 質問お願いいたします  ❶質問のおおまかなテーマ 発信方向性チェックとプロフィール添削   ❷現在の状態、目指すゴール 現在の状態：コンセプト決定（AI×ライティング） 目指すゴール: アカウントとコンセプトの確定  ❸自分なりの意見や仮説 ・アイコンはクセが強いキャラと視認性を意識。ヘッダーは実績が何もないので一旦アイコンに合いそうなもので選びました。 ・プロフィールは実績がないので自分の立ち位置と今やってることだけを記載してます。 ・コンセプトは Who：文章が書ければ稼げると分かっているのに、文章が書けずに毎回詰んでしまう20〜30代の副業初心者 What：文章作成が苦手な初心者がAIライティングで発信できる人になる 　　　発信できるようになったら、副業で収益化できるようにする（高単価アフィにつなげる） 　　　月10万稼げる仕組みを持つ How：①書けないを解決する 　　　②発信できる人にする 　　　③Xで集客できるようにする 　　　④note、プロンプト、GPTsをリリースして収益を作る 　　　⑤仕組み化 で考えています。  ❹質問内容 ・アカウントで修正した方がいい箇所はありますでしょうか？ ・このコンセプトでスタートしてよいでしょうか？  よろしくお願いいたします！ (編集済)\n2025年11月29日土曜日 4:06\n\n---\n\n回答ありがとうございます。 追加で質問させていただけたらと思います。  ❶ ジャンル選定と今後の運用設計についての追加質問です。  ❷ 前回の回答で、 ・現状のアカウントは「AIジャンルというより占いジャンルに見える」 ・AIメインならバズ狙い、占いメインなら実績×ストーリー運用 という整理をしていただきました。  現在は実績はほぼなく、大きな成功体験やトラブルも起きていない状態です。 そのため、「読者がエンタメとして追いたくなるストーリー」をどのように作るべきかで悩んでいます。  ❸ 上記の回答を踏まえ、今の自分がやるべきことについて以下のように仮定しています。  ・まずはジャンルを曖昧にせず、どちらかにハッキリ寄せる必要がある ・現段階では 　「投稿を続ける → 反応を見る → 書きやすい型が残る → 最後まで残った“癖”が強みになる」 　という流れを作ることが重要なのではないか ・差別化や強みは最初から見つけるものではなく、運用の中で自然に浮かび上がってくるものだと考えています ・伸びているポストについては、 　「この人は何者か」ではなく 　「なぜこの文章・構成・言葉選びが伸びたのか」 　という視点で観察・分析することが今の自分に必要だと感じています  一方で、以下の点についてはまだ整理しきれていません。  ・AIと占い、現状どちらをメインにする方が現実的なのか ・実績やトラブルがない状態でも、連載のように追ってもらえるストーリーは作れるのか ・成功ポストのリサーチ方法として、 　おすすめ欄で見つけたポストから過去投稿を遡るやり方で問題ないのか ・現時点でアフィリエイトリンクを用意しておくべきか、それとも集客・運用力強化を優先すべきか ・「厳選ポストネタ集」を軸に投稿を作っていく判断が正しいのか  ❹ 以上を踏まえて、以下について確認させてください。  ① 現在のフェ\n\n---\n\n【お知らせ】\n\nトレンド速報部屋をはじめます！！\n\n新しく「トレンド速報」のチャンネルを作りました！ \n講義では、教育記事の書き方やXの伸ばし方などを伝えていますが、\n 実際に結果を出していくには「X運用のノウハウ×各市場のトレンド」の両軸が重要です。\n\nとはいえ、\n\n・自分1人でリサーチするのは難しい\n・発信者が多すぎて追いきれない\n\nみたいな人も多いと思うので...\n\nこのたび、\n全体に情報を共有できるチャンネルを作ることにしました\n \nこのチャンネルでは   各界隈・ジャンルのトレンド\n  伸びているアカウント、\n　　バズポスト分析\n\n今狙い目のテーマや切り口\n\nなどを定期的に発信していきます！\n\n「なぜこの人が伸びているのか」\n「なぜこの投稿が刺さったのか」\n「なぜこのアカウントがウケているのか」\n\n自分で考えられるようになる\nきっかけとして作ったので、\n\n ぜひ普段の発信や\nリサーチに役立ててください！\n\n---\n\n教育記事完全攻略講義を\n4/25(土)の21時より行います！\n\n内容は\n【教育記事完全攻略】\n・教育記事の本質（気づき→期待感→不足  10/11に質問させていただいた内容に関連して、恐れ入りますが再度ご質問させてください。（リアルタイム講義に追いつけておらず、こちらでのご質問多くなり申し訳ございません。）  ❶質問のおおまかなテーマ 買収したアカウントのアカウント設計とアカウントパワーについて（講義3おまけ、講義4-1の内容に関連）  ❷現在の状態、目指すゴール 以前ご回答いただいた内容を参考にして、買収したアカウントで以下のようなAIジャンルのアカウントを運営しようとしております。  投資・自己啓発中心の発信→AIを副業ツールとしてだけではなく、これから必須の知識＝資産として学べる場を提供するために、主に以下を発信予定。 ・AIで文章を作るスキル ・AIで収益を生む仕組み ・AIを自分の分身のように動かす考え方  目指すゴール 既存フォロワーの規模を活かしつつ、新規フォロワーにもアプローチしてアカウントの表示パワーを高めたい。  ❸自分なりの意見や仮説 既存フォロワーには以下の要因によりほぼタイムラインにポストが表示されておらず、アカウント規模のレバレッジが効かずアカウントの表示パワーが思ったより伸びないのではないかということが悩み。 また、既存のアカウントに引きづられて美女・金持ちブランディングを続けようとしているが、教師型の運用が強すぎると新規層からのウケもイマイチと考えている。  ＜既存フォロワーの表示パワーが弱い理由＞ ・美女ブランディングにより裏垢？系のフォロワーが多くAIには興味がない ・いきなり投資、自己啓発からAIに発信内容が変わったことによる戸惑い、ファン離れ  ❹質問内容 講義4の内容に従って、初期アカウントの運用ルーティーンを継続することは大前提として、買収したアカウントの表示パワーを強めるために","sourceUrl":"","createdAt":"2026-01-01T00:00:00.000Z"},{"id":"topic-1779711128772-uvbidh","title":"バズポストの解剖｜講師Yusukeのバズ事例と意図","category":"post-structure","content":"【バズを生む要素の分析】\n\nYusuke講師のバズポスト実例より：\n「目を引く画像 × 反応したくなる問いかけ」が鉄板。\n\n■ バズの4要素：\n1. 目を引く：他の人がやってないビジュアル・切り口\n2. 反応したくなる：教えたい・突っ込みたい・共感できる\n3. 教育価値：読んで何かが学べる・気づきがある\n4. 基準値を示す：「この人はこのレベル」と見せる\n\n■ 投資×教育界隈のセオリー：\n教えたがりのフォロワーに意見を求めるポストが効く。\n「○○について皆さんはどう思いますか？」系は反応率高い。\n\n---\n\n昨日出したポストがバズリ始めてるので、取り急ぎ共有します↓\n\nちなみにこの１ポストだけでフォロワー350人以上増えてますね！\n（まだ伸びてるのでもう少し増えるかと）\n\n【ポストの意図】\n目を引く＆反応したくなるようにしてバズらせ狙い。\n他の要素としては、投資の教育、知識を学ぶことの教育、基準値の高さを見せつける。\n\n★目を引く\n→投資本めっちゃ買いまくって積んでインパクト出す。こういうの他に誰もやってなかった。\n他の人が先にやってたら微妙。\n\n★反応したくなる\n→反応ポイントは大体こんな感じ：\n\n・これ自分も買った、これいい本だよ\n\n・本ばっか読んでも意味ないよ、実践のほうが大事\n\n・金使いすぎ、資金管理したほうがいい\n\n・気合入ってますね、凄いですね\n\n・独学でやってるから本読んだこと無いわ\n\n・後ろにうつってるハゲ薬\n\n【Yusukeメモ】\nやっぱ投資界隈は教えたがりのオッサンみたいな人が多い。ポストで読者に意見聞いたりするの良さそう。思ったより本の選定は良いっぽいからちゃんと勉強しよ。にしても買いすぎた、読む時間無え\n\n---\n\n@Yusuke＠講師   ご回答いただきありがとうございます。Aの方はこのままでいこうと思います。 Bですが、当方投資の知識なく仰る通り負荷が高いため、投資はジャンルから外し、今までの自己啓発系のツイートは維持しながら美女や金持ちブランディング→AIスキルと副業は資産になる！みたいな方針で、商材というよりは高単価アフィ狙いでツイートをバズらせる方針で運用してみようかと思います。 上記について、何かご意見等あればいただけると幸いです。\n\n---\n\n@あか@運営  @Yusuke＠講師  @なまいきくん    いつも大変にお世話になっております。  発信スタイルと取り扱い内容の割合についてご相談させていただきたく書き込み致します   【アカウント】 ピチュン@ポケモンせどり @moon_sight22   【質問】 現在の発信スタイルと投稿内容のバランスについてご相談させてください。  【要点】 ポケモンカードせどりと初心者向けオールジャンルせどりの投稿割合の最適解について知りたい  私の発信テーマは大きく2つあります。 1つ目がポケモンカードのせどり、2つ目が初心者でもすぐに実践できるオールジャンルのせどり（釣具・スポーツ用品・アパレルなど）です。  ポケモンカードについては、以前Yusukeさんとも話していましたが、ポケカをメインに取り扱っている層は資産に余裕がある方が多く、せどり自体への理解も高いため、反応は非常によく、フォロワーやインプもかなり伸びます。 一方で、ポケモンカード背取りに特化しすぎると、物販スクールへの導線や「再現性のあるせどり」という文脈が弱くなってしまう懸念があり、現在はあえて初心者向けのオールジャンル背取りも並行して発信しています。  実際の数値感としては、 ポケモンカードの投稿はインプレッション・フォロワー増加ともに非常に強い オールジャンル背取りは、ポケカ投稿に引っ張られる形で、フォロワー数の割には安定して伸びている  収益面では、 ポケモンカード背取り：月10〜15万円 初心者向けオールジャンル背取り：月5万円前後（初心者でもできる範囲に抑えている）  現在は ポケモンカード50％：初心者向けオールジャンル50％ という投稿バランスで運用しています。  この状況を踏まえた上で、 この50:50のバランスは妥当でしょうか？  ポケモンカードについて発信すると、とにかくフォロワーの伸びが良\n\n---\n\n① 現在のアカウント設計（ジャンル設定・プロフィール・アイコン・ポストの方向性）で改善すべき点はどこでしょうか？\n\n→ジャンルですが、現状のアカウントはAIジャンルというよりは占いジャンルに見えますね！\n・AIジャンル→あくまでAIの話がメインで、マネタイズ実践のネタとして占いを実施（占いで稼いでるとは言わない、発信ではAI使って稼いでる～レベルの粒度）\n・占いジャンル→占いマネタイズの話がメイン\n占いメインならある程度実績を作りつつストーリー運用で伸ばしていく、AIメインなら他の人の伸びているポストなどを参考にまずはバズを狙っていく運用になるかと！\n\nアイコンはAI生成感強くモブ感があるので絵のタッチなどをnanobananaで調整、業者感が出ないように肩書削除、プロフも簡潔に「誰が（何歳, どんな会社員,主婦etc.）」「何に挑戦しているのか」だけを書いておきましょう！\n\n② 実績がない状態でも埋もれにくくするために、今の段階で意識すべき差別化ポイントはありますか？\n→抽象的になりますが、他の人がやってないこと、見せていないことを発信していく、発信＝漫画の連載のようなイメージで、読者がエンタメとして見てくれるようなストーリーを作っていく、などができるといいですね！\n\n③ 「毎日ポスト・フォロー・いいね」以外に、初期段階で特に意識してやるべき行動があれば教えていただきたいです。\n→何が伸びるのか常に他の人のポストや成功例を見ていくことですね！そもそも今出している自分のポストが伸びるポストなのか？そうでないのか？を客観的に考えて、「これは伸びそう」と思って出すポストを増やしていきたいです！伸びないだろうなってポストをいくら出しても伸びないので！\n\n---\n\n@なまいきくん  @Yusuke＠講師  @あか@運営  お世話になっております。  Xの発信からリストインについてご相談です！  【アカウント】 長谷川豊@メルカリ古着物販×韓国旅行×AI @yutaka_furugi   【参入ジャンル】 物販  【質問】 発信し始めて1週間で、なまいき生の皆様のお力をお借りして、インプ、リアクションは思ったよりも好調だと思います。 しかしながら、LINEへのリスト流入が思ったよりも少ないですが、まだ興味づけの時期でしょうか？  【要点】 現状、 ・プロフにLINEのURL ・特典を明記して固定でLINEへ誘導 ・万インプになった投稿に宣伝  など色々試作をしているのですが、1週間の流入が1件です。  スレッズにXの投稿をただただ転用して投稿しているのですが、詳細が知りたいと５名ほどからDM来ましたがXでは0件です。  【相談したいこと】 ・LINEへのリスト流入が課題ですので、どのような施策が有効でしょうか？ ・万バズして伸び切った後にリプ欄で誘導しても意味があるのでしょうか？ （伸びると思って、リプ欄にLINE誘導入れたら滑った経験もありますw）  よろしくお願いします！ (編集済)\n2026年2月4日水曜日 1:56\n\n---\n\n第2回目の講義ですが\n\n8/30(土)の21時より行います！\n\n内容は\n\n・はじめに~ポスト作成【入門】\n・なんのためにポストするのか？\n・ポスト作成3ステップ\n・伸びるポストのコツ\n\nこちらになります！\n\n前回と同じくリアルタイムでの開催になります！\n\nもうアカウントは準備出来てるはずなので、今回の授業聞いてポスト作れるようになれば一気にマネタイズまで近付いていきますね！\n\n今回も僕が行い、質問にも全て答えていくので是非リアルタイムでの参加お待ちしておりますー！\n\n---\n\n第2回目の講義ですが  8/30(土)の21時より行います！  内容は  ・はじめに~ポスト作成【入門】 ・なんのためにポストするのか？ ・ポスト作成3ステップ ・伸びるポストのコツ  こちらになります！  前回と同じくリアルタイムでの開催になります！  もうアカウントは準備出来てるはずなので、今回の授業聞いてポスト作れるようになれば一気にマネタイズまで近付いていきますね！  今回も僕が行い、質問にも全て答えていくので是非リアルタイムでの参加お待ちしておりますー！\n\n---\n\n第2回講義お疲れ様でした！\n\n取り急ぎ復習や今週のタスクこなしやすいように講義スライドと、GPTs含む資料の配布だけ行いますのでご確認ください！\n\n【講義スライド】\n\n3-1　はじめに「ポスト作成【入門】」\n\n3-2　何のためにポストするのか？\n\n3-3　5分でできる！ポスト作成3ステップ\n\n3-4　伸びるポストの作り方\n\n3-5　ポスト作成会について\n\n【講義関連資料】\n\n厳選ポストネタ集\n\nアルゴ攻略note\n\nポスト作成GPTs\n\nChatGPT使い方マニュアル","sourceUrl":"","createdAt":"2026-01-01T00:00:00.000Z"},{"id":"topic-1779711128804-ebmszf","title":"X初期運用の鉄則｜0フォロワーから最速で伸ばす方法","category":"material","content":"【初期運用のブースト戦略】\n\n■ 最初の3ヶ月でやること：\n① 毎日最低3投稿（質より量で場数を踏む）\n② 同ジャンルの伸びているアカウントをフォロー・返信\n③ 自分の経験談・リアルな失敗談を惜しみなく発信\n④ タイムリーネタに乗る（トレンドハッシュタグ活用）\n⑤ 固定ポストでプロフに来た人を確実にフォローさせる\n\n■ マインドセット：\n最初はフォロワー0でも書き続ける。反応がなくても続ける。\n「誰かに読まれている」前提で毎回全力投球。\n1ポストで350人フォロワー増えることもある。最初の1バズを狙え。\n\n---\n\n田中のアカウント公開と、実際に買収してアカウント開始したところから、月870万円売り上げるまでに至った全ポストをスクール生限定で公開しようとは思ってるのですが、\n\nそれに加えて、僕も皆さんと同じく0から新アカウント始めて売り上げや裏側の数字をリアルタイムで全公開していけば、初期運用のイメージだいぶつきやすいかなーと思ったりするんですがいかがですか？\n\nかなり労力かかるので、正直なところちょいグダってはいるのですが、反応多そうやったら頑張りますww\n\nちょっとスタンプ待ってますね！\n\n---\n\n第4回目の講義を\n\n9/13(土)の21時より行います！\n\n内容は\n\n・初期垢を爆速で伸ばす立ち回り\n・興味付けポストの作り方\n・フェーズ別ポスト戦略\n\nこちらになります！\n\n前回の講義ではX初期運用の基本ルーティンを一通り理解してもらいましたが、\n\n今回話していく興味付けポストを習得できれば、\n\n初期垢でも万インプ出せたり、フォロワーも数十人〜数百人レベルで一気に増やしていけますね！\n\n今回もなまいきくんがリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！\n\n---\n\n軽い気持ちでtipsアフィしてる人いますが、商品売る=業者感の塊で\n\nせっかくのプレイヤー感が台無しになるので、\n\n長期的に売上最大化するなら、最初はtipsアフィしない方がいいですね、、、\n\n(業者感出る→フォロワー数も伸び悩む→今後リスト取れにくくなる→将来的にセールスかけられるお客さんが減る→長期的な売上減)\n\nまあ目先のお金がないと生活がどうにもならない、、みたいな人だったら、\n\n将来的な資産削りつつ、目先のキャッシュ生み出せばいいかなとは思いますが、基本オススメはしないですね！\n\nアカウント伸ばすフェーズから、マネタイズフェーズまで4ヶ月開けてるのもこういう理由もあるので、(本当は半年くらい運用フェーズ取りたい)\n\n独断でマネタイズフェーズに入ってる人もいますが、当然その分だけデメリットもあるということだけ把握しておいてくださいね！\n\nそれをわかった上で、小さくても早くマネタイズしたいから、tipsアフィやるとかは勿論ＯＫです！\n\n---\n\n【次回講義のお知らせ】\n今週3月21日(土)の講義は休講です！\n\nここまで24回の講義で、本来予定していたX運用の基礎からマネタイズ、ローンチまで、 土台になる知識とノウハウは全てお伝えしました。\n\nただ、ぶっちゃけここで終わるつもりはありません。\n\n実際カリキュラムを進行してみて、まだ伝えたい実際の事例解説や、ローンチのより高度なテクニックもあります。\n\nただそれ以上に、 今のメンバーを見ていて思うのは、\n\n基礎の部分をもう一段強化するだけで、まだまだ5倍、10倍と売上を伸ばしていけるということ。\n\nコンセプト設計、日々の運用、導線の組み方。 \n\nここの土台を見直すだけで、 もっとマネタイズできるアカウントに変えていけるポテンシャルがあります。\n\nだからこそ今、 そこを徹底的に強化するための講義とコンテンツの準備を進めています。\n\nさらに、これまでの指導やフィードバックで蓄積してきたデータを土台にして、 最新のAI技術を活用したサポートツールも開発中です。\n\n最初は半年間の講義カリキュラム予定でしたが、 ここで終わらせる気はないです。\n\n4月以降、さらにブーストするための施策も仕込んでいるので、 楽しみにしていてください\n\n---\n\n【2周目講義】\n\n本日12/14(日)の21時より、2周目講義の第4回目を行います！\n\n10/1以降〜スクールに入会された方や、すでに運用を開始しているがフォロワーがまだ500人以下など伸び悩んでいる方、初期運用フェーズの方は必ず参加ください！\n\n内容は\n\n・初期垢を爆速で伸ばす立ち回り\n・興味付けポストの作り方\n・フェーズ別ポスト戦略\n\nこちらになります！\n\n前回の講義ではX初期運用の基本ルーティンを一通り理解してもらいましたが、\n\n今回話していく興味付けポストを習得できれば、\n\n初期垢でも万インプ出せたり、フォロワーも数十人〜数百人レベルで一気に増やしていけますね！\n\n今回もリアルタイムで講義を行い、その場で質問にも答えるので、是非リアルタイムでご参加くださいー！\n\n---\n\n@あか@運営  @Yusuke＠講師  @なまいきくん   ※長文で失礼いたします。  お世話になります。 今月よりスクールに参加させていただいた亀井と申します。  Xの初期運用の立ち回りについて相談です。  ■相談概要 完全ゼロからの最初期から「強い実績」を出すべきか  ■参入ジャンル AIマネタイズ（高単価アフィ）  ■現状 Meta広告集客で、「AI×クライアントワーク」の講座を販売しており、 月400万円の売上を上げています。  今後はこの実績を軸に、AIマネタイズに関する発信をしていこうと思っています。 ただ、X運用経験はゼロ、完全新規アカウント（フォロワー0）からのスタートです。  ■懸念 最初からプロフィールや発信で 「AI副業で月400万」 のような強い実績を前面に出すと、  ・フォロワー0 ・過去ポストの積み上げがない ・界隈との関係性も見えない ⇒それなのに実績だけ強い  という状態になり、 「嘘くさい」と見られてしまうのではないかと不安があります。  ■考えている初期の立ち回り そこで、以下のような段階的な運用を考えています。  【フェーズ1：実績をぼかしつつアカウントの土台作り】 最初は強い数字は出さず、 「AI副業で脱サラしました」 「AIを使ったクライアントワークで収益化してきました」 程度の、数字を出さない実績表現で発信スタート。  練習を兼ねた日々のポストを行うと同時に、 ・AI副業系・ビジネス系の発信者を数十人フォロー ・プレゼント企画などに積極的に参加 ・リプなどで界隈との接触を増やす という動きをする。  すると、おそらくプレゼント企画に参加しているのを見た ビジネス系の発信者（同業者）からフォローされ始めるはず （リサーチ用のアカウントでそうなった）。  これにより、 ・フォロワー数の見た目の土台 ・「AI系の人」というジャンル認知 \n\n---\n\n@Yusuke＠講師  プロフィールの見直しに合わせて、発信コンセプトも見直しましたので、お手数ですが以下ご確認頂けますと幸いです。   Who：誰に向けて発信するか？ 【読者の現状】  本業以外の副収入を得たい20〜50代会社員で、残業が多い・家族持ち・将来に不安を感じている。実績やレベル感は副業未経験〜月1万円レベル。 【悩み・課題】 副業したいけど本業が忙しくて時間がない・行動できない 何から始めればいいか分からない スキルがないから稼げないと思ってる 副業は難しそうと思ってる 在宅で稼ぎたいと思っているが稼ぐ方法が分からない 副業しても月数万しか稼げないと思ってる 副業にトライしてみたが月1万円しか稼げなかった 家族がいるからリスク取れない 過去に副業で失敗している 情報が多すぎて選べない 会社を早期退職したいが、辞められる未来が見えない 将来が不安だけど何も変えられてない 会社に縛られる働き方をしたくない   What：どんなゴールに連れて行くか？ 半年で完全在宅・スキルなしで月10万円を達成 【ゴール後の理想】 残業しなくても生活に余裕ができる 家族に我慢させなくてよくなる 好きなことにお金を使える 貯金ができるようになる 毎月＋10万円の余裕がある生活 在宅で収入が作れる安心感がある 将来の不安がなくなる 家族との時間が増える 副業から独立が見える さらに収入を増やして早期退職を目指せる 老後の不安がなくなる リストラや転職でも困らない状態になる   How：どんなロードマップで連れて行くか？ 副業の選び方を知る 物販の基礎を学ぶ 小さく稼ぐ経験をする 在宅で回せる形にする・仕組み化する 月10万まで伸ばす 提供手段：  在宅物販 / 低リスク物販 / 初心者向け物販 / 時間がなくてもできる物販 / 仕組み化できる物販 / スキル不要の物販   発信の10要\n\n---\n\n@Yusuke＠講師   初投稿です。よろしくお願いします。  発信コンセプトの添削をお願いします。   Who：誰に向けて発信するか？ 【読者の現状】 AIでラクに稼ぐ方法に興味がある、 継続が苦手で何度も挫折している副業初心者に向けて発信する。 【読者の悩み・課題・思い込み】 楽して稼ぎたいけど、結局行動できない\n,\nAIを使えば簡単に稼げると思っている\n,\n自分は普通の人より継続力がなくて稼げないと思っている\n,\n即金性がないと続けられない\n,\n  What：どんなゴールに連れて行くか？ 【ゴール】 3ヶ月で、AIを使って“動けない状態”を抜け出し、収益化の土台を作る 表のコンセプトは“AIで行動できない自分を仕組み化すること”に再設計した。 【理想の状態】 「何も続かない人」から\n,\n「AIと仕組みで最低限は前に進める人」\n,\nさらに将来的には、収益化できる自分へ変わっていく\n,\n  How：どんなロードマップで連れて行くか？ 稼ぎ方を広げすぎず、1つに絞る\n,\nAIで投稿・作業・思考整理をテンプレ化する\n,\n毎日やることを固定し、迷いを消す\n,\nストーリー発信で信頼を積み上げる\n,\n収益導線につなげる\n,\n【提供手段】 AIを使った投稿作成の自動化テンプレート\n,\n継続できない人向けの「やること固定化」メソッド\n,\n  発信の核となる考え方  “継続できない人がAIで前に進めるようになる過程を見せる人” 【表で見せるテーマ】 AIで“行動できない自分”を動かす仕組み化 【裏の収益導線】 高額スクールアフィリエイト   発信の10要素（修正版） ADHDで継続できず、何度も止まってきた自分のリアル\n,\nAIを使って“動けない自分”を動かす工夫\n,\nフォロワー0からストーリー運用で前に進む記録\n,\n自動化して後回しを減らす方法\n,\nAIでSNSアウトプットをラクにする","sourceUrl":"","createdAt":"2026-01-01T00:00:00.000Z"},{"id":"topic-1779711128819-aomwvn","title":"ストーリー型運用｜実績ゼロでも伸びるドキュメント発信","category":"material","content":"【ストーリー型運用の本質】\n\n「すごい実績がない」は関係ない。プロセスを発信せよ。\n\n■ ストーリー発信の型：\n・「○○に挑戦します」→進捗報告→結果報告\n・ 失敗したことを包み隠さずに公開\n・「今日のリアル」を毎日発信（日報スタイル）\n\n■ なぜ刺さるのか：\n読者は「自分と同じ境遇の人が頑張っている姿」に共感する。\n完成した成功者より、今まさに戦っている姿の方が応援したくなる。\n\n■ 具体的な発信ネタ：\n・今日学んだこと\n・失敗したこと・気づき\n・数字の変化（フォロワー数・収益）\n・明日やること\n\n---\n\n第9回目の講義を\n\n本日10/18(土)の21時より行います！ \n\n内容は\n\n・実績ゼロからでも最短で伸ばせる！ストーリー型運用の極意\n\n・ストーリー型運用３つのケーススタディ\n\n・最短で伸ばす！ストーリー型運用の設計方法\n\nこちらになります！\n\nこれまでの講義では、リプや引用で交流するなどコツコツ伸ばす方法を多く語ってきましたが、\n\n今回の講義では、発信でストーリー(物語)を作ることでエンタメでデカく伸ばす運用方法を解説していきます！\n\nストーリー型運用ができれば、見込み客のマインドシェアを強烈に奪うことができ、\n\nプロモーションで爆発的に売っていくための起爆剤になります！\n\n今回もなまいきくんがリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！\n\n---\n\nいつもと時間が異なります\n\n第10回目の講義を\n\n明日10/25(土)の\"15時\"より行います！ \n\n内容は\n\n・【X運用必殺技２】インセンティブ設計術\n\n・売上を爆発的に伸ばすインセンティブ設計の活用テクニック\n\nこちらになります！\n\n前回の講義では、なまいきくん式X運用の必殺技１つ目としてストーリー型運用をお伝えしましたが、\n\n今回の講義は、なまいきくん式X運用の必殺技2つ目として\n\n読者を思いのままに動かし、インプ・反応率が爆上がりする悪魔的テクニック【インセンティブ設計】を解説していきます！\n\nインセンティブ設計をマスターすれば、ポストした瞬間に大量のいいねがつき、普通のポストにも何十件とリプが届く状態を狙って作れます！\n\n今回もなまいきくんがリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！\n\n繰り返しになりますが、明日の講義だけ15時から行うので、\n\nカレンダーに入れるなりして時間間違えないようお願いします！\n\n---\n\nそれこそ今近々の話で言うとぴよまるさん（スクール生ではなく自社スタッフ）のローンチ一緒にやってて思うのですが、\n\nやっぱりリアルで会って一緒に進めると、進捗が半端ないし、一気にポストの伸びも変わるので、ローンチ合宿をサポートとして取り入れるのもアリやなと思いましたね！\n\nただ当然ですが死ぬほど僕の負担かかるので、これに関してはプレミアムメンバー限定とか、合宿は別途費用をいただいてみたいな形になるかもですが！\n\nとはいえローンチ合宿は今思いついてる成果を本当に超最大限まで高めるための話なので、\n\n全プランの全員の成果を引き上げるための施策はもう別に50個くらいアイデアあるのでこちらも順次実施していきますね！\n\nぴよまるさんポスト↓\n（合宿前との比較するといいかも）\n\n---\n\n@なまいきくん  @Yusuke＠講師  @あか@運営   お世話になっております。 10/11に質問させていただいた内容に関連して、恐れ入りますが再度ご質問させてください。（リアルタイム講義に追いつけておらず、こちらでのご質問多くなり申し訳ございません。）  ❶質問のおおまかなテーマ 買収したアカウントのアカウント設計とアカウントパワーについて（講義3おまけ、講義4-1の内容に関連）  ❷現在の状態、目指すゴール 以前ご回答いただいた内容を参考にして、買収したアカウントで以下のようなAIジャンルのアカウントを運営しようとしております。  投資・自己啓発中心の発信→AIを副業ツールとしてだけではなく、これから必須の知識＝資産として学べる場を提供するために、主に以下を発信予定。 ・AIで文章を作るスキル ・AIで収益を生む仕組み ・AIを自分の分身のように動かす考え方  目指すゴール 既存フォロワーの規模を活かしつつ、新規フォロワーにもアプローチしてアカウントの表示パワーを高めたい。  ❸自分なりの意見や仮説 既存フォロワーには以下の要因によりほぼタイムラインにポストが表示されておらず、アカウント規模のレバレッジが効かずアカウントの表示パワーが思ったより伸びないのではないかということが悩み。 また、既存のアカウントに引きづられて美女・金持ちブランディングを続けようとしているが、教師型の運用が強すぎると新規層からのウケもイマイチと考えている。  ＜既存フォロワーの表示パワーが弱い理由＞ ・美女ブランディングにより裏垢？系のフォロワーが多くAIには興味がない ・いきなり投資、自己啓発からA スルーされる／マッチングしても会話が続かない／何を話せばいいかわからない状態  【悩み・課題・思い込み】 •    マッチングしても会話が続かずフェードアウトする •    沈黙が怖くて無理に話して空回りする •    面白いことを言わなきゃとプレッシャーを感じている •    既読スルーされると「自分に魅力がない」と感じてしまう •    コミュ力は才能で、自分にはどうにもならないと思っている •    陰キャの自分がモテるのは無理だと感じている •    テクニックを覚えればなんとかなると勘違いしている •    世に出ている恋愛テクニックは“元からモテる男向け”で再現できていない   What：どんなゴールに連れて行くか？  1ヶ月で既読スルーされないLINE術を習得し、 6ヶ月で彼女を作る  【ゴールに到達した理想の状態】 •    「また会いたい」と女性から言われるようになる•    会話に対する不安や恐怖がなくなる •    自分に自信がつく •    恋愛がうまくいくことで、仕事や人間関係にも好影響が出る   How：どんなロードマップで連れて行くか？  女性との会話に対する恐怖をなくす\n,\n何を話すかではなく「どう聞くか」を習得\n,\n","sourceUrl":"","createdAt":"2026-01-01T00:00:00.000Z"},{"id":"topic-1779711128850-xbegch","title":"ファン化と教育コンテンツ｜フォロワーを見込み客に育てる","category":"material","content":"【ファン化の仕組み】\n\nフォロワーを「ただの読者」から「信者」へ育てる設計。\n\n■ ファン化の3ステップ：\n1. 認知：バズポストで存在を知ってもらう\n2. 信頼：継続発信・リアル体験で「この人はホンモノ」と思わせる\n3. 行動：LINEへ誘導 → 教育コンテンツで価値提供 → セールス\n\n■ 教育コンテンツの役割：\nLINEに集めただけでは売れない。\n「この人から買いたい」と思わせるための教育が必要。\n読者の熱量（＝購買意欲）を上げるのが教育コンテンツの仕事。\n\n■ 効果的な教育内容：\n・読者の悩みを先回りして解決\n・「あなたのために書いた」感を出す\n・実績・事例を見せて「自分もできる」を信じさせる\n\n---\n\n皆さんお疲れ様です！！！  遂に高単価アフィで初成約取れましたぁあああああああ  66万着金です  昨年末なまいきさんから高単価アフィの一次募集が開始されたときに、挑戦したい旨をお伝えし、説明を受けたり、個別面談用のLINEを作成してもらったり、運営の方には色々動いていただきました  私の方では1/17(土)に公式LINEとオプチャを開設して、少しずつリスト取りを始めました！  開設から明日で2週間になりますが、現在の登録者は下記になります。 公式LINE→261名 オプチャ→227名  公式LINEで個別質問を受け付ける形で運用しているので、何名か「副業やりたいです」とか「稼ぎ方教えてください」など問い合わせがくるようになったので、それぞれ個別に対応していました。  その中で見込みのある人は個別チャットでじわじわ教育し、スクールに興味をしめしたタイミングで個別面談の案内をしました。  なまいきさんやゆうすけさんにご指摘いただきましたが、誰でも簡単に面談できる訳ではないということをきちんと伝え、特別に案内するようなニュアンスで面談に誘導しました！！！  公式LINE開設と高単価アフィの提携開始から2週間弱で成果が出ると思ってなかったので、驚きです！！！  これもなまいき式X運用を日々実践し、読者の教育とファン化が少しずつできていた結果かなと思っています！！！  正直まだまだ課題は山積みですが、この1件でモチベーション爆上がりしました！！！  知識０人脈０スキル０の高卒フルタイムワーママでも本当にできました！！！  なまいきスクール最高です これからも頑張ります\n\n---\n\nお疲れ様です！  講義のリスト取り→教育記事→個別チャットの流れで、1週間で13件の面談が終わり、561万円のご成約をいただきました！  Xど素人が、運用開始3ヶ月でここまで来れると思っていませんでした...。  あと面談は14件残ってるので、ここから売上どのくらい伸びるか楽しみです！  LINEで個別相談する中で、見込み客の悩みや理想の未来が見えてきたので、日々のポストでそこを擦りながら発信していきます。  まだまだ始まったばかりなのでここからさらにぶち抜きます  僕らのためにたくさん動いてくださってる運営の皆様、一緒に頑張ってくださる受講生の皆様、いつもありがとうございます！！\n\n---\n\n第19回目の講義を\n\n本日12/27(土)の21時より行います！ \n\n内容は\n\n・売れる教育導線の作り方\n・教育導線の作り方\n・月600万円売れた高単価アフィ事例の紹介\n・教育コンテンツの作り方\n\nこちらになります！\n\n前回までの講義でリスト獲得方法については理解できたと思いますが、\n\nLINEに集めてリスト化できたから終わり！というわけではなく、\n\nセールスに繋げる前に見込み客の熱量をどれだけ上げられるか（教育できるか）、によって最終的な成約率や売上は大きく変わってきます。\n\nこの教育コンテンツを一度作っておけば、\n\nLINEに入ってくれた読者を最大効率でセールスに繋げられるし、皆んなは集客だけに全力を注ぐことができます！\n\n今回もリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！\n\n---\n\n第26回目の講義を\n3/7(土)の21時より行います！\n\n内容は\n【企画の作り方 実践編】\n・フォロワーの購買欲を爆発させるローンチ企画の全技術\n・教育×拡散×リスト獲得が同時に回るローンチ動画の作り方 \n・ライブだからこそ伝わるSpaceの使い方\n・LINE配信にしかできない重要な役割\nこちらになります！\n\n前回のLv.22ではローンチの呼吸として、\nポストで2〜3週間かけて興味づけ・教育・商品告知の流れを作る方法を学びました。\n\nただ、ポストだけでは「気になる」止まりで「欲しい！今すぐ買う！」まで持っていけないケースが多い。\n\n今回は【企画の作り方 実践編】として、\nポストの教育だけでは突破できない壁を、ローンチ動画・Space・LINE配信の3つの企画パーツで一撃で突破する具体的な設計方法を全て解説します。\n\nローンチ動画1本で売上の7割が決まると言っても過言ではなく、「教育しながら拡散しながらリストを取る」好循環の仕組みを作れるようになります。\n\nさらにSpaceのリアルタイムの本物感で信頼を積み上げ、LINE配信で全パーツを確実に読者の手元に届けることで、販売した瞬間に爆発的に売れる状態を作れるようになります。\n\n講義後には初回ローンチの全手順が明確になり、実際に商品を売るローンチを組めるようになります。\nまず1回やって「売る経験」を積むことが全てのスタートです。\n\n今回もリアルタイムで講義を行い、\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！\n\n---\n\n第26回目の講義を 3/7(土)の21時より行います！  内容は 【企画の作り方 実践編】 ・フォロワーの購買欲を爆発させるローンチ企画の全技術 ・教育×拡散×リスト獲得が同時に回るローンチ動画の作り方  ・ライブだからこそ伝わるSpaceの使い方 ・LINE配信にしかできない重要な役割 こちらになります！  前回のLv.22ではローンチの呼吸として、 ポストで2〜3週間かけて興味づけ・教育・商品告知の流れを作る方法を学びました。  ただ、ポストだけでは「気になる」止まりで「欲しい！今すぐ買う！」まで持っていけないケースが多い。  今回は【企画の作り方 実践編】として、 ポストの教育だけでは突破できない壁を、ローンチ動画・Space・LINE配信の3つの企画パーツで一撃で突破する具体的な設計方法を全て解説します。  ローンチ動画1本で売上の7割が決まると言っても過言ではなく、「教育しながら拡散しながらリストを取る」好循環の仕組みを作れるようになります。  さらにSpaceのリアルタイムの本物感で信頼を積み上げ、LINE配信で全パーツを確実に読者の手元に届けることで、販売した瞬間に爆発的に売れる状態を作れるようになります。  講義後には初回ローンチの全手順が明確になり、実際に商品を売るローンチを組めるようになります。 まず1回やって「売る経験」を積むことが全てのスタートです。  今回もリアルタイムで講義を行い、 その場で質問にも答えるので、是非リアルタイムでご参加くださいー！\n\n---\n\n【2周目講義】\n\n2周目講義の第16回目の講義を\n\n本日4/26(日)の21時より行います！ \n\n内容は\n\n・売れる教育導線の作り方\n・教育導線の作り方\n・月600万円売れた高単価アフィ事例の紹介\n・教育コンテンツの作り方\n\nこちらになります！\n\nこれまでの講義でリスト獲得方法については理解できたと思いますが、\n\nLINEに集めてリスト化できたから終わり！というわけではなく、\n\nセールスに繋げる前に見込み客の熱量をどれだけ上げられるか（教育できるか）、によって最終的な成約率や売上は大きく変わってきます。\n\nこの教育コンテンツを一度作っておけば、\n\nLINEに入ってくれた読者を最大効率でセールスに繋げられるし、皆んなは集客だけに全力を注ぐことができます！\n\n今回もリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加ください！\n\n---\n\n第17回目の講義を\n\n明日12/13(土)の21時より行います！ \n\n内容は\n\n・リスト獲得の方法\n・XTEPリスト獲得の流れ\n・リスト獲得のまとめとセールス補助ポスト\n\nこちらになります！\n\nこれまで、ポストの5つの目的のうち、認知獲得→興味づけ→関係構築→教育、までをやってきたと思うので、\n\n今回は、ポストの目的の5つ目である「リスト獲得」について話していきます！\n\n効率的にLINE登録者を増やして、マネタイズに繋げていきましょう！\n\n今回もなまいきくんがリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！\n\n---\n\n【なまスク高単価アフィ途中経過報告】  X参入3ヶ月・初ローンチの途中経過です。 ローンチも動画を何回も見ながらほぼ自分でやったので上手くできてたのかは分かりません。  導線は初ローンチなので一番初心者向けのシンプルなやつにして、 noteプレゼント企画→公式LINE登録してもらってnote(教育記事)読んでもらう→個別チャット→個別面談です。  現在29人個別面談完了 成約額2332～3322万円となってます。 現在スタンダードorアドバンスなどで検討中の方が5人ほどいて再面談の結果待ちです。既に最低で2332万以上の売上を作れてこのスキームのヤバさを体感してます。  残り面談数が15人＋3/31にローンチしてからいまだにチャットを複数人 しておりあと4〜5人ぐらいは面談数が増えそうなので、 最終3000〜4000万ぐらいになるかな？と予測してます。  ただ今回めちゃくちゃ失敗したのは、初ローンチなので どれぐらい個別チャットが来るのが予想がつかず、蓋を開けてみたら最終的には130人ぐらいチャットがきて、到底、1人では返せない人数が来てしまったので、緊急でなまいきさんやセールスの人たちに手伝ってもらうことになりました。3/31〜4/10の今までチャットが多すぎてほぼポストやリプ周りもできなくなってます。(この間にはポストをできていたらさらに売り上げが伸ばせたと思います)   チャットをしっかり返して売り上げを最大化するつもりが、特に最初は個別チャットに慣れていないこともあり 僕の発信を常に通知オンにしてくれていて、最初に大量にチャットに入ってきた30〜40人の方たちに、丁寧に返信することができず、前半の方の人の多くを個別面談に誘導することができず、 個別チャットにして完全に失敗しましたww(フォロワー5300人で初ローンチ)   丁寧にチャットした場合の個別面談移行率が7","sourceUrl":"","createdAt":"2026-01-01T00:00:00.000Z"},{"id":"topic-1779711128882-dmittm","title":"ゼロイチマネタイズ完全攻略｜最初の1円を稼ぐ戦略","category":"material","content":"【ゼロイチマネタイズの流れ】\n\n実績ゼロから最初の売上を作るまでのロードマップ。\n\n■ フェーズ1：アカウント育成（最初の3ヶ月）\n→ フォロワー300〜1000人を目標にひたすら発信\n\n■ フェーズ2：リスト獲得\n→ Xの固定ポスト・プロフからLINEへ誘導\n→ プレゼント（有益な無料コンテンツ）でリスト化\n\n■ フェーズ3：教育→セールス\n→ LINEで価値提供（週3〜5回の配信）\n→ 信頼が積み上がったらセールス\n\n■ 高単価アフィリエイトも有効：\n自分の商品がなくても他者の商品を紹介して稼げる。\n月600万売れた事例あり。紹介コンテンツの質が重要。\n\n---\n\n@あか@運営  @Yusuke＠講師  @なまいきくん   ※長文で失礼いたします。  お世話になります。 今月よりスクールに参加させていただいた亀井と申します。  Xの初期運用の立ち回りについて相談です。  ■相談概要 完全ゼロからの最初期から「強い実績」を出すべきか  ■参入ジャンル AIマネタイズ（高単価アフィ）  ■現状 Meta広告集客で、「AI×クライアントワーク」の講座を販売しており、 月400万円の売上を上げています。  今後はこの実績を軸に、AIマネタイズに関する発信をしていこうと思っています。 ただ、X運用経験はゼロ、完全新規アカウント（フォロワー0）からのスタートです。  ■懸念 最初からプロフィールや発信で 「AI副業で月400万」 のような強い実績を前面に出すと、  ・フォロワー0 ・過去ポストの積み上げがない ・界隈との関係性も見えない ⇒それなのに実績だけ強い  という状態になり、 「嘘くさい」と見られてしまうのではないかと不安があります。  ■考えている初期の立ち回り そこで、以下のような段階的な運用を考えています。  【フェーズ1：実績をぼかしつつアカウントの土台作り】 最初は強い数字は出さず、 「AI副業で脱サラしました」 「AIを使ったクライアントワークで収益化してきました」 程度の、数字を出さない実績表現で発信スタート。  練習を兼ねた日々のポストを行うと同時に、 ・AI副業系・ビジネス系の発信者を数十人フォロー ・プレゼント企画などに積極的に参加 ・リプなどで界隈との接触を増やす という動きをする。  すると、おそらくプレゼント企画に参加しているのを見た ビジネス系の発信者（同業者）からフォローされ始めるはず （リサーチ用のアカウントでそうなった）。  これにより、 ・フォロワー数の見た目の土台 ・「AI系の人」というジャンル認知 \n\n---\n\n@Yusuke＠講師 さん  お世話になります。 初質問となります。  Lv.2にあるアカウント設計に関するアドバイスをいただければ幸いです。（AI系発信の予定です。） ※以下、質問フォーマットに沿って記載いたします。  ❶質問のおおまかなテーマ アカウントのコンセプト設計のご確認、添削をいただきたいです。  ❷現在の状態、目指すゴール アカウント設計をまずは固められればと思っています。  ❸自分なりの意見や仮説 コンセプトに関しては、イメージがしやすいので自分と似たような立場の人（30代会社員、副業初心者、自動化に興味がある）ターゲットに想定して設計しました。 ただ、自動化に関しては、これだと手法が少し限られてしまう気がするのでAI副業といった広めのスタンスの方が良いのでは、とも思っています。  ❹質問内容 設計内容を掲載しますので、ご指摘があればいただきたいです。  -----  Who：誰に向けて発信するか？ 【読者の現状】  ラクに稼ぐことに興味がある20～30代会社員（男女）で、副業の実績やレベル感としては色々やったが0円〜1万円・情報収集止まり  【悩み・課題・思い込み】 何から始めればいいか分からない 情報が多すぎて行動できない AIで稼げるイメージはあるが具体性がない 少しやったが稼げず挫折している 継続できず三日坊主になりがち 本業が忙しく時間がない スキルがないと無理だと思っている 再現性のある方法が分からない   What：どんなゴールに連れて行くか？ 完全自動化で“ほぼ放置”月5万円を達成  【理想の状態】 毎月自由に使えるお金が増える 趣味・外食・旅行に気軽に使える 「あと5万円あれば…」のストレスから解放される 本業に依存しすぎない安心感が得られる お金の余裕＝心の余裕が生まれる   How：どんなロードマップで連れて行くか？ スキマ時間でできる\n\n---\n\n@Yusuke＠講師  はじめまして。 L2-5まで完了しましたので添削よろしくお願いします。   Who：誰に向けて発信するか？ 【読者の現状】  AI活用に興味がある20代後半〜40代の主婦・ママで、実績やレベル感は収益0円〜月1万円未満・副業挫折経験あり 【悩み・課題・思い込み】  ・子育てでまとまった作業時間が取れない  ・過去に副業で失敗して自信がない  ・詐欺や怪しい副業が怖い  ・スマホだけでできる副業を探している  ・1人だと継続できない  ・何から始めればいいかわからない   What：どんなゴールに連れて行くか？ 3ヶ月で月10万円を達成し、最終的に在宅で月50万円を安定して稼ぐ 【理想の状態・ベネフィット】  ・夫に収入面で頼らなくてよくなる（精神的自立）  ・子どもとの時間を優先しながら収入を得られる  ・子どもにやりたいことを我慢させない  ・家で完結する働き方ができる   How：どんなロードマップで連れて行くか？ 完全コピーテンプレで実践スタート スマホ×AIで作業を最小化（スキマ時間設計） 無理のない発信を習慣化 初収益（0→1）を達成 型化して月10万→50万へ拡張   発信の10要素 ・他の副業に比べた「AI×アフィリエイト」の魅力（在宅・低リスク・スマホ完結）  ・他の人と違う「ママでもできる×超シンプル設計」の強み  ・3ヶ月で月10万→月50万までの具体ロードマップ  ・AI副業を始めて得られた変化（時間・お金・心の余裕）  ・子ども優先でも収入が増えるリアルな生活  ・実績の積み上げ（小さな成果も含めた信頼構築）  ・初心者ママが最初にやるべき具体アクション  ・「AIは難しい」「副業は怪しい」という思い込みの否定  ・AIを使った時短テク・裏ワザ  ・スキマ時間で実践しているリアルな作業風景  プロフィール  名前：みるく　　5\n\n---\n\n第17回目の講義を\n\n明日12/13(土)の21時より行います！ \n\n内容は\n\n・リスト獲得の方法\n・XTEPリスト獲得の流れ\n・リスト獲得のまとめとセールス補助ポスト\n\nこちらになります！\n\nこれまで、ポストの5つの目的のうち、認知獲得→興味づけ→関係構築→教育、までをやってきたと思うので、\n\n今回は、ポストの目的の5つ目である「リスト獲得」について話していきます！\n\n効率的にLINE登録者を増やして、マネタイズに繋げていきましょう！\n\n今回もなまいきくんがリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！\n\n---\n\n【年末年始の運営について連絡】\n\n結論から言うと\n12月31日〜1月4日については\n運営の全業務を停止し\n年末年始休暇とさせていただきます。\n\nこの期間はポスト作成会や\nリアルタイム講義、LINEでの質疑応答や\n事務対応もすべて休止させていただきます。 \n\nもちろん12月30日までは\n通常通り運営していきます。\n\n2025年もいよいよラストスパートになりました。残り2週間、みんなで最高の2025年だったなと言えるように、一緒に駆け抜けていきましょう！\n\nまた8月入会の人に関しては4ヶ月が経ちますので、プラン順に優先順位をつけた上で、随時高単価アフィの提携についても案内していきます！\n\nこちらはまた近々別途案内送るので高単価アフィ希望者は楽しみにしておいてください！\n\np.s.\n\n皆んなが安全かつ、成果も最大化する高単価アフィのシステムを構築するのに、裏側でくっそ時間かけてきました。\n\nもう2度とやりたくないと思えるほど大変でした。\n\nお金で言うと、システム開発に軽く4桁はぶっ飛びましたし、今後固定費でも月300万円くらいはかかってきます。また、かけた時間で言うと、5年間一度も休んだことのない発信活動も完全に休止してほぼ全てを捧げてきました。\n\n自分で言うのもあれですが、結構頑張りましたww\n\nそして、これは僕だけでなく、なまいきスクール運営陣、そして、この高単価アフィを成立させるべく、裏側で関わってくれてる提携先の運営陣、セールスマン、サポート講師、計452人のメンバー全員です。\n\n体力の限界まで皆んなで動いてきました。勿論、まだまだこれからですが、一旦の休息として年末年始くらいは休ませてください。\n\nでないと僕がブラック企業の社長として訴えられちゃいます。ご理解のほどよろしくお願いします\n\n---\n\n重要\n\n【高単価アフィに関する連絡】\n\n8月に入会した人が4ヶ月経つので、事前に伝えてたカリキュラム通り、プラン順に優先順位をつけた上で、\n\n高単価アフィの第1次案内を始めていきます！\n\n最初に１つだけ注意しておくと、希望者のみの案内になるので、全員が高単価アフィをする必要はありませんし、提携は完全に自由です。\n\nこれは繰り返し言ってる通り、マネタイズ手法云々というより、質の高いお客さんを多く集めてくる能力がマネタイズにおいて1番重要で、\n\nこれさえ出来ればマネタイズなんて全く難しくないです。\n\n高単価アフィでしかマネタイズ出来ないなんてことはありませんし、\n\n高単価アフィはあくまでマネタイズ手法の１つではあるのと、マネタイズの手数は多い方がいいので、他の手法に関しても講義では解説していきますが、\n\n高単価アフィを実施したい人は、提携を存分に活用してください！\n\nまた、高単価アフィの提携は希望者のみに、別途契約を結んで行うものになるので、(別途費用がかかることはありません)\n\n高単価アフィに関しては、スクールの1年間のサポート期間に関わらず、僕らがこの仕組みを継続できる限りは提携し続けることが可能です。\n\nですので、まだマネタイズ基準を満たしてないという人や、長期的な売上を最大化するためにもっとアカウントを伸ばしてから始めたいという人は、\n\nスクールの残り期間を考えて焦る必要はなく、アカウントを更に伸ばしてから高単価アフィすることも可能です！\n\nみんなが最大限成果を出せるよう、この辺は僕らも考えて設計してるのでご安心ください！\n\n【提携までの流れについて】\n\n続いて、高単価アフィの第1次案内の流れですが、\n\n運営から該当者のLINEグループへ順次連絡\n↓↓↓\n希望者を案件ごとのオプチャに招待\n↓↓↓\n案件ごとの説明会を行う\n↓↓↓\nアフィ契約締結、アフィリエイター登録\n↓↓\n\n---\n\n重要  【高単価アフィに関する連絡】  8月に入会した人が4ヶ月経つので、事前に伝えてたカリキュラム通り、プラン順に優先順位をつけた上で、  高単価アフィの第1次案内を始めていきます！  最初に１つだけ注意しておくと、希望者のみの案内になるので、全員が高単価アフィをする必要はありませんし、提携は完全に自由です。  これは繰り返し言ってる通り、マネタイズ手法云々というより、質の高いお客さんを多く集めてくる能力がマネタイズにおいて1番重要で、  これさえ出来ればマネタイズなんて全く難しくないです。  高単価アフィでしかマネタイズ出来ないなんてことはありませんし、  高単価アフィはあくまでマネタイズ手法の１つではあるのと、マネタイズの手数は多い方がいいので、他の手法に関しても講義では解説していきますが、  高単価アフィを実施したい人は、提携を存分に活用してください！  また、高単価アフィの提携は希望者のみに、別途契約を結んで行うものになるので、(別途費用がかかることはありません)  高単価アフィに関しては、スクールの1年間のサポート期間に関わらず、僕らがこの仕組みを継続できる限りは提携し続けることが可能です。  ですので、まだマネタイズ基準を満たしてないという人や、長期的な売上を最大化するためにもっとアカウントを伸ばしてから始めたいという人は、  スクールの残り期間を考えて焦る必要はなく、アカウントを更に伸ばしてから高単価アフィすることも可能です！  みんなが最大限成果を出せるよう、この辺は僕らも考えて設計してるのでご安心ください！  【提携までの流れについて】  続いて、高単価アフィの第1次案内の流れですが、  運営から該当者のLINEグループへ順次連絡 ↓↓↓ 希望者を案件ごとのオプチャに招待 ↓↓↓ 案件ごとの説明会を行う ↓↓↓ アフィ契約締結、アフィリエイター登録 ↓↓\n\n---\n\n重要・注意喚起\n\n他スクール生のLINEやセミナーなど、人のマネタイズ導線に入って\n【チャットのやりとりや面談予約をするのは絶対にNG】でお願いします！\n\nそういったチャットや面談を受ける行為は、\nスクール生やセールスマンの大切なリソースを\n無駄に消費させてしまう行為だというのを理解ください！","sourceUrl":"","createdAt":"2026-01-01T00:00:00.000Z"},{"id":"topic-1779711128897-nnbzox","title":"ローンチ戦略｜発売・案件のXを使った告知の流れ","category":"material","content":"【Xローンチの全体像】\n\n商品・コンテンツをXで売るためのローンチ設計。\n\n■ ローンチの呼吸（タイミング設計）：\n・告知前：「近日公開」「準備中」でワクワクを煽る\n・告知時：「本日リリース」「限定○名」で希少性\n・告知後：「残り○名」「締め切り○日」で緊急性\n\n■ 重要な原則：\n「売ります」より「価値を提供し続けた先に売る」\n突然セールスするのではなく、教育で温めた状態でセールスする。\n\n■ 個別面談モデル：\n高単価商品はセールスページより個別面談の方が成約率高い。\n面談誘導率を上げるにはXポストでの教育・信頼構築が前提。\n\n---\n\n【高単価アフィ成果報告】  月間売上1億突破！  お疲れ様です！  プレミアム会員の先行テスト部隊ということで、  実施させていただいてた高単価アフィですが、8月に実施して売上がほぼ確定したので、共有します！  ・8月26,27日にセミナー ・9月22,23日に追加セミナー  って感じで合計4回セミナーやって、販売したのですが、数値は以下です！ （売上以外は、僕の数え間違いありそうなので、全部「約」です。笑  案件:なまいきスクールアフィ(Xマネタイズ) セミナー着席：1,200人ぐらい(正確に応募フォームとかなかったのでざっくりです) 個別面談数：約260件 成約数：約107件 成約率：約41% 成約金額：¥131,599,400 決済総額：¥112,276,815  正直、集客は雑でしたが、セミナーのコンセプトよかったのと、商品力が強いので、割と強めに押せたのがよかったです！！  結局、セミナー売りは、コンセプトゲーだなって感じましたね  あとは、 ・セールスマンの成約率が高い(40%超ええぐいw) ・商品単価が高い ってのも売上が伸びた要因です！  自社でスクール売ってますが、自社より、2~10倍高いので、売上もビビるぐらい伸びたし、自社売るより純利益も多かったですwww  ガチでこの環境用意してくれたことに感謝です （ほんまにコスパよく売上伸ばす、ってことだけ考えたら、高単価アフィ最強だなと思いましたw）  あと、全然、このグループ顔出せてないですが、そろそろXもガチりたいし、僕もなまいき生の人になんかできることあれば還元したいなと思ってます  その一環として、12月に「1億売った方法(仮)」的な内容で、スクール内限定で講義させてもらうかも？なので、引き続きよろしくお願い致します！  P.S. この前、なまいきくんとリアルで合わせてもらったんですが、裏で今作ってるシ\n\n---\n\n【高単価アフィ成果報告】 皆さんお世話になっております！  2/27~3/1のセミナーローンチの成果報告をさせていただきます！  現時点での成果は、  成約金額：4,532万円 決済金額：2,854万円  となってます！ （今はほぼ落ち着いているのであとは決済金額が成約金額に近づいていくのを祈るだけです…！）  僕は、X運用自体、スクールに入る1ヶ月前から始めた初心者で、これまで副業でnoteで稼いだことがあるとはいえ、月100万のようなかっこいい実績はなく、平均すると月20~40万くらいだったので、 それと比較すると、今回の高単価アフィの月間売上はnoteの【約１００倍】で、 あらためて高単価アフィがバグってることを認識しました…！  すでにねるるさん、カザマさん、いちごさんが成果報告されてますが、高単価アフィは嘘偽りなくバグスキームだと思います！  今回のローンチは、 ⁠成果報告⁠ でも詳細な反省点に触れましたが、直前の1週間でシャドウバンになったり、そもそも興味付けが弱く、ローンチの呼吸が浅すぎたせいで、後半にキャンセルや未着席が続出してしまい、セールスマンの方々にお手間をとらせてしまうなど反省点がとても多いローンチでした。  そんな中でもローンチの最後の最後までバックアップしてくださったなまいきさん、スタッフの方々、圧倒的に高い成約率で決めてくださっているセールスマンの方々には感謝しかありません！  なまいきスクールは、コンテンツの質が超絶高クオリティな上、 高単価アフィ自体がバグってるので本当に神スクールです！ また、初心者でもアカウントがここまで伸びたのもいつも絡んでくださるスクールの皆様のおかげです！  人生で初めてのローンチでしたが、興味付け、見込み度合いを上げる難しさ・大変さを含め本当に経験できてよかったです！なまいきさんがおっしゃるように高単価アフィは、\n\n---\n\n3月の報告をします！！  なまいきスクールアフィリ  ローンチなしのエバーで 3月売上 1.05億(成約) 5267万円(着金)  インプ数：1800万回インプ リストイン：2,268人 面談申込：315人   やったこと、ひたすら集客に全振りしました。 ポスト数も平均15~20ポストくらいしてました。  最近は記事がいい感じに伸びてきたらので、記事も毎日2~3記事書きました。  なまいきくん側のセールスマンが強いので、マジで面談呼ぶためにひたすら集客しまくる。 これにつきました。  2月も着金6100万円(成約9300万円)とえぐい売り上げでて、2ヶ月で着金1億こえてます。  ここまで熱い事業ないすね、、  セールス、コンテンツ作成、サポートなしで、これなので、、  引き続きなまいきくんからの学びを活かして稼ぎまくります！  皆さんもなまいきくんの言う通り素直に実践してれば  大きく売上をあげられると思うので一緒に頑張っていきましょう！ (編集済)\n2026年4月1日水曜日 15:30\n\n---\n\n【なまスク高単価アフィ途中経過報告】  X参入3ヶ月・初ローンチの途中経過です。 ローンチも動画を何回も見ながらほぼ自分でやったので上手くできてたのかは分かりません。  導線は初ローンチなので一番初心者向けのシンプルなやつにして、 noteプレゼント企画→公式LINE登録してもらってnote(教育記事)読んでもらう→個別チャット→個別面談です。  現在29人個別面談完了 成約額2332～3322万円となってます。 現在スタンダードorアドバンスなどで検討中の方が5人ほどいて再面談の結果待ちです。既に最低で2332万以上の売上を作れてこのスキームのヤバさを体感してます。  残り面談数が15人＋3/31にローンチしてからいまだにチャットを複数人 しておりあと4〜5人ぐらいは面談数が増えそうなので、 最終3000〜4000万ぐらいになるかな？と予測してます。  ただ今回めちゃくちゃ失敗したのは、初ローンチなので どれぐらい個別チャットが来るのが予想がつかず、蓋を開けてみたら最終的には130人ぐらいチャットがきて、到底、1人では返せない人数が来てしまったので、緊急でなまいきさんやセールスの人たちに手伝ってもらうことになりました。3/31〜4/10の今までチャットが多すぎてほぼポストやリプ周りもできなくなってます。(この間にはポストをできていたらさらに売り上げが伸ばせたと思います)   チャットをしっかり返して売り上げを最大化するつもりが、特に最初は個別チャットに慣れていないこともあり 僕の発信を常に通知オンにしてくれていて、最初に大量にチャットに入ってきた30〜40人の方たちに、丁寧に返信することができず、前半の方の人の多くを個別面談に誘導することができず、 個別チャットにして完全に失敗しましたww(フォロワー5300人で初ローンチ)   丁寧にチャットした場合の個別面談移行率が7\n\n---\n\n4月の振込金額。  なまいきくんスクールに入って、ローンチなしの エバー/仕組みだけで報酬5620万円近く振り込まれました。  マジでバグすぎます。しかもXのみでこれは、、、さすがに。。。  やったことはひたすら集客。集客。集客です。  昔僕が自社商品を売っていた頃は、 商品作成とアップデート、個別セールス、サポート  これらを毎日しており、集客にさくリソースがなく  売上の頭打ちをくらいましたが、このスキームだとマジで集客のみなので どの副業よりも稼げる金額と稼ぎやすさは圧倒的に違うと思います。  本当に最高の環境を作っていただきありがとうございます！  初心者の方もこの環境ならマジで結果出ると確信しているので、マジで頑張りたいですね！   (編集済)\n2026年5月1日金曜日 13:26\n\n---\n\n第25回目の講義を\n2/21(土)の21時より行います！\n\n内容は\n【ローンチ実践編】\n・売上を最大化するポスト設計の極意\n・①興味付けの呼吸 \n・②手段推しの呼吸\n・③商品告知の呼吸\nこちらになります！\n\n前回の講義でプロダクトローンチの全体像を学んできましたが、\n今回からはいよいよ【ローンチ実践編】として、\nローンチの3ステップの中でも最重要な「ローンチの呼吸」を、\n実際にポストが書けるレベルまで徹底的に掘り下げていきます！\n\nローンチの呼吸には\n「興味付け→手段推し→商品告知」の3つのフェーズがあり、\nこの順番通りにポストしていけば、\n読者が勝手に「欲しい！」と思ってくれる状態を作れます。\n\n今回の講義では、\nポストを書く前にやるべき「素材の洗い出し」から、\n各フェーズの具体的なポストの型・実例まで全部話すので、\n講義が終わった瞬間からローンチのポスト設計に取りかかれます！\n\nローンチの上手さで売上は桁が変わるので、\nここは本気で身につけていきましょう！\n\n今回もリアルタイムで講義を行い、\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！\n\n---\n\n第25回目講義お疲れ様でした！\n\n復習しやすいように講義スライドを配布しますのでご確認ください！\n\n【講義スライド】\n\nローンチの呼吸を始める前に\n\n売上を最大化するポスト設計の極意\n\n①興味付けの呼吸\n\n②手段推しの呼吸\n\n③商品告知の呼吸\n\n---\n\n第26回目の講義を\n3/7(土)の21時より行います！\n\n内容は\n【企画の作り方 実践編】\n・フォロワーの購買欲を爆発させるローンチ企画の全技術\n・教育×拡散×リスト獲得が同時に回るローンチ動画の作り方 \n・ライブだからこそ伝わるSpaceの使い方\n・LINE配信にしかできない重要な役割\nこちらになります！\n\n前回のLv.22ではローンチの呼吸として、\nポストで2〜3週間かけて興味づけ・教育・商品告知の流れを作る方法を学びました。\n\nただ、ポストだけでは「気になる」止まりで「欲しい！今すぐ買う！」まで持っていけないケースが多い。\n\n今回は【企画の作り方 実践編】として、\nポストの教育だけでは突破できない壁を、ローンチ動画・Space・LINE配信の3つの企画パーツで一撃で突破する具体的な設計方法を全て解説します。\n\nローンチ動画1本で売上の7割が決まると言っても過言ではなく、「教育しながら拡散しながらリストを取る」好循環の仕組みを作れるようになります。\n\nさらにSpaceのリアルタイムの本物感で信頼を積み上げ、LINE配信で全パーツを確実に読者の手元に届けることで、販売した瞬間に爆発的に売れる状態を作れるようになります。\n\n講義後には初回ローンチの全手順が明確になり、実際に商品を売るローンチを組めるようになります。\nまず1回やって「売る経験」を積むことが全てのスタートです。\n\n今回もリアルタイムで講義を行い、\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！","sourceUrl":"","createdAt":"2026-01-01T00:00:00.000Z"},{"id":"topic-1779711128929-bnkgvg","title":"コンテンツ販売の作り方｜売れる商品設計と提供手段","category":"material","content":"【コンテンツ販売の設計】\n\n■ 売れるコンテンツの条件：\n1. ターゲットの「今すぐ解決したい悩み」に直撃する\n2. 「この人じゃないと買えない」唯一性がある\n3. 価格と価値が比例している（安すぎも不信感）\n\n■ コンテンツの種類：\n・PDF教材・note（手軽に作れる入門）\n・動画コース（高単価・高価値）\n・コミュニティ・スクール（継続課金）\n・コーチング・個別サポート（最高単価）\n\n■ 商品作りの順番：\n① まずフォロワーに「何が欲しいか」聞く\n② 需要が確認できてから作る（先に売ることも可能）\n③ 小さく始めて反応を見ながら改善\n\n---\n\n@Yusuke＠講師   @あか@運営   @なまいきくん   ❶質問のおおまかなテーマ コンセプト、プロフィールについて  ❷現在の状態、目指すゴール 現在2つのアカウントがあります  ・1つ目は、女性向け恋愛で低単価noteを売っている非稼ぐ系 こちらは900フォロワーくらいでインプは1~4万程度です。しかしそんなに売り上げが立ってない ・2つ目は、今回から始めるビジネス系(AI占いかスピ系の物販の予定)  目指すゴール 1つ目の方で実績を作りつつ、2つ目の方のアカウントで成長していく感じにしたい  ❸自分なりの意見や仮説 低単価コンテンツ販売で疲弊した層と、これから副業を始めたいと思ってる人に向けるイメージにしようと思ってます。 私自身が1年やってきて成果があまり出せず疲れてしまったので… 共感と再スタートのきっかけを届けられたらと思います。  既存の恋愛垢では、インプは出てるのでなんとか活かしたいです。 note販売自体は教育と興味付けポストに課題があることを面談でご指摘いただいたので、そこの改善を図りたいと思います。  よく反応くれるフォロワー層は占いとかスピ系を好む人も多いため、徐々にスピ要素のある投稿を増やし反応見ながら、無料noteとか挟んで、新たに作った占いやスピ商品へ流せたら、みたいなイメージでいます。   ❹質問内容 このような感じでビジネス系アカウントの実績を作っていきたいのですが、考え方とか大丈夫そうでしょうか？ なにかズレてたらご教示いただければ幸いです。 以下のプロフィールも見ていただけたらありがたいです。 なにとぞよろしくお願い致します。\n\n---\n\n第21回目の講義を\n\n明日1/17(土)の21時より行います！ \n\n内容は\n\n・コンテンツ販売の重要性\n・売れるネタの見つけ方\n・売れる商品で最も重要なこと\n・まとめ&事前準備\n\nこちらになります！\n\n直近のマネタイズ編の講義では、高単価アフィについて5週分使って語ってきましたが、\n\n今回は王道のマネタイズ手法である「コンテンツ販売」について話していきます！\n\nマネタイズで高単価アフィを考えている人は多いと思いますが、\n\nコンテンツ販売にもちゃんとメリットがありますし、\n\n高単価アフィにコンテンツ販売を掛け合わせるのもめちゃくちゃ強力なので、\n\n今回の講義は、コンテンツ販売メインでマネタイズしようとしてる人はもちろん、\n\n高単価アフィやその他のマネタイズ手段を考えている人にとっても、売上を伸ばしていけるような内容になってます。\n\n今回もリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！\n\n---\n\n第21回目講義お疲れ様でした！\n\n復習しやすいように講義スライドを配布しますのでご確認ください！\n\n【講義スライド】\n\n18-1 コンテンツ販売の重要性\n\n18-2 売れるネタの見つけ方\n\n18-3 売れる商品で一番大事なこと\n\n---\n\n第21回目講義お疲れ様でした！  復習しやすいように講義スライドを配布しますのでご確認ください！  【講義スライド】  18-1 コンテンツ販売の重要性   18-2 売れるネタの見つけ方   18-3 売れる商品で一番大事なこと\n\n---\n\n第22回目の講義を\n\n今週1/24(土)の21時より行います！ \n\n内容は\n\n【コンテンツ販売攻略 - 商品作り/後編】\n・品質を決めるコンテンツ設計\n・コンテンツの作成方法\n・リリース前の細部の調整\n\nこちらになります！\n\n前回の講義では、コンテンツ販売の商品作り前編として\n\n売れる商品ネタの見つけ方とコンセプトについて語ってきましたが、\n\nじゃあコンセプトが魅力的なら中身作りは手を抜いてもいいのかというと、\n\n答えはNoです。\n\n商品の質が低いと、どれだけ発信が良くても一気に信頼が落ちて、次回のプロモーションから全然売れなくなります。\n\n今回は、僕が何億円とド派手にコンテンツを売ってきても致命的な炎上がなく、むしろ信頼されて、\n\n何度も強気でプロモーションできている商品作成方法について解説していきます！\n\nちなみに、高単価アフィの合わせ技として使うのも超有効です！\n\n今回もリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！\n\n---\n\n今週のみ金曜日に講義を行います\n\n第23回目の講義を\n\n今週1/30(金)の21時より行います！ \n\n内容は\n\n【コンテンツ販売 - 販売＆マーケ編】\n・売上を大きく左右する無料部分について\n・初速をつける施策\n・売上最大化する施策\n\nこちらになります！\n\n前回までの講義では、コンテンツ販売の商品作りについて2回分使って語ってきましたが、\n\n今回話していくのは、コンテンツの「売り方」についてです。\n\nSNS発信者を見て常々思っていますが、ぶっちゃけ、モノを売るのが下手な人が多すぎです。\n\nコンテンツ作りに労力を使い過ぎるあまり肝心の販売を疎かにしたり、\n\nフォロワーはいるのに、売り方が分からなくて全然売上を作れていない人が多いので、\n\n今回は、商品を出す前にもう売れるのが確定している状態を作る方法や、\n\nフォロワーに対して売上を最大化するテクニックについて解説していきます。\n\n今回もリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！\n\n---\n\n@なまいきくん  @Yusuke＠講師  @あか@運営   お世話になっております。 質問させてください。  ❶質問のおおまかなテーマ 買収したアカウントコンセプトと活かし方について  ❷現在の状態、目指すゴール 買収したアカウントでAI×ビジネスアカウントを運営したいのですが、元々考えていたコンセプトとだいぶズレがあります。  A.元々考えていたコンセプト →ワーママ×管理職がAIとSNSでゆるっと稼ぐつかれない副業術を発信（等身大の自分の設定、ゆるい雰囲気）  B.買収したアカウント（7800フォロワー） ・アカウント画像が美女 ・金持ちブランディングをしている（美女写真の投稿あり） ・主に投資（海外不動産、事業投資など）、会社運営などで稼いでいる設定 ・辛口、自己啓発感強め  目指すゴール Bの方は最初エアプになってしまうが副業、投資で稼いでる設定のままコンテンツなどを売り、Aのアカウントでは元のコンセプト通り等身大の自分で成長していく→本当の実績を元に商品作りをしたい。  ❸自分なりの意見や仮説 Bの元の持ち主の方も金持ちブランディングは作ったものと言っていたかつ、ファンもある程度ついているためこのコンセプトは引き継ぎつつ、今後顔出しなどはあまり考えてないためアカウントはAIで美女風にする。 投資やAI、副業についてはエアプになってしまうがこれまで学んできた内容から無料note作成し、ファン層を活用してまずはメンバーシップ等に繋げる。  Bのプロフィール案 セレナ＠資産思考ラボ ・行動しない人に“自由”は訪れない ・投資×AI×副業マインドで資産を増やす思考法を発信 ・AI・副業・投資で「人生を変えたい人」だけフォロー  Aの方はなまいきくんスクール生とも活発に絡みつつ、実績を徐々に作り有料note等を作成する。 ※AIやインスタではある程度実績があるためまずはこの\n\n---\n\n【2周目講義】\n\n2周目講義の第19回目の講義を\n\n本日5/17(日)の21時より行います！ \n\n内容は\n\n・コンテンツ販売の重要性\n・売れるネタの見つけ方\n・売れる商品で最も重要なこと\n・まとめ&事前準備\n\nこちらになります！\n\nこれまでのマネタイズ編の講義では、高単価アフィについて語ってきましたが、\n\n今回は王道のマネタイズ手法である「コンテンツ販売」について話していきます！\n\nマネタイズで高単価アフィを考えている人は多いと思いますが、\n\nコンテンツ販売にもちゃんとメリットがありますし、\n\n高単価アフィにコンテンツ販売を掛け合わせるのもめちゃくちゃ強力なので、\n\n今回の講義は、コンテンツ販売メインでマネタイズしようとしてる人はもちろん、\n\n高単価アフィやその他のマネタイズ手段を考えている人にとっても、売上を伸ばしていけるような内容になってます。\n\n今回もリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！","sourceUrl":"","createdAt":"2026-01-01T00:00:00.000Z"},{"id":"topic-1779711128948-lgkfua","title":"講師添削事例｜良いポスト・悪いポストの違い","category":"feedback","content":"【添削の視点：講師が見るポイント】\n\n■ 良いポストの共通点：\n・最初の1行で「続きが読みたい」と思わせる\n・具体的な数字・固有名詞がある\n・読者の「自分事」になっている\n・適切な改行で読みやすい\n\n■ よくあるNGパターン：\n・「〜してみました」→ 結論を先に言う方が良い\n・抽象的すぎる（「成功できます」→ 何が？どうやって？）\n・自分語りが強すぎて読者メリットが不明\n・改行なしで読みにくい\n\n■ 添削の鉄則：\n「読者はあなたに興味がない」が大前提。\n常に「読者のメリット」を中心に設計し直す。\n\n---\n\n@Yusuke＠講師   初めまして、初投稿になります。 よろしくお願いいたします。 Lv2のタスク、 ・発信コンセプト ・アカウントプロフィール ・アイコン＆ヘッダー こちら3点の添削をしていただきたいと思います。お忙しいとは思いますが、どうぞよろしくお願いいたします。    Who：誰に向けて発信するか？  【読者の現状】 恋愛・モテ・マッチングアプリ・コミュニケーション能力向上に興味がある 23〜30代の若手会社員〜30代で恋愛経験が少ない男性で、友達はいるが女性経験はほぼない層  〖実績やレベル感〗 LINEが続かず既読スルーされる／マッチングしても会話が続かない／何を話せばいいかわからない状態  【悩み・課題・思い込み】 •    マッチングしても会話が続かずフェードアウトする •    沈黙が怖くて無理に話して空回りする •    面白いことを言わなきゃとプレッシャーを感じている •    既読スルーされると「自分に魅力がない」と感じてしまう •    コミュ力は才能で、自分にはどうにもならないと思っている •    陰キャの自分がモテるのは無理だと感じている •    テクニックを覚えればなんとかなると勘違いしている •    世に出ている恋愛テクニックは“元からモテる男向け”で再現できていない   What：どんなゴールに連れて行くか？  1ヶ月で既読スルーされないLINE術を習得し、 6ヶ月で彼女を作る  【ゴールに到達した理想の状態】 •    「また会いたい」と女性から言われるようになる•    会話に対する不安や恐怖がなくなる •    自分に自信がつく •    恋愛がうまくいくことで、仕事や人間関係にも好影響が出る   How：どんなロードマップで連れて行くか？  女性との会話に対する恐怖をなくす\n,\n何を話すかではなく「どう聞くか」を習得\n,\n\n\n---\n\n指摘ありがとうございます。 マネタイズに繋がらない具体的な理由は、 コンテンツの内容自体が売れる型になっていないということでしょうか？それとも、私からコンテンツを購入する理由がないということでしょうか？  以下に私の理学療法士としての経験の強みから話を『聞く』ことに特化させた解決手段へ変更した場合のコンセプト設計修正版を載せます。  修正①：Whoの読者現状を「恋愛全般に悩む男性」→「会話・LINEに詰まっている男性」に絞りました。 理由としては、「非モテ全般」を対象としていましたが、これでは男性発信者と同じ土俵になってしまうため、「マッチング後の会話・LINEに詰まっている」に絞ることで、PTの傾聴スキルが直接的な解決手段として機能すると考えました。  修正②：思い込みリストに「聞く力を知らない」を追加しました。 理由として、私の発信の核心である「聞く力」への気づきを、読者の悩みの構造に組み込ませようと考えました。「テクニックが通用しない→実は聞き方の問題だった」という気づきの導線が出来るのではと考えました。  競合のアカウントとの差別化が出来る強みは『聞く』に特化している点だと考えています。 長文になりましたが、添削のほどどうぞよろしくお願いいたします。    Who：誰に向けて発信するか？ 【読者の現状】 マッチングアプリでマッチングはできるが、そこから先の会話・LINEが続かずフェードアウトしてしまう23〜30代の男性。友達はいるが、女性との会話になると途端に空回りしてしまう層。 〖実績やレベル感〗 LINEが続かず既読スルーされる／マッチングしても会話が続かない／何を話せばいいかわからない状態 【悩み・課題・思い込み】     •マッチングしても会話が続かずフェードアウトする     •沈黙が怖くて無理に話して空回りする     •面白いことを言わなきゃとプレッシ\n\n---\n\n@なまいきくん   @Yusuke＠講師  @あか@運営   いつもお世話になっております。 Xアカウントにつきましてご相談させていただきます‍  ❶ 質問のおおまかなテーマ 　アイコンとプロフィールの添削をお願いします   ❷ 現在の状態・目指すゴール •現在の状態  ・目指すゴール 　スキマ時間でAI副業ジャンルの運用で、ターゲットは30代主婦やサラリーマンです。 　AIジャンルの高単価アフィで3ヶ月後に月100万マネタイズが目標です。  ❸自分なりの意見や仮説 ・家庭と仕事で忙しくても、スキマ時間で稼げる。的な感じで発信を検討しています。 現段階では実績がないため、現状のみを記入しています。  ❹ 質問内容 アイコン、ヘッダー、プロフィールの内容、コンセプトの方向性に改善点などあればご教示お願いします。   お忙しいところ恐れ入りますが、ご回答のほどよろしくお願いします。\n\n---\n\n@なまいきくん  @Yusuke＠講師  @あか@運営   お世話になります。 質問失礼致します！  ❶質問のおおまかなテーマ アイコンとプロフィール添削  ❷現在の状態、目指すゴール  現在の状態：女攻略ジャンルに 目指すゴール: 最適なプロフィール設計  ❸自分なりの意見や仮説 ・アイコンはブルーロックのいさぎをイメージして作成しています。成り上がり系みたいなイメージです。 ・プロフは実績をかけるだけ書いてます。 ・コンセプトは30代で非モテの男性向けに効率よく女遊びしたい層向けに発信しています。  ❹質問内容 ・この方向性でいいか？それとももっとます向けにネトナンという括りなどにして広げたほうがいいか？ ・プロフィール設計の改善策を教えていただきたいです ・もしこのアカウントじゃ成果でないということであればアカウント買収します！  よろしくお願いいたします (編集済)\n2025年11月23日日曜日 21:02\n\n---\n\n@あか@運営  @Yusuke＠講師  @なまいきくん   毎週ZOOM講義ありがとうございます。  お世話になっております。 アカウントの運用方針についての質問になります。 ＊長文で申し訳ござません＊  ★アカウント★   ①現状 元々、リアルでせどり物販をしているので、面接時にそれを伸ばした方が良いと言うことで、物販ビジネス垢とし投稿しております。　 9月頃から物販ビジネスアカウントでX運用を始め、4ヶ月ほどでようやく1000フォロワー達成できました。 ポスト添削会で、ご指摘をいただいた点を全て修正し、自分の社畜を前面にだしたポストにコンセプト変更したお陰です。 有難う御座いました  ②質問内容 物販は以前からやっているので、物販ビジネス垢はそのまま続けて、新たに全くの初心者で裏垢を始めるのは難しいでしょうか？  ③運用の割合 物販垢７割 裏垢3割 位と考えております。 (あくまでも目安となります。)  ④理由 本音は裏垢をやりたかったので、1000フォロワーを超えた辺りから、もう一つビジネスアカウントを増やそうと考えておりました。 理由は、\"のんびりさん\"の副業スタイルが、目標としている形だったからです。 入会してから1ヶ月後くらいに試しに、\"こっそりさん\"のアフィから「裏垢奮闘記」だけ購入して目を通しました。 その後、特典で付いていた\"こっそりさん\"の個別面談でお話を聞いた時、X初心者なら裏垢は練習に丁度良いし、短期間でマネタイズしやすいとお聞きしたので、今回のご相談を致しました。  ⑤ゴール 【物販ビジネス垢】 興味付けポスト+教育ポストを継続。 高単価アフィが出来るように、ファン化を目標にしていく。 特に期間は設けないで、長期間を視野に入れて運用をしていく。  【裏垢】 運用3ヶ月を目標にNOTE等の販売をしていきたい。 (詳しい販売方法はまだ理解しておりません\n\n---\n\n@なまいきくん  @Yusuke＠講師  @あか@運営   お世話になっております。Yusuke講師、現状課題分析ありがとうございました！ プロフィールを編集しましたので、フィードバックをお願いいたします。   ❶質問のおおまかなテーマ プロフィールを編集しました。フィードバックをお願いしたいです。  ❷現在の状態、目指すゴール 現在の状態：プロフィール画像にモブ感ありと指摘をいただきました。また、プロフィール欄の文の修正をいただきました。 目指すゴール：プロフィールのモブ感を改善し、プロフィール文を最適化したい。  ❸自分なりの意見や仮説 現状課題分析で指摘いただいた内容を考慮し、画像は少し抜け感のあるものを採用しました。ハムスターをベースとし抜け感を出し、ジト目にして差別化しました。 プロフィールも指摘いただいたので、不要な部分を削除し「誰が」と「現在取り組んでいること」を書きました。  ❹質問内容 プロフィール画像のモブ感を払拭できているか？ プロフィール欄はAI副業について発信していくうえで最適な文言になっているか？ この2点についてフィードバックいただきたいです。 お忙しいところ恐れ入れいますが、よろしくお願いいたします。\n\n---\n\n@Yusuke＠講師   お世話になっております！アイコン変更に関しご相談です。  アカウント   アイコン候補   ヘッダー候補   ❶質問のおおまかなテーマ プロフィール画像およびヘッダー画像につき、 フィードバックいただきたい  ❷現在の状態、目指すゴール 現在の状態：現状のアイコンにモブ感があるため、変更を検討中。これに合わせてヘッダー画像も更新したい 目指すゴール：モブ感の改善し、認知しやすく、フォロワー増を見込めるプロフィールへ改善  ❸自分なりの意見や仮説 画像はネットの画像検索出てきたダサ系の画像を見つけ、nanobananaで改造しました。30代会社員をターゲットにAI副業へ興味を持ってもらおうとしているため、疲れた社会人風にした。  ❹質問内容 アイコンにモブ感を感じないかどうか。 ヘッダーは発信コンセプトと実績画像のみだが違和感ないか。  お忙しいところお手数をおかけしますが、ご確認をお願いします！\n\n---\n\n@Yusuke＠講師  いつもお世話になっております。  8日の講義で、アイコンについて相談させていただいた際に、もっと強者感を無くしてヘボい感じを出した方がいいとアドバイスを頂いたので、へぼい感じのアイコンに変更してみました。    ヘボい感じと、背景を赤にして目立ちやすくしてみたのですが、どうでしょうか？ アドバイスいただけますと幸いです。   8日にアカウント添削会をしていただけるとお話があったと思いますが、アカウント提出って受付されている感じでしょうか？ フォロワーは順調に伸びていますが、全然インプが伸ばせていないので、ダメ出ししまくられて改善点を見出せればと思っています。   お忙しいところお手数をおかけしますが、どうか宜しくお願いします！m( )m","sourceUrl":"","createdAt":"2026-01-01T00:00:00.000Z"},{"id":"topic-1779711128966-bhcdev","title":"質問会Q&A精選｜受講生の疑問と講師の回答","category":"feedback","content":"【よくある質問と回答まとめ】\n\n■ Q: 何をポストすればいいか分からない\nA: 「今日学んだこと」「失敗したこと」「やってみた結果」の3つだけで十分。\n   コンテンツに困ったらリアルな日常報告から始める。\n\n■ Q: フォロワーが増えない\nA: 伸びているアカウントへの返信を毎日20件以上やること。\n   自分のタイムラインに閉じこもっていても誰にも見つからない。\n\n■ Q: 発信ジャンルが決まらない\nA: まず「自分が過去に経験した失敗・苦労」を書き出す。\n   それがそのままジャンルになる。完璧を求めず仮決めで動き出す。\n\n■ Q: 思考放棄した質問をしてしまう\nA: 質問前に「自分はこう考える」を必ず書く。\n   思考プロセスを鍛えることがビジネス成功の本質。\n\n---\n\n回答ありがとうございます！  ・裏アカを実践していくアカウントってことで合ってますか？ ➡︎合っています  目標値がズレすぎているという指摘をいただいて、コンセプトが自分目線になっているという根本原因に気づけました。再度練り直して見ます  あわせて、いただいた回答に関して質問させてください  ・パッと見プロフが裏垢感ない ➡︎裏垢、裏〇などの文言がないのでジャンルが分かりにくいということでしょうか？それともプロフの構成自体が裏垢ジャンルの発信者ぽさが無いということでしょうか？  ・最近質疑応答の欄で記載した ➡︎LV2～lv11の講義ごとにある講義QAのどこかに記載されているという認識で誤解ないでしょうか？  ご回答よろしくお願いします (編集済)\n2025年11月24日月曜日 8:05\n\n---\n\n【グループ質問の利用方法】\n\n講義の学習効果を最大化するため\nグループ質問を解放します！\n\nこちら積極的に質問してもらうことで\n自分1人では解決できない悩みを即解消できますし\n\n他のメンバーの質問も見ることで\n1人でやってるだけでは\n決して辿り着かなかった視点も得られます。\n\n存分に活用してください！\n\n以下質問時のルールだけ共有しておきます。\n\n・質問の際のルール\n\n①すでに授業で扱った内容に関する質問のみを可とします。\n\nチームなまいきメンバーが成果出るようにカリキュラムを組んでいるので、\nまだ授業で扱ってない先走った内容の質問は、一旦なしでお願いします！\n\n②完全に思考放棄するのは絶対に辞めること\n\nポスト何やればいいですか？\nアイコン何がいいと思いますか？\nローンチでどうすればいいですか？\n\nみたいな何も考えずに\nとりあえずぶん投げるみたいなのは禁止です\n\n当然サポートはしますが\n今後個人で稼いでいきたいなら\n自分で適切な解を捻り出すという業務は一生付きまといます\n\n思考放棄＝個人で稼ぐ道の断念なので\n必ず自分で考えられるだけ考えてから質問してください\n\nただ、悩みすぎも良くないので\n行き詰まったら即質問してください！\n\n③思考回路を必ず記載すること\n\n一番大事なのは具体事例のインプットや添削ではなく\nそもそもの思考回路をビジネスで結果が出るようなものに変えていくことです\n\nポストの質問で一旦そのポストは良くなったとて\nそれを再現性持って生み出せるようにならなければ\n結果を出し続けることはできません。\n\nなので必ずあなたがどう考え\n何をすべきだと思ってるのか\n必ず思考の形跡を明示した上で質問してください。\n\n━━━━━━━━━━\n\n【質問フォーマット】\n\n❶質問のおおまかなテーマ\n❷現在の状態、目指すゴール\n❸自分なりの意見や仮説\n❹質問内容\n\n----------\n\n---\n\n【グループ質問の利用方法】  講義の学習効果を最大化するため グループ質問を解放します！  こちら積極的に質問してもらうことで 自分1人では解決できない悩みを即解消できますし  他のメンバーの質問も見ることで 1人でやってるだけでは 決して辿り着かなかった視点も得られます。  存分に活用してください！  以下質問時のルールだけ共有しておきます。  ・質問の際のルール  ①すでに授業で扱った内容に関する質問のみを可とします。  チームなまいきメンバーが成果出るようにカリキュラムを組んでいるので、 まだ授業で扱ってない先走った内容の質問は、一旦なしでお願いします！  ②完全に思考放棄するのは絶対に辞めること  ポスト何やればいいですか？ アイコン何がいいと思いますか？ ローンチでどうすればいいですか？  みたいな何も考えずに とりあえずぶん投げるみたいなのは禁止です  当然サポートはしますが 今後個人で稼いでいきたいなら 自分で適切な解を捻り出すという業務は一生付きまといます  思考放棄＝個人で稼ぐ道の断念なので 必ず自分で考えられるだけ考えてから質問してください  ただ、悩みすぎも良くないので 行き詰まったら即質問してください！   ③思考回路を必ず記載すること  一番大事なのは具体事例のインプットや添削ではなく そもそもの思考回路をビジネスで結果が出るようなものに変えていくことです  ポストの質問で一旦そのポストは良くなったとて それを再現性持って生み出せるようにならなければ 結果を出し続けることはできません。  なので必ずあなたがどう考え 何をすべきだと思ってるのか 必ず思考の形跡を明示した上で質問してください。      ━━━━━━━━━━  【質問フォーマット】  ❶質問のおおまかなテーマ ❷現在の状態、目指すゴール ❸自分なりの意見や仮説 ❹質問内容  -----\n\n---\n\n質問させてください。  ❶質問のおおまかなテーマ 　プロフィールについて  ❷現在の状態、目指すゴール 　・アカウント作成、アカウント名、プロフィール文を作ったところ。（AIジャンルです） 　・合格点のプロフィールを作ることがゴール。  ❸自分なりの意見や仮説 　・コンセプトは、「AI時代と言われているのに食わず嫌いでいじってこなかったけど、生成AIにチャレンジしていく人」。 　・そそっかしくドジな雰囲気で名前はそそっ子、忙しく動いていて、愛されイメージでカワウソのアイコンを描きました。AI使えない人設定なので、アイコンとヘッダーはあえてAIで生成したものではないほうが良いと考えました。 　・実際にAIを勉強する様子、いじっていく様子を発信していく予定です。 　・「それ違うよ！」と突っ込みたくなるような感じだったり、「これなら自分にも活用できそう」とわくわくするような発信を目指していこうと考えています。  ❹質問内容 　・このコンセプトでスタートしてよろしいでしょうか？ 　・プロフィールはこれでよろしいでしょうか？  以下、アカウントです。   ご回答のほどよろしくお願いいたします。\n\n---\n\n@なまいきくん  @Yusuke＠講師  @あか@運営   お世話になっております。 10/11に質問させていただいた内容に関連して、恐れ入りますが再度ご質問させてください。（リアルタイム講義に追いつけておらず、こちらでのご質問多くなり申し訳ございません。）  ❶質問のおおまかなテーマ 買収したアカウントのアカウント設計とアカウントパワーについて（講義3おまけ、講義4-1の内容に関連）  ❷現在の状態、目指すゴール 以前ご回答いただいた内容を参考にして、買収したアカウントで以下のようなAIジャンルのアカウントを運営しようとしております。  投資・自己啓発中心の発信→AIを副業ツールとしてだけではなく、これから必須の知識＝資産として学べる場を提供するために、主に以下を発信予定。 ・AIで文章を作るスキル ・AIで収益を生む仕組み ・AIを自分の分身のように動かす考え方  目指すゴール 既存フォロワーの規模を活かしつつ、新規フォロワーにもアプローチしてアカウントの表示パワーを高めたい。  ❸自分なりの意見や仮説 既存フォロワーには以下の要因によりほぼタイムラインにポストが表示されておらず、アカウント規模のレバレッジが効かずアカウントの表示パワーが思ったより伸びないのではないかということが悩み。 また、既存のアカウントに引きづられて美女・金持ちブランディングを続けようとしているが、教師型の運用が強すぎると新規層からのウケもイマイチと考えている。  ＜既存フォロワーの表示パワーが弱い理由＞ ・美女ブランディングにより裏垢？系のフォロワーが多くAIには興味がない ・いきなり投資、自己啓発からAIに発信内容が変わったことによる戸惑い、ファン離れ  ❹質問内容 講義4の内容に従って、初期アカウントの運用ルーティーンを継続することは大前提として、買収したアカウントの表示パワーを強めるために\n\n---\n\n@Yusuke＠講師  @あか@運営  @なまいきくん   お忙しいところすみません。 質問させてください。  ❶ 質問のおおまかなテーマ  　・プロフィール・発信方向性のチェック    ❷ 現在の状態・目指すゴール  　・プロフィール文、アイコン作成。  　・発信にむけて準備中。  　・ゴールは見る人、特に40代が「自分もAIを使えるかも」と感じフォロー・共感されるプロフィールにすること。    ❸ 自分なりの意見・仮説  　・名前をホコタテに変更。  　・アイコンも添付のものに変更。  　・プロフィールは 「AIは若い人のもの」そう思ってた40代が、隙間時間と寝る前の30分でChatGPTに挑戦中。 会社ではAIで残業を減らし、自分を守る盾を。副業ではスキルを磨き、未来を切り開く矛を手に入れる。  　・AIを「矛」と「盾」に変えて40代から働き方をアップデートする。守り（時短・安定）と攻め（副業・自由）の両立がテーマ。  　・コンセプトは40代、なんとなく使ってた人が本格的にチャレンジしていく様子を発信。  　・40代の会社でもある程度地位がありやめるつもりはないけどAI使って業務効率化できないかという人とやはり今のままではダメやけどどうすればいいかわからない、でもＡＩわからない人でも40代で始めてもこんなんできるよ、マネタイズできるよとストーリー型で発信。 前者向けを少し織り交ぜつつ、メインは後者を多めにしたいと思っています。    ❹ 質問内容  ・このコンセプトでスタートしてよいでしょうか？ ・プロフィール文は現状のままで十分伝わりますか？  ご指導いただければ幸いです。 よろしくお願い致します。\n\n---\n\nお世話になっております。 コンセプト設計について質問があります。  ❶質問のおおまかなテーマ コンセプト設計とアフィ商材の組み合わせが正しい確認かしたい  ❷現在の状態、目指すゴール 現在の状態：コンセプト設計をしてみたが、この設計で進めていいのか不安がある。 目指すゴール：コンセプト設計が問題ないことを確認して、進めていけるようにしたい  ❸自分なりの意見や仮説 Lv.2講義QAに「株式投資の発信をしつつ、裏垢や占いの商材を売るのは可能」とありました。 発信テーマと違う商材でも売るのは可能ということなので、自分の場合は「株式投資の発信をしつつ、AI商材を売る」というコンセプトで進めてきたいと考えています。 自分としては問題ないコンセプトかと思っています。  ❹質問内容 「株式投資の発信をしつつ、AI商材を売る」というコンセプトで進めてきたいと考えています。 株式投資に興味があるが資金力がない人に対して、AI副業して入金力を高めようという発信をする予定です。発信は投資系ですが、アフィしたい商材はAIです。 このコンセプトで進めて問題ないか確認したいです。  よろしくお願いいたします。\n\n---\n\n@なまいきくん   @Yusuke＠講師  @あか@運営   いつもお世話になっております。 Xアカウントにつきましてご相談させていただきます‍  ❶ 質問のおおまかなテーマ 　アイコンとプロフィールの添削をお願いします   ❷ 現在の状態・目指すゴール •現在の状態  ・目指すゴール 　スキマ時間でAI副業ジャンルの運用で、ターゲットは30代主婦やサラリーマンです。 　AIジャンルの高単価アフィで3ヶ月後に月100万マネタイズが目標です。  ❸自分なりの意見や仮説 ・家庭と仕事で忙しくても、スキマ時間で稼げる。的な感じで発信を検討しています。 現段階では実績がないため、現状のみを記入しています。  ❹ 質問内容 アイコン、ヘッダー、プロフィールの内容、コンセプトの方向性に改善点などあればご教示お願いします。   お忙しいところ恐れ入りますが、ご回答のほどよろしくお願いします。","sourceUrl":"","createdAt":"2026-01-01T00:00:00.000Z"},{"id":"topic-1779711128974-mrhewe","title":"なまいきくん講師メッセージ｜マインドセットと行動原則","category":"instructor","content":"【なまいきスクールの行動哲学】\n\n■ 成果を出す人の共通点：\n・行動量が圧倒的に多い\n・失敗を隠さず全部発信する\n・PDCAが速い（試して、反省して、すぐ次に活かす）\n・思考放棄しない（「どうすれば？」を常に考える）\n\n■ 自分で稼ぐということ：\n「何をすればいいですか？」という思考放棄は厳禁。\n自分で解を出す能力を身につけることが最重要。\n人に聞いてばかりでは一生稼げない。\n\n■ 長期的な視点：\n最初の3ヶ月は成果が出なくて当然。\n種を蒔き続けた人だけが半年後・1年後に刈り取れる。\n焦らず継続することが最大の戦略。\n\n---\n\n【結果を出す人と出せない人の決定的な違い】\n\n30DAYSマインド講座は見てますか？\n\nあちらはマインド講座と銘打ってますが、Xマネタイズの基礎も一通り学べるまさにはじめたての今の時期には持ってこいの神動画講義になってます。\n\nもうこれでもかってくらい僕の思考を存分に語り尽くしてるので、\n\n是非1度聞いて終わりじゃなくて家事の合間や、散歩中など暇さえあれば聞いてもらって、徹底的にマインドを刷り込ませてください。\n\nそして、今回はあちらのマインド教材に入れてなかったが、絶対に知っておくべき、結果が出る人の考え方を共有します。\n\n成功する人と、いつまでも足踏みしている人両者を分ける差は、才能でも知識量でもありません。\n\nたったひとつの思考法です。\n\nそれは「準備はほどほどに、まずは行動。そしてその後に修正」\n \n・結果が出ない人の共通点\n\n結果が出ない人は、例外なく「準備の段階」で止まります。\n\n「もっと知識をつけてから」「環境を整えてから……」\n\nそうやって完璧なスタートを夢見て、結局いつまでも走り出せない。\n\n完璧な準備なんて、そもそも存在しないのに、、\n\n・結果を出す人の思考\n\n一方で成果を出す人は違います。未完成でも構わない。とにかく走り出す。そこで得たリアルな経験こそが、最高の教材になると知っているから。\n\n行動はゴールを一発で射抜くためのものではたりません。まず撃つことで的とのズレを知り、そこから調整していくためにあります。\n\n・実例から学べ\n\n僕自身が運営しているなまいきビジネススクールもこのマインドで取り組んでます。\n\nもちろんカリキュラムは用意していますが、受講生のレベルも市場の変化も、事前に完璧に予測なんてできません。\n\nだからこそ、実践を通して常に修正、改善を繰り返す。\n\n一度完成させたら終わりなんて思考は持ち合わせてないです。これから皆の反応やチームメン\n\n---\n\n第7回目の講義を\n\n明日10/4(土)の21時より行います！ \n\n内容は\n\n・X上位プレイヤーの運用改善の考え方\n・X運用で重要な指標とは？\n・Xアナリティクスの使い方\n・原因別の運用改善テクニック\n・よくあるマインドブロック破壊\n\nこちらになります！\n\nこれまでの講義ではX運用のノウハウをメインに語ってきましたが、\n\n今回の講義では、Xのどの数値を見ればいいのか、どんな施策を打てば数値を改善していけるのかを解説していきます！\n\n分析して改善する力さえあれば、今どんな状況でも必ず伸ばしていけますし、何年経っても同じように稼ぐことができます！\n\n今回もなまいきくんがリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！\n\n---\n\n重要\n\n【高単価アフィに関する連絡】\n\n8月に入会した人が4ヶ月経つので、事前に伝えてたカリキュラム通り、プラン順に優先順位をつけた上で、\n\n高単価アフィの第1次案内を始めていきます！\n\n最初に１つだけ注意しておくと、希望者のみの案内になるので、全員が高単価アフィをする必要はありませんし、提携は完全に自由です。\n\nこれは繰り返し言ってる通り、マネタイズ手法云々というより、質の高いお客さんを多く集めてくる能力がマネタイズにおいて1番重要で、\n\nこれさえ出来ればマネタイズなんて全く難しくないです。\n\n高単価アフィでしかマネタイズ出来ないなんてことはありませんし、\n\n高単価アフィはあくまでマネタイズ手法の１つではあるのと、マネタイズの手数は多い方がいいので、他の手法に関しても講義では解説していきますが、\n\n高単価アフィを実施したい人は、提携を存分に活用してください！\n\nまた、高単価アフィの提携は希望者のみに、別途契約を結んで行うものになるので、(別途費用がかかることはありません)\n\n高単価アフィに関しては、スクールの1年間のサポート期間に関わらず、僕らがこの仕組みを継続できる限りは提携し続けることが可能です。\n\nですので、まだマネタイズ基準を満たしてないという人や、長期的な売上を最大化するためにもっとアカウントを伸ばしてから始めたいという人は、\n\nスクールの残り期間を考えて焦る必要はなく、アカウントを更に伸ばしてから高単価アフィすることも可能です！\n\nみんなが最大限成果を出せるよう、この辺は僕らも考えて設計してるのでご安心ください！\n\n【提携までの流れについて】\n\n続いて、高単価アフィの第1次案内の流れですが、\n\n運営から該当者のLINEグループへ順次連絡\n↓↓↓\n希望者を案件ごとのオプチャに招待\n↓↓↓\n案件ごとの説明会を行う\n↓↓↓\nアフィ契約締結、アフィリエイター登録\n↓↓\n\n---\n\n重要  【高単価アフィに関する連絡】  8月に入会した人が4ヶ月経つので、事前に伝えてたカリキュラム通り、プラン順に優先順位をつけた上で、  高単価アフィの第1次案内を始めていきます！  最初に１つだけ注意しておくと、希望者のみの案内になるので、全員が高単価アフィをする必要はありませんし、提携は完全に自由です。  これは繰り返し言ってる通り、マネタイズ手法云々というより、質の高いお客さんを多く集めてくる能力がマネタイズにおいて1番重要で、  これさえ出来ればマネタイズなんて全く難しくないです。  高単価アフィでしかマネタイズ出来ないなんてことはありませんし、  高単価アフィはあくまでマネタイズ手法の１つではあるのと、マネタイズの手数は多い方がいいので、他の手法に関しても講義では解説していきますが、  高単価アフィを実施したい人は、提携を存分に活用してください！  また、高単価アフィの提携は希望者のみに、別途契約を結んで行うものになるので、(別途費用がかかることはありません)  高単価アフィに関しては、スクールの1年間のサポート期間に関わらず、僕らがこの仕組みを継続できる限りは提携し続けることが可能です。  ですので、まだマネタイズ基準を満たしてないという人や、長期的な売上を最大化するためにもっとアカウントを伸ばしてから始めたいという人は、  スクールの残り期間を考えて焦る必要はなく、アカウントを更に伸ばしてから高単価アフィすることも可能です！  みんなが最大限成果を出せるよう、この辺は僕らも考えて設計してるのでご安心ください！  【提携までの流れについて】  続いて、高単価アフィの第1次案内の流れですが、  運営から該当者のLINEグループへ順次連絡 ↓↓↓ 希望者を案件ごとのオプチャに招待 ↓↓↓ 案件ごとの説明会を行う ↓↓↓ アフィ契約締結、アフィリエイター登録 ↓↓\n\n---\n\n昨日のタスク早速取り掛かってますか？\n\nキックオフでも言った通り、結局1番大事なのは実践なので、\n\nこのなまいきスクールでは限りなく実践しやすくなるよう、マニュアルの提供や、GPTsの配布を行っていきます。\n\n実際、昨日のコンセプト設計GPTsを使えば、以下のような今後の発信の指針が即作れます。\n\n1回ここでコンセプト固めちゃえば、今後の発信で迷うことも限りなく少なくなるので必ず本日中に取り掛かってくださいね！\n\n発信コンセプト設計まとめ(実際にスクール生が15分でつくったもの)\n\n Who：誰に向けて発信するか？ 裏垢ビジネスに興味がある30代男性会社員で、年収400万前後で収入に不安がある層。 実績やレベル感はビジネス経験ゼロ〜SNSで遊び程度の発信経験あり、情報収集だけしてまだ行動できていない状態。\n【読者の悩み・課題】\n\n裏垢ビジネスは危ない／怪しいという先入観がある\n,\n何を発信すればいいのか分からない\n,\n本当に稼げるのかわからない\n,\n難しいマーケティング知識が必要そう\n,\n初期費用や広告費がかかると思っている\n,\n本当に簡単にビジネスできるのか不安（実は大変なんじゃないかと）\n,\n\n What：どんなゴールに連れて行くか？ 半年で月20万円を安定的に稼ぐ\n【理想の状態】\n\n会社の給料＋20万円で生活が一気に楽になる\n,\n旅行や趣味にお金を使えるようになる\n,\n貯金や投資にまわせる余裕ができる\n,\n生活費の不安がなくなり、精神的に余裕が持てる\n,\n「副業で稼げた」という自信がつき、次のステップにも挑戦できる\n,\n残業や休日出勤に縛られずに、自分の時間を楽しめる\n,\n\n How：どんなロードマップで連れて行くか？\n\n裏垢ビジネスの基礎を理解（安全性・仕組み）\n,\n最初の発信テーマ＆コンセプト作り\n,\n1日15分でできる発信ルーティンを習得\n,\n月1〜5万円を達成\n\n---\n\n第3回目の講義を\n\n明日9/6(土)の21時より行います！\n\n内容は\n\n・X運用の基本思考\n・アカウントパワーを高めるには？\n・アカウントパワーを上げる鉄板ルーティン\n・基本すぎて誰も語らないXの動作について\n・他人の力を使ってアカウントパワーを高める方法\n\nこちらになります！\n\n先週の講義でポストが作れるようになって、実際にX運用をし始めているところだと思うので、今回の授業を聞けば、より効率的にXを伸ばして行けます！\n\n今回もなまいきくんがリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！\n\n---\n\n本日23:59まで\n\nリマインドです。\n\n次回講義10/11(土)ですが、\n\n「アカウント添削会&質問回答会」\n\nを行います！\n\nこれまでX運用の基礎~実践までをガッツリ講義してきて\n\n1回1回がかなり情報量多かったので、\n\n復習が追いついてない人や\n運用に落とし込めてない人もいるかと思います！\n\nそこで今回、添削会&質問会として\n\n・講義を聞いて実践する中で生まれた疑問の解消\n・実際に運用しているアカウントをなまいきくんが直接添削\n\nを行い、総復習と実践強化をしてもらうための企画を開催します！\n\nつきましては、\n\n「なまいきくんに直に質問したい！」\n「なまいきくんにアカウント添削して欲しい！」\n\nという方から質問や添削希望を募集します！\n\nなまいきくんからじっくり添削や質問回答してもらえる機会はめちゃくちゃ貴重なので、今回の機会を逃さず、奮ってご応募ください！\n\n個別質問がないプランの方も今回の機を存分にご活用ください！\n\n━━━━━━━━━━\n締切：本日10/8(水) 23:59\n━━━━━━━━━━\n\n※フォームは複数回送れるので、質問が複数ある人は何回も送ってもらってOKですし、\n\n添削会の応募と質問の両方を送ってもらってもOKです！\n\n※アカウント添削は人数に限りがあります。選ばれることを祈って、次回の講義を楽しみにお待ちください\n\n (編集済)\n2025年10月8日水曜日 18:48\n\n---\n\n第8回目の講義を\n\n明日10/11(土)の21時より行います！ \n\n内容は\n\n・公開添削会 & 質問会\n\nこちらになります！\n\nこれまでX運用の基礎〜実践をガッツリ講義してきたので、\n\n今回は、スクール生が講義を聞いて運用していく中で出てきた疑問点を解決したり、\n\nこれまでの講義内容が実践できてるかテストの意味合いも込めて、\n\nスクール生が実際に運用しているアカウントを添削していきます！\n\n僕の生の思考を吸収してもらえれば、皆さんの運用も自然と強化されていきます！\n\n今回もなまいきくんがリアルタイムで講義を行い、\n\nその場での質問にも答えるので、是非リアルタイムでご参加くださいー！","sourceUrl":"","createdAt":"2026-01-01T00:00:00.000Z"},{"id":"topic-1779711129002-jetcyz","title":"Yusuke講師｜0からアカウント育成の実況レポート","category":"instructor","content":"【講師Yusukeによる実際のアカウント運用記録】\n\n前提：投資経験ゼロ、完全新規アカウントからスタート。\n「実績なしでもXは伸ばせる」を身をもって証明するチャンネル。\n\n■ 運用方針：\n・1日1〜2時間でも継続できる運用スタイル\n・本業と副業の両立を意識した発信設計\n・最低半年〜1年はプレイヤーとして純粋に育てる\n・アカ設計と初動1〜4日目の思考を完全公開\n\n■ バズポストの実例：\n投資本を大量購入して積み上げた写真投稿\n→ 1ポストでフォロワー350人増加\n→ ポイントは「他の人がやっていない視覚インパクト」\n\n■ 学べること：\n・実績ゼロスタートのリアルな戦略\n・バズポスト生成の思考プロセス\n・副業×発信の時間管理術\n\n---\n\n【ガチ0運用企画開始！！】\n\n突然ですが、実績0スタートでも、Xは伸ばせるし、マネタイズは出来るんだぞってことを身をもって証明すべく、\n\nそして、実績がなく悩んでるスクール生の成果を底上げすべく、\n\n講師ゆうすけが実績完全ゼロのジャンルで、完全リアルタイム実況を開始することにしました！\n\nスクールのサポートや他の業務もあるので、正直あまり時間は取れず片手間の運用にはなってしまうのですが、\n\nそのぶん本業やりながら発信していく人の参考にはなるかなと！\n\n1日1〜2時間くらいは頑張って時間作りつつ運用していくつもりです！\n\nちなみに、投資経験はマジでゼロです！\n\n積立NISAもちゃんと始めたのは去年からっていう感じのレベルですw\n\nなので実際にマネタイズをしていくのはかなり先になるかなと！\n\n長期的な売り上げを最大化するため、最低でも半年〜1年くらいは普通にプレイヤーとして運用しながら伸ばしていく予定です！\n\n実況に関しては、\n\n＃【講師実況】0からアカ育成\n\nというチャンネルを新しくdiscord内に設置しています！\n\nこちらのチャンネルで、運用の際考えてることやポストの意図など、\n\n思考の部分も共有しつつ実況していきますね！\n\nあと運用を見ていて気になったことや疑問などがあれば、なんでも聞いてくださいね！\n\n完全ゼロのアカウントからリアルタイムで伸ばしていく裏側見れる機会はそうそうないので、是非勉強しまくってください！ (編集済)\n2026年1月28日水曜日 14:59\n\n---\n\n昨日出したポストがバズリ始めてるので、取り急ぎ共有します↓\n\nちなみにこの１ポストだけでフォロワー350人以上増えてますね！\n（まだ伸びてるのでもう少し増えるかと）\n\n【ポストの意図】\n目を引く＆反応したくなるようにしてバズらせ狙い。\n他の要素としては、投資の教育、知識を学ぶことの教育、基準値の高さを見せつける。\n\n★目を引く\n→投資本めっちゃ買いまくって積んでインパクト出す。こういうの他に誰もやってなかった。\n他の人が先にやってたら微妙。\n\n★反応したくなる\n→反応ポイントは大体こんな感じ：\n\n・これ自分も買った、これいい本だよ\n\n・本ばっか読んでも意味ないよ、実践のほうが大事\n\n・金使いすぎ、資金管理したほうがいい\n\n・気合入ってますね、凄いですね\n\n・独学でやってるから本読んだこと無いわ\n\n・後ろにうつってるハゲ薬\n\n【Yusukeメモ】\nやっぱ投資界隈は教えたがりのオッサンみたいな人が多い。ポストで読者に意見聞いたりするの良さそう。思ったより本の選定は良いっぽいからちゃんと勉強しよ。にしても買いすぎた、読む時間無え\n\n---\n\n田中のアカウント公開と、実際に買収してアカウント開始したところから、月870万円売り上げるまでに至った全ポストをスクール生限定で公開しようとは思ってるのですが、\n\nそれに加えて、僕も皆さんと同じく0から新アカウント始めて売り上げや裏側の数字をリアルタイムで全公開していけば、初期運用のイメージだいぶつきやすいかなーと思ったりするんですがいかがですか？\n\nかなり労力かかるので、正直なところちょいグダってはいるのですが、反応多そうやったら頑張りますww\n\nちょっとスタンプ待ってますね！\n\n---\n\n【！緊急告知！】\n\n突然ですが、週明け 10/6 (月) の21:00～より\n\nなまいきスクール内での【AI活用ワークショップ】を開催します✨️\n\nなんと、講師としてレクチャーしてくれるのは...\n\n現在AIジャンルでアカウントを爆伸びさせている、なおきさんです！\n\nなおきさんは豊富なAI知識があるのはもちろんのこと、\n\nスクール受講開始１ヶ月で＋2,000フォロワー、現在フォロワー数5,000人、\n\nポストでも数万インプ越えのバズを連発しており、\n\nXのAI界隈ではトップレベルに勢いがあるプレイヤーです\n\n今回は、そんななおきさんが、\n\nX運用に役立つAI活用法をスクール内でシェアしてくれます↓\n\n【ワークショップ内容（予定）】\n\n・なおきさん流:ChatGPTの活用法シェア\n・X運用で使える！便利なAIツール紹介\n・実際の画面を見ながら学ぶ、便利なAIの使い方\n・実演！簡単にできるAIアプリ作成\n\nこの機会に、AI活用を学んでX運用を加速させちゃいましょう！\n\nご都合のつく方はぜひご参加ください (編集済)\n2025年10月3日金曜日 1:47\n\n---\n\n第9回目の講義を\n\n本日10/18(土)の21時より行います！ \n\n内容は\n\n・実績ゼロからでも最短で伸ばせる！ストーリー型運用の極意\n\n・ストーリー型運用３つのケーススタディ\n\n・最短で伸ばす！ストーリー型運用の設計方法\n\nこちらになります！\n\nこれまでの講義では、リプや引用で交流するなどコツコツ伸ばす方法を多く語ってきましたが、\n\n今回の講義では、発信でストーリー(物語)を作ることでエンタメでデカく伸ばす運用方法を解説していきます！\n\nストーリー型運用ができれば、見込み客のマインドシェアを強烈に奪うことができ、\n\nプロモーションで爆発的に売っていくための起爆剤になります！\n\n今回もなまいきくんがリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！\n\n---\n\n第9回目講義お疲れ様でした！\n\n取り急ぎ復習しやすいように講義スライドを配布しますのでご確認ください！\n\n【講義スライド】\n\n9-1 実績ゼロからでも最短で伸ばせる！ストーリー型運用の極意\n\n9-2 ストーリー型運用２つのケーススタディ\n\n9-3 最短で伸ばす！ストーリー型運用の設計方法\n\n---\n\n第9回目講義お疲れ様でした！  取り急ぎ復習しやすいように講義スライドを配布しますのでご確認ください！  【講義スライド】  9-1 実績ゼロからでも最短で伸ばせる！ストーリー型運用の極意   9-2 ストーリー型運用２つのケーススタディ   9-3 最短で伸ばす！ストーリー型運用の設計方法\n\n---\n\n第18回目の講義を\n\n本日12/20(土)の21時より行います！ \n\n内容は\n\n【Kくん特別講義】\n・XTEPのネタの探し方\n・フロントポストの作り方\n・プレゼントの中身の作り方\n・具体的な操作方法\n\nこちらになります！\n\n前回の講義でXTEPの流れや考え方を学んだと思うので、\n\n今回は「バズるXTEP術」について\n\n日本一のXTEP代理店であり、XTEP経由で売上1億以上を作ってきたKくんにXSTEPの特別講義をしてもらいます！\n\n実例も紹介しながら実践的な内容を解説してもらうので、\n\n自分のアカウントで実践して、リスト獲得→マネタイズに繋げられるようにしっかり学んでいきましょう！\n\n今回もリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！","sourceUrl":"","createdAt":"2026-01-01T00:00:00.000Z"},{"id":"topic-1779711129023-lihmet","title":"スクール運営方針｜なまいきスクールのルールと文化","category":"instructor","content":"【なまいきスクールのルール・文化】\n\n■ 質問ルール（質問部屋）：\n① 授業で扱った内容のみ質問可\n② 自分で考えた上で質問する（思考放棄禁止）\n③ 思考回路を必ず記載する\n④ 「〜何をすれば？」系の丸投げ質問は禁止\n\n■ スクールの文化：\n・成果報告を積極的にする→モチベの好循環が生まれる\n・他受講生の質問・成果から学ぶ\n・講師も受講生も全員チーム「なまいき」として一丸\n\n■ スクールの目的：\nXで集客→マネタイズできる個人になること。\n短期的な結果より3〜6ヶ月後に成果が出る基盤作りを重視。\n\n■ コミュニティ規律：\n他責発言・ネガティブな発信はNG。\nプロとしての自覚を持ったコミュニティを維持する。\n\n---\n\n全体のルールはまたまとめますが、取り急ぎ先に言っておくと、なまいきスクール生が、他のなまいきスクール生メンバーにセールスかける、商品を売り込むのは一切禁止です。\n\nお互いがお互いに売り込むみたいなことになれば収集がつかなくなるのでこちらだけ把握しておいてください。\n\nまた、怪しい勧誘行為や、営業をかけられたなどあればすぐに運営(LINEグル)までご連絡ください。即座に対応します。\n\n---\n\n運営のユウスケです！\nなまいきくんが忙しすぎて全く手を離せない状態なので、代わりにアナウンスさせていただきます！\n\nこれから、スクール生の皆でなまいきチームとして一丸となり、最短最速で大きな収益を上げられるようにXを攻略していきます！\n\nその上で、LINEやdiscord、Xアカウントにおいて誰がどの方かなまいきくんの方で1人1人把握しておきたいため、なまいきくんのXアカウント(＠1namaiki)にDMで以下の情報を送っていただけますでしょうか！↓\n\n・discord参加名\n・LINE名\n・お名前\n・スクールプラン\n\nDMの方が完了しましたら、このメッセージにお好きなスタンプを押しておいていただくようお願いいたします！\n\n---\n\nなまいきくんのサブ垢であるしめじ(@jimichaS7)ではスクール生全員フォロバするので、しめじのDMまでスクール生である旨連絡お願いします！\n\nこちらで普段の投稿見ておくのは勿論、いいねも送っておきますね！\n\n---\n\nおはようございます！\n\n昨日のキックオフミーティングでは、興奮しすぎて眠れない！って声が沢山届いてましたが、眠れましたでしょうか？w\n\n僕は寝不足で早く寝たいとか言ってましたが、あの後、家にチームなまいきメンバー(事業一緒にやってるメンバー)が2人来て、朝までわちゃわちゃ語り尽くしてたので、結局寝たのは6時くらいになりましたw\n\n気分で寝る時間も起きる時間もコントロール出来るのがXマネタイズならではの良さですよね。\n\nこれサラリーマンで7時から出社とかなってたら、俺普通に死んでたなと、、\n\nなにはともあれ、皆の熱量が高い状態でキックオフできてよかったです。\n\n参加してない人は現状置いてけぼり感を感じちってるかもしれませんが、アーカイブも近々公開するので、そちらお待ちくださいね！\n\nそして、これは後で文面にて連絡するかもですが、急遽昨日のキックオフで皆の勢いに負けて、早速1期生限定でスクール内容のアップグレードをしちゃいましたww\n\n労働したくない教のなまいきくんからすると、さらに追い込む形にはなってますが、まあ頑張りますww\n\n僕もチームメンバーのために、出来ることは何でもやっていくので、これから最強のチームを皆で作っていきましょう\n\n続報は随時discordにて行うので、お待ちください！\n\n---\n\n運営のユウスケです！ なまいきくんが忙しすぎて全く手を離せない状態なので、代わりにアナウンスさせていただきます！  これから、スクール生の皆でなまいきチームとして一丸となり、最短最速で大きな収益を上げられるようにXを攻略していきます！  その上で、LINEやdiscord、Xアカウントにおいて誰がどの方かなまいきくんの方で1人1人把握しておきたいため、なまいきくんのXアカウント(＠1namaiki)にDMで以下の情報を送っていただけますでしょうか！↓  ・discord参加名 ・LINE名 ・お名前 ・スクールプラン  DMの方が完了しましたら、このメッセージにお好きなスタンプを押しておいていただくようお願いいたします！\n\n---\n\n昨日のタスク早速取り掛かってますか？\n\nキックオフでも言った通り、結局1番大事なのは実践なので、\n\nこのなまいきスクールでは限りなく実践しやすくなるよう、マニュアルの提供や、GPTsの配布を行っていきます。\n\n実際、昨日のコンセプト設計GPTsを使えば、以下のような今後の発信の指針が即作れます。\n\n1回ここでコンセプト固めちゃえば、今後の発信で迷うことも限りなく少なくなるので必ず本日中に取り掛かってくださいね！\n\n発信コンセプト設計まとめ(実際にスクール生が15分でつくったもの)\n\n Who：誰に向けて発信するか？ 裏垢ビジネスに興味がある30代男性会社員で、年収400万前後で収入に不安がある層。 実績やレベル感はビジネス経験ゼロ〜SNSで遊び程度の発信経験あり、情報収集だけしてまだ行動できていない状態。\n【読者の悩み・課題】\n\n裏垢ビジネスは危ない／怪しいという先入観がある\n,\n何を発信すればいいのか分からない\n,\n本当に稼げるのかわからない\n,\n難しいマーケティング知識が必要そう\n,\n初期費用や広告費がかかると思っている\n,\n本当に簡単にビジネスできるのか不安（実は大変なんじゃないかと）\n,\n\n What：どんなゴールに連れて行くか？ 半年で月20万円を安定的に稼ぐ\n【理想の状態】\n\n会社の給料＋20万円で生活が一気に楽になる\n,\n旅行や趣味にお金を使えるようになる\n,\n貯金や投資にまわせる余裕ができる\n,\n生活費の不安がなくなり、精神的に余裕が持てる\n,\n「副業で稼げた」という自信がつき、次のステップにも挑戦できる\n,\n残業や休日出勤に縛られずに、自分の時間を楽しめる\n,\n\n How：どんなロードマップで連れて行くか？\n\n裏垢ビジネスの基礎を理解（安全性・仕組み）\n,\n最初の発信テーマ＆コンセプト作り\n,\n1日15分でできる発信ルーティンを習得\n,\n月1〜5万円を達成\n\n---\n\n残念なことに、勝手にスクールの講義内容を外部の人に無料で公開してる人を発見してしまいました。\n\nこういう人は覚悟を決めて安くは無いお金を投資した他のスクール生への裏切り行為なので、チームなまいき脱退処分は勿論、厳正に法的措置を行います。\n\nこのような行為は、真剣に学び成果を出そうとしている皆さんの努力を踏みにじるものです。\n\n今後も同様の行為があれば例外なく退会・法的措置の対象となりますので、もし見かけた際は遠慮なく運営までご報告ください。\n\n皆さんが集中して学び、最短で成果を出せる環境を守るため、運営としても全力で取り組みます。\n\n---\n\n【！緊急告知！】\n\n突然ですが、週明け 10/6 (月) の21:00～より\n\nなまいきスクール内での【AI活用ワークショップ】を開催します✨️\n\nなんと、講師としてレクチャーしてくれるのは...\n\n現在AIジャンルでアカウントを爆伸びさせている、なおきさんです！\n\nなおきさんは豊富なAI知識があるのはもちろんのこと、\n\nスクール受講開始１ヶ月で＋2,000フォロワー、現在フォロワー数5,000人、\n\nポストでも数万インプ越えのバズを連発しており、\n\nXのAI界隈ではトップレベルに勢いがあるプレイヤーです\n\n今回は、そんななおきさんが、\n\nX運用に役立つAI活用法をスクール内でシェアしてくれます↓\n\n【ワークショップ内容（予定）】\n\n・なおきさん流:ChatGPTの活用法シェア\n・X運用で使える！便利なAIツール紹介\n・実際の画面を見ながら学ぶ、便利なAIの使い方\n・実演！簡単にできるAIアプリ作成\n\nこの機会に、AI活用を学んでX運用を加速させちゃいましょう！\n\nご都合のつく方はぜひご参加ください (編集済)\n2025年10月3日金曜日 1:47","sourceUrl":"","createdAt":"2026-01-01T00:00:00.000Z"},{"id":"topic-1779711129038-fubomh","title":"AI活用×X発信｜AIツールを使った効率的な発信戦略","category":"discord","content":"【AI×Xマーケティングの実践】\n\nAIをXマーケティングに組み込む具体的な方法。\n\n■ AIで効率化できること：\n・ポストのタイトル案・フック案を大量生成\n・長文コンテンツの構成案作成\n・プロフィール文の最適化\n・DM・返信の文章テンプレート\n・トレンドキーワードの分析\n\n■ AI活用の注意点：\n「AIが生成したまま使う」は危険。\nAIは叩き台を作るもの。自分の言葉・体験・個性でカスタマイズ 度の発信経験あり、情報収集だけしてまだ行動できていない状態。\n【読者の悩み・課題】\n\n裏垢ビジネスは危ない／怪しいという先入観がある\n,\n何を発信すればいいのか分からない\n,\n本当に稼げるのかわからない\n,\n難しいマーケティング知識が必要そう\n,\n初期費用や広告費がかかると思っている\n,\n本当に簡単にビジネスできるのか不安（実は大変なんじゃないかと）\n,\n\n What：どんなゴールに連れて行くか？ 半年で月20万円を安定的に稼ぐ\n【理想の状態】\n\n会社の給料＋20万円で生活が一気に楽になる\n,\n旅行や趣味にお金を使えるようになる\n,\n貯金や投資にまわせる余裕ができる\n,\n生活費の不安がなくなり、精神的に余裕が持てる\n,\n「副業で稼げた」という自信がつき、次のステップにも挑戦できる\n,\n残業や休日出勤に縛られずに、自分の時間を楽しめる\n,\n\n How：どんなロードマップで連れて行くか？\n\n裏垢ビジネスの基礎を理解（安全性・仕組み）\n,\n最初の発信テーマ＆コンセプト作り\n,\n1日15分でできる発信ルーティンを習得\n,\n月1〜5万円を達成\n\n---\n\nちょっとでも伸びた！とかでいいので、ガンガン報告していってください！\n\nその報告が皆のモチベになるし、自分から成果報告することで、また成果報告するために頑張ろう！となって、さらに成果出るめちゃ好循環に入るので！\n\n---\n\n【高単価アフィ成果報告】  月間売上1億突破！  お疲れ様です！  プレミアム会員の先行テスト部隊ということで、  実施させていただいてた高単価アフィですが、8月に実施して売上がほぼ確定したので、共有します！  ・8月26,27日にセミナー ・9月22,23日に追加セミナー  って感じで合計4回セミナーやって、販売したのですが、数値は以下です！ （売上以外は、僕の数え間違いありそうなので、全部「約」です。笑  案件:なまいきスクールアフィ(Xマネタイズ) セミナー着席：1,200人ぐらい(正確に応募フォームとかなかったのでざっくりです) 個別面談数：約260件 成約数：約107件 成約率：約41% 成約金額：¥131,599,400 決済総額：¥112,276,815  正直、集客は雑でしたが、セミナーのコンセプトよかったのと、商品力が強いので、割と強めに押せたのがよかったです！！  結局、セミナー売りは、コンセプトゲーだなって感じましたね  あとは、 ・セールスマンの成約率が高い(40%超ええぐいw) ・商品単価が高い ってのも売上が伸びた要因です！  自社でスクール売ってますが、自社より、2~10倍高いので、売上もビビるぐらい伸びたし、自社売るより純利益も多かったですwww  ガチでこの環境用意してくれたことに感謝です （ほんまにコスパよく売上伸ばす、ってことだけ考えたら、高単価アフィ最強だなと思いましたw）  あと、全然、このグループ顔出せてないですが、そろそろXもガチりたいし、僕もなまいき生の人になんかできることあれば還元したいなと思ってます  その一環として、12月に「1億売った方法(仮)」的な内容で、スクール内限定で講義させてもらうかも？なので、引き続きよろしくお願い致します！  P.S. この前、なまいきくんとリアルで合わせてもらったんですが、裏で今作ってるシ\n\n---\n\nはじめての成果報告です \n\n運用4日目でとりあえず500フォロワー達成です！\n\n今日中に【講師実況】チャンネルの方で、運用で考えてた裏の思考や、ポストの意図などをnote的な感じで軽くまとめて共有しますね！\n今しばらくお待ち下さい\n\n・8000インプ\n\n・1.7万インプ\n\n・7000インプ（今日中にもうちょい伸びそう）\n (編集済)\n2026年1月29日木曜日 13:31\n\n---\n\n本日の講義であった成果報告をさせていただきます！\n\n＜概要＞\n30後半のおっさんがAIで得た収入最低75円から4カ月で550万円まで売上増加\nそれまでの大まかな流れや思考が参考になればと思います。\n\n＜大まかな流れ＞\n・スクール加入前は2800フォロワー、AI系で発信、noteやLINEスタンプで最低75円程度の収益\n・スクール加入後からフォロワー増加、5ドル程度の収入がちらほら\n・激辛くんとの関係構築⇒激辛出版の名の下でBrain発売⇒売上550万\n\n＜これまでの成果＞\n・8月にスクール加入後からインプ爆上がり⇒4カ月で約4000フォロワー増\n・最低75円程度の収益から4カ月で550万達成\n・トレンド入り2回、最高64万インプ、1日最
