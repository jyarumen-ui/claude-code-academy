421-glialr","title":"[質問部屋] @Yusuke＠講師   お世話になっております。  AIマネタイズおよび高単価...","category":"feedback","content":"@Yusuke＠講師   お世話になっております。  AIマネタイズおよび高単価アフィリエイトについてご相談です。  私は将来的にAIスクールのアフィリエイトで収益を得ることを目標にしています。そのため、まずは自分自身がAIで収益を出さなければならないと考え、マネタイズを急いできました。  しかし現状は、収益化の見込みが立たない状態が続いています。  このような状況で、Xで何を発信すべきなのか分からなくなってしまいました。  流行りのAIトピックに乗ればインプレッションを伸ばすことは可能かもしれません。しかし、自分に実績がない状態でフォロワーを増やしても、最終的なマネタイズにつながらないのではないかと感じています。  そこでお聞きしたいのは、  ・実績がない段階でもXを伸ばす意味はあるのでしょうか？ ・収益化の見込みが立っていない今、自分は何を軸に発信すべきなのでしょうか？  今の自分にとって、X発信を続ける合理的な理由があるのかを知りたいです。","sourceUrl":"","createdAt":"2026-03-05T23:35:13.727Z"},{"id":"scr-1779710258422-aerbxh","title":"[質問部屋] @Yusuke＠講師 さん  お世話になっております！ Lv.2.8アカウント作...","category":"feedback","content":"@Yusuke＠講師 さん  お世話になっております！ Lv.2.8アカウント作成まで進みましたので、アカウントの添削お願いします  ①発信コンセプト ②発信の10要素 ③アカウントプロフィール  ーーー ①発信コンセプト   Who：誰に向けて発信するか？  【読者の現状】  SNSで稼ぐ方法・自動収益・個人で稼ぐスキルに興味がある 将来に不安を感じていて本業以外の収入源を作りたい20代後半〜30代男性会社員で、実績やレベル感は副業を調べている段階〜月0〜1万円レベル・インスタをやろうとして止まっている人  【読者の悩み・課題】     •    失敗してお金を無駄にするのが怖い     •    副業をやりたいけど何から始めればいいかわからない     •    AIをどう使えばいいかわからない     •    インスタはセンスがないと無理だと思っている     •    SNSで本当に稼げるのか怪しいと思っている  ⸻   What：どんなゴールに連れて行くか？  副業初心者でも最短3ヶ月で副業0→1（月10万円）を達成する  【ゴールに到達した理想の状態】     •    毎月＋10万円の余裕ができる     •    好きなことにお金を使える     •    将来の不安が減る     •    会社を辞める選択肢が生まれる     •    収入源が2つ以上になる  ⸻   How：どんなロードマップで連れて行くか？  Instagram運用 × AI × アフィリエイト     稼げるジャンル選定AIで投稿テンプレ構築\n,\nリールでフォロワー獲得\n,\nアフィリエイト導線作成\n,\n半自動で月10万円\n,\n,\n  ② 発信の10要素     他の副業に比べた SNS副業（インスタ）の魅力他のSNS副業と比べた AI×インスタアフィリエイトの強み\n,\n副業0→月10万円までのロードマップ\n,\nAI×インスタ副業を始めて起きた変化\n,\n副業収入で生活が変わった様子\n,\n実績の積み上げ報告（フォロワー・収益）\n,\n初心者が最初にやるべきこと\n,\nインスタ副業のよくある誤解の否定\n,\nAIを使ったインスタ運用の裏ワザ\n,\n実際に作業しているリアル発信\n,\n,\n ③アカウントurl https://x.com/azarashipo","sourceUrl":"","createdAt":"2026-03-08T04:13:21.822Z"},{"id":"scr-1779710258422-seiebp","title":"[質問部屋] @Yusuke＠講師 さん お世話になっております。 本スクールで提携できる高単...","category":"feedback","content":"@Yusuke＠講師 さん お世話になっております。 本スクールで提携できる高単価アフィのAIスクールは、AIで稼ぐことを教えるものでしょうか？ それとも、AIの基礎を学んだり、自動化したりといった効率化にフォーカスされたものでしょうか？  どちらかによって、アカウントコンセプトがやや変わると思いますので、ご確認です。 また、稼ぐ系の場合、いくらくらいまで稼げる期待値調整をされてるのかご教示いただきたいです。  何卒よろしくお願いいたします。","sourceUrl":"","createdAt":"2026-03-08T04:17:49.658Z"},{"id":"scr-1779710258423-afsbhq","title":"[質問部屋] @Yusuke＠講師  お世話になっております。 3点(A・B・C)ご相談よろし...","category":"feedback","content":"@Yusuke＠講師  お世話になっております。 3点(A・B・C)ご相談よろしいでしょうか。  A アカウントの添削をいただけますでしょうか。  ①発信コンセプト ②発信の10要素 ③アカウントプロフィール ーーー ①発信コンセプト  Who：誰に向けて発信するか？ 20代〜40代の会社員・公務員・子育て世代・副業初心者層。 スキルがなく、キラキラしてるSNSや周囲の知人・同僚を見て劣等感を抱いている。 何か始めたいと思っているものの、どうすればいいか分からないし勇気が出ない。 これだけ自分が劣っているのは、なにか障害でもあるのではないかとふと思うことがある。   What：どんなゴールに連れて行くか？ 3ヶ月でAIや外注化などを使った、発達障害でもできる副業の土台を作り、月5万円を達成する。 その後、6ヶ月で月20万円、1年で月50万〜100万円を達成し、脱サラも目指せる状態にする。   How：どんなロードマップで連れて行くか？ 【提供手段】 副業初心者向けの実践講座 AI自動化テンプレート集 副業スタータープログラム 収益化までのロードマップ＋案件獲得導線  【ロードマップ】 初心者でも迷わない副業の基礎知識を身につける 仕事で即使えるプロンプトと活用法を覚える 副業の種類や特徴を知る 副業で月5万円を達成する 月20万〜50万円以上を狙える形に拡張する  ② 発信の10要素 他の副業に比べたAI活用・AI副業の魅力 他のAI発信者と比べたあなたの手法の魅力 AIで月5万円→20万円→50万円以上までのロードマップ AIを使い始めて得られた変化（時短・収入・働き方） AIで時間と収入の自由を得た生活の様子 実績の積み上げ報告（時短できた、収益化できた、使えるようになった） AI初心者が最初に何をすればいいか？ AIに対するよくある誤解や先入観の否定 AI活用の知られざる裏ワザ・ラク技・時短術 AIを実際に仕事や副業で使っている様子  ③アカウントプロフィール ※アカウント買収予定なので、文章で失礼いたします。 ※発達障害関連のポストは伸びやすいのと、それにビジネスを掛け合わせたコンセプトにすることで、マネタイズにもつなげやすいかと思いました。  ▼アカウント名 はったつくん@AI×自動化で月100万  ▼プロフィール文 発達障害(ASD・ADHD)でも楽稼ぎ。学生時代は部活・サークルで孤立→新卒就職→鬱で早期退職。普通の働き方は諦めてAI×外注で自動化ビジネス構築。TikTok月25万 / YouTube月65万 / 美容アフィ月78万 / Threads月20万/サロン1店舗。人と極力関わらなくて済む半自動スモビジ量産中。  ▼アイコン画像 https://drive.google.com/file/d/1OuuqaLaXpieJgNgt5P8UeJLDEFAXqQZw/view?usp=drivesdk ※ナマケモノがモチーフで、楽にできる感を連想できるかなと考えています。  ▼ヘッダー画像 実績の写真をいくつか貼ります。  ▼固定ポスト 発達障害持ちで 自他ともに認める無能&コミュ力0  高校・大学ともに孤立。 イキって海外留学に行くも、 なぜかグループの女子に泣かれる(今も理由不明)  なんとか新卒で会社員になるが 人間関係が壊滅して鬱になり早期退職  普通の働き方は無理だと悟り、 AI×外注化で「自動で回るビジネス」を作った  今はこんな感じ。  ・TikTok月25万 ・YouTube月65万 ・美容アフィ月78万 ・Threads月20万 ・月1時間のみ稼働でサロン運営  人と極力関わらなくてもできるスモールビジネスを量産中  発達障害っぽくても、 無能でも、 スキルなんかなくても、 絶対成功できます。  同じような人は このアカウント追っておいて。 －－－－－－－ B 上記の前提の場合、発達障害かつビジネス関連(主にAI・副業)に関するポストをしているアカウントを買収するのが理想ですが、母数が少ないと思います。 その前提だと、発達障害系かビジネス関連かどちらに寄ったアカウントを買収すべきでしょうか。 ご意見をいただけますと幸いです。 －－－－－－－ C アカウント買収後、残っているポストは徐々に消していく形でしょうか。 残ったポストの取り扱いをどうするべきなのか悩みました。 (編集済)\n2026年3月10日火曜日 19:11","sourceUrl":"","createdAt":"2026-03-10T10:11:52.945Z"},{"id":"scr-1779710258423-bfeqew","title":"[質問部屋] @Yusuke＠講師  ありがとうございます。 では発達障害に関連する部分は消し...","category":"feedback","content":"@Yusuke＠講師  ありがとうございます。 では発達障害に関連する部分は消して、「AI×外注で自動化ビジネスを作る」といったところに絞る形にできればと思います。 ただ、それでいくとキャラの尖りと、ガチのAIエンジニアより発信内容の濃さが負けそうだなと思いました。  ちなみに、それよりも、例えば「AI×TikTok」のような1つの手法にフォーカスしたコンセプトの方がよいなどありますか？（とはいえ、1つの手法にこだわってないAIスクールの販売を考えた時に、このコンセプトだと後々に売りづらくなってくるなと思いました。）  ビジネス系の買収で進めていきます！ ーーー また、ヘッダー画像は下記にする予定です。実績画像をいくつか見せる形にしています。 何かフィードバックなどあれば、ご教示いただけますと幸いです。 https://drive.google.com/file/d/1-DHxIUXYGJ3v5icyyggOsyqBNp-d6XGz/view?usp=drive_link ーーー アカウント買収についてのご相談です。 買収対象のアカウントは、趣味アカウントが狙い目とのことでしたが、趣味アカウントとなるとフォロワーが数十、良くて100くらいのものが多い状態です。 このようなアカウントでも、自分のジャンルに近い発信をしていたら買収対象になるのでしょうか？ 趣味アカウントで500以上のフォロワーとなると、アカウント数が限られていて、営業DMを送る数が少なくなってしまっている状況です。  買収アカウントは、ジャンルや開設日時、フォロワー数などどの指標を重要視するべきなのか少し悩んでいます。 (編集済)\n2026年3月11日水曜日 16:11","sourceUrl":"","createdAt":"2026-03-11T07:11:06.020Z"},{"id":"scr-1779710258424-ojfqqf","title":"[質問部屋] @Yusuke＠講師   お世話になっております  Lv2が終了したのでコンセプ...","category":"feedback","content":"@Yusuke＠講師   お世話になっております  Lv2が終了したのでコンセプトとプロフィール添削お願いいたします  ①who  副業・SNS収益化・インスタ運用・AI副業に興味がある25〜40代会社員で、  実績やレベル感は SNSで稼ぎたいけど何をすればいいかわからない。  ゴール  AI×インスタ自動化で3ヶ月で月10万円の副収入 本業以外に毎月5万円の収入が入る安心感 スマホだけで収益が生まれる仕組み 投稿や集客がAIで自動化される 家やカフェで収益が発生する働き方 コンテンツ販売で利益率の高いビジネスができる  How AI×インスタ自動化の仕組み構築 フォロワーが少なくても売れる発信導線 ストーリーズで売るセールス導線  ① 他の副業に比べた「インスタ×AI」の魅力  ② 他のインスタ運用と比べた「あなたの手法」の魅力  ③ フォロワー200人で収益化するロードマップ  ④ AI×インスタを始めて得られた変化  ⑤ AI×インスタで自由な生活を得た様子  ⑥ 実績の積み上げ報告  ⑦ 初心者が最初にやるべきこと  ⑧ インスタ副業の誤解を壊す発信  ⑨ AI×インスタの裏ワザ・効率化  ⑩ 実践している様子（裏側）   プロフィールはこんな感じにしました(添付画像)  自分の実績として 元中卒、フォロワー200人の時にコンサルなし、スクールなしで初ローンチ500万  1年目・2年目ともに3000万台で累計6000万  リール・フィード発信なし、ストーリーズのみで6000万  現在リールは半自動で毎月200万ほどの売上  Threads1投稿で売上200万などなどの実績があり  どれをプロフィールに入れたらいいか迷ってます  後々、AI講座かインスタ講座の高単価アフィに繋げたいと思っております。よろしくお願いいたします。","sourceUrl":"","createdAt":"2026-03-11T15:22:00.655Z"},{"id":"scr-1779710258425-fnhuui","title":"[質問部屋] お世話になっております。 別アカウントのコンセプトを考えてみましたので、フィード...","category":"feedback","content":"お世話になっております。 別アカウントのコンセプトを考えてみましたので、フィードバックをいただけますでしょうか。 こちらはスマホ内職のスクール販売を考えております。こちらは当方で別途アフィリエイト提携している商品になります。  ①発信コンセプト  Who：誰に向けて発信するか？ スマホ副業・在宅ワーク・育児しながら稼ぐ方法に興味がある、20代〜40代の男女、特に子育て中のママ・未就学児ママ・小学生ママ・専業主婦・パート主婦・地方在住の女性で、実績やレベル感は副業未経験〜月1万円未満の初心者層   What：どんなゴールに連れて行くか？ 最短即日で収益ゲット。その後、30日で月5万円の副収入を達成し、完全在宅・スマホのみで月30万円を目指せる土台を作る   How：どんなロードマップで連れて行くか？ スマホ内職に対する不安や思い込みをなくす 手順通りに実践して、即日で初成果を出す 1日10分以上の作業を習慣化する 家事・育児などの合間を使って月5万円を作る さらに時間を投下して月10万〜30万円を目指す  ② 発信の10要素 他の副業に比べたスマホ内職の魅力 他のスマホ内職と比べたあなたの手法の魅力 30日で月5万円までのロードマップ スマホ内職を始めて得られた変化 スマホ内職で自由度が増した生活の様子 実績の積み上げ報告 初心者が最初に何をすればいいか スマホ内職に対するよくある誤解の否定 スマホ内職の知られざるラク技・効率化ノウハウ あなた自身や受講者が行動・実践している様子  ③アカウントプロフィール https://x.com/aoi_naisyoku (編集済)\n2026年3月12日木曜日 18:53","sourceUrl":"","createdAt":"2026-03-12T09:53:54.662Z"},{"id":"scr-1779710258425-suvaqy","title":"[質問部屋] 添削ありがとうございます!先ほどもポスト添削ありがとうございました  添削してい...","category":"feedback","content":"添削ありがとうございます!先ほどもポスト添削ありがとうございました  添削していただいたプロフに丸ごと変えます!  FカップFカップはないので若干難しいですが、別の方にこのポストを見ていただきちょっとスケベ路線でもいいかもと言われたことがあります https://x.com/yurunbo_ai/status/2031200685459648720?s=46  声も少し高めで特徴があるとよく言われるので、性欲強め。みたいなワードを入れてあえて男性ターゲットにし若干エロ路線で興味を引いていくってのも戦略としてはありなんでしょうか?","sourceUrl":"","createdAt":"2026-03-12T09:54:35.825Z"},{"id":"scr-1779710258426-tzdzpo","title":"[質問部屋] はい！ ただ、発信コンセプトのGPTsで「中性」という性別の選択肢があったので、...","category":"feedback","content":"はい！ ただ、発信コンセプトのGPTsで「中性」という性別の選択肢があったので、その前提で出力しています。 「子育てママでもできる」はあくまで簡易性の訴求表現で、本人が子育てママであるとは発信しません。  ターゲットは男女どちらもで、「副業未経験者・初心者」という括りで考えてます。 なので発信スタイルも、どちらのターゲットも念頭に置きつつやっていくイメージです。 ポストAは男性向け、ポストBは女性向け、みたいな形です。 いかがでしょうか？ (編集済)\n2026年3月12日木曜日 23:14","sourceUrl":"","createdAt":"2026-03-12T14:14:55.923Z"},{"id":"scr-1779710258427-pboibw","title":"[質問部屋] お疲れ様です！  インプ1000&フォロワー500がマネタイズ開始の目安とのこと...","category":"feedback","content":"お疲れ様です！  インプ1000&フォロワー500がマネタイズ開始の目安とのことですが インプの数値というのはポストしてどれぐらい時間が経った後の数値を目安にすればいいですか？  既出の内容でしたらすみません","sourceUrl":"","createdAt":"2026-03-16T01:21:01.830Z"},{"id":"scr-1779710258427-zdxvcs","title":"[質問部屋] @Yusuke＠講師 さん お世話になっております！  スクール生の方のアイコン...","category":"feedback","content":"@Yusuke＠講師 さん お世話になっております！  スクール生の方のアイコンを元にアイコン作成してみたのですが、キャラ感あり覚えやすいアイコンになってますでしょうか？？   またポスト作成してみましので添削いただけますと幸いです！ よろしくお願いいたします  ■ポスト1 副業の動画ばっか見てる人、そろそろ気づいた方がいいw 動画見て「勉強した気」になってる時点で、正直もう負けてるw 「何からやればいいんだろ〜」って悩んでる間に 行動してるやつは、とっくに1円稼いでる いいからまず1回やれ メルカリ入れて家のゴミ1個出すだけでいい それだけで上位10%の“やってる側”に入れる まだ見てるだけの人は、この先もずっと同じ 人生変えたい人だけ保存しとけ  ■目的 認知獲得：行動してない初心者を“1歩動かす  ■想定読者 「情報収集ばっかで動けてない副業初心者」  ■工夫した点 ① フックで「動画ばっか見てる人」で自分ごと化してもらう ②「勉強した気になってる時点で負け」で イラッとする一言入れ感情動かす ③「行動してるやつは1円稼いでる」で 自分だけ遅れてる感を作る ④「メルカリでゴミ1個出せ」簡単かつ脳死できること   ■ポスト2 スキルない。副業経験ない。お金もない。 それでも稼ぎたいならインスタやれ。 在庫なし。初期費用ほぼ0。 スマホ1台で始められる。 なのに副業やりたいって言いながら インスタすら始めない人多すぎ。 正直それで「稼げない…」って 言ってるの普通に意味不明。 副業で1円も稼げてないなら まずインスタ始めるところから。 インスタ副業やってる人いる？リプで教えて。   ■目的  認知獲得：「まだ何も始めていない、あるいは稼げていない0〜1段目スキルがない初心者  ■想定読者： 副業に興味はあるが、何から始めていいかわからない0段目の人  ■工夫した点 ① フック： 「スキルない。副業経験ない。お金もない。で自分ごと化 ② 感情を動かす： 「インスタすら始めない人多すぎ」「意味不明」と強い言葉で突き放す否定し、え、なんで？と感情を動かす    ■ポスト3 副業初心者が一番始めやすいSNSはインスタ。 理由はシンプル。 スマホ1台あれば始められる。 在庫なし、初期費用ほぼ0。 リールが伸びればフォロワーも一気に増える。 「副業やりたいけど何すればいい？」って人ほど まずインスタ触ってみて。 副業って難しそうに見えるけど 実はスマホだけで始められる。 インスタ副業やってる人いる？  ■目的：認知獲得 インスタ副業のハードルの低さを強調し、「この山なら自分も登れそうだ」と思ってもらう  ■想定読者 「山の0〜1段目にいる副業に興味はあるが、難しそうという先入観で足踏みしている20〜30代の会社員  ■工夫した点 「スマホ1台」「在庫なし」「初期費用ほぼ0」など、中学生でも一発で理解できる具体的な言葉を選び、簡単さを訴求してみました   ■ポスト4 僕は何をやっても続かないクズでした。だから人生ずっと自信ゼロ。でも初めて自分の力で「月10万円」稼げたとき、「やればできるじゃん、俺」って思えた。この小さな成功体験が、他のことにも挑戦する勇気をくれた。 もし同じタイプならください   ■目的 認知・関係構築  ■想定読者 自分に自信がなく、挑戦をためらっている副業初心者（山の0〜1段目）  ■工夫した点 ①何をやっても続かないクズ」というどん底の状態から、「月10万」という実績への落差（ビフォーアフター）を強調し、人間味を作ってみました ②月10万と初心者でもイメージしやすい額で現実味を作りました ③特別なノウハウではなくやるだけとハードルの低さをアピール   ■ポスト5 嫌いな人にヨイショしてる時間、人生で一番ムダすぎん？wwwそれで1日終わってくの普通にキツくない？嫌いな人にヨイショしなくていいし、面白くないのに笑わなくていい。このストレスないだけでめっちゃ楽www会社員のときはガチャ外して人間関係で気つかってばっか。でも今は関わる人も自分で選べる。この自由、ガチでデカいよねwww  ■目的 認知・関係構築  ■想定読者 人間関係に疲れ、自由を求めている会社員（山の0〜1段目）  ■工夫した点 ①「嫌いな人にヨイショするのは人生のムダ」と断言することで、読者が日頃感じている違和感を肯定しました ②「面白くないのに笑わなくていい」や「上司ガチャ」会社員の脳内にあるワードを使い親近感を作る ③「関わる人も自分で選べる」手段として「SNS×AI」の魅力をアピール (編集済)\n2026年3月18日水曜日 12:42","sourceUrl":"","createdAt":"2026-03-18T03:42:33.791Z"},{"id":"scr-1779710258428-kpgqhd","title":"[質問部屋] アイコン、個別ポスト添削についてありがとうございます ポスト添削会参加して活用い...","category":"feedback","content":"アイコン、個別ポスト添削についてありがとうございます ポスト添削会参加して活用いたします！  アイコンについて度々ご質問させていただきます！  スクール生の方のアイコンを参考に作成してみましたがまだモブさございますでしょうか？？","sourceUrl":"","createdAt":"2026-03-22T00:57:09.888Z"},{"id":"scr-1779710258428-lglgqh","title":"[質問部屋] 初めて質問させて頂きます。（もし質問方法など間違っていれば指摘頂けますと幸いです...","category":"feedback","content":"初めて質問させて頂きます。（もし質問方法など間違っていれば指摘頂けますと幸いです。）  ❶ジャンル選定について ❷これからXを初める全くの初心者なのですが、月利100万円以上を安定して継続できることを目標としています。 ❸私のこれまでの経験や興味を踏まえると候補として以下のジャンルがあり、物販が良いかと思っています。 ただし商材の中身が分かっておらず、もし商材がせどりメインであれば自分がやってきたことと異なるので投資の方が良いのかなとも思いました。（スクール入校前の面談では物販をオススメされました。）  私の経験 ・物販: 2023年から個人事業主として取り組んでいます。 販売先はAmazonのみ。商品の仕入れ元は国内メーカーまたは問屋からです。（せどりや中古販売、海外からの仕入れや海外への販売はやっていません） 商品の選定や仕入れ元とのやり取り、Amazonでの販売などは自分でやってますが、仕入れた商品の受け取りとAmazon倉庫への発送は外注しています。 過去最高は月利40万円ほどですが、最近はあまり作業できておらず月利10万円くらいです。  ・投資: 2016年頃から細々とNISAと確定拠出年金で投資信託をやってきました。 一時抜けている期間もありますが、今は毎月10万円（夫婦で20万円）を継続投資しています。昨年は相場が良かったこともあり、600万円くらい増えていました。 投資信託のみで個別株などは全くやっていません。（ファンダメンタルやテクニカル分析などはできません）  ・AI: 自分も時代に乗り遅れてはいけないとGeminiに課金していますが、基本的な調べ物や相談事をチャットで会話するくらいしかできていません。AI関連のyoutubeは興味本位で見てます。  ❹長々と申し訳ございませんが、質問内容は以下です。 ・私にとってどちらのジャンルが良いかご意見頂けますと幸いです。 ・商材の具体的な内容はどちらで確認できますでしょうか？（物販や投資と言っても色々あるかと思うので、せめて何を教えている商材かを知れれば発信すべき内容がズレないかと思いました。）","sourceUrl":"","createdAt":"2026-03-22T02:23:37.931Z"},{"id":"scr-1779710258429-wphoel","title":"[質問部屋] @Yusuke＠講師 さん プロフィール設計などは別途やり取りさせていただいた通...","category":"feedback","content":"@Yusuke＠講師 さん プロフィール設計などは別途やり取りさせていただいた通りですが、アイコンについて添付の5案作成したので、ご確認いただければ幸いです！ モブさをできるだけ省いたつもりではありますが、、","sourceUrl":"","createdAt":"2026-03-23T09:27:58.861Z"},{"id":"scr-1779710258430-cmrhom","title":"[質問部屋] ご丁寧に返信頂き、ありがとうございます！ やはり経験のある物販で進めたいと思いま...","category":"feedback","content":"ご丁寧に返信頂き、ありがとうございます！ やはり経験のある物販で進めたいと思います！ ただせどり系は否定しないように発信を考える時は注意したいと思います。  ちなみに、投資のスクールはどのような内容でしょうか？","sourceUrl":"","createdAt":"2026-03-23T09:29:23.110Z"},{"id":"scr-1779710258430-upcvps","title":"[質問部屋] @Yusuke＠講師 さん お疲れ様です！ XアカウントをM&Aサイトでアカウン...","category":"feedback","content":"@Yusuke＠講師 さん お疲れ様です！ XアカウントをM&Aサイトでアカウントの購入を考えていますが、M&Aサイトでアカウントを購入しても大丈夫でしょうか？ 注意する点がありましたらご教示お願いします (編集済)\n2026年3月23日月曜日 21:48","sourceUrl":"","createdAt":"2026-03-23T12:48:05.725Z"},{"id":"scr-1779710258431-aacwkq","title":"[質問部屋] 先日ご確認いただいたアイコンについて、帽子を小物として加えたのと、背景の色を変え...","category":"feedback","content":"先日ご確認いただいたアイコンについて、帽子を小物として加えたのと、背景の色を変えてみました。再度で恐縮ですが、ご確認いただければ幸いです。よろしくお願いいたします！","sourceUrl":"","createdAt":"2026-03-25T11:37:45.919Z"},{"id":"scr-1779710258432-hicthv","title":"[質問部屋] 【質問部屋の利用方法】\n\nこちら積極的に質問してもらうことで\n自分1人では解決で...","category":"feedback","content":"【質問部屋の利用方法】\n\nこちら積極的に質問してもらうことで\n自分1人では解決できない悩みを即解消できますし\n\n他のメンバーの質問も見ることで\n1人でやってるだけでは\n決して辿り着かなかった視点も得られます。\n\n存分に活用してください！\n\n以下質問時のルールだけ共有しておきます。\n\n・質問の際のルール\n\n①すでに授業で扱った内容に関する質問のみを可とします。\n\nチームなまいきメンバーが成果出るようにカリキュラムを組んでいるので、\nまだ授業で扱ってない先走った内容の質問は、一旦なしでお願いします！\n\n②完全に思考放棄するのは絶対に辞めること\n\nポスト何やればいいですか？\nアイコン何がいいと思いますか？\nローンチでどうすればいいですか？\n\nみたいな何も考えずに\nとりあえずぶん投げるみたいなのは禁止です\n\n当然サポートはしますが\n今後個人で稼いでいきたいなら\n自分で適切な解を捻り出すという業務は一生付きまといます\n\n思考放棄＝個人で稼ぐ道の断念なので\n必ず自分で考えられるだけ考えてから質問してください\n\nただ、悩みすぎも良くないので\n行き詰まったら即質問してください！\n\n\n③思考回路を必ず記載すること\n\n一番大事なのは具体事例のインプットや添削ではなく\nそもそもの思考回路をビジネスで結果が出るようなものに変えていくことです\n\nポストの質問で一旦そのポストは良くなったとて\nそれを再現性持って生み出せるようにならなければ\n結果を出し続けることはできません。\n\nなので必ずあなたがどう考え\n何をすべきだと思ってるのか\n必ず思考の形跡を明示した上で質問してください。\n\n\n\n\n\n━━━━━━━━━━\n\n【質問フォーマット】\n\n❶質問のおおまかなテーマ\n❷現在の状態、目指すゴール\n❸自分なりの意見や仮説\n❹質問内容\n\n-------------\n\n例1)\n\n❶アカウント買収について質問です。\n\n❷https://x.com/~~~\n\nこちらの物販系アカウントを今買収検討中です。自分は運用開始3ヶ月以内にはマネタイズ0→1達成していきたいと考えてます。\n\n❸今回、上記アカウントの買収に10万円かけようと思ってます。理由は〜〜〜だからです。\n\n❹この場合の10万円の値段は妥当でしょうか？\n\n-------------\n\n例2)\n\n❶X初期の運用について質問です。\n\n❷https://x.com/~~~\n\n現在、こちらの裏垢系アカウントをゼロから立ち上げて、1日3ポストを1ヶ月継続中です。\n\n授業で言われた通り、〜〜を意識してるのですが、中々インプもフォロワーも増えません。\n\n1ヶ月後には、〇〇フォロワー、平均インプ△△、まで伸ばせたらと思ってます。\n\n❸自分的には、〇〇が足りないのかなと思います。なので、これからはをやっていこうと思ってます。\n\n❹こちらの考えや方向性で合ってますでしょうか？ (編集済)\n2026年3月27日金曜日 14:11","sourceUrl":"","createdAt":"2026-03-27T05:11:00.030Z"},{"id":"scr-1779710258432-mmtlgm","title":"[質問部屋] あか@運営\n がメッセージをチャンネルにピン留めしました。ピン留めされたメッセー...","category":"feedback","content":"あか@運営\n がメッセージをチャンネルにピン留めしました。ピン留めされたメッセージを全て表示。\n — \n2026/03/27 14:11\n2026年3月27日金曜日 14:11","sourceUrl":"","createdAt":"2026-03-27T05:11:06.521Z"},{"id":"scr-1779710258433-uyfnpp","title":"[質問部屋] お世話になります。 初めて質問をさせていただきます。 下記の通り1点ご質問をさせ...","category":"feedback","content":"お世話になります。 初めて質問をさせていただきます。 下記の通り1点ご質問をさせてください。  ＝＝＝  ❶質問のおおまかなテーマ アカウント買収について  ❷現在の状態、目指すゴール カリキュラムはLV.1までの完了で、現在アカウント買収に努めている最中です。その中で、アカウント買収の交渉を進めることができ、問題なく進めば譲渡完了できそうです。譲渡完了後は、転生して決めたジャンル(裏垢想定)にて運用を開始していき、運用開始3ヶ月以内にはマネタイズ0→1を達成していきたいと考えています。  ❸自分なりの意見や仮説 この度の買収予定アカウントは、裏垢界隈ではなく、Xマネタイズ界隈(具体的にはInstagramでのマネタイズ)で動いていたものです。転生後は裏垢界隈で運用していくつもりでしたが、「Xマネタイズ界隈をフォローしている人＝副業を探している属性」ということで、直接的な界隈転生ではありませんが、転生後の親和性はあると考えております。  ❹質問内容 この場合における❸の考え方は合っておりますでしょうか？ また問題なく進めて構わない場合、転生前後で対応しておくべきことはございますか？ 例えば、既存アカウントのポストを全て消しておく、フォロー/フォロワーを整理しておく等。 恥ずかしながら当方アカウント買収の経験がないため、譲渡後の具体的な運用方針がございましたらご教示いただけますと幸いです。  ＝＝＝  以上、よろしくお願いいたします。","sourceUrl":"","createdAt":"2026-03-30T13:09:20.545Z"},{"id":"scr-1779710258434-xqpvdz","title":"[質問部屋] ご回答いただき、ありがとうございます。 ③の考え方が合っており、安心いたしました...","category":"feedback","content":"ご回答いただき、ありがとうございます。 ③の考え方が合っており、安心いたしました。  またポスト削除不要の旨、承知いたしました。 「フォロー：100弱、フォロワー：4,500弱」のため、フォローの整理は一旦せずに運用していくことにいたします。  重ねてのご質問で恐縮ですが、以下2点にご回答いただけますと幸いです。  ＝＝＝  ❶テーマ 買収後の運用方針について  ❷現在の状態、目指すゴール 直近のポストはInstagramマネタイズに関する内容が多くございます。固定ポストではInstagramマネタイズのコンテンツ販売（深夜マーケット）をしており、それなりの販売数を出している状況です。こちらを裏垢マネタイズに寄せていき、高単価アフィリエイトに繋げていきたいです。  ❸自分なりの意見や仮説 ”これまではInstagramマネタイズを推していたが、今は裏垢がアツい”というようなニュアンスで、「新たにチャレンジ→成果→教育→アフィリエイト」というストーリー型運用がマッチしているかと考えました。  ❹質問内容 ❷と❸を踏まえて、運用方針は合っておりますでしょうか？ 恐れ入りますが、私自身が未だLV.2までの完了のため、これから先のカリキュラムにて該当の質問内容に関する回答があり、思考がクリアになるのであれば先走った質問をしてしまい申し訳ございません。 回答および、ご意見等も併せていただけますと幸いです。  ＝＝＝  ❶テーマ 買収アカウントの販売コンテンツ権利  ❷現在の状態、目指すゴール 固定ポストで販売しているコンテンツ等、これらの「管理/運用/販売」権利も含めて譲渡してもらいたいです。  ❸自分なりの意見や仮説 会員サイトに格納してある契約書をそのまま使用しますが、抽象的な表現だったため念のために確認したいです。  ❹質問内容 他の皆様で、買収成功したアカウントでのコンテンツ権利は、どちらに帰属されておりますか？ 懸念事項としては、もし譲渡対象者が”コンテンツは引き続き持っておきたい”とゴネて、アカウント譲渡自体が白紙になってしまうことを恐れております。そういった懸念事項がある場合における立ち回り方法があれば、合わせてご教示いただけますと幸いです。  ＝＝＝  以上2点、どうぞよろしくお願いいたします。","sourceUrl":"","createdAt":"2026-04-02T03:27:47.779Z"},{"id":"scr-1779710258434-ybptew","title":"[質問部屋] @everyone \nコンセプトの設計に関してフィードバックしています。\n最近発...","category":"feedback","content":"@everyone \nコンセプトの設計に関してフィードバックしています。\n最近発信を始めた人や、コンセプト設計に関して迷ってる人は以下の動画を確認ください！\nhttps://www.loom.com/share/bd0bb1de25754438a3be7982fc55ca11","sourceUrl":"","createdAt":"2026-04-02T04:10:48.348Z"},{"id":"scr-1779710258435-cwchmf","title":"[質問部屋] @Yusuke＠講師  返信ありがとうございました。 コンセプト：ターゲット広く...","category":"feedback","content":"@Yusuke＠講師  返信ありがとうございました。 コンセプト：ターゲット広く、ですね。これに変えます。 「今の自分を変えたい男女、会社員（多忙） 副業で効率よく稼ぎたいけど何をすればいいかわからない。」  How:　美容ダイエットを外し、　AIを使って副業。 AI初心者がどんなＡＩや副業があるかを模索しながらトライして成果の出るものにしぼっていく、という過程でよいのでしょうか？　 エンタメ性とからめて美容ダイエットとしましたが、日常の中にエンタメ性を時々いれる、というふうにしようと思います。 お手すきの際に　アドバイスよろしくお願いいたします。","sourceUrl":"","createdAt":"2026-04-02T04:10:56.260Z"},{"id":"scr-1779710258436-xxcxvk","title":"[質問部屋] @Yusuke＠講師  お世話になっております 　　初投稿です。→【テーマ修正し...","category":"feedback","content":"@Yusuke＠講師  お世話になっております 　　初投稿です。→【テーマ修正します4/2】 Lv2が終了したのでコンセプトとプロフィール添削お願いいたします  【プロフィール】 くらら｜42歳 港区OL 離婚しました。美容課金ガチ加速のため、AI副業ド素人からスタート。 年下マッチョペット君でアンチエイジング中。 ポッコリお腹ごまかしてるの（笑）。  【コンセプト】 who： 自分磨きをしている女性。若さも陰り、焦り始めた 筋トレしてももてない男性。頑張って疲れてきた 老けずに、今の自分を変えたい男女、28歳から40歳会社員（多忙） 副業で効率よく稼ぎたいけど何をすればいいかわからない。 【追加】解説が文字だけの専門家、レシピ発信者  ゴール： 3ヶ月で月50万円の副収入 本業以外に毎月50万円の収入で自分磨きを加速し自信をつける 忙しいので集客プレッシャーを極力避けて収益が生まれる仕組 満員電車から解放され、服・食事・人間関係を自由に選べる側になる  How： 英語圏向けAI無在庫デジタル品販売→　美容ｘＡＩに変更　 修正前「同じ労力で、市場規模が２.5倍の英語圏で収益化効率アップ 集客しなくても売れるプラットフォーム導線 英語ができなくてもAI利用でハードルは低い」  【修正後】「美容ダイエット×AI副業」 老けずに痩せる仕組みとレシピをＡＩで図解 栄養学や筋肉解剖図を難しくなく可愛い画像生成ＡＩを使い 「有益＆なじみやすくて保存」を狙う この図解をデジタル品として販売もしていく  ① 他の副業に比べた「美容ダイエット×AI副業」の魅力  ② 他者のAI副業と比べた「あなたの手法」の魅力  ③ 美容ダイエット×AI副業で３か月で５０万収益化するロードマップ  ④ 美容ダイエット×AI副業を始めて得られた変化  ⑤ 美容ダイエット×AI副業で自由な生活を得た様子  ⑥ 実績の積み上げ報告  ⑦ 初心者が最初にやるべきこと  ⑧図解AI副業の不安をなくす発信  ⑨ 図解AI副業の裏ワザ・効率化  ⑩ 実践している様子（裏側）  プロフィール画像添付します（君はペット　コミックのイメージ）     将来、高単価アフィに繋げたいです。よろしくお願いいたします。 (編集済)\n2026年4月2日木曜日 13:31","sourceUrl":"","createdAt":"2026-04-02T04:31:05.711Z"},{"id":"scr-1779710258436-fnpyzw","title":"[質問部屋] @Yusuke＠講師  とても詳細な動画での返信ありがとうございました。 本講義...","category":"feedback","content":"@Yusuke＠講師  とても詳細な動画での返信ありがとうございました。 本講義も見直しました。 再度プロフィールを作りましたので、アドバイスを頂きたくお願いします。  くらら｜スキルゼロからのAI副業 人間関係と満員電車が無理すぎる港区OL42歳。 AI副業ど素人が“ほぼ放置の収入源”を0から検証。 年下ペット君に癒されてます。  よろしくお願いします (編集済)\n2026年4月3日金曜日 11:29","sourceUrl":"","createdAt":"2026-04-03T02:29:38.574Z"},{"id":"scr-1779710258437-mjklpg","title":"[質問部屋] お世話になっております。  教えていただきたいのですが、「from:アカウント名...","category":"feedback","content":"お世話になっております。  教えていただきたいのですが、「from:アカウント名」で検索をして、最新タブにすると私が返信したものは出てくるのですが、ポストは6日前のものまでしか出てきません。  2日前ぐらいからその状態で一応触らず放置しているのですが、これってシャドウバンまたはサーチバンになっているのでしょうか？","sourceUrl":"","createdAt":"2026-04-07T04:55:05.419Z"},{"id":"scr-1779710258437-ebskxv","title":"[質問部屋] お世話になります。 先日アイコンの変更をアドバイスいただきましたので、このような...","category":"feedback","content":"お世話になります。 先日アイコンの変更をアドバイスいただきましたので、このようなハンギョドンをモデルにした感じのアイコンに変更しようと思っていますが、いかがでしょうか？  また、投資ジャンルでの発信について相談なのですが、現在、私はビットコインをメインに、レバナスやレバFANGなど比較的リスクを取った運用をしています。一方で、妻はNISAでインデックス投資をしています。  投資初心者層をターゲットにする場合、 ・自分が実践しているBTCやレバ系を軸に発信するか ・妻のNISA運用を事例として発信するか ・私もNISA運用をするか ・それとも両者を比較しながら発信するか で迷っています。  個人的には「攻め（自分）と守り（妻）」の対比を見せることで、初心者にとって分かりやすく、有益な発信になるのではと考えています。  ただ、自分自身がNISAを実践していない中で発信の軸に据えることへの違和感も少しあります。  この場合、どのようにポジショニングを取るのが最適でしょうか？","sourceUrl":"","createdAt":"2026-04-07T05:09:35.726Z"},{"id":"scr-1779710258438-lswhhh","title":"[質問部屋] @Yusuke＠講師  お世話になっております。 買収アカウントについて、休眠期...","category":"feedback","content":"@Yusuke＠講師  お世話になっております。 買収アカウントについて、休眠期間が3年（最後の投稿が2023年）など長いものは避けた方が良いでしょうか。お手隙でご教示いただけますと幸いです。よろしくお願いいたします。","sourceUrl":"","createdAt":"2026-04-07T07:08:50.980Z"},{"id":"scr-1779710258439-sdjzjo","title":"[質問部屋] @Yusuke＠講師  お世話になっております！  これから始めるアカウントにつ...","category":"feedback","content":"@Yusuke＠講師  お世話になっております！  これから始めるアカウントについて質問です！  自分で過去に発信していたアカウントで始めようと思うのですが アカウント買収と比べて、どうでしょうか？（物販の発信をします）  副業系、お金稼ぎ系で発信していたアカウントで 4000フォロワーのものと100フォロワーのものがあります！  一応2万フォロワーのものもあります。  個人的には4000フォロワーのものが バランス的にいいのかなと思っております！  どちらも3年ほどは動いていません。 当時はいいね周りやリプの交流はありました。  アカウント名は変えて始めようと思います！","sourceUrl":"","createdAt":"2026-04-09T03:05:26.539Z"},{"id":"scr-1779710258439-hzjxut","title":"[質問部屋] @Yusuke＠講師  お世話になっております！  Lv13の講義にて提携先のス...","category":"feedback","content":"@Yusuke＠講師  お世話になっております！  Lv13の講義にて提携先のスクールの情報を定期的に確認するようにとありましたが、こちらで言及されておりますスクールの情報はどちらから確認することが可能でしょうか？  見落としておりましたら大変恐縮ですが、こちら見当たらない状況となっておりますのでどこから閲覧可能かご教授いただけたらと思います","sourceUrl":"","createdAt":"2026-04-09T06:59:46.218Z"},{"id":"scr-1779710258440-kpvtef","title":"[質問部屋] お世話になっております！  これから始めるアカウントについて質問です！  占いジ...","category":"feedback","content":"お世話になっております！  これから始めるアカウントについて質問です！  占いジャンルで始めようと思っておりますが、アカウント買収先探しについて悩んでおります。  物販であれば物販をやっていそうな趣味アカ 投資であれば投資をやっていそうな投資アカ はわかるのですが、占いをやっていそうな趣味アカというものが見つからずでして。  大枠で見れば副業や稼ぐ系なのでこの辺りから探すべきなのでしょうか？","sourceUrl":"","createdAt":"2026-04-09T07:03:28.850Z"},{"id":"scr-1779710258441-yisxgy","title":"[質問部屋] @あか@運営  ご回答いただきありがとうございます。  7,8ジャンルくらいで提...","category":"feedback","content":"@あか@運営  ご回答いただきありがとうございます。  7,8ジャンルくらいで提携しているスクールがありそのスクールの集客支援を行えると聞いておりましたが、どのタイミングから提携ができるようになるのか、また、そのスクールの情報はどちらから確認すればいいのかご教授いただきたいです！ アカウントを育てていく際に送客するものに繋げられるような発信をしていきたいので確認させていただきたく！","sourceUrl":"","createdAt":"2026-04-10T05:35:25.963Z"},{"id":"scr-1779710258441-kxdzgn","title":"[質問部屋] @あか@運営  詳細にご回答いただきありがとうございます  運営側から連絡をいた...","category":"feedback","content":"@あか@運営  詳細にご回答いただきありがとうございます  運営側から連絡をいただくタイミングとしましては、明確なラインや入会から何ヶ月など決まっておりますでしょうか？  また審査の基準などございましたらご教授いただきたいです","sourceUrl":"","createdAt":"2026-04-10T15:06:36.627Z"},{"id":"scr-1779710258442-sjsloz","title":"[質問部屋] ❶アカウント買収について  ❷運用開始前です。 占いジャンルにて運用を始めようと...","category":"feedback","content":"❶アカウント買収について  ❷運用開始前です。 占いジャンルにて運用を始めようと考えておりましてアカウント買収をしたいと考えております。 買収先を探す際、物販であれば物販をやっていそうな趣味アカ、投資であれば投資をやっていそうな或いは興味がありそうな趣味アカはわかるのですが占いをやっていそうな趣味アカこれだと探し方がわからなくて困っています。  ❸大枠で見れば稼ぐ系、副業系なのでこの辺りから探そうと思っております  ❹こちらの方向性であっていますでしょうか？","sourceUrl":"","createdAt":"2026-04-11T07:01:04.598Z"},{"id":"scr-1779710258442-ugxjts","title":"[質問部屋] @Yusuke＠講師  お世話になっております。  アカウントのコンセプトとプロ...","category":"feedback","content":"@Yusuke＠講師  お世話になっております。  アカウントのコンセプトとプロフィールを作成しましたので フィードバックを頂きたいです。 お手数ですがよろしくお願いします。  コンセプト https://www.notion.so/33d85b52957b80ba86c9f803bb2eeb50?source=copy_link  プロフィール https://www.notion.so/33d85b52957b8078a668ee30eb20188c?source=copy_link","sourceUrl":"","createdAt":"2026-04-11T07:07:53.374Z"},{"id":"scr-1779710258443-veulcl","title":"[質問部屋] @Yusuke＠講師  初めまして、初投稿です。これからよろしくお願いします。 ...","category":"feedback","content":"@Yusuke＠講師  初めまして、初投稿です。これからよろしくお願いします。 Lv2のタスクについて、もしお時間ございましたら以下添削頂けると幸いです。 よろしくお願いします。  ＜コンセプト＞ ・Who：誰に向けて発信する？ 　日々忙しく給料も期待以上に貰えていない会社員や家事・育児に忙しい主婦。 　－副業迷子 　－スキルなし 　－何やっても続かない 　－楽に稼ぎたいけど方法がわからない  ・What：どんなゴールに連れて行く？ 　AI×占いで、初心者には難しいと思われている占いを仕組化、 　スキル不要で稼ぐルートを身に着け 　1日30分初月で1万円〜10万円を可能とする。  ・How：ゴールまでのロードマップは？ 　－マインドセット破壊（0→1前） 　－全体像の理解（迷子防止） 　－最初の1円 　－AIで占いを仕組み化 　－商品設計 　－集客（0→1～） 　－リピート設計 　－半自動化 　－スケール（1万→10万）  ＜10のポスト方針＞ ①他の副業に比べた【AI×占い】の魅力 ②他の占いと比べた【AI×占い】の強さ ③AI×占いで月10万までのロードマップ ④AI×占いで得られた変化 ⑤AI×占いでの“ちょっと満たされた生活” ⑥実績の積み上げ ⑦初心者が最初にやること ⑧よくある勘違いの否定 ⑨裏ワザ・ラク技 ⑩実際にやってる様子  ＜プロフィール＞ １．ヘッダー画像 　添付します  ２．アイコン 　添付します  ３．名前、肩書 　すぴか｜AI×占いで初月10万達成  ４．プロフ文 　スマホ1台、AI占いで初月10万。 　スキルゼロの副業迷子でも最短収益化。 　顔出し不要・在庫なしでリピート続出。 　1日30分で回る半自動の仕組み。 　気づいた人から稼ぎ始めてる。  ５．固定ポスト 　はじめまして。 　AI占いで初月10万。 　スマホ1台、スキルゼロからスタート。 　「副業何やればいいかわからない」 　って状態から抜け出せたのはこれだけ。 　顔出し不要・在庫なし・リピートあり。 　正直、もっと早く知りたかった。 　これからやり方も出していくので 　見逃したくない人はフォローしておいて。","sourceUrl":"","createdAt":"2026-04-11T07:10:47.769Z"},{"id":"scr-1779710258444-qvojmc","title":"[質問部屋] @Yusuke＠講師  お世話になっております。  アカウントの設計やプロフィー...","category":"feedback","content":"@Yusuke＠講師  お世話になっております。  アカウントの設計やプロフィールを作成しなおして運用したいと考えているので添削をお願いしたいです。 よろしくお願いいたします。  https://docs.google.com/document/d/1UM-3N2YDBdFYK21RwoRCwK_Qb_7xA2Gm_rdylJwNIx8/edit?usp=sharing","sourceUrl":"","createdAt":"2026-04-11T07:12:26.183Z"},{"id":"scr-1779710258444-jzgxwa","title":"[質問部屋] @Yusuke＠講師  お世話になっております！初投稿です。 コンセプトとプロフ...","category":"feedback","content":"@Yusuke＠講師  お世話になっております！初投稿です。 コンセプトとプロフィールの添削をお願いしたいのと、発信のトーンについて一点質問させていただきたいです。 よろしくお願いいたします。  【コンセプト】 https://docs.google.com/document/d/1h4SHlFWLNeTfJfHNTtGn3ykBu1ZjQsN4Cz8oBevxP9Q/edit?tab=t.0  【プロフィール】 https://x.com/koharu_ai71?s=21  【質問】 アイコンやプロフィールについて、モブ感が出ないように尖らせようとした結果、本来の自分の性格と割と違う生意気な感じのキャラクターになってしまい、このキャラクターを発信で演じられるか自信がないのですが、発信のトーンはアイコンのキャラクターに完全に寄せて口調を強くしたりするべきでしょうか？それとも本来の自分の性格からアイコンのキャラクターに多少寄せる程度でも良いのでしょうか？ (編集済)\n2026年4月11日土曜日 18:22","sourceUrl":"","createdAt":"2026-04-11T09:22:29.365Z"},{"id":"scr-1779710258445-iwvfdh","title":"[質問部屋] コンセプトに関して、AIジャンルでAI副業について発信するのか、占いジャンルでA...","category":"feedback","content":"コンセプトに関して、AIジャンルでAI副業について発信するのか、占いジャンルでAI×占いについて発信するのか、どちらかメインの軸となるものを決めるのが良いかと！\nまたアイコンはモブ感あり、ヘッダーは業者感があるため、最悪ヘッダーはなしでも良いかとおもいます","sourceUrl":"","createdAt":"2026-04-13T18:39:36.508Z"},{"id":"scr-1779710258446-sktniu","title":"[質問部屋] アイコンはモブ感強いので変えていきたいですね！肩書の0→1挑戦中、に関しては発信...","category":"feedback","content":"アイコンはモブ感強いので変えていきたいですね！肩書の0→1挑戦中、に関しては発信見ればわかるかと思うので、あえて肩書にしなくてもよいですね (編集済)\n2026年4月14日火曜日 3:49","sourceUrl":"","createdAt":"2026-04-13T18:45:53.252Z"},{"id":"scr-1779710258446-rxtnjf","title":"[質問部屋] @Yusuke＠講師   はじめまして、初質問になります。lv2のアカウント添削...","category":"feedback","content":"@Yusuke＠講師   はじめまして、初質問になります。lv2のアカウント添削をお願いできますでしょうか…？  【発信コンセプト3要素】 WHO: 会社員で収入を増やしたい人に HOW: AIを使ったマネタイズで WHAT: 月10〜30万円の安定収益  【発信の10の要素】 ・AI副業は「特別なスキル不要」で始められるという魅力 ・他の副業と違い「時間をかけず効率的に稼げる」という優位性 ・未経験→月10万円までの具体ロードマップ（超初心者向け） ・AIを使い始めて「稼げるようになった変化」の発信 ・収入の不安がなくなった生活（精神的余裕・選択肢の増加） ・日々の実績報告（小さな成果も含めて可視化） ・初心者が最初にやるべきAI×副業案件の具体例 ・「AIは難しい・怪しい」という思い込みの否定 ・誰でもできるAI活用の裏ワザ・時短テクニック ・実際に作業している様子・リアルなプロセスの公開  【アカウント】TOP画像添付します。 https://x.com/dk_ak00?s=21&t=OPr4_cIfMKr5J6LEl3Ui6Q  【BIO】 知識ゼロ・人脈ゼロ・センスゼロ、もちろん実績もゼロ フルリモート・フルフレックスの会社すらしんどくて退職した28歳OLが、寝転びながらAIを使って月10万→最終的には月100万を目指すシンデレラストーリー  【固定ツイート】 副業やってるのにずっと0円。 何から始めるか分からず、時間だけ消費して正直諦めかけてた。  でも「AIで変わるかも」と思って再挑戦します❗️  スキル0のアラサーOLが AIで月10万円を目指す過程を全部発信します。 まずは「1円稼ぐ」ところから。  同じように悩んでる人一緒に抜け出しませんか？   【質問】 数日間アカウントを動かしてみて、AI分野はガツガツと自動化や開発に取り組んでいる人ような最先端で有益な内容や、長いtips記事ツイートが伸びやすいように感じています。 この見立ては、自分の立てたコンセプトの、誰でも出来る、特別なスキルは不要、となるべく「簡単」に「ライト」に見せていきたいという方針と相反してしまっているように感じています。 このコンセプトで進める場合、AIジャンルを掲げるものの会社員のやりそうな副業関連は広めに 日々のいいねやフォロー周りの営業をかけた方がいいのでは？と考えたのですが、最初は界隈認知を広げるためにAIジャンルに絞って進めていく方がいいのでしょうか…？","sourceUrl":"","createdAt":"2026-04-14T02:43:53.577Z"},{"id":"scr-1779710258447-dpbokr","title":"[質問部屋] @なまいきくん @Yusuke＠講師  @あか@運営  投資垢のしょうです。いつ...","category":"feedback","content":"@なまいきくん @Yusuke＠講師  @あか@運営  投資垢のしょうです。いつもお世話になっております！  現在、プレゼント企画のリスト取りを目指しています。ただ、ドライテストに進む以前に直近アカウントパワーが下がっており、何を見直すべきか教えていただきたいです。  【ゴール】 最終的には、Xからプレゼント企画につなげて、LINE登録→個別チャット→面談導線まで持っていきたいです。 今はその前段階である「発信の勢い・興味付け・ファン化」が弱く、プレ企画に進める状態を作れていません。  【これまでの流れ】  自分は、トレードで     •    47万溶かした     •    7.6万まで減った     •    月30万達成     •    月126万で会社辞めた  みたいな逆転ストーリー系のポストを出すと、一時的にかなり伸びます。 実際に月利126万ポストは万インプで反応がありました。 ただ、その後に同じ方向を擦っても熱が冷めて、インプも戻ります。ストーリーポストは一瞬の熱は取れるけど、熱が持続せずファン化しない状態です。  【最近の投稿について】  プレゼント企画の切り口としてAIを絡めた発信も試しましたが、     •    後付け感が出る     •    生っぽさが消える     •    「AIすごそう」で終わる     •    欲望や緊急性が弱い     •    フォロワーも1週間で30人くらい減っている  という状態です。  【課題】  現状、プレゼント企画以前に、読者に見られていない・興味を持たれていない感覚があります。 そのため、ドライテストに進みたくても進めない状況です。  【仮説】      •    ストーリーポスト依存で、一瞬の熱しか取れていない     •    その後に読者が追う理由になる軸がない     •    AIを入れるにしても、主役にすると薄くなる     •    だから「AIも触って利益出してる人」くらいの脇役にした方が良さそう？     •    ただ、それでも今は発信全体の一貫性が弱く、何を軸に追わせるかが定まっていない   【聞きたいこと】  この状況を踏まえて、今の自分が最優先で判断すべきことを教えてほしいです。  特に見てほしいのはこの3点です。     アカウントパワー低下の主因は何か？\n,\n　ストーリーポスト依存なのか、発信の一貫性不足なのか、AIの後付け感なのか、他の要因なのか     今の自分は何を軸に追う理由を作るべきか\n,\n　ストーリーの続きを見せるのか、主張や比較を増やすのか、別の軸があるのか     今の段階でプレ企画に向けたドライテストを続けるべきか、それとも一旦発信の土台復旧に専念すべきか\n,\n　もし復旧優先なら、何をどの順番で直すべきか。  以上教えて頂けますと幸いです。よろしくお願いいたします  https://x.com/easyfire_index?s=21&t=QXAJC6PXhEjaemxgd-A2rQ","sourceUrl":"","createdAt":"2026-04-14T03:48:09.606Z"},{"id":"scr-1779710258448-zmqwaf","title":"[質問部屋] @Yusuke＠講師  コンセプト、アイコン修正しましたので添削をお願いします。...","category":"feedback","content":"@Yusuke＠講師  コンセプト、アイコン修正しましたので添削をお願いします。 アイコンについては複数作成しましたのでよさそうなものがあるか見て頂けると幸いです。  \"■名前 なまけうめ ---  ■プロフィール文 元年商数千万→売上崩壊してガチで危機。仕事減・収入激減の中、AI占いで再起中。スキル0・初期費用ほぼ0でも回る収益導線を検証中。 --- ■固定ポスト（使用）  俺はここから復活する。  売上崩壊して終わりかけたけど、 このまま終わる気はない。  AI占いで 月5万→10万→30万  ここまで持っていく過程、全部出す。  成功した後の発信じゃなくて、 “途中”を見れるのは今だけ。  後から来ても遅い。  初期メンだけ覚えとくから 今のうちにフォローしとけ。   Who：誰に向けて発信するか？  【読者の現状】 AI占いで副業に興味がある 20〜40代の男性（会社員・パパ・地方在住）で、実績やレベル感は副業未経験〜月1万円未満  【悩み・課題】 AIって難しそうで使いこなせる気がしない 占いで稼ぐって怪しい 胡散臭いと思っている         副業は時間がないと無理だと思っている         SNSはセンスがある人しか伸びないと思っている スキルがない自分には無理だと思っている 初期費用がかかる副業は怖い 継続できる自信がない 本当に稼げるのか半信半疑 過去に情報商材で失敗して信用できない 何を信じればいいかわからない  ⸻   What：どんなゴールに連れて行くか？  3ヶ月でAI占いを使って月5万円の副収入を達成 （スキル0・初期費用ほぼ0でも可能）  【理想の状態】 家族にちょっとした贅沢をさせられる お小遣いを気にせず使えるようになる 将来への不安が減る 子どもとの時間を増やせる 上司や会社に依存しない収入源を持つ安心感   ⸻   How：どんなロードマップで連れて行くか？  1.AI占いジャンルを決定（恋愛・復縁・仕事など） 2.AIテンプレで“売れる占い文章”を作成（コピペOK） 3.インスタ・スレッズで「占い発信」に特化して集客 4.ココナラ・メルカリで占い商品を出品＆販売 5.売れた型を量産→自動化して安定収益化  ⸻   発信の10要素（AI占い特化ver）  ここもかなり重要なので作り直します AI占いという「未経験からでも参入できるブルーオーシャン」の魅力 他の副業と比べた“AI占い”の簡単さ・低リスク・即金性  AI占いで月5万円までの具体ロードマップ AI占いを始めて得られた変化（収入・時間・心の余裕） 家族との時間が増えた生活・副業成功後のリアル ココナラ・メルカリでの販売実績・検証データ公開 完全初心者が最初にやるべき「最初の1ステップ」 「占いは怪しい」「AIは難しい」という誤解の破壊 AI占いテンプレ・売れる文章・時短テクニック公開 実際の出品・作業・売上のリアルな裏側発信\"","sourceUrl":"","createdAt":"2026-04-14T03:54:56.709Z"},{"id":"scr-1779710258448-vkquki","title":"[質問部屋] 回答ありがとうございます。  ヘッダーは無しで了解しました。  アイコン再度作り...","category":"feedback","content":"回答ありがとうございます。  ヘッダーは無しで了解しました。  アイコン再度作り直しましたので よろしくお願い致します。  モチーフ(植物)をそのままで擬人化させました アニメキャラをモチーフにしています。","sourceUrl":"","createdAt":"2026-04-14T05:36:09.373Z"},{"id":"scr-1779710258449-vuypmt","title":"[質問部屋] @Yusuke＠講師　お世話になっております！ 先日は、フィードバック誠にありが...","category":"feedback","content":"@Yusuke＠講師　お世話になっております！ 先日は、フィードバック誠にありがとうございました！ 今後、AI×動画で配信を行い、 成果ももっと出していこうと思います。  アイコンが普通なので、抜け感を。 ズボラ主婦や、ひきこもり感のアイコンに。 ということで、こちらを考えてみました。  お手すきの際に、アドバイスをどうぞよろしくお願いいたします！ https://x.com/mineko_serebu","sourceUrl":"","createdAt":"2026-04-14T05:36:36.750Z"},{"id":"scr-1779710258450-qjjilr","title":"[質問部屋] Yusukeさん、ご回答ありがとうございます。  発信コンセプトとして、今以下の...","category":"feedback","content":"Yusukeさん、ご回答ありがとうございます。  発信コンセプトとして、今以下のように設計しています。  会社員として消耗し、先出し（他人）依存でも独学でも負けた側の人間が、相場の見方を変え、型を掴み、AIも使いながら、過去の自分と同じように労働と相場で苦しむ会社員に、抜け道を示す発信  まず、このコンセプト自体が的外れでないかを見ていただきたいです。  その上で、今詰まっているのが以下です。  「しょうを追っていれば自分も稼げそう」と思わせるポストは、具体的にどんな切り口なのか。\n,\n自分は、逆転ストーリーや人生が変わった様子を見せれば、同じ境遇の読者が自分を重ねて「自分もこう変わりたい」と思うのではと考えていました。 でも実際には、ストーリーがただの面白い話で終わりやすく、追う理由に繋がっていません。 このズレは何なのかを知りたいです。  自分は、読者に何を与える人として見せるべきなのか。\n,\n自分としては、 先出しや他人依存ではなく、自分で相場を見て判断するための見方、勝てる場面だけを待つ感覚、労働収入だけに依存せず資産を増やしていく考え方 を与える発信をしているつもりです。 ただ、それが読者に伝わっていない感覚があります。 複雑なテクニカルではない前提で、自分は読者に何を与える人として立つべきなのかを知りたいです。  読者をどこに連れていくかは、自分では発信コンセプト通りのつもりなのに、なぜ伝わっていないのか。\n,\n自分としては、労働と相場で苦しむ会社員を、労働収入だけに依存しない側へ連れていく発信のつもりです。 ただ、実際の反応を見ると、その連れていく先や追う理由が読者に伝わっていない感じがあります。 これはコンセプト自体のズレなのか、見せ方のズレなのか、投稿設計のズレなのかを知りたいです。  以上アドバイスいただけますと幸いです","sourceUrl":"","createdAt":"2026-04-14T09:09:42.696Z"},{"id":"scr-1779710258450-aqburi","title":"[質問部屋] お世話になっております タカトウです、21歳の学生です。 今現在Lv2を終えよう...","category":"feedback","content":"お世話になっております タカトウです、21歳の学生です。 今現在Lv2を終えようとしているのですが、ジャンル選びについて質問です。  裏垢か恋愛のどちらかで発信をしようと考えているのですが、 裏垢のアカウントはシャドウバンになって、マネタイズもできていない状態です。 裏垢のフォロワーは450人くらいです。シャドウバンがなければインプレッションは平均4000くらいです。  恋愛に関してはマッチングアプリで女性経験をほどほどに積んだ程度です。 最近はアプリよりストリートナンパしようと考えています。  自分としては恋愛中級者(中身はほぼ初心者)として経験を積んでいく形の ストーリー型運用をしようと考えています。  マッチングアプリ特化で行くのか、 それともナンパで行くのか、ほかの発信の仕方があれば アドバイスをいただきたいです。  他のジャンルについては、触れたことがないので考えていません。","sourceUrl":"","createdAt":"2026-04-14T09:11:11.276Z"},{"id":"scr-1779710258451-puxxyh","title":"[質問部屋] FBありがとうございます！  肩書とヘッダーは削除し、固定ポストについてはパーソ...","category":"feedback","content":"FBありがとうございます！  肩書とヘッダーは削除し、固定ポストについてはパーソナルな部分を意識して業者感を消すよう書き直しました、添削をお願いします！  副業やってもずっと0円 コンビニバイトしたほうが稼げるなって思いながら時間だけ浪費して諦めかけてた  仕事終わりにがっつり働ける体力もないから、AIを味方につけてやり直してみようと思った  スキル0のアラサーOLがAIを学んで月10万円を目指す過程を全部発信する まずは「1円稼ぐ」ところから   質問の回答もありがとうございます。いいねフォローの営業活動については副業全般、10の要素と合致しそうな層はAIに拘らず飛び込んでみます…！","sourceUrl":"","createdAt":"2026-04-14T11:42:56.527Z"},{"id":"scr-1779710258452-tqkebl","title":"[質問部屋] お世話になっております、 先ほどは回答ありがとうございます！   恋愛ジャンルで...","category":"feedback","content":"お世話になっております、 先ほどは回答ありがとうございます！   恋愛ジャンルで発信していくことに決めました。  本スクールで提携できる高単価アフィのスクールは 恋愛ジャンルだとどういったものでしょうか？  例えば彼女をできるまでサポートするみたいなものでしょうか？   加えてもし可能であれば、どれくらいの単価の幅があるか教えていただきたいです。   収益が発生できるような導線がある程度見えた状態で発信コンセプトや プロフィールを作成したいので、質問させていただきました。  単価については、自分が20代前半ということもあり、 おそらく発信していくうえでフォロワーは比較的若い層になると思い、 高単価すぎると成約のハードルが高いと考えています。","sourceUrl":"","createdAt":"2026-04-14T11:47:49.840Z"},{"id":"scr-1779710258452-mekpke","title":"[質問部屋] @Yusuke＠講師  コンセプトについて こちらで問題ないか 見て頂けますでし...","category":"feedback","content":"@Yusuke＠講師  コンセプトについて こちらで問題ないか 見て頂けますでしょうか  よろしくお願い致します。  ---   Who：誰に向けて発信するか？\n,\n【読者の現状】  副業に何度も挑戦してきたが稼げずに終わっている40代会社員  AIに興味はあるが「本当に稼げるのか？」と半信半疑  【悩み・課題・思い込み】  詐欺っぽい情報が多くて不信感がある\n,\n過去に副業で失敗して自信がない\n,\nもう失敗したくないと思っている\n,\n年齢的にラストチャンスだと感じている\n,\n何を信じればいいかわからない\n,\n ---   What：どんなゴールに連れていくか？\n,\n3ヶ月でAIを使って月5〜10万円を目指す（まずは0→1達成まで伴走）  【理想の状態】  家族に我慢させずお金を使える\n,\n嫌な仕事を辞める選択肢が持てる\n,\n「自分でも稼げた」という自信がつく\n,\n会社に依存しなくてもいい安心感がある\n,\n ---   How：どんな方法で達成させるか？\n,\n【提供手段】\n,\nAIを使った副業の「実践記録＋検証＋再現できるやり方＋失敗しない考え方」の共有  ---  【ロードマップ】\n,\nAI副業に再挑戦（過去の失敗を整理）\n,\nAIを使ってできそうな副業を試す\n,\n実践→検証→改善を繰り返す\n,\n小さく収益化（0→1達成）\n,\n再現性を持たせて月5〜10万へ\n,\n ---   発信の10要素\n,\n「副業で失敗してきた人へ」という共感発信\n,\n自分の失敗談（信頼の核）\n,\nAIを触ってみたリアルな感想\n,\n実践してみた結果（成功・失敗どちらも）\n,\n検証プロセス（なぜうまくいった/いかなかったか）\n,\n初収益までのリアル記録\n,\n初心者がつまずくポイントの言語化\n,\nAIに対する不安・怪しさの解消\n,\n作業の裏側（具体的に何してるか）\n,\n少しずつ成長している過程\n,\n ---   コンセプトの一言要約\n,\n「何度も失敗した40代が、AIで人生やり直してる記録」","sourceUrl":"","createdAt":"2026-04-14T13:05:14.120Z"},{"id":"scr-1779710258453-ichxaa","title":"[質問部屋] @Yusuke＠講師   初めまして、初投稿になります。 よろしくお願いいたしま...","category":"feedback","content":"@Yusuke＠講師   初めまして、初投稿になります。 よろしくお願いいたします。 Lv2のタスク、 ・発信コンセプト ・アカウントプロフィール ・アイコン＆ヘッダー こちら3点の添削をしていただきたいと思います。お忙しいとは思いますが、どうぞよろしくお願いいたします。    Who：誰に向けて発信するか？  【読者の現状】 恋愛・モテ・マッチングアプリ・コミュニケーション能力向上に興味がある 23〜30代の若手会社員〜30代で恋愛経験が少ない男性で、友達はいるが女性経験はほぼない層  〖実績やレベル感〗 LINEが続かず既読スルーされる／マッチングしても会話が続かない／何を話せばいいかわからない状態  【悩み・課題・思い込み】 •    マッチングしても会話が続かずフェードアウトする •    沈黙が怖くて無理に話して空回りする •    面白いことを言わなきゃとプレッシャーを感じている •    既読スルーされると「自分に魅力がない」と感じてしまう •    コミュ力は才能で、自分にはどうにもならないと思っている •    陰キャの自分がモテるのは無理だと感じている •    テクニックを覚えればなんとかなると勘違いしている •    世に出ている恋愛テクニックは“元からモテる男向け”で再現できていない   What：どんなゴールに連れて行くか？  1ヶ月で既読スルーされないLINE術を習得し、 6ヶ月で彼女を作る  【ゴールに到達した理想の状態】 •    「また会いたい」と女性から言われるようになる•    会話に対する不安や恐怖がなくなる •    自分に自信がつく •    恋愛がうまくいくことで、仕事や人間関係にも好影響が出る   How：どんなロードマップで連れて行くか？  女性との会話に対する恐怖をなくす\n,\n何を話すかではなく「どう聞くか」を習得\n,\n会話が続く質問・リアクションを身につける\n,\nLINEで自然に関係性を深める\n,\nデート→関係発展\n,\n  発信の10要素  •    恋愛において「会話」が最重要になる理由 •    一般的なモテテクが通用しない理由（＝再現性がない） •    陰キャ・コミュ障でも再現できる会話フレームの解説 •    「盛り上げる会話」が逆効果になる構造 •    1ヶ月で既読スルーされなくなるLINEの全体像 •    非モテから脱却していくリアルな変化ストーリー •    「また会いたい」と言われる男の共通点 •    初心者が最初にやるべき会話改善ステップ •    NG会話→改善のビフォーアフター解説（添削）•    実際に会話を改善していく過程・実践記録   プロフィール  〖非モテ脱却したい男性へ〗元コミュ障×陰キャ▶︎理学療法士として病院勤務、トータル1000人以上の患者様と向き合い『あなたと話すと楽しい』と言われるトーク力を習得|女性とのLINEが続くコツ・ 既読スルー量産→1ヶ月で改善した再現をテンプレ化|会話が続かない男を6ヶ月で彼女持ちへ引き上げます！ (編集済)\n2026年4月14日火曜日 23:45","sourceUrl":"","createdAt":"2026-04-14T14:45:18.982Z"},{"id":"scr-1779710258454-phgrky","title":"[質問部屋] お忙しい中、添削いただきありがとうございます。  こちらのアカウントは、高単価ア...","category":"feedback","content":"お忙しい中、添削いただきありがとうございます。  こちらのアカウントは、高単価アフィリエイトに繋げることを目標と考えています。 添削にて、〖女性垢のエアプ発信では厳しい〗とありますが、これは〖権威性〗の観点からでしょうか？ また、女性垢で恋愛について発信することが高単価アフィリエイトに繋げることが難しいのであれば、発信内容を完全に変えないと高単価アフィリエイトを扱うことは難しいのでしょうか？","sourceUrl":"","createdAt":"2026-04-15T02:36:18.739Z"},{"id":"scr-1779710258455-btlnle","title":"[質問部屋] @Yusuke＠講師  お世話になっております。  一点お伺いしたいのですが、検...","category":"feedback","content":"@Yusuke＠講師  お世話になっております。  一点お伺いしたいのですが、検索欄でfrom:@で検索した時に最新タブでどこまで出てこなかったらバンされていると認識すればいいでしょうか？  前垢でもあったのですが、今回も2日前の夕方ぐらいまでのポストとリプまでは表示されますがそれ以降が出てこないもので…アカウントを動かしていいのか止めておくべきか悩んでいます。","sourceUrl":"","createdAt":"2026-04-15T04:33:49.859Z"},{"id":"scr-1779710258455-mfzkwj","title":"[質問部屋] お忙しい中、ご回答いただきありがとうございます。  発信コンセプトを再度作り直し...","category":"feedback","content":"お忙しい中、ご回答いただきありがとうございます。  発信コンセプトを再度作り直しました。添削いただいてもよろしいでしょうか？まだ伝わっていない点、抽象的でわかりにくい点があればご指摘いただけると幸いです。   Who：誰に向けて発信するか？  【読者の現状】 投資・資産運用・お金の増やし方・脱サラ/独立に興味がある30代〜40代の会社員で、実績やレベル感は投資未経験〜実践できていない段階。残業が多く時間がなく、SNSやネットの情報に振り回されて何から始めればいいかわからない状態。  【悩み・課題】  投資は難しそうで怖い 何から始めればいいかわからない 損をするのが怖くて行動できない 独学で学んでも情報が多すぎて迷う SNSで言っていることがバラバラで混乱する 再現性のあるやり方がわからない 仕事が忙しくて勉強や検証の時間が取れない 投資で脱サラは一部の人だけだと思っている スクールや情報商材が怪しくて信用できない 将来のお金に不安があるのに行動できていない 給料だけでは厳しいと感じている   What：どんなゴールに連れて行くか？  6〜12ヶ月で、忙しい会社員でも1日10分で再現できる投資スキルを身につけ、月30万円を安定して狙えるようになる  【理想の状態・ベネフィット】  給料以外に毎月30万円の収入源がある安心感 会社に依存しなくていい精神的余裕 将来の老後資金の不安が大きく減る 急な出費や家族イベントでもお金に困らない 残業や人間関係に縛られない選択ができる 脱サラ・独立が現実的な選択肢になる 情報に振り回されず自分で判断できる 家族に我慢させない生活ができる 忙しくても短時間で資産形成できる お金の不安から解放される 収入の柱が増え人生の選択肢が広がる   How：どんなロードマップで連れて行くか？ 忙しい会社員でも続く投資環境を整える 1日10分でできるトレードルーティンを習慣化する エントリー・利確・損切りのルールを覚える AIテンプレートで分析・復習を時短しながら実践する 小さく勝ちを積み上げて月30万円を安定して狙う   発信の10要素 他の副業ではなく、忙しい会社員にとって「投資」が最適な理由 張り付き不要でも結果を狙える「1日10分トレード」の魅力 忙しい人でも6〜12ヶ月で月30万円を目指すロードマップ 投資を始めて得られたお金・時間・精神面の変化 会社に依存しない収入源を持つことで得られる生活 月◯万円達成・運用状況などの実績の積み上げ 初心者が最初にやるべき具体的ステップの解説 「投資は難しい・怖い・才能が必要」という思い込みの否定 AIを使った学習・分析・復習の時短テクニックやテンプレ配布 実際のトレードルーティンや日々の行動・検証のリアル発信   思想・信念  ■思想の核  労働と情報に縛られる側から、自分で判断して稼ぐ側へ  ---  ■信念  会社員として消耗し続けるだけでは人生は変わらない\n,\n投資は才能でなくどんな投資手法を選択するかで決まる\n,\n独学はやり方を間違えれば一生遠回り\n,\n正しい環境とやり方なら、忙しい会社員でも結果は出せる\n,\nAIは、投資をラクにして勝ちやすくするための武器\n,\nAIを使えば、学習・分析・復習のムダを減らして最短で前に進みやすい\n,\n ---  ■理想  会社に依存しない収入源を持つ人を増やす\n,\n将来不安で行動できない会社員に選択肢を与える\n,\n労働だけに縛られる人生から抜ける人を増やす\n,\n情報に振り回されず「自分で判断できる人」を増やす\n,\n ---  ■ストーリー（共感の核）  会社員で消耗 ↓ 先出しでも独学でも負ける ↓ 情報を見すぎて迷う ↓ むずかしいことをやめて、見るものを減らす ↓ やることをシンプルにしたら、ムダな失敗が減る ↓ AIも使ってラクに続けられるようになる ↓ 少しずつ利益が安定 ↓ 脱サラして自由な生活へ  ---    なぜその投資スタイルか？  ---   ■投資スタイルの意味付け  ① なぜ「1日10分」なのか？  → 忙しい会社員でも再現できる形にするため  ② なぜ「シンプルな手法」なのか？  → 情報過多で負ける人を減らすため   ③ なぜ「ルール化」なのか？  → 感情トレードで負ける構造を断ち切るため  ④ なぜ「AI」なのか？  → 忙しい人の思考整理・継続を助けるため  ---  ■まとめると  「忙しい会社員のための、1日10分で月30万達成狙える投資法」 (編集済)\n2026年4月15日水曜日 21:33","sourceUrl":"","createdAt":"2026-04-15T12:33:28.909Z"},{"id":"scr-1779710258456-hqmqkx","title":"[質問部屋] お世話になっております。 Lv2のタスクを見ていただきたいです。   Who：誰...","category":"feedback","content":"お世話になっております。 Lv2のタスクを見ていただきたいです。   Who：誰に向けて発信するか？ 【読者の現状】  恋愛経験ほぼ0の18〜27歳の男性で、実績やレベル感は自信がない非モテ 【悩み・課題】 女性と何を話せばいいかわからない 恋愛経験がないことがコンプレックス 周りと比べて劣等感がある 自分はどうせ無理と思っている 女性にどう思われているか気にしすぎる   What：どんなゴールに連れて行くか？ 3ヶ月で“選ばれる側の男”になる 【理想の状態】 女性から好意を持たれる経験が当たり前になる 女性との会話に困らなくなる 自信を持ってアプローチできるようになる 非モテだった過去を忘れるレベルで変わる 恋愛に対する不安がなくなる   How：どんなロードマップで連れて行くか？ マインド改善（非モテ思考の矯正） 見た目改善（清潔感・外見） 会話スキル習得 出会いの場（アプリ・リアル）攻略 デート→関係構築   発信の10要素 非モテでも変われる「恋愛攻略」の魅力 イケメン不要・初心者特化の再現性ある手法 3ヶ月で変わるための具体ロードマップ 自分の非モテ時代〜現在までのリアルな変化 恋愛できるようになって変わった日常（自信・余裕） 日々の実践・成長記録（リアルタイム変化） 非モテが最初にやるべき具体アクション 「どうせ無理」などの思い込みの破壊 会話テンプレ・LINE例など即使えるノウハウ 女性との実践→改善のリアルなプロセス共有  アイコンは添付したものです、  名前は「はくと」にます。  プロフィール文 チー牛大学生ながらマッチングアプリ初月でデート20人。恋愛経験ゼロでも出し抜ける導線を体系化。 自己流で沼るな！  ヘッダーについてですが、テキスト系で考えていますが、一旦スキップでも大丈夫でしょうか？  アフィにつながりやすいかどうかを特に意識したいので、よろしくお願いします。","sourceUrl":"","createdAt":"2026-04-16T12:20:19.206Z"},{"id":"scr-1779710258456-ewtqef","title":"[質問部屋] そういう事なんですね。  では、このアカウントでコンテンツ販売をしていく形での運...","category":"feedback","content":"そういう事なんですね。  では、このアカウントでコンテンツ販売をしていく形での運用はマネタイズに繋がるでしょうか？ コンテンツ販売はnoteを活用して情報発信や販売に繋げたいと考えていますり","sourceUrl":"","createdAt":"2026-04-16T12:20:43.994Z"},{"id":"scr-1779710258457-fvvpiw","title":"[質問部屋] @Yusuke＠講師  はじめまして、LV2の2、3、4のタスクのご確認をお願い...","category":"feedback","content":"@Yusuke＠講師  はじめまして、LV2の2、3、4のタスクのご確認をお願いしたく  ## Who：誰に向けて発信するか？  【読者の現状】 株式投資に興味がある30代〜40代の会社員・フリーランス・副業志向の人で、実績やレベル感は初心者〜安定して勝てていない層     •    個別株で稼ぎたい     •    FIREしたい     •    副業収入を増やしたい     •    会社に依存しない生活をしたい     •    老後資金に対する焦りがある  【悩み・課題・思い込み】     •    何の銘柄を買えばいいかわからない     •    高値掴み・塩漬け・早売りで負ける     •    再現性がなくギャンブル状態     •    テクニカルとファンダの使い分けがわからない     •    指標の見方・判断基準が不明確     •    SNSの情報に振り回される     •    勉強しても勝てない     •    個別株は難しい・危険という思い込み     •    センスが必要だと思っている     •    忙しくて分析できないと感じている     •    プロには勝てないと思っている     •    勝ってる人は胡散臭いと感じている     •    老後資金の不安     •    出遅れている焦り     •    このまま会社員でいいのか不安     •    投資で損する恐怖     •    インデックスだけでは自由になれない虚しさ     •    周りと比較して勝てない悔しさ  ⸻  ## What：どんなゴールに連れて行くか？  年利20%で安定運用しながら、月5万〜10万円の収益を作り、FIREに近づく     •    給与以外の収入による安心感     •    お金の不安からの解放     •    会社に依存しない選択肢     •    嫌な仕事を続けなくていい状態     •    資産が増え続ける実感     •    投資が「不安」から「武器」に変わる     •    家族との時間が増える     •    タイパ良く稼げる状態（売買は一瞬）     •    周りより一歩抜けた優位性  ⸻  ## How：どんなロードマップで連れて行くか？     投資の基礎と「負けない考え方」を理解テクニカル×ファンダのシンプル分析手法を習得\n,\n銘柄選定とエントリールールを確立\n,\n損切り・利確を含めた売買ルールを徹底\n,\n検証と改善で再現性を高め、資金を拡大\n,\n,\n ⸻  ## 発信の10要素     インデックス投資ではFIREが遅くなる現実テクニカル×ファンダの再現性特化手法の強み\n,\n初心者→年利20%までの具体ロードマップ\n,\n個別株で資産が加速した実体験\n,\n7000万円を作って得た生活・変化\n,\n日々の運用実績・トレード記録の公開\n,\n初心者が最初にやるべき行動の具体化\n,\n「個別株＝難しい」という思い込みの破壊\n,\n銘柄選定・売買の裏ワザや時短テク\n,\n実際の分析・売買プロセスのリアル発信\n,\n,\nアカウント名 ちみ太46歳 | 資産7000万（株5000万＋不動産2000万）  プロフ 限界モブリーマンだけど資産7000万の株クラ｜個別株＋インデックスで年利20%超え運用｜初心者に再現性ある投資を発信｜FIREを早める  固定ポスト  個別株で勝てない人へ  「個別株で損した…もうオルカンでいいや…」 と言う方、  まだ諦めるのは早くないですか？  実は株にセンスは要りません、最低限の基本を押さえて慌てず立ち回れば年率20%達成のチャンスは十分あります  現に、私のような本の一冊も読んだことなかったウルトラド素人でも、40歳から46歳で資産1200万7000万円を達成してます  そんな成功体験から得た ・生々しい投資経験 ・初心者向けのノウハウ ・現在進行形の資産推移 などを皆さんにシェア出来ればと思っております  是非フォローしておいて下さいね","sourceUrl":"","createdAt":"2026-04-16T12:28:39.969Z"},{"id":"scr-1779710258458-qdhrut","title":"[質問部屋] @Yusuke＠講師  お世話になります！  非常に初歩的な質問にはなるのですが...","category":"feedback","content":"@Yusuke＠講師  お世話になります！  非常に初歩的な質問にはなるのですが、こちらの質問部屋に関してはどこまで質問が可能かご教授いただきたいです  講義に関する質問までなのか、実際の投稿に対する仮説や分析に対してFBをいただくことも可能なのかなど、講師の方々にどこまでお聞きして良いかご教授いただけたらと思います！","sourceUrl":"","createdAt":"2026-04-16T12:30:59.893Z"},{"id":"scr-1779710258458-tmrjvv","title":"[質問部屋] @Yusuke＠講師  お世話になっております。  プロフィール再考しましたので...","category":"feedback","content":"@Yusuke＠講師  お世話になっております。  プロフィール再考しましたので 添削お願い致します。  ▼名前\n,\nぴーたー  ---  ▼プロフィール文\n,\n40代社畜リーマン、1児のパパ。 副業で何度も挫折し収益ゼロ。 AIでゼロからマネタイズ挑戦中。  ---  ▼固定ポスト\n,\n副業、何回もやっては途中でやめてきた。 ノウハウ買ってもダメで、1円も稼げてない。  正直、もう無理だと思ってた。 でもこれが最後だと思って、もう一回やってる。  まだ何もないゼロからスタート。 AI使って、3ヶ月で月5万いけるのか試してる。  うまくいっても失敗しても、そのまま全部出していきます。  ---","sourceUrl":"","createdAt":"2026-04-16T12:32:02.489Z"},{"id":"scr-1779710258459-mtoasq","title":"[質問部屋] 指摘ありがとうございます。 マネタイズに繋がらない具体的な理由は、 コンテンツの...","category":"feedback","content":"指摘ありがとうございます。 マネタイズに繋がらない具体的な理由は、 コンテンツの内容自体が売れる型になっていないということでしょうか？それとも、私からコンテンツを購入する理由がないということでしょうか？  以下に私の理学療法士としての経験の強みから話を『聞く』ことに特化させた解決手段へ変更した場合のコンセプト設計修正版を載せます。  修正①：Whoの読者現状を「恋愛全般に悩む男性」→「会話・LINEに詰まっている男性」に絞りました。 理由としては、「非モテ全般」を対象としていましたが、これでは男性発信者と同じ土俵になってしまうため、「マッチング後の会話・LINEに詰まっている」に絞ることで、PTの傾聴スキルが直接的な解決手段として機能すると考えました。  修正②：思い込みリストに「聞く力を知らない」を追加しました。 理由として、私の発信の核心である「聞く力」への気づきを、読者の悩みの構造に組み込ませようと考えました。「テクニックが通用しない→実は聞き方の問題だった」という気づきの導線が出来るのではと考えました。  競合のアカウントとの差別化が出来る強みは『聞く』に特化している点だと考えています。 長文になりましたが、添削のほどどうぞよろしくお願いいたします。    Who：誰に向けて発信するか？ 【読者の現状】 マッチングアプリでマッチングはできるが、そこから先の会話・LINEが続かずフェードアウトしてしまう23〜30代の男性。友達はいるが、女性との会話になると途端に空回りしてしまう層。 〖実績やレベル感〗 LINEが続かず既読スルーされる／マッチングしても会話が続かない／何を話せばいいかわからない状態 【悩み・課題・思い込み】     •マッチングしても会話が続かずフェードアウトする     •沈黙が怖くて無理に話して空回りする     •面白いことを言わなきゃとプレッシャーを感じている     •既読スルーされると「自分に魅力がない」と感じてしまう     •コミュ力は才能で、自分にはどうにもならないと思っている     •陰キャの自分がモテるのは無理だと感じている     •テクニックを試しても再現できず、自分には向いていないと諦めかけている     •「聞く力」こそが会話を変えると知らない   What：どんなゴールに連れて行くか？ 1ヶ月で既読スルーされないLINE術を習得し、6ヶ月で彼女を作る 【ゴールに到達した理想の状態】     •「また会いたい」と女性から言われるようになる     •会話に対する不安や恐怖がなくなる     •自分に自信がつく     •恋愛がうまくいくことで、仕事や人間関係にも好影響が出る   How：どんなロードマップで連れて行くか？     1.「話さなきゃ」という恐怖をなくす     2.「何を話すか」ではなく「どう聞くか」に切り替える     3.女性が自然に話し続けたくなる質問・リアクションを身につける     4.LINEで自然に関係性を深める     5.デート→関係発展   発信の10要素     •「話す力」より「聞く力」が女性との会話を変える理由     •一般的なモテテクが通用しない理由（元からモテる男向けで再現性がない）     •1000人以上と向き合ったPTが使う「聞き方の型」を恋愛に応用する方法     •「盛り上げる会話」が逆効果になる構造     •1ヶ月で既読スルーされなくなるLINEの全体像     •「また話したい」と思われる男の会話の特徴     •陰キャ・コミュ障でも再現できる会話フレームの解説     •初心者が最初にやるべき会話改善ステップ     •NG会話→改善のビフォーアフター解説（添削）     •実際に会話を改善していく過程・実践記録","sourceUrl":"","createdAt":"2026-04-16T14:06:03.166Z"},{"id":"scr-1779710258460-arvcil","title":"[質問部屋] ご回答ありがとうございます。再度発信コンセプトをブラッシュアップしました。 確認...","category":"feedback","content":"ご回答ありがとうございます。再度発信コンセプトをブラッシュアップしました。 確認いただけますでしょうか？  発信コンセプト    思想・信念  ■思想の核  会社の給料だけじゃ不安。 でも仕事のあとに、勉強みたいに長時間チャートを見るトレードは続かない。 だから自分は、1日10分でできて月30万を目指せるトレードをしている。  ⸻  ■信念  会社員が仕事しながら資産を増やすなら、長時間チャートを見るトレードは続かない\n,\n仕事で忙しいのに考えることが多いトレードはしんどい\n,\nSNSや人の意見を見すぎると、逆に迷う\n,\nチャートを見すぎると、感情的なトレードをして負けやすい\n,\nだから、見る時間は短い方がいい\n,\n考えることも少ない方がいい\n,\n仕事をしながら続けるなら、1日10分ほどでできる方がいい\n,\nAIは、調べる手間や振り返る手間を減らすために使う\n,\n ⸻  ■理想  給料以外に毎月の収入源を持てる人を増やす\n,\n将来のお金が不安な会社員に、現実的な選択肢を増やす\n,\n仕事を続けながらでも、お金を増やせる人を増やす\n,\n家族や生活を崩さずに、収入を増やせる人を増やす\n,\nいつか辞めたいと思っている会社員が、辞められる側に近づける状態を作る\n,\n ⸻  ■ストーリー（共感の核）  会社員で消耗 ↓ 先出しでも独学でも負ける ↓ 情報を見すぎて迷う ↓ 仕事のあとに長時間チャートを見るやり方もしんどかった ↓ だから、見る時間を短くして、考えることも減らした ↓ AIも使って、調べる手間や振り返る手間を減らした ↓ 続けやすくなって利益が残るようになった ↓ 脱サラして自由な生活へ  ⸻   なぜそのトレードなのか？  ■投資スタイルの意味付け  ① なぜ「1日10分」なのか？  仕事の合間やあとでも続けやすいから。 長いとしんどくて継続できないから ② なぜ「シンプル」なのか？  考えることが多いと、疲れてる人は続かないから。 複雑な投資法をやっても自分は勝てなかったから。シンプルな手法の方がむしろ勝てるようになったから。  ③ なぜ「売る・買うのルールを決める」のか？  その場の気分で入って失敗しにくくするため。 毎回悩むより、先に決めておいた方がラクだから。  ④ なぜ「AI」なのか？  調べる手間や振り返る手間を減らせるから。 忙しい会社員でも前に進みやすくなるから。  ⸻  ■まとめると  給料だけでは不安だけど、仕事のあとに長時間がんばるのは無理な会社員に向けた、1日10分で月30万を目指すトレード発信 ⸻  Who：誰に向けて発信するか？  【読者の現状】 給料だけでは将来不安で、投資に興味ある30代〜40代の会社員。 毎日仕事で疲れていて時間がなく、投資を調べても情報が多すぎて何から始めればいいかわからない人。  【悩み・課題】 給料だけだと将来が不安\n,\n何から始めればいいかわからない\n,\n調べるほど情報が多くて迷う\n,\nSNSで言ってることがバラバラで混乱する\n,\n仕事が忙しくて勉強する時間がない\n,\n長時間チャートを見るのは無理\n,\n難しいことが多そうで続けられる気がしない\n,\nスクールや発信者が怪しく見えて信用しづらい\n,\n給料以外の収入源がほしい\n,\n⸻   What：どんなゴールに連れて行くか？  6〜12ヶ月で、仕事をしながらでも1日10分で続けて、月30万円を狙えるようになる  【理想の状態】 給料以外に毎月30万円を狙える\n,\n毎月のお金の不安が減る\n,\n急な出費にもあわてにくくなる\n,\n家族にお金のことで我慢させにくくなる\n,\n仕事を続けながらでも収入を増やせる\n,\n給料以外にお金が入る安心感ができる\n,\n将来の選択肢が増える\n,\n脱サラが現実的な目標になる\n,\n⸻  How：どんな流れで連れて行くか？  1日10分チャートを見る習慣をつける\n,\n売買タイミング、損切りのやり方を覚える\n,\nAIで調べる手間や振り返る手間を減らす\n,\n月30万円を目指す\n,\n⸻  発信の10要素  なぜ副業の中でも、トレードが会社員に向いているのか\n,\nなぜ長時間見るやり方ではなく、1日10分のトレードを選んでいるのか\n,\n1日10分で月30万円を目指すまでの流れ\n,\n給料以外の収入ができると生活がどう変わるか\n,\n仕事をしながらでも収入を増やせる安心感\n,\n脱サラ後の生活や、自由に動ける今の暮らし\n,\nBTCトレード月30万、126万などの実績共有\n,\n初心者が最初に何をすればいいかを順番でわかりやすく伝える\n,\nAIを使って、調べる・学ぶ・振り返る手間を減らす方法\n,\n実際にどんな流れで見て、どう動いているかのリアル発信\n,\n⸻ (編集済)\n2026年4月17日金曜日 22:43","sourceUrl":"","createdAt":"2026-04-17T13:43:50.984Z"},{"id":"scr-1779710258460-okadpv","title":"[質問部屋] @Yusuke＠講師 さん  お世話になります。 初質問となります。  Lv.2...","category":"feedback","content":"@Yusuke＠講師 さん  お世話になります。 初質問となります。  Lv.2にあるアカウント設計に関するアドバイスをいただければ幸いです。（AI系発信の予定です。） ※以下、質問フォーマットに沿って記載いたします。  ❶質問のおおまかなテーマ アカウントのコンセプト設計のご確認、添削をいただきたいです。  ❷現在の状態、目指すゴール アカウント設計をまずは固められればと思っています。  ❸自分なりの意見や仮説 コンセプトに関しては、イメージがしやすいので自分と似たような立場の人（30代会社員、副業初心者、自動化に興味がある）ターゲットに想定して設計しました。 ただ、自動化に関しては、これだと手法が少し限られてしまう気がするのでAI副業といった広めのスタンスの方が良いのでは、とも思っています。  ❹質問内容 設計内容を掲載しますので、ご指摘があればいただきたいです。  -----  Who：誰に向けて発信するか？ 【読者の現状】  ラクに稼ぐことに興味がある20～30代会社員（男女）で、副業の実績やレベル感としては色々やったが0円〜1万円・情報収集止まり  【悩み・課題・思い込み】 何から始めればいいか分からない 情報が多すぎて行動できない AIで稼げるイメージはあるが具体性がない 少しやったが稼げず挫折している 継続できず三日坊主になりがち 本業が忙しく時間がない スキルがないと無理だと思っている 再現性のある方法が分からない   What：どんなゴールに連れて行くか？ 完全自動化で“ほぼ放置”月5万円を達成  【理想の状態】 毎月自由に使えるお金が増える 趣味・外食・旅行に気軽に使える 「あと5万円あれば…」のストレスから解放される 本業に依存しすぎない安心感が得られる お金の余裕＝心の余裕が生まれる   How：どんなロードマップで連れて行くか？ スキマ時間でできるAI副業モデルを選定 最小作業でSNS収益化の仕組みを構築 AIを使って投稿・作業を自動化 収益導線（アフィリ・販売）を設計 放置でも回る状態まで最適化  【発信の10要素】 他の副業に比べた「AI副業×自動化」の魅力 　→ スキル不要・時間不要・再現性高いことを強調 他のAI発信者と比べた「自分の手法」の魅力 　→ “完全放置×SNS自動化”に特化している点（完全放置SNSモデル） 月5万円までの超具体ロードマップ 　→ 30代会社員でもできる現実的ステップ AI副業を始めて得られたリアルな変化 　→ 忙しくても収入が増えた体験 放置で収益が発生する生活のリアル、裏側 　→ 「朝起きたら収益出てる」系の訴求 実績の積み上げ（小さくてもOK）、収益・自動化の進捗 　→ フォロワー・収益・自動化の進捗など 初心者が最初にやるべきこと、明確化 　→ 「まずこれだけやればOK」を明確化 AI副業のよくある誤解の否定 　→ 「難しい・怪しい・センス必要」などを崩す AI×SNSの裏ワザ・ラク技 　→ 自動投稿・テンプレ・時短テク 実際に自動化している様子の発信 　→ ツール画面・運用風景・裏側公開  -----  ■アカウント名 びのちゃん  ■プロフィール文 30代社畜サラリーマンの新人パパ。 日々進歩するAIに可能性を感じ、実績ゼロからマネタイズチャレンジ。  ■ヘッダー画像 今のところは無しにしようと考えています。  ■固定ポスト 【実績ゼロからAIで収益化に挑戦します】  正直、 これまで色々やってきたけど稼げませんでした。  ・情報ばかり増えて動けない ・時間がなくて続かない ・何が正解か分からない  でも、最近子どもが生まれたことをきっかけに、このままではダメだと覚悟を決め AIを使って月5万円を稼いで0→1を突破することにしました。  ✔ 初心者がどこでつまずくのか ✔ 実際にやって失敗したこと ✔ 月5万円までのリアルな過程  全部そのまま話していきます。  ■アイコン 画像添付いたします。  -----  お忙しい中恐縮ですが、ご確認よろしくお願いいたします。","sourceUrl":"","createdAt":"2026-04-18T17:07:35.808Z"},{"id":"scr-1779710258461-lepbwf","title":"[質問部屋] ご指摘ありがとうございます。 改めてプロフとアイコンをブラッシュアップしました、...","category":"feedback","content":"ご指摘ありがとうございます。 改めてプロフとアイコンをブラッシュアップしました、ご確認お願いできますでしょうか アイコンは２つ作りましたがどちらが良いでしょう…？   プロフ NISAだけではFIRE遠すぎ｜個別株とインデックスで年利20%超で運用中｜7000万円を作ったリアルを晒す｜高値掴みしたって塩漬けしたって負けないもん","sourceUrl":"","createdAt":"2026-04-18T17:08:30.107Z"},{"id":"scr-1779710258462-zixbni","title":"[質問部屋] @Yusuke＠講師  プロフィールの見直しに合わせて、発信コンセプトも見直しま...","category":"feedback","content":"@Yusuke＠講師  プロフィールの見直しに合わせて、発信コンセプトも見直しましたので、お手数ですが以下ご確認頂けますと幸いです。   Who：誰に向けて発信するか？ 【読者の現状】  本業以外の副収入を得たい20〜50代会社員で、残業が多い・家族持ち・将来に不安を感じている。実績やレベル感は副業未経験〜月1万円レベル。 【悩み・課題】 副業したいけど本業が忙しくて時間がない・行動できない 何から始めればいいか分からない スキルがないから稼げないと思ってる 副業は難しそうと思ってる 在宅で稼ぎたいと思っているが稼ぐ方法が分からない 副業しても月数万しか稼げないと思ってる 副業にトライしてみたが月1万円しか稼げなかった 家族がいるからリスク取れない 過去に副業で失敗している 情報が多すぎて選べない 会社を早期退職したいが、辞められる未来が見えない 将来が不安だけど何も変えられてない 会社に縛られる働き方をしたくない   What：どんなゴールに連れて行くか？ 半年で完全在宅・スキルなしで月10万円を達成 【ゴール後の理想】 残業しなくても生活に余裕ができる 家族に我慢させなくてよくなる 好きなことにお金を使える 貯金ができるようになる 毎月＋10万円の余裕がある生活 在宅で収入が作れる安心感がある 将来の不安がなくなる 家族との時間が増える 副業から独立が見える さらに収入を増やして早期退職を目指せる 老後の不安がなくなる リストラや転職でも困らない状態になる   How：どんなロードマップで連れて行くか？ 副業の選び方を知る 物販の基礎を学ぶ 小さく稼ぐ経験をする 在宅で回せる形にする・仕組み化する 月10万まで伸ばす 提供手段：  在宅物販 / 低リスク物販 / 初心者向け物販 / 時間がなくてもできる物販 / 仕組み化できる物販 / スキル不要の物販   発信の10要素 他の副業に比べた物販の魅力  （投資より低リスク、クライアントワークと違い資産性あり、ブログやYoutubeより短期間で0→1可能） 他の物販と比べた自分の物販の魅力  （在宅・低リスク・会社員向け・仕組み化） 月10万までのロードマップ解説  （副業選び → 基礎 → 小さく稼ぐ → 仕組み化 → 月10万） 物販を始めて得られた変化  （収入増・余裕・将来への不安減・早期退職が見える） 物販で得られる理想の生活  （収入増・家族時間・老後への安心感・リストラ対策・転職しても大丈夫） 実績積み上げ報告  （売上・利益・作業時間） 初心者が最初にやるべきこと  （副業の選び方・失敗しない始め方） 物販の誤解の否定  （怪しい・難しい・資金必要・時間ないと無理・自宅に保管必要・店舗回らないと無理） 裏ワザ・効率化・ラクする方法  （在宅・仕組み化・時短・自動化） 行動している様子  （作業・仕入れ・発送・利益・日常） (編集済)\n2026年4月19日日曜日 17:37","sourceUrl":"","createdAt":"2026-04-19T08:37:53.549Z"},{"id":"scr-1779710258462-vnlibw","title":"[質問部屋] @Yusuke＠講師  お世話になります！ 提携されてるAI系のスクールについて...","category":"feedback","content":"@Yusuke＠講師  お世話になります！ 提携されてるAI系のスクールについてですが、どういったものがございますでしょうか？ AI×SNS運用のスクールや、AI全般を学ぶスクール、AIによるマネタイズを習得するスクールなど複数あるかと思われますが、具体的にどういったスクールがあるのか可能でしたらご回答いただけたらと思います  また、この提携するスクールの細かい違いごとにアカウントを分けるのは効果的でしょうか？ 今後複数アカウントでの運用を検討しておりますが、AI系のジャンルで2アカ目を作ることができたらと考えておりますのでこちらもご回答いただけるとありがたいです","sourceUrl":"","createdAt":"2026-04-20T14:45:30.460Z"},{"id":"scr-1779710258463-zfktqr","title":"[質問部屋] ご確認ありがとうございます！ 固定ポストは無しで宣言ポストとして投稿しておきます...","category":"feedback","content":"ご確認ありがとうございます！ 固定ポストは無しで宣言ポストとして投稿しておきます！  また、コンセプトにあるターゲットを意識してプロフィール文を1行追加してみました。 よろしければこちらもご確認いただけると嬉しいです・・・！  ----- 30代社畜サラリーマンの新人パパ。 10年以上仕事を頑張っても一向に上がらない年収に絶望。 日々進歩するAIに可能性を感じ、実績ゼロからマネタイズチャレンジ","sourceUrl":"","createdAt":"2026-04-20T14:49:15.985Z"},{"id":"scr-1779710258464-ejsgcd","title":"[質問部屋] @Yusuke＠講師  はじめまして。 L2-5まで完了しましたので添削よろしく...","category":"feedback","content":"@Yusuke＠講師  はじめまして。 L2-5まで完了しましたので添削よろしくお願いします。   Who：誰に向けて発信するか？ 【読者の現状】  AI活用に興味がある20代後半〜40代の主婦・ママで、実績やレベル感は収益0円〜月1万円未満・副業挫折経験あり 【悩み・課題・思い込み】  ・子育てでまとまった作業時間が取れない  ・過去に副業で失敗して自信がない  ・詐欺や怪しい副業が怖い  ・スマホだけでできる副業を探している  ・1人だと継続できない  ・何から始めればいいかわからない   What：どんなゴールに連れて行くか？ 3ヶ月で月10万円を達成し、最終的に在宅で月50万円を安定して稼ぐ 【理想の状態・ベネフィット】  ・夫に収入面で頼らなくてよくなる（精神的自立）  ・子どもとの時間を優先しながら収入を得られる  ・子どもにやりたいことを我慢させない  ・家で完結する働き方ができる   How：どんなロードマップで連れて行くか？ 完全コピーテンプレで実践スタート スマホ×AIで作業を最小化（スキマ時間設計） 無理のない発信を習慣化 初収益（0→1）を達成 型化して月10万→50万へ拡張   発信の10要素 ・他の副業に比べた「AI×アフィリエイト」の魅力（在宅・低リスク・スマホ完結）  ・他の人と違う「ママでもできる×超シンプル設計」の強み  ・3ヶ月で月10万→月50万までの具体ロードマップ  ・AI副業を始めて得られた変化（時間・お金・心の余裕）  ・子ども優先でも収入が増えるリアルな生活  ・実績の積み上げ（小さな成果も含めた信頼構築）  ・初心者ママが最初にやるべき具体アクション  ・「AIは難しい」「副業は怪しい」という思い込みの否定  ・AIを使った時短テク・裏ワザ  ・スキマ時間で実践しているリアルな作業風景  プロフィール  名前：みるく　　5児ママのAIマネタイズ  プロフィール文 離婚半年で養育費ストップ。崖っぷち5児ママ。ノウハウ迷子半年で2万→AI使って逆転予定。スキルゼロ・スマホのみ・スキマ時間。どん底からの脱却ストーリー。","sourceUrl":"","createdAt":"2026-04-23T06:32:20.055Z"},{"id":"scr-1779710258464-xwuiuu","title":"[質問部屋] 回答ありがとうございます。 アイコン変更してプロフ作成しましたので再度添削いただ...","category":"feedback","content":"回答ありがとうございます。 アイコン変更してプロフ作成しましたので再度添削いただけると助かります。  実績づくりが一番の難所ですが、そこを突破しないと次に繋がらないので他の方のを参考にしつつタスク進めていきます！  よろしくお願いいたします。  https://x.com/miruk__2y","sourceUrl":"","createdAt":"2026-04-24T06:44:12.569Z"},{"id":"scr-1779710258465-yobqdd","title":"[質問部屋] 回答ありがとうございます アイコンに合わせて名前やプロフを修正してみたので、気に...","category":"feedback","content":"回答ありがとうございます アイコンに合わせて名前やプロフを修正してみたので、気になる点がないか念の為再度添削をしていただけると幸いです…！ よろしくお願いいたします。 https://x.com/tefumaru?s=21","sourceUrl":"","createdAt":"2026-04-24T06:44:34.397Z"},{"id":"scr-1779710258466-eemhpo","title":"[質問部屋] @Yusuke＠講師   初投稿です。よろしくお願いします。  発信コンセプトの...","category":"feedback","content":"@Yusuke＠講師   初投稿です。よろしくお願いします。  発信コンセプトの添削をお願いします。   Who：誰に向けて発信するか？ 【読者の現状】 AIでラクに稼ぐ方法に興味がある、 継続が苦手で何度も挫折している副業初心者に向けて発信する。 【読者の悩み・課題・思い込み】 楽して稼ぎたいけど、結局行動できない\n,\nAIを使えば簡単に稼げると思っている\n,\n自分は普通の人より継続力がなくて稼げないと思っている\n,\n即金性がないと続けられない\n,\n  What：どんなゴールに連れて行くか？ 【ゴール】 3ヶ月で、AIを使って“動けない状態”を抜け出し、収益化の土台を作る 表のコンセプトは“AIで行動できない自分を仕組み化すること”に再設計した。 【理想の状態】 「何も続かない人」から\n,\n「AIと仕組みで最低限は前に進める人」\n,\nさらに将来的には、収益化できる自分へ変わっていく\n,\n  How：どんなロードマップで連れて行くか？ 稼ぎ方を広げすぎず、1つに絞る\n,\nAIで投稿・作業・思考整理をテンプレ化する\n,\n毎日やることを固定し、迷いを消す\n,\nストーリー発信で信頼を積み上げる\n,\n収益導線につなげる\n,\n【提供手段】 AIを使った投稿作成の自動化テンプレート\n,\n継続できない人向けの「やること固定化」メソッド\n,\n  発信の核となる考え方  “継続できない人がAIで前に進めるようになる過程を見せる人” 【表で見せるテーマ】 AIで“行動できない自分”を動かす仕組み化 【裏の収益導線】 高額スクールアフィリエイト   発信の10要素（修正版） ADHDで継続できず、何度も止まってきた自分のリアル\n,\nAIを使って“動けない自分”を動かす工夫\n,\nフォロワー0からストーリー運用で前に進む記録\n,\n自動化して後回しを減らす方法\n,\nAIでSNSアウトプットをラクにするテンプレや使い方\n,\n行動できなかった日の失敗分析\n,\n小さく進めた成功体験の共有\n,\n副業初心者が最初につまずくポイントの言語化\n,\n「AIなら放置で稼げる」という誤解の修正\n,\nAIエージェントの使い方や最新事例を自分なりに紹介\n,\n  発信ポジションの定義 ダメだった自分の過去と変化した自分の方法を発信\n,\nAIで変わっていくニッチな稼ぎ方\n,\n収益化まで登っていくストーリー 完成者として教える発信ではなく、再起していく過程を価値化する発信。同じような立場の人の少し先を行く内容。 \n,\n  最終コンセプト一言まとめ 継続できないADHDの借金男が、AI自動化で“稼げる仕組み”を作り、フォロワー0から再起していくストーリーを発信する。  https://x.com/nobuta_oda","sourceUrl":"","createdAt":"2026-04-24T06:45:23.747Z"},{"id":"scr-1779710258466-uacczt","title":"[質問部屋] ありがとうございます！再度添削をお願いします！   Who：誰に向けて発信するか...","category":"feedback","content":"ありがとうございます！再度添削をお願いします！   Who：誰に向けて発信するか？ 【読者の現状】 AIでラクに稼ぐ方法に興味はあるが、行動が続かず何度も副業に挫折してきた初心者。AIを使えば変われるかもと思いつつ、何から始めればいいかわからず情報収集で止まっている人。  【悩み・課題】 楽して稼ぎたいが行動できない 副業を始めても三日坊主で止まる AIを使えば簡単に稼げると思っている でもAIをどう使えばいいかわからない 投稿内容が思いつかない やることが多いと面倒になる 継続力がないから稼げないと思っている 即金性がないと続かない 独学で何度も迷子になってきた 稼ぎ方を探し続けて中途半端になっている  What：どんなゴールに連れて行くか？ 【ゴール】 継続できない副業初心者が、AIでSNS発信と作業をラクにし、3ヶ月で収益化の土台を作る。最終的には、AIを使って動けない自分を動かし、SNS発信から収益化を目指せる状態になる。  【理想の状態】 何も続かなかった自分が少しずつ前に進める 毎日やることに迷わなくなる 投稿作成、思考整理、作業管理がラクになる 副業への苦手意識が薄れる 自己流で迷子になる状態から抜け出せる 自分の変化や学びを発信資産にできる フォロワー0から収益化導線を作れる 継続できないから無理という思い込みを壊せる 将来的にアフィリエイトや商品販売につながる土台ができる  How：どう連れて行くか？ 【提供手段】 AIを使って、継続できない人でもSNS発信と副業作業を前に進められるようにする。投稿作成、思考整理、作業管理、ストーリー発信、収益導線作りをAIでラクにする。  【ロードマップ】 稼ぎ方を広げずAI活用に絞る\n,\nAIで投稿作成、ネタ出し、思考整理をラクにする\n,\n毎日やることを明確にし、迷いを減らす\n,\n挫折、変化、実践過程をストーリー発信する\n,\n信頼を積み上げ、収益導線につなげる\n,\n 発信の核 継続できない人が、AIで動ける自分に変わっていく過程を見せる。完成者として教えるのではなく、何度も挫折した人間がAIを使って再起していく発信。すごい人ではなく、同じように続かなかった人が少し先で実践している姿を見せる。  表で見せるテーマ AIで行動できない自分を動かす。継続力に頼らず、AIを使って投稿、作業、思考整理をラクにし、副業初心者が収益化の土台を作る過程を発信する。  裏の収益導線 高額スクールアフィリエイト。発信内では、独学で挫折する理由、自己流で迷子になる原因、AIだけでは稼げない理由、正しいロードマップや環境の必要性を伝え、スクールで学ぶ価値へ自然につなげる。  発信ポジション 副業で何度も挫折した人が、AIを使って行動し、フォロワー0からX発信と収益化に挑戦する実践者ポジション。稼げる方法を教える人ではなく、稼げる自分に変わるまでの行動、失敗、改善を見せる人。  最終コンセプト 継続できないダメ人間が、AIを使ってフォロワー0から収益化を目指して再起していく発信。  発信の10要素 副業に挫折してきた自分のリアル\n,\nAIで動けない自分を動かす工夫\n,\nフォロワー0からのX実践記録\n,\n投稿作成やネタ出しをAIでラクにする方法\n,\nやることを明確にして迷いを減らす方法\n,\n行動できなかった日の失敗分析\n,\n小さな成功体験と変化の共有\n,\n初心者がつまずくポイントの言語化\n,\nAIなら放置で稼げるという誤解の修正\n,\n自己流で挫折しないための考え方\n,\n プロフィール文 また副業に挫折した。でも今回はAIに頼る 続かない自分を責めるのをやめて、投稿、作業、思考整理を仕組み化 フォロワー0から収益化を目指す再起の記録","sourceUrl":"","createdAt":"2026-04-26T04:02:30.598Z"},{"id":"scr-1779710258467-mcaqxe","title":"[質問部屋] @Yusuke＠講師   お忙しいところ失礼致します。 質問させていただきます。...","category":"feedback","content":"@Yusuke＠講師   お忙しいところ失礼致します。 質問させていただきます。  ①質問のおおまかなテーマ 発信コンセプトについてです。  ②現在の状態、目指すゴール AI副業について2週間ほど発信してきましたが、コンセプトがふわっとしているなと思い（発信に一貫性がない）、発信コンセプトを作り変えました。 作り変えた発信コンセプトで、運用3ヶ月で月100万円を目指したいと考えています。  ③自分なりの意見や仮説 発信コンセプトを以下のように設定いたしました。実績がないAIアフィでの挑戦をメインに発信しようと考えています。  発信コンセプト who：誰に向けて？ ・副業をやりたいと思っているが、本業や育児に追われて副業に避ける時間がない人 ・とにかく労力をかけずに稼ぎたい ・いきなり月100万円とかではなく、1日30分で月5万稼ぎたい。  what：どんなゴールに連れていくか？ AIを活用して、1日30分しか作業せずとも1ヶ月で月5万円稼げるようになる。  how：どう連れていくか？ AIを使ってスキマ時間で稼ぐ方法を知る AIを使ったSNS自動運用 収益化（アフィ・コンテンツ販売）の方法を知る 自動化ノウハウで複数アカを運用して収益拡大   ④質問内容 質問は3点です。 ・発信コンセプトの添削をお願いいたします。  ・アイコン及びプロフィールの確認をお願いいたします。  https://x.com/oth3451?s=21&t=kSYCWjlMqzwtVLcUVmItMw  ・元々、YouTubeでAIを活用して月30万円の利益を出したという実績があるのですが、AIアフィを全面に押し出す場合、YouTubeでの実績は発信する必要ないでしょうか？ またヘッダーをYouTube収益画面にしているのですが、変更した方がいいでしょうか？","sourceUrl":"","createdAt":"2026-04-26T04:05:14.075Z"},{"id":"scr-1779710258468-aydyqi","title":"[質問部屋] @Yusuke＠講師 さん はじめまして。 いつもお世話になっております、 初質...","category":"feedback","content":"@Yusuke＠講師 さん はじめまして。 いつもお世話になっております、 初質問させていただきます。  Lv2-5まで受講完了しましたので、 アカウント設計の添削をお願いします。  ①質問のおおまかなテーマ アカウントのコンセプト設計の添削。 発信ジャンルはAIの予定です。  ②現在の状態、目指すゴール アカウント設計して3ヶ月後に月200万円稼ぐための土台を作りたいです。  ③自分なりの意見や仮説 ターゲットは自分と同じような状態の人をイメージしています。 ・子育て世帯、忙しくて家族との時間がとれない、このままサラリーマンでいいのか•教育費などお金に対して漠然とした不安のある方 →AI副業で時間とお金を手に入れる  他の発信者との差別化として、以下を織り込んでおりますが、逆に読者の方からするととっつきにくくなるのではと迷っています。ご意見いただきたいです。 ・年収1000万 新卒年収350万から2回転職で達成、でもカツカツ、余裕ない ・CFP 入金力アップからの安定運用で自動化等発信テーマが増やせる   ④質問内容 設計コンセプトを以下記載します。 よろしくお願いいたします。   Who：誰に向けて発信するか？  【読者の現状】 副業全般やAI・X運用に興味がある20代後半〜40代の会社員（主に子育て世帯ターゲット）で、実績やレベル感は完全初心者〜未行動（収益0）  【悩み・課題】 ・副業したいけど何から始めればいいかわからない ・情報が多すぎて結局行動できない ・時間がなくて継続できるか不安 ・スキルがないから稼げないと思っている ・副業は大変そう・難しそうという思い込み ・すぐに結果が出ないとやめてしまう ・家族がいるのでリスクを取れない ・会社の給料だけでは将来が不安 ・フォロワーがいないと稼げないと思っている ・センスがないと無理だと思っている  ⸻   What：どんなゴールに連れて行くか？  6ヶ月で月30万円達成（本業超えライン）  【理想の状態】 ・毎月の支払い・生活費の不安から解放される ・家族との時間を増やせる ・収入源が増えて精神的に余裕が生まれる ・会社に依存しなくてもいい安心感を得られる ・将来への不安がなくなる  ⸻   How：どんなロードマップで連れて行くか？  何をやるか決定（迷い排除）\n,\n最短で初収益体験\n,\n小さく継続（月1〜5万）\n,\n勝ちパターン確立\n,\n月30万〜100万円までスケール\n,\n ⸻   発信の10要素  ・AI副業が他の副業より優れている理由（時間・再現性・低リスク） ・スキル不要でも稼げるAI活用法（初心者特化） ・「お金のプロがゼロから検証」しているリアルな過程 ・6ヶ月で月30万までの具体ロードマップ（実体験ベース） ・副業→収入UP→資産形成までの全体戦略（稼ぐ×守る） ・資産4000万・CFP視点での「稼いだ後にやるべきお金の使い方」 ・日々の検証ログ・収益・作業のリアル公開（信頼構築） ・完全初心者が最初にやるべき具体アクション ・「副業は難しい・センスが必要」という思い込みの破壊 ・AI×Xで効率化する裏ワザ・時短テクニック＋実践の裏側  ⸻  コンセプトの一言要約（発信軸）  「お金のプロがAI副業をゼロから検証し、6ヶ月で月30万→資産形成まで導く」  アカウント名 きりん  プロフィール文 年収1000万超でも子供2人で毎月カツカツ。鬼残業で家族時間ゼロ。ゆとりのある家族との時間を作るためにAI副業に挑戦中。  アイコン 添付します。","sourceUrl":"","createdAt":"2026-04-27T10:44:20.169Z"},{"id":"scr-1779710258468-svaisk","title":"[質問部屋] @Yusuke＠講師 さん ありがとうございます！ それでは、年収とCFPのとこ...","category":"feedback","content":"@Yusuke＠講師 さん ありがとうございます！ それでは、年収とCFPのところは削除のうえ、アカウント作成します。 その他は修正した方がよいところはありますでしょうか？ お忙しいところ申し訳ございませんがご確認の程よろしくお願いします。","sourceUrl":"","createdAt":"2026-04-30T05:21:26.178Z"},{"id":"scr-1779710258469-qcjyie","title":"[質問部屋] @Yusuke＠講師 お世話になっております。 アカウントコンセプトを作りました...","category":"feedback","content":"@Yusuke＠講師 お世話になっております。 アカウントコンセプトを作りましたので、お手隙の際に添削お願いいたします。  アカウント名 ユウキ｜AI×SNSで月30万を目指す  プロフィール文 満員電車に疲れた会社員が、AI×SNSショート動画で在宅ワークを目指す過程を発信  ▶︎ 使うツール：AI×SNS（TikTok・YouTubeショート） ▶︎ 運用ジャンル：転職 ▶︎ 目標：1日1時間の作業で月30万 → 通勤ゼロへ   Who：誰に向けて発信するか？ 【読者の現状】 20〜30代の会社員。通勤・人間関係・残業に疲れており、在宅で働くライフスタイルに憧れている。将来の金銭不安から「給料以外の収入の柱」を持ちたい。AIやSNS副業に関心があり、過去にいくつか挑戦したが、情報が多すぎて何を信じればいいか分からず、収益化まで到達できていない。   【悩み・課題】 ・物価高や年金問題で将来の金銭不安が大きく、給料1本では心もとない ・毎日の通勤と職場の人間関係で体力や精神が消耗している ・副業で稼ぎたいが、本業が忙しく時間が取れない。だからこそ時間がかからない仕組みが必要 ・AI副業に興味はあるが、ツールも情報源も多すぎて何から手をつければいいか分からない ・発信者の多くが「もう成功した人」で、今の自分との距離が遠すぎて参考にならない   What：どんなゴールに連れて行くか？ 副業で1日1時間以内の作業・月30万の収入を作る。通勤ゼロの選択肢を手に入れ、会社を辞める、副業1本にする、セミリタイアするなど、働き方を自分で選べる状態になる。  【ゴール後の理想】 AI×仕組み化で1日1時間以内の作業で月100万以上の収入を実現。満員電車から解放され、朝起きる時間も働く場所も自分で決められる生活を送る。お金と時間の両方に余裕がある状態。   How：どんなロードマップで連れて行くか？ 1.アフィリエイト単価の高いジャンル・案件選定 （自分は転職系にしようと思っています） 2.どのようなコンセプトのアカウントにするか決める 3.決めたコンセプトで、手動で10〜20本投稿し、型と勝ちパターンを掴む 4.見えてきたボトルネックをAIエージェントで仕組み化する 5.アフィリエイト案件を扱えるようにするためにASPに申請する 6.動画本数を増やしつつ、アフィリエイトリンクを貼ってマネタイズを図る    発信の10要素 1.プラットフォーム別の伸び方比較  2.目的別のAI使い分け どういう基準でAIツールを選ぶかという判断軸を発信  3.【ロードマップ】通勤ゼロ・月30万までの全体像  4.AI×SNSで得られた変化 収入だけでなく、時間・気持ち・ライフスタイルの変化もセットで出す。  5.月次・週次の進捗、実績報告  6.【情報源の選び方】信頼できる発信者の見分け方 具体名は出さず、判断軸を教える  7.【日常】会社員×副業のリアルな1日 実践風景、タスク、うまくいかなかったこと。通勤中にやっていること、帰宅後の作業など 同じ立場の会社員からの共感を得られそうなので  8.AI×SNSショート動画のメリット AIを有効活用して作業を効率化し、マルチプラットフォーム展開をすることで効率的にリーチを広げられるなど  9.【副業の注意点】AI×SNSショート動画のリスクと対策 アカウント凍結リスクや時間の使い方、期待値のズレなど  10.AI×SNSショート動画に向いてる人・向いてない人 AI×SNSショート動画のメリットとデメリットを紹介しながら","sourceUrl":"","createdAt":"2026-04-30T05:24:09.360Z"},{"id":"scr-1779710258470-urjqxz","title":"[質問部屋] @Yusuke＠講師  お世話になっております。 アカウントの作成ができたので添...","category":"feedback","content":"@Yusuke＠講師  お世話になっております。 アカウントの作成ができたので添削をお願いしたいです。  ❶質問のおおまかなテーマ コンセプトの確認について  ❷現在の状態、目指すゴール Lv.2まで完了 3ヶ月で200万達成(AIアフィ)  ❸自分なりの意見や仮説  Who：誰に向けて発信するか？ 【読者の現状】 会社員向け副業・時短 / 効率化に興味がある 20〜30代会社員（男女問わず） で、 副業未経験（収益0円）\n,\nAIツールは使えるが稼げていない\n,\n平日は1日30分〜1時間しか使えない\n,\n層  【悩み・課題】 仕事が忙しく副業に時間を使えない\n,\n平日は1日30分〜1時間しか取れない\n,\n何から始めればいいかわからない\n,\nAIを使ってもお金に変える方法がわからない\n,\n本業にバレずに安全に始めたい\n,\nAI副業は難しそうで一歩踏み出せない\n,\n怪しい情報商材に引っかかりたくない\n,\n再現性高く月1〜5万円を目指したい\n,\n  What：どんなゴールに連れていくか？ 【ゴール】 90日で、平日30分の副業で月1〜5万円を目指す  【理想の状態】 生活費に少し余裕ができる\n,\n副業経験が自信になる\n,\n将来の独立の選択肢を持てる\n,\nプチ贅沢ができる\n,\n普段の買い物で財布と相談しなくてよくなる\n,\n値段から見なくても買い物できる\n,\n  How：どんなロードマップで連れていくか？ 副業テーマと最初のゴールを決める\n,\nAIで作業時間を短縮する\n,\n小さくマネタイズ導線を作る\n,\n初収益1万円を目指す\n,\n仕組み化して月1〜5万円\n,\n  発信の10要素 忙しい会社員でも副業できる理由\n,\n平日30分でできるAI時短術\n,\n90日ロードマップ\n,\nAIで副業時間を半分にする方法\n,\n安全に始める副業の考え方\n,\n初収益までの実践ログ\n,\n最初の7日でやること\n,\n怪しい副業の見分け方\n,\nAI時短の裏ワザ\n,\n検証結果・失敗談\n,\n https://x.com/wakahage2000?s=21&t=xqMqLy-K4x_bFj2qdKtq5A  ◆これからの発信内容 実績がない場合、登りたいと見せる山が小さくなるイメージ。 私自身が実績ない状態のため、0→1を達成していく様子を発信。(ストーリー型運用)  ❹質問内容 1.アカウントの添削をお願いしたいです。 2.AIを使って0→1を達成できなかった場合、リストも取れず収益も発生しないという結果になることが不安です。 いまはここまで考えることはせず、まず自分で0→1を達成できるようにひたすら行動、合わせてXも運用していくという考えが正しいでしょうか？","sourceUrl":"","createdAt":"2026-04-30T05:28:23.733Z"},{"id":"scr-1779710258470-xqtavc","title":"[質問部屋] 確認ありがとうございました。  名前とプロフィールについて以下のように修正しまし...","category":"feedback","content":"確認ありがとうございました。  名前とプロフィールについて以下のように修正しましたが、問題ないでしょうか？  名前 ユウキ プロフィール  満員電車に疲れた平凡な会社員が、AI×SNSショート動画で月30万円を目指す過程を発信","sourceUrl":"","createdAt":"2026-04-30T14:13:08.348Z"},{"id":"scr-1779710258471-kcwhft","title":"[質問部屋] @Yusuke＠講師 さん  初めて質問させいただきます。 今後のアカウント運用...","category":"feedback","content":"@Yusuke＠講師 さん  初めて質問させいただきます。 今後のアカウント運用における「発信ジャンルの移行に伴う絡む相手の選定」と、「想定外に早く結果が出た場合のストーリー展開（見せ方）」の2点についてご教授いただきたく、ご相談させていただきました。  お手数をおかけしますが、以下フォーマットに沿ってまとめましたので、アドバイスをいただけますと幸いです。よろしくお願いいたします。  https://docs.google.com/document/d/12mpZw3k4ls2AC8Tvj7cjWF7xQMGSstKx5WlQIBPe6Qg/edit?usp=drivesdk","sourceUrl":"","createdAt":"2026-05-08T09:00:04.120Z"},{"id":"scr-1779710258472-ikcady","title":"[質問部屋] 質問への回答ありがとうございます！ とても参考になります！  追加で質問がありま...","category":"feedback","content":"質問への回答ありがとうございます！ とても参考になります！  追加で質問があります。  ❶ 質問のおおまかなテーマ 新コンセプト設計の添削依頼。  ❷ 現在の状態 以前の質問の通り投資ジャンルで発信していましたが、アドバイスいただいたとおりAI副業ジャンルに移行したいです。  目指すゴール AIジャンルや、副業ジャンルでの認知を取り、フォロワーを獲得する。後に高単価アフィに繋げたい。  ❸自分なりの意見や仮説  Who：誰に向けて発信するか？  【読者の現状】 AI副業・SNS運用・スキマ時間活用に興味がある、 「時間がないサラリーマンや主婦」で、実績やレベル感は副業未経験〜初心者層。  AIやSNSもほぼ未経験で、過去に副業で失敗した経験がある人。  【読者の悩み・課題】  副業したいけど時間がない\n,\nAIやSNSが難しそう\n,\n過去に副業で稼げなかった\n,\n初期費用をかけたくない\n,\n継続できる自信がない\n,\n自分にもできる副業を探している\n,\nスマホだけでできる方法が知りたい\n,\n⸻   What：どんなゴールに連れて行くか？  AI×Threads運用を活用して、 スマホだけ・スキマ時間で、 AIに投稿作成を任せながら月10万円以上の副収入を目指す。 (自動化の場合はPC必要ですが、手動であればスマホ完結できるので2種類の方法を発信できたらと思っています)  【理想の状態】  スキマ時間がお金を生む状態になる\n,\n時間とお金に余裕ができる\n,\n家族との時間が増える\n,\n子どもに我慢させなくて済む\n,\n本業以外の収入源を持てる\n,\n働き方を自分で選べるようになる\n,\nAIを活用して効率的に収益化できる\n,\n毎日長時間作業しなくても収益が積み上がる\n,\n ⸻   How：どんなロードマップで連れて行くか？  稼げるThreadsジャンルを選定する\n,\nAIで投稿ネタ・投稿文を量産する\n,\n伸びる投稿パターンを仕組み化する\n,\nThreadsに収益導線を構築する\n,\nAI活用で作業時間を減らしながら月10万円を安定化する\n,\n ⸻   発信の10要素  他の副業と比べた「AI×Threads副業」の魅力\n,\n時間がない人でもできる“スキマ時間副業”\n,\nスマホ完結・顔出し不要でできる理由\n,\nAIに投稿作成を任せる方法\n,\nThreads初心者でも伸ばせる運用法\n,\nAIで投稿ネタを自動生成する方法\n,\n「AIは難しい」という思い込みの否定\n,\n過去に副業で失敗した人でも再挑戦できる理由\n,\nAIを使って作業時間を減らす仕組み化\n,\n実績公開（今のやり取りが確定すれば5月で既に93,000円利益達成できます）とリアルな運用記録\n,\n ⸻   発信コンセプト（一言で表すなら）  メイン軸  副業初心者でも、 AIでThreads投稿を量産して収益化する方法  世界観  AIに働かせる\n,\nスキマ時間で運用\n,\nスマホ完結\n,\n半自動化\n,\n初心者向け\n,\n忙しくてもできる副業\n,\n ❹質問内容 1.このコンセプトで問題ないでしょうか？ 2.コンセプト変更に伴い、プロフィールは変更した方がいいでしょうか？ 3.2日で45000円出ましたが、スクショし忘れるという大失態をかましたので、1週間で65000円、もしくは10日で93000円という実績を擦っていきたいと思っています。インパクトとしてどちらが大きいでしょうか？  よろしくお願いいたします  https://x.com/torenpa?s=21&t=kt68mM72CYNOR_NBTgSauQ","sourceUrl":"","createdAt":"2026-05-09T15:51:21.605Z"},{"id":"scr-1779710258472-ehavlf","title":"[質問部屋] お世話になっております。AIのまやです。 投稿内容ではなくDM内容なのですが、質...","category":"feedback","content":"お世話になっております。AIのまやです。 投稿内容ではなくDM内容なのですが、質問させていただきます。  ❶質問のおおまかなテーマ ：DMでの個別質問について  ❷現在の状態、目指すゴール  現状フォロワー213名のAI×クライアントワークの発信をしている弱小垢です。 たまに交流している方から、添付画像のようなDMをいただきました。現状マネタイズはしておりません。 ゴールは何かに繋げるべきなのか、このまま普通に返信していいのかわからず悩んでおります。  ❸自分なりの意見や仮説  まだマネタイズフェーズに入っていないためこのままお話ししても良いかな？と思い最初は返信していたのですが、クライアントワーク初心者さんとお見受けするのでもしかしたら実績になるかも…？でもまだその段階に行ってないし…と混乱してしまいました。個人的には送客できれば嬉しいですが、Lv8のマネタイズ直前の部分までしか講座が進んでいないことから、このままお返事して繋げておくのが良いかなと思っています。  ❹質問内容  このDMに普通に私の体験談として返信していいのか、それとも他にもっと良い方法があるのかご教示いただけますと幸いです。  どうぞよろしくお願いいたします。","sourceUrl":"","createdAt":"2026-05-13T10:26:32.589Z"},{"id":"scr-1779710258473-inovcf","title":"[質問部屋] お世話になっております。 投資垢のジェイコブです。今のステータスをご指導下さい。...","category":"feedback","content":"お世話になっております。 投資垢のジェイコブです。今のステータスをご指導下さい。  ❶質問のおおまかなテーマ  　現在運用しているXアカウントのコンセプトとインプの増やし方についてです。 ❷現在の状態、目指すゴール  https://x.com/jacob_off_wor?s=21&t=4OZyJRyBwSq-aGX8_IQKhA 　現在、こちらの投資系アカウントを0から立ち上げて、１日5ポストほどを3週間ほど継続した結果が以下です。 ・フォロワー1,000人超 ・平均インプ1,000超え ・いいね数5〜10 コンセプトとしては、2点をターゲットとしています。 ①NISAをやっており、本業以外でNISA枠を埋められるよう短期トレードで月30万上げたい30代サラリーマン ②入金力UPとして隙間時間にできるデイトレ・スイング そして直近のゴールとしては、各ポストの興味付けをもっと強くし、1ヶ月後には安定して平均インプ2000まで伸ばせたらと思ってます。  ❸自分なりの意見や仮説  自分的には、プレイヤー感が出てないのかなと思っており、先週あたりから日々のデイトレを押し出していますが、ポスト単品で100インプくらいしか伸びません。 この伸びない理由としては、NISAはやっているがそこまで入金力をあげようという人に刺さっておらず、この短期トレードは資産を増幅させるものではなく溶かすもの、という印象が強いと考えているからです。 なので、自身のトレード結果を通して入金力は上げれれるという印象をつけたいと思っています。  ❹質問内容 最終的には投資系アフィで月50〜100万ほど稼ぎたいと思っていますが、足元インプを伸ばすのは③のような  お忙しい中大変恐縮ですが、ご指導のほどよろしくお願いします","sourceUrl":"","createdAt":"2026-05-13T10:37:04.984Z"},{"id":"scr-1779710258474-tkuurj","title":"[質問部屋] 買収できるならしたほうが良い、という回答になります！買収するアカウントのフォロワ...","category":"feedback","content":"買収できるならしたほうが良い、という回答になります！買収するアカウントのフォロワー人数は多いほうが良いですが、もちろん強いアカウントほど高くなりやすいので、そこは交渉次第というところですね。\nサイトで買うのはあまりおすすめしていなくて、基本的には講義付属資料の中にもあるようにDM営業するのがいいです！","sourceUrl":"","createdAt":"2026-05-13T10:41:08.211Z"},{"id":"scr-1779710258474-ownmno","title":"[質問部屋] @Yusuke＠講師   恐れ入ります！ こちら埋もれてしまったようですので、再...","category":"feedback","content":"@Yusuke＠講師   恐れ入ります！ こちら埋もれてしまったようですので、再度質問させていただきます よろしくお願いいたします  アドバイスを元に再度アカウント設計考えてみましたので、添削お願いいたします。  https://docs.google.com/document/d/12srQe8PngjeCeOq9lHlZXAwKaX0mPj8MYXB3Z5eo9sU/edit?usp=drivesdk","sourceUrl":"","createdAt":"2026-05-14T02:47:25.268Z"},{"id":"scr-1779710258475-akkqhx","title":"[質問部屋] @Yusuke＠講師  お疲れ様です。 初めての投稿になります。  コンセプト設...","category":"feedback","content":"@Yusuke＠講師  お疲れ様です。 初めての投稿になります。  コンセプト設計が完了致しましたので、ご確認お願い致します。   Who：誰に向けて発信するか？  【読者の現状】  AI副業・未経験からのマネタイズ・会社に依存しない働き方に興味がある 20〜40代の副業初心者、または過去に挫折した人。 残業続きの会社員や、本業収入だけでは厳しい人。  実績やレベル感は、  何から始めればいいかわからない\n,\nノウハウ迷子\n,\n無料情報だけ見て終わっている\n,\n という状態。  【読者の悩み・課題】  AI副業って結局何をすればいいかわからない\n,\n情報が多すぎて何を信じればいいかわからない\n,\n毎日忙しくて副業の時間が取れない\n,\n結局行動できずに情報収集だけで終わる\n,\n本当に初心者でもできるか不安\n,\nスキルがないと稼げないと思っている\n,\n毎日何時間も作業しないと無理だと思っている\n,\n ⸻   What：どんなゴールに連れて行くか？  副業初心者でもAI×X運用を活用して月100万円を目指せる。 忙しい会社員・残業続きでもスキマ時間でマネタイズでき、 将来的には脱サラも視野に入れられる収入源を作る。  【理想の状態】  家族に我慢させない生活ができる\n,\n旅行・外食・趣味にお金を使える\n,\n将来のお金の不安が減る\n,\n脱サラという選択肢を持てる\n,\nスキマ時間で収益が生まれる\n,\n毎日消耗する生活から抜け出せる\n,\n ⸻   How：どんなロードマップで連れて行くか？  スキマ時間を確保し、AI副業を始める決断をする\n,\nChatGPTなどのAIツールを実践しながら覚える\n,\nAIを活用してX発信を継続する\n,\n試行錯誤・小さな成功体験を積み上げて信頼構築\n,\nAI×X運用で商品販売・マネタイズを実現する\n,\n ⸻   発信の10要素  「副業初心者でもAIを使えば挑戦できる」という希望を伝える\n,\n他の副業よりも“スキマ時間で進めやすいAI副業”の魅力を発信する\n,\n初心者目線で「自分も0から始めているリアル」を共有する\n,\nAI×X運用で月100万円を目指すロードマップを見せる\n,\n忙しい会社員でも続けられる時短ノウハウを発信する\n,\nAIを使った投稿テンプレ・効率化術を公開する\n,\n実践記録・失敗談・改善プロセスをリアルタイム共有する\n,\n「スキルがないと稼げない」という思い込みを壊す\n,\n小さな成果・成長・実績を積み上げ形式で見せる\n,\n家族との時間・将来の安心・脱サラ可能性など理想の未来を発信する\n,\n 私自身初副業，AI初心者なのでありのままのマネタイズまでの経緯をストーリー型運用で試してみたいと思っております。  以上，よろしくお願い致します。  https://x.com/colt_ai?s=21&t=wu6vYdodp6k3akAkDstZxg (編集済)\n2026年5月15日金曜日 21:26","sourceUrl":"","createdAt":"2026-05-15T12:26:56.723Z"},{"id":"scr-1779710258476-jcrngq","title":"[質問部屋] 初めてになります。 アカウント作成が出来ましたので添削をお願いいたします。   ...","category":"feedback","content":"初めてになります。 アカウント作成が出来ましたので添削をお願いいたします。   Who：誰に向けて発信するか？ 【読者の現状】 AIアフィリエイトや在宅でできる副業に興味があり、子育てや本業と両立できる副業を探している人。 20〜50代の副業初心者で、特に30〜40代の子育て中の女性、本業収入に不安を感じている会社員、本業フリーランスをしながら収入を増やしたい人。副業経験ゼロ〜AIツールを少し触ったことがある程度で、まだ1円も稼げておらず、何から始めればいいかわからず、SNSの発信方法もわからない状態。 【読者の悩み・課題】 AI副業に興味はあるけど、何から始めればいいかわからない Xで発信してもフォロワーが増えない 商品を作りたいけど、何を売ればいいかわからない AIアフィリエイトのやり方がわからない 副業に使える時間が1日1〜2時間しかない 過去に副業で挫折した経験があり、また失敗しそうで不安 子育てや仕事で時間がないから無理だと思っている 実績がないと商品は売れないと思っている センスがある人だけが成功すると感じている  What：どんなゴールに連れて行くか？ 【ゴール】 スキルゼロ・実績ゼロでも、AIを活用して90日で月30万円の収入源を作る 【理想の状態】 子どもの教育費や習い事に、迷わずお金をかけられる 本業に依存しない「もう1つの収入源」ができる 会社やクライアントに振り回されない働き方ができる 将来のお金の不安が大きく減る 在宅で収入を得ながら、家族との時間を増やせる AIスキルが身につき、月30万円からさらに収入を伸ばせる  How：どんなロードマップで連れて行くか？ 【提供手段】 Claudeを使った文章作成とコンテンツ販売 AIアフィリエイトで収益化する方法 複数のAI副業を組み合わせた初心者向けロードマップ 【ロードマップ】 スキマ時間でClaudeを使えるようになる テンプレートを使って売れる商品や訴求文を作る Xで共感発信を始めて見込み客を集める コンテンツ販売とAIアフィリエイトの導線を構築する 在宅で月30万円を実現する  発信の10要素 他の副業と比べた「AI副業」の魅力 同業他社と比べた「あなたの手法」の魅力 AI副業で90日で月30万円を達成するロードマップ AI副業を始めて得られた変化 AI副業で実現できる理想の生活 実績の積み上げ報告 初心者が最初にやるべきこと AI副業についてのよくある誤解の否定 AI副業の裏ワザ・時短術 AI副業を実践している様子  https://x.com/sono_saki_0927  どうぞよろしくお願いいたします。","sourceUrl":"","createdAt":"2026-05-16T12:17:46.568Z"},{"id":"scr-1779710258476-sbvlvo","title":"[質問部屋] @Yusuke＠講師  質問よろしいでしょうか。 プレイヤーとして発信していたら...","category":"feedback","content":"@Yusuke＠講師  質問よろしいでしょうか。 プレイヤーとして発信していたら、「やり方教えてください」みたいなリプやDMがポツポツきました。 そういった方には、収益化基準を達してなくてもLINEなど次の導線に誘導してよいでしょうか？  講座が提携している商材ではなく、当方で用意している商材になります。  今後のアカウントの伸びにも関係するかなと思い、ご質問しました。","sourceUrl":"","createdAt":"2026-05-17T06:58:20.971Z"},{"id":"scr-1779710258477-oykuhu","title":"[質問部屋] 初めて投稿させていただきます。  現在Lv 2-4のコンセプト決めの動画を観させ...","category":"feedback","content":"初めて投稿させていただきます。  現在Lv 2-4のコンセプト決めの動画を観させていただきました。 現在、裏垢を運用しているので、コンセプトは裏垢マネタイズに決めたのですが、ここで質問があります。  現在の僕の裏垢はオフで裏垢女子に会う感じで運用していており、フォロワーは約8000人います。 今後は裏垢アフィリに繋げていこうかと思っているのですが、今後、裏垢アフィリに繋ぐには、いままで通りオフ会で会うようなポスト作成で行けば良いのか、それとも裏垢で稼げるポストにすれば良いのかがわかりません。  この場合、提携先のスクール？の方針によってポストを変えなくてはいけないかと思っています。  ご迷惑をお掛けしますが、どちらのポスト作成にして行けば良いかをご指導くださると助かります。 ご迷惑をお掛けしますがよろしくお願いします。","sourceUrl":"","createdAt":"2026-05-17T07:01:05.347Z"},{"id":"scr-1779710258478-lwuhpw","title":"[質問部屋] @Yusuke＠講師  質問よろしいでしょうか。 DM上でLINEのURLを貼る...","category":"feedback","content":"@Yusuke＠講師  質問よろしいでしょうか。 DM上でLINEのURLを貼るのはあまり避けたほうがよろしいでしょうか？  アルゴリズムに抵触しないように、ユーザを次のリストに追加させたいです。","sourceUrl":"","createdAt":"2026-05-18T13:40:38.543Z"},{"id":"scr-1779710258478-qcbqnw","title":"[質問部屋] 分かりました！ その場合、固定ポストかプロフにURL置いといて、そこに誘導するイ...","category":"feedback","content":"分かりました！ その場合、固定ポストかプロフにURL置いといて、そこに誘導するイメージでしょうか？  固定ポストかプロフのどちらが良さそうかもあれば、お伺いしたいです。 お忙しいところすみません","sourceUrl":"","createdAt":"2026-05-19T06:53:25.093Z"},{"id":"scr-1779710258479-owwmya","title":"[質問部屋] マネタイズフェーズには入っていないです。 しかし、複数ユーザーから「やり方教えて...","category":"feedback","content":"マネタイズフェーズには入っていないです。 しかし、複数ユーザーから「やり方教えてください！」と言われている状態です。 この場合、次の公式LINEのURLは送らず「いつか公開するかもです！」みたいに、あえて逃すということでしょうか？  自商材を売る予定なので、次の導線に誘導できる状態ではあります。 逃すのはもったいないかなと思い、リプか固定ポストかDMかで、 LINEを案内した方が良いのではと考えていました。 (編集済)\n2026年5月19日火曜日 19:50","sourceUrl":"","createdAt":"2026-05-19T10:50:59.510Z"},{"id":"scr-1779710258480-rgqqqr","title":"[物販] 【ご報告】 本日初ローンチを迎えて、結果として販売開始1時間で150部ほど売れま...","category":"instructor","content":"【ご報告】 本日初ローンチを迎えて、結果として販売開始1時間で150部ほど売れました 講師のYusukeさん含め、スクール生の皆さんの拡散による応援があったからこそ、届いた数字だと思います  これらがなかったら、多分半分もいってなかったような気がします   本当にありがとうございました！！  もし皆さんが何かローンチをする際は、僕も全力で協力させていただきますので、ぜひ恩返しさせてください！","sourceUrl":"","createdAt":"2025-11-08T06:19:05.959Z"},{"id":"scr-1779710258480-kbscfp","title":"[ai] @everyone 有益情報用スレッド作成しました。今後情報共有はこちらに揃える...","category":"instructor","content":"@everyone 有益情報用スレッド作成しました。今後情報共有はこちらに揃えるのいかがでしょうか？また、流れるのゆっくりにするためにお礼とかはスタンプのみ、メッセージは本スレッドのみにしたいです。 ⁠不明","sourceUrl":"","createdAt":"2025-11-11T11:54:55.230Z"},{"id":"scr-1779710258482-vnvsye","title":"[投資] 全体告知でも出したんですが、新しく投資ジャンルで垢運用始めました！\n投資ジャンル...","category":"instructor","content":"全体告知でも出したんですが、新しく投資ジャンルで垢運用始めました！\n投資ジャンルの皆さんに全然何も言って無くてすみませんｗ すでに少し絡んでもらった方もいましたね！\n講師だからといってx上で無理に優先的に絡んだりしなくても全然大丈夫です！僕も時間無くてリプ周りとかほぼできないと思うので、普通にx上の1アカウントとして接していただければと！ (編集済)\n2026年1月28日水曜日 0:34","sourceUrl":"","createdAt":"2026-01-27T15:30:00.877Z"},{"id":"scr-1779710258484-yquoiz","title":"[投資] リソースの問題でとぐろアカ動かせてないんですが、僕が復活したら確実にAI使って投...","category":"instructor","content":"リソースの問題でとぐろアカ動かせてないんですが、僕が復活したら確実にAI使って投資攻略していくストーリー作っていきますね！今ガチでチャンスですよ\n\nAIエージェント使って自動で銘柄選定させたり、ニュース収集させてアツい銘柄毎日通知させたり、トレードの売買タイミング判断させたりなど、色々面白いことできそうかなと\n\n長期投資の人も短期の人も、AI使って投資攻略していくってのは今鉄板で伸びると思うのでやったもん勝ちですね！ (編集済)\n2026年3月21日土曜日 2:34","sourceUrl":"","createdAt":"2026-03-20T17:34:00.365Z"},{"id":"scr-1779710258485-jzqtaw","title":"[投資] @everyone \nこちらちょっと僕の認識不足だったのですが、スクール内ルール...","category":"instructor","content":"@everyone \nこちらちょっと僕の認識不足だったのですが、スクール内ルールとして、スクール生がオフ会を企画して開催するのはNGでした\n\n今まで超小規模で勝手にスクール生同士が仲良くなって会う、などはありましたが、黙認のような形（というか個人間でのやり取りのためスクール側も感知できない）でした。\n\nポスト添削会の際にそちら伝えられずすみません！","sourceUrl":"","createdAt":"2026-04-16T13:38:21.469Z"},{"id":"scr-1779710258486-oypamw","title":"[恋愛] 今回の件が今後の発信においてプラスに働かないのは重々理解できますし、運営としても...","category":"instructor","content":"今回の件が今後の発信においてプラスに働かないのは重々理解できますし、運営としても当然再発防止にも努めますが\n\nじゅんさんにも悪気があったわけではないと思うので、これ以上の追い討ちとかは辞めてあげましょう！\n\n一旦は落ち着いたと思うので、ポジティブな話題展開していきたいですね！","sourceUrl":"","createdAt":"2025-11-18T18:25:06.252Z"}];
