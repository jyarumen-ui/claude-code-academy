MD3PqkfSUBcJQ","sourceUrl":"","createdAt":"2026-02-23T08:34:11.463Z"},{"id":"scr-1779710258132-xfaiij","title":"[全体連絡] @everyone \n運営のユウスケです！\nなまいきくんが忙しすぎて全く手を離せ...","category":"instructor","content":"@everyone \n運営のユウスケです！\nなまいきくんが忙しすぎて全く手を離せない状態なので、代わりにアナウンスさせていただきます！\n\nこれから、スクール生の皆でなまいきチームとして一丸となり、最短最速で大きな収益を上げられるようにXを攻略していきます！\n\nその上で、LINEやdiscord、Xアカウントにおいて誰がどの方かなまいきくんの方で1人1人把握しておきたいため、なまいきくんのXアカウント(＠1namaiki)にDMで以下の情報を送っていただけますでしょうか！↓\n\n・discord参加名\n・LINE名\n・お名前\n・スクールプラン\n\nDMの方が完了しましたら、このメッセージにお好きなスタンプを押しておいていただくようお願いいたします！","sourceUrl":"","createdAt":"2025-08-05T14:43:06.531Z"},{"id":"scr-1779710258132-owikwf","title":"[全体連絡] 田中のアカウント公開と、実際に買収してアカウント開始したところから、月870万円...","category":"instructor","content":"田中のアカウント公開と、実際に買収してアカウント開始したところから、月870万円売り上げるまでに至った全ポストをスクール生限定で公開しようとは思ってるのですが、\n\nそれに加えて、僕も皆さんと同じく0から新アカウント始めて売り上げや裏側の数字をリアルタイムで全公開していけば、初期運用のイメージだいぶつきやすいかなーと思ったりするんですがいかがですか？\n\nかなり労力かかるので、正直なところちょいグダってはいるのですが、反応多そうやったら頑張りますww\n\nちょっとスタンプ待ってますね！","sourceUrl":"","createdAt":"2025-08-11T03:16:24.666Z"},{"id":"scr-1779710258133-ridrgd","title":"[全体連絡] なまいきくんのサブ垢であるしめじ(@jimichaS7)ではスクール生全員フォロ...","category":"instructor","content":"なまいきくんのサブ垢であるしめじ(@jimichaS7)ではスクール生全員フォロバするので、しめじのDMまでスクール生である旨連絡お願いします！\n\nこちらで普段の投稿見ておくのは勿論、いいねも送っておきますね！","sourceUrl":"","createdAt":"2025-08-14T08:07:42.745Z"},{"id":"scr-1779710258133-stdndo","title":"[全体連絡] 明日8/15(金)の21時から、初回の全体キックオフミーティングをzoomにて開...","category":"instructor","content":"明日8/15(金)の21時から、初回の全体キックオフミーティングをzoomにて開催します！\n\nこのzoomではせっかく200名を超える数多くの仲間が集まってることだし、\n\n僕が一方的に話すだけでなく、スクール生同士の絡みを作る機会にもしたいなと思ってるので、なるべくリアルタイム参加お願いします！\n\nオンライン上ですが、僕も明日皆さんとお会い出来ることを楽しみにしています！\n\np.s.リアルタイムで参加するよ！って人はスタンプ","sourceUrl":"","createdAt":"2025-08-14T11:05:17.307Z"},{"id":"scr-1779710258134-hzzuir","title":"[全体連絡] @everyone \nお待たせいたしました！\n本日21:00〜のキックオフミーテ...","category":"instructor","content":"@everyone \nお待たせいたしました！\n本日21:00〜のキックオフミーティングは以下のzoomリンクからご参加ください！\n↓↓↓\nhttps://us06web.zoom.us/j/88645764483?pwd=ZpQvTFrtHczh9yNc1SWS7vgHw82E34.1","sourceUrl":"","createdAt":"2025-08-15T11:49:26.272Z"},{"id":"scr-1779710258135-oushyp","title":"[全体連絡] キックオフミーティングお疲れ様でした！\n\n皆熱量高すぎてビビりましたねwwこのメ...","category":"instructor","content":"キックオフミーティングお疲れ様でした！\n\n皆熱量高すぎてビビりましたねwwこのメンバーなら本気で日本一のX運用集団狙えるなと確信しました。\n\n初回のこの気持ちを忘れず、1年間全員でやり抜きたいですね！\n\n僕も全力でサポートするので、これから一緒に頑張っていきましょう\n\np.s.夜も遅いので今回のアーカイブや、キックオフミーティングで皆の意見を元に決まった今後の細かい進め方については、また明日連絡します！","sourceUrl":"","createdAt":"2025-08-15T14:57:00.869Z"},{"id":"scr-1779710258135-gqzprs","title":"[全体連絡] おはようございます！\n\n昨日のキックオフミーティングでは、興奮しすぎて眠れない！...","category":"instructor","content":"おはようございます！\n\n昨日のキックオフミーティングでは、興奮しすぎて眠れない！って声が沢山届いてましたが、眠れましたでしょうか？w\n\n僕は寝不足で早く寝たいとか言ってましたが、あの後、家にチームなまいきメンバー(事業一緒にやってるメンバー)が2人来て、朝までわちゃわちゃ語り尽くしてたので、結局寝たのは6時くらいになりましたw\n\n気分で寝る時間も起きる時間もコントロール出来るのがXマネタイズならではの良さですよね。\n\nこれサラリーマンで7時から出社とかなってたら、俺普通に死んでたなと、、\n\nなにはともあれ、皆の熱量が高い状態でキックオフできてよかったです。\n\n参加してない人は現状置いてけぼり感を感じちってるかもしれませんが、アーカイブも近々公開するので、そちらお待ちくださいね！\n\nそして、これは後で文面にて連絡するかもですが、急遽昨日のキックオフで皆の勢いに負けて、早速1期生限定でスクール内容のアップグレードをしちゃいましたww\n\n労働したくない教のなまいきくんからすると、さらに追い込む形にはなってますが、まあ頑張りますww\n\n僕もチームメンバーのために、出来ることは何でもやっていくので、これから最強のチームを皆で作っていきましょう\n\n続報は随時discordにて行うので、お待ちください！","sourceUrl":"","createdAt":"2025-08-16T02:56:32.176Z"},{"id":"scr-1779710258136-zplfmt","title":"[全体連絡] 【初回講義について】\n\n昨日のキックオフミーティングに参加された方にはお伝えして...","category":"instructor","content":"【初回講義について】\n\n昨日のキックオフミーティングに参加された方にはお伝えしてますが、今後は以上のようなカリキュラムで進めていきます。(キックオフの動画は軽く編集後アップします)\n\nもう完全ゼロからでもこの手順通りやれば、3.4ヶ月目あたりで、月100万円の売上は達成出来る、\n\nそう言い切れるくらいの24週間のカリキュラムになってます。\n\nそして、本来であれば1週ごとに動画講義を配信していこうと予定してたのですが、\n\n昨日のキックオフミーティングでの皆からの希望により、1期生限定でリアルタイム講義を行うことになりました。\n\nただ動画を撮って勝手に見てね！というスタイルよりも、\n\n皆で一緒に授業を受けることでモチベも維持しやすいですし、\n\nその場で質問も出来て、疑問点を限りなく潰せる神仕様です(なまいきくんの労力はヤバいけどw)\n\nということで、この1週目の授業なんですが、\n\n「8/23の21:00」よりzoomにて行います。\n\n1回目ということもあり、僕の講義はもちろん、軽くチームなまいきメンバー同士の交流も作ろうかなと。\n\nこちらアーカイブは残しますが、是非今のうちにカレンダーに予約を入れ、リアルタイム参加してください。\n\n僕も皆とまた会えるのを楽しみにしてます","sourceUrl":"","createdAt":"2025-08-16T10:12:06.826Z"},{"id":"scr-1779710258137-ostgla","title":"[全体連絡] 【キックオフを終えて、皆のXを見てみて思ったこと】\n\n皆今動き出したい！何かした...","category":"instructor","content":"【キックオフを終えて、皆のXを見てみて思ったこと】\n\n皆今動き出したい！何かしたい！という気持ちは分かるのですが、キックオフでも言った通り焦らないことですね！\n\n今日Xの方でちょっと暴れちゃってる人とか結構見かけましたが、プラスになることしてるつもりが、\n\n実はただただアカウントにとってもチームなまいきにとってもマイナスな行為だった、、ということにもなりかねません。\n\n基本やるべきことはこちらから提示するので、それまでは焦らずいきたいですね！\n\nそれこそ現段階で、X上で絡み合うみたいなのもあまり意味はないです！\n\nというか身内ノリ感が強まるので、傍から見た時にキショいなという感想を抱かれ、新規集客をしていくという観点ではマイナスにもなり得ます。\n\nただ、皆と交流したい気持ちも分かるので、その場合は今は一旦discordで絡むか、リアルタイム講義のチャット欄で絡むかって感じですね！\n\nまた、オフ会とかだったりも用意しようと思ってるので、今は焦らず落ち着いて、1講目の講義や、講師との面談に備えて貰えればなと！","sourceUrl":"","createdAt":"2025-08-16T10:42:47.152Z"},{"id":"scr-1779710258137-pemrwu","title":"[全体連絡] 【初回授業について】\n\n23日21時より初回の授業をzoomにて行います！\n\n内...","category":"instructor","content":"【初回授業について】\n\n23日21時より初回の授業をzoomにて行います！\n\n内容としては、\n・はじめに「アカウント作成」\n・X運用の全体像\n・発信テーマの決め方\n・発信コンセプトを決める\n・プロフィール設計を学ぶ\n\nこちらになります！\n\n僕なまいきくんがリアルタイムで講義を行い、\n\nさらにその場で質問にも答えます。\n\nリアルで参加してる人のプロフを取り上げて公開添削なんかもやっちゃおうかなと。\n\nついに初回が始まります！ここで初速が決まってくるので必ず参加してください","sourceUrl":"","createdAt":"2025-08-19T05:09:49.525Z"},{"id":"scr-1779710258138-zlhwfn","title":"[全体連絡] @everyone  運営のユウスケです！ なまいきくんが忙しすぎて全く手を離せ...","category":"instructor","content":"@everyone  運営のユウスケです！ なまいきくんが忙しすぎて全く手を離せない状態なので、代わりにアナウンスさせていただきます！  これから、スクール生の皆でなまいきチームとして一丸となり、最短最速で大きな収益を上げられるようにXを攻略していきます！  その上で、LINEやdiscord、Xアカウントにおいて誰がどの方かなまいきくんの方で1人1人把握しておきたいため、なまいきくんのXアカウント(＠1namaiki)にDMで以下の情報を送っていただけますでしょうか！↓  ・discord参加名 ・LINE名 ・お名前 ・スクールプラン  DMの方が完了しましたら、このメッセージにお好きなスタンプを押しておいていただくようお願いいたします！","sourceUrl":"","createdAt":"2025-08-22T11:44:57.781Z"},{"id":"scr-1779710258139-fdavvz","title":"[全体連絡] @everyone \n初回授業開始します！\n以下のリンクからご参加ください！\n\n...","category":"instructor","content":"@everyone \n初回授業開始します！\n以下のリンクからご参加ください！\n\nhttps://us06web.zoom.us/j/88474120354?pwd=fxKbEsgKC3GVXzbCG7pMghzOW8bKmT.1","sourceUrl":"","createdAt":"2025-08-23T11:49:47.393Z"},{"id":"scr-1779710258139-hscdhl","title":"[全体連絡] 初回講義お疲れ様でした！\n\n取り急ぎ復習や今週のタスクこなしやすいように講義スラ...","category":"instructor","content":"初回講義お疲れ様でした！\n\n取り急ぎ復習や今週のタスクこなしやすいように講義スライドと、GPTs含む資料の配布だけ行いますのでご確認ください！\n\n【講義スライド】\n\n２−１売れるアカウントの初期設計〜はじめに〜\nhttps://app.irusiru.jp/slide/3f17dc86-7a5f-44c8-924f-3bc13f8d932a?share=true\n\n２−２Xマネタイズの全体像\nhttps://app.irusiru.jp/slide/5732e81f-d450-4a90-9da0-e5002764a08f?share=true\n\n２−３発信テーマの決め方\nhttps://app.irusiru.jp/slide/fa1ecb58-bf7c-4c67-9789-82b9094c49f8?share=true\n\n２−４発信コンセプトを決める\nhttps://app.irusiru.jp/slide/0c0f5366-e952-407f-9d97-02e474f52b99?share=true\n\n２−５プロフィール設計を学ぶ\nhttps://app.irusiru.jp/slide/9b56ef23-181a-46a2-86dd-7e8cc599f1f4?share=true\n\n\n【講義関連資料】\n\n高単価案件ジャンル一覧\nhttps://www.notion.so/22d01baee597809d9bc5c2b19f68840c?source=copy_link\n\n発信コンセプト設計AI\nhttps://chatgpt.com/g/g-68a7f827fda08191adcd2bfc968a81d3-fa-xin-konsehuto-she-ji-ai\n\n発信コンセプト設計AIの使い方\nhttps://www.notion.so/AI-23801baee5978062b260e52b9ceff487?source=copy_link\n\nX発信アカウント一覧【ジャンル別】\nhttps://www.notion.so/X-22c01baee5978023b6b3eabee1f953a9?source=copy_link\n\nプロフィール作成 GPTs\nhttps://chatgpt.com/g/g-68a7f97152b481919c7cc7d347a05171-hurohuiruzuo-cheng-gpts\n\nXプロフィール設定マニュアル\nhttps://www.notion.so/X-22501baee5978044932aed236feefe58?source=copy_link\n\n【今週のタスク】\nhttps://www.notion.so/02-22a01baee5978065a580d34fec57e866?source=copy_link (編集済)\n2025年8月24日日曜日 2:44","sourceUrl":"","createdAt":"2025-08-23T17:39:14.350Z"},{"id":"scr-1779710258140-nisrmd","title":"[全体連絡] @everyone \n\n昨日のタスク早速取り掛かってますか？\n\nキックオフでも言...","category":"instructor","content":"@everyone \n\n昨日のタスク早速取り掛かってますか？\n\nキックオフでも言った通り、結局1番大事なのは実践なので、\n\nこのなまいきスクールでは限りなく実践しやすくなるよう、マニュアルの提供や、GPTsの配布を行っていきます。\n\n実際、昨日のコンセプト設計GPTsを使えば、以下のような今後の発信の指針が即作れます。\n\n1回ここでコンセプト固めちゃえば、今後の発信で迷うことも限りなく少なくなるので必ず本日中に取り掛かってくださいね！\n\n発信コンセプト設計まとめ(実際にスクール生が15分でつくったもの)\n\n Who：誰に向けて発信するか？ 裏垢ビジネスに興味がある30代男性会社員で、年収400万前後で収入に不安がある層。 実績やレベル感はビジネス経験ゼロ〜SNSで遊び程度の発信経験あり、情報収集だけしてまだ行動できていない状態。\n【読者の悩み・課題】\n\n裏垢ビジネスは危ない／怪しいという先入観がある\n,\n何を発信すればいいのか分からない\n,\n本当に稼げるのかわからない\n,\n難しいマーケティング知識が必要そう\n,\n初期費用や広告費がかかると思っている\n,\n本当に簡単にビジネスできるのか不安（実は大変なんじゃないかと）\n,\n\n What：どんなゴールに連れて行くか？ 半年で月20万円を安定的に稼ぐ\n【理想の状態】\n\n会社の給料＋20万円で生活が一気に楽になる\n,\n旅行や趣味にお金を使えるようになる\n,\n貯金や投資にまわせる余裕ができる\n,\n生活費の不安がなくなり、精神的に余裕が持てる\n,\n「副業で稼げた」という自信がつき、次のステップにも挑戦できる\n,\n残業や休日出勤に縛られずに、自分の時間を楽しめる\n,\n\n How：どんなロードマップで連れて行くか？\n\n裏垢ビジネスの基礎を理解（安全性・仕組み）\n,\n最初の発信テーマ＆コンセプト作り\n,\n1日15分でできる発信ルーティンを習得\n,\n月1〜5万円を達成し「稼げる感覚」を掴む\n,\n半年で月20万円を安定化\n,\n\n 発信の10要素\n\n他の副業に比べた「裏垢ビジネス」の魅力（顔出し不要、在宅スマホで可能、会社にバレない、収益性⭕️）\n,\n他の裏垢運用と比べた「あなたの手法」の魅力（初心者向け・安全性・再現性⭕️）\n,\n6ヶ月で月20万円までのロードマップ解説\n,\n裏垢ビジネスを始めて得られた変化（お金・自由・副業への自信）\n,\n月20万円の副収入で実現した理想の生活（趣味・旅行・余裕のある暮らし・後輩に奢れる）\n,\n実績積み上げ報告（アカウント成長や収益化の過程を公開）\n,\n初心者が最初にやるべきこと（アカウント作成・テーマ決め）\n,\n裏垢ビジネスのよくある誤解を否定（怪しい・難しい・費用がかかる…を解消）\n,\n知られざる裏ワザ・ラク技（1日15分でできる発信ルーティンなど）\n,\n行動・実践しているリアルな様子（自分の発信過程や取り組みをシェア）\n,","sourceUrl":"","createdAt":"2025-08-24T02:56:56.343Z"},{"id":"scr-1779710258140-rguahc","title":"[全体連絡] @everyone \n\n第2回目の講義ですが\n\n8/30(土)の21時より行いま...","category":"instructor","content":"@everyone \n\n第2回目の講義ですが\n\n8/30(土)の21時より行います！\n\n内容は\n\n・はじめに~ポスト作成【入門】\n・なんのためにポストするのか？\n・ポスト作成3ステップ\n・伸びるポストのコツ\n\nこちらになります！\n\n前回と同じくリアルタイムでの開催になります！\n\nもうアカウントは準備出来てるはずなので、今回の授業聞いてポスト作れるようになれば一気にマネタイズまで近付いていきますね！\n\n今回も僕が行い、質問にも全て答えていくので是非リアルタイムでの参加お待ちしておりますー！","sourceUrl":"","createdAt":"2025-08-28T03:34:12.440Z"},{"id":"scr-1779710258140-wbpymj","title":"[全体連絡] @everyone   第2回目の講義ですが  8/30(土)の21時より行いま...","category":"instructor","content":"@everyone   第2回目の講義ですが  8/30(土)の21時より行います！  内容は  ・はじめに~ポスト作成【入門】 ・なんのためにポストするのか？ ・ポスト作成3ステップ ・伸びるポストのコツ  こちらになります！  前回と同じくリアルタイムでの開催になります！  もうアカウントは準備出来てるはずなので、今回の授業聞いてポスト作れるようになれば一気にマネタイズまで近付いていきますね！  今回も僕が行い、質問にも全て答えていくので是非リアルタイムでの参加お待ちしておりますー！","sourceUrl":"","createdAt":"2025-08-30T11:50:42.567Z"},{"id":"scr-1779710258141-pciert","title":"[全体連絡] 第2回講義お疲れ様でした！\n\n取り急ぎ復習や今週のタスクこなしやすいように講義ス...","category":"instructor","content":"第2回講義お疲れ様でした！\n\n取り急ぎ復習や今週のタスクこなしやすいように講義スライドと、GPTs含む資料の配布だけ行いますのでご確認ください！\n\n【講義スライド】\n\n3-1　はじめに「ポスト作成【入門】」\nhttps://app.irusiru SByUcJT2maEyVEUj2dsb7.1","sourceUrl":"","createdAt":"2025-10-11T11:47:52.460Z"},{"id":"scr-1779710258163-vbwpgf","title":"[全体連絡] @everyone \n\n第8回目講義お疲れ様でした！\n\n取り急ぎ復習しやすいよう...","category":"instructor","content":"@everyone \n\n第8回目講義お疲れ様でした！\n\n取り急ぎ復習しやすいように講義スライド・資料を配布しますのでご確認ください！\n\n【講義スライド・資料】\n\n公開添削会 & 質問会\nhttps://docs.google.com/document/d/1NBVQrIEc1FMH_o1zW5l_tGXRmNlpTwe8-2MgDueFjMc/edit?usp=sharing\n\n質問のコツとマインドセット(下記PDFの27ページ～)\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/TTnkUsy7Bgg0.pdf","sourceUrl":"","createdAt":"2025-10-11T16:32:17.096Z"},{"id":"scr-1779710258164-tcmrjh","title":"[全体連絡] @everyone   第7回目講義お疲れ様でした！  取り急ぎ復習しやすいよう...","category":"instructor","content":"@everyone   第7回目講義お疲れ様でした！  取り急ぎ復習しやすいように講義スライドと、資料の配布だけ行いますのでご確認ください！  【講義スライド】  8-1 X上位プレイヤーの運用改善の考え方 https://utagesystem.s3.ap-northeast-1.amazonaws.com/c3xYR6qKJz0G/oFQB0vxWcJetloxl3ODwQDMRHIxsVg91QdCwAiWt.pdf  8-2 X運用で重要な指標とは？ https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/wL0AJBH599tT.pdf  8-3 Xアナリティクスの使い方 https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/S2GF3wWF6VeD.pdf  8-4 原因別の運用改善テクニック https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/9lRklXDA4tfo.pdf  【講義関連資料】  運用改善チェックリスト https://www.notion.so/X-27101baee59780e4ae7aef26ad477944?source=copy_link  運用改善シート https://docs.google.com/spreadsheets/d/1RaNI47BCcanfn1IiVVfzQss-bTaqwzW4Xe5zdiLhvmo/edit?usp=sharing","sourceUrl":"","createdAt":"2025-10-12T13:13:44.676Z"},{"id":"scr-1779710258165-tcsqyj","title":"[全体連絡] @everyone \n\n【重要】\n\n大事なお知らせがあります。\n\nこれから、「な...","category":"instructor","content":"@everyone \n\n【重要】\n\n大事なお知らせがあります。\n\nこれから、「なまいきくん」アカウントとしての発信を一時的に休止することにしました。\n\nその代わりに、スクール運営体制の強化や提携先との連携、\n\n見込み顧客を流す先のセールスマンの成約率を上げるための教育、\n\n安全に高単価アフィに取り組めるようにするための法律面での整備など、\n\n皆さんがより大きな成果を出せるように全てのリソースを割いていきます。\n\n正直今も発信以外の時間はほぼ全てスクールのために使っていますが、\n\n今後スクール生の皆さんが最大の成果を出すにはどうすればよいか考えた結果、このような決断となりました。\n\nこれからなまいきくんアカウントでも上記の旨ポストするつもりですが、\n\n先にスクール生の皆さんにはお伝えしておきたいと思ってこちらで連絡しました。\n\nXのタイムラインは少し寂しくなると思いますが、ご理解よろしくお願いします！\n\n(当然講義などは通常通り行います)","sourceUrl":"","createdAt":"2025-10-13T10:53:38.390Z"},{"id":"scr-1779710258165-cjrsvl","title":"[全体連絡] @everyone\n\n第9回目の講義を\n\n本日10/18(土)の21時より行いま...","category":"instructor","content":"@everyone\n\n第9回目の講義を\n\n本日10/18(土)の21時より行います！ \n\n内容は\n\n・実績ゼロからでも最短で伸ばせる！ストーリー型運用の極意\n\n・ストーリー型運用３つのケーススタディ\n\n・最短で伸ばす！ストーリー型運用の設計方法\n\nこちらになります！\n\nこれまでの講義では、リプや引用で交流するなどコツコツ伸ばす方法を多く語ってきましたが、\n\n今回の講義では、発信でストーリー(物語)を作ることでエンタメでデカく伸ばす運用方法を解説していきます！\n\nストーリー型運用ができれば、見込み客のマインドシェアを強烈に奪うことができ、\n\nプロモーションで爆発的に売っていくための起爆剤になります！\n\n今回もなまいきくんがリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！","sourceUrl":"","createdAt":"2025-10-18T04:57:38.481Z"},{"id":"scr-1779710258166-exmhws","title":"[全体連絡] @everyone \n本日の講義はこちらからご参加ください！\nhttps://u...","category":"instructor","content":"@everyone \n本日の講義はこちらからご参加ください！\nhttps://us06web.zoom.us/j/88974287770?pwd=o0gJxmGVFHVHpibMp14AOjHuy3hX5K.1","sourceUrl":"","createdAt":"2025-10-18T11:55:43.423Z"},{"id":"scr-1779710258167-dmvjpj","title":"[全体連絡] @everyone \n\n第9回目講義お疲れ様でした！\n\n取り急ぎ復習しやすいよう...","category":"instructor","content":"@everyone \n\n第9回目講義お疲れ様でした！\n\n取り急ぎ復習しやすいように講義スライドを配布しますのでご確認ください！\n\n【講義スライド】\n\n9-1 実績ゼロからでも最短で伸ばせる！ストーリー型運用の極意\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/J0vAr9act0vt.pdf\n\n9-2 ストーリー型運用２つのケーススタディ\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/DeGNTkNattFe.pdf\n\n9-3 最短で伸ばす！ストーリー型運用の設計方法\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/96R9Q8VS62bz.pdf","sourceUrl":"","createdAt":"2025-10-20T05:12:32.635Z"},{"id":"scr-1779710258167-guuggo","title":"[全体連絡] @everyone\n\n第8回目講義のアーカイブ動画を公開いたします！\n\nリプライ...","category":"instructor","content":"@everyone\n\n第8回目講義のアーカイブ動画を公開いたします！\n\nリプライ先のスライド・資料と合わせてご確認ください！\n\nコンテンツサイトの「STEP2：レベルアップ企画」へも掲載しております！\n\nhttps://utage-system.com/p/oCfYlpJPKyXC","sourceUrl":"","createdAt":"2025-10-22T05:13:16.565Z"},{"id":"scr-1779710258168-eezbjl","title":"[全体連絡] @everyone \n\nみんな最近調子どうですかー！！！\n\n僕はXを休止してる分...","category":"instructor","content":"@everyone \n\nみんな最近調子どうですかー！！！\n\n僕はXを休止してる分、約1ヶ月後に来たるマネタイズフェーズでの成果を最大化するべく、裏側の仕組み作りに全力を注いでます！\n\nまた、途中参加者の人は特にですが、全然講義内容に追いついてない！って人もいると思うので、\n\nその人達に向けて、2週目目のリアルタイム講義を実施しようかなとか考えてたり。\n\n加えて、アカウント添削でだいぶアカウントの伸びが変わってたので、もうちょっと添削会の回数増やそうかなと考えてたり。\n\nせっかくチームメンバーに加入してもらった以上、僕も運営陣も皆んなには極力成果最大化して欲しいので、\n\nとにかく日々ミーティングを重ね、講義内容のブラッシュアップや、カリキュラムの見直しをしてます。\n\n僕も運営陣も本気で皆んなに向き合っていきます！\n\nもし実践する上で、つまづいてることや、不安などあれば気軽にLINEで送ってくださいねー！","sourceUrl":"","createdAt":"2025-10-22T07:43:16.380Z"},{"id":"scr-1779710258169-ybbsis","title":"[全体連絡] @everyone\n\nいつもと時間が異なります\n\n第10回目の講義を\n\n明日10...","category":"instructor","content":"@everyone\n\nいつもと時間が異なります\n\n第10回目の講義を\n\n明日10/25(土)の\"15時\"より行います！ \n\n内容は\n\n・【X運用必殺技２】インセンティブ設計術\n\n・売上を爆発的に伸ばすインセンティブ設計の活用テクニック\n\nこちらになります！\n\n前回の講義では、なまいきくん式X運用の必殺技１つ目としてストーリー型運用をお伝えしましたが、\n\n今回の講義は、なまいきくん式X運用の必殺技2つ目として\n\n読者を思いのままに動かし、インプ・反応率が爆上がりする悪魔的テクニック【インセンティブ設計】を解説していきます！\n\nインセンティブ設計をマスターすれば、ポストした瞬間に大量のいいねがつき、普通のポストにも何十件とリプが届く状態を狙って作れます！\n\n今回もなまいきくんがリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！\n\n繰り返しになりますが、明日の講義だけ15時から行うので、\n\nカレンダーに入れるなりして時間間違えないようお願いします！","sourceUrl":"","createdAt":"2025-10-24T11:10:06.384Z"},{"id":"scr-1779710258169-vuwccw","title":"[全体連絡] @everyone \n\n講義はこちらからどうぞ！\n\nhttps://us06we...","category":"instructor","content":"@everyone \n\n講義はこちらからどうぞ！\n\nhttps://us06web.zoom.us/j/89615645821?pwd=1i0VQYLoBIwAVK1aaOOzMbDaurW9U2.1","sourceUrl":"","createdAt":"2025-10-25T05:55:25.914Z"},{"id":"scr-1779710258170-zyndvt","title":"[全体連絡] @everyone \n\n第10回目講義お疲れ様でした！\n\n取り急ぎ復習しやすいよ...","category":"instructor","content":"@everyone \n\n第10回目講義お疲れ様でした！\n\n取り急ぎ復習しやすいように講義スライドを配布しますのでご確認ください！\n\n【講義スライド】\n\n10-1 【X運用必殺技２】インセンティブ設計術\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/xEj1ZCudBqOB.pdf\n\n10-2 売上を爆発的に伸ばすインセンティブ設計の活用テクニック\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/SJv2xgAFiHcL.pdf","sourceUrl":"","createdAt":"2025-10-25T10:11:50.704Z"},{"id":"scr-1779710258171-ejkait","title":"[全体連絡] @everyone   第9回目講義お疲れ様でした！  取り急ぎ復習しやすいよう...","category":"instructor","content":"@everyone   第9回目講義お疲れ様でした！  取り急ぎ復習しやすいように講義スライドを配布しますのでご確認ください！  【講義スライド】  9-1 実績ゼロからでも最短で伸ばせる！ストーリー型運用の極意 https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/J0vAr9act0vt.pdf  9-2 ストーリー型運用２つのケーススタディ https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/DeGNTkNattFe.pdf  9-3 最短で伸ばす！ストーリー型運用の設計方法 https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/96R9Q8VS62bz.pdf","sourceUrl":"","createdAt":"2025-10-26T12:12:38.307Z"},{"id":"scr-1779710258171-gluxen","title":"[全体連絡] @everyone   第10回目講義お疲れ様でした！  取り急ぎ復習しやすいよ...","category":"instructor","content":"@everyone   第10回目講義お疲れ様でした！  取り急ぎ復習しやすいように講義スライドを配布しますのでご確認ください！  【講義スライド】  10-1 【X運用必殺技２】インセンティブ設計術 https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/xEj1ZCudBqOB.pdf  10-2 売上を爆発的に伸ばすインセンティブ設計の活用テクニック https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/SJv2xgAFiHcL.pdf","sourceUrl":"","createdAt":"2025-10-30T09:43:06.962Z"},{"id":"scr-1779710258172-neegvj","title":"[全体連絡] @everyone\n\n第11回目の講義を\n\n明日11/1(土)の21時より行いま...","category":"instructor","content":"@everyone\n\n第11回目の講義を\n\n明日11/1(土)の21時より行います！ \n\n内容は\n\n・鬼のファン化教育 総講義\n・価値観を操る12の教育要素(前編)\n・価値観を操る12の教育要素(後編)\n・意思決定を掌握するロジック構築術\n\nこちらになります！\n\n今回の講義では、人を自由自在に動かせる「教育」スキルについてガッツリ語っていこうと思います。\n\n僕は教育を使って、過去に靴磨きで「夢」という商品ですらないものを売って日給50万円ゲットしたこともありますし、\n\n皆さんも教育ができるようになれば、良質なコンテンツやスクールくらいなら余裕で売れるようになります。\n\n今回もなまいきくんがリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！","sourceUrl":"","createdAt":"2025-10-31T10:06:05.232Z"},{"id":"scr-1779710258173-cjglju","title":"[全体連絡] @everyone \n今日はリアルタイム講義にてみんなの成果報告発表会もするので...","category":"instructor","content":"@everyone \n今日はリアルタイム講義にてみんなの成果報告発表会もするので、まだ報告してないことがあれば今のうちに送っておいてください！自分からしたら小さいと思えることも意外とめちゃすごいことだったりしますし、ここで報告しておくことでチームなまいきとしての士気の向上につながり、より成果がでやすい環境になるので些細なことでも送りまくってください！僕も楽しみにしています！","sourceUrl":"","createdAt":"2025-11-01T11:02:01.818Z"},{"id":"scr-1779710258173-nyjhjf","title":"[全体連絡] @everyone \n\n本日の講義はこちらからお願いします！\n\nhttps://...","category":"instructor","content":"@everyone \n\n本日の講義はこちらからお願いします！\n\nhttps://us06web.zoom.us/j/87141250357?pwd=b5i7ZCojbszwcYV9utUWYcfmCoWpPK.1","sourceUrl":"","createdAt":"2025-11-01T12:00:23.691Z"},{"id":"scr-1779710258174-lvkgoc","title":"[全体連絡] @everyone \n\n今リアルタイム講義中なのですが、来週運用の総集編講義を実...","category":"instructor","content":"@everyone \n\n今リアルタイム講義中なのですが、来週運用の総集編講義を実施した後、その次の週に以前行ったアカウント添削会をやって欲しいとのメッセが爆裂に来まくってます。\n\n結構大変なので希望の声が多ければ実施しようなかなと思ってるのですが、やって欲しい人はスタンプお願いします。本来予定になかったのでスタンプ多かったら実施します。\n\nちなみに、前回添削した人は全員見違えるように反応爆上がりしてるようです。","sourceUrl":"","createdAt":"2025-11-01T16:02:29.292Z"},{"id":"scr-1779710258174-uiuloe","title":"[全体連絡] @everyone\n\n第12回目の講義を\n\n明後日11/8(土)の21時より行い...","category":"instructor","content":"@everyone\n\n第12回目の講義を\n\n明後日11/8(土)の21時より行います！ \n\n内容は\n\n・全知識を体系化するLv.11までの復習講義\n・X運用５つの重要ポイント\n・これからのカリキュラムについて\n・あぱぱの運用(Lv.7-3)\n\nこちらになります！\n\n今回の講義は、「X運用総復習編」ということでこれまでの内容を体系的に整理して解説していきます！\n\n\"知ってる\"から\"身についた\"までは至ってない人が多いと思うので、\n\nどのタイミングでどのノウハウを使えばいいのか、みたいな実践力を高めて、マネタイズに進んでいく準備をしていきましょう！\n\n今回もなまいきくんがリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！","sourceUrl":"","createdAt":"2025-11-06T07:36:28.953Z"},{"id":"scr-1779710258175-tnebkz","title":"[全体連絡] @everyone\n\n必読\n\n【アカウントを全て提出してください】\n\n講師・運営...","category":"instructor","content":"@everyone\n\n必読\n\n【アカウントを全て提出してください】\n\n講師・運営が普段からチェックし、講義やサポートの質向上に役立てます。\n\nなまいきさんに普段から絡んで貰えたり、いいねもらえたりするかもしれないので、必ず対応お願いします！\n\nhttps://forms.gle/Rytmjf7jH2RLEXHb8 (編集済)\n2025年12月23日火曜日 20:14","sourceUrl":"","createdAt":"2025-11-07T12:46:17.759Z"},{"id":"scr-1779710258176-phrexd","title":"[全体連絡] @everyone \n\n本日の講義はこちらからご参加ください！\n今回は復習編にな...","category":"instructor","content":"@everyone \n\n本日の講義はこちらからご参加ください！\n今回は復習編になるのでスクールに途中参加した人でも問題なく参加できるかなと思います！全員参加お待ちしております！\n\nhttps://us06web.zoom.us/j/82995333005?pwd=Xnb1zXT2OP0gAuP3sWrIzrI3Nby2br.1","sourceUrl":"","createdAt":"2025-11-08T11:35:38.193Z"},{"id":"scr-1779710258177-fklfxd","title":"[全体連絡] @everyone \n\n第12回目講義お疲れ様でした！\n\n取り急ぎ復習しやすいよ...","category":"instructor","content":"@everyone \n\n第12回目講義お疲れ様でした！\n\n取り急ぎ復習しやすいように講義スライドを配布しますのでご確認ください！\n\n【講義スライド】\n\n全知識を体系化するLv.11までの復習講義\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/hfQiSDblbb6G.pdf\n\nX運用５つの重要ポイント\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/AA7HtAKliP3N.pdf\n\nこれからのカリキュラムについて\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/4Mvpoq39BPRx.pdf","sourceUrl":"","createdAt":"2025-11-09T03:54:57.506Z"},{"id":"scr-1779710258177-pqwxgv","title":"[全体連絡] @everyone\n\n第11回目講義のスライドも以下に共有させていただきます。\n...","category":"instructor","content":"@everyone\n\n第11回目講義のスライドも以下に共有させていただきます。\n\nよろしくお願いします。\n\n11-1 鬼のファン化教育 総講義\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/5369aJJLo29m.pdf\n\n11-2 価値観を操る12の教育要素(前編)\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/CDDa4zX97d9K.pdf\n\n11-3 価値観を操る12の教育要素(後編)\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/2w8kKDvULoPy.pdf\n\n11-4 意思決定を掌握するロジック構築術\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/DUPqFUC1ssIq.pdf","sourceUrl":"","createdAt":"2025-11-09T04:44:51.254Z"},{"id":"scr-1779710258178-alxrtc","title":"[全体連絡] @everyone\n\n【アカウント添削希望者を募集します】\n\n次回講義11/15...","category":"instructor","content":"@everyone\n\n【アカウント添削希望者を募集します】\n\n次回講義11/15(土)ですが、\n\nまたやって欲しいとの反応が多かったため\n\n「アカウント添削会」\n\nの第2回を行います！\n\nこれまでX運用の基礎~実践までをガッツリ講義してきて\n\n1回1回がかなり情報量多かったので、\n\nそれを実践に落とし込んでもらうために\n\nスクール生が運用しているアカウントをなまいきくんが直接添削を行います。\n\nつきましては、\n\n「なまいきくんにアカウント添削して欲しい！」\n\nという希望を募集します！\n\n前回添削してもらった人は全員爆伸びしているのと、\n\nなまいきくんから直に添削受けられる機会は滅多にないので、奮ってご応募ください！\n\n注意です。\n\n応募は、次回講義11/15(土)21:00~にリアルタイムで参加できる方のみでお願いします！\n\nまた、アカウント添削は人数に限りがあります。人数が多い場合は抽選になるので、選ばれることを祈って、次回の講義を楽しみにお待ちください！\n\n━━━━━━━━━━\n応募期限：11/12(水) 23:59\n━━━━━━━━━━\n\nhttps://docs.google.com/forms/d/e/1FAIpQLSe4Hq5KhjTGfchy4WV8N_noYFp6psw2NtnLqz0Qu5UbDjCI-Q/viewform","sourceUrl":"","createdAt":"2025-11-09T13:19:15.278Z"},{"id":"scr-1779710258179-zedluk","title":"[全体連絡] @everyone  第11回目講義のスライドも以下に共有させていただきます。 ...","category":"instructor","content":"@everyone  第11回目講義のスライドも以下に共有させていただきます。  よろしくお願いします。  11-1 鬼のファン化教育 総講義 https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/5369aJJLo29m.pdf  11-2 価値観を操る12の教育要素(前編) https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/CDDa4zX97d9K.pdf  11-3 価値観を操る12の教育要素(後編) https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/2w8kKDvULoPy.pdf  11-4 意思決定を掌握するロジック構築術 https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/DUPqFUC1ssIq.pdf","sourceUrl":"","createdAt":"2025-11-10T10:49:00.650Z"},{"id":"scr-1779710258179-sgcqxw","title":"[全体連絡] @everyone \n\n明日11/15(土)の21時より、リアルタイムにてアカウ...","category":"instructor","content":"@everyone \n\n明日11/15(土)の21時より、リアルタイムにてアカウント添削会を行います！\n\nアカウント添削会に向けて、一人一人のアカウント見ていってるんですが、\n\n皆前回開催時よりもかなり運用上手くなっててちょい感動してます。\n\nしかも、スクール開始当初想定してたよりも、3倍くらい伸びまくってて素晴らしいです、、！！\n\nただ、さらに高みに到達出来るはず！！\n\nということで、明日の添削会はかなり辛口でいきます！\n\n誰が当選して、添削されるかはまだ内緒ですが、皆の学びになるであろう人をピックアップしてるので、是非リアルタイムで参加して運用の極意を吸収しまくってください！\n\n明日の講義も楽しんでいきましょー","sourceUrl":"","createdAt":"2025-11-14T14:10:48.895Z"},{"id":"scr-1779710258180-cbrhkp","title":"[全体連絡] @everyone \n\n本日の講義はこちらから参加ください！\n\nhttps://...","category":"instructor","content":"@everyone \n\n本日の講義はこちらから参加ください！\n\nhttps://us06web.zoom.us/j/81190371646?pwd=5ZISQR2b7nj2X5Qndx0KrF1qd5jyEd.1","sourceUrl":"","createdAt":"2025-11-15T11:55:29.169Z"},{"id":"scr-1779710258181-whpylc","title":"[全体連絡] @everyone \n【重要案内】\n\n昨日の講義では案内したのですが、リアルタイ...","category":"instructor","content":"@everyone \n【重要案内】\n\n昨日の講義では案内したのですが、リアルタイム講義がかなり好評で、これのおかげか僕が当初想定してたよりもはるかに多くの成果が上がってきてるので、\n\n本来予定にありませんでしたが、来週から「リアルタイム講義2周目」を開始します。\n\n「周りが爆伸びしてるのに自分は全然で焦ってる、、、」\n「みんなと一緒に切磋琢磨したいのに最近参加したばかりでリアルタイム講義参加できない」\n\nなまいきスクールはそんな人も見捨てません。途中参加で基本的にアーカイブ視聴だった人も、最初から参加してるけどもXにコミットできず、最初からやり直したい人も全員2周目参加してください。\n\nまた、高単価アフィにしろ、noteにしろ、自社スクール販売にしろ、集客力の強化が最重要項目で集客さえできればあとのことはなんとでもなります。\n\nキックオフでカリキュラム話してる通りですが、最初の４ヶ月のアカウント準備期間、強化期間が最大の山場となるので、焦らず着実に力をつけていきましょう！\n\n僕も講師一同も全力でサポートしていきます！！！\n\n引き続き一緒に頑張っていきましょう！！\n\n最後に\n\nみんなの目にどう映ってるかはわかりませんが、僕や運営陣はみんなの成果を最大化すべく、本当に寝る間も惜しんで改善に改善を重ねています。\n\n僕個人の話でいうと、5年間一度たりとも休まず続けてきたXを休止して、よりよりスクールにすべく日々頭を悩ませながら、時にはゲロを吐きながら尽力しています。\n\nこれを今後紹介する提携先に関しても同じです。今回のスクールをより良いものにするためみんなが想像してる以上に人たちが動き回ってます。\n\nどこのスクールよりも最高の環境にしたい。どこよりも成果を出したい。この気持ちは嘘偽りないです。\n\nこういうサポートがあったらいいのになあ、、、こういう改善して欲しい！などあれば、できる限り取り入れますのでお気軽にLINEグループまでご連絡ください！\n\n正直なところ立ち上げたてでどたばたしてるとこもありますが、時間をかけてみんなと最高の環境を作り上げていけたらなと思ってます。ご不便をかけることもあるかと思いますが引き続きよろしくお願いいたします","sourceUrl":"","createdAt":"2025-11-16T07:26:14.913Z"},{"id":"scr-1779710258181-fneeua","title":"[全体連絡] あ、1周目は1周目で引き続き行っていきます！\n\n1周目については、運用パートが終...","category":"instructor","content":"あ、1周目は1周目で引き続き行っていきます！\n\n1周目については、運用パートが終わったので、来週は1回休講して、各自でこれまでの復習に当てる時間にしてもらうかなと思ってましたが、\n\nアカウント添削が昨日全部終わらなかったので、そちらの余りを実施する形になります！\n\n2周目の曜日についてはまた連絡しますが、これからは1周目のリアタイ講義、2周目のリアタイ講義が同時に進んでいく形になるのでこちらも合わせて把握のほどお願いします！","sourceUrl":"","createdAt":"2025-11-16T07:53:23.547Z"},{"id":"scr-1779710258182-hviagv","title":"[全体連絡] @everyone\n\n現在サーバーが落ちており、コンテンツサイトやマインド講座が...","category":"instructor","content":"@everyone\n\n現在サーバーが落ちており、コンテンツサイトやマインド講座が見れない状態になっております。\n\nこちら復旧までしばしお待ちいただけますと幸いです。ご迷惑をおかけしますが、よろしくお願いいたします","sourceUrl":"","createdAt":"2025-11-18T13:58:28.650Z"},{"id":"scr-1779710258182-czfkzz","title":"[全体連絡] @everyone \nお疲れ様です！\n\n以前アナウンスをしていた「リアルタイム講...","category":"instructor","content":"@everyone \nお疲れ様です！\n\n以前アナウンスをしていた「リアルタイム講義2週目」ですが、その初回講義を【今週11/23(日)21:00〜】実施いたします！\n\n最近スクールに入会された方や、中々時間が取れずカリキュラムに追いついてない方など、これからアカウントを伸ばしていきたい方は全員ご参加ください！\n\n講義2週目では、自分と同じような進行度の仲間達と一緒に1から学んでいけます。気になることはリアルタイムでなんでも質問できます。もう一回気合いを入れ直して頑張りたい、って人ももちろん参加OKです。\n\nみんなで協力しつつ、これから一緒に頑張っていきましょう！ (編集済)\n2025年11月21日金曜日 20:26","sourceUrl":"","createdAt":"2025-11-21T11:25:24.955Z"},{"id":"scr-1779710258183-hjcswx","title":"[全体連絡] @everyone \n\n本日の講義はこちらからどうぞ！\n\nhttps://us0...","category":"instructor","content":"@everyone \n\n本日の講義はこちらからどうぞ！\n\nhttps://us06web.zoom.us/j/86297752035?pwd=dIvSXLQJFG6icUKvPJjSnM14zmwmVA.1","sourceUrl":"","createdAt":"2025-11-22T11:59:05.269Z"},{"id":"scr-1779710258184-cehloh","title":"[全体連絡] @everyone \n\n本日の講義はこちらからどうぞ！\n\nZoom ミーティング...","category":"instructor","content":"@everyone \n\n本日の講義はこちらからどうぞ！\n\nZoom ミーティングに参加する\nhttps://us06web.zoom.us/j/82294589766?pwd=5PmXpb4p2bB9nio2Zjm84S6b9gcNU4.1\n\nミーティング ID: 822 9458 9766\nパスコード: 374452","sourceUrl":"","createdAt":"2025-11-23T11:59:30.022Z"},{"id":"scr-1779710258184-eszehj","title":"[全体連絡] @everyone   第12回目講義お疲れ様でした！  取り急ぎ復習しやすいよ...","category":"instructor","content":"@everyone   第12回目講義お疲れ様でした！  取り急ぎ復習しやすいように講義スライドを配布しますのでご確認ください！  【講義スライド】  全知識を体系化するLv.11までの復習講義 https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/hfQiSDblbb6G.pdf  X運用５つの重要ポイント https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/AA7HtAKliP3N.pdf  これからのカリキュラムについて https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/4Mvpoq39BPRx.pdf","sourceUrl":"","createdAt":"2025-11-25T15:47:22.747Z"},{"id":"scr-1779710258185-dbdiqi","title":"[全体連絡] @everyone\n\n第15回目の講義を\n\n明日11/29(土)の21時より行い...","category":"instructor","content":"@everyone\n\n第15回目の講義を\n\n明日11/29(土)の21時より行います！ \n\n内容は\n\n・４つのマネタイズ手法\n・商材選びのポイント\n・マネタイズまでの流れ\n・マネタイズまでの事前準備\n\nこちらになります！\n\nこれまでの講義では、アカウントを作ってから十分にアカウントパワーを育てるまでに必要な内容を話してきました！\n\nここからはマネタイズ編に入っていきます。\n\n今回は入門として「ゼロからわかるマネタイズ攻略！」というテーマでマネタイズの全体像について解説します。\n\n事前にマネタイズまでの流れや手法を知っておくことで、長期的な売上を最大化できたり、目的によってアカウント運用を最適化できるようになりますね！\n\n今回もなまいきくんがリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！","sourceUrl":"","createdAt":"2025-11-28T09:05:02.962Z"},{"id":"scr-1779710258186-zcpcsc","title":"[全体連絡] @everyone \n\n僕含め、画像のようにzoomの画面を載せることもあると思...","category":"instructor","content":"@everyone \n\n僕含め、画像のようにzoomの画面を載せることもあると思いますが、その際他の人が上げた画像によってスクール生バレしたくない、、って人は予めzoom上のアイコン・名前を変えておくようお願いします！\n\n恋愛界隈以外の人(金稼ぎ系ジャンルの人)はあまり気にしなくていいかなと個人的に思いますが、\n\n今後僕もそうですが、スクールの新規集客をする際に、こういったスクールの雰囲気が分かる写真などは上げていくので、万が一気になる場合は各自で対応だけお願いします！","sourceUrl":"","createdAt":"2025-11-29T06:00:13.151Z"},{"id":"scr-1779710258186-vurbez","title":"[全体連絡] @everyone \n1周目の本日のリアルタイム講義はこちらからどうぞ！\n\nht...","category":"instructor","content":"@everyone \n1周目の本日のリアルタイム講義はこちらからどうぞ！\n\nhttps://us06web.zoom.us/j/85850578467?pwd=dC0ukFRBrP1FseglG7za1kHe0ddQ26.1","sourceUrl":"","createdAt":"2025-11-29T11:47:41.131Z"},{"id":"scr-1779710258187-bshcob","title":"[全体連絡] @everyone \n第2回添削会のアーカイブを公開いたします！\n\n会員サイトに...","category":"instructor","content":"@everyone \n第2回添削会のアーカイブを公開いたします！\n\n会員サイトにも同様に公開しているのでご確認ください！\n\n前半\nhttps://utage-system.com/p/24d1fPnClqgV\n\n後半\nhttps://utage-system.com/p/BlKfaXr9w0I0 (編集済)\n2025年12月1日月曜日 15:05","sourceUrl":"","createdAt":"2025-12-01T05:55:58.371Z"},{"id":"scr-1779710258188-totevy","title":"[全体連絡] @everyone  第15回目の講義を  明日11/29(土)の21時より行い...","category":"instructor","content":"@everyone  第15回目の講義を  明日11/29(土)の21時より行います！   内容は  ・４つのマネタイズ手法 ・商材選びのポイント ・マネタイズまでの流れ ・マネタイズまでの事前準備  こちらになります！  これまでの講義では、アカウントを作ってから十分にアカウントパワーを育てるまでに必要な内容を話してきました！  ここからはマネタイズ編に入っていきます。  今回は入門として「ゼロからわかるマネタイズ攻略！」というテーマでマネタイズの全体像について解説します。  事前にマネタイズまでの流れや手法を知っておくことで、長期的な売上を最大化できたり、目的によってアカウント運用を最適化できるようになりますね！  今回もなまいきくんがリアルタイムで講義を行い、  その場で質問にも答えるので、是非リアルタイムでご参加くださいー！","sourceUrl":"","createdAt":"2025-12-02T07:45:45.374Z"},{"id":"scr-1779710258188-bjstxb","title":"[全体連絡] @everyone\n\n第16回目の講義を\n\n明日12/6(土)の21時より行いま...","category":"instructor","content":"@everyone\n\n第16回目の講義を\n\n明日12/6(土)の21時より行います！ \n\n内容は\n\n・売上を最大化する資産について\n・高単価アフィリエイトとは？(スキーム解説)\n・高単価アフィリエイトの流れ(高単価アフィモデル)\n・高単価アフィのルール説明\n・高単価アフィのはじめかた\n\nこちらになります！\n\n前回の講義では、ゼロからのマネタイズ入門講義ということで、マネタイズの種類や全体像を説明しました。\n\n今回はいよいよ「高単価アフィに関する重要な項目」について話していきます。\n\nまた、それに伴い、長期的な売上を最大化するための資産についても解説していこうと思います。\n\n目先の利益だけを追い求めるあまり、長期的に利益を生み出してくれる資産を失ってしまうと、\n\n最初は少し稼げても、長期的には全然売り上げが立たなくなる可能性があるので、マネタイズに入る前に必ず把握しておいてほしい重要な話になります。\n\n今回もなまいきくんがリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！","sourceUrl":"","createdAt":"2025-12-05T13:29:58.946Z"},{"id":"scr-1779710258189-rfvgnp","title":"[全体連絡] @everyone \n\n1週目第16回目の講義はこちらからどうぞ！\n\nhttps...","category":"instructor","content":"@everyone \n\n1週目第16回目の講義はこちらからどうぞ！\n\nhttps://us06web.zoom.us/j/89537109979?pwd=jFhqZ9c1aLarv9Rb7DdKvteaGbMD72.1","sourceUrl":"","createdAt":"2025-12-06T11:48:41.708Z"},{"id":"scr-1779710258189-cqqgwj","title":"[全体連絡] @everyone \n\n第16回目講義お疲れ様でした！\n\n復習しやすいように講義...","category":"instructor","content":"@everyone \n\n第16回目講義お疲れ様でした！\n\n復習しやすいように講義スライドを配布しますのでご確認ください！\n\n【講義スライド】\n\n売上を最大化する資産について\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/7Lg8wAhBKQP1.pdf\n\n高単価アフィリエイトとは？(スキーム解説)\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/gjeieciLqNUl.pdf\n\n高単価アフィリエイトの流れ(高単価アフィモデル)\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/vpWRS3r1d8zV.pdf\n\n高単価アフィのはじめかた\nhttps://utagesystem.s3.ap-northeast-1.amazonaws.com/c3xYR6qKJz0G/jGnOHrIQAOJTUPowBikFmLss137jWwPwIPiRBRMV.pdf (編集済)\n2025年12月14日日曜日 18:38","sourceUrl":"","createdAt":"2025-12-07T05:09:37.934Z"},{"id":"scr-1779710258190-gqylky","title":"[全体連絡] @everyone   1周目の第15回目講義（マネタイズ編初回）のスライドを以...","category":"instructor","content":"@everyone   1周目の第15回目講義（マネタイズ編初回）のスライドを以下に共有させていただきます。  よろしくお願いします。  ４つのマネタイズ手法 https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/R94cwVRoasrt.pdf  商材選びのポイント https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/Yh43aQHmCc7R.pdf  マネタイズまでの流れ https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/zBPtNOWEG5lF.pdf  マネタイズまでの事前準備 https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/JxajjaNXoR4p.pdf","sourceUrl":"","createdAt":"2025-12-08T12:41:16.509Z"},{"id":"scr-1779710258190-tpmewk","title":"[全体連絡] @everyone\n\n第17回目の講義を\n\n明日12/13(土)の21時より行い...","category":"instructor","content":"@everyone\n\n第17回目の講義を\n\n明日12/13(土)の21時より行います！ \n\n内容は\n\n・リスト獲得の方法\n・XTEPリスト獲得の流れ\n・リスト獲得のまとめとセールス補助ポスト\n\nこちらになります！\n\nこれまで、ポストの5つの目的のうち、認知獲得→興味づけ→関係構築→教育、までをやってきたと思うので、\n\n今回は、ポストの目的の5つ目である「リスト獲得」について話していきます！\n\n効率的にLINE登録者を増やして、マネタイズに繋げていきましょう！\n\n今回もなまいきくんがリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！","sourceUrl":"","createdAt":"2025-12-12T13:28:58.751Z"},{"id":"scr-1779710258191-jbkzqz","title":"[全体連絡] @everyone \n\n1周目第17回目の本日の講義はこちらからどうぞ！！\nht...","category":"instructor","content":"@everyone \n\n1周目第17回目の本日の講義はこちらからどうぞ！！\nhttps://us06web.zoom.us/j/81087529807?pwd=aeHCh9TRN9AqlsbOXbabsoY5U0yjnL.1 (編集済)\n2025年12月13日土曜日 20:51","sourceUrl":"","createdAt":"2025-12-13T11:50:50.942Z"},{"id":"scr-1779710258192-jrixkt","title":"[全体連絡] @everyone \n\n第17回目講義お疲れ様でした！\n\n復習しやすいように講義...","category":"instructor","content":"@everyone \n\n第17回目講義お疲れ様でした！\n\n復習しやすいように講義スライド・マニュアルを配布しますのでご確認ください！\n\n【講義スライド】\n\nリスト獲得の方法(プレ企画・Space・XTEP・100円note・低単価Brain)\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/I6ErRNO0CNAC.pdf\n\nXTEPリスト獲得の流れ(流れ・頻度・ポイント)\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/xYivRAWzWJ0H.pdf\n\nリスト獲得のまとめとセールス補助ポスト\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/8J5tz1HpGamu.pdf\n\n【マニュアル】\n\nXTEP攻略シート\nhttps://docs.google.com/spreadsheets/d/1yFTYRUHrvsCVN1X3_3F3Px2G1lnFtXc35nRrcwl3nnw/edit?usp=sharing","sourceUrl":"","createdAt":"2025-12-14T09:32:25.411Z"},{"id":"scr-1779710258192-btlbmm","title":"[全体連絡] @everyone   第16回目講義お疲れ様でした！  復習しやすいように講義...","category":"instructor","content":"@everyone   第16回目講義お疲れ様でした！  復習しやすいように講義スライドを配布しますのでご確認ください！  【講義スライド】  売上を最大化する資産について https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/7Lg8wAhBKQP1.pdf  高単価アフィリエイトとは？(スキーム解説) https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/gjeieciLqNUl.pdf  高単価アフィリエイトの流れ(高単価アフィモデル) https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/vpWRS3r1d8zV.pdf  高単価アフィのはじめかた https://utagesystem.s3.ap-northeast-1.amazonaws.com/c3xYR6qKJz0G/jGnOHrIQAOJTUPowBikFmLss137jWwPwIPiRBRMV.pdf (編集済)\n2025年12月14日日曜日 18:38","sourceUrl":"","createdAt":"2025-12-14T09:38:29.851Z"},{"id":"scr-1779710258193-mbrnmh","title":"[全体連絡] @everyone \n\n【年末年始の運営について連絡】\n\n結論から言うと\n12月...","category":"instructor","content":"@everyone \n\n【年末年始の運営について連絡】\n\n結論から言うと\n12月31日〜1月4日については\n運営の全業務を停止し\n年末年始休暇とさせていただきます。\n\nこの期間はポスト作成会や\nリアルタイム講義、LINEでの質疑応答や\n事務対応もすべて休止させていただきます。 \n\nもちろん12月30日までは\n通常通り運営していきます。\n\n2025年もいよいよラストスパートになりました。残り2週間、みんなで最高の2025年だったなと言えるように、一緒に駆け抜けていきましょう！\n\nまた8月入会の人に関しては4ヶ月が経ちますので、プラン順に優先順位をつけた上で、随時高単価アフィの提携についても案内していきます！\n\nこちらはまた近々別途案内送るので高単価アフィ希望者は楽しみにしておいてください！\n\np.s.\n\n皆んなが安全かつ、成果も最大化する高単価アフィのシステムを構築するのに、裏側でくっそ時間かけてきました。\n\nもう2度とやりたくないと思えるほど大変でした。\n\nお金で言うと、システム開発に軽く4桁はぶっ飛びましたし、今後固定費でも月300万円くらいはかかってきます。また、かけた時間で言うと、5年間一度も休んだことのない発信活動も完全に休止してほぼ全てを捧げてきました。\n\n自分で言うのもあれですが、結構頑張りましたww\n\nそして、これは僕だけでなく、なまいきスクール運営陣、そして、この高単価アフィを成立させるべく、裏側で関わってくれてる提携先の運営陣、セールスマン、サポート講師、計452人のメンバー全員です。\n\n体力の限界まで皆んなで動いてきました。勿論、まだまだこれからですが、一旦の休息として年末年始くらいは休ませてください。\n\nでないと僕がブラック企業の社長として訴えられちゃいます。ご理解のほどよろしくお願いします","sourceUrl":"","createdAt":"2025-12-18T12:17:28.917Z"},{"id":"scr-1779710258194-urehuv","title":"[全体連絡] @everyone\n\n第18回目の講義を\n\n本日12/20(土)の21時より行い...","category":"instructor","content":"@everyone\n\n第18回目の講義を\n\n本日12/20(土)の21時より行います！ \n\n内容は\n\n【Kくん特別講義】\n・XTEPのネタの探し方\n・フロントポストの作り方\n・プレゼントの中身の作り方\n・具体的な操作方法\n\nこちらになります！\n\n前回の講義でXTEPの流れや考え方を学んだと思うので、\n\n今回は「バズるXTEP術」について\n\n日本一のXTEP代理店であり、XTEP経由で売上1億以上を作ってきたKくんにXSTEPの特別講義をしてもらいます！\n\n実例も紹介しながら実践的な内容を解説してもらうので、\n\n自分のアカウントで実践して、リスト獲得→マネタイズに繋げられるようにしっかり学んでいきましょう！\n\n今回もリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！","sourceUrl":"","createdAt":"2025-12-20T04:54:03.847Z"},{"id":"scr-1779710258194-kggyac","title":"[全体連絡] @everyone \n本日の講義はこちらからどうぞ！\nhttps://us06w...","category":"instructor","content":"@everyone \n本日の講義はこちらからどうぞ！\nhttps://us06web.zoom.us/j/87216159504?pwd=TONcb6ijf9AQqfmbSYOgJUnBmnL3di.1","sourceUrl":"","createdAt":"2025-12-20T12:00:38.657Z"},{"id":"scr-1779710258195-veqtpe","title":"[全体連絡] @everyone\n\n重要\n\n【高単価アフィに関する連絡】\n\n8月に入会した人が...","category":"instructor","content":"@everyone\n\n重要\n\n【高単価アフィに関する連絡】\n\n8月に入会した人が4ヶ月経つので、事前に伝えてたカリキュラム通り、プラン順に優先順位をつけた上で、\n\n高単価アフィの第1次案内を始めていきます！\n\n最初に１つだけ注意しておくと、希望者のみの案内になるので、全員が高単価アフィをする必要はありませんし、提携は完全に自由です。\n\nこれは繰り返し言ってる通り、マネタイズ手法云々というより、質の高いお客さんを多く集めてくる能力がマネタイズにおいて1番重要で、\n\nこれさえ出来ればマネタイズなんて全く難しくないです。\n\n高単価アフィでしかマネタイズ出来ないなんてことはありませんし、\n\n高単価アフィはあくまでマネタイズ手法の１つではあるのと、マネタイズの手数は多い方がいいので、他の手法に関しても講義では解説していきますが、\n\n高単価アフィを実施したい人は、提携を存分に活用してください！\n\nまた、高単価アフィの提携は希望者のみに、別途契約を結んで行うものになるので、(別途費用がかかることはありません)\n\n高単価アフィに関しては、スクールの1年間のサポート期間に関わらず、僕らがこの仕組みを継続できる限りは提携し続けることが可能です。\n\nですので、まだマネタイズ基準を満たしてないという人や、長期的な売上を最大化するためにもっとアカウントを伸ばしてから始めたいという人は、\n\nスクールの残り期間を考えて焦る必要はなく、アカウントを更に伸ばしてから高単価アフィすることも可能です！\n\nみんなが最大限成果を出せるよう、この辺は僕らも考えて設計してるのでご安心ください！\n\n【提携までの流れについて】\n\n続いて、高単価アフィの第1次案内の流れですが、\n\n運営から該当者のLINEグループへ順次連絡\n↓↓↓\n希望者を案件ごとのオプチャに招待\n↓↓↓\n案件ごとの説明会を行う\n↓↓↓\nアフィ契約締結、アフィリエイター登録\n↓↓↓\n導線審査（安全にアフィできるようにする為）\n↓↓↓\n紹介URLの発行、アフィ開始\n\nと進んでいきます。\n\n全体の効率を最大化した上で、提携をスムーズにするために、入会時期やプランを考慮して第１次、第２次…と順次提携を進めていくので、今回の第１次募集は該当者だけにLINEグループで個別連絡します！\n\n連絡がまだ来ていなくても、順次案内していくのでご安心ください！\n\n高単価アフィは大きい金額が動くだけに、普通のアフィみたいにリンクを渡してすぐスタート！というわけにはいかず、\n\n提携先、営業マン、講師、なまいきスクール運営陣、アフィリエイター、全員がそれぞれが役割分担し協力することでシステムが回るようになっています。\n\n前にも言いましたが、皆んなが安全かつ、成果も最大化する高単価アフィが実現できるような仕組みを作るためにすでに450人を超える人が携わってここまで仕組みを作ってきました。\n\nそして、ここからはアフィリエイターとなる皆んなの協力も必要になってくるので\n\n高単価アフィ希望者は開始を楽しみにしてもらいつつ、チーム一丸で取り組んでいく必要があることもぜひ頭に入れておいてください！\n\nそして、最近入会した方やまだマネタイズは始めないよって人も、来たるマネタイズフェーズに向けて引き続きアカウント運用頑張っていきしょう！運用フェーズが最重要です。ここが1番の山場ですよ。\n\np.s.\n\n既に先行で始めてる人の高単価アフィでの合計マネタイズ額が、5億を余裕で超えてるらしいです・・・\n\nしれっと裏目標としてスクール生全員(なまいきくんの売上を除く)で初年度20億をかかげており、提携先にもその旨伝えてるので、全員で20億の目標を達成出来るよう一緒に頑張っていきましょう\n\n\nアカウント提出がまだの人がいるらしく、提出がないと高単価アフィできないので、まだの人は今すぐ全アカウント提出してください\nhttps://forms.gle/xmVPgiMvKgjZhgxGA (編集済)\n2025年12月24日水曜日 17:12","sourceUrl":"","createdAt":"2025-12-24T08:09:54.193Z"},{"id":"scr-1779710258196-feafov","title":"[全体連絡] @everyone  重要  【高単価アフィに関する連絡】  8月に入会した人が...","category":"instructor","content":"@everyone  重要  【高単価アフィに関する連絡】  8月に入会した人が4ヶ月経つので、事前に伝えてたカリキュラム通り、プラン順に優先順位をつけた上で、  高単価アフィの第1次案内を始めていきます！  最初に１つだけ注意しておくと、希望者のみの案内になるので、全員が高単価アフィをする必要はありませんし、提携は完全に自由です。  これは繰り返し言ってる通り、マネタイズ手法云々というより、質の高いお客さんを多く集めてくる能力がマネタイズにおいて1番重要で、  これさえ出来ればマネタイズなんて全く難しくないです。  高単価アフィでしかマネタイズ出来ないなんてことはありませんし、  高単価アフィはあくまでマネタイズ手法の１つではあるのと、マネタイズの手数は多い方がいいので、他の手法に関しても講義では解説していきますが、  高単価アフィを実施したい人は、提携を存分に活用してください！  また、高単価アフィの提携は希望者のみに、別途契約を結んで行うものになるので、(別途費用がかかることはありません)  高単価アフィに関しては、スクールの1年間のサポート期間に関わらず、僕らがこの仕組みを継続できる限りは提携し続けることが可能です。  ですので、まだマネタイズ基準を満たしてないという人や、長期的な売上を最大化するためにもっとアカウントを伸ばしてから始めたいという人は、  スクールの残り期間を考えて焦る必要はなく、アカウントを更に伸ばしてから高単価アフィすることも可能です！  みんなが最大限成果を出せるよう、この辺は僕らも考えて設計してるのでご安心ください！  【提携までの流れについて】  続いて、高単価アフィの第1次案内の流れですが、  運営から該当者のLINEグループへ順次連絡 ↓↓↓ 希望者を案件ごとのオプチャに招待 ↓↓↓ 案件ごとの説明会を行う ↓↓↓ アフィ契約締結、アフィリエイター登録 ↓↓↓ 導線審査（安全にアフィできるようにする為） ↓↓↓ 紹介URLの発行、アフィ開始  と進んでいきます。  全体の効率を最大化した上で、提携をスムーズにするために、入会時期やプランを考慮して第１次、第２次…と順次提携を進めていくので、今回の第１次募集は該当者だけにLINEグループで個別連絡します！  連絡がまだ来ていなくても、順次案内していくのでご安心ください！  高単価アフィは大きい金額が動くだけに、普通のアフィみたいにリンクを渡してすぐスタート！というわけにはいかず、  提携先、営業マン、講師、なまいきスクール運営陣、アフィリエイター、全員がそれぞれが役割分担し協力することでシステムが回るようになっています。  前にも言いましたが、皆んなが安全かつ、成果も最大化する高単価アフィが実現できるような仕組みを作るためにすでに450人を超える人が携わってここまで仕組みを作ってきました。  そして、ここからはアフィリエイターとなる皆んなの協力も必要になってくるので  高単価アフィ希望者は開始を楽しみにしてもらいつつ、チーム一丸で取り組んでいく必要があることもぜひ頭に入れておいてください！  そして、最近入会した方やまだマネタイズは始めないよって人も、来たるマネタイズフェーズに向けて引き続きアカウント運用頑張っていきしょう！運用フェーズが最重要です。ここが1番の山場ですよ。  p.s.  既に先行で始めてる人の高単価アフィでの合計マネタイズ額が、5億を余裕で超えてるらしいです・・・  しれっと裏目標としてスクール生全員(なまいきくんの売上を除く)で初年度20億をかかげており、提携先にもその旨伝えてるので、全員で20億の目標を達成出来るよう一緒に頑張っていきましょう   アカウント提出がまだの人がいるらしく、提出がないと高単価アフィできないので、まだの人は今すぐ全アカウント提出してください https://forms.gle/xmVPgiMvKgjZhgxGA (編集済)\n2025年12月24日水曜日 17:12","sourceUrl":"","createdAt":"2025-12-24T08:12:32.516Z"},{"id":"scr-1779710258196-btebqe","title":"[全体連絡] @everyone   第17回目講義お疲れ様でした！  復習しやすいように講義...","category":"instructor","content":"@everyone   第17回目講義お疲れ様でした！  復習しやすいように講義スライド・マニュアルを配布しますのでご確認ください！  【講義スライド】  リスト獲得の方法(プレ企画・Space・XTEP・100円note・低単価Brain) https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/I6ErRNO0CNAC.pdf  XTEPリスト獲得の流れ(流れ・頻度・ポイント) https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/xYivRAWzWJ0H.pdf  リスト獲得のまとめとセールス補助ポスト https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/8J5tz1HpGamu.pdf  【マニュアル】  XTEP攻略シート https://docs.google.com/spreadsheets/d/1yFTYRUHrvsCVN1X3_3F3Px2G1lnFtXc35nRrcwl3nnw/edit?usp=sharing","sourceUrl":"","createdAt":"2025-12-25T03:58:41.609Z"},{"id":"scr-1779710258197-diwwti","title":"[全体連絡] @everyone \n\n全スクール生へ。1ヶ月以内に復活するので、それまで各自全...","category":"instructor","content":"@everyone \n\n全スクール生へ。1ヶ月以内に復活するので、それまで各自全力でアカウント盛り上げててください。\n\n今年は本気でなまいき経済圏をデカくします。\n\nとりあえず今年中に30億規模は勿論、いずれ100億に必ず到達させます。\n\nそのために僕も発信再開に向けて仕込みまくってます。\n\n皆でぶち抜きましょう。\n\n全員が力をさらにつけてもらうため、スクールコンテンツやサポートもさらに充実させていきます。\n\nガンガン金もかけて、どこよりも最強の環境を整えます。\n\nただ、結局、最後はスクール生一人一人の頑張り次第なところもあります。\n\n僕も本気でやるので、一緒にやりましょう。\n\nモチベ落ちてる人も全員再度奮起してポストやり尽くしましょう。\n\n本当にXで掴める夢はデカいですよ。\n\nこれは僕自身がXに全力で取り組み、20代前半にして、億を超える資産を築き、今なおその資産を拡大させてるからこそ、心の底から言えます。\n\n今やるかで未来が大きく変わります。\n\nそろそろ僕も復活して、圧倒的に最前線でぶち抜いていくので一緒に頑張っていきましょう","sourceUrl":"","createdAt":"2026-01-20T16:25:56.252Z"},{"id":"scr-1779710258198-rruxpv","title":"[全体連絡] @everyone \n【ガチ0運用企画開始！！】\n\n突然ですが、実績0スタートで...","category":"instructor","content":"@everyone \n【ガチ0運用企画開始！！】\n\n突然ですが、実績0スタートでも、Xは伸ばせるし、マネタイズは出来るんだぞってことを身をもって証明すべく、\n\nそして、実績がなく悩んでるスクール生の成果を底上げすべく、\n\n講師ゆうすけが実績完全ゼロのジャンルで、完全リアルタイム実況を開始することにしました！\n\nスクールのサポートや他の業務もあるので、正直あまり時間は取れず片手間の運用にはなってしまうのですが、\n\nそのぶん本業やりながら発信していく人の参考にはなるかなと！\n\n1日1〜2時間くらいは頑張って時間作りつつ運用していくつもりです！\n\nちなみに、投資経験はマジでゼロです！\n\n積立NISAもちゃんと始めたのは去年からっていう感じのレベルですw\n\nなので実際にマネタイズをしていくのはかなり先になるかなと！\n\n長期的な売り上げを最大化するため、最低でも半年〜1年くらいは普通にプレイヤーとして運用しながら伸ばしていく予定です！\n\n実況に関しては、\n\n＃【講師実況】0からアカ育成\n\nというチャンネルを新しくdiscord内に設置しています！\n\nこちらのチャンネルで、運用の際考えてることやポストの意図など、\n\n思考の部分も共有しつつ実況していきますね！\n\nあと運用を見ていて気になったことや疑問などがあれば、なんでも聞いてくださいね！\n\n完全ゼロのアカウントからリアルタイムで伸ばしていく裏側見れる機会はそうそうないので、是非勉強しまくってください！ (編集済)\n2026年1月28日水曜日 14:59","sourceUrl":"","createdAt":"2026-01-27T15:22:09.237Z"},{"id":"scr-1779710258198-ueohdq","title":"[全体連絡] @everyone \n\n\n\nたった今X発信を再開しました！\n\n今後誰よりもXに本...","category":"instructor","content":"@everyone \n\n\n\nたった今X発信を再開しました！\n\n今後誰よりもXに本気で取り組んで、アホほどアカウント伸ばします。\n\n実際の運用からしか学べないことも山ほどあるので、必ず通知オンにして全て吸収してください。\n\n見ておけば分かりますが、ダントツで僕がX運用上手いので、死ぬほどセンス身につきます。\n\nまた、いいね、リプ、拡散。全員お願いします。久々の発信なので泣いて喜びます\n\nhttps://x.com/1namaiki/status/2018648181714895354?s=46&t=nMOQLopaop2m5XTqY_up8Q","sourceUrl":"","createdAt":"2026-02-03T11:30:49.638Z"},{"id":"scr-1779710258199-rmnwdt","title":"[全体連絡] @everyone \n\nアカウント復活したこともあって、再度スクール生のアカウン...","category":"instructor","content":"@everyone \n\nアカウント復活したこともあって、再度スクール生のアカウント徘徊してたんですが、\n\n特に1期生はもうローンチしても普通に1000万以上売れそうな人で溢れてますね！(体感70人以上は余裕でいます)\n\nたた、おそらく本人はそのポテンシャルに気付いておらず勿体ない、、、\n\n皆当たり前にX伸ばしてるからこそ感覚バグってますが、普通にフォロワー1000人いれば、\n\nちゃんとローンチしたら一撃500~1500万円くらいは売れるポテンシャルありますからね！\n\n(もちろんどういうフォロワー層かにもよりますが)\n\nちなみに、のんびりくんは、初ローンチ時フォロワー2000人で売上2500万円とかです。\n\n言うてそれも2年前で、ローンチ手法とかもかなり雑なやり方でnote販売→個別でその売上なので、セミナーとかも挟めば4000万くらいいけてたかなと。\n\nいや、マジで明らかにいけそうなのに、マネタイズビビってんのか何なのか分からないですが、そもそもローンチしようとすらしてない人多くて損してます。\n\nということで、ちょっとローンチ出来そうな人は僕から連絡していきますね。\n\n連絡された人は、即ローンチ準備に取り掛かってください。\n\np.s.\n\nXで絡んでくれるのは有難いのですが、パッとスクール生か判断が付かないので必ずDMにて以下の情報送ってください！\n\n・discord参加名\n・LINE名\n・お名前\n・スクールプラン\n\nリプなど来た時は、一旦DMに飛んで、こちらでスクール生かどうか把握してます。\n\n僕が把握出来てたら、今回のマネタイズの話もそうですが、アドバイスとかもかなりしやすくなるのでいいことしかないですよ。","sourceUrl":"","createdAt":"2026-02-04T05:31:39.239Z"},{"id":"scr-1779710258200-uqhtnf","title":"[全体連絡] @everyone \n\n普通にデベロゴンさんとかちゃんとローンチかましたら一撃3...","category":"instructor","content":"@everyone \n\n普通にデベロゴンさんとかちゃんとローンチかましたら一撃3000万くらいは売れますからねww\n\n個別サポート付いてる人は、当然ローンチもサポートするので、気軽にLINEしてください！\n\n特にマネタイズフェーズはコンテンツ見るだけじゃ中々難しいと思うのでガンガン頼って欲しいですね！","sourceUrl":"","createdAt":"2026-02-04T05:39:28.636Z"},{"id":"scr-1779710258200-yrftgz","title":"[全体連絡] @everyone\n\n【完全にフィーバータイムが来てます】\n\nこのポスト見ました...","category":"instructor","content":"@everyone\n\n【完全にフィーバータイムが来てます】\n\nこのポスト見ましたか？\n\n簡単に言うと、オンラインスクール事業が上場企業に30億で買収されたというニュース。\n\nhttps://x.com/1namaiki/status/2021128992670220473?s=46&t=nMOQLopaop2m5XTqY_up8Q\n\n\nいやマジでヤバいですよねww30億ですよ？孫の代まで何もせずとも養えるだけの金ですww\n\nそして、今回の上場企業だけじゃなくて、最近はどこの企業もスクールに力入れてます。\n\n最近だとキャバ嬢育成スクールとかも出てきてますしねww\n\nこの流れ、最大限に恩恵を受けられるのは誰か理解してますか？\n\nはい、そうです。\n\n皆さんです。\n\n上場企業も目つけてるオンラインスクールはますます流行り、今後売上拡大していきます。\n\nとなれば、オンラインスクール事業者も追い風を受けるのは勿論ですが、\n\nそのスクールを共に支え、アフィしていく集客者も当然ながら鬼の追い風です。\n\nかずくんが一夜にして30億を手にしたくらいの夢は掴めるか分かりませんが、\n\nそんなデカイ金が動く市場で1000万円、1億得るのはそんなに難しくないでしょう。\n\n僕も日々色んなビジネスを見てますが、どう考えても今はオンラインスクール事業が1番熱いです。\n\nただ、僕はまだまだこれからもスクール事業は流行ると思ってますが、\n\n激アツフィーバーはいつまで続くか分かりません。\n\nあとであの時頑張っときゃ良かった、、と後悔しても遅いです。\n\nなまいきスクール生は人生で片手で数える程度、いや、人によっては1回きりの絶好のチャンスに向き合ってます。\n\nボケーッとしてる暇は無いです。\n\nこの人生最大の幸運を無駄にしないよう引き続き一緒に頑張っていきましょう\n\np.s.\n\nなまいきスクールの提携先は・・・\n\n\n上場企業グループの会社も僕らについてます。\n\n流石にこれはブチアゲざるを得ないでしょう？","sourceUrl":"","createdAt":"2026-02-10T11:23:40.020Z"},{"id":"scr-1779710258201-rlnerc","title":"[全体連絡] @everyone \n\n緊急告知\n\n突然ですが、来週 【2/17 (火) の21...","category":"instructor","content":"@everyone \n\n緊急告知\n\n突然ですが、来週 【2/17 (火) の21:00～】より、\n\n\nなまいきスクール公認の内部セミナーとして\n\n【投資ジャンル強化講義・トレード特講】\n\nを開催します！\n\n\n\n投資ジャンルのアカウント運用において、\n\nもちろんインデックス投資などの長期投資を軸にした発信でも十分伸ばしていけるのですが、\n\nそれよりも変化を見せやすい「トレード（短期投資）」の発信ができれば\n\nよりアカウントを伸ばしやすくなり、発信の戦略にも幅をもたせることが出来ます！\n\n\n\nそして今回、講師としてレクチャーしてくれるのは...\n\n\n現在投資ジャンルでアカウントを爆伸びさせている、だりおさんです！\nhttps://x.com/dalio_trader\n\n\nダリオさんは20代で億り人達成、現在はバンコクに移住しFIRE生活していて、\n\nFXや株式、仮想通貨の投資で月100万くらいはコンスタントに稼いでいる投資プレイヤーです！\n\n\n投資アカウントの方でも、トレードの実績を使いつつ上手くプレイヤー感を出していて、\n\n直近3日間だけでも＋1000人以上フォロワーを増やしてますね！\n\n\n\n今回はそんなだりおさんが、\n\nトレード初心者でも分かるように、投資のトレード手法に関して解説してくれます！\n\n\n投資ジャンルの方はもちろん、\n\n「Xで稼いだあとは投資もしてみたいと少し思ってる」\n「投資で月100万超えてる人のリアルな話を聞いてみたい」\n「実はちょっとトレードに興味があるかも」\n\nといった方も、せっかくの機会なのでぜひご参加ください！\n\n\n※アーカイブは残す予定ですが、公開は少し先になるかもしれません\n\n\n\n---------【ワークショップ内容（予定）】------------------\n\n主にテクニカル分析（チャートを使ったトレード）に関する内容になります。\n\n・テクニカル分析の基礎知識\n　→移動平均線やチャートの見方など\n\n・どうすればトレードで勝てるか\n\n・買い（売り）のタイミング\n\n・トレードの練習について\n　→そもそも練習ってどうすればいいのか\n　→練習に使えるツール\n\n・だりおさんに自由に質問\n\n\n※金融商品取引法に基づき、具体的な銘柄の推奨などは一切いたしません。\n　あくまで一般的な知識提供の範囲となります。\n\n　また、投資に関しては全て自己責任となりますので、\n　もし投資をする際には各自の判断にてお願い致します！\n\n-----------------------------------------------------------\n\n\nご都合のつく方は、今すぐ【2/17 (火) の21:00～】にカレンダーの予定を入れてお待ち下さい","sourceUrl":"","createdAt":"2026-02-13T06:52:50.417Z"},{"id":"scr-1779710258202-gcpsgl","title":"[全体連絡] @everyone   緊急告知  突然ですが、来週 【2/17 (火) の21...","category":"instructor","content":"@everyone   緊急告知  突然ですが、来週 【2/17 (火) の21:00～】より、   なまいきスクール公認の内部セミナーとして  【投資ジャンル強化講義・トレード特講】  を開催します！    投資ジャンルのアカウント運用において、  もちろんインデックス投資などの長期投資を軸にした発信でも十分伸ばしていけるのですが、  それよりも変化を見せやすい「トレード（短期投資）」の発信ができれば  よりアカウントを伸ばしやすくなり、発信の戦略にも幅をもたせることが出来ます！    そして今回、講師としてレクチャーしてくれるのは...   現在投資ジャンルでアカウントを爆伸びさせている、だりおさんです！ https://x.com/dalio_trader   ダリオさんは20代で億り人達成、現在はバンコクに移住しFIRE生活していて、  FXや株式、仮想通貨の投資で月100万くらいはコンスタントに稼いでいる投資プレイヤーです！   投資アカウントの方でも、トレードの実績を使いつつ上手くプレイヤー感を出していて、  直近3日間だけでも＋1000人以上フォロワーを増やしてますね！    今回はそんなだりおさんが、  トレード初心者でも分かるように、投資のトレード手法に関して解説してくれます！   投資ジャンルの方はもちろん、  「Xで稼いだあとは投資もしてみたいと少し思ってる」 「投資で月100万超えてる人のリアルな話を聞いてみたい」 「実はちょっとトレードに興味があるかも」  といった方も、せっかくの機会なのでぜひご参加ください！   ※アーカイブは残す予定ですが、公開は少し先になるかもしれません    ---------【ワークショップ内容（予定）】------------------  主にテクニカル分析（チャートを使ったトレード）に関する内容になります。  ・テクニカル分析の基礎知識 　→移動平均線やチャートの見方など  ・どうすればトレードで勝てるか  ・買い（売り）のタイミング  ・トレードの練習について 　→そもそも練習ってどうすればいいのか 　→練習に使えるツール  ・だりおさんに自由に質問   ※金融商品取引法に基づき、具体的な銘柄の推奨などは一切いたしません。 　あくまで一般的な知識提供の範囲となります。  　また、投資に関しては全て自己責任となりますので、 　もし投資をする際には各自の判断にてお願い致します！  -----------------------------------------------------------   ご都合のつく方は、今すぐ【2/17 (火) の21:00～】にカレンダーの予定を入れてお待ち下さい","sourceUrl":"","createdAt":"2026-02-17T09:41:55.474Z"},{"id":"scr-1779710258202-qbumog","title":"[全体連絡] @everyone \n【投資ジャンル強化講義・トレード特講】\n\nまもなく開始しま...","category":"instructor","content":"@everyone \n【投資ジャンル強化講義・トレード特講】\n\nまもなく開始します！\n\nZoom ミーティングに参加する\nhttps://us06web.zoom.us/j/88307189029?pwd=bOJgpMauKjmvbuGxLU5ydyUCOljtSZ.1\n\nミーティング ID: 883 0718 9029\nパスコード: 284341","sourceUrl":"","createdAt":"2026-02-17T12:01:57.471Z"},{"id":"scr-1779710258203-kwsoxn","title":"[全体連絡] @everyone \n\nこのポストですが、僕の初心者時代が知れて、結構参考になる...","category":"instructor","content":"@everyone \n\nこのポストですが、僕の初心者時代が知れて、結構参考になるかもです！\n\nこれ読んだら雑談部屋とかに率直に思った感想とか送ってもらえると反応見れて楽しいので、是非待ってますー！\n\nhttps://x.com/tamao_neet/status/2023712179028193537?s=46&t=nMOQLopaop2m5XTqY_up8Q","sourceUrl":"","createdAt":"2026-02-17T17:14:12.988Z"},{"id":"scr-1779710258204-bhjkgl","title":"[全体連絡] @everyone \n現在ClaudeCodeなどが話題ですが、これからなまいき...","category":"instructor","content":"@everyone \n現在ClaudeCodeなどが話題ですが、これからなまいきスクールでもガンガンAIを取り入れて、誰も追随できない最強のX運用集団を作り上げていきます。\n\nそこで、がっつりAIにコミットしてゴリゴリ開発していけるメンバーを募集します。\n\n求める人材：\n・業務にコミットできる（一日最低５時間～）\n・最低限のエンジニアリング知識\n・AIを駆使してスピード重視の開発ができる\n・新しいことをガンガン学び、最新技術を取り入れていける\n・自ら思考して提案が出来る\n\n業務内容：\nX運用関係の各種AIツールやシステム開発、データ収集・分析、業務効率化など\n\nちなみに、単なる外注や作業者ではなく、スクール運営側としての人材を募集します。\n\n現状でもなまいきスクール経済圏の売上は2桁億超え、今後は100億を超えてくるようなデカいビジネスにしていきます。\n\nそんな組織の中で、運営メンバーと密に関わりながらビジネスしていくことになるので、圧倒的な成長は約束されています。\n\n報酬は応相談かつ成果に応じて上げていくので、我こそはという方は個別のグループLINEで以下情報添えてご連絡お願いします！\n\n【AI開発チーム応募】\n・１日の業務可能時間：\n・エンジニアリング経験：\n・AI開発スキル：\n・意気込み：","sourceUrl":"","createdAt":"2026-02-23T08:35:20.309Z"},{"id":"scr-1779710258204-dtdfnd","title":"[全体連絡] @everyone \n重要・注意喚起\n\n他スクール生のLINEやセミナーなど、人...","category":"instructor","content":"@everyone \n重要・注意喚起\n\n他スクール生のLINEやセミナーなど、人のマネタイズ導線に入って\n【チャットのやりとりや面談予約をするのは絶対にNG】でお願いします！\n\nそういったチャットや面談を受ける行為は、\nスクール生やセールスマンの大切なリソースを\n無駄に消費させてしまう行為だというのを理解ください！","sourceUrl":"","createdAt":"2026-03-05T06:03:53.164Z"},{"id":"scr-1779710258205-zvhmvs","title":"[全体連絡] @everyone \n\nこちらの記事ですが、バズりやすいよう引用してもらえると嬉...","category":"instructor","content":"@everyone \n\nこちらの記事ですが、バズりやすいよう引用してもらえると嬉しいです\n\n特に記事は初動から載っかっておくと引用ポストも爆伸びするので激アツです！\n\nあとは、シンプルにどういう記事を作れば商品が売れるのか？\n\nマーケの理解度も上がると思うので、引用は嫌でも中身だけ必ず見ておくようにお願いします！(勿論引用して欲しいが)\n\n↓↓↓\n\nhttps://x.com/1namaiki/status/2033875280402780304?openExternalBrowser=","sourceUrl":"","createdAt":"2026-03-17T12:11:46.446Z"},{"id":"scr-1779710258205-ycmpsh","title":"[全体連絡] @everyone   こちらの記事ですが、バズりやすいよう引用してもらえると嬉...","category":"instructor","content":"@everyone   こちらの記事ですが、バズりやすいよう引用してもらえると嬉しいです  特に記事は初動から載っかっておくと引用ポストも爆伸びするので激アツです！  あとは、シンプルにどういう記事を作れば商品が売れるのか？  マーケの理解度も上がると思うので、引用は嫌でも中身だけ必ず見ておくようにお願いします！(勿論引用して欲しいが)  ↓↓↓  https://x.com/1namaiki/status/2033875280402780304?openExternalBrowser=","sourceUrl":"","createdAt":"2026-03-17T12:18:30.825Z"},{"id":"scr-1779710258206-zvkeee","title":"[全体連絡] @everyone \n\nあ、せっかくなんで、エンタメ感あった方が僕も見てて楽しい...","category":"instructor","content":"@everyone \n\nあ、せっかくなんで、エンタメ感あった方が僕も見てて楽しいので、記事の引用してくれた人で、トップ3にバズった人達でご飯会することにします！\n\n高級鮨でも一緒に食べましょう！\n\nただ当たり前ですが、ガチでディスブラになる内容はNGで！\n\nそれ以外は何でもOKです！\n\n集計タイミングは、3/19の21時、何回でも引用して大丈夫です！\n\nということで、誰と一緒にご飯食べに行くことになるのか、僕も楽しみに見ておきます","sourceUrl":"","createdAt":"2026-03-17T12:44:27.397Z"},{"id":"scr-1779710258207-bhrdvb","title":"[全体連絡] @everyone \n\n緊急でオフ会の募集とか、合宿の案内などの全体連絡送る時と...","category":"instructor","content":"@everyone \n\n緊急でオフ会の募集とか、合宿の案内などの全体連絡送る時とか、discordよりもオプチャの方が良かったりします？\n\n昨日の全体連絡もそうですが、discordだとちょっと見るの遅れちゃいますみたいな声もチラホラあったので、\n\nもしオプチャの方が良さそうだったら、全体配信用にそちら作ろうかなと！\n\nオプチャも合った方がいいよー！って人はスタンプ送ってください！","sourceUrl":"","createdAt":"2026-03-18T12:05:51.917Z"},{"id":"scr-1779710258207-cauwhc","title":"[全体連絡] @everyone \n\nポストでは触れたんですが、最近発信に加え、皆が最大限成果...","category":"instructor","content":"@everyone \n\nポストでは触れたんですが、最近発信に加え、皆が最大限成果出せるよう裏側の仕組み作りや、サポートに励んでいたのですが、\n\n若干疲労が溜まりすぎてるのか、体がバグってしまいました。\n\n別に重度ではないし、全く動けないとかはないのですが、これ以上悪化しないよう一旦発信の方だけは止めようと思い、ご連絡しています。\n\nログアウトではなく、アカウントを消す理由なのですが、単純にアカウントパワーを落とさないためなので、それ以上深い理由はないです。\n\nまた、講義やサポートについては引き続き問題なく行っていくし、そのための一時発信中止なので、その点はご安心ください\n\nポスト↓↓↓(ちょっとしたらアカウント削除するので見えなくなります)\n\nhttps://x.com/1namaiki/status/2036760837785088008?s=46&t=nMOQLopaop2m5XTqY_up8Q","sourceUrl":"","createdAt":"2026-03-25T11:14:46.835Z"},{"id":"scr-1779710258208-bmalsp","title":"[全体連絡] アカウントは消すのはこういう事情なので、もし上のメッセージ見てなくてなんで消した...","category":"instructor","content":"アカウントは消すのはこういう事情なので、もし上のメッセージ見てなくてなんで消したの？みたいになってるスクール生いたら教えてあげてください\n\n僕が飛んだみたいになるとめちゃ不安になると思うので","sourceUrl":"","createdAt":"2026-03-25T11:27:41.331Z"},{"id":"scr-1779710258208-imqguq","title":"[全体連絡] @everyone \n\n以前にも連絡してる通りですが、健全なコミュニティを維持す...","category":"instructor","content":"@everyone \n\n以前にも連絡してる通りですが、健全なコミュニティを維持するため、\n\nスクール生同士の売り込み行為、外部誘導は一切禁止です！\n\n高単価アフィに関してもスクール生を流したとて無効になりますのでこちら厳重注意でお願いします！\n\nまた、セールス行為は勿論、万が一怪しい行為を行ってる人を見かけたら直ちに運営まで報告お願いします","sourceUrl":"","createdAt":"2026-03-29T11:52:02.731Z"},{"id":"scr-1779710258209-mxmcva","title":"[全体連絡] @everyone   あ、せっかくなんで、エンタメ感あった方が僕も見てて楽しい...","category":"instructor","content":"@everyone   あ、せっかくなんで、エンタメ感あった方が僕も見てて楽しいので、記事の引用してくれた人で、トップ3にバズった人達でご飯会することにします！  高級鮨でも一緒に食べましょう！  ただ当たり前ですが、ガチでディスブラになる内容はNGで！  それ以外は何でもOKです！  集計タイミングは、3/19の21時、何回でも引用して大丈夫です！  ということで、誰と一緒にご飯食べに行くことになるのか、僕も楽しみに見ておきます","sourceUrl":"","createdAt":"2026-03-31T06:57:23.734Z"},{"id":"scr-1779710258210-tqfsbr","title":"[全体連絡] @everyone \n\nないとは思いますが、明らかな嘘を付いたり、売上画面の捏造...","category":"instructor","content":"@everyone \n\nないとは思いますが、明らかな嘘を付いたり、売上画面の捏造したりで、\n\n反応取るためなら何でもやっていい精神で発信すると、長期的に見た時に1番大事なアカウントの信頼が削れますし、\n\n自分1人だけでなく、周りのスクール生や提携先にも多大な迷惑をかけるので、\n\n興味付けを最大化させたい気持ちは分かりますが、節度を保って発信に当たってくださいね！\n\nまた、この辺のラインは自分じゃ中々判断出来ないかもなので、危うそうであれば運営からも注意していくので、その際は素直に改善するようお願いします！\n\n全員が自信を持って、このコミュニティは誠実にビジネスに取り組んでると、心の底から言えるような環境を作り上げていきましょう","sourceUrl":"","createdAt":"2026-04-23T12:11:01.715Z"},{"id":"scr-1779710258210-jzbjbk","title":"[全体連絡] @everyone \n\n運用しているアカウント全てで下記の情報をなまいきくんのD...","category":"instructor","content":"@everyone \n\n運用しているアカウント全てで下記の情報をなまいきくんのDM宛に送ってください！\n\n・discord参加名\n・LINE名\n・お名前\n・スクールプラン\n・スクール入会時期(ザックリでOK)\n\nTLに流れてきた発信もスクール生なら極力いいね押してるのですが、\n\nそもそもスクール生か分からないと何も出来ないので必ず今のうちにお願いします！ (編集済)\n2026年4月28日火曜日 12:56","sourceUrl":"","createdAt":"2026-04-28T03:51:37.010Z"},{"id":"scr-1779710258211-zspeng","title":"[なまいきコラム] ただの一人言。\n\nXにてちょっとなまいきスクール生の仲間として、一緒に頑張ってい...","category":"instructor","content":"ただの一人言。\n\nXにてちょっとなまいきスクール生の仲間として、一緒に頑張っていくには、若干相応しくない他責発言する人がいたが、\n\n僕が注意することなく、スクール生が指摘してくれてたらしく、無事収まっててナイス。\n\n指摘されてすぐに改めたスクール生も素晴らしい。\n\n結果を出していくには、スクール全体の空気感が大事になってくるからこそ、僕が出しゃばらずともお互いに空気感を良くしようとしてるのは本当に神。\n\nいい仲間が揃ってきたなという感覚があります。\n\nこれからも皆で一緒に最高の環境を作るべく、相互でいい影響を与えていけるような関係でありたいですね！","sourceUrl":"","createdAt":"2025-08-11T13:32:51.035Z"},{"id":"scr-1779710258212-ncmkzr","title":"[なまいきコラム] 【オススメ本の紹介】\n\nなまいきマインドが30講あるので、初回授業の23日まで暇...","category":"instructor","content":"【オススメ本の紹介】\n\nなまいきマインドが30講あるので、初回授業の23日まで暇すぎる！ってことはないと思うのですが、\n\nもしやる気ゴリゴリあって、何かやっておきたい！というなら、この本読んでおくのオススメです。\n\n僕自身、この本に出会って、本気で成果出すのに必要なのは気合いや根性ではなく、自分を動かす仕組み(習慣)であるということを理解して、\n\nそこから何事もそんな大して苦労することなく、成果を出せるようになりました。\n\nあと、なまいきアカのポストでよく「中身はもはやこだわり過ぎなくていいから、とりあえず1日5ポストはしよう」って言ってる意味がこれ読めば分かるかなと。\n\nあまり今後本を勧めることはないと思いますが、こちらに関してはかなりオススメなので、もし時間に余裕があれば、読んでみてください！\n\ndiscordを案内したグループLINEにて、アウトプットも待ってますね！ (編集済)\n2025年8月17日日曜日 2:48","sourceUrl":"","createdAt":"2025-08-16T17:46:20.086Z"},{"id":"scr-1779710258212-qamcgj","title":"[なまいきコラム] 【結果を出す人と出せない人の決定的な違い】\n\n30DAYSマインド講座は見てます...","category":"instructor","content":"【結果を出す人と出せない人の決定的な違い】\n\n30DAYSマインド講座は見てますか？\n\nあちらはマインド講座と銘打ってますが、Xマネタイズの基礎も一通り学べるまさにはじめたての今の時期には持ってこいの神動画講義になってます。\n\nもうこれでもかってくらい僕の思考を存分に語り尽くしてるので、\n\n是非1度聞いて終わりじゃなくて家事の合間や、散歩中など暇さえあれば聞いてもらって、徹底的にマインドを刷り込ませてください。\n\nそして、今回はあちらのマインド教材に入れてなかったが、絶対に知っておくべき、結果が出る人の考え方を共有します。\n\n成功する人と、いつまでも足踏みしている人両者を分ける差は、才能でも知識量でもありません。\n\nたったひとつの思考法です。\n\nそれは「準備はほどほどに、まずは行動。そしてその後に修正」\n \n・結果が出ない人の共通点\n\n結果が出ない人は、例外なく「準備の段階」で止まります。\n\n「もっと知識をつけてから」「環境を整えてから……」\n\nそうやって完璧なスタートを夢見て、結局いつまでも走り出せない。\n\n完璧な準備なんて、そもそも存在しないのに、、\n\n・結果を出す人の思考\n\n一方で成果を出す人は違います。未完成でも構わない。とにかく走り出す。そこで得たリアルな経験こそが、最高の教材になると知っているから。\n\n行動はゴールを一発で射抜くためのものではたりません。まず撃つことで的とのズレを知り、そこから調整していくためにあります。\n\n・実例から学べ\n\n僕自身が運営しているなまいきビジネススクールもこのマインドで取り組んでます。\n\nもちろんカリキュラムは用意していますが、受講生のレベルも市場の変化も、事前に完璧に予測なんてできません。\n\nだからこそ、実践を通して常に修正、改善を繰り返す。\n\n一度完成させたら終わりなんて思考は持ち合わせてないです。これから皆の反応やチームメンバーの成果を見て全力でブラッシュアップしていこうと思ってます。\n\n・メッセージ\n\n完璧を求めて止まる人は、一生動けません。\n30%の完成度でいい。とにかく一歩を踏み出すこと。\n\nそして、行動から得た気づきを武器に調整し続ければいいです。\n\n行動 → フィードバック → 修正 → 成果\n\nこれが結果を出す人の唯一の道。\nあなたが本気で変わりたいなら、今日から未完成のまま動く勇気を持ってください！","sourceUrl":"","createdAt":"2025-08-17T04:08:44.490Z"},{"id":"scr-1779710258213-qauvhw","title":"[なまいきコラム] 【高単価アフィ開始1ヶ月でゆるゆる実践して売上340万円達成した主婦アカ公開】\n...","category":"instructor","content":"【高単価アフィ開始1ヶ月でゆるゆる実践して売上340万円達成した主婦アカ公開】\n\nまた今度、ちゃんとまとめようかなと思いますが、\n\nこの写真のポストで言ってる150リストで売上440万円達成してる主婦は2枚目の写真のぴよまるさんですね！\n\n田中とは違いXステップの頻度もかなり少なく、割とゆるゆるやってますが、普通に上手くいってるので、\n\n今後のマネタイズのイメージつけるためにもアカウントウォッチ推奨です！\n\n今回スクールのサポートにも入ってもらってるので、またどこかでちゃんと紹介もしますね！\n\n特に女性の方はめちゃ心強い味方になってくれると思います！\n\nぴよまるアカウント\nhttps://x.com/piyomaru_sedori?s=21&t=nMOQLopaop2m5XTqY_up8Q","sourceUrl":"","createdAt":"2025-08-22T12:05:14.768Z"},{"id":"scr-1779710258214-mtsiuh","title":"[なまいきコラム] Xだけで累計5億以上稼いでて、様々な教材\nを辛口レビューしてる沖さんからThe....","category":"instructor","content":"Xだけで累計5億以上稼いでて、様々な教材\nを辛口レビューしてる沖さんからThe.Xを褒めていただいてますが、\n\nスクールで伝えていく内容はThe.Xをさらにブラッシュアップしたものになるので、これを勉強出来る皆はラッキーですね。\n\nこれからの講義の内容をガチで吸収してもらえれば最強になるのは間違いないので引き続き頑張りましょう","sourceUrl":"","createdAt":"2025-09-07T09:57:14.402Z"},{"id":"scr-1779710258214-yjqgcc","title":"[なまいきコラム] @everyone \n\n完全実績ゼロからでも超再現性高く、月100万円超え達成出...","category":"instructor","content":"@everyone \n\n完全実績ゼロからでも超再現性高く、月100万円超え達成出来る、完全ロードマップを作るべく研究中。\n\n草津で温泉に浸かりながら、全ての邪念を断ち切って全力で思考してたら見えてきました。\n\nあのジャンルなら可能かも。まだ仮説の段階なので、今から3ヶ月間くらいかけて検証していきます。\n\nまた進捗あれば報告していきます。","sourceUrl":"","createdAt":"2025-10-23T06:40:32.678Z"},{"id":"scr-1779710258215-majrbi","title":"[雑談部屋] @Yusuke＠講師   【運営の方へ】 お世話になっております 2点、お尋ねし...","category":"instructor","content":"@Yusuke＠講師   【運営の方へ】 お世話になっております 2点、お尋ねしたいことがございます。  ①外部のXポスト・リンクの送信について  先ほど｢シャドウバンの対処法｣についてスクール生どうしでやり取りがありました。  その際に僕が｢スクール生以外のポスト・外部リンク｣を共有したのですが、 運営に確認せずに自己判断で行うべきではない旨の指摘を受け、たしかにその通りだと思い、削除いたしました。  改めて｢外部のXポストやリンクの送信｣の運営側から基準をいただけたら幸いです。 (ルールがまとまっているNotionなどあれば、共有いただけると嬉しいです)  ②問い合わせ先について この連絡をするにあたり送信先(LINE/Discord)を探したのですが、見つけることができませんでした… 聞き逃しているだけだったら大変申し訳ないのですが、改めて｢お問い合わせ先｣についてアナウンスしていただけると大変助かります…！  お忙しい中 大変恐縮ですが、ご確認よろしくお願い致します (編集済)\n2025年8月16日土曜日 18:02","sourc ,{"id":"scr-1779710258229-llddcx","title":"[雑談部屋] あ、うつ病、手帳持ち、過度なネガティブ発言この辺もかなり取り扱い注意です！\n\n基...","category":"instructor","content":"あ、うつ病、手帳持ち、過度なネガティブ発言この辺もかなり取り扱い注意です！\n\n基本発信はポジティブ9割で、たまに緩急とし、ネガティブ要素入れてもよい、ただ、必ずポジティブな締めで終わらせること。\n\nこちら意識するといいですね！","sourceUrl":"","createdAt":"2025-11-07T08:45:51.893Z"},{"id":"scr-1779710258229-dgckzg","title":"[雑談部屋] @なまいきくん さん  お世話になります！  いつもありがとうございます  先程...","category":"instructor","content":"@なまいきくん さん  お世話になります！  いつもありがとうございます  先程、第12回の講義のスライドをアップしていただいたと思いますが、その前の第11回の講義のスライドを見たいのですがお願いできますでしょうか？ お忙しいところ申し訳ございませんが、よろしくお願いいたします。","sourceUrl":"","createdAt":"2025-11-09T04:46:29.622Z"},{"id":"scr-1779710258230-zhhkvc","title":"[雑談部屋] こういう揉め事とかゴシップみたいなのは別に見たくない人も多いのでDiscordに...","category":"instructor","content":"こういう揉め事とかゴシップみたいなのは別に見たくない人も多いのでDiscordにあげないで欲しいですね！\n\nあと揉めるのは別に勝手ではありますが、なまいきスクールという肩書を背負う以上他のメンバーにも迷惑をかけてしまうかもしれないリスクがあることだけは頭に入れておいてください！","sourceUrl":"","createdAt":"2025-11-11T08:20:03.885Z"},{"id":"scr-1779710258231-snznhs","title":"[雑談部屋] @なまいきくん  @あか@運営   夜分遅く失礼します。 オプちゃの方で通知があ...","category":"instructor","content":"@なまいきくん  @あか@運営   夜分遅く失礼します。 オプちゃの方で通知があって寝ぼけながらdiscord追加しちゃったんですけど、偽物っぽい感じですよね？discordからめっちゃよく分からないLINE誘導してるみたいなので","sourceUrl":"","createdAt":"2025-11-13T05:09:07.231Z"},{"id":"scr-1779710258231-kgurap","title":"[雑談部屋] 全体連絡に送った通りですが、ここをもっとこうしたらよりスクールが良くなりそう！み...","category":"instructor","content":"全体連絡に送った通りですが、ここをもっとこうしたらよりスクールが良くなりそう！みたいな意見はバンバンLINEまで送ってもらえると助かります！\n\nまた、万が一不満や心配事があるならそちらも気軽に送ってください！\n\n出来るだけ意見は汲み取って、改善に努めます！","sourceUrl":"","createdAt":"2025-11-16T15:03:45.560Z"},{"id":"scr-1779710258232-dojfnd","title":"[雑談部屋] これ講義か、講義終わりの雑談タイムで言ったことではあるんですが、\n\n本当に実績ほ...","category":"instructor","content":"これ講義か、講義終わりの雑談タイムで言ったことではあるんですが、\n\n本当に実績ほぼなくて、リアルに現状へっぽこみたいな人が、\n\nガチの無能とか、ポンコツとか、低脳みたいなのプロフやポストで推すのはやめた方がいいですよ！\n\nあれが有効なのは、例えるなら明らかにモテる見た目、雰囲気の人が、全然モテないんですと自虐カマスことで、余計モテる感が出せるみたいな感じで\n\nガチで非モテな人が、俺はモテないんです！ゴミです！女の子に相手にもされません！みたいなの主張しても、そりゃそうやろ、、とか、まあキモイし関わらんとこ、、みたいになるのと同じです。\n\n仮にAI系なら、無能。AI最近触り始めた人。みたいなプロフではなくて、\n\nAI極めて〇〇する人、みたいな方がまだフォローされやすさも、発信の追われやすさも上がりますね！\n\nこちらスクール生のプロフ見てると、かなりやってる人いるので、是非見直してみてください！\n\nそして、もし、これ合ってるんか分からん、、みたいなのあれば、質問部屋で投げてください！\n\n講師陣で確認して、アンサーします！","sourceUrl":"","createdAt":"2025-11-17T07:21:48.626Z"},{"id":"scr-1779710258232-glfitb","title":"[雑談部屋] @everyone \n\n軽い気持ちでtipsアフィしてる人いますが、商品売る=業...","category":"instructor","content":"@everyone \n\n軽い気持ちでtipsアフィしてる人いますが、商品売る=業者感の塊で\n\nせっかくのプレイヤー感が台無しになるので、\n\n長期的に売上最大化するなら、最初はtipsアフィしない方がいいですね、、、\n\n(業者感出る→フォロワー数も伸び悩む→今後リスト取れにくくなる→将来的にセールスかけられるお客さんが減る→長期的な売上減)\n\nまあ目先のお金がないと生活がどうにもならない、、みたいな人だったら、\n\n将来的な資産削りつつ、目先のキャッシュ生み出せばいいかなとは思いますが、基本オススメはしないですね！\n\nアカウント伸ばすフェーズから、マネタイズフェーズまで4ヶ月開けてるのもこういう理由もあるので、(本当は半年くらい運用フェーズ取りたい)\n\n独断でマネタイズフェーズに入ってる人もいますが、当然その分だけデメリットもあるということだけ把握しておいてくださいね！\n\nそれをわかった上で、小さくても早くマネタイズしたいから、tipsアフィやるとかは勿論ＯＫです！","sourceUrl":"","createdAt":"2025-11-25T07:15:13.197Z"},{"id":"scr-1779710258233-cbzfyi","title":"[雑談部屋] ちなみに、参考までに既に物販系で高単価アフィやってる田中とシンくんの例でいうと\n...","category":"instructor","content":"ちなみに、参考までに既に物販系で高単価アフィやってる田中とシンくんの例でいうと\n\n田中\nフォロワー:3000人(2000人のまあまあ強めのアカウントを買収後フォロワー+1000人)\nリスト:月1200リスト\n月売上:870万円\n\nシンくん\nフォロワー:既存リストに対してのアプローチのため不明\nリスト:月619\n月売上:1119万円\n\nって感じですね！！\n\n田中の場合はスピード重視で雑にリスト取りまくってて、見込み上げとか対して意識してなかった(出来なかった)ので、リスト単価が1万円下回ってる感じですね！\n\nシンくんの場合は、適切に見込み上げ(教育)してるので、リスト単価2万円近く出てるって感じですね！\n\nただ、どちらにせよ月1000万超えるくらい売るなら、リスト600~1000は欲しいですね！\n\nフォロワーからリストへの移行率は大体30~50%なので、そっから逆算すれば、月1000万円売るためのフォロワー数は2000~2500ってことになりますね！\n\nなので、皆が目指すべき数字はこの辺って感じになりますね！(月1000目指すなら)\n\n月500万円の売上なら単純に全ての数字が半分になるので、フォロワー1000~1250くらいかなと！\n\n皆一旦この辺は目指して欲しいなと僕は思ってます！","sourceUrl":"","createdAt":"2025-11-25T11:29:01.106Z"},{"id":"scr-1779710258233-pzuxel","title":"[雑談部屋] 追記:: ある程度8月からXやってる人は今なら分かると思いますが、買収はマジでバ...","category":"instructor","content":"追記:: ある程度8月からXやってる人は今なら分かると思いますが、買収はマジでバクですww\n\nなまいきスクール入らず普通にやってたらフォロワー500にするのに1年くらいかかるのですが、\n\n500人のアカウント買っちゃえば、3日とかでフォロワー500達成しちゃうのでww\n\nなので、僕は基本的に買えるならもうほぼ全て買収してますね！\n\n株式投資で1年で1億増やしてますし、他の投資も調べてますが、僕はXのアカウントの買収ほど、費用対効果高い投資は知らないですww\n\n実際田中のアカウントも30万円で買って、その翌々月には870万円の売上なので、意味わからんですねww\n\n今ある程度、運用学んで、運用上手い人とヘボい人の解像度も上がってると思うので、\n\n今この機会で再度買収アカ探してみるとかありですね！\n\n3ヶ月前だったらそもそもいいアカウントか見極め出来なかったと思いますが、\n\n今は単純に僕が講義で話してる内容を実践出来てるアカウントか？を見ていけば、強いアカウントかどうか判断出来るので、だいぶ見え方変わってるかなと！","sourceUrl":"","createdAt":"2025-11-25T11:34:14.868Z"},{"id":"scr-1779710258234-ixmzvh","title":"[雑談部屋] 成果報告部屋でコメントくれた皆さんありがとうございました  全部目を通させてもら...","category":"instructor","content":"成果報告部屋でコメントくれた皆さんありがとうございました  全部目を通させてもらったんですが、全員に返信させてもらうと、成果方区部屋がすごい流れそうだったので、ありがたくコメント読ませていただきスタンプだけさせてもらいました笑  Xでも皆さんに、ちょいちょい、いいねさせていただくので、よろしくお願いします (編集済)\n2025年11月25日火曜日 21:13","sourceUrl":"","createdAt":"2025-11-25T12:13:42.127Z"},{"id":"scr-1779710258235-bcifhb","title":"[雑談部屋] みんなへ\n\n皆がバチバチに成果出しまくる仕組み整えて、2ヶ月以内になまいきくん復...","category":"instructor","content":"みんなへ\n\n皆がバチバチに成果出しまくる仕組み整えて、2ヶ月以内になまいきくん復活させるので、その時までにX盛り上げまくっててください\n\n復活した時に反応薄いとショックなのでwwww","sourceUrl":"","createdAt":"2025-11-27T03:49:19.479Z"},{"id":"scr-1779710258235-dyxmbf","title":"[雑談部屋] 最近雑談部屋なんか会話というより個人の呟きみたいなのが増えてますねww\n\n既読数...","category":"instructor","content":"最近雑談部屋なんか会話というより個人の呟きみたいなのが増えてますねww\n\n既読数とか見えないからあんま実感ないかもですが、一応500人以上見てる場所なので、コミュニケーション意識しましょう！\n\nもし特に使うこと無さそうなら、このルーム自体消しますww","sourceUrl":"","createdAt":"2025-11-28T13:52:53.543Z"},{"id":"scr-1779710258236-uuqfow","title":"[雑談部屋] これワンチャンこのスクール入ったばっかりの人にとって励みになるかもなのでボクも1...","category":"instructor","content":"これワンチャンこのスクール入ったばっかりの人にとって励みになるかもなのでボクも1年分のインプ置いておきますが、マジでスクール入ってから言われたリプ・いいね回りの初期運用から興味づけ発信始めてから明らかに伸びが変わってるんで皆頑張りましょ。ぶち上げましょ。そんでこの8月中旬以降からの伸びで高単価アフィに頼ることなく500万以上稼げたんで、このスクール加入代は速攻ペイできます。マジで神スクール。","sourceUrl":"","createdAt":"2025-11-29T11:40:38.708Z"},{"id":"scr-1779710258237-dvunya","title":"[雑談部屋] ちなみに田中本来2時間でこれるとこを永遠に迷って5時間かけてぜえぜえ言いながら到...","category":"instructor","content":"ちなみに田中本来2時間でこれるとこを永遠に迷って5時間かけてぜえぜえ言いながら到着しましたねwwそして最近ぽっきーの箱に入れてた50万円を間違ってすてちゃったらしいです。相変わらずへっぽこですねw","sourceUrl":"","createdAt":"2025-12-11T13:09:46.958Z"},{"id":"scr-1779710258237-aagusf","title":"[雑談部屋] 雑談部屋で失礼しますが、 ガチで、僕はなまいきさんの元で人生を変えました。  よ...","category":"instructor","content":"雑談部屋で失礼しますが、 ガチで、僕はなまいきさんの元で人生を変えました。  よく聞かれるんですが、本当に「サラリーマンをしながら」です。  熱量下がってる人がいたらしたら、まじでもったいないです。  人生が変わるタイミングなんてそうそう来るものではありませんし、最後の掴むのは結局は自分です。  僕も最近怠け過ぎてたんですが、プライドとか全部捨てて、シンプルにできることを頑張ろうと思ってます。  講義とか、いつもなまいきさんの隣にいるんで、サブ講師的な立ち位置に見えるかもですが、まったくそんなはなく、ごりごりのここにいるみなさんと同じ立場のまだまだ思考錯誤しながら進んでるプレイヤーです。  一緒に頑張りましょう！ https://x.com/nonbiri485/status/2013884835253965082?s=20","sourceUrl":"","createdAt":"2026-01-30T04:26:58.893Z"},{"id":"scr-1779710258238-kvcjvi","title":"[雑談部屋] @everyone\n提携先も気合い入りまくってますね、、\n\n何度も言ってますが、...","category":"instructor","content":"@everyone\n提携先も気合い入りまくってますね、、\n\n何度も言ってますが、高単価アフィは、集客者、セールスマン、サポート、なまいき運営、全員が一丸となって行うチーム戦です。\n\n誰か1人だけ頑張っても成果は最大化されないので、引き続き1人1人がチームのために頑張っていきたいですね！","sourceUrl":"","createdAt":"2026-02-07T07:22:13.069Z"},{"id":"scr-1779710258238-uudybl","title":"[雑談部屋] 多分皆が想像してる10倍は、各所で命削りながら成果を出すために本気になってる人が...","category":"instructor","content":"多分皆が想像してる10倍は、各所で命削りながら成果を出すために本気になってる人がいますね。\n\n基準値は上に合わせない限り、いつまで経っても雑魚なので、僕も頑張るので一緒に頑張っていきましょう","sourceUrl":"","createdAt":"2026-02-07T07:32:44.246Z"},{"id":"scr-1779710258239-eucnyy","title":"[雑談部屋] @everyone\n\n最近変な自己流に走ってる人いますが、絶対辞めたがいいですよ...","category":"instructor","content":"@everyone\n\n最近変な自己流に走ってる人いますが、絶対辞めたがいいですよ！\n\n基本的には講義に忠実に。これは決して具体部分をパクれという話ではなくて、\n\nアカウント立ち上げから初期のフェーズの立ち回り方とか、逆三角形の考えとか、大きな全体の流れの部分ですね！\n\n変に薄い記事量産して、フォロワー集めたりしてる人もいますが、ビビるくらい薄いリストしか来ないのでフォロワーは増えても大して売れません。\n\n(逆三角形の上の方に薄いやつがいっぱいいる状態で下には大して落ちてこない。落ちてきても渋いリストだら単価・成約率低い)\n\nもしかしたらKくんとかも参考にしてる人いるかもですが、あの薄いノウハウを連発するスタイルもマジで推奨しないです。\n\n4ヶ月で3億売ったって数字だけ見ると、正しそうに見えますが、僕のやり方だと4ヶ月で6億はいってました。\n\n実際、同じリスト数で僕とKくんの売上は3倍以上差があります。\n\nてな感じで、短期的な目線で、なんかあのやり方上手くいってそう！そっちいこ！みたいなことしてたら、マジで成果最大化されないので、\n\n絶対に講義通りやってください。\n\nもうXマーケを俺より極めてる人いないので。変なことするな。なまいき式に忠実に。\n\n変な自己流してる人となまいき式に忠実な人は今は差が見えにくいかもですが、1年後とかには大きく結果に現れてますよ。\n\n俺は言ったんでね。","sourceUrl":"","createdAt":"2026-02-20T05:43:11.710Z"},{"id":"scr-1779710258240-hklrhi","title":"[雑談部屋] @everyone \n\nこれ講義では言ってるのですが、当たり前ですが僕の発信も皆...","category":"instructor","content":"@everyone \n\nこれ講義では言ってるのですが、当たり前ですが僕の発信も皆と同様、基本的には新規集客を行うためのもので、サポート用ではないため、\n\n講義で言ってることと若干違うこともありますが、必ず講義やこちらのdiscordの情報を参照するようにお願いします！\n\nhttps://x.com/1namaiki/status/2032440384165695908?s=46&t=nMOQLopaop2m5XTqY_up8Q\n\nこちらとかあえて説明用にポストしたのですが、当然ながらAI系でAIスゲェ！って一生驚いてるのは当たり前にベストではないので、\n\n内容の表面的な情報を真に受けず、どういう目的でこのポストをしてるんだろう？という発信者目線で、日頃のポストを見るようにしてください！","sourceUrl":"","createdAt":"2026-03-13T13:05:24.056Z"},{"id":"scr-1779710258240-gxxzdj","title":"[雑談部屋] これめちゃ重要なので、再度頭に叩き込んどいてくださいね！\n\n特に、ここにいる人は...","category":"instructor","content":"これめちゃ重要なので、再度頭に叩き込んどいてくださいね！\n\n特に、ここにいる人は当然ですが、Xで稼ぐってことが興味のありかになってると思うので、\n\n自然とそういった情報ばかりインプットするし、脳内がXマネタイズばかりでしょうが、\n\nそれだと結局自分の発信ジャンルの読者は惹き付けられないので、発信も見られないしマネタイズも出来ません。\n\n徹底的に自分の発信ジャンルの読者が興味を持つことに興味を向けましょう。\n\nこれ出来てたらXでも自然と売上は立ちますね！\n\n↓↓↓\n\nhttps://x.com/1namaiki/status/2033085814885044458?s=46&t=nMOQLopaop2m5XTqY_up8Q","sourceUrl":"","createdAt":"2026-03-15T07:57:00.533Z"},{"id":"scr-1779710258241-wzapmg","title":"[雑談部屋] ちなみに、このポスト自体はどちらかと言うと、サポート用のポストになっちゃってて、...","category":"instructor","content":"ちなみに、このポスト自体はどちらかと言うと、サポート用のポストになっちゃってて、\n\nこれからXをやってこう！って人の興味を引けるわけではないし、既にやってる人に対してのノウハウとしても別に奇抜さはなく、大事ではあるが、ふーんで終わっちゃう内容なので、\n\n発信者なまいきくんとしては微妙な内容になっちゃってますねww","sourceUrl":"","createdAt":"2026-03-15T07:59:42.638Z"},{"id":"scr-1779710258241-ppmopx","title":"[雑談部屋] なまいきさんの思いが凄すぎる こんなにスクール生のことを考えてくれてる人なんてい...","category":"instructor","content":"なまいきさんの思いが凄すぎる こんなにスクール生のことを考えてくれてる人なんていないですよ。  本来の講義だけでなく、今までで見えてきた課題や修正するところを考えて解決する為に動いてくれてるだなんて しかも最新AIのツールまで用意してくれてる！？  恩返しできるように絶対に成果出してみせます！！ 行動増やして頑張ります  なまいきさん大好きです！ ありがとうございます これからもよろしくお願いします！！","sourceUrl":"","createdAt":"2026-03-21T08:20:24.207Z"},{"id":"scr-1779710258242-zzhnqc","title":"[雑談部屋] それこそ今近々の話で言うとぴよまるさん（スクール生ではなく自社スタッフ）のローン...","category":"instructor","content":"それこそ今近々の話で言うとぴよまるさん（スクール生ではなく自社スタッフ）のローンチ一緒にやってて思うのですが、\n\nやっぱりリアルで会って一緒に進めると、進捗が半端ないし、一気にポストの伸びも変わるので、ローンチ合宿をサポートとして取り入れるのもアリやなと思いましたね！\n\nただ当然ですが死ぬほど僕の負担かかるので、これに関してはプレミアムメンバー限定とか、合宿は別途費用をいただいてみたいな形になるかもですが！\n\nとはいえローンチ合宿は今思いついてる成果を本当に超最大限まで高めるための話なので、\n\n全プランの全員の成果を引き上げるための施策はもう別に50個くらいアイデアあるのでこちらも順次実施していきますね！\n\nぴよまるさんポスト↓\n（合宿前との比較するといいかも）\n\nhttps://x.com/piyomaru_sedori/status/2035025649774334347?s=46","sourceUrl":"","createdAt":"2026-03-21T08:29:09.416Z"},{"id":"scr-1779710258242-emcbie","title":"[雑談部屋] これX取り組んでいく上で超重要なので今一度確認しておいてください！\n\n伸びない！...","category":"instructor","content":"これX取り組んでいく上で超重要なので今一度確認しておいてください！\n\n伸びない！とか言ってる人は大体発信が独りよがりですね。\n\n常に読者から見てどう見えるか？読者がワクワクするようになってるか？読者が第1になってるか？\n\nくっそ当たり前ですがこの意識が最終的な成果を大きく変えますね\n\nhttps://x.com/jimichas7/status/2035558865337745722?openExternalBrowser=","sourceUrl":"","createdAt":"2026-03-22T03:35:02.575Z"},{"id":"scr-1779710258243-drbdyy","title":"[雑談部屋] これめちゃ伸びそうですねw\n\nhttps://x.com/piyomaru_se...","category":"instructor","content":"これめちゃ伸びそうですねw\n\nhttps://x.com/piyomaru_sedori/status/2035572814015824156?openExternalBrowser=","sourceUrl":"","createdAt":"2026-03-22T06:41:54.255Z"},{"id":"scr-1779710258244-aasajk","title":"[雑談部屋] 当然ですが今合宿中で僕がつきっきりで指導してるので発信は追っといた方がいいですよ...","category":"instructor","content":"当然ですが今合宿中で僕がつきっきりで指導してるので発信は追っといた方がいいですよ！僕が物販系で攻めるならこうするというリアルデータが見れることになるので！\n\nまた今回のローンチで溜まったデータと指導内容は当然みんなにも還元しますね！ぴよまるさんにごりごり売ってもらってそのデータでみんなの売上もぶちあげてもらいます！","sourceUrl":"","createdAt":"2026-03-22T06:48:20.005Z"},{"id":"scr-1779710258244-askhsx","title":"[雑談部屋] はじめて100万インプでちゃったのですが、これもう少し時期が早かったら、ねずきち...","category":"instructor","content":"はじめて100万インプでちゃったのですが、これもう少し時期が早かったら、ねずきちさんみたいにボスの記事ぶら下げる作戦できたのになぁ...って感じで謎の悔しさで悶々としているので、ここで浄化させてくださいwww  https://x.com/tsukino_work/status/2038759942849757410?s=46&t=vF4-kHryYDNCaw3BJfuUzQ","sourceUrl":"","createdAt":"2026-03-31T12:18:56.780Z"},{"id":"scr-1779710258245-dyobui","title":"[雑談部屋] https://x.com/1namaiki/status/2039309300...","category":"instructor","content":"https://x.com/1namaiki/status/2039309300515103096?s=46&t=nMOQLopaop2m5XTqY_up8Q\n\n↑これまみやさんのチャット返信ですww\n\nどうやら企画が伸びて100人同時にチャット来てるらしく、嬉しい悲鳴ではあるが対応しきれねぇ、！ってなってたので、\n\n僕側が緊急でチャット部隊編成して、ゴリゴリチャット当たりますww\n\n伸ばしすぎたなって人は逆に個別チャットしない方がいいですね\n\nエバーでちょろちょろリスト入ってくるのに対しては有効ですが、企画に掛け合わせると死にますww\n\nまあ嬉しい悲鳴ではあるんですがね、、\n\n(まみやさんの場合は、上位プランで僕が企画を把握してた、かつアフィ先がなまいきスクール、そして特別な条件のもと対応してますが、全員には出来ないのでそこは把握お願いします)","sourceUrl":"","createdAt":"2026-04-01T11:55:20.582Z"},{"id":"scr-1779710258245-utwhel","title":"[雑談部屋] まみやさんのチャットに僕が派遣してる営業マンですが、3時間睡眠で1日中チャットす...","category":"instructor","content":"まみやさんのチャットに僕が派遣してる営業マンですが、3時間睡眠で1日中チャットする、みたいなのを普通にしますねw\n\nこれがぶち抜く人の基準値ではあるので参考にするといいかもです！","sourceUrl":"","createdAt":"2026-04-01T19:07:31.154Z"},{"id":"scr-1779710258246-wjatte","title":"[雑談部屋] @everyone \n\nマネタイズフェーズの人は特にですが、\n\n細かく教育記事と...","category":"instructor","content":"@everyone \n\nマネタイズフェーズの人は特にですが、\n\n細かく教育記事とかポストとか全部質問・添削してもらった方がいいですよ！\n\nローンチの呼吸とか浅すぎて絶対無理やろ…みたいな状態でローンチ(もはやローンチ感はない)してる人が多くいて\n\nそれは無理やろ…みたいなのが見てて多すぎますね！\n\n勿論プランによって、出来る範囲が異なりますが、個別質問できるプランなのに全然確認してない人とかもいて鬼ほど勿体ないのでもっと講師を活用してもらえると！","sourceUrl":"","createdAt":"2026-04-03T10:57:31.270Z"},{"id":"scr-1779710258247-nnjkdx","title":"[雑談部屋] p.s.\n\nあと、講義で何度も言ってますが、結局逆三角形のピラミッドの下に人が溜...","category":"instructor","content":"p.s.\n\nあと、講義で何度も言ってますが、結局逆三角形のピラミッドの下に人が溜まってない段階で、マネタイズしようにも、そもそも人がいないから厳しいってことになります。\n\n結局マネタイズできる額は、日頃の発信によっていかに見込み客の数増やせてるか？いかに熱量上げられてるか？もうこれで決まります。\n\n言わば日頃の発信のテストがマネタイズの結果って感じです。\n\n正味ローンチ期間での頑張りとかそこまで関係ないです。\n\nイメージで言うと、告白する時に告白だけ気合い入れてるみたいなもんです。\n\n実際告白で成功するかどうかは、それまでどんな関係値を築いてるかがほぼ全てで、\n\n告白の時だけ気合い入れて髪セットして、バチバチ服装整えてても、それまで関係値なかったらお前誰やねんブスﾀﾋねで一蹴されて終わり、そんな感じです。\n\nなので、結局マネタイズフェーズで、マネタイズできる額は日頃の発信によって決まります。\n\nこれは既にマネタイズしてる人はかなり実感してると思いますが、マジでこれです。\n\nやらなきゃ実感できないことではあるのですが、もう日々の発信をサボってるやつに稼ぐことなんて出来ないって言い切れるくらい日々の発信が全てなので、\n\nマネタイズしようとした時だけに質問するのではなく、日頃から徹底的に見込み客数を上げるべく、そして、見込み客の熱量を上げるべく、ガンガン質問など活用して欲しいですね！","sourceUrl":"","createdAt":"2026-04-03T11:03:54.726Z"},{"id":"scr-1779710258247-tzcgfh","title":"[雑談部屋] 自分も質問など全然活用出来てなくて非常に勿体ないなと思ってます。  自分含めです...","category":"instructor","content":"自分も質問など全然活用出来てなくて非常に勿体ないなと思ってます。  自分含めですが、何を質問したら良いかわからないですって人、多いと思います。  質問が「どうしたらポスト伸びますか？」とか抽象的過ぎることしか考えられず…  「認知増やしたいんですけど、自分のアカウントだったらどういうポストすれば良いですか？」とかでもギリ抽象的ですよね？  認知増やすのはわかるけど、具体的なやり方がわからないみたいな (編集済)\n2026年4月3日金曜日 20:54","sourceUrl":"","createdAt":"2026-04-03T11:54:50.866Z"},{"id":"scr-1779710258248-hxxrnu","title":"[雑談部屋] 昨日の夜からなまいきくん達の合宿に参加させていただいていますが、途中経過というこ...","category":"instructor","content":"昨日の夜からなまいきくん達の合宿に参加させていただいていますが、途中経過ということで共有します。  ぶっちゃけどんな感じかというと  ・めっちゃ広いプライベートハウスみたいな所でほぼ1部屋に固まって皆作業してます ・でもひたすら作業。食べ物はパック飯と鮭とか。豪華なものは部屋だけです。 ・YusukeさんもなまいきくんもずっとPCとにらめっこでずっとスクールの運営のために働いてる ・昨日も朝4時くらいまでみんな作業してて明らかに基準値が違います。 ・今日も朝からひたすらミーティングやセミナーに向けた作業をしています。  なまいきくんやYusukeさんも忙しいのに質問したらめちゃくちゃ答えてくれるし、常にスクールのみんなのためにすべきことを考えてくれてます。 （さっきもセミナーどうすればいいか聞いたら1時間くらい答えてくれました。） 普段の生活が見えないから実はなまいきくんはめっちゃ暇なんじゃないかというと全くそんなことはないです。 正直マジでニンニク注射うったりメンエスいったりしてるだけでクソ暇なんだと思ってたら全くそんなことはなかったです。 さっきもスクールのために何かしてほしいことはないか真剣に聞いてくれて、いかにスクール生に成果を出させることができるか考えてくれてる感じです。  事実しか書けないのであんまりマインドぶち上らないかもですが、逐次こんな感じというのは共有させていただきます！","sourceUrl":"","createdAt":"2026-04-14T17:29:34.656Z"},{"id":"scr-1779710258248-kdhixe","title":"[雑談部屋] @everyone \n\n今ふと思ったんですけど、各ジャンル猛者が集まってきてると...","category":"instructor","content":"@everyone \n\n今ふと思ったんですけど、各ジャンル猛者が集まってきてると思うんですが、皆でノウハウ出し合って、それをまとめてスクール生向けに公開して、各発信ジャンルの実績作りも加速出来ると熱いですね！\n\n例えば物販ならとりあえずこれやっとけば月利10万円いける！みたいなのがあれば、実績ゼロの人でもより成果出せるようになりそうですね！","sourceUrl":"","createdAt":"2026-04-15T04:45:57.149Z"},{"id":"scr-1779710258249-fptdde","title":"[雑談部屋] ま、これに関しては基本的に助け合いの精神でしかないのと、\n\n各ジャンルのノウハウ...","category":"instructor","content":"ま、これに関しては基本的に助け合いの精神でしかないのと、\n\n各ジャンルのノウハウ出してもらって当たり前みたいになると微妙なので、\n\n現実的にはノウハウ提供してくれた人達だけの部屋作って、ノウハウ提供してる人だけが他の人のノウハウも見れるみたいな形にしたいですね！\n\nまたノウハウ提供者にもメリットがないと続けられないと思うのでその辺も考えておきます！","sourceUrl":"","createdAt":"2026-04-15T05:15:10.498Z"},{"id":"scr-1779710258250-fdlucg","title":"[雑談部屋] 今こんなので伸びちゃうのでマジでフィーバー来てますねww\n\n完全に今はXにコミッ...","category":"instructor","content":"今こんなので伸びちゃうのでマジでフィーバー来てますねww\n\n完全に今はXにコミットすべき時期なので、勝負どころだと思って今は全力で発信しまくりましょう！！\n\nhttps://x.com/1na すね  一発目で楽稼ぎ訴求してるなら、2発目は「自由な生活」を押すみたいな感じです  超大雑把ですがそうする事で女性が来やすくなったりと被ってない層も拾えるようになるので  今11月の19日なんですが先月と同じく1000万着金は乗りそうですね！  なまいきくんも裏でめちゃくちゃ動いてくれてて頑張ってくれてて、そのおかげで僕も売上を立てれてるので、このスキームを用意してくれた事にマジで感謝でいっぱいです。  本当にありがとうございます。  そして、いつもXで絡んでくれるスクール生の方にはお世話になってるので、Xでガンガン絡んでくれる方には恩返ししていこうと思ってます！  引き続きよろしくお願い致します！","sourceUrl":"","createdAt":"2025-11-19T11:56:16.971Z"},{"id":"scr-1779710258258-ycbyyd","title":"[成果報告] 【高単価アフィ成果報告】  月間売上1億突破！  お疲れ様です！  プレミアム会...","category":"discord","content":"【高単価アフィ成果報告】  月間売上1億突破！  お疲れ様です！  プレミアム会員の先行テスト部隊ということで、  実施させていただいてた高単価アフィですが、8月に実施して売上がほぼ確定したので、共有します！  ・8月26,27日にセミナー ・9月22,23日に追加セミナー  って感じで合計4回セミナーやって、販売したのですが、数値は以下です！ （売上以外は、僕の数え間違いありそうなので、全部「約」です。笑  案件:なまいきスクールアフィ(Xマネタイズ) セミナー着席：1,200人ぐらい(正確に応募フォームとかなかったのでざっくりです) 個別面談数：約260件 成約数：約107件 成約率：約41% 成約金額：¥131,599,400 決済総額：¥112,276,815  正直、集客は雑でしたが、セミナーのコンセプトよかったのと、商品力が強いので、割と強めに押せたのがよかったです！！  結局、セミナー売りは、コンセプトゲーだなって感じましたね  あとは、 ・セールスマンの成約率が高い(40%超ええぐいw) ・商品単価が高い ってのも売上が伸びた要因です！  自社でスクール売ってますが、自社より、2~10倍高いので、売上もビビるぐらい伸びたし、自社売るより純利益も多かったですwww  ガチでこの環境用意してくれたことに感謝です （ほんまにコスパよく売上伸ばす、ってことだけ考えたら、高単価アフィ最強だなと思いましたw）  あと、全然、このグループ顔出せてないですが、そろそろXもガチりたいし、僕もなまいき生の人になんかできることあれば還元したいなと思ってます  その一環として、12月に「1億売った方法(仮)」的な内容で、スクール内限定で講義させてもらうかも？なので、引き続きよろしくお願い致します！  P.S. この前、なまいきくんとリアルで合わせてもらったんですが、裏で今作ってるシステムの話聞いたんですが、それもやばそうなので、むっちゃ楽しみですw ガチ色々やってくれてなまいきくんに感謝です","sourceUrl":"","createdAt":"2025-11-25T06:57:31.573Z"},{"id":"scr-1779710258259-jdvnbb","title":"[成果報告] お疲れ様です！いつも皆さんの成果報告に刺激を受けて、参考にさせていただいておりま...","category":"discord","content":"お疲れ様です！いつも皆さんの成果報告に刺激を受けて、参考にさせていただいております。  9/21〜運用開始し、65日目の11/25にフォロワー0→2000人を達成しました！！  なまいきさん始め、運営の皆様、いつも絡んでいただいてるAI系の皆様、このディスコードでたくさんのことを学ばせていただいてるスクール生の皆様、本当にいつも感謝しております  ここにくるまで意識したことを私なりにお話しさせていただきます。  ・スクール参加と同時にXアプリをダウンロード ・TwitterがXに変わったことも数ヶ月前まで知らなかった ・ポストはもちろん、Xはほぼ見たこともありませんでした  そんな状態からのスタートだったので、私はこの中の誰よりもXを知らないと言っても過言ではありません…w  完全ゼロスタートで右も左もわからなかったので、マインド革命から始まり、毎週の講義をひたすら見返しました。今も毎日見てます。おそらく7周はしました(笑)  講義通りに進めていても、初心者すぎる私はハテナが大量に出現し、なまいきさんや運営さんへ質問したいことが山ほど 人の多くを個別面談に誘導することができず、 個別チャットにして完全に失敗しましたww(フォロワー5300人で初ローンチ)   丁寧にチャットした場合の個別面談移行率が7割ぐらいはあるので、最初から丁寧に全部返せていたら 個別面談数はもう＋20〜30人、＋1500万ぐらいは上乗せできていたのではないかとちょっと 萎えていて大きく売り上げれて嬉しい反面、嬉しくない気持ちもありますw   あとは130人の方々とチャットをして初めて気づきましたが、普段僕のポストを見てくれている人は、 最初からかなり熱量が高かったり、どうしてもまみやさんに教えて欲しいみたいなファン化された人がめちゃくちゃいました。 逆に僕のポストを見ずに、プレゼント企画から急にチャットに参戦してきた人は、明らかに熱量が低く、 僕の返信に対しても適当な返信をしてくる人もそこそこいて、ローンチが下手でも教育記事が弱くても どれぐらい売れるのかは、ほぼ普段のポスト内容で8割ぐらい決まってるのじゃないかな？ と体感として思いました。   またもう1つの反省点というか、X参入してちょうど3ヶ月なので、 仕方なかった部分もあるとは思うのですが、3/31にローンチした後に、 リプ欄やDMで10〜15人ぐらい「まみやさんがこんな企画やると思わなくて、少し前に別の人のコンサル入っちゃいました」という言葉が大量に届いたので、普段のポストで既にファン化や 教育が完了したけど僕に相談する公式LINEなどが用意されていなかったため、 他の人に流れてしまった方が散見されたので、この部分もかなり取り逃してしまったと反省しました。   そのため、現在のローンチがまだ終わってませんが落ち着いたら すぐにエバーで集客するために固定ポストなどに僕へ直接無料で相談できる窓口を置いておいて普段のポストをしているだけでも、公式LINE登録→個別チャット→個別相談のエバー導線で かなり売れそうな手応えがあります。  しかもこのなまいきさんのスキームがさらにやばいのは、 今回僕がやったのは「noteプレゼント企画→公式LINE登録してもらってnote(教育記事)読んでもらう→個別チャット→個別面談 」という1番シンプルな導線で、スペースもやってないし、セミナーもやってないし、動画も作ってません。  次に2ヶ月後とかにローンチするときは、スペースやセミナーを考慮に入れてるので 今の2倍ぐらいは売れそうな気がしてます。  今回はなまいきさん、セールスの方々本当に助かりました！ ありがとうございます  4月後半にはエバー導線も用意して、 6月前半ぐらいに次のローンチをしようかな？とか今ぼんやりと考えてますが、 そこで5000〜7000万ぐらい売ることを次の目標にしてます。  このなまいきさんのスキームは本物なので、まだ売り上げを上げれてなくて、 不安になっている方もいると思いますが、講義の内容を見る→実践する→また定期的に同じ動画を繰り返し見る →最初は気づけなかったことに気づく→また実践する。 みたいにインプットとアウトプットを繰り返すことで成長していきます。  今伸びてない人は、なまいきさんの講義で言ってる内容が上手く実践できてないだけで、 実践できれば必ず伸びます。  一人一人Xに使える時間が違うしそれまでの経験値も違うため、成果が出るまでに一人一人差が出るのはもちろんしょうがないのですが、 なまいきスクールの講義内容、講師の人たちが言っている内容をただ素直に信じて自分のペースで進んでいけば間違いないです。  これからも引き続きよろしくお世話になります","sourceUrl":"","createdAt":"2026-04-10T13:13:00.269Z"},{"id":"scr-1779710258280-qkhypl","title":"[成果報告] 【AI系の高単価アフィ】 4/10〜4/12 セミナーローンチ速報値 （一旦メモ...","category":"discord","content":"【AI系の高単価アフィ】 4/10〜4/12 セミナーローンチ速報値 （一旦メモ程度の成果報告になり申し訳ございませんが）  Zoom参加者数\n,\n1日目：520 2日目：250 3日目：190 計：960  個別コンサルLINE登録\n,\n1日目+2日目：+350 3日目：+60 合計：410（移行率: 42.7%）  個別面談予約数\n,\n1日目：+193 2日目：+57 3日目：+41 ※まだ変動中 合計：291（移行率: 71%）  Zoom参加→個別面談予約移行率：30.2%（291/960） (編集済)\n2026年4月14日火曜日 5:09","sourceUrl":"","create
