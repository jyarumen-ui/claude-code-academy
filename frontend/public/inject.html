答えるので、是非リアルタイムでご参加くださいー！","sourceUrl":"","createdAt":"2026-01-18T10:25:31.081Z"},{"id":"scr-1779710258393-srejne","title":"[講義アナウンス] @everyone\n【2周目講義】\n\n2周目講義の第9回目を\n\n本日1/25(日...","category":"instructor","content":"@everyone\n【2周目講義】\n\n2周目講義の第9回目を\n\n本日1/25(日)の21時より行います！ \n\n内容は\n\n・【X運用必殺技２】インセンティブ設計術\n\n・売上を爆発的に伸ばすインセンティブ設計の活用テクニック\n\nこちらになります！\n\n前回の講義では、なまいきくん式X運用の必殺技１つ目としてストーリー型運用をお伝えしましたが、\n\n今回の講義は、なまいきくん式X運用の必殺技2つ目として\n\n読者を思いのままに動かし、インプ・反応率が爆上がりする悪魔的テクニック【インセンティブ設計】を解説していきます！\n\nインセンティブ設計をマスターすれば、ポストした瞬間に大量のいいねがつき、普通のポストにも何十件とリプが届く状態を狙って作れます！\n\n今回もリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！ (編集済)\n2026年1月25日日曜日 20:03","sourceUrl":"","createdAt":"2026-01-25T06:33:55.712Z"},{"id":"scr-1779710258393-fjzffi","title":"[講義アナウンス] @everyone\n【2周目講義】\n\n2周目講義の第10回目を\n\n本日2/1(日...","category":"instructor","content":"@everyone\n【2周目講義】\n\n2周目講義の第10回目を\n\n本日2/1(日)の21時より行います！ \n\n内容は\n\n・鬼のファン化教育 総講義\n・価値観を操る12の教育要素(前編)\n・価値観を操る12の教育要素(後編)\n・意思決定を掌握するロジック構築術\n\nこちらになります！\n\n今回の講義では、人を自由自在に動かせる「教育」スキルについてガッツリ語っていこうと思います。\n\nなまいきさんは教育を使って、過去に靴磨きで「夢」という商品ですらないものを売って日給50万円ゲットしたこともありますし、\n\n皆さんも教育ができるようになれば、良質なコンテンツやスクールくらいなら余裕で売れるようになります。\n\n今回もリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！","sourceUrl":"","createdAt":"2026-02-01T05:43:49.671Z"},{"id":"scr-1779710258394-fhglbd","title":"[講義アナウンス] @everyone\n【2周目講義】\n\n2周目講義の第11回目を\n\n本日2/8(日...","category":"instructor","content":"@everyone\n【2周目講義】\n\n2周目講義の第11回目を\n\n本日2/8(日)の21時より行います！ \n\n内容は\n\n・全知識を体系化するLv.11までの復習講義\n・X運用５つの重要ポイント\n・これからのカリキュラムについて\n\nこちらになります！\n\n今回の講義は、「X運用総復習編」ということでこれまでの内容を体系的に整理して解説していきます！\n\n\"知ってる\"から\"身についた\"までは至ってない人が多いと思うので、\n\nどのタイミングでどのノウハウを使えばいいのか、みたいな実践力を高めて、マネタイズに進んでいく準備をしていきましょう！\n\n今回もリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！","sourceUrl":"","createdAt":"2026-02-08T08:10:42.161Z"},{"id":"scr-1779710258394-qvwheb","title":"[講義アナウンス] @everyone\n\n【アカウント添削希望者を募集します】\n\n次回の2周目講義は...","category":"instructor","content":"@everyone\n\n【アカウント添削希望者を募集します】\n\n次回の2周目講義は2/15(日)ですが、\n\n2期生の方（R7/10/01～入会の方）を対象に\n\n『アカウント添削会』\n\nを開催します！\n\n\n\nこれまでX運用の基礎~実践までをガッツリ講義してきて\n\n1回1回がかなり情報量多かったので、\n\nそれを実践に落とし込んでもらうために\n\nスクール生が運用しているアカウントを講師のユウスケが直接添削を行います。\n\n\nつきましては、\n\n「アカウント添削して欲しい！」\n\nと希望される方を募集します！\n\n\n1期生で添削してもらった人は全員爆伸びしているのと、\n\n講師からリアルタイム添削＆質問回答を受けられる機会は滅多にないので、奮ってご応募ください！\n\n\n\n注意です\n\n応募は、次回2周目講義 2/15(日)21:00~ にリアルタイムで参加できる方のみでお願いします！\n\nまた、アカウント添削は人数に限りがあります。人数が多い場合は抽選になるので、ご理解ください！\n\n━━━━━━━━━━\n応募期限：2/14(土) 19:00\n━━━━━━━━━━\n\nhttps://forms.gle/HC6jCm4MJezJpzGT7 (編集済)\n2026年2月13日金曜日 18:39","sourceUrl":"","createdAt":"2026-02-13T09:38:56.927Z"},{"id":"scr-1779710258394-kkuvll","title":"[講義アナウンス] @everyone\n\n本日2/15(日)21:00〜、\n\n「2期生アカウント添削...","category":"instructor","content":"@everyone\n\n本日2/15(日)21:00〜、\n\n「2期生アカウント添削会&質問回答会」\n\nを行います！\n\nこれまでX運用の基礎~実践までをガッツリ講義してきましたが、\n\n1回1回がかなり情報量多かったので、\n\n復習が追いついてない人や\n運用に落とし込めてない人もいるかと思います！\n\nそこで今回は、添削会&質問会として\n\n・講義を聞いて実践する中で生まれた疑問の解消\n・スクール生が実際に運用しているアカウントを講師ユウスケが直接添削\n\nを行い、総復習と実践強化をしてもらうための特別講義といたします！\n\n※アカウント添削は人数に限りがあります。\nもし添削に選ばれなかったとしても、他の方の添削事例を聞き、自分のアカウントに置き換えてリアルタイムで質問をしたりなどすることで、運用の悩みや迷いを一気に解決することもできるかと思います！\n\n普段の講義とは違って、スクール生が運用しているアカウントの実例ベースで学べる貴重な機会ですので、ぜひリアルタイムで参加ください！ (編集済)\n2026年2月15日日曜日 15:37","sourceUrl":"","createdAt":"2026-02-15T06:33:30.768Z"},{"id":"scr-1779710258395-tekimg","title":"[講義アナウンス] @everyone\n【2周目講義】\n本日2/22(日)21:00〜、\n\n前回途中...","category":"instructor","content":"@everyone\n【2周目講義】\n本日2/22(日)21:00〜、\n\n前回途中で終わってしまっていた、\n\n「2期生アカウント添削会&質問回答会」\n\nの続きを行います！\n\nこれまでX運用の基礎~実践までをガッツリ講義してきましたが、\n\n1回1回がかなり情報量多かったので、\n\n復習が追いついてない人や\n運用に落とし込めてない人もいるかと思います！\n\nそこで今回は、添削会&質問会として\n\n・講義を聞いて実践する中で生まれた疑問の解消\n・スクール生が実際に運用しているアカウントを講師ユウスケが直接添削\n\nを行い、総復習と実践強化をしてもらうための特別講義といたします！\n\n※アカウント添削は人数に限りがあります。\nもし添削に選ばれなかったとしても、他の方の添削事例を聞き、自分のアカウントに置き換えてリアルタイムで質問をしたりなどすることで、運用の悩みや迷いを一気に解決することもできるかと思います！\n\n普段の講義とは違って、スクール生が運用しているアカウントの実例ベースで学べる貴重な機会ですので、ぜひリアルタイムで参加ください！","sourceUrl":"","createdAt":"2026-02-22T10:16:12.362Z"},{"id":"scr-1779710258395-nifpto","title":"[講義アナウンス] @everyone\n【2周目講義】\n本日の2周目リアルタイム講義はこちらからどう...","category":"instructor","content":"@everyone\n【2周目講義】\n本日の2周目リアルタイム講義はこちらからどうぞ！\n\nZoom ミーティングに参加する\nhttps://us06web.zoom.us/j/86026611648?pwd=3rA13KIz67ohsRMjbJwTlJa6gWlTS8.1\n\nミーティング ID: 860 2661 1648\nパスコード: 598800","sourceUrl":"","createdAt":"2026-02-22T11:59:58.237Z"},{"id":"scr-1779710258396-qxuytf","title":"[講義アナウンス] @everyone \n【２周目講義・次回休講のお知らせ】\n\n今週の3月1日(日)...","category":"instructor","content":"@everyone \n【２周目講義・次回休講のお知らせ】\n\n今週の3月1日(日)の講義は休講となります！\n\nちょうど前々回、前回と2週に渡って\nアカウント添削回を実施しました。\n\n実際動いているアカウントの添削を見て、\n自分のアカウントに反映すべき点なども\n結構見つかったのではないかなと思います！\n\nまた、これまでの講義でも\nかなり多くの内容をお話してきて、\n復習が追いついてない人もいると思うので\n\n今週１週間は新たなインプットでは無く、\nこれまでの講義の復習をしたり\n学んだことを自分のアカウントに\n反映していく期間にしてください\n\n次の講義は3月8日(日)になります！","sourceUrl":"","createdAt":"2026-02-25T06:55:28.050Z"},{"id":"scr-1779710258396-cxcwdm","title":"[講義アナウンス] @everyone \n【2周目講義】\n\n2周目講義の第11回目を\n\n本日3/8(...","category":"instructor","content":"@everyone \n【2周目講義】\n\n2周目講義の第11回目を\n\n本日3/8(日)の21時より行います！ \n\n内容は\n\n・４つのマネタイズ手法\n・商材選びのポイント\n・マネタイズまでの流れ\n・マネタイズまでの事前準備\n\nこちらになります！\n\nこれまでの講義では、アカウントを作ってから十分にアカウントパワーを育てるまでに必要な内容を話してきました！\n\nここからはマネタイズ編に入っていきます。\n\n今回は入門として「ゼロからわかるマネタイズ攻略！」というテーマでマネタイズの全体像について解説します。\n\n事前にマネタイズまでの流れや手法を知っておくことで、長期的な売上を最大化できたり、目的によってアカウント運用を最適化できるようになりますね！\n\n今回もリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！","sourceUrl":"","createdAt":"2026-03-08T09:02:07.270Z"},{"id":"scr-1779710258397-akdfea","title":"[講義アナウンス] @everyone \n本日の2週目講義は休講となります！\n\nその代わり、1週目講...","category":"instructor","content":"@everyone \n本日の2週目講義は休講となります！\n\nその代わり、1週目講義の特別講義が本日3/15(日) 21:00〜実施されます！\n\nゲストとして、実際になまいきスクールの高単価アフィで一撃1.3億売ったシロウさんを招いてのコラボ講義となります！\n\n今回は「ローンチで1億円売った方法(〜1200人集めたコンセプトの作り方〜」として、\n\nなまいきくんとのコラボセミナーで実際に1.3億の売上を作ったコンセプト設計の裏側を、具体的な手順とともに全て解説します！\n\nコンセプトが良ければ投稿がバズり、集客でき、商品が売れる。\n\n逆にコンセプトが微妙なら、どれだけセールスや台本を作り込んでも人が集まらず刺さりません。\n\nビジネスの入り口であるコンセプトの作り方を押さえることで、セミナー集客だけでなくポスト・企画・ローンチ全体の成果が何倍にも変わります。\n\n「商品コンセプト・強み・実績の整理→共通項の発見→新規性の掛け算」という再現性のある設計手順が手に入るので、\n\n講義後すぐに自分のセミナーや企画のコンセプトを見直すアクションが取れます。\n\n今回もリアルタイムで講義を行い、その場で質問にも答えるので、是非ご参加くださいー！\n\n(講義の案内は1週目の講義アナウンスchにて行いますので、21時近くなりましたら、そちら待機ください！)","sourceUrl":"","createdAt":"2026-03-15T03:03:05.154Z"},{"id":"scr-1779710258398-fnvyuw","title":"[講義アナウンス] @everyone \n【2周目講義】\n\n2周目講義の第12回目を\n\n本日3/22...","category":"instructor","content":"@everyone \n【2周目講義】\n\n2周目講義の第12回目を\n\n本日3/22(日)の21時より行います！\n\n内容は\n\n・売上を最大化する資産について\n・高単価アフィリエイトとは？(スキーム解説)\n・高単価アフィリエイトの流れ(高単価アフィモデル)\n・高単価アフィのルール説明\n・高単価アフィのはじめかた\n\nこちらになります！\n\n前回の講義では、ゼロからのマネタイズ入門講義ということで、マネタイズの種類や全体像を説明しました。\n\n今回はいよいよ「高単価アフィに関する重要な項目」について話していきます。\n\nまた、それに伴い、長期的な売上を最大化するための資産についても解説していこうと思います。\n\n目先の利益だけを追い求めるあまり、長期的に利益を生み出してくれる資産を失ってしまうと、\n\n最初は少し稼げても、長期的には全然売り上げが立たなくなる可能性があるので、マネタイズに入る前に必ず把握しておいてほしい重要な話になります。\n\n今回もリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！","sourceUrl":"","createdAt":"2026-03-22T10:24:42.245Z"},{"id":"scr-1779710258398-avpjzt","title":"[講義アナウンス] @everyone \n【2周目講義】\n\n2周目講義の第13回目を\n\n本日3/29...","category":"instructor","content":"@everyone \n【2周目講義】\n\n2周目講義の第13回目を\n\n本日3/29日)の21時より行います！\n内容は\n\n・リスト獲得の方法\n・XTEPリスト獲得の流れ\n・リスト獲得のまとめとセールス補助ポスト\n\nこちらになります！\n\nこれまで、ポストの5つの目的のうち、認知獲得→興味づけ→関係構築→教育、までをやってきたと思うので、\n\n今回は、ポストの目的の5つ目である「リスト獲得」について話していきます！\n\n効率的にLINE登録者を増やして、マネタイズに繋げていきましょう！\n\n今回もリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！","sourceUrl":"","createdAt":"2026-03-29T10:30:29.836Z"},{"id":"scr-1779710258399-uzyzbe","title":"[講義アナウンス] @everyone \n【アカウント添削希望者を募集します】\n\n次回の2周目講義は...","category":"instructor","content":"@everyone \n【アカウント添削希望者を募集します】\n\n次回の2周目講義は4/5(日)ですが、\n\n2期生の方（R7/10/01～入会の方）を対象に\n\n『アカウント添削会』\n\nを開催します！\n\n\n\nこれまでX運用の基礎~実践までをガッツリ講義してきて\n\n1回1回がかなり情報量多かったので、\n\nそれを実践に落とし込んでもらうために\n\nスクール生が運用しているアカウントを講師のユウスケが直接添削を行います。\n\n\nつきましては、\n\n「アカウント添削して欲しい！」\n\nと希望される方を募集します！\n\n\n1期生で添削してもらった人は全員爆伸びしているのと、\n\n講師からリアルタイム添削＆質問回答を受けられる機会は滅多にないので、奮ってご応募ください！\n\n\n\n注意です\n\n応募は、次回2周目講義 4/5(日)21:00~ にリアルタイムで参加できる方のみでお願いします！\n\nまた、アカウント添削は人数に限りがあります。人数が多い場合は抽選になるので、ご理解ください！\n\n━━━━━━━━━━\n応募期限：4/4(土) 23:59\n━━━━━━━━━━\n\nhttps://forms.gle/YqARM8Zg3Myg5uum6","sourceUrl":"","createdAt":"2026-04-03T15:23:41.703Z"},{"id":"scr-1779710258400-tcsbdl","title":"[講義アナウンス] @everyone\n【2周目講義】\n 本日4/5(日)の21時より、\nリアルタイ...","category":"instructor","content":"@everyone\n【2周目講義】\n 本日4/5(日)の21時より、\nリアルタイムにてアカウント添削会を行います！\n\n40名近くの応募がありましたが、全員を添削することは難しいので\nみんなの学びになるアカウントを中心に添削アカウントを選んでます。\n\nアカウントを見てる感じ、\n少しズレてる部分があったり、ここ直したらいいのになあ、といった\nもったいないアカウントがすごく多い印象です！\n\n今回も僕が直接アカウントを見て修正点を伝えていくので、\n今回選ばれなかった人も、ぜひそれらを自分のアカウントに活かすようにしてください！\n\n人の添削を見てるだけでも自分のアカウントに活かせるヒントは絶対見つかるはずです！\n\nリアルタイムで参加して、 吸収できるもの全部持ち帰ってください","sourceUrl":"","createdAt":"2026-04-05T10:40:21.713Z"},{"id":"scr-1779710258400-hymulk","title":"[講義アナウンス] @everyone \n【2周目講義】\n\n2周目講義の第14回目の講義を\n\n本日4...","category":"instructor","content":"@everyone \n【2周目講義】\n\n2周目講義の第14回目の講義を\n\n本日4/12(日)の21時より行います！ \n\n内容は\n\n・XTEPのネタの探し方\n・フロントポストの作り方\n・プレゼントの中身の作り方\n・具体的な操作方法\n\nこちらになります！\n\n前回の講義でXTEPの流れや考え方を学んだと思うので、\n\n今回は「バズるXTEP術」について\n\n日本一のXTEP代理店であり、XTEP経由で売上1億以上を作ってきたKくんのノウハウを詰め込んだ講義になります！\n\n実例も紹介しながら実践的な内容を解説していくので、\n\n自分のアカウントで実践して、リスト獲得→マネタイズに繋げられるようにしっかり学んでいきましょう！\n\n今回もリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！","sourceUrl":"","createdAt":"2026-04-12T10:21:43.125Z"},{"id":"scr-1779710258400-vgsteq","title":"[講義アナウンス] @everyone\n【2周目講義】\n\n2周目講義の第15回目の講義を\n\n本日4/...","category":"instructor","content":"@everyone\n【2周目講義】\n\n2周目講義の第15回目の講義を\n\n本日4/19(日)の21時より行います！ \n\n内容は \n【SNSマーケティング完全攻略】 \n・テクより先に「地図」を持て\n・バラバラ技術、実は1本の流れ\n・詰まりどころが見えれば勝てる\nこちらになります！\n\n今回は「テーマ別講義」として、\n\nスクール生が今詰まってるテーマを中心に、\n成果に直結する集中講義をやっていきます。\n\n今回はSNSマーケティング完全攻略として、 \nXマネタイズの全体像＝マーケの設計図を頭に叩き込む回です。\n\n今のスクール生を見てて、\n個別のテクニックは学んでるのに \nマーケの全体像がわからないまま動いてる人がかなり多いです。 \n\n全体像が見えてないと、\nポストもLINEも教育記事も 全部「なんとなく」になって、部分最適にしかなりません。 \n\n逆に全体像さえわかれば、\n全てのパーツに目的が見えるようになり、 \n「今自分は何をやるべきか」が明確になります。\n\n講義が終わったあと、\n自分の現在地と次にやるべきことが ハッキリわかる状態になるので、\n今回は全員必須です！\n\n今回もリアルタイムで講義を行い、 \nその場で質問にも答えるので、是非ご参加くださいー！","sourceUrl":"","createdAt":"2026-04-19T06:39:59.402Z"},{"id":"scr-1779710258400-hvtwxb","title":"[講義アナウンス] @everyone\n【2周目講義】\n\n2周目講義の第16回目の講義を\n\n本日4/...","category":"instructor","content":"@everyone\n【2周目講義】\n\n2周目講義の第16回目の講義を\n\n本日4/26(日)の21時より行います！ \n\n内容は\n\n・売れる教育導線の作り方\n・教育導線の作り方\n・月600万円売れた高単価アフィ事例の紹介\n・教育コンテンツの作り方\n\nこちらになります！\n\nこれまでの講義でリスト獲得方法については理解できたと思いますが、\n\nLINEに集めてリスト化できたから終わり！というわけではなく、\n\nセールスに繋げる前に見込み客の熱量をどれだけ上げられるか（教育できるか）、によって最終的な成約率や売上は大きく変わってきます。\n\nこの教育コンテンツを一度作っておけば、\n\nLINEに入ってくれた読者を最大効率でセールスに繋げられるし、皆んなは集客だけに全力を注ぐことができます！\n\n今回もリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加ください！","sourceUrl":"","createdAt":"2026-04-26T11:04:12.779Z"},{"id":"scr-1779710258401-kmrtqm","title":"[講義アナウンス] @everyone\n【2周目講義】\n\n2周目講義の第17回目の講義を\n\n本日5/...","category":"instructor","content":"@everyone\n【2周目講義】\n\n2周目講義の第17回目の講義を\n\n本日5/3(日)の21時より行います！ \n\n内容は\n\n・個別面談の誘導率を３倍に爆上げする方法\n・面談への遷移率を最大化する個別チャットの流れ\n・実際の個別チャット事例とポイント解説\n\nこちらになります！\n\n前回の講義では、リスト化した人を面談に繋ぐ手段の1つとして教育導線・コンテンツについて解説してきましたが、\n\n今回は、田中が870万売った時も実践した、面談誘導数を最大化する「個別チャット」の極意について話していきます！\n\n一般的にLINEからセールスに繋げられるのは3％（リスト100人→面談3人）くらいですが、\n\nこの方法を使えば、誘導率10％（リスト100人→面談10人）超えも十分狙えるようになります！\n\n周りが30万円稼いでる中、このやり方知ってれば同じリスト数で100万円作れるのでインパクトはかなりデカいですね。\n\n今回もリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！","sourceUrl":"","createdAt":"2026-05-03T10:23:49.952Z"},{"id":"scr-1779710258401-euqucd","title":"[講義アナウンス] 【2周目講義】\n本日の2周目リアルタイム講義はこちらからどうぞ！\n\nZoom ミ...","category":"instructor","content":"【2周目講義】\n本日の2周目リアルタイム講義はこちらからどうぞ！\n\nZoom ミーティングに参加する\nhttps://us06web.zoom.us/j/89964163855?pwd=aQnW1Lka9OwCZ2o8UWbG37JtYpqdkf.1\n\nミーティング ID: 899 6416 3855\nパスコード: 405922","sourceUrl":"","createdAt":"2026-05-03T12:00:20.475Z"},{"id":"scr-1779710258401-fflpxc","title":"[講義アナウンス] @everyone\n【2周目講義】\n\n2周目講義の第18回目の講義を\n\n本日5/...","category":"instructor","content":"@everyone\n【2周目講義】\n\n2周目講義の第18回目の講義を\n\n本日5/10(日)の21時より行います！ \n\n今回は、現状アカウント運用している中での疑問を何でも相談できる\n\n「リアルタイム質問会」を実施します！\n\n\nこれまでの講義では、\n\n初期運用 ～ 教育記事や個別チャットセールスといったマネタイズフェーズの内容まで、\n\n高単価アフィを実施するために必要な基礎知識は全てお伝えしてきました。\n\nただ、これまでの講義内容を実際にアカウント運用に落とし込めているかというと、\n\nまだ完全には活かせていなかったり、迷っている部分がある、といった方もいるかと思います。\n\n\nそこで今回の講義では、初期運用～マネタイズまで何でも質問OKとして、\n\n実際にアカウントなども見ながら、リアルタイムで質問回答やフィードバックを行います！\n\n悩みを解決して、アカウントの伸びを一気に加速させる良い機会になるかと思うので、ぜひご参加ください！ (編集済)\n2026年5月10日日曜日 19:21","sourceUrl":"","createdAt":"2026-05-10T10:20:16.682Z"},{"id":"scr-1779710258402-glcglb","title":"[講義アナウンス] @everyone \n本日の2周目リアルタイム講義はこちらからどうぞ！\n\nZoo...","category":"instructor","content":"@everyone \n本日の2周目リアルタイム講義はこちらからどうぞ！\n\nZoom ミーティングに参加する\n\nhttps://us06web.zoom.us/j/87040655478?pwd=LD6MFcGa9uwozRoLzraxUHCFfDC0kY.1\n\nミーティング ID: 870 4065 5478\nパスコード: 141399","sourceUrl":"","createdAt":"2026-05-10T12:00:51.416Z"},{"id":"scr-1779710258402-jrsfav","title":"[講義アナウンス] @here \n\n1周目の講義ではありますが、今回は入会時期に関わらず全員リアルタ...","category":"instructor","content":"@here \n\n1周目の講義ではありますが、今回は入会時期に関わらず全員リアルタイムで参加することを推奨します。\n\n今週は「コンセプト設計徹底解説」ということで\n5/16(土)の21時より行います！\n\n今回このテーマに決めたのは、\n受講生のなかでコンセプトのところで\n詰まってる人が圧倒的に多いと感じたからです！\n\nこれまで何回か添削会をしてきましたが、\nそのうち8～9割の受講生が\nコンセプトのところで詰まっています。\n\n逆にいうと、ここを突破すれば、\n圧倒的にマネタイズに繋がりやすくなります。\n\n・インプは取れているのにファンがつかない\n・売上に直結するポストが作れない\n・「自分を見る理由」が作れない\n\nみたいな人は要必見！\n\n今回の内容↓↓↓\n\n【コンセプト設計】\n――――――――――――――――――――\n・売れるコンセプトとは何か？\n・需要がある穴場ポジションの見つけ方\n・0からコンセプトを見つける全手順\n・マネタイズに繋がる発信軸の作り方\n――――――――――――――――――――\nこちらになります！\n\nコンセプトが決まらないと\nポストも導線も全部ブレるので、\n設計の考え方から手順まで\n一気に固めていきましょう！\n\n今回の講義で裏側の思考まで語るので、\nしっかりチェックして下さい。\n\n今回もリアルタイムで講義を行い、\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！","sourceUrl":"","createdAt":"2026-05-16T05:34:53.146Z"},{"id":"scr-1779710258402-hnoldu","title":"[講義アナウンス] @everyone \n【2周目講義】\n\n2周目講義の第19回目の講義を\n\n本日5...","category":"instructor","content":"@everyone \n【2周目講義】\n\n2周目講義の第19回目の講義を\n\n本日5/17(日)の21時より行います！ \n\n内容は\n\n・コンテンツ販売の重要性\n・売れるネタの見つけ方\n・売れる商品で最も重要なこと\n・まとめ&事前準備\n\nこちらになります！\n\nこれまでのマネタイズ編の講義では、高単価アフィについて語ってきましたが、\n\n今回は王道のマネタイズ手法である「コンテンツ販売」について話していきます！\n\nマネタイズで高単価アフィを考えている人は多いと思いますが、\n\nコンテンツ販売にもちゃんとメリットがありますし、\n\n高単価アフィにコンテンツ販売を掛け合わせるのもめちゃくちゃ強力なので、\n\n今回の講義は、コンテンツ販売メインでマネタイズしようとしてる人はもちろん、\n\n高単価アフィやその他のマネタイズ手段を考えている人にとっても、売上を伸ばしていけるような内容になってます。\n\n今回もリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！","sourceUrl":"","createdAt":"2026-05-17T10:53:57.246Z"},{"id":"scr-1779710258403-oddzcg","title":"[講義アナウンス] @everyone \n\n先程のリンクがエラーでていたみたいです、すみません！\n改...","category":"instructor","content":"@everyone \n\n先程のリンクがエラーでていたみたいです、すみません！\n改めまして本日の講義はこちらからお願いします!、\n\nZoom ミーティングに参加する\nhttps://us06web.zoom.us/j/88564152492?pwd=al74bLaBZaU8QzasTv7IbkAW4f4W0w.1\n\nミーティングID: 885 6415 2492\nパスコード: 200062","sourceUrl":"","createdAt":"2026-05-17T12:08:28.708Z"},{"id":"scr-1779710258404-zfbenm","title":"[質問部屋] @あか@運営　@Yusuke＠講師　@なまいきくん　 お世話になっております。質...","category":"feedback","content":"@あか@運営　@Yusuke＠講師　@なまいきくん　 お世話になっております。質問させていただきます。  ❶ジャンル選定とアカウント設計について質問です。  ❷現在、どのジャンルで発信を始めるべきか悩んでいます。 アカウント運用に慣れるため、複数ジャンルのアカウントを同時に回すことも検討中です。 ただ、現時点では明確な実績がないため、説得力のあるアカウントを作れるのか不安です。 最終的なゴールとしては「発信コンセプトを明確にして、継続的に育てていけるアカウント」を作りたいと思っています。  ❸ジャンル決めの際の「興味・経験」の観点からは、 ・AI ・裏垢 ・占いマネタイズ ・メルレ が候補にあります。 ただ、「アカウントを作る」とは具体的にどの段階を指すのか（＝アカウント開設と同時に発信ジャンルでの活動・実績づくりも並行するということなのか）が少し曖昧で、 仮にそうだとすると「実績が出ないまま発信し続ける状態」になってしまい、説得力の弱いアカウントになるのではないかと感じています。  過去の経験としては ・AI占い（実績ほぼ0） ・メルレ（2〜3週間で約1万円の収益） があり、これらの経験をどう活かせるかも考えています。  ❹以上を踏まえて、 ・現時点で実績が少ない状態でもジャンル発信を始めるべきか ・またはまずは実績づくりを優先すべきか ・複数アカウント運用の考え方は正しいのか この3点についてアドバイスをいただけますでしょうか。  以上です。 質問の仕方がおかしいなどありましたらご指摘いただければと思います。","sourceUrl":"","createdAt":"2025-12-02T12:16:43.450Z"},{"id":"scr-1779710258404-krmnwv","title":"[質問部屋] 回答ありがとうございます。追加で質問させていただければと思います。 ❶ジャンル選...","category":"feedback","content":"回答ありがとうございます。追加で質問させていただければと思います。 ❶ジャンル選定と発信の進め方について追加で質問です。  ❷「実績がなくてもAIや投資など伸ばしやすいジャンルで発信していく」「ある程度の成果を出す過程をストーリーとして発信していく」というアドバイスをいただきました。 また、「複数アカウント運用よりも1つのアカウントに集中する方が伸びやすい」とのことも理解しました。  現在はレベル1のカリキュラムを終えた段階で、ジャンルやコンセプトを決めきれずにいます。 最終的なゴールは「高単価アフィを月100〜300万円で安定して売ること」です。  ❸現時点で自分なりに考えていることとしては、 ・マネタイズへの説得力を出すには、やはり何らかの“実績”が必要では？と感じています。 ・ただしアカウント設計の段階では、実績による差別化よりも「発信内容でどれだけ読者を惹きつけるか」が重要になるのかな？と思っています。 ・「ゴールから逆算して考える」という点も、まだレベル1を終えた段階では抽象的にしか考えられておらず、「高単価アフィを売る→そのために○○人集客→そのために××のような投稿をする...」程度のイメージしか持てていません。  ❹以上を踏まえて、以下の3点を伺いたいです。 ① 現時点では“実績づくり”よりも“発信内容の磨き込み”を優先すべきでしょうか？ ② 実績がない段階でも読者を集められる差別化軸は、アカウント設計時にどのように考えるべきでしょうか？（プロフはカリキュラムに則り定石通りに作る予定ですので、この段階では差別化は難しいと考えています） ③ 「ゴールから逆算思考」はどのレベル帯で具体化していくのが適切でしょうか？（現時点では抽象的すぎて手が動かせない状態です）","sourceUrl":"","createdAt":"2025-12-03T15:12:30.286Z"},{"id":"scr-1779710258405-ehyoof","title":"[質問部屋] @あか@運営  @Yusuke＠講師  @なまいきくん    いつも大変にお世話...","category":"feedback","content":"@あか@運営  @Yusuke＠講師  @なまいきくん    いつも大変にお世話になっております。  ジャンル選定についてご相談させていただきたく書き込み致しました。   現在裏垢に興味があり、挑戦中なのですが、今後裏垢でやっていくにあたって、 ①副業禁止の職場なので、外注化で作業するのが厳しい(契約先等からの身バレが怖い)  ②夫の理解が微妙に得られない  という2点の悩みがあり、ジャンル変更を考えております。(裏垢自体は楽しかったので残念ですが)  ついては、今の自分のスペック的に、次に興味のある投資ジャンルでやっていけるかお伺いしたいです。  ①投資実績:オルカン、Ｓ＆Ｐ500、NASDAQ100→利益＋100万で個人資産計1000万超  ②某インフルエンサーのスクールにて高配当株含む資産形成勉強中(個別株購入実績なし)   正直、投資系で発信するには弱弱すぎる実績なので、微妙かなーと思いつつ、NISAに興味出てきた初心者向けに発信できたらいいなぁと思ってますが、可能でしょうか。   お忙しいところお手数をお掛けし申し訳ありません ご教授頂ければありがたいです。","sourceUrl":"","createdAt":"2025-12-24T04:35:27.717Z"},{"id":"scr-1779710258405-dgnwqr","title":"[質問部屋] @あか@運営  @Yusuke＠講師  @なまいきくん    いつも大変にお世話...","category":"feedback","content":"@あか@運営  @Yusuke＠講師  @なまいきくん    いつも大変にお世話になっております。  発信スタイルと取り扱い内容の割合についてご相談させていただきたく書き込み致します   【アカウント】 ピチュン@ポケモンせどり @moon_sight22 https://x.com/moon_sight22?s=21  【質問】 現在の発信スタイルと投稿内容のバランスについてご相談させてください。  【要点】 ポケモンカードせどりと初心者向けオールジャンルせどりの投稿割合の最適解について知りたい  私の発信テーマは大きく2つあります。 1つ目がポケモンカードのせどり、2つ目が初心者でもすぐに実践できるオールジャンルのせどり（釣具・スポーツ用品・アパレルなど）です。  ポケモンカードについては、以前Yusukeさんとも話していましたが、ポケカをメインに取り扱っている層は資産に余裕がある方が多く、せどり自体への理解も高いため、反応は非常によく、フォロワーやインプもかなり伸びます。 一方で、ポケモンカード背取りに特化しすぎると、物販スクールへの導線や「再現性のあるせどり」という文脈が弱くなってしまう懸念があり、現在はあえて初心者向けのオールジャンル背取りも並行して発信しています。  実際の数値感としては、 ポケモンカードの投稿はインプレッション・フォロワー増加ともに非常に強い オールジャンル背取りは、ポケカ投稿に引っ張られる形で、フォロワー数の割には安定して伸びている  収益面では、 ポケモンカード背取り：月10〜15万円 初心者向けオールジャンル背取り：月5万円前後（初心者でもできる範囲に抑えている）  現在は ポケモンカード50％：初心者向けオールジャンル50％ という投稿バランスで運用しています。  この状況を踏まえた上で、 この50:50のバランスは妥当でしょうか？  ポケモンカードについて発信すると、とにかくフォロワーの伸びが良いため、「伸びやすさ」と「今後の導線・専門性」のどこを軸に、どうバランスを取るべきかについて、講師の視点からアドバイスをいただけると嬉しいです。 (編集済)\n2025年12月25日木曜日 2:15","sourceUrl":"","createdAt":"2025-12-24T17:15:41.617Z"},{"id":"scr-1779710258406-baoayo","title":"[質問部屋] ① 現在のアカウント設計（ジャンル設定・プロフィール・アイコン・ポストの方向性）...","category":"feedback","content":"① 現在のアカウント設計（ジャンル設定・プロフィール・アイコン・ポストの方向性）で改善すべき点はどこでしょうか？\n\n→ジャンルですが、現状のアカウントはAIジャンルというよりは占いジャンルに見えますね！\n・AIジャンル→あくまでAIの話がメインで、マネタイズ実践のネタとして占いを実施（占いで稼いでるとは言わない、発信ではAI使って稼いでる～レベルの粒度）\n・占いジャンル→占いマネタイズの話がメイン\n占いメインならある程度実績を作りつつストーリー運用で伸ばしていく、AIメインなら他の人の伸びているポストなどを参考にまずはバズを狙っていく運用になるかと！\n\nアイコンはAI生成感強くモブ感があるので絵のタッチなどをnanobananaで調整、業者感が出ないように肩書削除、プロフも簡潔に「誰が（何歳, どんな会社員,主婦etc.）」「何に挑戦しているのか」だけを書いておきましょう！\n\n② 実績がない状態でも埋もれにくくするために、今の段階で意識すべき差別化ポイントはありますか？\n→抽象的になりますが、他の人がやってないこと、見せていないことを発信していく、発信＝漫画の連載のようなイメージで、読者がエンタメとして見てくれるようなストーリーを作っていく、などができるといいですね！\n\n③ 「毎日ポスト・フォロー・いいね」以外に、初期段階で特に意識してやるべき行動があれば教えていただきたいです。\n→何が伸びるのか常に他の人のポストや成功例を見ていくことですね！そもそも今出している自分のポストが伸びるポストなのか？そうでないのか？を客観的に考えて、「これは伸びそう」と思って出すポストを増やしていきたいです！伸びないだろうなってポストをいくら出しても伸びないので！","sourceUrl":"","createdAt":"2025-12-27T02:41:38.896Z"},{"id":"scr-1779710258407-yqooqm","title":"[質問部屋] 回答ありがとうございます。 追加で質問させていただけたらと思います。  ❶ ジャ...","category":"feedback","content":"回答ありがとうございます。 追加で質問させていただけたらと思います。  ❶ ジャンル選定と今後の運用設計についての追加質問です。  ❷ 前回の回答で、 ・現状のアカウントは「AIジャンルというより占いジャンルに見える」 ・AIメインならバズ狙い、占いメインなら実績×ストーリー運用 という整理をしていただきました。  現在は実績はほぼなく、大きな成功体験やトラブルも起きていない状態です。 そのため、「読者がエンタメとして追いたくなるストーリー」をどのように作るべきかで悩んでいます。  ❸ 上記の回答を踏まえ、今の自分がやるべきことについて以下のように仮定しています。  ・まずはジャンルを曖昧にせず、どちらかにハッキリ寄せる必要がある ・現段階では 　「投稿を続ける → 反応を見る → 書きやすい型が残る → 最後まで残った“癖”が強みになる」 　という流れを作ることが重要なのではないか ・差別化や強みは最初から見つけるものではなく、運用の中で自然に浮かび上がってくるものだと考えています ・伸びているポストについては、 　「この人は何者か」ではなく 　「なぜこの文章・構成・言葉選びが伸びたのか」 　という視点で観察・分析することが今の自分に必要だと感じています  一方で、以下の点についてはまだ整理しきれていません。  ・AIと占い、現状どちらをメインにする方が現実的なのか ・実績やトラブルがない状態でも、連載のように追ってもらえるストーリーは作れるのか ・成功ポストのリサーチ方法として、 　おすすめ欄で見つけたポストから過去投稿を遡るやり方で問題ないのか ・現時点でアフィリエイトリンクを用意しておくべきか、それとも集客・運用力強化を優先すべきか ・「厳選ポストネタ集」を軸に投稿を作っていく判断が正しいのか  ❹ 以上を踏まえて、以下について確認させてください。  ① 現在のフェーズ（実績・ストーリーなし）では、AIと占いのどちらをメインジャンルに据えるのが適切でしょうか？ ② 実績やトラブルがない状態でも、読者がエンタメとして追いたくなるストーリーはどのように設計すればよいでしょうか？ ③ 成功ポストのリサーチ方法として、今考えているやり方に改善点はありますか？ ④ マネタイズ導線（アフィリエイトリンク）は、この段階で用意すべきでしょうか？ ⑤ 「投稿を続ける中で残った癖が強みになる」という考え方は、今のレベル感として合っていますでしょうか？ ⑥ 「厳選ポストネタ集」を軸に投稿を作っていく方向性は問題ないでしょうか？  以上となります。 よろしくお願いいたします。","sourceUrl":"","createdAt":"2025-12-28T03:46:21.135Z"},{"id":"scr-1779710258407-vpmcjg","title":"[質問部屋] @Yusuke＠講師  いつもお世話になっております。  ポストについて2点質問...","category":"feedback","content":"@Yusuke＠講師  いつもお世話になっております。  ポストについて2点質問があります。  【現状】 今までnoteやブログ投稿した際のお知らせ（記事タイトル＋URL or 文章＋URL）として使っていた、フォロワー数250人程度でまったく反応のなかった投資垢で、今週からポストを開始して3日目という状況となります。  【質問】 ・本文にハッシュタグは入れた方が良いのでしょうか？ ・note投稿した際に、文章＋URLのポストをしていますが、継続して問題ないでしょうか？  どうか宜しくお願いいたします。","sourceUrl":"","createdAt":"2025-12-28T03:49:43.441Z"},{"id":"scr-1779710258408-ludlhk","title":"[質問部屋] @なまいきくん @Yusuke＠講師  お世話になっております。 質問をお願いし...","category":"feedback","content":"@なまいきくん @Yusuke＠講師  お世話になっております。 質問をお願いします。  現在、既にあったFIRE達成＋投資系アカウント（ブログの投稿報告のみに使用）を、投資垢として育成中です。  自分自身がFPということもあり、相談を受けた内容＋相談を受けそうな内容を切り口にした、FP＋過去10年以上の海外投資サポート経験、FIRE達成の経験をしてきた立場でのポストをして行きたいと思っているのですが、いまの認知獲得段階では先生感が出てしまうので経歴や肩書を無視してプレイヤー視線でのポストをして認知獲得を目指す方が良い感じでしょうか？  この辺りの運用方針で戸惑いが生じています。  お手数ですが、どうか宜しくお願いいたします。","sourceUrl":"","createdAt":"2025-12-29T15:55:36.709Z"},{"id":"scr-1779710258408-zwbjim","title":"[質問部屋] お世話になります。 すみません、自分の認識が甘さが原因なので反省ではあるのですが...","category":"feedback","content":"お世話になります。 すみません、自分の認識が甘さが原因なので反省ではあるのですが、質問させてください。 外部にフォロワーを増やしてもらうよう依頼しました。 1000人は越えたのですが、ほとんど懸賞系のアカウントばかりで⋯ このアカウントをフォロー＆リツイートしたらポケモンカードプレゼントしますという形で拡められ、あっという間に1500人を越えました。 ほとんど懸賞目当てのアカウントばかりで、たまに投資やNISAにも興味を持っておられる方も存在します。  質問なのですが、投資ジャンルの発信をしていきたいのですが、アカウントは一から作り直した方がいいでしょうか？ それとも今いるフォロワーも活かして発信していけばいいでしょうか？","sourceUrl":"","createdAt":"2026-01-06T10:55:37.204Z"},{"id":"scr-1779710258409-rqkszm","title":"[質問部屋] @なまいきくん @あか@運営  @Yusuke＠講師   いつもお世話になってお...","category":"feedback","content":"@なまいきくん @あか@運営  @Yusuke＠講師   いつもお世話になっております。 アカウント運用の方針について、ご相談させてください。  現在、私は iPhoneリペア転売 をテーマにした既存アカウントを運用しており、フォロワー700人。 フォロワー約300人の時点で、リスト50名ほどから 5名の契約 を獲得しています。 また、note販売も行っており、平均インプレッションは 1,000ほどあります。  この実績を踏まえたうえで、今後の進め方について悩んでいます。  一方で、新しく作成した別アカウントを iPhoneリペア転売用として育てるかどうか を検討しています。  iPhoneリペア転売は、「分解・修理」の印象が強く、 初心者には参入障壁が高く見えやすい分野です。 そのため新アカウントでは現在、 「とある物販」「スマホ転売」といった形で、あえてテーマを濁して発信しています。  ただ、このままでは、 本来伝えたい 分解工程や、実際は難しくない理由 を十分に伝えられず、 iPhoneリペア転売の良さを正しく示しにくい点が課題だと感じています。  そこでご相談です。  ①既存のiPhoneリペア転売アカウントをこのまま伸ばしていくべきか  ②新アカウントを最初からiPhoneリペア転売として明確に打ち出し、運用していくべきか。それとも、うずらアカウントで稼いだ実績をビジネスアカウントとして発信したほうが良いのか。  長期的に見て、 収益化・信頼性・教育のしやすさの観点では、 どちらの進め方がより合理的でしょうか。  アドバイスをいただけますと幸いです。 https://x.com/uzurahime08 https://x.com/donarudotk (編集済)\n2026年1月9日金曜日 22:13","sourceUrl":"","createdAt":"2026-01-09T13:13:58.824Z"},{"id":"scr-1779710258410-lperla","title":"[質問部屋] 夜分遅くに、ご指摘ありがとうございます。 あらためて、私の考えを整理しました。 ...","category":"feedback","content":"夜分遅くに、ご指摘ありがとうございます。 あらためて、私の考えを整理しました。  ① ゴール  私の最終的なゴールは、 iPhoneリペア転売を軸に集客を行い、最終的に高単価アフィリエイトにつなげることです。 ただし、iPhoneリペア転売を前面に出すと、リペア目的の人が中心に集まりやすく、高単価アフィに本当に繋げられるか不安です。  ② 現状と課題  まず、既存のうずらアカウントについては、現時点では ファン化が弱く、先生ポスト寄りになっているという課題があります。ですが、リペア転売が強く100人ほどリストは取れています。この点については、今後改善していく前提です。  一方で、新規アカウントではプレイヤーポストを意識して発信していますが、リペアという文言を使わず、 物販と濁した形で発信しています。  その結果、 本来の強みである 分解工程や実例 を出せない iPhoneリペア転売は実は難しくない という本質を伝えにくい  という課題を感じています。  ③ いま考えている解決案  この状況を踏まえ、現在は次の2つの方針で迷っています。  1、既存のうずらアカウントをさらに伸ばし、そこで積み上げた実績や事例を、新アカウント側で横展開していく。高単価アフィはうずらアカウントで行う。  2、新アカウントでも最初からiPhoneリペア転売を明確に打ち出し、実は簡単という教育を前提に育てていく。そのうえで、うずらアカウントはビジネスアカウントへ移行する。  質問としましては、  リペア転売という具体的な名称を出して、高単価アフィはできるのか。 できるのであれば、新規に立ち上げた方がいいのか、このうずらを伸ばした方がいいのか。  語彙量が乏しくてすみません  よろしくお願いします","sourceUrl":"","createdAt":"2026-01-10T03:59:48.955Z"},{"id":"scr-1779710258410-bfqzla","title":"[質問部屋] @なまいきくん @あか@運営  @Yusuke＠講師   いつもお世話になってお...","category":"feedback","content":"@なまいきくん @あか@運営  @Yusuke＠講師   いつもお世話になっております。 新規アカウント運用を開始するにあたり、ご相談させてください。   2ヶ月で0→1000人まで育てた物販垢から切り替えて、新しくアカウントで投資アカウントを始める予定です。 （物販アカウントについては一旦このまま進めず、切り替えるのは気持ちとして決定しています。物販垢をどう運用するかについては後日講師の方と相談予定） そのため、投資アカウントの初期段階の準備として幾つか質問させてください。  概要: アカウント運用としては、ポケカ投資でうまく行ったから株もいけるでしょ、といったスタンスで、株の用語もわからない完全初心者から運用を始めるOLというプロフィールで運用します。 ポケカで株に興味を持つ人も増えたため、そこも織り交ぜつつポケモンという看板も出しながら、興味を惹かせるスタンスでいこうかなと考えています。ポケモンがインプ稼ぎにかなり適していることがわかったため。 【ポケカ投資で上手く行ったから株もいけるでしょという甘い考えから投資スタートします。恋人無し、失うものは何もない。初期費用5万円からスタート。】というスタンスでスタート予定です。 手法としてはXで「この銘柄今買え」と発信してる方のつぶやきを見て購入してを繰り返し、そこから勝ちパターンを掴んでいくという方法で学んでいきます。実際にこれで先日3日で投資額5万円が2倍になりました。 この中で、いくつか質問がございます。  1.アカウント買収について。 予算は10万円です。500〜1000フォロワーぐらいの人から買収できます。 この予算でも積極的にアカウント買収するべきでしょうか？また探すのに平均みなさんどれくらい時間かかっていますか？完全初心者から学んで運用するプレイヤーとして発信予定ですので、200名フォロワーから買収とかの方が自然な場合はそちらから買収予定です。  2.スクール動線について。 投資アカウントで株を、完全初心者から5万円から運用スタートして、そこから学んで運用するプレイヤーとして発信する予定です。この内容で提携スクールアフィは動線として自然でしょうか？ 別の実力としてポケカ投資で1000万円稼いだみたいなのも表に出して、こいつすごいんじゃね？みたいなのを暗に出す形でいこうと考えています。（ぼかす必要があるならポケカの方はぼかして、今日はとある投資で⭕️円儲かった。のように呟きます。）  3.参考アカウントについて。 株アカウントとして運用する場合、同系列で伸びているスクール生を参考にしたいので、スクール生の何人か、短期間で伸びている方を教えてください。 完全初心者から始めるので、近い状況の人で伸ばした人であればよりありがたいですが、いなければ純粋に伸びている方でお願いします。  4.投資アカウントの用語について 投資アカウントは難しい専門用語が多くて慣れるか心配ですが、むしろ0→1初心者をターゲットにする場合は、私のこのステータスは好都合でしょうか？  5.その他注意点など この発信のスタンスをとるにあたっての注意点や、それはやめておくべきみたいな内容あれば教えてください。  1/10 18:42  すみません、途中で質問更新させていただきました よろしくお願いします。 (編集済)\n2026年1月10日土曜日 18:51","sourceUrl":"","createdAt":"2026-01-10T09:51:00.482Z"},{"id":"scr-1779710258411-quzxfs","title":"[質問部屋] 回答ありがとうございます。 2.と3.の質問について追記させていただきます。  ...","category":"feedback","content":"回答ありがとうございます。 2.と3.の質問について追記させていただきます。  2.の運用をした場合、現在記載しているストーリーの想定だとこの「手段を絞りすぎている場合」に該当しますか？  講義は全て何度も確認するようにしていますが、ここも講義で既に回答がある場合、どの章かだけでも教えていただけますでしょうか？ その章を1から再度確認して、自身で答えを見つけようと思います。  3.昨日チャンネルにて2時間ほどかけて調べたのですが、アカウント買収をしている方が多く、どなたがどれくらいのスピードで伸ばせているかの可視化が難しく、参考にする判断が難しかったです。 その為質問させていただきました。  具体的に名前をあげるのが難しい場合、「伸ばせている人」を投資ジャンルにて自力で探すための、具体的なステップを教えていただけますか？ （Yusukeさんが参考ユーザーを探す想定をした場合に、対象を絞る場合の方法を教えていただければ幸いです。）  何度もすみません。 いつもお世話になっております。引き続き、よろしくお願いします","sourceUrl":"","createdAt":"2026-01-11T03:25:09.065Z"},{"id":"scr-1779710258412-xtkaaz","title":"[質問部屋] 回答ありがとうございました。 細かい中身なんでどうでも良い、という点が今回の該当...","category":"feedback","content":"回答ありがとうございました。 細かい中身なんでどうでも良い、という点が今回の該当箇所だったのですね。  私の物販垢にて、ポケカ鑑定品に寄せすぎるとスクール提携に必要な発信からズレるという指摘が過去にあったという経験と、 今回は提携先のスクール（商品）は既に決まっている、という2点が異なるのかなと感じていたので、 この方向性にて再度発信の方向性の訂正を出された場合、一度ジャンル自体を再検討しようと考えていた為、質問させていただきました。  ポケカ鑑定品の物販発信の場合は、「ポケカ鑑定品をメインで取り扱う発信だとスクール連携先の商品の幅広さとミスマッチする」という理由だったかと思いますので、 今回の私の「ポケモンやポケカ投資（かなりインプ稼ぎできる話題）などの話題を取り入れつつ実質的には株で試行錯誤しながら売上を伸ばしていく」という発信は、提携先の投資スクール内容とはミスマッチはしない と理解いたしました。 こちら私の認識にズレがあれば教えていただけますと幸いです  フォロワーについても理解いたしました。  回答ありがとうございました。 (編集済)\n2026年1月12日月曜日 9:46","sourceUrl":"","createdAt":"2026-01-12T00:46:23.114Z"},{"id":"scr-1779710258412-tsuhhx","title":"[質問部屋] @あか@運営  @Yusuke＠講師  @なまいきくん   毎週ZOOM講義あり...","category":"feedback","content":"@あか@運営  @Yusuke＠講師  @なまいきくん   毎週ZOOM講義ありがとうございます。  お世話になっております。 アカウントの運用方針についての質問になります。 ＊長文で申し訳ござません＊  ★アカウント★ https://x.com/sobao51?s=21&t=bqZqqwzx4NUzTeAk0zvu9A  ①現状 元々、リアルでせどり物販をしているので、面接時にそれを伸ばした方が良いと言うことで、物販ビジネス垢とし投稿しております。　 9月頃から物販ビジネスアカウントでX運用を始め、4ヶ月ほどでようやく1000フォロワー達成できました。 ポスト添削会で、ご指摘をいただいた点を全て修正し、自分の社畜を前面にだしたポストにコンセプト変更したお陰です。 有難う御座いました  ②質問内容 物販は以前からやっているので、物販ビジネス垢はそのまま続けて、新たに全くの初心者で裏垢を始めるのは難しいでしょうか？  ③運用の割合 物販垢７割 裏垢3割 位と考えております。 (あくまでも目安となります。)  ④理由 本音は裏垢をやりたかったので、1000フォロワーを超えた辺りから、もう一つビジネスアカウントを増やそうと考えておりました。 理由は、\"のんびりさん\"の副業スタイルが、目標としている形だったからです。 入会してから1ヶ月後くらいに試しに、\"こっそりさん\"のアフィから「裏垢奮闘記」だけ購入して目を通しました。 その後、特典で付いていた\"こっそりさん\"の個別面談でお話を聞いた時、X初心者なら裏垢は練習に丁度良いし、短期間でマネタイズしやすいとお聞きしたので、今回のご相談を致しました。  ⑤ゴール 【物販ビジネス垢】 興味付けポスト+教育ポストを継続。 高単価アフィが出来るように、ファン化を目標にしていく。 特に期間は設けないで、長期間を視野に入れて運用をしていく。  【裏垢】 運用3ヶ月を目標にNOTE等の販売をしていきたい。 (詳しい販売方法はまだ理解しておりません) のんびりさんのスクールに入会したいですが予算がなく、予算ができましたら、入会したいと考えております。  以上が現状と質問なります。 慣れない内の2軸運用は難しいのはわかっておりますが、考えをぶつけたかったのでご相談しました。 宜しくお願い致します","sourceUrl":"","createdAt":"2026-01-24T13:34:12.641Z"},{"id":"scr-1779710258413-zmgnfu","title":"[質問部屋] @あか@運営  @Yusuke＠講師  @なまいきくん   ※長文で失礼いたしま...","category":"feedback","content":"@あか@運営  @Yusuke＠講師  @なまいきくん   ※長文で失礼いたします。  お世話になります。 今月よりスクールに参加させていただいた亀井と申します。  Xの初期運用の立ち回りについて相談です。  ■相談概要 完全ゼロからの最初期から「強い実績」を出すべきか  ■参入ジャンル AIマネタイズ（高単価アフィ）  ■現状 Meta広告集客で、「AI×クライアントワーク」の講座を販売しており、 月400万円の売上を上げています。  今後はこの実績を軸に、AIマネタイズに関する発信をしていこうと思っています。 ただ、X運用経験はゼロ、完全新規アカウント（フォロワー0）からのスタートです。  ■懸念 最初からプロフィールや発信で 「AI副業で月400万」 のような強い実績を前面に出すと、  ・フォロワー0 ・過去ポストの積み上げがない ・界隈との関係性も見えない ⇒それなのに実績だけ強い  という状態になり、 「嘘くさい」と見られてしまうのではないかと不安があります。  ■考えている初期の立ち回り そこで、以下のような段階的な運用を考えています。  【フェーズ1：実績をぼかしつつアカウントの土台作り】 最初は強い数字は出さず、 「AI副業で脱サラしました」 「AIを使ったクライアントワークで収益化してきました」 程度の、数字を出さない実績表現で発信スタート。  練習を兼ねた日々のポストを行うと同時に、 ・AI副業系・ビジネス系の発信者を数十人フォロー ・プレゼント企画などに積極的に参加 ・リプなどで界隈との接触を増やす という動きをする。  すると、おそらくプレゼント企画に参加しているのを見た ビジネス系の発信者（同業者）からフォローされ始めるはず （リサーチ用のアカウントでそうなった）。  これにより、 ・フォロワー数の見た目の土台 ・「AI系の人」というジャンル認知 を作る。  このフォロワーは当然「同業者」なので、おそらくエンゲージメントは低いが 「見た目上の信用の土台」になる層、という位置づけ。  なので過度に集め過ぎず、フォロワー100程度までこの立ち回りをしていく。  【フェーズ2：実績を解禁する段階】 フェーズ1でフォロワーの土台と界隈認知ができたタイミングで、 「広告経由でAI系コンテンツ最高月400万」 という本来出したかった実績をプロフィールに掲載する。  ■ 相談したいこと 強い実績に切り替えるタイミングとして、上記の方針で問題なさそうか。  ■補足１：最終的に設定しようとしているプロフィール ・名前：ハリー｜AIマネタイズ ・プロフ文：半自動で月400万の引きニート。AI副業⇒仕組み化して脱サラした元社畜 ・ヘッダー：Univapayの決済レポート画像  ■補足２：発信内容の想定 Xから自社コンテンツ（AI×クライアントワーク講座）への誘導は今のところしない想定で、 セールスやサポートの負荷がかからない高単価アフィに専念したいと考えています。  したがって、発信内容としては「AI×クライアントワーク」など絞らず、 「AIマネタイズ」としてアフィ、note、SNS、ショート動画作成など幅広く扱っていきたいです （それもあって、プロフでも「AIマネタイズ」「AI副業」といった表現を使おうと思っています）。   よろしくお願いいたします。 (編集済)\n2026年1月25日日曜日 0:23","sourceUrl":"","createdAt":"2026-01-24T15:23:42.212Z"},{"id":"scr-1779710258413-uynlgy","title":"[質問部屋] @Yusuke＠講師   かなり初歩的な質問になってしまいますが、 実績なしの場...","category":"feedback","content":"@Yusuke＠講師   かなり初歩的な質問になってしまいますが、 実績なしの場合の方向性について質問です。  私はこれからAIジャンルでX運用していこうと考えていますが、実績は一切ございません。  この場合  自分がAI副業で実績を出すまでの過程をリアルに発信する  何らかのAI副業に挑戦して結果出せるように取り組む、  という方向性でズレていないでしょうか？","sourceUrl":"","createdAt":"2026-02-03T11:59:12.638Z"},{"id":"scr-1779710258414-qhqbox","title":"[質問部屋] @なまいきくん  @Yusuke＠講師  @あか@運営  お世話になっております...","category":"feedback","content":"@なまいきくん  @Yusuke＠講師  @あか@運営  お世話になっております。  Xの発信からリストイ
