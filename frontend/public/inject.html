て 投資する人が爆発的に増えました。 この背景には、 実は 政府による教育ロジック があります。 それが… 老後2000万円問題 です。 年金だけだと 老後資金が2000万円不足する ↓↓↓ 老後に備えるために 個人で投資をして資産形成しないと やばいかもしれない ↓↓↓ NISAで投資して老後に備えよう こういうロジックがあるからこそ、 「資産形成しよう」「投資しよう」 という思考に多くの人が変化しました。 もし仮に、 老後2000万円のロジックがなければ、 「投資で資産形成しよう！」 という思考にならなかったはず。 なので… 言っちゃえば ロジックを作って納得させてあげることで ようやく人は行動する のです。 じゃあ、 どうすれば商品に合わせた ロジックが作れるのか？ 大事なのはここになります。 ロジックについては 組み方は無限にあるのですが… 1番使いやすいものを紹介すると ① 課題解決型ロジック ② 欲求喚起型ロジック 「課題解決型」 は 悩みが具体的にある人 に使いやすい方法で 「欲求喚起型」 は ゼロから需要を生み出したい時 に使えます。 それぞれ深掘りしていきます。 1.課題解決型ロジック 都合のいいテーマで問題提起 都合のいい原因を指摘 都合のいい解決策を提示 理想の未来 を見せる 1.都合のいいテーマで問題提起 こんな悩みありませんか？（悩み） こんな状態に なりたくないですか？（欲求） まず 悩みか欲求の感情 を刺激しつつ 都合のいい問題提起 をします。 例えば X運用アルゴ攻略の商材 を売りたいなら ＜悩み訴求＞ ・ポストしてるけどインプが取れない… ・いいね、リプが増えない… ・フォロワーが減ってきてる… こういう悩みに焦点を当てれば、 「アルゴリズムを学べば良いですよ！」 というのに 都合がいい ですよね。 自分が売りたい商品で解決できる 相手の悩みを言い当てる ことで “自分ゴト化” させます。 読者は最初の段階では アルゴリズムに興味がない ので 相手が興味がある内容、 相手が日々感じてる悩みを語って 自分ゴト として聞いてもらう 必要があるわけです。 悩みではなく 欲求でもいい です。 ＜欲求訴求＞ ・ポストした瞬間に50いいね ・1日10分でスマホ1台で集客できちゃう ・ほぼ労力ゼロでフォロワー1000人 こんな感じで言えば、 相手の欲求を喚起しつつ 自分の売りたい商品へのロジックを作れます。 問題提起 をして 自分ゴト化 ができたら、 次のステップに進みます。 2.都合のいい原因を指摘する あなたがうまくいってないのは、 [原因]ができていないから。 [原因]さえ解決すれば、 あの問題もこの問題も解決して、 困ることがなくなります。 次に読者が 理想の状態にない原因 を指摘して気づかせてあげます。 もちろんこれも、 “売りたい商品に都合よく” というのがポイントです。 例えば、 Xアルゴ攻略の教材 が売りたいのに あなたが稼げていないのは 商品単価が低いから と指摘したところで、 何も嬉しくありません。 Xアルゴ攻略の教材が売りたい のなら インプが伸びない原因は、 シンプルにアルゴの理解不足です。 最近、Xは アルゴリズムが変わりました。 以前伸びてた人でも、 このアルゴ変更に気付けてない人 は 軒並みインプが落ちています。 僕は普段からXをよく見てますし 常にテストして 何をすれば反応が取れるか？ インプが1番伸びやすいのか？ をチェックしてます。 とか言っておけば、 伸びてない原因がアルゴにある と気づきます。 論理の流れで言うと… 悩み：インプが伸びない ↓↓↓ 原因：重要なアルゴ変更があった ↓↓↓ 解決策：最新アルゴを 施策に取り入れよう 冷静に考えればわかりますが、 人間がうまくいかない原因 って 複数あります。 インプが足りない のであれば 実績がなくて興味付けが弱い アカウントパワーが足りない アルゴリズムが変わった などいろいろあると思いますが、 その中で 「アルゴにあってない」 という 自分に都合がいい原因 を 取り上げてあげることで 勝手に読者は 「自分に足りないのはアルゴの知識だ」 と思ってくれます。 いかに自分の売りたい商品に 都合のいい原因を指摘できるのか？ これが重要です。 3.都合のいい解決策を提示する [原因] を解決するのには、 [解決策] をしましょう。 ここまできたら、 解決策 を提示します。 もちろん 自分が売りたい商品で学べるもの です。 ポイントは 簡単そうに伝えること 。 〜するだけ！ 〜さえすればOK！ あなたが稼ごうと思ったら 思考力はもちろん大事ですが 商品を売りたいなら、 読者には考えさせない のが大事。 なるべくシンプルに これだけやっておけばOK！ という感じで伝えましょう。 4.理想の未来を見せる [解決策] をやるだけで、 悩みから完全に解放されます。 (悩み訴求) [解決策]をやるだけで、 こんな理想の状態が手に入ります。(欲求訴求) 解決策をやって手に入る 理想の状態 を語ります。 解決策をやって手に入る 直接的なメリット だけじゃなくて その先で得られる未来 までを 語っていくといいです。 「教育」の理想の未来 なら ・成約率が上がる ・ローンチが伸びる ・LINE登録数が増える こういう 直接的なメリット だと 刺さる人がごく一部。 これに加えて その先の未来 として ・同じ労力で収益が３倍になる ・月100万、500万、1000万円と伸ばせる ・自由自在にお金を生み出せる。 さらに この先の未来 として ・寝てる間にもお金が生まれる ・回らない鮨や高級焼肉に行ける ・平日に弾丸で石垣島旅行いける ・節約を考えなくて良くなる ・老後の不安がなくなる こうやって 日常生活 に近い 理想の未来を見せられるようになる と 読者からの共感 も増えます。 軽く復習すると 1.都合のいいテーマで問題提起 2.都合のいい原因を指摘 3.都合のいい解決策を提示 4.理想の未来を見せる これはポストでも使えますし、 セールスレターやVSLでも使えます。 世の中には 「売れる文章の型」 が大量にありますが、 だいたいがこのロジックに 近いものが土台にあります。 課題解決型のロジックは ポストでもスペースでも ものを売りたい時によく使う ので、 ぜひ覚えておいてください。 2.欲求喚起型ロジック ２つ目は 需要を生み出したいとき に 使える教育ロジックの型 になります。 １つ目よりもシンプルなので ポストでの教育 や ラフに教育したい時 に めちゃくちゃ使いやすいです。 1. 理想の未来 を見せて欲求喚起 2. 要因(=売りたいもの) を提示する 3. 都合のいい根拠 で固める 4. 結論でアクションを提示する ちょうど わかりやすいポストがあったので、 それを元に解説すると… コンテンツ販売初心者の頃は1回商品売ると月300万円くらいだったが、今じゃ月1000万円超えは当たり前。(理想の未来)タネ明かしすると、これも全部教育を学んだおかげ。(都合のいい要因)正直集客に関しては昔も上手かったから特にビジネス学んでなくても月300出てたけど、教育能力は皆無だったからここ学んで売上の桁が1桁跳ねた。去年の9月は3400万円売れてるから数字にして約10倍。ちな、ローンチ時に抱えてたフォロワー数はほぼ同じ。単純に教育力の差で売上が10倍になった。(都合のいい根拠)元の額がある程度大きいから分かりにくいけど、月10万円の人なら教育学べば月100万円いけるということ。50万円なら500万円。それくらいの破壊力がある(結論でアクション提示) 1.理想の未来を見せて欲求喚起 自分はこんな実績を持っています。 こんな最高な生活を送っています。 こんな成果を得ています。 まずは 欲求を喚起して興味づけ します。 2.要因(＝売りたいもの)を提示 これができるのは [解決策]のおかげです。 理想の未来を得られているのは 〇〇のおかげです！ というかたちで 売りたいもの を 要因として提示します。 ここでも要因は なるべく シンプル＆ストレート に というのを意識しましょう。 “AできるのもBできるのも 全部〇〇を学んだおかげ” みたいな感じですね！ うまくいく要因ってのは 本来は複数あるはずですが 教育においてはなるべくシンプルに 「〇〇さえ学んどけばOK」 という見せ方にするとGoodです！ 3.都合のいい根拠で固める なぜうまくいくのかというと… ・都合のいい根拠１ ・都合のいい根拠２ ・都合のいい根拠３ ”うまくいってるのは〇〇のおかげ” という主張をちょうどいい根拠で 確固たるものにしていきます。 先ほどのポストの場合だと、 自分の体験談 から 教育を学んで売上の桁が跳ねた と 強調していますね。 ・自分の体験談 ・第三者 の事例 ・具体例 を挙げる ・有面人の名言を引用する ・歴史 から引っ張る ・それっぽい理論を使う 根拠は納得感があればなんでもOKです！ 4.結論でアクションを提示する [ 解決策 ] ができると 〇〇も××できちゃうので [ 解決策 ] しよう！ 再度、主張を押しつつ、 アクションを提示します。 「教育を身につけよう」 「外見磨きを頑張ろう」 みたいな結論ですね。 このときに ベネフィット を一緒に添えることで 教育パワーが高まります。 先ほどのポストだと 元の額がある程度大きいから 分かりにくいけど、 月10万円の人なら教育学べば 月100万円いけるということ。 50万円なら500万円。 それくらいの破壊力がある と書いてありましたが、 教育を学べば収入10倍になるかもよ！ とベネフィットを添えて締めています。 理想の未来 を見せて欲求喚起 要因(=売りたいもの) を提示する 都合のいい根拠 で固める 結論でアクションを提示する ストレートですが、 理想の未来→解決策→根拠→結論 とロジックが シンプルでわかりやすく 誰でも気軽に教育で使える ので 使いやすくておすすめです。 ということで、 ２つの教育ロジックパターン を紹介しました。 ① 課題解決型ロジック ② 欲求喚起型ロジック この２パターンだけ覚えてもらえば、 セールスレター だろうが セミナー であろうが、 アフィ記事 であろうが、 ポスト であろうが 同じように 教育ロジック を組めますし 教育ロジックが組める ＝商品が欲しくない人にも 欲求を生み出し欲しくされられる と言っても過言ではありません。 要素分解して小出しにすれば 教育ポストになるし 一連の記事にしちゃえば 教育記事やセールスレターになる みたいな感覚ですね！ まとめ 今回は１講義分まるまる使って 「教育の基礎」 を全てお伝えしました。 ざっと復習しておくと 11-1では、 教育っていうのは 絶望客 を 理想客 に変えること で 変えるための手段として 「価値観操作」と「ロジック構築」 がある という２分類の話をして 11-2で 価値観操作の前編 、 ６つの教育を復習しました。 目的の教育 信用の教育 問題点の教育 手段の教育 投資の教育 行動の教育 それぞれの要素で 具体的にこんなポストをしようね という具体的なパーツも紹介しました。 教育の基本はこの６つの要素を どれだけ解像度高く理解できてるかです。 そして、 11-3は今回新しくお伝えした ６つの強化教育 を話しました。 読む教育＆見る教育 変化の教育","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/LhLTttKrKd1j/lesson/wpHqzHR9VQ8W","createdAt":"2026-05-16"},{"id":"scr-1779710258098-cqciyi","title":"Lv.5 講義QA | なまいきスクール会員サイト","category":"feedback","content":"Lv.5 講義QA Lv.5の内容でいただいた質問に回答しました！ Q-1：1日4ポストすると言われているが、全てを興味付けポストにすべきでしょうか。 A-1：この点については、次のフェーズ別の講義で詳細に解説されますが、他の普通のポストと混ぜて打つことになります。 Q-2：初期段階では、興味付けポストをどのくらいの頻度で投稿すべきですか。 A-2：週3回以上の興味付けポストを含む、1日4ポスト以上が投稿頻度の目安です。 Q-3：認知獲得のため、強者（大手）に絡んで認知を広げつつ、プレイヤーとしてのポストを打っていくのは、前回講義の内容と組み合わせる形で良いでしょうか。 A-3：その方向性で合っています。 Q-4：クライアントの成果報告や、友達に教えた話をするのは「先生ムーブ」にあたりますか？ A-4：クライアントの成果報告は「先生ムーブ」に近いですが、「友達の成果」を出すのは基本的に問題ありません Q-5：恋愛系など、高レベルでプレイングしながら、それを低レベルな弟子に教えるような発信は微妙でしょうか。 A-5：微妙です。まず「自分が高レベルだ」という認知がずれている可能性があり、教えることはせず、最初はプレイヤーとして界隈に馴染むことが重要です。 Q-6：教えるムーブ（先生ムーブ）をやってしまっていた過去ポストは、全消しした方が良いでしょうか。 A-6：消さなくて大丈夫です。どうせ（初期アカウントのポストは）見られないためです。 Q-7：アカウントのヘッダーや固定ポストをGPTSで作り込んだことで業者感が出ているが、プレイヤー感を出すために変更すべきでしょうか。 A-7：変更すべきです。作り込みすぎるとキモい（業者感が出る）ため、プレイヤー感を出す方が良い。 Q-8：プロフィールや固定ポストに実績を載せない方が良いですか？ A-8：実績は載せても問題ありません。ただし、ヘッダーやアイコンを含め、全体的に作り込みすぎると業者感が出るため、プレイヤー感を損なわない程度にすべきです Q-9：興味付けポストは他の普通のポストと混ぜて打つのか、ひたすら興味付けポストを打つのか、どちらでしょうか。 A-9：他の普通のポストと混ぜて打つ形になります。 Q-10：プレイヤーフェーズでは、ポストで改行や太字はあんまり使わない方が良いでしょうか。 A-10：あんまり使わなくて良いです。装飾が多いと時間がかかっている感が出て、「本気で発信している＝教育者」の要素になってしまうため、避けた方が良い。 Q-11：GPTSを使ってポストを作成するのではなく、普通に素人感あるポストをした方が良いでしょうか。 A-11：まず1回自分で作ってみるのが良いですが、1ポストもできなくなるくらいならGPTSを使うべきです。プロ感が出すぎるのを避け、まずは自分でポストを作ってみるのは有効です。 Q-12：ポストが伸びない現状を受け入れ、改善し続けるしかないのでしょうか？ A-12：その通りです。ポストが伸びるかどうかは50%ほど運の要素があるため、「当たるまで様々な角度から試す（ガチャを引きまくる）」ことが重要です。 Q-13：成功ポストと失敗ポストの投稿頻度の良い割合はありますか？ A-13：目安として、成功10に対して失敗1程度（1割）が良いです。成功ばかりだと読者が飽きたり、「人間味がない」と感じたりするため、失敗を時折入れることで「人間味」を出し、興味ゲージを意図的に上下させる（ジグザグにする）のが重要です Q-14：投稿に画像や動画は必須ですか？ A-14：必須ではないが、あった方が良いです。例えばダイエットの成功例なら、文字だけより写真の方がパッとイメージが入りやすいため、活用するのが望ましい。 Q-15：「興味付けの角度を変えるたび」に実績画像も変えるべきでしょうか？ A-15：ネタ（素材）の量によりますが、同じ実績でも見せ方を変えるのは非常に有効です。例えば、同じ100万円の売上でも、ノートの売上画面、銀行振込画面、通知画面など、視覚的なバリエーションを出すべきです Q-16：興味付けの画像のレパートリーを増やすのが難しい（特に恋愛系）。 A-16：そのイメージは固定観念であり、恋愛系でも無限にパターンは出せます。例として、プライベートサウナでの水着写真、海外旅行、デートスポット、マッチングアプリのトーク画面など、他人がやっていない要素を出すことが重要です。 Q-17：どこに興味付けしていくかはポストを作る前か決める感じですか A-17：作る前に決めます。既存の手法では興味付けできないため、新しい手法（あるいは新しく見えるもの）を出す必要があります。最終的に何を売りたいか（例：高単価アフィリエイト、特定の情報商材）からの「逆算」が必要です Q-18：「知りたい人いる」とか「公開しようか」みたいな先生ムーブのポストは、いつやるべきでしょうか。 A-18：反応を取れる確信を持ってから出すべきです。読者のテンションが上がり、「教えてください」とDMが20件くらい来て、相手が金銭を払っても知りたいと言う段階が良い。 Q-19：過去の事業の売上を実績として興味付けに使うのはありか。 A-19：発信ジャンルによる。裏垢発信なのに物販の実績を出しても意味がわからない。ただし、Xマネタイズのようにジャンルに繋がるのであれば、投資実績などを出すのはオッケー。 Q-20：過去の実績を上手いこと出して発信するのは良いでしょうか。 A-20：もちろん良いです。ただし、古い実績ばかり擦り続けると「それしか実績がないのか」と思われ、やりすぎは現金です。 Q-21：成功と失敗の頻度の割合は、どのくらいが良いでしょうか。 A-21：成功9割、失敗1割くらいが良いです。成功→失敗→成功とジグザグで推移させることで、読者に飽きさせず、人間味を出すのが重要です。 Q-22：アフィリエイトの売上金額の方が高いが、成果報告でリアルな金額を載せた方が良いでしょうか。 A-22：見せ方次第です。嘘をつかない範囲で考えれば良いですが、手取りの金額を載せる必要はありません（税金などで引かれるため）。 Q-23：投資アカウントで、画像（実績）をどのように出せば興味付けになりますか？ 投資系で画像（実績）を出すのが難しい。都度変わる前日比や評価損益ベースでも良いか。 A-23：利確（利益確定）ベースの画像にこだわる必要はありません。前日比の変動チャート、企業分析の様子、あるいは「この銘柄は天場（10倍株）になる」といった期待感を出すなど、お金が動いていることを視覚的に表現する方法があります Q-24：リアルな副業の進行状況をポストすべきか。副業していないならアイデアや稼げそうと思っている考えを出すだけでも良いか。 A-24：実際に活動すべきです。エアプで楽をしようとすると、半年後に必ず差がつくため、長期的に稼ぐにはプレイヤーしか出せない一時情報が必要です。 Q-25：株アカウントでFP資格を持っている場合、最初から出すべきですか？ A-25：FP資格はさらっと出す程度なら問題ありません。ただし、その資格を根拠に「教える側」のポジションに立つ（先生ムーブをする）のは避けるべきです Q-26：恋愛系で、ホテルの鍵やLINEスクショ以外に有効な興味付け画像はありますか？ A-26：ホテルの鍵は「ありきたり」なので避けるべきです。他の発信者がやらないような「珍しい要素（差別化）」を意識すべきです。例として、海外旅行、プライベートサウナでの水着写真、ドライブ、高級ラウンジでのアフタヌーンティーなど、私生活の充実感を出す写真が有効です Q-27：恋愛系で顔を隠して体の写真の方が良いか（リスク回避の観点から）。 A-27：画像を出すなら、特定されないよう配慮すべきです。また、写真だけでなく、音声加工などで「もう入れてください」のような音声を載せるなど、工夫も可能です。 Q-28：恋愛系で、料理やティンダー女子の生態について発信しているが、方向性は合っているか。 A-28：めっちゃ良い方向性です。ティンダー女子の生態などは皆知らないので、面白い情報になる可能性が高い。 Q-29：ナンパ系で現在活動できず、過去の実績やノウハウ（マッチ数最大化、お持ち帰りノウハウ）で伸ばせるか。 A-29：やめた方が良いです。ノウハウの発信では新しい興味付けが難しく、過去の実績（1年前の活動）は死んでいるアカウントと同義です。ゼロからプレイヤーとして実績を積み直すか、実績を持つアカウントを買うか、ジャンル変更を検討すべきです Q-30：アダルトアフィリエイト発信で、裏垢系スクールへの集客は可能ですか？ A-30：集客のターゲット層が近いため、アダルトアフィリエイトの実績で集客し、高単価の裏垢スクールを販売するのは十分「あり」です Q-31：シャドウバンになり、ポストやいいねを控える期間はどれくらいか。解除されない場合作り直すべきか。 A-31：解除されるまで待ちます。大体1週間ぐらいは控える必要があります。初期アカウントなら作り直すのもあり。 Q-32：AI系発信で、楽しそうに画像・動画・音楽推薦している様子を続けるのは興味付けにつながるか？ A-32：それは「プレイヤー感」を出すのには役立ちますが、それだけでは興味付けにはなりません。興味付けのためには、「30分かかっていた作業が、最新AIツールでたった5分でできるようになった」のように、フック（興味のきっかけ）とノウハウを紐づける必要があります Q-33：裏垢発信で、物販など関係ないジャンルの売上を実績として載せても良いですか？ A-33：避けた方が良いです。裏垢系はノウハウやノートの販売が主軸となるため、メルカリの売上画像など無関係な数字を出すと、読者に不信感（不審に）つながる可能性があります 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/ihib0t9yKtcd/lesson/ycJzXscjPtqa","createdAt":"2026-05-16"},{"id":"scr-1779710258099-ihdwle","title":"10-1 読者を思いのままに動かし、インプ・反応率が爆上げするインセンティブ設計の極意 | なまいきスクール会員サイト","category":"material","content":"10-1 読者を思いのままに動かし、インプ・反応率が爆上げするインセンティブ設計の極意 今回は 読者が即行動するようになり インプ・反応率が爆上がりする 悪魔的テクニック ということで、 なまいきくんがX運用で使ってる ２つ目の必殺技 を紹介していきます。 前回の講義では… なまいきくん式X運用の 必殺技１つ目として。 ストーリー型運用 を お伝えしました！ 注目を集めながら 商品を売るために、 単に言葉で教育するんじゃなくて 行動する過程をストーリー として ポストしていくことで 目の前で見せつけて 強烈に教育すること ができる。 ファンを作るX運用の中でも トップクラスに威力がある技 です。 そして今回は、 なまいきくん式X運用の 必殺目の2つ目として、 インセンティブ設計について 詳しくお話ししていきます。 なまいきくんのポストって 異様にエンゲージメントがつく スピードが速い です。 ポストした数分後に 30いいね、50いいね はザラですし、 本気で伸ばしに行くポストは 10〜20万インプ を超えることも 珍しくありません。 普通に考えると、 ポストして2〜3分で50いいね超え っておかしいですよね。 アルゴリズム的に言うと ポストする ↓↓↓ 最低限のインプがつく ↓↓↓ 反応率が高ければ 後からインプが伸びていく という仕組みになっているはずなので ポストした直後から 30いいね、50いいねがつくのは おかしい と言わざるを得ません。 じゃあなんで、 なまいきくんはそんなことができるのか？ ポストした瞬間に 大量のいいねがつくのか？ なんでもない普通のポストに リプが何十件も届くのか？ それを可能にしているのが、 今日お話しするインセンティブ設計です。 インセンティブ設計を マスターすると… 狙ったポストにいいねをつけたり 読者が通知オンして待機してる 状態を意図的に作れたり スペースや無料プレゼント企画で 初速で参加してる人を圧倒的に増やしたり などなど。 自分の思いのままに 読者を動かすことが可能 になります。 そして、 これができてしまうと SNSで物を売る のが 非常にイージー化 します。 人を動かすスキルは フォロワーの伸び にも ローンチの盛り上がり にも 大きく影響するからです。 今回の内容を学んでもらうと めちゃくちゃ運用が得意になります。 そして、 今回は前回に引き続き かなり 応用的なテクニック です。 100%理解できなくても ちょっと真似して使うだけでも もちろん効果がある手法 なので ぜひしっかりと学んでください。 インセンティブ設計とは 何か？ じゃあ、 そもそもインセンティブ設計って なんなのか？？ という話をしていくのですが… まず最初に、 ビジネスで金を稼ぐために 必ず覚えといてほしい 事実があります。 それは… 人間は自分にメリットがないと 行動しないということ Xである程度発信してくと 普通に気軽にポストしても、 いいねやリプがつく ようになります。 人によっては 「ファンです！！」 「商品あれが即買いします！」 と言ってくれる人が 出てくるかもしれません。 ですが… 自分にファンは1人もいない というスタンスで、 僕はXを運用しています。 なぜか？？ それは、 自分にファンがいる と思って 運用をしてしまうと 「どうせいいねくれるっしょ」 「ポストしたら見てくれるっしょ」 「スペース軽く告知したら集まるっしょ」 「商品も買ってくれるっしょ」 という楽観的な考えで ついXを動かしてしまうからです。 👆これがXで商品が売れなくなる原因 こういう 楽観スタンス で Xを運用してしまう人は… はっきり言って ３流 です。 お客さんっていうのは、 別にあなたのファンじゃありません。 本人はファンだと 言ってくれるかもですが、 あくまでも自分にとって 都合のいい発信をしてくれたり 興味があることを言ってくれるから ファンを名乗ってるだけ。 別に自分に得がなければ 基本は行動してくれないし、 無条件に いいね、リプ、引用 など 行動してくれるわけじゃありません。 これを理解しておいてください。 となると… 原則として、 他人に行動してもらいたいとき いいねしてほしい 引用リポストをしてほしい ポストを追っておいてほしい 商品をアフィしてほしい 感想を書いてしてほしいとき ポストを通知オンしてほしいとき などなど 相手が行動したくなるような 何かしらのインセンティブが必要 です。 インセンティブ＝ 何か行動したくなるような 動機や刺激のこと。 ・AをしたらBがもらえる ・Aをしたら認知してもらえる ・Aをしたら損を回避できる etc. 例えばですが、 Xにおいて 通知オンして 発信を常に追っといてほしい！ と思った場合。 普通の人は 「通知オンしてチェックしといて」 を直接いうくらいしかしません。 というか、 もはや直接言うことすらしない という人が大半ですね！ 一方でなまいきくんは 「どうやったら通知オンしたくなるか？」 という視点で常に考えてます。 そして、 具体的な施策 として レア情報をポストして即消しする 早い者勝ちな企画をする みたいなのが思い付きます。 多分これを聞いて なんでポストを即消しするのが インセンティブになるのか？ を理解できる人は かなり少数派だと思います。 なんでポスト削除が通知オンする インセンティブになるかわかりますか？？ ・ ・ ・ 答え。 レアな情報をポストして即消しすると 見れなかった人が後悔して 次は見逃さないように と思うから。 具体的にはこんなポストですね👇 ・ポスト消した ・通知オンしてポスト見れた人はラッキー ・久々にポスト消した ・通知オンだったなまチル勢は見れたよね ・ポストを１つ消した ・悪いポストは即削除する ・悪いポストがわかるのが重要だから ・見れた人はラッキー このポストを見て、 ポストを見逃した人は 「えー！見れなかった！」 となって通知オンして 次は見逃さないように チェックするようになります。 こちらが実際のリプ欄です👇 ・通知オンで見れました！！ ・通知オンしてたけど見れませんでした… ・通知オンにしました！ というリプを見ると 「うわぁ…見逃しちゃった…」 という 後悔 の気持ち と 「どんなポストをしてたんだろう？？」 という 好奇心 が刺激されます。 後悔や好奇心を感じると 次は絶対に見逃さないようにしようと 通知オンにしますよね？？ というか、 せざるを得ないですよね？？ 1番最初に なまいきくんのポストは 異様にいいねが付くのが早い という話をしましたが、 その理由もこの通知オンです。 今までの運用の中で 常に通知オンさせる インセンティブを置いてきた ので 濃いフォロワーが ほぼ通知オンしてくれてて ポストした瞬間に見にくるから です。 そして、 いいねするインセンティブ も 仕掛けていたので、 いいねもめちゃくちゃ多い。 通知オンについては ちょっと 応用的な例 だったので、 わかりやすい別の例 を挙げると 「コンテンツの感想書いて！」 といっても、 読者はあまり行動してくれません。 だからこそ、 「感想書いてくれたら特典あげます」 という インセンティブ をつけて 感想を回しやすくしてる のです。 感想特典は やってる人が多いですが、 その土台にある インセンティブの考え方を マスターしてる人は少ない ので これを理解しておくと 非常に応用が効きます。 こんな感じで 全てのアクションにおいて 読者が自分から 「〇〇しなきゃ！」 と感じるような インセンティブを用意しておくこと。 これが インセンティブ設計 の 第一歩だと思ってください！ 前回お話ししましたが… 実は前回講義の ストーリー型運用で紹介した のんびりくん裏垢ローンチ でも インセンティブ設計 を使ってました。 軽く復習しておくと なまいきくんが裏垢に挑戦する ↓↓↓ なまいきくんが勘違いして暴走 →エロ画像を撮りまくる ↓↓↓ 事件が起こる ↓↓↓ 事件の内容が明かされる →エロ画像が不要だとわかる ↓↓↓ のんびりくんの セミナーで詳しく解説 こんな流れで ストーリーを進めました。 そして、わかりやすく インセンティブ設計を使ったのは ３つ目の 「事件」のパート 。 そこで こんなポスト をしました👇 これらのポストこそが、 非常に強力なインセンティブ になっています。 この意味がわかりますか？？ このストーリーにおいて 重要なのは でした。 そして、 これらポスト ”単体” では あまり意味がありません。 別に教育もしてないですし、 セールスをしてるわけでもない。 ですが、 「最悪な出来事が起こりました、、、」 「これまでの努力が無駄になったんやが、、、」 という ジャブ としての 興味付けポスト を入れておくことで、 次の 「エロ画像不要の教育ポスト」 への 注目度 を圧倒的に高めています。 簡単にいうと、 次のポストの 威力を上げてる感じ ですね！ ポケモンで 「きあいだめ」 みたいな技がありますが、 これに似てますw この技自体は意味がないけど、 やっとくと次の技で 「急所」に当たりやすくなる、 みたいな感じですw このポストも、 単体では意味がないし 別に 「次のポストに注目」 と言ってるわけではないけど 次のポストに注目する インセンティブ になってるので 威力を上げること ができる。 これが インセンティブの考え方 です。 その上で… なまいきくんが 何か商品を販売するときは 商品のリリース に向けて 無数の伏線（インセンティブ） を用意しています。 普通の人の場合 、例えば 「コンテンツ作成の教材を売りたい」 と思ったら コンテンツが資産として働いてくれる 一度作ればストック収入ができる コンテンツが集客装置になってくれる コンテンツがファンを作ってくれる こういった 教育ポスト を ただ投稿すること しかしません。 確かに これ自体は重要ですが、 そもそも 教育ポストが伸びない 教育のためのスペースに 参加者が少ない とかであれば、 正直あまり威力は出ません 。 どれだけ教育がうまくても、 インプが伸びず 読者が見てくれなければ 威力は半減してしまう のです。 一方でなまいきくんの場合は、 「ポストを見る」 「スペースに参加する」 「無料プレゼントを受け取る」 など１つ１つのアクションに対して ”それをしたくなるような伏線” をたくさん貼っておいて 商品を出すタイミングで 一気に伏線が回収されて 最大火力が出るような 売り方＆Xの動かし方 をします。 はい。 この段階では、 まだピンと来なくても大丈夫です。 「え、伏線ってどういうこと？」 「インセンティブ設計って結局なんなの？」 みたいに、 まだ理解度は低いかもですが まずは 何かしてほしい行動がある ときは 単に 「〇〇してください」 というだけじゃ弱くて 何かしらのインセンティブを 作る必要がある というのだけ、 頭に入れておいてください！ それではここから、 実際になまいきくんが インセンティブ設計を使って 爆発的な売上を作った事例をもとに もっと詳しい内容を掘り下げていきます！ 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/lmKPPner7s0L/lesson/uVgg2JlJ3k8c","createdAt":"2026-05-16"},{"id":"scr-1779710258099-ptunqm","title":"【1ポスト目から1万インプ&フォロー50人増加！】20250909 | なまいきスクール会員サイト","category":"material","content":"【1ポスト目から1万インプ&フォロー50人増加！】20250909 【1ポスト目から1万インプ&フォロー50人増加！】 スクール生のふくろうさんが 1ポスト目から爆伸びしてますね、、、 まあこれ実績めちゃ強いんで そりゃそうちゃそうなんですが、 X運用の本質をついてるポストではあったので、 ポストを取り上げてサクッと語ってみました。 10分もあれば見れるので、 スキマ時間にでもご確認ください！ 目先のポストが伸びてないとかは マジでどうでもいいんですよね。 そんなん動画で語ってる強い〇〇が 出来れば後からいくらでもまくれるので。 前へ 受講済みにする 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/tsUPBU4o9rpF/lesson/riR5SMCAk7Zp","createdAt":"2026-05-16"},{"id":"scr-1779710258100-nuznmg","title":"SNSマーケティング 完全攻略②〜売上を生む４ステップ〜 | なまいきスクール会員サイト","category":"material","content":"SNSマーケティング 完全攻略②〜売上を生む４ステップ〜 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/cafUI3QFQSfy/lesson/uurltdQfHqGr","createdAt":"2026-05-16"},{"id":"scr-1779710258100-mtrohm","title":"1-2 Discordコミュニティを活用しよう | なまいきスクール会員サイト","category":"discord","content":"1-2 Discordコミュニティを活用しよう 今回は、Discordコミュニティ 「なまいきビジネススクール」 の使い方について解説します。 「なまいきビジネススクール」 とは 全体連絡や進捗報告 を行う コミュニティのことです。 今回Discordで 「情報共有・コミュニケーション」 を行えるためのコミュニティを用意しました！ コミュニティの目的 SNS運用は基本的に 「伸びない種まきの時期」 が絶対にあります。 その時期に 「稼げそうにない…やめよう…」 と 不安 になり、 モチベーションが落ちて X運用をやめてしまう人が多い のです。 モチベーションが落ちた時に ✅️ 他人の成功事例を知れる ✅️ 雑談や情報共有ができる ✅️ グループで質問や相談ができる これだけで挫折率は 圧倒的に下がります。 さらに、 追加で コンテンツを配信するための コミュニケーションツール としても使うので、 必ず参加しておいてください。 使い方【迷ったらコレに従え】 本Discordは プランによって 表示される部屋が異なります。 閲覧できない部屋に関しては 設定で非表示にしていて、 発言できない場所は 設定で発言できないようにしています。 ですので、発言できる部屋は全て、 発言していただいて大丈夫です🙆‍♀️ 「なまいきビジネススクール」の中身 スクールのDiscordには、 主に 4つのブロック があります。 まずは、全体向け。 #️⃣ 自己紹介 参加直後に自己紹介をする部屋 入力例） #️⃣ 全体連絡 運営からの連絡を行う部屋 なまいきくんの発信例） #️⃣ なまいきコラム なまいきくんがリアルタイムで考えてることや、 日々の気付きをラフに発信 なまいきくんの発信例） #️⃣ 雑談部屋 受講者同士で雑談や情報交換をする部屋 たまになまいきくんも 会話に参加します🔥 #️⃣ カリキュラム進捗 カリキュラムが進むごとに 完了報告をするための部屋 入力例） 本会員サイトには 各コンテンツに数字が振られております👇 こちらがLv〇〇(-〇〇)に 対応するものとなっております。 こちら視聴＆実践完了しましたら、 Discordに報告いただく形でお願いします！ 例）01.「はじめに」X集客特化スクール の視聴が完了したら、 Discordへ「Lv1終了しました！」 と報告しましょう！ #️⃣ 日報 毎日の作業内容を報告する部屋 入力例） 日報報告する習慣をつけないと 確実にダレて成果が出るものも出なくなります。 例： ・プロフィール作成→完了(1時間) ・ポスト作成5本(30分) ・講義視聴2本(40分) 今日から毎日23時までに 日報を送りましょう。 #️⃣ 成果報告 成果を報告する部屋 成果報告の部屋では メンバー同士で競い合うことで、 確実に伸びるのが早くなります 。 例： ・フォロワー〇〇人突破 ・売上〇〇円達成 入力例） 次に、期別。 #️⃣ 講義アナウンス リアルタイム授業の告知 オンライン講義は本来 スクール生の自学自習をしてもらう予定でしたが、 なまいきくんや講師の好意で特別に リアルタイム授業を基本 「週1回」行っております！ 全員とは限りませんが、 生徒の質問にも極力答えてくれます！ 質問内容は各授業の内容についてのみ可になります。 (別講義の内容に関する質問は、 別の生徒へ迷惑がかかる恐れがあります！) 【⚪︎期生】⚪︎年⚪︎月⚪︎日〜入会 を確認して、 ご自身に当てはまる方の #講義アナウンスを確認しましょう！ なお、リアルタイム授業が複数回 終わっている場合があるので、 終わっている分の内容は 本会員サイトで学習いただき、 リアルタイム授業の進行に 内容が追いつきましたら、 リアルタイム授業へ合流していきましょう！ #️⃣ 質問部屋 自由に質問・相談できる部屋 ★プラン特典 ご自身の該当する⚪︎期生の #質問部屋 にピン留めしている 「利用方法」を必ず確認した上で、 質問お願いします！ ※質問部屋が プラン特典サポートに入ってる人のみ メッセージが送れる設定になっています そして、プラン別。 サポートに ポスト作成会＆添削会が入っている方は 上記の部屋が表示されますので、 連絡を確認して 、基本週1回行っている ポスト作成会＆添削会へ参加しましょう！ そして、ジャンル。 同じ発信ジャンルのスクール生同士が 情報交換を行える場です。 仲間と切磋琢磨 協力しながら成果に繋げていきましょう！ 200%活用して成長するには？ X運用はチーム戦 です🔥 稼げない原因なんて 1. ノウハウがない 2. やることが多すぎる 3. モチベーションが続かず挫折する 👆️このうち 「ノウハウがない」 「やることが多すぎる」 これについてはすでに解決してあるので、 あとは 競い合える環境が超大事 になります。 Xの全情報が集まるように していきたいと思っているので、 ぜひこのコミュニティを フル活用 してください。 Q&A Q. Discordはどの部屋なら発言しても問題ないのでしょうか？？ A. 発言できない場所は、そもそも設定で発言できないようにしているので、発言できる部屋は全て、発言していただいて大丈夫です🙆‍♀️ 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/5y6Isv53E5QP/lesson/B6VheWpNnaWU","createdAt":"2026-05-16"},{"id":"scr-1779710258101-ddurqz","title":"11-3 価値観を操る12の教育要素（後編） | なまいきスクール会員サイト","category":"material","content":"11-3 価値観を操る12の教育要素（後編） それでは 「12の教育要素[後編]」 ６つの強化教育 について話していきます！ これは教育の効果をUPして より強烈なファンを作るための 要素です。 【６つの強化教育】 読む教育＆見る教育 変化の教育 素直の教育 アウトプットの教育 基準値の教育 覚悟の教育 １つずつ見ていきましょう！ 1.読む・見る教育 記事や動画、スペースの冒頭 で 必ず入れるようにしてるのですが そのコンテンツを見る動機づけ これが非常に重要です。 教育において1番最悪なのは、 そもそも見られずにスルーされる こと。 読者は日々大量の情報に触れてるので 普通にコンテンツ配信するだけ だと 「 流し見される or 飛ばされる」 というのが関の山です。 そこで、 なまいきくんは記事や動画で 必ず 「それを見るべき理由」 を作って 最後まで見るように読者を拘束してます。 具体的には… 記事を読むメリット この記事で何が学べるか？ （興味付け付き） 重要だからと メモを促す 後半や中盤で”何か”を話すと興味付け 最後まで見たら 特典がある と訴求 「すぐ消す」などと限定性 をつける みたいな感じですね！ 例えばですが、 スペースとかを開催するとき は 序盤や事前予告ポスト で 「これ録音残さないんで」 「メモ取っといてください」 「有益なことポロッというので」 「今日話す内容使ってもらえたら、 こんなやばいことできます。」 とか言っておくだけで、 読者の離脱率や熱量 は全然変わります。 人間って結局、 自分にメリットがある とわからないと 集中して読みませんし、 「いかにその情報が重要なのか？」 を伝えることは、 その本文の内容以上に大切 です。 セールスレターとか アフィポストを作るときは 「ベネフィットを書きましょう！」 「理想の未来を描きましょう！」 みたいなことを よく言われますが ”記事” を読ませたいとき、 ”スペース” を聞かせたいとき、 ”コンテンツ” を受け取らせたいとき 全てにおいて ベネフィット を入れてあげること で 「よし！これを集中してみよう！」 とモチベが上がって、 劇的に教育がかかりやすくなります。 2.変化の教育 さて２つ目が 「変化の教育」 。 変化＝良いこと という思考を植え付けて 変化に対する恐怖を ポジティブ変換する教育 と思ってもらえればOKです。 まず前提として、 人間には生まれながらにして 「変化を恐れる思考」 がインストールされてます。 よくある例だと、 自分で起業したい！ 会社を辞めて頑張りたい！ 大きい自己投資をしたい！ と思ったときに、 周りの友達や家族が 「それやめた方がよくない？」 「それお前には厳しいよ」 「センスがある人しか無理だよ」 「まず３年働いてからのほうがよくね？」 みたいに、 足を引っ張るような 発言をしてくることですね。 僕も受験をやめて ナンパ師になる といったとき 当時仲良かった友達に言ったら お前何やってんのw バカやってないでやめとけよ。 と言われました。 こういうのを ドリームキラー と言ったりしますが 身近な人がドリームキラーになるのも 「自分の周りが変わるのが怖い」 という思考が染み付いてるからです。 この 「変化への恐怖」 があると、 自己投資するのはもちろん 新しいことを始めるのにも 強烈なブレーキがかかっちゃう ので かなりマイナスになります。 そこで必要なのが変化の教育。 人生を変えるには変化しないといけない 変化するのはいいことだ 変化の恐怖を乗り越えないといけない こういう教育していくことで マインドブロックを破りやすい 思考に書き換えていきます。 具体的には、 普段の発信の中で 成長するとき ＝変化の恐怖を克服したとき 成長したきゃ今までの環境を捨てろ ビビったときこそGO。 逆にみんながOKということは やめとけ。 ドリームキラーは無視してOK みたいな思考を伝えていく感じですね。 特に有効なのが 変化に伴なう恐怖 ＝ 成長痛だ という教育を入れていくことですね。 「ビビる = 成長のチャンス」👇 こういう教育をいれておくと 「 高額な自己投資怖いな…」 とグダりそうになったときに いや、こういう時こそチャンスだな という思考になってマネグダが激減します。 なまいきくんのメルマガだと こんな 物語で変化の教育 をしてます👇 僕は九州出身ですが、 ナンパをはじめるときに 地元の友達全員の LINEをブロックしてて、 そのまま上京しました。 ナンパをやると、 周りの人には確実に止められるし、 ネガティブな言葉 を言われます。 「そんなことしてる余裕あるのか」 「早く大学に行って働け」 「頭おかしくなったのか」 こういう言葉は 完全に足枷しかない 。 これをとことん排除するために、 友達をブロックしたし、 環境も大きく変えた。 だからこそ短期間で ぶち抜くような成果を出せました。 メルマガ要約 「古い人間関係をブロック」 「ネガティブな言葉＝足枷」 「環境を変えたから成功できた」 こういう物語を入れておくと あ、こういうぶっ飛んだ行動が 成果を出す人には普通なんだ というふうに価値観がバグってきます。 これが重要です。 感覚をバグらせていかないと 人間は変化をビビって動けません。 ただ今まで普通に生きてきて 稼げてない、モテない現在があるんだから 何かを変えないと人生は変わりません 。 だからこそ、 変化の教育は情報発信するなら 必須レベルで重要です。 この教育がバチっと決まると 強烈にファン化できちゃうので ぜひ使ってみてください。 3.素直の教育 これも非常に大切な要素です。 知識がある人から素直に学んで 実践するのが成長の近道 というのを伝える教育ですね。 人間っていうのは、 素直な人ほど教育がかかりやすい です。 教育がかかりやすいというと ちょっとネガティブなイメージですが 裏を返すと 素直な人の方が言われた通りに すぐ行動する ので、 爆速で成果を出すのは素直な人 です。 スクール生とかでも、 爆速で伸びまくってる人は 週末に学んだ内容を、 その翌日からすぐに実践してます。 アカウント買収１つとっても、 成果出す人は細かいこと気にせずに マニュアルの通りにDM送りまくります 。 そしたら結果、 色々考えて動けない人 よりも 確実に成果出す感じですね！ 素直の教育を入れておくだけで、 ６つの教育やその他の教育要素 が 圧倒的にスッと入るようになる ので Xのポストでも定期的に出していくと いい です。 具体的には… 素直な人＝成功する人 というラベリング 素直に言われた通り行動して 早く成功できた体験談 逆に自己流でやって失敗した話 などですね！ このポストとかは、 自分の体験談 をもとにして 素直の教育をいれてます👇 これはラベリングを使って 「素直なやつ＝圧倒的に伸びる」 という教育を入れてます👇 こんな感じに 実際に超素直に行動してる人を ポジティブに持ち上げて紹介する のも 非常に効果がある方法です👇 初心者はとにかく自己流やめて 稼げてる人から素直に学べ。 この教育をひたすら入れていきましょう。 4.アウトプットの教育 アウトプットすること ＝良いことという教育 これは記事やコンテンツの中で 必ず入れるようにしてます。 教育において 重要な考え方ですが 「相手に何かしらアクションさせる」 というのは非常に有効です。 コメントさせる いいねさせる リプさせる メールを読ませる なんでもいいです。 アクションするのを 当たり前にさせておくことで 「面談に来る」 「商品を購入する」 みたいな 行動のハードル も 下がります。 その中の1番ハードル低い行動として 「アウトプット」 させましょう。 やり方としてはシンプルで アウトプットのメリットを語る アウトプットしてる人を ポジティブに持ち上げてあげる みたいな感じでOK！ 具体的にみていくと… アウトプットしないと 明日には99%忘れています。 ほとんどの人が アウトプットしないからこそ やれば上位10%なんて簡単になれます。 逆に、ただ読んで満足していると 来年も１ミリも成長せず 同じことしてます 熱量ある人はアウトプットしてくれたら 僕も認知しますし定着度も上がります (👆インセンティブ） みたいに伝えていく感じです。 こんな感じで 熱量あるアウトプットをくれた人を 個別で取り上げることで 感想を送ってくれる人が増えます👇 動画でモザイクかけた アウトプットを載せてます ある程度ファンがついてくると 「感想依頼したら書いてくれるやろ！」 みたいな 勘違いをしてしまいがちですが、 読者は感想を書くみたいな 「めんどくさいこと」 はそう簡単に行動してくれません。 マーケ目線で見ると 感想を書いてくれない ↓↓↓ 口コミが広まらない ↓↓↓ 商品が売れない、 認知が広がらない ということになるので、 アウトプットの教育を 事前にいれとくのは非常に重要です。 教育っていうのは、 「感想を書いてください！」 と依頼するんじゃなくて 感想を書くこと、 アウトプットすること ＝読者にとってのメリット というロジックを作ってあげることですね。 お願いじゃなくてロジックで動かせる。 これが 教育の基本的な考え であり、 教育ができると ネットで稼ぐのはもちろん 営業も対人コミュニケーションも 非常に得意になります。 さて、ここから非常に重要な 最後の２つに入っていきます。 5.基準値の教育 極端な行動を促して 読者の基準値をバグらせる教育 この教育はガチでえぐいので 悪用厳禁でお願いします。 超高単価を売るときに 有効な教育テクニックなので 特に高単価アフィをしたい人は 必ず覚えて帰ってください。 スクール生であれば わかると思うのですが… 100万、200万円を超えるような 単価を支払うにはかなり決断力 がいります。 これって凡人であれば、 相当基準値が高くないと 踏み出せない と思います。 そこで大事になってくるのが 基準値をバグらせる教育 簡単にいうと 普通の基準値 = 凡人、負ける 勝つ人の基準値は異常でバグってる というのを 刷り込んでいくような教育 です。 具体的にいうと… 深夜3時でも即呼び出したらくるのが 成功するやつの基準値 稼ぎたければ最初は 100万円借金してでも投資すべき 自分は環境に毎月300万円投資してる みたいな感じで、 \"当たり前”の基準を引き上げる ような 発信をしていく感じですね！ 基準値の教育では 特に自分の体験談など ストーリーを使うのが効果的 です。 友達のLINE全員ブロックして 貯金ゼロ円で上京して ナンパ師になった話 貯金0円のニート時代に コンサル受けるために寝ずに 1週間バイトして資金を捻出した話 親に800万円借金して自己投資した話 ナンパで余裕で1日100人以上に 声かけして初月30即した話 毎日1万文字書くのは当然という話 などなど、 具体的なストーリーはなんでもいいですが 「え、その基準値やばくね…！？」 「これが成果出すやつの普通なのか…！」 と思わせるような話をして 基準値をブチ上げる教育です！ 例えば、 ナンパ初心者のときに ノウハウゼロで1日100声かけした みたいな話をしておくと 「え、１声かけもできない自分へぼくね…？」 みたいなマインドになります。 これが非常に重要です。 それこそ、 ビジネス初心者からすると 「５万円の商材を買う」 「垢買収のDMを送る」 という アクション１つ でも 抵抗感があったりとか、 グダを感じたりする人もいるはずです。 ですが、 ”当たり前基準” を引き上げておくと え、この人は800万円借金状態から 稼げるようになったのに、 俺は50万如きの自己投資で ひよってんの？？ みたいなマインドになってきて 小さいグダ がなくなります。 実際に僕もポストの","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/LhLTttKrKd1j/lesson/8o4ZqP3rG4CE","createdAt":"2026-05-16"},{"id":"scr-1779710258102-pfcxyh","title":"14-3 リスト獲得のまとめ | なまいきスクール会員サイト","category":"material","content":"14-3 リスト獲得のまとめ ということで 今回はXTEPを中心に リスト獲得の手法について 具体的に深掘りしてきました。 運用とリスト獲得ができれば 仕事の 8割 は 終わったようなものなので 最初はちょっと慣れなくて 大変かもですが、 頑張って取り組んでいきましょう。 ただし 今回お話しした内容である 「リスト獲得」 はあくまでも、 「収穫フェーズ」 みたいなもの。 つまり その前の 種まきや水やり が あって、ようやく収穫ができるのです。 種まき:興味付けフェーズ ↓↓↓ 水やり:教育やファン化 ↓↓↓ 収穫:リスト獲得→マネタイズ この流れはめちゃくちゃ重要。 最初にも言いましたが 売上につながるからと言って 収穫ばかり していると、 アカウントは 爆速で枯れていき また育て直すのは かなり 大変な作業 。 なので 一度 収穫フェーズ に入った後も、 興味付けや教育は混ぜながら 常にアツい読者を 囲い込んでおけるように 運用は継続 して行ってください！ そして マネタイズフェーズに 入ったあとは 「セールス補助ポスト」 というのも重要。 「セールス補助ポスト」 →セールスマンが 商品を売りやすくするためのポスト 例えば 稼いでる人間と話す機会 は ガチで貴重だからチャンスがあれば 金払ってでもいくべき みたいなポストを 普段から継続的 に入れておけば、 Zoomで個別面談するときに ”直接喋れる価値”が上がって 特別感 を出せるので、 「ガチで話せるのうれしいっす！！」 みたいな態度で ワクワク しながら 面談に来てくれる人が増えます。 他にも 環境が大事、 環境にお金を払うべき みたいな教育を入れておけば、 スクールを オファー したときに 「俺も新しい環境で頑張ろう！」 と思う人が増えてくれますね。 とりあえず話聞こうかなって人と、 ガチで話聞けて嬉しいです！ みたいな人では セールスマンのやりやすさ も 変わってくるので それはそのまま、 売上に直結してきます。 じゃあ、具体的に どんなポストをセールス⁠⁠⁠補助として 入れていくべきか と言うところを少しあげていくと 実績がある人と話せるチャンスは 少ないから その価値をわかっておけ チャンスは何度も来ないから ビビらずに飛び込め スクールを買ったりするのは もったいないことじゃない 時間が一番大事だから、  成果が出る思考を作るための なまいきくんの思考エッセンスを詰めた １時間の長編動画です。 移動時間などに聞き流ししてください。 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/DXou0EuAyBQd/lesson/6Jiqt8IBK6j9","createdAt":"2026-05-16"},{"id":"scr-1779710258106-swmbnz","title":"Lv.6 講義QA | なまいきスクール会員サイト","category":"feedback","content":"Lv.6 講義QA Lv.6の内容でいただいた質問に回答しました！ Q-1：シャドウバン中ですが、ポストのストックやインプットの他に、すべき行動はありますか。 A-1：ネタを作ることが一番重要です。発信ジャンルの活動をすることで、今後のポストのストックにつながります。 Q-2：引用リポストやいいね、リプ周りは、自分と同じジャンルの人にだけした方が良いですか。それとも有益であれば他ジャンルでも大丈夫ですか。 A-2：基本的には自分と同じジャンルが良いです。属性認知の概念があり、例えば物販系なら物販系の人として認識された方が良いためです。 Q-3：ポストで実績をアピールする額は、大きすぎない方が良いでしょうか（例：100万円）。初心者がリアリティを感じないのでは。 A-3：リアリティを持って自分として感じられる額や見せ方が良いです。どの界隈かによりますが、コンテンツ販売系なら100万円は大きすぎない額です。様々な額でテストしてみるのが最も有効です。 Q-4：目的の教育ポスト（興味付け）が伸びません。どう改善すべきでしょうか。 A-4：ネタの強さをまず見直すべきです。ライティングよりもネタの強さで伸びが決まります。また、1発で当たらなくても、フィードバックを得てブラッシュアップしていくことが重要です。 Q-5：何を売るにしても、まずは目的の教育ポスト（理想の未来/興味付け）を多めにした方が良いでしょうか。 A-5：その通りです。そもそもやる気がなければ取り組まないため、まずテンションを上げさせることが超重要です。 Q-6：実績ゼロの初心者で、AIをテーマに運用予定ですが、アフィリエイトとノート、どちらがやりやすいでしょうか。 A-6：収益化が2,000円程度では、まず実績を5万円程度に強めるのが一つの選択肢です。または、稼ぐ系ではないAIのスキル（例：画像生成）にずらして、そちらをテーマにするのもありです。 Q-7：最終目的が高単価アフィリエイトなのに、発信を「小銭から稼ぎましょう」的な内容で回すのは大丈夫ですか。 A-7：高単価アフィリエイトが何の商材によるか次第です。AI系であれば「小銭から」でも問題ないです。AIは稼ぐことではなくスキル習得が目的の人もいるため、発信内容のずれを心配する必要はありません。 Q-8：恋愛系の高単価アフィリエイトが最終目的の場合、ターゲットは非モテ/初心者が良いのか、経験者/上級者が良いのか。 A-8：基本は初心者層（パイが大きい）を狙うのがベースです。上級層を狙えるかは、発信者本人の実力（実績）に依存します。実力がピラミッドの頂点に近いほど、自由にターゲットを選べます。 Q-9：実績ゼロの投稿1日目です。指導者目線ではなく、同じ目線でチャレンジしている投稿で始めましたが、これで良いでしょうか。 A-9：指導者目線じゃない方が良いです。実績ゼロなら、プレイヤーとして実際にやっているところを出すのが圧倒的に良いです。 Q-10：初期段階でアフィリエイト行為をしても良いでしょうか。 A-10：初期段階（フォロワー100～500人など）ではアフィリエイトをしない方が良いです。読者の熱量が上がっておらず、そもそも読者がいない段階でやっても伸びません。 Q-11：スクール運用をしている競合の発信者とは、積極的に絡んだ方が良いですか、避けるべきですか。 A-11：全然絡んで良いです。伸びないより伸びた方が良いため。お互いに利用し合うのは重要であり、伸びた先に競合に持っていかれる心配よりも、まず伸びることを優先すべきです。 Q-12：実績がある人は大きい数字（月収1000万超えなど）を投稿ネタにできますが、0からのプレイヤー運用をしている場合のネタの例を知りたいです A-12：投稿ネタは必ずしも大きな数字である必要はありません。生活の質の向上: 松屋でトッピングを無限につけられる、最悪残してもいいといった「松屋の中のちょっとした贅沢」のような日常の小さな変化が憧れにつながります。余裕と自由: 家族との時間が増えた、自由に寝ていられる、あるいは5万円増えたことで完全に自由な小遣いが増えたなど、余裕が生まれたことを伝えるのも有効です。非金銭的要素: 人々が何かをやるかどうかを判断するのは、稼げる額だけではありません。例えば、物販が分かりやすい、馴染みがあるといった数字以外の要素も重要です Q-13：3ドル収入が得られたというポストでも伸びますか？ A-13：伸びます。Xの運用だけで「ついでに得られる」という部分が魅力的です。個人的な例として、税金の払い戻しで数百万円が入ってきた話や、自動的に安定して月30万円程度の収入がある話など、実績が小さくても安定性や自動性が刺さる人もいます Q-14：現在自分に売上が全くない状態でも稼いでいる感を出してもいいのでしょうか？ A-14：小さな売上や、ちょっとした日常のいいものなど、見せ方によって欲求換気や興味付けは可能です Q-15：GPTで促しポスト（「いいね」などを促す文言）を作成する際、初期運用フェーズではどうすべきですか？ A-15：初期運用フェーズでは促しポストは入れない方が良いです。業者感が出るためです。GPTに指示をする際に、「促しポストなしで」と指定すれば対応できます Q-16：「興味付け（フック）」は、6つの教育ポストのどの教育に位置しているのでしょうか？ A-16：興味付けは、それぞれの教育に対して存在します。例えば、「手段の教育」に興味を持たせるために、その手段の楽さについてフックを作る、といった具合です Q-17：滞在時間を伸ばすために画像や動画の挿入は有効ですか？ A-17：はい、画像や動画の挿入は有効です。 Q-18：「モチベ上げ」を投稿に入れると、アカウントの「強者感」が減ってしまうのではないですか？ A-18：相反するものではありません。モチベーション上げは、リーダーや国王が市民に檄を飛ばすようなイメージであり、やり方次第で弱者感は出ません Q-19：画像付きのポストを頻繁に連投すると、しつこいと思われますか？ A-19：毎回毎回画像をつけるのはしつこい可能性があります。目安として3回に1回程度が良いと考えられますが、反応を見ながら試すのが最も重要です Q-20：Xアナリティクス（分析）の見方について、カリキュラム内で学ぶことはできますか？ A-20：アナリティクスを細部まで見る必要性は低いと考えています。インプが増えているかどうかなど、基本的なことだけ分かれば十分であり、過度に気にしなくても良いとのことです Q-21：MNPアカウントを買ってしまいましたが、最終的に何を売りたいかによって、発信する内容は決まりますか？ A-21：はい、最終的に何を売りたいか、というゴール設定が重要です。例えば、MNPアカウントを買ったとしても、裏垢を売りたいのであれば、MNPの発信は意味がなく、裏垢の実践を発信すべきです。 Q-22：株アカウントで、すでにノーハウを持っている「ガチ勢」にフォローされがちです。投資経験のない人向けの初心者に向けた発信を増やすべきですか？ A-22：はい、基本的には初心者をターゲットにした発信を増やす方が良いです。初心者の層の方がパイ（母数）が大きいためです Q-23：AI系の発信で、最新のAIの使い方などを常に研究してポストしないといけないと思ってしまいますが、そればかりやる必要はありますか？ A-23：最新ノウハウの研究ばかりに時間を割く必要はありません。競合（他の発信者）が上手くない場合が多いため、本講義で学んだ教育ポストの構成を適用することに注力すべきです。 Q-24：プレイヤーフェーズ（実績ゼロ）の場合、指導者目線ではなく、挑戦者目線の方が良いのでしょうか？ A-24：挑戦者（プレイヤー）目線で発信すべきです。指導者目線でいくと伸びないため、過去の講義の内容を確認してください。 Q-25：物販の発信をしていますが、リアルタイムの実績が出せず、エアプ（実績なし）感に限界を感じています。ジャンルを変えるべきでしょうか？ A-25：ジャンルを変えることも検討すべきです。物販はリアリティ（現実味）が重視されるため、長期的にコミットできないなら、打ち込めるジャンルに移行するのが重要です。 Q-26：プレイヤーフェーズでも、6つの教育ポストは全て意識すべきですか？ A-26：6つの教育はバランス良く意識するべきです。ただし、メッセージの伝え方（口調）背中で語ることで、プレイヤーとして教育ポストを活用できます。 Q-27：6つの教育で、初期は目的と信用が中心とのことでしたが、問題点や手段の教育に移行する目安（インプの数など）はありますか？ A-27：特定のフェーズで特定の教育しかしない、ということはありません。Xではフォロワーがフォローしたタイミングがバラバラなので、全てをバランス良く実施する必要があります。 Q-28：アフィリエイトリンクを貼る場合、プロフィールからの誘導が良いか、ポストで頻繁に貼るのが良いか、また初心者が高単価アフィリエイトを売ろうとするのは良いか？ A-28：初心者の段階（フォロワー100〜500人程度）では、アフィリエイトはすべきではありません。読者の熱量が上がりきっていない段階で売り込むと、フォロワーが離脱し、アカウントが伸びなくなります。 Q-29：アダアフィ（アダルトアフィリエイト）でのマネタイズを考えているが、どうすれば良いか？ A-29：アダアフィは1件あたりの収益が非常に低い（例：300円）ため、儲からないのでやらない方が良いです。低単価で収益化しようとすると、破綻する可能性が高いため、売り方を考え直すか、やめることを検討すべきレベルです Q-30：信用（信頼）の教育がうまくいっているかどうかは、どこで把握したら良いでしょうか？ A-30：信用は人間の内面的な話であり、数値化はできません。定性的なフィードバック（「ずっと追っています」「あなたを信用しています」などのコメント）が増えたら、信頼されていると判断して良いでしょう。 Q-31：高単価アフィリエイトを売っていくアカウントは、ジャンルを問わず「高単価」であることを公言しない方が良いですか？ A-31：公言しない方が良いです。ゴリゴリにマネタイズしていくことを明言すると、プレイヤー感が薄れ、顧客に警戒心を与えてしまいます。 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/FV9r91lSO0EQ/lesson/AsT0y7p1bhfm","createdAt":"2026-05-16"},{"id":"scr-1779710258106-qxxuwh","title":"23-1 【企画の作り方 実践編】フォロワーの購買欲を爆発させるローンチ企画の全体像 | なまいきスクール会員サイト","category":"material","content":"23-1 【企画の作り方 実践編】フォロワーの購買欲を爆発させるローンチ企画の全体像 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/Sosepc0m7pFn/lesson/CLecvVprenA6","createdAt":"2026-05-16"},{"id":"scr-1779710258107-yknmum","title":"5-2 興味付けポストの作り方 | なまいきスクール会員サイト","category":"material","content":"5-2 興味付けポストの作り方 強力な興味付けポストは、 3つの要素の掛け合わせ でできています。 興味付けポスト = フック × 興味の対象 × 強化要素 1.フック 「おっ？」と思わせる「キッカケ」 例えばこんな要素です👇 自分の実績や経歴 自分や他人の成果報告 他人の権威 一次情報や期待感 「日給2万円いったんやが…」 「月2000万稼ぐ友達に聞いたんだけど…」 みたいなやつですね！ 具体的に見ていくと… ■実績、成果報告 ・俺が〇〇円稼いだ ・昨日仕入れに行って爆利益品みっけたんだけど ■経歴、背景 ・20垢運用してわかった ■他人の権威 ・メルカリで1億売り上げてる主婦から聞いた ・noteで月2000万円売った友達に教えてもらった ・万垢30個分析してわかったんだけど ■他人の行動＋成果 ・23歳のフリーターの弟に教えたら 速攻で83万円稼いじゃった ■自身の行動＋期待感 ・今裏で仕込んでるジャンルだけど これは必ずしも 成果が出たものである必要 もなくて 裏で仕込んでるジャンルなんやけど ワンチャン月500万円くらいいけそうw こっそりやっちゃうよーん！ みたいな 「自分が行動している様子」 「うまくいきそうやなという期待感」 みたいなのを使ってもOKです！ うまくいきそうやなってだけで、 人間は興味を持っちゃうので！ これがフックですね！ 情報がすげぇという根拠 です。 ただし、 これだけだと 単なる自慢 なので セットで必要になるのがこれ👇 2.興味の対象 読者が興味を持つ情報とかノウハウ 何に興味を持たせたいのか？ なんのおかげで成果が出てるか？ という要素ですね！ 儲かるジャンル 最新アルゴ情報 やってる手法 裏情報 みたいなものにしとけばOK！ 具体的に挙げておくと👇 【読者が「欲しい！」と思うもの】 ■情報系 ・今アツいボロ儲け市場 ・激アツジャンル ・バブルなプラットフォーム ・アルゴリズム変更 ・極秘仕入れ先情報 ・知らないとヤバい落とし穴 ・裏情報 ・これから来るトレンド ■手法系 ・コツ/秘訣がある ・ずるい戦略 ・独自のスキーム ・とある施策が... ・ノウハウ ・着眼点 ■その他（ツール、資産など） ・ツール ・専用AI ・型・テンプレ ・シート ・サイト ジャンルによって違うので、 ちょっと考えないとですが 「他の人が何を配ってるか？」 「何系の情報を欲してるか？」 を常に考えておくとGoodです！ 3.強化要素 興味付けを強化する情報 興味をより強くするための 心理テクニック的なやつですね！ 誰も知らない、やってない 1日15分でいける どの教材にも書いてない 誰でもできる etc. これもリストにしておくので、 ポスト作るときに参考にしてください！ 【 興味を「爆発」させる言葉】 ■シンプルで真似しやすい ・やったのはこの２つだけ ・簡単すぎる ・コピペでいける ■他の人が知らない ・誰もやってない ・ライバルがいない ・知ってる人マジでいない ・どの教材にも書いてない ・僕が思いついた ・超ニッチ ・ブルーオーシャン ■一部の人だけが独占してる ・ガチで極秘コミュニティだけで言ったけど ・本当は言いたくないけど ■再現性がある ・誰でもできる ・高卒ニートの弟でもできたw ・中学生でもいける ・猿でもいける ・偏差値30でもいける ■労力がかからない ・15分〇〇しただけ ・ガチで労力かからん ■即効性がある ・2日でこれ ・1週間もあれば ■リスクがない ・仕入れ4円だけ ・スマホだけでいける ・元手ゼロでいける ・ローリスク ・顔出し、声出しもいらない ■優越感 ・ライバルが消える ・〇〇に困ることがなくなる ・〇〇できてしかたがない ・無限に〇〇できる ・〇〇を量産できる ■限定性：情報を入手しにくい ・極秘ルートで仕入れた情報 ・1億円稼ぐ大学生から聞いた ・一部のコミュニティだけで共有されてる ・年5億稼ぐ会社のマニュアルに書いてあった ■トレンド性 ・AIで～ ・XTEP使って～ ■感情 ・エグい ・ヤバい ・神じゃね？？ ■恐怖心：知らなきゃ損 ・これ知らないとヤバい ・知らないと反応が落ちる ■不明性：何をして？どうやって？ ・とある手法で ・あるツールを使うことで ・あるサイトを見れば ・ちょっとあることをするだけで ・某アカウントで ・某界隈で ■常識破壊 ・エロ、恋愛、ビジネスじゃない(SNSで) ・1ポストもしてない、 ローンチしてない ・フォロワーいらない ・仕入れ不要 ・鑑定不要 ■新規性：情報が新しい ・最新〇〇 ・緊急で ・ガチで稼いでる人の中で話題になってる ・今トレンドがきてる ■長期的な利益 ・1年以上ずっと入ってくる ・1回やったら300万円確定 ■その他 ・得られる金額がデカい ・成果出るのが異常に早い こういうのを２〜３個入れると 興味付けパワーが簡単にぶち上がります🔥 1.フック 2.興味の対象 3.興味を強化する要素 この３つを掛け合わせると… この垢でTips販売開始して3ヶ月目とかやけど地味に売れ続けるコツみたいなんが若干掴めつつある。 商品数がゴミやから売上しょぼいけどこの容量でガンガン増やしていくか。ぶんじろう垢と違って一撃の爆発力はないけど属人生を限りなく落としてるから正味誰でも運用できるからかなり楽。 （売上画像） フック： ・売上画像 ・商品増やしたら儲かる(雰囲気) 興味対象： ・売れ続けるコツ掴めつつある ・属人性のない運用方法 興味を強化する要素： ・属人性落としてる→再現できそう ・誰でも運用できる→再現できそう ・かなり楽 こんな感じで 基本的な興味付けポスト が サクッと完成します！ 【実践】興味付けポストを考える手順 以下の4ステップで、 3つの要素を組み立てます。 フックになるものは何かを選ぶ 興味の対象はどこに向けるかを設定する どんな要素で興味を強めるかを選ぶ 3つの要素を組み合わせて 1つのポストにまとめる まずはフックになる 「実績や成果報告、他人の権威 自分の行動+期待感」 などを決めます。 とある商材を仕入れはじめて 利益が出たのであれば 「２日目で利益が出た」 とかですかね！！ この場合は興味の対象は 物販系で 「オイシイ商材の情報」 。 じゃあ、 それをどうやって魅力的に見せるか？ という強化要素を考えて 利益率が高い 低リスク 他の人が誰も知らない まだライバルが少ない 1日15分でいけちゃう etc. とかしておけばOK。 これをまとめてポストにしたら、 こんな興味付けポストが完成です👇 【作成例】 新商材を仕入れ始めて2日目でこれ。仕入れ値やすいからダメージ少ないし回転率もいい。こういうのは情報持ってたら誰でもできるから、やっぱ情報ゲーやね。（実績画像） フック： ・新商材を仕入れ始めて2日目でこれ。 興味対象： ・仕入れ商材の情報 強化要素： ・仕入れ値が安い、 ・ダメージ少ないし回転率もいい ・誰でもできる 【具体例：にきち垢のポストを分解】 今日友達にとある即日現金化できる㊙せどり手法教えたんだけど、速攻で利益29047円ゲットしてて草 内訳としては、 仕入れ：61,000円 売上：90,047円 利益：29,047円 もうこの手法知っちゃったら他の手法なんてめんどくさすぎてやってられないね このポストの分解してくと… フック： 「友達が速攻で利益2.9万円ゲット」 という他人の行動＋成果 興味の対象： 「即日現金化できる㊙せどり手法」という手法 強化要素： 「速攻で（即効性）」「㊙（秘密性）」 「めんどくさすぎてやってられない（優越感・手軽さ）」 慣れたら即効で作れますね！ POINT：興味付けのコツ 興味付けは 「目新しさ」 だと言いました。 普通のノウハウであっても あえて目新しく見せるのが大事 。 メルカリ →とあるプラットフォーム noteのタイトルを改善したら →noteに1分だけテコ入れしたら 裏垢で稼ぎました！ →ちょいグレーなジャンル攻めてますw こんな感じの言い換えは 意識的にやっておくといいです！ あとは、 「月収10万円超えました！」 と書くよりも 「今月114,983円来たね。」 とかあえて具体的に 書いておいた方がリアル。 興味 ＝目新しさ ＝よくある表現を避ける これを意識してください！ 同じ実績でも興味付けの度合い が 天と地ほど変わります！ あえて実績画像を 売上画面 銀行振込された画面 別のプラットフォームの画面 と変えてみたりとか 売上画面じゃなくて、 発送前の商品の画像にしたり とか バリエーションを出すのも効果的です！👇 こんな感じですね！ 【注意】興味付けは一撃では 当たりません。 興味付けは半分運ゲーです。 興味付けポストは 一発で当てにいくのは不可能 だ と思ってください。 興味を持たれるか不明なので、 いろんな角度から興味付けを入れながら 「当たる角度」 を探ります。 このへんとかは 初期の興味付けポストですが、 あんま当たってないですよね👇 7900インプ 2600インプ 4700インプ 300万円の売上画像とかは 数字としては当時のビジ系では まぁまぁデカいのですが 反応的にはイマイチ 。 一方でこのアフィ系とかは 4.5万インプなので反応いいですよね👇 １つ当たったら、 その切り口を擦っていくだけ で かなり注目を集められます。 集客は基本的に 「待ちの姿勢」が大事です。 基本的なポイントとして 「即効性、再現性、手法の奇抜さ」 とかをおさえてポストした上で あとはひたすら待ちです。 このマインドを持っといてください。 布石としての興味付けは いろんな角度で打って打って 打ちまくっておいて あとは爆発的に当たるのを ひたすら待っておくだけ。 １〜２ヶ月待つこともあるので 一撃で当たる！みたいなもんじゃない と思ってください。 一発当てた瞬間に余裕で回収できます！ ということで ここまでが基本的な興味付けポストの 作り方になります！ 次はフェーズ別の運用方法に入ります！ 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/ihib0t9yKtcd/lesson/OP9h8U8BnIKA","createdAt":"2026-05-16"},{"id":"scr-1779710258107-qymlbg","title":"13-4 高単価アフィのはじめかた | なまいきスクール会員サイト","category":"material","content":"13-4 高単価アフィのはじめかた ということで Lv.13のまとめとして 今後やっていくこと を話していきます！ これから徐々に 高単価アフィの 具体的な情報が配信 されていき それと同時に毎週の講義では ・リスト獲得 ・面談誘導 についての 具体的なノウハウが 増えていきます。 それと合わせて 今回の流れ を把握して おいてください！ ①提携したら案件情報を しっかりみる 提携したタイミングで 各案件の紹介情報 が 順次公開されます。 (提携の案内は、 運営側より時期を見て 個別に案内するのでお待ちく ール会員サイト","category":"material","content":"6-3 反応が取れるポストを作る方法 6-2では 「ポストの内容部分」 に 焦点を当てて話してきました。 ここまで話した内容を マスターしてもらえれば、 Xで何をポストすればいいのか？ という部分に関しての 基本はマスターしたと思ってOKです！ ただし… ポストは内容が良いからといって インプが取れて反応が来る と言うわけではありません。 実績がある人の濃いポストでも インプ500未満とかはザラですし 「これいいこと言ったやろ😤ﾄﾞﾔ」 とか思ってたのに、 蓋を開けたら大滑りとかあるあるですw そこで、 ここからは 反応が取れる ポストのテクニック部分 ⁠ について 掘り下げて話していきます！ ポストのコツですね！ 今から話すコツを意識して ポストを作っていくだけでも 普段の教育ポストやグダ消しポストの 反応が大幅に上がる かと思います🔥 反応が取れるポストのコツ ポストで反応を取るために 気をつけるべきはこれだけ です。 ① タップ率を上げる ② 滞在時間を上げる ③ 全層からエンゲージを取る ④ モチベ上げをいれる それぞれ具体的に掘り下げていきます。 ①タップ率を上げる まずはタップされないと そもそもポストが読まれません。 これは全SNSに共通しますが、 Xなどのプラットフォームは 常に他のSNSとユーザーの 可処分時間を争っています。 YouTube インスタ Threads etc. 他のSNSに対して １秒でも多く Xに滞在して広告をみてほしい というのがXの意図です。 だからこそ、 読者の興味を惹けるコンテンツは アルゴリズムで優遇されるし 滞在時間を稼げる (=ユーザーを束縛できる) コンテンツは伸びる と思ってください。 そのすべての入り口になるのが Xで言えば 「タップ率」 です。 そして、 タップ率に一番影響するのは何か？ というと 冒頭一文目でフックを作ること これで決まります。 なまいきくんは 大事なポストについては常に ちゃんと続きが読みたくなるように 冒頭に力を入れて書いてます。 興味付け冒頭の事例👇 ポストの冒頭っていうのは YouTubeでいうサムネイル 広告のクリエイティブ みたいな超重要な要素です。 ここでいかに惹きつけられるかで、 内容とかに関わらずポストの伸びが 7割ほど決まっちゃうと思ってください。 興味付けのコツ 以下のような要素を 冒頭に含めて見てください。 ✅ 不完全情報 とある案件で儲かっててヤバい… ✅ 重要性 ・これ結構ヤバい情報ですが... ・超有益なんで言いたくないんですが… ✅ 希少性 ガチで誰も知らんノウハウなんですが、 実は〜 ✅ 権威性 アフィで月300万円売ってる 友人から聞いたんですが... ✅ 恐怖・損失回避 これ知らないと、ガチで損すると思う ✅ ターゲット刺し 主婦こそ〇〇すべき理由について話します。 ✅ 強烈な感情 エグすぎるwwww ちょっとこの前、 おもろいことがあったんですが、 ✅ パワーワード ・ 放送事故 やらかしました... ・ 情弱狩り が最高な話聞きます？ ・稼ぎたければ 大◯吸え ・ 爆益報告 させてください ✅ 簡易性 たった2分で〇〇できちゃってビビってます... ✅ 矛盾 自己投資すればするほど稼げなくなる理由 ✅ ニュース性 ・流石にやらかしたかもしれません... ・【速報】〇〇を発見しちゃいました！ ✅ 暴露・報告 ・ちょっと深夜なので暴露しちゃうんですが、 ・大事な報告をさせてください ✅ 限定性 後ですぐ消す ✅ 反社会性 ・批判覚悟で言うのですが ・正味、かなりグレーなんだけど 小手先なテクニック感がありますが、 伸びてる人はちゃんとやってますし 伸びてない人は冒頭を意識せずに 言いたいことをそのままポスト してます。 小手先だと舐めずに、 ちゃんとやりましょう。 一文目に関しては、 いつもインプが伸びてる人は上手いので ぜひ真似てストックしてください。 ⚠️ ダメなポストについて 冒頭で興味付けしろと言いましたが、 逆によくライティングで言われる 「PREP法」みたいなのはXでは最悪 です。 ◆PREP法 Point：主張 Reason：理由 Example：具体例 Point：再度主張（まとめ） この文章の型は、 わかりやすく伝えるのには向いてますが 最初に結論を言っちゃうと、 続きが気にならなくなって満足されるので X運用ではマイナスです。 むしろ結論はラスト。 背景、興味付け、ストーリー、 モチベ上げとかで 最大まで膨らませた上で ある程度引き延ばしてから、 満を持して結論を伝えることで 滞在時間が伸びていきます！ ② 滞在時間を伸ばす 滞在時間が長ければ長いほど アルゴ優遇がかかります。 つまり、 たまに長文を挟んで 滞在時間を伸ばしてあげればOK です。 （全部だとウザいので適度に） ポストを膨らませる方法 膨らませるためのアイデアは いろいろあります。 興味付けを強く入れる ストーリーを入れる 感情をリアルに具体的に書く 情報の具体度を上げる 理由を掘り下げる モチベ上げを入れる （後から解説） メリットを語る 恐怖を煽る などなど。 結論が 「即行動しろ、フッ軽になれ」 という一言であっても、 コンサル生が爆速行動してた 自分がフッ軽で動いて得した話 行動が遅いとどんな損失が出るか とか具体を掘り下げたら いくらでも書けることがあります。 また、表現の仕方によっても、 あえて具体的に書いてあげることで 初心者がイメージしやすくなります 。 例）ノウハウポストは無意味です →「ノウハウをポストしましょう！ 🤪」 という発信者はパチモンです。 これだけでも、 長さは倍になってますし 反応したくなる表現に変わってます。 レベルの高い人ほど 本質だけを端的に書きがちなので あえて無駄にわかりやすくすることで 読者の知能に合わせてあげる のが重要です。 ③全部の層に エンゲージを取る アルゴ攻略noteの中でも書いてますが、 ちょっとムズイので詳しく掘り下げると… Xのフォロワー層を詳しく見ると いくつかの層に分けられます。 ・ナンパ系 ・主婦層 ・一発逆転狙いのニート ・おじさん ・投資界隈の人 ・若いサラリーマン etc. さらにそれぞれの層でも、 初心者、中級者、初心者とかに 分けられると思ってください。 そして、 例えばなまいきくんが 男性ばかりに向けてポスト を作っていたら 徐々に主婦層などは反応しなくなり アルゴ上、主婦の人たちのタイムラインには 表示されにくくなっていきます。 さらに、 なまいきくんが特にナンパ寄りの ポストばかりを連発してたら サラリーマン おじさん層など 徐々に離脱する人が増えていって、 フォロワーの一部にしか 発信が届かなくなっていきます。 こういう状態が起こるのです。 これが アカウントパワーの下がった状態 だと思ってください。 こうなっちゃうと、 フォロワー数が多くても 全然ポストが届かなくなるので 僕はあえて普段から 「今回は主婦に刺さるように」 「今回は経営者層に刺さるように」 「今回は若いサラリーマンに刺さるように」 とターゲットを意識して 全部の層から定期的に 反応を取るようにポスト を作ってます。 イメージで言うと 風船を複数同時に膨らませる感じ です。 １つ膨らませて、 2つ膨らませて、 3つ膨らませて、、、 としてる間に、 １つ目から空気が抜けていく。 完全ゼロになる前に、 もう１回膨らませる。 同時に膨らんでる個数が多い状態 ↓↓↓ 色んな層から反応が取れて、 反応率が高まってる状態 これがアカウントパワーが強く ベストな状態 といえます。 これが 「全部の層にエンゲージメントを取る」 ということですね！ とはいえ、 ちょっと高度なテクニックなので、 最初は 「ターゲットを意識する」 くらいの 感覚でポストしていけばOKです。 Lv.3で配ったポスト作成GPTsでも 「ターゲットは誰ですか？」 と質問されると思うのですが、 Xでポスト作るときに、 ターゲットを意識できてる人 って ほとんどいません。 だからこそ、 ここをちゃんと意識して 狙った層に反応をとっていると 全体的にアカウントパワーが底上げされます 。 ③モチベ上げを入れる やる気が出る言葉、モチベ上げを入れて 読者を気持ちよくするのも大事です。 Xで発信を見る層ってある程度は 意識が高い層が多いですが 彼らに一番刺さるのって、 モチベーションを上げること です。 つまり、 自己啓発 です。 「自己投資続けたら人生変わります」 「僕の発信見てる人はセンスあります」 「一緒にブチアゲましょう🔥」 「チャンスは準備できてる人にしか来ない」 「誰だって最初は初心者、 うまくいく人はやめなかった人」 「できない...と思った分が伸びしろ」 「1年経ったらライバルなんてほぼ消えてる」 「行動してる時点で上位１％」 みたいな感じで、 読者の可能性を肯定 したり やる気が出る言葉 を入れてあげましょう。 思いつかない人は この一覧を使ってください👇 【自己啓発の要素一覧】 1. 可能性を肯定する ・読者の成長余地や才能を認める ・「まだ始めてないだけ」 「やればできる」と伝える 2. 行動の価値を強調する ・行動した瞬間に未来が変わる ・小さな一歩の意味を大きくする 3. 継続の力を伝える ・才能より習慣、継続が勝つ ・毎日の積み重ねが未来を作る 4. 未熟さの肯定 ・最初は誰でも下手 ・失敗は成長の証 5. 比較優位を示す ・行動してるだけで上位層 ・悩んでる時点で進んでる 6. 今すぐ始める理由を与える ・今日の行動が未来を決める ・後回しにすると損をする 7. 成果のタイムラグを意識させる ・半年後に振り返ってよかったと思える ・今の努力は未来で花開く 8. 常識を逆転させる ・「やる気が出たらやる」ではなく 「やるからやる気が出る」 ・リスクは行動しない方が大きい 9. 未来の後悔を想像させる ・挑戦しなかった後悔は一生残る ・「あの時やっておけば」と ならないために動く 10. 自分ごと化させる ・読んでるあなたはすでに特別 ・行動できる人だけがここにいる 11. 小さな成功体験を意識させる ・小さな一歩で十分 ・成功は最初の行動から始まる 12. 成長をプロセスとして捉えさせる ・完璧より未完成の行動 ・過程が実力を作る 13. 自己肯定感を高める ・悩めるのは前進の証拠 ・迷うことは可能性を探してるサイン 14. 不安を逆手に取る ・不安がある＝挑戦してる証 ・ドキドキは伸びてるサイン 15. 読者を「挑戦者」扱いする ・行動してるだけで他より前にいる ・あなたはすでに勝負の舞台に 立っている 16. シンプルな真理を突く ・動けば変わる ・習慣が人生を作る 17. 背中を押す問いかけ ・半年後にどうなっていたい？ ・今日の一歩を未来の自分は喜ぶ？ 18. 勇気の定義を与える ・恐怖があっても踏み出すのが勇気 ・小さな挑戦こそ勇気の証 19. 可能性の拡大を見せる ・今の一歩で可能性が何倍にも広がる ・今日動けば未来の選択肢が増える 20. 周囲との差を意識させる ・動いた人だけが景色を変えられる ・大多数は動かない。だから差がつく 21. 成果のシンプル法則 ・習慣＞才能 ・継続＞瞬発力 22. 一歩先の未来像を描かせる ・来月には見える景色が変わる ・数ヶ月後のあなたは今を感謝する 23. 自分の選択を正当化させる ・行動したあなたは正しい ・悩んでも動いた人だけが進める 24. やめないことの強さ ・諦めない人が最終的に勝つ ・やめないだけで才能になる 25. シンプルな行動促進 ・今すぐやれ ・後でじゃなく、今 26. 逆説的に肯定する ・「できない」と思う時点で 伸びしろがある ・不安がある＝挑戦してる証拠 27. 成功のハードルを下げる ・まずは小さな行動でOK","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/FV9r91lSO0EQ/lesson/8qmKkaMFlwO6","createdAt":"2026-05-16"},{"id":"scr-1779710258110-zsftos","title":"今週のタスク（Lv.4 初期運用ルーティン） | なまいきスクール会員サイト","category":"material","content":"今週のタスク（Lv.4 初期運用ルーティン） TODOリスト 今週のタスクを完了しましょう！ 1.動画講義を視聴する 4-1 X運用の「基本思考」を理解しよう 4-2 アカウントパワーを高める３つの方法 4-3 アカウントパワーを上げる鉄板ルーティン 4-4 基本すぎて誰も語らないXの動作について 4-5 他人の力を使ってアカウントパワーを高める方法 2.初期運用ルーティンを習慣化する 以下のマニュアルをスマホのホームに置いて 毎日時間を決めて実行しましょう！ ＞＞初期運用ルーティン 1日5~10ポスト フォローを8人×3セット いいね・リプ・引用を 朝昼晩で規定回数やる リプ返し・フォロバなどをする 全て完了したらDiscordの 「カリキュラム進捗」で 進捗を報告しましょう。 前へ 受講済みにする 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/oyuMJdIzdjEt/lesson/7faqW9g49k2Z","createdAt":"2026-05-16"},{"id":"scr-1779710258111-tphwsh","title":"20-1 コンテンツ販売完全攻略【販売&マーケ編】 | なまいきスクール会員サイト","category":"material","content":"20-1 コンテンツ販売完全攻略【販売&マーケ編】 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/yKK1BqLQVU8l/lesson/AlIAjLVRmr8A","createdAt":"2026-05-16"},{"id":"scr-1779710258112-zpldom","title":"おまけ：Xビジネス周りの用語集 | なまいきスクール会員サイト","category":"material","content":"おまけ：Xビジネス周りの用語集 ＞Xビジネス周りの用語集 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/5y6Isv53E5QP/lesson/AGVRtULiXXYZ","createdAt":"2026-05-16"},{"id":"scr-1779710258112-vvound","title":"【アカウント添削会】③しょうさん+総括 | なまいきスクール会員サイト","category":"feedback","content":"【アカウント添削会】③しょうさん+総括 前へ 受講済みにする 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/2zjQkUl6djgo/lesson/4dxj0lznKDjP","createdAt":"2026-05-16"},{"id":"scr-1779710258113-cjxqyd","title":"2-3 ジャンルから発信テーマを決める | なまいきスクール会員サイト","category":"material","content":"2-3 ジャンルから発信テーマを決める それでは、 発信テーマを 決めていきましょう！ 前提として、発信テーマは \"商材(売りたい商品ジャンル)ありき\" で決まります。 初期設定の流れ 商材(売りたい商品ジャンル)が決まる ↓↓↓ それを売るための発信テーマが来まる ↓↓↓ それを元にプロフやポストを作る こんな流れで 初期設計を進めるイメージです！ この段階では、まだ 具体的な商品内容(値段やサポート体制)まで 細かく決める/把握する必要はありません！ 商品ジャンル(物販, AIなど)だけ決めて 前に進みましょう！ どんなテーマのジャンルがあるか？ 高単価案件ジャンル一覧を 確認してみてください👇️ ＞＞高単価案件ジャンル一覧 自社商品を売りたい人は →自社商品のテーマをもとに 高単価アフィに挑戦したい人は →高単価案件ジャンル一覧をもとに 「興味があるな」 と思ったものから 発信テーマを決めていきます。 自分に合うジャンルの選び方 ジャンル選びの基準 ✅️ 自分との相性 ・経験があるか？ ・知識があるか？ ✅️ 自分の興味 これから自分が実践するなら どれをやりたいか？ ✅️ 既存アカウントとの相性 発信してるアカウントがあるなら 一番相性のいい商材を選ぶ これで案件が決まれば 自動的に発信テーマが決まります。 なので早めにテーマを決めましょう！ 案件の詳細については、 STEP3：マネタイズ編 において 具体的に説明していくので、 まずは一覧にあるジャンルで 自分と相性のいいものを選びましょう！ 次の記事では 発信コンセプトの決め方 を解説していきます！ TODOリスト どんなテーマがあるか確認しましょう ＞＞高単価案件ジャンル一覧 自社商品を売りたい人は、 自社商品のテーマをもとに 高単価アフィに挑戦したい人は 高単価案件ジャンル一覧をもとに 発信テーマを決めていきましょう！ 自分に合うジャンルの選び方 自分との相性 自分の興味 既存アカウントとの相性 ジャンルごとに よくあるアカウントをまとめたので、 イメージを掴む参考にしてください！ ＞＞ X発信アカウント一覧【ジャンル別】 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/dLX7oUPA62W5/lesson/HXR3Ie6GXjAH","createdAt":"2026-05-16"},{"id":"scr-1779710258114-cpoqsy","title":"19-4 コンテンツ作成 残りの大事な要素 | なまいきスクール会員サイト","category":"material","content":"19-4 コンテンツ作成 残りの大事な要素 前へ 受講済みにする 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/HrPTeQaNdaGn/lesson/CVL9vgA9lRte","createdAt":"2026-05-16"},{"id":"scr-1779710258114-tkkiob","title":"🎉成果報告：Lv.9 ストーリー型運用 | なまいきスクール会員サイト","category":"material","content":"🎉成果報告：Lv.9 ストーリー型運用 ストーリー型運用で185万インプ 1日でフォロワー350人増加！ 👇️チームからのコメント ストーリー型運用で5万インプ 👇️チームからのコメント ストーリー型運用 6投稿で合計4万インプ 👇️チームからのコメント ジャブポスト打ちからの ストーリーで計20万インプ超え ストーリー型運用で4万インプ ストーリー運用で合計8万インプ 前へ 受講済みにする 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/sGUl9xSASdx3/lesson/pbZx8w8XydkL","createdAt":"2026-05-16"},{"id":"scr-1779710258117-enqwsv","title":"2-2 X運用の全体像を把握する | なまいきスクール会員サイト","category":"material","content":"2-2 X運用の全体像を把握する それでは、今回のテーマ 「X運用の全体像」 を話していきます。 「Xで最短で稼ぎたい！！」 と思うなら、 まずは スタートとゴール を決めて そこに至る 道筋 を把握しないといけません。 全体像を把握することで 逆算して最短ルートを 見つけることができます。 これが 一番成果が出るのが早い です。 逆に全体像を理解してないと、 見当違いな運用 をしてしまうので ぜひ集中して見てください🔥 Xマネタイズ全体像 Xのマネタイズまでは 大きく4つのステップ があります。 1つずつ説明していきます。 1.認知獲得 Xのポストを伸ばして知ってもらったり フォローしてもらったりすること 具体的に言うと👇️ ✅️ インプ獲得 ✅️ フォロワー獲得 みたいな感じですね。 2.興味付け 知った状態からさらに興味をひいて 「こいつの情報知りたい」 と思ってもらうこと 公式LINEに参加、Zoom参加するのは その人に興味があるからです。 ここの 興味付け強ければほぼ成約 します。 2.リスト化 公式LINEに読者を流して 直接コミュニケーションを取れる 状態にすること これも具体的に言うと👇️ ✅️ LINE登録 ✅️ メルマガ登録 3.セールス セールスレターを流したり 電話セールスしたりする。 ✅️ セールスレター ✅️ Zoomセールス 👆️こんな感じですね。 高単価アフィ の場合であれば、 Xで集客 ↓↓↓ LINE登録させる ↓↓↓ セールスマンに繋ぐ あとは セールスマンがやってくれます。 なので、自分は ✅️ 認知獲得 ✅️ 興味を引く ✅️ リスト化 だけに 専念すればOK！ という ビジネスモデルです。 まずは この流れを頭の中に入れてください。 なんで全体の流れを 頭に入れとかないといけないの？ それは 目的意識を持って運用してほしいから！ 初心者がやりがちな行動は 細部に注目しすぎること です。 「インプ増やさなきゃ…！」 と商材と全然関係ない バズ狙い投稿 したりする。 こういう行動は、 インプはとれても、 最終的に見込み客を 公式LINEに集めてセールスマンに繋ぐ という目的に合わないから無意味です。 一方、稼いでる人はこう考えます。 最終目的：成約を取る ↓↓↓ そのために：見込みの高い客を セールスマンに流す ↓↓↓ そのために：商材に合う読者を 公式LINEに流す ↓↓↓ そのために：Xで商材に興味がある人を 増やすために興味付け こういう 逆算意識が大事 になるのです。 前提として ✅️ インプ ✅️ フォロワー ✅️ LINE登録者 などは どれだけ見込み客を集めているか？ 認知が取れているか？ などを測る 1つの指標 でしかありません。 それでは！ この前提を把握してもらった上で 「今後どうやってX運用進めていくか？」 という話をしていきます！ Xマネタイズの進め方 大枠として ３つのステップ で進めます！ 1. 運用準備を整える 2. アカウントを育てる 3. マネタイズする こちらを噛み砕いていくと... Xマネタイズ STEP1. 1️⃣ 運用準備を整える 最初の3週間は準備期間。 ・アカウント作成 ・ポスト練習 etc. 基本的な動作を覚えて 本格運用スタートできるようにする 準備をします。 Xマネタイズ STEP2. 2️⃣ アカウントを育てる 例えば⋯ 「運用開始して いきなりマネタイズできる？」 答えはNOです。 理由は、 フォロワー0人の 初期状態でポストしても ほとんどインプがつかないから。 例えば フォロワー100人以下で プレゼント企画やXTEPしたけど ほとんど受けとってもらえない⋯ それは 誰もあなたに興味がないし そもそも認知されてないから。 マネタイズするには ある程度アカウントを育てて 注目を集める必要がある。 ここでマネタイズするうえで 大事な話をします。 【重要】マネタイズに 挑戦する基準 ✅️ 平均インプ500〜1000以上 ✅️ フォロワー300人以上 ✅️ いいねも10〜20件ほど この全て満たすのが マネタイズ可能な最低ラインです。 それを 「マネタイズ可能域」 といいます。 これくらいの認知‧興味があれば、 プレゼント企画、XTEPを使って 強制的にリスト獲得&フォロワー伸ばし が可能です。 なので、まず マネタイズ可能域に 持っていく必要 があります。 当たり前ですが、 初期垢の立ち上げが一番大変だし、 学ぶべきことも多いです。 なので講座前半では、 この部分を ガッツリ解説 します！ Xマネタイズ STEP3. 3️⃣ マネタイズする アカウントがある程度育ったら、 こんな事ができます👇️ ・XTEPやDM企画 ・プレゼント企画 ・バンバン打ってLINEに集客 アカウントが育って興味づけできていたら、 かなり リストが獲得できる ようになるのです！ なので 直近3ヶ月の目標 としては、 基本を身につけた上で マネタイズ可能域まで アカウントを育てる ここに特化して アカウント設計やポスト作成、 立ち回り を学びます。 ということで、 この記事ではマネタイズまでの流れを ざっくり説明してきました。 Xの人はほとんど この設計図を描かずに運用してしまいます。 だからこそ、 無駄にポストだけ頑張ってしまったり 初期段階でマネタイズしようしたりして、 →稼げずに挫折してしまいます。 逆にいうと 全体像が見えてたら 今後やることが明確 になるので 行動に迷いがなくなります。 なので、 ぜひここは何度も見て 徐々にでOK なので 100%理解できるようにしてください！ 次の記事では、 「発信テーマの決め方」 について話していきます！ 今週学ぶ項目は 超大事な項目 なので、 ぜひ 集中して見てください！ 何事も最初が大変なので どんどん楽 になっていきます。 最初は混乱すると思いますが 見て30%ほど理解して実践する を 繰り返して 進めてください。 あとから知識がつながってきます！ TODOリスト 動画講義を視聴し、 Xの全体像を理解しましょう！ 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/dLX7oUPA62W5/lesson/OiYwIXOQzW4F","createdAt":"2026-05-16"},{"id":"scr-1779710258118-ukgxsc","title":"3-5 ポスト作成会について | なまいきスクール会員サイト","category":"material","content":"3-5 ポスト作成会について それでは、本記事のテーマ 「ポスト作成会」 について解説します。 なまいきスクールでは サポート付きプラン の方に 毎週末に ポスト作成会を開催します。 時間は 1時間 くらいです。 ポスト作成会の目的 ポストの作り方は習ったけれど… どうしてもダラダラやってしまって 1つのポストを作るのに 1時間、2時間 かかるって人が多いです。 なので、 週末に ポスト作成会に参加 して 集中して作っちゃおう！ という会です！ ポスト作成会の流れ ネタ選び：7分間 ↓↓↓ ポスト作成：8分間 ↓↓↓ ポストの仕上げ：10分間 ポスト作成終了後、 講師の人が時間がある場合 は 事前に送られてきた 質疑応答に回答する時間 を作ります。 参加方法 ポスト作成会は Zoomで開催 します！ Zoomのリンクは 当日の5分前 に Discordの全体連絡部屋 で送るので そこから参加してください。 💡 Zoomの画面はオフでもOKです。 さいごに X運用は 一人でやってると基本挫折します 。 なので ポスト作成会に参加して マインド上げていきましょう🔥 もしかしたら なまいきくんもたまに参加して その時は少し喋るかも…！？ お楽しみに！ X運用は 反応取れない時期に モチベも確実に下がります 。 そういうときに 伸びるのかな…？ みたいな、 不安が出るのも当たり前です。 さらに言うと、 ポスト作成はダラダラ してると つい無駄なポストを見てしまって 一瞬で4~5時間が溶けますw なので、 時間を無駄 にしないためにも サポート付きプランの方 は ポスト作成会 を有効活用してください！ TODOリスト ポスト作成会へ参加しよう ★サポート付きプランのみ ポスト作成会に参加しましょう！ ※Zoomで行うのでパソコンが必要です。 (スマホでポスト作ると思うので…) 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/IMgvAdDhz9MJ/lesson/CWV6bWBdap3G","createdAt":"2026-05-16"},{"id":"scr-1779710258118-bvnzlv","title":"執筆シート&参考記事 | なまいきスクール会員サイト","category":"material","content":"執筆シート&参考記事 執筆シート https://docs.google.com/spreadsheets/d/1sJUhNWk5OETg9l4htnQR52vf5ZlraZLdE-cMWK1F7gw/edit?usp=sharing 参考記事 https://raku-kasegi.namaikilog.com/p/yLAsCvv1Lf4A 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/ypISHOtWAVVp/lesson/nA89nd1sfWky","createdAt":"2026-05-16"},{"id":"scr-1779710258119-lhqaeq","title":"22-3【ローンチ実践編】①興味付けの呼吸 | なまいきスクール会員サイト","category":"material","content":"22-3【ローンチ実践編】①興味付けの呼吸 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/zqL8ejZpth1Y/lesson/4L31b3Lw5H4l","createdAt":"2026-05-16"},{"id":"scr-1779710258120-sfeskg","title":"14-1 リスト獲得の方法 | なまいきスクール会員サイト","category":"material","content":"14-1 リスト獲得の方法 今回の講義では リスト獲得の特別講義その1 を お伝えしていきますね。 効率的にLINE登録者を増やして マネタイズに繋げるための、 土台になる内容を話していきます！ ここから先の数回の講義は かなり 具体的な手法 について の話も含まれてきます。 マーケ的な ・思考部分 ・戦略的な部分 については、 前回までの講義の中で話してるので、 必ず前回までの講義を見て 全体像を頭に入れた状態で ここから先の講義に進んでください！ リスト獲得の方法とは？ 14-1では具体的な手法の前提として、 リスト獲得の方法とは？ というテーマで話していくのですが、 リストを獲得するには いままで話してきたように、 何かしらのインセンティブ が必要になってきます。 簡単にいうと 特典などの”コンテンツ”を使って LINE登録を促すのが基本手法 だと思ってください。 ある程度熱量を上げて ピラミッドの下まで到達した読者を どうやってLINE登録させるか というと、 もちろん ただ 「LINE登録してね」 と言うだけでは ほぼ登録してくれません。 ここまで運用して フォロワーを集めてきたのであれば、 ・あなたが持ってる情報 ・あなたが発信する思考や知識 に興味を持ってる人が ある程度集まってるはず。 なので その興味度合いを 最大限高めた状態 で ・こんなコンテンツをあげるよ ・ こんな情報があるよ LINEで受け取ってね！ という形でLINE登録に促す これがXマネタイズにおける リスト獲得の基本。 図にするとこんな感じ。 何かのコンテンツに対して ある程度興味付けした状態 ↓↓↓ じゃあ、これプレゼントするから LINEで受け取ってね という流れを作るわけです。 前の講義でも軽く触れましたが、 このとき リスト獲得のきっかけになる 無料コンテンツ(インセンティブ)を、 リードマグネット と呼びます。 そして リスト獲得 において重要なのは いかにリードマグネットを 多くの人に認知させて 多くの人に受け取ってもらえるか？ いかに見込み客層に近い 読者に受け取ってもらえるか？ という2つの要素。 なんでこんな 話をしているかというと どんなリスト獲得の 手法であっても 基本になる流れは、 コンテンツに興味付け ↓↓↓ コンテンツ受け取りの目的で LINEに登録させる これだけだから。 どんな手法であっても 基本の流れさえできれば リストは獲得できちゃいます。 さらに、逆に言うと、 この流れさえ把握していれば 具体的な手法はなんでもOK。 とはいえ 具体的な戦略部分もないと イメージがわかない と思うので まず14-1では なまいきくんが今までやってきた リスト獲得の戦略について 具体部分を話していきます。 具体的な事例を知っていれば 応用が効く と思うので リードマグネットを使う ↓↓↓ 興味付けする ↓↓↓ LINEに促す という流れだけは 頭に入れながら 具体戦略を聞いてください。 主な戦略を挙げると、 ・低単価コンテンツ ・100円note販売 ・スペース開催 ・エバー導線 ・プレゼント企画 ・XTEP の6つ。 1つずつ見ていきましょう。 1.低単価コンテンツの販売 1つ目が, 低単価コンテンツの販売で リスト獲得する 方法。 500〜5000円くらいの BrainやTips を 販売してリスト獲得していきます。 BrainやTipsは低単価であれば、 非常に簡単に売れるんですよね。 300円、500円であれば、 ある程度 興味付け してリリースしたら 数十〜数百部 くらい売れるし、 アフィリエイト機能 があるので 拡散性も高い プラットフォーム。 BrainやTipsを使い、 商品を売って ↓↓↓ リストをとる そうすれば、 商品を販売することで 市場から注目 もされるし、 商品がアフィで拡散されることで、 フォロワー外の人も集客 できて、 さらに 有料 なので 記事の中で教育 をしながら LINEに誘導 することができます。 じゃあ 具体的にどう誘導してるのか？ 実際になまいきくんが 行なった事例をみてみましょう。 例えばこのTipsであれば ・特典1 掌握ローンチ動画 ・特典2 3Daysローンチ教育Space音声 ・特典3 なまいきローンチ前TODOリスト 【受け取り方法】 1.Tipsの左側から拍手10回👏＆お気に入り❤️ 2.販売開始ポストを引用して感想を書く 3.1.2のスクショを購読者LINEに送る 4.確認でき次第、特典を送付します こんな感じで記事の末尾に、 「特典⁠⁠⁠⁠⁠⁠⁠があります」 という流れで LINE登録を促しました。 そうすると Xマネタイズや マーケに興味がある読者 がリストとして 集まってくるわけです。 この特典配布の際に 取ったリストには、 何もセールスかけてませんが ここに対して案内を流せば 濃い読者にアプローチすることが可能。 イメージで言うと、 こんな感じの構造。 Tipsを広告代わりに使う ↓↓↓ アフィなどで拡散 ↓↓↓ その末尾で特典をリードマグネットに ↓↓↓ LINEに追加してもらう 2. 100円note販売 2つ目が 低単価コンテンツと近いですが、 100円note施策。 これは過去に 2回やりましたが、 めちゃくちゃリストが 取りやすい ので、 便利でおすすめ。 以前にもちらっと紹介しましたが、 noteの拡散割引機能を使って 読者に拡散してもらう 手法 ですね。 これも 低単価コンテンツ と 同じような戦略で、 Tipsを広告代わりに使う ↓↓↓ アフィなどで拡散 ↓↓↓ その末尾で特典をリードマグネットに ↓↓↓ LINEに追加してもらう 100円note と言いましたが、 拡散で無料にするとかも 設定可能 なので、 より拡散性を高めて 広い読者を狙いたい場合は 0円note でもOK。 この100円noteを実際にやったのが 工場勤務14年、SNS未経験へっぽこ男が X開始2ヶ月で月870万円稼げちゃった 裏側がやばすぎたww このnoteですね。 このnoteはざっくり言うと 超へっぽこ男が 高単価アフィに挑戦して 2ヶ月で870万円稼いだ サクセスストーリーを書いて Xマネタイズや 高単価アフィのアツさ を教育しつつ ノウハウを一部語って 価 om/members/7174aTCxRVb7/course/Sosepc0m7pFn/lesson/MW8ZzYjHclfl","createdAt":"2026-05-16"},{"id":"scr-1779710258123-drohiv","title":"11-1 鬼のファン化教育 総講義 | なまいきスクール会員サイト","category":"material","content":"11-1 鬼のファン化教育 総講義 はい、今回は 「Lv.11鬼のファン化総講義」 として 「教育」 のテーマについて1回分使って ガッツリ語っていこうと思います。 本題に入る前に… 教育に関して、 ちょっと昔のエピソードをとして 浪人生のころに、 靴磨きで日給50万円を稼いだ話 を語っていこうと思います。 当時のなまいきくんは19歳くらいで バイトもせずに親からの仕送りで 生活してたのでガチでお金がなく… 週に数回、 路上に出てサラリーマンに声をかけて 靴磨きをしてお小遣いを稼いでました 。 とはいえ、 靴磨きなんて 15分 かけて 1000円 ももらえればいいところ 。 え、時給いいじゃん！ と思うかもですが、 お客さん１人捕まえるのに 30分、1時間と声をかけるので 声かけ時間を含めると時給は数百円… 声をかけても 大抵は怪訝な顔をして無視されますし ときにはイラついた会社員に 罵倒されることもあります。 体力的なしんどさや メンタルの苦痛もあるので、 ぶっちゃけ今から考えると わりに合わない仕事ですw そんな中でもある日、 靴磨きで日給50万円 ゲットするのに 成功したことがあります。 何をしたのか？？ というと… 僕はいつも靴を磨いてる十数分間、 ひたすら雑談で夢を語ってました。 「将来こうなりたくて」 「今はこんなことに挑戦してて」 「そのために靴磨きでお金を稼いでる」 etc. 例えば、 妹に大学に行かせてあげたくて そのためにお金を 稼がないといけないから 靴磨きをしている みたいな感じですねw そうするとごく稀に、 ５万円、10万円 とかの金額 を 貢いでくれる人が出てきました。 その中でたまたまその日は 50万円 という大金を 受け取れたということです。 これって… よく考えるとエグくないですか？ 僕は普段コンテンツとかの 商材を売ったりしていますが 靴磨きの場合は、 「夢」を売っていただけ なので、 そもそも商品すらない わけです 。 商品が何もない にもかかわらず 50万円を払ってもらうこと が可能なら コンテンツみたいな商品があれば、 それも良質なスクールを売るのであれば 非常に簡単だと思いませんか？？ そして、 これを可能にしたのが ”教育”というスキルです。 最初に言っておきますが、 教育はめちゃくちゃ重要です。 教育さえできれば、 少ないフォロワーで貼っても 馬鹿みたいに商品を売ることも可能ですし 「教育ができる=人を自由自在に動かせる」 ということなので、 インプを増やす フォロワーを増やすことも容易です。 僕は今まで 靴磨き ナンパ ビジネス などで数百人と喋ってきて、 あることに気がつきました。 人間は一定の情報を与えると 何かに突き動かされるかのように 喜んでお金を差し出したり \"自分が望む行動\" をとってくれる。 このノウハウは、 ナンパ師として女の子を誘う とき、 ナンパの講習をセールスする とき、 ビジ垢でコンテンツを売る ときも 全く同じように使えました。 僕は営業がめちゃくちゃ得意で 今まで何かをオファーして 断られたことがほぼないのですが 「買ってください！」 「絶対に買った方がいいですよ」 と押し売りをしたことがありません。 会話の中で 軽く心理トリガーを刺激するだけで 「講習に参加させてください！」 「それガチでいけるんですか！やりたいです！」 とお客さんの方から 切り出してきてくれます。 そして… それを可能にしている 人を動かすスキルこそが 今回のテーマである 「教育」 です。 「なまいきくんって集客上手いですよね！」 「SNSがめちゃくちゃうまいですよね」 とよく言われるのですが、 実は僕が1番得意なのは、 集客よりも 「教育」 です。 教育ができるからこそ、 人を思い通りに動かせて 人が動くからこそ 集客が簡単にできるのです。 じゃあ、 教育ってなんなのか？ ここから本題に入っていくのですが 教育を一言で表すとこうなります👇 相手の価値観や意思決定を変えて 望むような行動を自発的にさせること ”自発的に” というのがポイントです。 「勉強しなさい！」 といって勉強させるのが 説得や説教であるのなら おれは子供の頃に勉強しなかったせいで こんなに苦労して… でも大人になってから 勉強するようになって こんなにいい思いができた。 みたいな話をして 「あ、俺も勉強しないとな」 と相手に気づかせて 自分から机に向かわせる のが教育です。 このスクールで学んでるみなさんは 今X運用に興味があって学んでる と思いますが 生まれたときからX運用に興味があって ずっと学びたかった！！ という変態はいないはず。 絶対に人生のどこかで 誰かに教育を受けて 「Xマネタイズってアツいんだな」 「X運用もっと極めたいな」 という思考にさせられたはずなのです。 具体的に なまいきスクール に入って X運用を学ぶまでの価値観遷移 を イメージで言うとこんな感じ👇 会社員しんどいな... 手取り少なくて辛い... ↓↓↓ なんか副業とかしようかな？ ↓↓↓ 物販は仕入れ費かかるし 利益率が低そうだな 動画編集はスキルつけるのが 大変そうだし単価も低いらしい ↓↓↓ Xマネタイズで稼げるらしい！ コストもかからないし リスクも低そうで 青天井に稼げるってマジ？ ↓↓↓ 稼ぎたかったら知識をつけて 自己投資しないといけないよね ↓↓↓ よし！ スクールで学んでみよう！ こんな感じの 価値観の遷移があったと思います。 そして、 この 価値観の変化 っていうのは全て なまいきくんであったり、 他の発信者であったりに 植え付けられた価値観 です。 ビジネスしてる人が持っている 「会社員＝しんどい」という印象 今の時代は副業しないとやばい危機感 自己投資をしないといけない 行動を起こさないといけないという必要性 こういう価値観も全て 誰かの教育の影響を受けています。 これが狙って起こせるようになると 「教育ができる」 という状態です。 より具体的に 教育による価値観遷移を 見ていくと 例えば、 なまいきくんをはじめてフォローした 新規フォロワーさん は こんな 心理状態 だと思います。 今月、お金足りないし、 なんかサクッとお金稼げないかな なまいきくん強そうだけど ちょっと怪しいんだよな… できれば無料で始めたいけど 何からやればいいかわからんな これがいわゆる 「まだまだ客」 という 商品購入から遠いお客さんの価値観 です。 こんな状態から、 発信を追っていくうちに 自己投資して知識つけるのって 稼ぐために大事だよな Xマネタイズってリスク低いし 自分でもマネタイズしやすそうだな Xマネタイズ学ぶなら なまいきくん一択だよな と思考が変化していって いつの間にか 「今すぐ客」 という 商品を買うお客さんの価値観 になっていきます。 なまいきくんが他の発信者よりも 圧倒的に稼げてしまってるのは、 普段からこの教育によって 「今すぐ客」 を増やしてるから。 今すぐ客が多いからこそ、 新商品を出した瞬間に即売れするし スペースを開催したら 予告なしのゲリラ開催にも関わらず 数百人が一瞬で集まったりします。 ここまでで 教育の重要性 については、 わかってもらえたかと思うのですが それではここから 教育を身につける２ステップ を 具体的にお話ししていきます。 教育をマスターする ２ステップ 教育をするには ２つのステップを理解しなければいけません。 ① 価値観操作 ② ロジック構築 １つ目が「価値観操作」です。 先ほどお話ししたように、 見込み客には 「商品を買いにくい価値観の人(まだまだ客)」 「商品を買いやすい価値観の人(今すぐ客)」 の２種類がいます。 まだまだ客 → 今すぐ客 に変化させることができると、 フォロワーが 「今すぐ客」 ばかりになるので 非常に ビジネスがイージー になります。 ちなみにですが、 このスクールでも入った直後に マインド講座を30講義見てもらった のですが これも言ってしまえば \"成果を出しやすい価値観\" に 全員を変化させるための教育 の目的があります。 やっぱり成果を出すためには ノウハウ以上 に 「マインド」 が重要です。 これが整ってないと、 せっかく良いノウハウを伝えても 吸収ができなくなってしまう ので まず本題にノウハウ前に 成功思考インストール する目的で 30講義分を見てもらいました。 話を戻すと ２つ目が情報操作による 「ロジック構築」です。 フォロワーに 〇〇さんの手法知りたいな 〇〇さんの教材買わないとな という 思考回路になってもらう ための ロジックを組むことですね。 例えば、 マッチングアプリ用の写真撮影 を サービスとして販売したいときに まだまだ客の場合は 「え、写真って自分で撮っちゃダメなの？」 「友達にとって貰えばよくね？」 みたいに考える人が多いはずです。 これを教育するのであれば マッチングアプリで 全然彼女できません… 女の子と遊べません… っていう人  面談、成約数 は減ります。 上流のどこかで滞ったら そこから下は全てダメになる と思ってください。 だからこそ、 上流から順番に 水が止まってる箇所はないか？ と見ていく。 これが改善のポイントで、 こういうのを考えるのが マーケティング です。 じゃあ具体的に上流から どの数値を見ていけばいいか？ というとこの順番で 数値をチェックしてください。 ポスト数 インプ エンゲージメント フォロワー増加 リスト数 面談数 成約数 Xで売上が伸びない場合は、 このいずれか1つ以上の数字 が 下がってるはず なので、 それぞれが 下がる原因 と 改善策 を 掘り下げて見ていきます！ 1.ポスト数が少ない 5~10本 は死守しましょう これは先ほども言いましたが、 テクニックとか関係なく やれば解決する話なので、 まずはGPTsを使ってOKなので 1日5~10ポスト を徹底しましょう。 人によっては、 LINE登録や面談誘導はOKなのに、 ポスト数が少ないせいで 売上が伸び悩んでる人 もいます。 ここが 全ての入口 なので、 ちゃんと規定数のポストができてるか？ まず最初に見直してください。 解決策は 「ルール守ってるか見直せ」 「ポスト数増やせ」 ですw 2.インプが少ない場合 インプが伸び悩んでる場合も、 その 下流全て が止まります。 インプが伸びない原因は 「興味付け不足」 「アルゴ攻略の施策不足」 「アカウントパワー不足」 の可能性が高いので、 主に以下のチェックをしてください。 冒頭一文目の強化はできてるか？ ターゲットを意識してるか？ 滞在時間を伸ばす工夫はしてるか？ 興味付け要素は入ってるか？ 特に 冒頭一文目 や ターゲット意識 は 運用してると雑になりやすいので、 知らず知らずに売上が下がりがち です。 ポストが雑になってる場合は 「Lv.6-3 反応が取れるポストを作る方法」 を復習して見ましょう！ 冒頭を強めるテクニック や ターゲットの狙い方 などを 細かく解説しています。 「読者の興味度合いが低いな」 という場合は プレイヤー型運用&興味付けポスト を語った 「Lv.5-2 興味付けポストの作り方」 もおすすめですね！ 3.エンゲージメントが低い場合 エンゲージメント率が5%未満 いいねが10以下、リプがつかない 反応を誘導しても動いてくれない... この状態を放置しておくと、 企画や導線誘導をしても フォロワーが全然動いてくれなく なります。 主に原因としては エンゲージメント上げ施策を打ってない 発信に興味を持たれてない 教育が弱くて熱量が弱い この辺が多いですね！ なのでシンプルに、 反応を取る施策 を入れた上で、 興味付け&教育の強化 をすればOKです。 反応をとる施策 興味付けポストを増やす 教育ポストを強化する 反応をとる施策については アルゴ攻略note を読むと 具体的なテクニック があります。 教育が弱いせいで 読者の行動力が低い 自分へのファン度合いが低い という場合も エンゲージメントが下がりがち なので その場合は Lv.6の教育型ポスト を 増やしてみるといいですね！ コラム：なまいきくんの エンゲージメントが 異常に高い理由について なまいき垢は異常に エンゲージメントが高い です。 ポストしたら1分後に30いいね リプも大量に来る 商品出したら即売れ などなど。 この要因はいくつかありますが、 １つは 「通知オン勢が多い」 ことです。 僕の場合は 不定期で大事なポストを消して 見逃しリスクを煽る 通知オンして追う教育をしている みたいな感じで、 通知オンをよく促します。 その結果として、 ポストした瞬間にフォロワーに 通知がいくので異様に反応がいい というのがあります。 他にも、 リプ、いいねが多い人を 優遇する、褒める などして、 自分のエンゲージメント を 高く保つ工夫をしてます。 こういうのも１つですね👇 基本的に人間って 自分にメリットがあることしか 行動しない と思っています。 なので、 なまいきくんの頭の中としては、 いかに反応する人に メリットを感じさせるのか？ というのを意識してます。 反応する人=伸びるというレッテル ポストを消して 「早く見れた人が得した状況」 を作って通知オンを促す 俺に絡むと伸びるよ！と言う ポスト遡って全部いいね押すと 超勉強になると言う 今日、先着でプレゼントするから 通知オンしといてという etc. 具体的な施策 は ぶっちゃけなんでもいいですが、 この思考を持っておいてください。 4.フォロワー増加が 少ない場合 フォローが増えない原因 は 興味付けが弱くて フォローするまでもない と思われてる これが1番デカいです。 もっというと 単なる 「情報の垂れ流し垢」 になってて 発信を追いかけようとまで思わない みたいなパターンですかね！ ビジ系では超多いです。 この場合は 興味付けポストを増やす 俺を追っとけ！と自分で言っちゃう 〇〇を今日出すから フォローして待っててと誘導する etc. こういう要素をいれておけばOKです。 今の時代って、 ノウハウ・情報は溢れてるので 「ノウハウまとめポスト」 をしても そこまで フォロー理由 になりません。 なので、 「今後も追っておきたい！」 「明日は何ポストするかな？」 「次の投稿も見たい」 と思わせるのがフォロー増加のコツ。 俺を追っとけば こんな情報が手に入るよ 今から見ておけば、 ガチで有料情報出すから 期待しておいて👌 フォローしてくれた人には ガンガン共有していくわ みたいな感じで、 フォロワー優遇のスタンス を出して メリットを感じさせましょう。 5.リスト増加が少ない場合 フォロワーは増えてる or インプはあるのに リストが増加してない こういう場合は、 リストに誘導してない のか 興味付けが弱くてLINE登録するまで メリットを感じてない のが原因です。 なので解決策としては こんな感じになってきます👇 リスト誘導の回数を増やす 興味付けポストを増やして LINEで知れるようにする LINE登録のインセンティブを作る(特典など) 特典・発信の切り口を変える 特に リスト誘導の回数 は 少ない人が多い ので 意識的に増やすのがおすすめです。 なまいきくんの部下の場合は XTEPを週3回ほど回してたので 月1200リスト 取れました。 リスト誘導することに 「なんか悪いな…」 「嫌われないかな…」 というマインドブロックが ある人が多いですが Xなんてリストとってなんぼですし、 むしろリストを取るために X運用してるようなもんなので ガンガン誘導していきましょう 。 LINE誘導するのに、 マインドブロックがあるの って 興味付けが弱い のも原因 です。 興味付けが弱い ↓↓↓ みんなが情報を欲しがってない ↓↓↓ 求められてないのに LINEにゴリ押し誘導するの なんか気が引けるなぁ… こんな感じだと思います。 ちゃんと興味付けできていたら 「教えてください！」 「知りたいです！」 みたいなスタンスの人が増えるので 「じゃあLINEの中で教えますよ」 と軽く誘導するだけでも めちゃくちゃ登録されますね！ あと、 LINE登録するメリット を 入れるのも非常に重要です。 「LINE登録してください」 というだけで登録してくれる人は ごくごく一部 だと思ってください。 LINE登録にプレゼントをつける プレゼントのコンセプトを魅力的にする LINE配信を受け取るメリットを書く などなど、 LINE登録させるための「動機」 を きちんと用意しておきましょう。 こういう施策は ビジネス系であれば、 すでにやってる人が多いですが 投資系 物販系 AI系 恋愛系 etc. まだまだ弱い市場も多いです。 基礎的な施策をするだけでも リスト登録数 は改善しますね！ ちなみにですが、 フォロワー規模にもよりますが 1日10リスト 取れていたら かなり順調だと思ってください。 Xの 1万人超え大手発信者 が 1日10~15リストくらいの基準 です！ 6.面談数・成約数が少ない LINE登録はされてるけど 個別面談に遷移しない… 成約しない… みたいな場合は、 教育がかかりきってない or グダが残ってしまっている というパターンが多いです。 なので施策としては 教育ポストを強化する グダ消しをしっかりしておく セールス補助のポストを入れる みたいなのがおすすめです！ 教育&グダ消しポスト については Lv.6で話したので割愛すると… セールス補助ポスト っていうのは 面談に来るモチベを高めてあげる ような内容です！ 面談に来る人って その人のモチベやスタンスによって 営業マンのやりやすさ が違います。 こいつ胡散臭いけど 話だけでも聞いてやるか 情報だけちょっと聞いて 盗んでやろう みたいな人もいますし 面談いただけるなんて光栄です 🥹 お時間いただいて ありがとうございます✨ チャンスがあれば〇〇さんから 学ばせてもらいたいです！ みたいなスタンスの人もいます。 当たり前ですが、 後者の方が圧倒的にセールスが 決まりやすい ので、 運用にある程度慣れてきたら 読者のスタンスを整えるための セールスを補助するポスト をしておいた方がいいですね！ 余談ですが、 昔に外注に別垢を運用させたら ⁠⁠⁠⁠ なまいきくんが運用してた時期 →学ばせてください →いくらでもお金積みます！ 外注に任せた時期 →ちょい話聞いてやるわ みたいな感じで 露骨に面談に来る 顧客のスタンスが","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/DXou0EuAyBQd/lesson/5sGfh5402l66","createdAt":"2026-05-16"},{"id":"scr-1779710258126-xdevuq","title":"7-3 初期垢立ち回りあぱぱ事例解説 | なまいきスクール会員サイト","category":"material","content":"7-3 初期垢立ち回りあぱぱ事例解説 それでは僕が実際に 恋愛系 ジャンルで フォロワー 1.9万人超え まで 爆速で伸ばした方法から マネタイズ するまでのすべてを アカウントを開示 して 実際のポストを 例に挙げしながら解説していきます。 アカウントはこれ👇 このアカウントは 名前とプロフィールのとおり、 マッチングアプリの攻略法 を発信してます。 このアカウントについて ✔️アカウントを立ち上げた経緯 ✔️この市場で勝てると思った理由 ✔️アカウントコンセプト ✔️マネタイズ戦略 ✔️運用の実例 これらを包み隠さず話していきます。 前提：あぱぱについて あぱぱは2021年のコロナ禍において ナンパ系のサブ垢として作成しました。 １ポスト目からぐんぐんのびて ３ヶ月でフォロワー6000人に到達。 マネタイズとしては ✅マッチングアプリ講習 ✅依存/セフレ作り系Tips の２つがメインで、 どちらも良いペースで 購入していただけています。 ここまで大手アカウントの 実績開示して戦略書いた教材は ほとんどありません。 今まで学習した項目が どうやって使われてるか 実例で理解してください。 アカウントを立ち上げた経緯 このアカウントを 新規で立ち上げた理由はこの4つです。 ①すでに ナンパ系アカウント を 持っていた ②コロナによる アプリ需要の増加 ③自身が アプリに力を入れていた ④マネタイズするとき 規模拡大 しやすい 理由１： すでにナンパ系アカウントを 持っていた 当時から ナンパ師 として活動してて、 ナンパについて発信する ナンパ系のアカウントを別で持ってました。 ナンパもマッチングアプリも 大枠で考えれば 恋愛系 で、 女性攻略 という 本質は同じ です。 ノウハウなども応用しやすく、 アカウントの 複数展開 をするには いいジャンルだと考えました。 マッチングアプリ攻略という市場は それ単体でも大きな市場なので、 たくさん商品が作れて マネタイズしやすい 。 しかも、ナンパというジャンル上 めちゃくちゃ凍結されやすいので、 （マジで１０回以上凍結されてます） アカウントを 分散 させて リスクを下げておこう という 狙いもありました。 理由２： コロナによる アプリ需要の増加 恋愛垢を立ち上げた頃は ちょうどコロナが流行してました。 外出自粛もあったので、 マッチングアプリには ”出会いの場” としての 需要の高まり を感じてました。 アプリ利用者数も どんどん増加してたので、 この需要を取りにいくしかない！ という感じで マッチングアプリ攻略ジャンルへの 参入を決めました。 理由３： 自身がアプリに 力を入れていた ストリートナンパで ある程度経験を積んでくと だんだん飽きが来るようになったので、 アプリ に力を入れはじめました。 そのうち、 アプリでの 実績 とか攻略の ノウハウ が どんどん溜まっていったので、 それを発信しようと 考えるようになりました。 その頃はアプリを研究したりとか かなり熱量を注いでて、 シンプルにやりがいもあったから 発信にも熱がこもる なって思いました。 テーマ選びで大事な ✅ 熱量 が持てる ✅ テーマ自体の収益性 が高い という２ポイントもみたしてるし、 さらに 強み があるので最高です。 元々のナンパアカウントを そのまま流用することもできましたが、 発信テーマが ストナン だったため、 いきなり アプリの発信 をすると コンセプトがぶれてしまう。 ナンパってハードルが高そうだけど 女性攻略には興味がある… と感じてる男性の 大多数の層 を とりにいきたいと考えて、 新規でアカウント立ち上げをしました。 ナンパ界隈に染まってると 忘れがちですが 知らない女性に声をかけて誘うって かなりハードルがあります。 マッチングアプリなら 比較的身近で挑戦しやすいです。 理由４： マネタイズするとき 規模拡大しやすい ナンパ系のマネタイズポイントとして 最も大きなものが ”講習” でした。 ストリートナンパの場合は 実際に講習生と街に出て、 女性への声の掛け方とかを見て その都度改善点を指摘するとか 実地で指導する必要があります。 だけどアプリの場合は、 LINEなどで教えることができるので 講習は全てスマホ一台で完結 講習生一人一人にかかる手間が少なく、 住んでいる地域に関わらず 全国から講習生を集められて 規模を拡大しやすい と考えました。 ここまで説明したような4つの理由から、 マッチングアプリ攻略 というジャンルで アカウントを立ち上げました。 この市場で 勝てると思った理由 市場に参入するにあたって、 「この市場なら勝てる」 という材料が必要です。 僕は以下の3つの理由から 勝てると判断しました。 ①自身のアプリ実績 ②強い競合が少ない ③収益性が高い 理由１：自身のアプリ実績 僕自身、最初からアプリが 得意だったわけじゃありません。 いいねがあまりつかなくて 試行錯誤した時期もありました。 （あぱぱ垢を作る前） アプリ系の商材 を読み漁って 写真の撮り方 、 プロフの書き方 など 数ヶ月間ガチで分析していたら、 アプリ界隈の基準値を上回る 成果を得ることができました。 僕の実績： ・タップルというアプリで 5日 で 849いいかも ・withというアプリで 初日 で 1000マッチ 当時はタップル攻略が流行ってて 「1週間で600いいかも」 の実績画像がかなりバズって 「すげぇ！！」ともてはやされていました。 僕よりも すごい結果を出している人は 数人程度いたんですが、 全員そこまで有名ではなく 発信も下手でした。 なので、 実績においては 自分より強いライバルはいない ということを確信していました。 理由２：強い競合が少ない マッチングアプリ攻略というジャンルで 一番強いライバルは確実に ”黒足の一味” というグループでした。 黒足の一味とは、 ・アプリ攻略の方法をコンサル形式で提供 ・講師陣が全員1万フォロワー超えの実力者 ・講師の発信力や情報の質が高い ・講習生同士の縦横の繋がりを大切にしている ・グループ全員で高めあっていくってコンセプト ・講習生も含めグループ全体としてレベルの高い集団 このような特徴があるグループです。 アプリ攻略に関して 高単価のコンサルを売っている中では 黒足の一味が 一強状態 でした。 そのほかにもコンサルを売っている人は ちょこちょこましたが、 いっても 月50万円程度 といった程度。 他に目立った強いライバルはいませんでした。 また、アプリ攻略系の 発信者は多かったですが、 多くはnoteとかの 低単価コンテンツを販売していて コンサルを扱っている人は少なかったです。 理由３：収益性が高い アプリ攻略というジャンルの 収益性について界隈の知人に聞くと、 ・そこまで有名じゃない垢でも稼げてる ・低単価コンテンツだけで 月数十万円売れている という感じの状況でした。 さらに、界隈の大手発信者になると ・低単価のコンテンツだけで1.6億円売上 ・単価約2万円のコンテンツがバンバン売れる という感じで アプリ攻略って市場自体は 確実に 需要が高い といえるような アツい市場でした。 ここまで説明した理由から、 アプリ攻略の市場 に参入すれば 大きくマネタイズできる と考えました。 アカウント設計 コンセプトを決めるにあたって 5つの軸に沿って整理しました。 ①誰が（実績・背景） ②誰を（ターゲット） ③どれだけ（ゴール） ④なぜ（大義名分） ⑤どうやって（手段） それぞれの軸について 詳細を解説します。 01. 誰が（実績・背景） この軸については ”市場で勝てると思った理由” と同じで 自身の実績が強みになるので それをそのまま生かしました。 ✔️経験人数500人越え ✔️元非モテ→アプリでモテ男 ✔️タップル5日で849いいかも ✔️with初日1000マッチ ✔️1年で400人抱いた男 僕は実績について 嘘はつかない ということは 絶対に守ってます。 ただし、 元非モテ→アプリでモテ男 という部分について少しだけ補足すると、 僕がモテ男になれたのは ストリートナンパの経験も活きていて 100%アプリのおかげって言い切ってしまうと 少し語弊はあります。 ただ、アプリのおかげで モテ男に近づいたのは確実なので、 アプリがなければ今の自分はなかった というのは本心です。 02. 誰を（ターゲット） 対象とする顧客層はいわゆる マス層 、 つまり 恋愛初心者 に絞りました 顧客の絶対数が一番多い ので、 この層を取り込むことができれば 大きくマネタイズできるからです。 ナンパ、アプリ界隈について 知識があるようなレベル感の人ではなく、 恋愛について最近調べ始めて ノウハウについての知識もない 潜在層 です。 これらを考慮して ターゲット 、 つまり 「誰を」 の部分を設定しました。 ・恋愛初心者 ・20代後半〜30代前半 ・年収500万円前後 ・女遊びしたいが頑張りたくない ・ナンパ界隈とかはちょっと怖い そもそも、 ナンパやアプリ攻略といった 界隈全体の雰囲気として 初心者が取っ付きにくい というのを感じてました。 基本的にナンパ界隈の発信者って オラオラ系(と一般に思われる感じの人) が多かったです。 根本にある価値観として 「女はゴミと思え」 「女に舐められる雑魚になるな」 みたいな強めの発信が多い。 初心者からすると怖いですよね。 しかも、 界隈独自の用語 も多かったので （ヨネスケ、弾丸即、ブメ即、パレ搬とか） 余計に初心者がとっつきにくくなり 離脱してしまう原因 になってました。 このように 取りこぼされた層 を メインターゲットにしました。 03. どれほど （ゴール） どれくらいのゴールを 着地点とするかについては、 楽に 月に５〜１０人抱ける ようになる と設定しました。 そもそも恋愛初心者で ✔️ モデル級の美女 を彼女にする ✔️ 毎月３０人 くらい抱く といった願望を持っている人は少ないです。 ビジネス完全初心者に “月収100万目指そう！” という訴求より “まず来週サクッと５万稼ごう” の方が グサっと刺さるみたいな感じです。 また、講習生に対して 再現性高く達成 させられる着地点は この辺りが妥当だという考えもあります。 この着地点の基準を高くしすぎると、 ・達成できずコンサル満足度が低下 ・コンサルに対してクレームが増える こういった結果につながるので、 しっかり到達できるような 目標設定 をすることが大事です。 04. なぜ（大義名分） ・アカウントの信念 →自分と同じように苦労してほしくない ということを掲げました。 これは僕がアプリ攻略しようと思って 行動し始めた時のときですが、 実際に自分でアプリをやってみて、 アプリで一番苦労するのは 「そもそもマッチしない」 ということだと分かりました。 色々なnoteやTipsを 本当にたくさん買いましたが、 マッチしやすくする ということに関しては 正直まともな情報はほとんど無かったです。 大体の商材は メッセージ術 とか 口説く方法 とか プロフィールの書き方 とか そんなことばかり解説していますが、 マッチしなければ 全く役に立たないので 正直に言ってしまうと 大事なのは プロフ写真 なんですよね。 写真については、 「笑顔の写真を撮りましょう」 とかマジで 解像度の低い情報 ばかりでした。 結局、自分で試行錯誤して 何百枚も写真を撮りまくったり、 どんな写真がマッチしやすいか 検証したり相当苦労しました。 そんな経験もあって、 自分の発信を見てくれる人には 苦労をさせないように 最速で結果を出させる ことを信念にしました。 あとは、 なぜコンサルをするのか？ という部分について、 ノウハウに妥当性を持たせる理由を データ収集のため と設定し","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/SmN29szfV1nk/lesson/cFKOdvlErdPW","createdAt":"2026-05-16"},{"id":"scr-1779710258126-hrhijj","title":"4-1 X運用の「基本思考」を理解しよう | なまいきスクール会員サイト","category":"material","content":"4-1 X運用の「基本思考」を理解しよう それではLv.4の 「X運用ルーティンを確立しよう」 を始めていきます！ 今週の狙い Xが伸びる仕組みを理解して \"X運用の基本\" をマスターすること Xを見ていると、 運用の基本 すらわからずに 「とりあえず大手の真似をしよう！」 「伸びてるポストをパクッとこう！」 みたいな 単純思考の人が99% です。 ですが、 他人を真似したところで まず伸びることはありません 。 すでにフォロワーがいるから伸びてる 初期垢と大手垢では立ち回りが違う という事実に気づかず、 永遠に間違った運用を続けてしまい、 いつまで経っても反応がとれずに挫折… という絶望が待っています。 何をするにも大事なのは 基本をしっかり理解すること です。 これはX運用に限らず、 他のビジネス、受験や投資においても 全く同じことが言えます。 逆にいうと 基礎さえできていれば、 あとはどんどん情報を得るたびに レベルアップしていける ので 後発であっても、 すぐにライバルを追い抜かして 優位に運用をスタートすることが可能です。 ということで、 前回のLv.3、今回のLv.4 を しっかりと押さえてもらえれば 「基礎はある程度固まってるよね」 という状態になるように 今回は 運用の基礎 に絞って ガッツリ解説していきます！ 「Lv.4の内容」 ・アカウントパワーの伸ばし方 ・運用ルーティン ・Xを伸ばすポスト10の型 超大事な考え方も話すので、 必ずマスターしてください🔥 X運用の「基本思考」を理解しよう。 さて、 前回のLv.3では ポストの作り方 を お伝えしましたが… ぶっちゃけ、 インプ伸びませんよね…？？？ もしかしたら、 以前よりも反応が取れるようになった！ みたいな人はいるかもしれません。 ですが、 初期垢や買収したばかりの垢で 運用スタートした人であれば 「100インプも乗らねーな…」 「全然反応とれねーじゃん」 という人が多いはず。 まず前提として、 初期アカウントは 何をポストしても伸びません。 なぜか？ 理由はシンプルで、 アカウントパワーが弱いから です。 フォロワーがいないので、 ポストをしても誰も見てくれない ↓↓↓ 反応がつかなくて、 アルゴリズムにも評価されない 簡単にいうと、 雪だるま式にインプを伸ばしたいけど 初期垢には 雪だるまの核がない状態 です。 アカウントパワーとは何か？ かなり重要なので、 アカウントパワー について、 もう少し深掘りして説明します。 補助教材で渡した アルゴ解説note と 被りがありますが復習で読んでください！ アカウントパワー っていうのは、 アカウントの基礎体力 みたいなもの だと思ってください。 アカウントパワーは ２つの要素 で決まってきます。 ・アカウント規模 ・表示パワー ①アカウント規模 まぁこれはイメージしやすい。 フォロワーが多いほど、 影響力が強いのは当たり前なので ポストしたら すぐに多くの人に見てもらえる ↓↓↓ ポストで伸ばしやすくなる というのはわかるかなと！ ②表示パワー フォロワーのうち、 何％にポストが表示されるか？ X初心者は知らないかもですが、 Xのポストはフォロワー全員に 表示されるわけじゃありません。 下の図を見てください。👇 この ゲージ全体の大きさ が、 フォロワー数(＝アカウント規模) だと思ってください。 ２万人あればアカウント規模は２万。 一方で、 そのうち何割にポストが表示されるか？ これが 「アカウント表示パワー」 です。 （ゲージの色がついた部分） 仮に 同じフォロワー2万人 だとすると 上のゲージ の 表示率50% の方が 圧倒的に 「 表示パワー」が強い と言える。 イメージしてほしいのは「ゲージ」。 このゲージが貯まっていれば、 ポストが露出されやすくなり、 伸びやすくなります。 逆に、ゲージが空っぽだと、 どれだけ良いポストをしても 誰にも届かず、反応は取れません。 規模：ゲージ全体の大きさ 表示パワー：ゲージを満たす割合 なので今のXでは、 単にフォロワー数だけ増やすのは無意味で アカウント規模 × 表示パワー この掛け合わせで Xのアカウントパワーが決まる。 さらにいうと、 最初は みんなゼロスタート ですし、 表示率さえ高ければ フォロワー数なんて伸びていく ので 今のXでは ゲージを満たす割合を いかに高めるか？ つまり、 いかに表示率の高い状態を キープし続けるか？？ これで勝負が決まります。 アカウントパワーの影響 イメージして欲しいのですが、 フォロワー数が同じでも、 普段から多くの人と交流している人 全然交流していない人 では、 ポストの初速がまったく違います 。 もちろん、 交流が多い(アカウントパワーが強い)方 が 初速で伸びやすくなる。 初速である程度見られるからこそ ポスト作成を上達すること で フォロワーを伸ばすことができる。 逆にいうと、 アカウントパワーのゲージが低い状態で いくら質の良いポストをしても無意味 。 そして、 パワーが低い状態 で XTEP を回したり プレゼント企画 をしても そもそも 誰も見てくれてないので、 びっくりするほど伸びません…🥹 だから、 最初にやるべきことは？ ✅ ポストを伸ばすことでも ✅ 商品を売ることでもなく 👉 アカウントパワーのゲージを貯めること これが、X運用における “一番最初に考えるべきこと” です。 これ超重要なので、 絶対に知っておいてください。 アカウントパワーさえ高まれば XTEPやプレゼント企画で 強引にフォロワーを伸ばすこと そのままマネタイズに繋げること も可能ですし、 属性が近い人たちに露出されやすくなり バズの起点を作ること も可能です。 よくある失敗例ですが… 運用をがんばりだした 初心者に多い失敗例だと👇 「伸びてる発信者の真似をしたのに反応ゼロ」 「ノウハウをコピーしたのに全然伸びない」 これは才能やセンスの問題ではなく、 ゲージが空っぽの状態で戦っているから です。 アカウントパワーのゲージが貯まれば、 ポストが伸びやすくなる そこから教育やセールスも通るようになる つまり、 すべての基盤は 「アカウントパワー」 にある。 これを理解せずに運用しても、 成果は出ません。 どれだけ有益なポストも 「見られない＝存在してない」 のと同じです。 では次のページで、 どうやったらアカウントパワーを 伸ばすことができるのか？ という話をしていきます！ 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/oyuMJdIzdjEt/lesson/GQsI59o17SOu","createdAt":"2026-05-16"},{"id":"scr-1779710258127-yaozww","title":"Lv.2 講義QA | なまいきスクール会員サイト","category":"feedback","content":"Lv.2 講義QA Lv.2 の内容でいただいた質問に回答しました！ Q-1：インプ、フォロワー、いいねの特にどの数を重視すればいいでしょうか？ A-1：特にどれか一つを重視するというわけではありません。アカウントがある程度育っていると判断する目安として、インプ1,000、フォロワー500人以上、いいね10～20件という最低基準を全て満たす必要があります。これらの数字は、見込み客をどれだけ集めているかを測る「指標でしかない」という認識を持つことが重要です Q-2：いいね誘導をしてその数（いいね10〜20件）になってもいいのでしょうか？ A-2：ここで示しているのはいいね誘導なしでの水準です。 Q-3：0からアカウントを作成する場合、来週のポストの基礎を学ぶまで、自己流でポストすることは控えるべきですか？ A-3：控える必要はありません。講義で解説された 「10のポスト要素」を元にポストを作成 すれば、ひとまず走り出すことができます Q-4：XLITE（Xの課金）はまだしなくて良いでしょうか？ A-4：最初の段階ではしなくても良いですが、今後Xで稼いでいくことが決まっているなら、いずれ必ず課金するわけですから、やらない理由はないため、やっても問題ありません Q-5：実績がない場合、「山（ゴール）」の頂上からの発信ではなく、実践型でいく形でしょうか？ A-5： 「山（ゴール）の高さが低くなる」 というイメージです。月1万円でも実績があれば、それは「ちっちゃい山」として見せることが可能です。実績の大小にかかわらず、山に登れるだけの最低限の実績があれば問題ありません Q-6：実績画像や自由な生活をしている様子の画像がない場合、どうしたらいいでしょうか？ A-6：ネットや写真アプリから探すのではなく、見せ方を工夫すべきです。実績が少ない場合は、その実績を達成するまでにかかった時間や労力を極端に下げることで、実績を大きく見せられます（例：1時間で3,000円稼げた）。また、平日の昼間にカフェに行く、松屋でトッピングを無限につけるなど、普通の人ができない小さな贅沢を表現するのが有効です Q-7：株式投資の手法を発信するとしたときに、定型先の案件の手法と全く同じでなくても良いのでしょうか？ A-7：手法が完全に一致していなくても問題ありません。重要なのは 「どんなゴールに連れて行けるか」 であり、具体的な「How（手法）」は後から調整可能です。案件先から魅力的な情報提供があれば、それを使ってセールスに繋げることができます。 Q-8：株式投資の発信をしつつ、裏垢や占いの商材を売るのは可能ですか？ A-8：可能です。最終ゴール（What/バット）が「お金を増やしたい」という点で共通していれば、 「投資は元手がないと無理だが、入金力アップのためにこの（裏垢や物販の）手法が良い」 という形で誘導し、手法（ハウ）を途中で変えることができます Q-9：広く拾って（幅広く）集客する運用と、カテゴリーに絞ったアカウントを複数運用するのだと成約率は変わるか？ A-9：ジャンルを絞った方が制約率は上がります。ジャンルを絞ることで、その商材に興味がある人（見込み度が高い層）が集まりやすくなるためです Q-10：発信したいジャンル（高単価アフィリエイト）で取り組んだ経験がない場合、興味あるものを選ぶ形で良いですか？（エアプになるかも） A-10：興味あるものを選ぶ形で良いです。お金稼ぎ系であれば、具体的な手法（ハウ）は誰も気にしません。ポイ活やマネーリテラシーなど、すぐに調べられる情報を発信して興味ある層を集めれば、商材を売ることは可能です Q-11：発信者が多いジャンルは運用しやすいジャンルという認識でいいでしょうか？ A-11：発信自体はしやすいです。しかし、発信者が多いからといって、儲かるかどうかは別問題です。 Q-12: 競合大手を見ると自分の発信内容が薄いと感じます。自分のレベルに合わせた発信をすべきでしょうか？ A-12: 必ずしも大手のように高度な内容を発信する必要はありません。見込み客を集められるのであれば問題なく、実績が少ない人でも、それがゆえに読者の共感を呼び、興味を持たせることは可能です。人間は自分に関係することや近いことに興味を持つため、かけ離れすぎた実績よりも身近な方が刺さる場合もあります。 Q-13：アカウント買収をしたが、元の発信内容に合わせるべきか、ゴロッと変えるのはアリか？ A-13：全然ゴロッと変えて良いです。買収の目的は「見込み客（Who）」を得ることなので、見込み客が強く「ハウ（手法）」にこだわっていなければ、細かな手法が変わっても問題ありません。元の投稿内容も、遡って見る人は少ないため削除しなくても良いです。 Q-14：買収したいアカウントがDMを解放していない場合、リプで買収の話を持ちかけるべきか？ A-14：リプでDM解放を促すのはアリです。ただし、多くの人に送りすぎると怪しまれる可能性があるため注意が必要です Q-15：10の要素の投稿で、実績画像や自由な生活の画像がない場合はどうしたら良いでしょうか？ A-15：捏造を公に推奨することはできないが、実績の「見せ方」を工夫することは可能です。例えば、少ない金額でも達成にかかった時間を短く見せることで実績を大きく見せられます（例：1時間で3000円稼いだ）。自由な生活の様子は、無料でいける映える場所（カフェ、公園、海辺など）や、普段はできない身近な贅沢（松屋のトッピングを全部乗せ、少し高めの卵、シャインマスカットなど）を見せることで表現できます。親孝行やサウナ、温泉なども有効です。 Q-16：10の要素（投稿ネタ）は、自分の実績を使う方が良いか、提携先のノウハウを元にした方が良いか？ A-16：自分の実績や経験を使う方が良いです。売りたい商材（アフィリエイト先）のノウハウについては、提携先から提供があるため心配する必要はありません Q-17：1つの端末で複数のアカウントを運用しているのですが、今からでも別の端末に移行すべきでしょうか？ A-17：今からでも端末を分けることで対応可能です。もし過去に凍結したアカウントがある場合は、その端末と回線（Wi-Fiやモバイルネットワーク）をすぐに変えるべきです。 Q-18：裏垢発信をするためにアカウント買収を検討していますが、どのような属性のアカウントが良いでしょうか？ A-18：「マネタイズに興味がある層」であれば何でも良いですが、特に裏垢系、アダルトアフィリエイト系、またはXマネタイズ系の発信アカウントが良いでしょう。 Q-19：ナンパ界隈で女攻略でマネタイズよりも、女攻略するためのお金稼ぎでマネタイズした方が良さそうでしょうか？ A-19：根本には「お金を稼ぎたい」という欲求があるため、ナンパ系アカウントで金稼ぎの発信をすること自体は可能ですが、最初はお金稼ぎ系をやるなら、お金稼ぎ系の界隈で発信する方が良いです。ジャンルを飛び越えた発信は高度なテクニックが必要になります Q-20：キャラを尖らせるために、ポストの口調は丁寧語よりも強い口調の方が良いですか？ A-20：キャラを尖らせることは、必ずしも攻撃的な口調である必要はありません。キャラを尖らせることは、激務感や極端な経歴など、キャラクター性を強調することであり、口調は「ちょいと癖がある」程度でも構いません。例えば「激務サラリーマン」なら、その激務感を演出することであり、口調は丁寧語でも問題ありません。 Q-21：新規アカウント作成時に、同ジャンルをどの程度フォローすべきでしょうか？ A-21：運用アカウントとは別に「見る用のアカウント」を用意し、同ジャンルのアカウントを「片っ端から」フォローするくらいの勢いで良いです。良いアカウントだけでなく、伸びていないアカウントを見ることで、何が良いのかの「差分」が理解でき、学習に繋がります。 Q-22：同業者を見つける基準はありますか？ A-22：X上で、商品リンクやリスト（公式LINEなど）へのリンクがあるアカウントは販売者であるため、そこから見つけられます。また、ノーハウコレクターのアカウントを特定し、その人のフォロー欄を漁るのも有効です。 Q-23：買収したアカウントも別端末が良いのでしょうか？ A-23：できれば別端末が良いです。1端末で運用する場合は、同じ端末内のアカウント同士で交流（いいね、リポストなど）させないことが重要です。 Q-24：1つの携帯で複数アカウント運用中、1つが凍結したら他のアカウントも伸びづらくなることはありますか？ A-24：1つのアカウントが凍結した場合、その端末内にある他のアカウントも凍結する可能性があります。そのため、凍結した場合はすぐに端末と回線（Wi-Fi/モバイルネットワーク）を変更することをお勧めします。 Q-25：アカウントを新たに作る場合、凍結リスクを考え端末は変えた方がいいですか？ A-25：既存アカウントでBAN経験があるなら変えるべきです。また、端末だけでなく回線（Wi-Fi、SIM）も変える必要があります。同じWi-Fiを使っているとIPが紐づき、リスクがあります。 Q-26：1つのスマホで複数アカウントを運用している場合、1つBANと紐づいて全てBANになる？ A-26：そのリスクはあります。また、同じ端末内にあるアカウント同士でいいねを送り合うなどの行為は凍結しやすくなるため、絶対にやめるべきです Q-27：Xの課金はクレジットカードを全て変えていますか？ A-27：クレジットカードを全て変える必要は、そこまでないと考えています。 Q-28：田中氏がアカウント凍結したという話があったが、復活したのか、別垢にしたのか？ A-28：別垢を新たに買収して運用しています Q-29：携帯を分けた後、PCでログインしない方が良いですか？ A-29：はい、端末を分けるべきなので、PCでのログインも避けた方が良いです。 Q-30：幅広く拾っていろんなジャンルの商品に流すのと、カテゴリーを絞ったアカウントを複数運用するのとでは、成約率は変わりますか？ A-30：カテゴリーを絞った方が成約率は高まります。これは、絞ることでそのジャンルに興味がある人を集めやすくなるためです。 Q-31：複数アカウントを作成する場合、1つのメールアドレスや電話番号で一気に作成しても問題ないでしょうか？ A-31：複数アカウントを作成する際は、電話番号は統一しない方が良いです。メールアドレスは無限に作成できるため、Gmailなどで異なるメールアドレスを使用し、電話番号登録は避けるのが良いでしょう。 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/dLX7oUPA62W5/lesson/eI9LmdwEbJFq","createdAt":"2026-05-16"},{"id":"scr-1779710258128-mgirdb","title":"Lv.11 講義QA | なまいきスクール会員サイト","category":"feedback","content":"Lv.11 講義QA Lv.11の内容でいただいた質問に回答しました！ Q-1：手段の教育で、簡単じゃないからこそブルーオーシャンみたいなのもOKですか？（画像生成さえできれば一番最強ですみたいな） A-1：中上級者をターゲットにするなら刺さるが、初心者はハードルの低さや再現性を求めるため、参入障壁があるからこそ熱いというワードは理解できない。ハードルがあるからこそいいというのを単体で言われると、売れない人が多い。その辺をちゃんとロジック組んで話していくと良い Q-2：自分は実績ゼロです。教育というと先生感がでてしまうから、実績のない人はまだ教育系ポストをやらない方がいいのでしょうか。 A-2：教育は重要。先生として教えるのではなく、プレイヤーとして「俺はこれは大事だと思っている」「俺がそれを体現している」という形で出せばいい。教育は相手に悟らせる、自発的に行動してもらうこと Q-3：フォロワー現在300人なのですが、もう少しフォロワーを増やさなければインプが伸びにくい形でしょうか。 A-3：フォロワーがいないと最初の反応がないため伸びにくい。定量的なものはないが、大体500人ぐらいいたら、ある程度伸びやすくなってくる Q-4：マネタイズするならどのタイミングが良いか。（アカウント育成フェーズについて） A-4：アカウントを育てるフェーズ。フォロワー0人でノートを売っても売れない。リストを取れる準備をするなどが必要 Q-5：発信が長くなっても、目的教育を組み込み始めても違和感はないですか？ A-5：教育はバレないように入れ込むのがめっちゃ重要。「教育してるやん」と思われたら、教育がうまくいってない証拠 Q-6：普段のポストに一度も遠征のワードを入れていないが、売りの宣伝や教育はマネタイズが始まった段階でいこうと思っているが問題ないか。 A-6：問題ない。お客さんは手法（遠征）自体に興味がない。美女を抱きたいという目的に対して、その手段として遠征がハマるかどうかが重要 Q-7：低単価の自動商品を作って売るのも問題ないでしょうか？そのリストを使ってアフィリエイトもしたい。 A-7：全然問題ないですよ。ただ商品を作るのは大変。 Q-8：基準値の教育とターゲット層 A-8：絶望客は基準値が高すぎるとハードルが高いと感じる。いきなりハードルを上げすぎず、ギリギリ行けるくらいのところ、少し無理するくらいに設定するのが大事 前へ 受講済みにする 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/LhLTttKrKd1j/lesson/PWtKuwg4x9TX","createdAt":"2026-05-16"},{"id":"scr-1779710258128-thswjf","title":"アカウント添削会2 | なまいきスクール会員サイト","category":"feedback","content":"アカウント添削会2 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/DrpvsdmjeMwm/lesson/QLsylIjGLo7X","createdAt":"2026-05-16"},{"id":"scr-1779710258129-zrjokc","title":"教育記事完全攻略①〜読者の感情を動かしてCTAを踏ませる設計図〜 | なまいきスクール会員サイト","category":"material","content":"教育記事完全攻略①〜読者の感情を動かしてCTAを踏ませる設計図〜 前へ 受講済みにして次へ 受講済み 次へ","sourceUrl":"https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/ypISHOtWAVVp/lesson/F5PgyHB7Aiu1","createdAt":"2026-05-16"},{"id":"scr-1779710258130-esiupb","title":"6-1 ポストがどう売上に影響するのか？ | なまいきスクール会員サイト","category":"material","content":"6-1 ポストがどう売上に影響するのか？ はい！ それではLv.6の 「ポスト作成【実践編】」 ということでスタートしていきます🔥 Lv.3の 「ポスト作成【入門編】」 では、 まず 基本の「き」 として なんのためにポストをするのか？ どうやってポストを作ればいいか？ ポストネタ一覧について みたいな部分を触れました。 どうでしょうか？？？ ポスト作り慣れてきましたか？？ X運用初心者を見てると 「ポストが思いつきません…」 「リサーチに5時間かかります…」 「何を発信すればいいんですか？」 みたいなレベルがつまずく人が 全体の60~70% くらいいるので、 むずかしいテクニック や 教育とかの概念 は置いておいて いったんポストを作れる状態 を 目指してLv.3では解説しました。 まぁ 最低限のポスト ができれば、 あとは XTEP や プレゼント企画 を使って 強制的にフォロワー獲得して LINE集客すること もできちゃうので ”最悪”ポストがAIで作れればOK と思っておいてください。 ただし、 これだけで説明を終えちゃうと せっかくスクールに入ってもらった 意味がないので、 今回のLv.6では より実践的 な ポスト作成のノウハウや思考 について 掘り下げて解説していきます！ これマスターしておけば、 そのへんの ”なんちゃって発信者” よりも 圧倒的に運用がうまくなりますし コンテンツ販売系以外の市場 だと、 そもそも運用がうまい人なんて皆無 なので あれ、運用みんな下手じゃね？？ ライバル弱くね？？？ となるはずですw Lv.6の内容 X運用におけるセンターピンについて ポストがどう売上に影響してくるか？ 熱量の高い濃いフォロワーを集める方法 認知獲得と教育ポストの違いについて ポストの反応率を上げるには？ 今回の講義内容も運用において 超重要な項目になっています。 ぜひ何度も聞いてマスターして、 その上で余裕があれば Lv.3の復習もしてみてください！ 🔥 X運用における センターピンについて Xを伸ばす上で一番大事なもの ＝センターピンは何か？ 突然ですが、質問です。 Xを伸ばしていく上で 一番重要なもの ってなんだと思いますか？ アルゴ攻略のテクニック？ 実績？？ 人脈があること？ 伸びるポストの型？ … もちろん、 こんなものではありません。 僕が２年前から一貫して言ってる X運用におけるセンターピン。 それは誰がいうか？ を作ることです。 Xでは何をいうかより、 誰がいうかの方が100倍重要です。 イメージして欲しいのですが、 なまいきくん が 「Xは興味付けで決まる」 と発言するのと よくわからんモブ垢 が 「Xは興味付けで決まる」 と発言するの。 同じ意味合い で受け取れますか？ Xを今まで何度も伸ばしてきて、 インプも普段からとれていて 何千万円〜何億円とXだけで 稼いでるなまいきくん。 よくわからん月10万円も稼げてない 無名アカウント。 どう考えても、 同じ言葉でも受け取り方が違うはず です。 なまいきくんのポストを 他人がパクったところで たいして伸びないことがある のは 「誰がいうか？」 という前提条件が違うから。 じゃあ、 この「誰がいうか」は 何で作られるか？ もちろん プロフィール ではありません。 プロフィールに実績を書いたから と言って 特に興味を持たれるわけではない です。 じゃあ何が重要なのか？ というと 「普段のポスト」 です。 そもそも Xでフォローする流れ って 普段からタイムラインで 「ポスト」を何度か見てる ↓↓↓ 「ポスト」に触れるうちに 徐々に興味を持ってくる ↓↓↓ プロフィールに飛ぶ ↓↓↓ 直近の「ポスト」を 数個遡ってフォローする こんな感じで行われるので、 まず 最初の接触ポイント である ポストが圧倒的に重要 なのです。 インプを獲得する 教育する ファンを増やす リストに誘導する どれもポストが起点になります。 「誰が」を作り込めると どうなるのか？ Xでは 「誰が？」 さえ確立できれば、 ぶっちゃけ何でも売れます。 僕は ナンパ垢 の方で、 物販スクールを高単価アフィ で 売ったことがありますが ・ナンパはもちろん金稼ぎにも詳しい ・他人が知らない情報を知ってる というイメージを確立できてたので、 特に動画やセミナーなし でも 別ジャンルの商材を売ることができました。 物販に詳しいから買うのではなく 「〇〇さんがおすすめするから買う」 という状態です。 これを作りましょう。 さらにいうと、 Xでの発信で誰が確立できてるか否か で リストインした後の売上 も全然変わります。 おそらくですが… このスクールに入ってる人は、 色んな発信者の公式LINE・メルマガ にも たくさん登録しているはずです。 そのうち、 ちゃんと配信を追っていて 配信が届いたら開く人 って 何人くらいいますか？ おそらく 0〜2人 だと思います。 あとはただ登録したけど、 すぐに 興味をなくしたモブ発信者 。 発信者の立場になったときに、 ”モブ側” になってしまったら いくらリスト数が集まってもゴミ です。 薄いリストを何人集めたところで 成約しないしコスパ悪い だけ。 だからこそ、 LINEに登録される以前 に Xにおいて「誰が」を作り込んで 熱量が高いフォロワーを集めること 。 LINE登録したときには 「〇〇さんの情報知りたいっす！！」 「〇〇さんに返信もらえるなんて嬉しい🥹」 みたいな状態にしておくのが 圧倒的なキーポイントです。 ポストがどう売上に 影響を与えてくるのか？ 具体的なポストノウハウ に入る前に、 「集客→教育→販売」 という商売の流れ 「ファネル」「リストマーケ」 みたいな概念 が頭に入っていない人、 言葉すら知らない人が大半だと思います。 今回掘り下げるポストについては、 そこ理解なしには語れないので その辺りに触れつつ、 まずはポストがどのようにして 売上にインパクトを与えてくるか？ という仕組みから解説していきます！ Xで売上を立てる流れ ちょっと復習になりますが、 Xで売上を立てるには大きく分けて この ３つのステップ を踏むことになります。 ① 人数を集める 簡単にいうとフォロワー集め ポストや自発フォローを使って 自分を認知してもらったり とか、 フォローしてもらったり することです。 ビジネスにおいては まずは自分を知ってもらわないと お話にならない ので 非常に重要なステップです。 ② 見込み度合いを上げる 商品を買うお客さんに変化させます。 フォローしてくれたお客さんが すぐに商品を買ってくれるか？ というと、 もちろんそんなことはありません。 こいつ怪しいな ほんとに稼いでんのかな？ こいつの手法って本当にいいのかな？ 他の手法は何があるかな？ etc. あなたにも手法にも興味が じコンテンツ販売 の中でも ✅️ なまいきくんの手法 ✅️ 〇〇さんの手法 ✅️ △△さんの手法 と、さらに山が分かれるわけです。 この中で 自分の山を登りたい！ と思わせるのが 情報発信 です。 そして、 いざ登ろうと思ったら 「頂上までの道のり」 に何段かの ステップがあります。 例1：コンテンツ販売の場合 ⛳️ 月100万円超える ↑↑↑ 4️⃣ ローンチを勉強する ↑↑↑ 3️⃣ 商品作成を覚える ↑↑↑ 2️⃣ X集客を身につける ↑↑↑ 1️⃣ アカウント作成を身につける 例2：恋愛の場合 ⛳️ 彼女ができる ↑↑↑ 4️⃣ 彼女にするにはどうするか ↑↑↑ 3️⃣ トーク、デート、関係値を深める技術 ↑↑↑ 2️⃣ マッチングアプリ攻略 ↑↑↑ 1️⃣ 外見磨きをする この階段を登らないといけません。 さらに 外見磨きも細分化 すると ✅️ 散髪する ✅️ 痩せる ✅️ 服を買いに行く ✅️ メイクする これだけ 細かく分けられるイメージです。 一般的には、 この １つ１つのステップを 超えるためのノウハウ が商品になっています。 情報発信 とは、 「この山登り魅力的だな、登りたいな」 「この山は簡単そうだな… 私にもできるかも」 と思わせるために 1️⃣ 山の頂上から見える景色 （理想の未来） 2️⃣ 山を登るロードマップ（全体像） 3️⃣ 山の魅力 （速さ、簡易さ、再現性の高さ） などを語っていくことを 情報発信 といいます。 物販なら、 これから 物販の山を登りたい 山の０〜１号目の人に向けて👇️ 物販での情報発信 ✅️ 物販初心者が最初に何すればいいか？ ✅️ 自由な生活を得た現在の様子 ✅️ 物販をはじめて得られた変化 ✅️ 物販で月30万の利益を得る ロードマップ ✅️ 他の物販手法と比べた 自分の手法の魅力 ✅️ 他の手法に比べた物販の魅力 こういった 要素 を発信していくことで、 「この人についていこう」 という思考に 徐々に変わっていきます。 じゃあどうやったら、 そんな発信コンセプトが作れるのか？ 売れる発信コンセプトの３つのポイント まずは 3つの要素 を決めましょう。 重要な3つの要素 Who：スタート地点 ターゲット：どんな人を集めるのか？ ターゲット例） 「Xって稼げるの？」 と思っている20代サラリーマン スペック例👇️ ✅️ 手取り14万円 ✅️ 0→1突破に苦戦してる ✅️ X運用経験なし What：ゴール地点 ゴール：最終的に何を目指すのか？ ゴール例） Xコンテンツ販売で月300万円 ✅️ 外注化して1日20分 ✅️ スマホだけで完結 How：どんなステップで どんなロードマップで ゴールにつれていくか？ ロードマップ例） 高単価アフィで稼ぐ アカウント作成 フォロワー集め リスト獲得(XTEP) 運用力UP！ 図でイメージすると👇️ 物販垢の具体例なら👇️ Who（誰に？） ✅️ 物販をはじめたい初心者 ✅️ 収益化できてない人 What（どんなゴールに？） ✅️ リスク低く月50~100万円稼ぐ ✅️ 自由な生活ができる How（どうやって） ✅️ こんな手法で〜 ✅️ こんなロードマップで〜 みたいな感じです。 コンセプト作りのポイント 【POINT1】 ゴールが魅力的であること ✅️ メリット(稼げる金額)がデカい ✅️ ストレス、リスクがない ✅️ 時間、労力的な制約がない ゴールの魅力 が強ければ強いほど 集客パワーが強くなります。 例1：占い系 稼げる金額がでかい 例2：物販 スキル不要、外注で手離れ可 【POINT2】 Whoはステップの0~1段目 ✅️ 山に登る前の人 1段目にいる人に向けて発信する 理由： 単純に母数が多いからです！ 例： 売上が0~10万円以下の人たち 【POINT3】 Howは他人を参考に！ ロードマップは 検索すればごろごろ出てくる ✅️ YouTube ✅️ note‧電子書籍 ✅️ ChatGPT それを 利用しちゃえばOKです！ ここまでで、 発信コンセプトの３要素 を 説明してきました！ 次に、 発信内容を決めましょう！ 自分のターゲットに何を伝えていけば あなたの山を登りたくなるのか？ まずは、 これだけポストしときゃOK！ という 「10のポスト方針」 を決めます。 弊社でも新規垢を運用するときは 「迷ったらこの10個だけポストしとけ」 という要素を決めています。 「いきなり考えろって言ったって 思いつかない…！」 そんな声が聞こえてきたので、 今回 サンプルをご用意 しました！ それでは、 次の要素を参考に (パクってOK) 10の要素を決めましょう！ 10の要素① ✅️ 他の手法と比べた【テーマ】の魅力 リスクの低さ
