チやより高度なマーケなど\nさらに一段階上のテーマを扱います！\n\n内容もむずくなってきて\n復習が追いついてない人もいると思うので\n1週間の余裕を作りました！\n\nぜひこのタイミングに\n今までやったことを復習したり、\nマネタイズに向けた準備を\n進めていったりしてください\n\n次の講義は2月14日(土)になります！","sourceUrl":"","createdAt":"2026-02-05T15:04:57.968Z"},{"id":"scr-1779710258308-biijgy","title":"[講義アナウンス] @everyone   第22回目講義お疲れ様でした！  復習しやすいように講義...","category":"instructor","content":"@everyone   第22回目講義お疲れ様でした！  復習しやすいように講義スライドとテンプレ資料を配布しますのでご確認ください！  【講義スライド】  はじめに https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/E6cHW6GGwhDa.pdf  品質を決めるコンテンツ設計 https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/nH4S87KFAjf1.pdf  コンテンツの作成方法 https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/veVGkzOWGDY8.pdf  リリース前の細部の調整 https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/amm5lecTE0nW.pdf  【テンプレ資料】  粗ステップの書き出しPDF https://utagesystem.s3.ap-northeast-1.amazonaws.com/c3xYR6qKJz0G/w669EjLO1eNDlSYY6xP5SBRvewVyWUZZbW89GbTt.pdf  マインドマップ例PDF https://utagesystem.s3.ap-northeast-1.amazonaws.com/c3xYR6qKJz0G/6ICYPzzpHZJRCpSCZtIc8ODNbgcbGTAuORfdvR9p.pdf  https://utagesystem.s3.ap-northeast-1.amazonaws.com/c3xYR6qKJz0G/vlEtNccaxneyMWzF9RliACQ7cL0QPX0mMyxaX48r.pdf  https://utagesystem.s3.ap-northeast-1.amazonaws.com/c3xYR6qKJz0G/NmQxFfyrG3NOM7XguzjibcOPdkRCHvES8yteTABe.pdf  https://utagesystem.s3.ap-northeast-1.amazonaws.com/c3xYR6qKJz0G/szoQjANl4jyojYMtShu9vxX2SwDghrUdw9F3b5aK.pdf  スライドテンプレート https://www.canva.com/design/DAG_TeTor4Y/l-wgTyF7ZCTC3dTN8nsZ6w/view?utm_content=DAG_TeTor4Y&utm_campaign=designshare&utm_medium=link&utm_source=publishsharelink&mode=preview  記事の例 https://raku-kasegi.namaikilog.com/members/7174aTCxRVb7/course/FV9r91lSO0EQ/lesson/zcFeTPG6BRI8 (編集済)\n2026年2月6日金曜日 18:22","sourceUrl":"","createdAt":"2026-02-06T09:22:41.020Z"},{"id":"scr-1779710258309-ysodau","title":"[講義アナウンス] @everyone\n\n第24回目の講義を\n\n今週2/14(土)の21時より行いま...","category":"instructor","content":"@everyone\n\n第24回目の講義を\n\n今週2/14(土)の21時より行います！ \n\n内容は\n\n・最強の手法プロダクトローンチとは？\n・期待感をぶち上げるローンチの呼吸\n・爆発的に売るプロモ企画の流れ\n・The.Xのローンチ解説\n\nこちらになります！\n\nこれまでの講義で、アカウント育成編〜マネタイズ編と学習してきて、メンバーの力もかなりついてきているので、扱うテーマのレベルを上げて\n\n今回はプロダクトローンチ【全体像編】として、なまいきくんがデカい売上を立てている極意の部分を解説します！\n\n同じフォロワー数いても、ローンチの上手さ次第で、売上は桁1つ平気で変わってくるので、\n\n爆発的に売るのが得意な僕が、過去の事例も含めて、売上を大きく伸ばす方法を話していきます！\n\n今回もリアルタイムで講義を行い、\n\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！","sourceUrl":"","createdAt":"2026-02-12T03:55:30.616Z"},{"id":"scr-1779710258310-huqxae","title":"[講義アナウンス] @everyone \n\nhttps://us06web.zoom.us/j/81...","category":"instructor","content":"@everyone \n\nhttps://us06web.zoom.us/j/81702304708?pwd=8XRjKdLvRBYabJh7MjJPitpyy9nMaM.1\n\n本日の講義はこちらからどうぞ！","sourceUrl":"","createdAt":"2026-02-14T12:00:30.729Z"},{"id":"scr-1779710258310-rfkujh","title":"[講義アナウンス] @everyone \n\n第24回目講義お疲れ様でした！\n\n復習しやすいように講義...","category":"instructor","content":"@everyone \n\n第24回目講義お疲れ様でした！\n\n復習しやすいように講義スライドを配布しますのでご確認ください！\n\n【講義スライド】\n\n売上を数百万・数千万と爆上げするプロダクトローンチの極意【全体像編】\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/SYFhoR5h93vZ.pdf\n\n【ローンチ全体像編】売上最大化のためのローンチの呼吸\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/AodGxOIrtrVa.pdf\n\nフォロワーの熱量を爆発的に高めて圧倒的な売上に繋げるローンチ企画\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/CxEWrIj49Uvf.pdf","sourceUrl":"","createdAt":"2026-02-15T08:21:29.497Z"},{"id":"scr-1779710258311-vmzcxm","title":"[講義アナウンス] @everyone\n\n第25回目の講義を\n2/21(土)の21時より行います！\n...","category":"instructor","content":"@everyone\n\n第25回目の講義を\n2/21(土)の21時より行います！\n\n内容は\n【ローンチ実践編】\n・売上を最大化するポスト設計の極意\n・①興味付けの呼吸 \n・②手段推しの呼吸\n・③商品告知の呼吸\nこちらになります！\n\n前回の講義でプロダクトローンチの全体像を学んできましたが、\n今回からはいよいよ【ローンチ実践編】として、\nローンチの3ステップの中でも最重要な「ローンチの呼吸」を、\n実際にポストが書けるレベルまで徹底的に掘り下げていきます！\n\nローンチの呼吸には\n「興味付け→手段推し→商品告知」の3つのフェーズがあり、\nこの順番通りにポストしていけば、\n読者が勝手に「欲しい！」と思ってくれる状態を作れます。\n\n今回の講義では、\nポストを書く前にやるべき「素材の洗い出し」から、\n各フェーズの具体的なポストの型・実例まで全部話すので、\n講義が終わった瞬間からローンチのポスト設計に取りかかれます！\n\nローンチの上手さで売上は桁が変わるので、\nここは本気で身につけていきましょう！\n\n今回もリアルタイムで講義を行い、\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！","sourceUrl":"","createdAt":"2026-02-19T03:21:05.431Z"},{"id":"scr-1779710258311-dsuamy","title":"[講義アナウンス] @everyone \n\n本日の講義はこちらからどうぞ！\n\nhttps://us0...","category":"instructor","content":"@everyone \n\n本日の講義はこちらからどうぞ！\n\nhttps://us06web.zoom.us/j/84906636669?pwd=ToM78a4r0isQJJsHacNP9bEi0acYCB.1","sourceUrl":"","createdAt":"2026-02-21T11:57:54.181Z"},{"id":"scr-1779710258312-evepdf","title":"[講義アナウンス] @everyone   本日の講義はこちらからどうぞ！  https://us0...","category":"instructor","content":"@everyone   本日の講義はこちらからどうぞ！  https://us06web.zoom.us/j/84906636669?pwd=ToM78a4r0isQJJsHacNP9bEi0acYCB.1","sourceUrl":"","createdAt":"2026-02-21T16:08:12.235Z"},{"id":"scr-1779710258313-gwhysd","title":"[講義アナウンス] @everyone \n\n昨日の講義の続きはこちらからどうぞ！\n\nhttps://...","category":"instructor","content":"@everyone \n\n昨日の講義の続きはこちらからどうぞ！\n\nhttps://us06web.zoom.us/j/88469755938?pwd=LaBwv6TlRtzbxhO3adlQ0XnZXKp9XY.1","sourceUrl":"","createdAt":"2026-02-22T11:58:52.774Z"},{"id":"scr-1779710258313-yhjiqx","title":"[講義アナウンス] @everyone \n\n第25回目講義お疲れ様でした！\n\n復習しやすいように講義...","category":"instructor","content":"@everyone \n\n第25回目講義お疲れ様でした！\n\n復習しやすいように講義スライドを配布しますのでご確認ください！\n\n【講義スライド】\n\nローンチの呼吸を始める前に\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/0drDQv3F996A.pdf\n\n売上を最大化するポスト設計の極意\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/cZSqC0Kes7N9.pdf\n\n①興味付けの呼吸\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/Jr75XxYaz254.pdf\n\n②手段推しの呼吸\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/xfhMFQbPf8Lr.pdf\n\n③商品告知の呼吸\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/lmUZ7vncLvtE.pdf","sourceUrl":"","createdAt":"2026-02-23T06:49:11.919Z"},{"id":"scr-1779710258314-doxyfi","title":"[講義アナウンス] @everyone\n\n【アカウント添削希望者を募集します】\n\n次回講義2/28(...","category":"instructor","content":"@everyone\n\n【アカウント添削希望者を募集します】\n\n次回講義2/28(土)に、\n第3回「アカウント添削会」を行います！\n\n直近の講義では、ローンチ実践編として「ローンチの呼吸」を学んできたと思います。\n\nこれらを自分の実践に落とし込むには、まず「今のアカウントの状態」を整えることが大事です！\n\nなので次回は、その実践に直結する形で土台を整えるための添削会を行うことになりました！\n\nスクール生が運用しているアカウントをなまいきくんが直接添削するので\n\n「なまいきくんにアカウント添削して欲しい！」という希望者を募集します！\n\nなまいきくんから直に添削受けられる機会は滅多にないので、奮ってご応募ください！\n\n 注意\n\n・応募は、次回講義2/28(土)21:00〜にリアルタイムで参加できる方のみでお願いします\n\n・アカウント添削は人数に限りがあります。人数が多い場合は抽選になります\n\n選ばれることを祈って、次回の講義を楽しみにお待ちください！\n\n━━━━━━━━━━\n応募期限：2/26(木) 23:59 \n━━━━━━━━━━\n\n応募フォームはこちら\nhttps://docs.google.com/forms/d/e/1FAIpQLSfg48wNTPRalEY2aiWH3GN65ZeP4Ef6c9jgFRe1n1UrXRB8uQ/viewform?usp=publish-editor (編集済)\n2026年2月25日水曜日 17:14","sourceUrl":"","createdAt":"2026-02-25T08:03:27.818Z"},{"id":"scr-1779710258314-gwxzxd","title":"[講義アナウンス] @everyone  【アカウント添削希望者を募集します】  次回講義2/28(...","category":"instructor","content":"@everyone  【アカウント添削希望者を募集します】  次回講義2/28(土)に、 第3回「アカウント添削会」を行います！  直近の講義では、ローンチ実践編として「ローンチの呼吸」を学んできたと思います。  これらを自分の実践に落とし込むには、まず「今のアカウントの状態」を整えることが大事です！  なので次回は、その実践に直結する形で土台を整えるための添削会を行うことになりました！  スクール生が運用しているアカウントをなまいきくんが直接添削するので  「なまいきくんにアカウント添削して欲しい！」という希望者を募集します！  なまいきくんから直に添削受けられる機会は滅多にないので、奮ってご応募ください！   注意  ・応募は、次回講義2/28(土)21:00〜にリアルタイムで参加できる方のみでお願いします  ・アカウント添削は人数に限りがあります。人数が多い場合は抽選になります  選ばれることを祈って、次回の講義を楽しみにお待ちください！  ━━━━━━━━━━ 応募期限：2/26(木) 23:59  ━━━━━━━━━━  応募フォームはこちら https://docs.google.com/forms/d/e/1FAIpQLSfg48wNTPRalEY2aiWH3GN65ZeP4Ef6c9jgFRe1n1UrXRB8uQ/viewform?usp=publish-editor (編集済)\n2026年2月25日水曜日 17:14","sourceUrl":"","createdAt":"2026-02-25T08:14:52.473Z"},{"id":"scr-1779710258315-xurfos","title":"[講義アナウンス] @everyone   第24回目講義お疲れ様でした！  復習しやすいように講義...","category":"instructor","content":"@everyone   第24回目講義お疲れ様でした！  復習しやすいように講義スライドを配布しますのでご確認ください！  【講義スライド】  売上を数百万・数千万と爆上げするプロダクトローンチの極意【全体像編】 https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/SYFhoR5h93vZ.pdf  【ローンチ全体像編】売上最大化のためのローンチの呼吸 https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/AodGxOIrtrVa.pdf  フォロワーの熱量を爆発的に高めて圧倒的な売上に繋げるローンチ企画 https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/CxEWrIj49Uvf.pdf","sourceUrl":"","createdAt":"2026-02-26T13:40:40.570Z"},{"id":"scr-1779710258316-wxkjrx","title":"[講義アナウンス] @everyone\n\n第26回目の講義を\n3/7(土)の21時より行います！\n\n...","category":"instructor","content":"@everyone\n\n第26回目の講義を\n3/7(土)の21時より行います！\n\n内容は\n【企画の作り方 実践編】\n・フォロワーの購買欲を爆発させるローンチ企画の全技術\n・教育×拡散×リスト獲得が同時に回るローンチ動画の作り方 \n・ライブだからこそ伝わるSpaceの使い方\n・LINE配信にしかできない重要な役割\nこちらになります！\n\n前回のLv.22ではローンチの呼吸として、\nポストで2〜3週間かけて興味づけ・教育・商品告知の流れを作る方法を学びました。\n\nただ、ポストだけでは「気になる」止まりで「欲しい！今すぐ買う！」まで持っていけないケースが多い。\n\n今回は【企画の作り方 実践編】として、\nポストの教育だけでは突破できない壁を、ローンチ動画・Space・LINE配信の3つの企画パーツで一撃で突破する具体的な設計方法を全て解説します。\n\nローンチ動画1本で売上の7割が決まると言っても過言ではなく、「教育しながら拡散しながらリストを取る」好循環の仕組みを作れるようになります。\n\nさらにSpaceのリアルタイムの本物感で信頼を積み上げ、LINE配信で全パーツを確実に読者の手元に届けることで、販売した瞬間に爆発的に売れる状態を作れるようになります。\n\n講義後には初回ローンチの全手順が明確になり、実際に商品を売るローンチを組めるようになります。\nまず1回やって「売る経験」を積むことが全てのスタートです。\n\n今回もリアルタイムで講義を行い、\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！","sourceUrl":"","createdAt":"2026-03-05T06:46:02.327Z"},{"id":"scr-1779710258316-xcapsb","title":"[講義アナウンス] @everyone \n\n本日の講義はこちらからどうぞ！\n\nhttps://us0...","category":"instructor","content":"@everyone \n\n本日の講義はこちらからどうぞ！\n\nhttps://us06web.zoom.us/j/82054123654?pwd=QRzTxeZDycmy2m6azwhXDhacJgfIed.1","sourceUrl":"","createdAt":"2026-03-07T11:50:09.933Z"},{"id":"scr-1779710258317-cfieix","title":"[講義アナウンス] @everyone  第26回目の講義を 3/7(土)の21時より行います！  ...","category":"instructor","content":"@everyone  第26回目の講義を 3/7(土)の21時より行います！  内容は 【企画の作り方 実践編】 ・フォロワーの購買欲を爆発させるローンチ企画の全技術 ・教育×拡散×リスト獲得が同時に回るローンチ動画の作り方  ・ライブだからこそ伝わるSpaceの使い方 ・LINE配信にしかできない重要な役割 こちらになります！  前回のLv.22ではローンチの呼吸として、 ポストで2〜3週間かけて興味づけ・教育・商品告知の流れを作る方法を学びました。  ただ、ポストだけでは「気になる」止まりで「欲しい！今すぐ買う！」まで持っていけないケースが多い。  今回は【企画の作り方 実践編】として、 ポストの教育だけでは突破できない壁を、ローンチ動画・Space・LINE配信の3つの企画パーツで一撃で突破する具体的な設計方法を全て解説します。  ローンチ動画1本で売上の7割が決まると言っても過言ではなく、「教育しながら拡散しながらリストを取る」好循環の仕組みを作れるようになります。  さらにSpaceのリアルタイムの本物感で信頼を積み上げ、LINE配信で全パーツを確実に読者の手元に届けることで、販売した瞬間に爆発的に売れる状態を作れるようになります。  講義後には初回ローンチの全手順が明確になり、実際に商品を売るローンチを組めるようになります。 まず1回やって「売る経験」を積むことが全てのスタートです。  今回もリアルタイムで講義を行い、 その場で質問にも答えるので、是非リアルタイムでご参加くださいー！","sourceUrl":"","createdAt":"2026-03-08T14:38:36.850Z"},{"id":"scr-1779710258317-rtxpun","title":"[講義アナウンス] @everyone\n\n今週は日曜日に講義を行います\n\n第27回目の講義を3/15...","category":"instructor","content":"@everyone\n\n今週は日曜日に講義を行います\n\n第27回目の講義を3/15(日)の21時より行います！\n\n内容は\n【コラボ講義：ローンチ実践編】\n・ローンチで1.3億売れた「コンセプト」の正体（誰が・誰に・何を）\n・全てのコンセプトで最も重要な「新規性 × 需要」フィルターの使い方\n・実際に1200人集めたコンセプトの設計プロセス公開\nこちらになります！\n\n今回はゲストとして、実際になまいきスクールの高単価アフィで一撃1.3億売ったシロウさんを招いてのコラボ講義です。\n\n今回は「ローンチで1億円売った方法(〜1200人集めたコンセプトの作り方〜」として、\n\nなまいきくんとのコラボセミナーで実際に1.3億の売上を作ったコンセプト設計の裏側を、具体的な手順とともに全て解説します！\n\nコンセプトが良ければ投稿がバズり、集客でき、商品が売れる。\n\n逆にコンセプトが微妙なら、どれだけセールスや台本を作り込んでも人が集まらず刺さりません。\n\nビジネスの入り口であるコンセプトの作り方を押さえることで、セミナー集客だけでなくポスト・企画・ローンチ全体の成果が何倍にも変わります。\n\n「商品コンセプト・強み・実績の整理→共通項の発見→新規性の掛け算」という再現性のある設計手順が手に入るので、\n\n講義後すぐに自分のセミナーや企画のコンセプトを見直すアクションが取れます。\n\n今回もリアルタイムで講義を行い、その場で質問にも答えるので、是非ご参加くださいー！","sourceUrl":"","createdAt":"2026-03-13T12:23:03.296Z"},{"id":"scr-1779710258318-kmkdwi","title":"[講義アナウンス] @everyone \n\n本日の講義はこちらからどうぞ！\n\nhttps://us0...","category":"instructor","content":"@everyone \n\n本日の講義はこちらからどうぞ！\n\nhttps://us06web.zoom.us/j/88064096134?pwd=WuY8zJVsRu6KiHyF3N42k0104h0Al1.1","sourceUrl":"","createdAt":"2026-03-15T12:03:00.284Z"},{"id":"scr-1779710258319-fnqgkt","title":"[講義アナウンス] @everyone \n\n第27回目講義お疲れ様でした！\n\n復習しやすいように講義...","category":"instructor","content":"@everyone \n\n第27回目講義お疲れ様でした！\n\n復習しやすいように講義スライドや資料を配布しますのでご確認ください！\n\n【講義スライド】\n\n24-1　ローンチで1億売った裏側公開！\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/hQvyP0Xt1OcX.pdf\n\n24-2　売上最大化コンセプトの考え方\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/OdCT5GeS9PLT.pdf\n\n24-3　コンセプトを活かすセミナー設計\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/n7oKKcDkY7EW.pdf","sourceUrl":"","createdAt":"2026-03-16T10:30:23.246Z"},{"id":"scr-1779710258319-wglfdo","title":"[講義アナウンス] @everyone\n\n【次回講義のお知らせ】\n今週3月21日(土)の講義は休講で...","category":"instructor","content":"@everyone\n\n【次回講義のお知らせ】\n今週3月21日(土)の講義は休講です！\n\nここまで24回の講義で、本来予定していたX運用の基礎からマネタイズ、ローンチまで、 土台になる知識とノウハウは全てお伝えしました。\n\nただ、ぶっちゃけここで終わるつもりはありません。\n\n実際カリキュラムを進行してみて、まだ伝えたい実際の事例解説や、ローンチのより高度なテクニックもあります。\n\nただそれ以上に、 今のメンバーを見ていて思うのは、\n\n基礎の部分をもう一段強化するだけで、まだまだ5倍、10倍と売上を伸ばしていけるということ。\n\nコンセプト設計、日々の運用、導線の組み方。 \n\nここの土台を見直すだけで、 もっとマネタイズできるアカウントに変えていけるポテンシャルがあります。\n\nだからこそ今、 そこを徹底的に強化するための講義とコンテンツの準備を進めています。\n\nさらに、これまでの指導やフィードバックで蓄積してきたデータを土台にして、 最新のAI技術を活用したサポートツールも開発中です。\n\n最初は半年間の講義カリキュラム予定でしたが、 ここで終わらせる気はないです。\n\n4月以降、さらにブーストするための施策も仕込んでいるので、 楽しみにしていてください","sourceUrl":"","createdAt":"2026-03-20T13:47:19.014Z"},{"id":"scr-1779710258320-ikzqir","title":"[講義アナウンス] @everyone   第25回目講義お疲れ様でした！  復習しやすいように講義...","category":"instructor","content":"@everyone   第25回目講義お疲れ様でした！  復習しやすいように講義スライドを配布しますのでご確認ください！  【講義スライド】  ローンチの呼吸を始める前に https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/0drDQv3F996A.pdf  売上を最大化するポスト設計の極意 https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/cZSqC0Kes7N9.pdf  ①興味付けの呼吸 https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/Jr75XxYaz254.pdf  ②手段推しの呼吸 https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/xfhMFQbPf8Lr.pdf  ③商品告知の呼吸 https://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/lmUZ7vncLvtE.pdf","sourceUrl":"","createdAt":"2026-03-22T07:36:37.786Z"},{"id":"scr-1779710258320-bzrazo","title":"[講義アナウンス] @everyone  今週は日曜日に講義を行います  第27回目の講義を3/15...","category":"instructor","content":"@everyone  今週は日曜日に講義を行います  第27回目の講義を3/15(日)の21時より行います！  内容は 【コラボ講義：ローンチ実践編】 ・ローンチで1.3億売れた「コンセプト」の正体（誰が・誰に・何を） ・全てのコンセプトで最も重要な「新規性 × 需要」フィルターの使い方 ・実際に1200人集めたコンセプトの設計プロセス公開 こちらになります！  今回はゲストとして、実際になまいきスクールの高単価アフィで一撃1.3億売ったシロウさんを招いてのコラボ講義です。  今回は「ローンチで1億円売った方法(〜1200人集めたコンセプトの作り方〜」として、  なまいきくんとのコラボセミナーで実際に1.3億の売上を作ったコンセプト設計の裏側を、具体的な手順とともに全て解説します！  コンセプトが良ければ投稿がバズり、集客でき、商品が売れる。  逆にコンセプトが微妙なら、どれだけセールスや台本を作り込んでも人が集まらず刺さりません。  ビジネスの入り口であるコンセプトの作り方を押さえることで、セミナー集客だけでなくポスト・企画・ローンチ全体の成果が何倍にも変わります。  「商品コンセプト・強み・実績の整理→共通項の発見→新規性の掛け算」という再現性のある設計手順が手に入るので、  講義後すぐに自分のセミナーや企画のコンセプトを見直すアクションが取れます。  今回もリアルタイムで講義を行い、その場で質問にも答えるので、是非ご参加くださいー！","sourceUrl":"","createdAt":"2026-03-22T07:37:44.898Z"},{"id":"scr-1779710258321-yubmcq","title":"[講義アナウンス] @everyone\n\n締切済み\n\n【アカウント添削希望者を募集します】\n\n次回3...","category":"instructor","content":"@everyone\n\n締切済み\n\n【アカウント添削希望者を募集します】\n\n次回3/28(土)に、第4回「アカウント添削会」を行います！\n\n先週もなまいきくんからお伝えがあった通り、 24回の講義でX運用の基礎からマネタイズ、ローンチまで、土台になる知識とノウハウは全てお伝えしてきました。\n\nただ、ここからが本番です。\n\n学んだことをどれだけ自分のアカウントに反映できるか。ぶっちゃけ、ここが売上に一番直結します。\n\nコンセプト設計、日々の運用、導線の組み方、ちょっとしたズレを直すだけで反応が全然変わるのに、 そのズレって自分じゃなかなか気づけない。\n\nだからこそ、なまいきくんが直接みんなのアカウントを添削して 一気に修正かけるのがこの添削会です。「添削して欲しい！」という方はぜひご応募ください！\n\n毎回、添削受けた人はそこからちゃんと伸びてますし、 なまいきくんから直に添削受けられる機会は滅多にないので、奮ってご応募くださいー！\n\n 注意\n\n・応募は、次回3/28(土)21:00〜にリアルタイムで参加できる方のみでお願いします\n\n・人数に限りがあるため、多い場合は抽選になります\n\n選ばれることを祈って、楽しみにお待ちください！\n\n━━━━━━━━━━\n応募期限：3/25(水) 23:59\n━━━━━━━━━━\n\n応募はこちらから↓\nhttps://docs.google.com/forms/d/e/1FAIpQLSe1Jc-wpGxiSmqU__ILC2NdCuMLg8QEBSoKLj6VLKOilT6ftA/viewform?usp=dialog (編集済)\n2026年3月27日金曜日 14:10","sourceUrl":"","createdAt":"2026-03-24T14:30:07.933Z"},{"id":"scr-1779710258322-avabwc","title":"[講義アナウンス] @everyone\n\n 3/28(土)の21時より、\nリアルタイムにてアカウント...","category":"instructor","content":"@everyone\n\n 3/28(土)の21時より、\nリアルタイムにてアカウント添削会を行います！\n\n明日の添削会に向けて、 アカウントを1つ1つ見ていますが、\nみんなの学びになるアカウントを中心に添削アカウントを選んでます。\n\n実際に見てて思うのが、 \nほんのちょっとのズレを直すだけで\n反応が全然変わりそうなアカウントがめちゃくちゃ多い。\n\nただこのズレ、自分じゃ気づけません。 \nだから僕が直接見て、一気に修正かけるのがこの添削会です。\n\nぶっちゃけ、 \nここで学んだことをどれだけ自分のアカウントに反映できるか。 \nここが売上に一番直結します。\n\n添削内容もかなり濃くなりそうだし、 \n今回もしっかり本質をぶつけていくので、 \n人の添削を見てるだけでも自分のアカウントに活かせるヒントは絶対見つかるはずです\n\nリアルタイムで参加して、 吸収できるもの全部持ち帰ってください","sourceUrl":"","createdAt":"2026-03-27T05:07:35.595Z"},{"id":"scr-1779710258322-amnmmx","title":"[講義アナウンス] @everyone \n\n本日の講義はこちらからどうぞ！\n\nhttps://us0...","category":"instructor","content":"@everyone \n\n本日の講義はこちらからどうぞ！\n\nhttps://us06web.zoom.us/j/82304048715?pwd=3Oyybyq8JIUbxSqbvyrsAB2qB4DbEd.1","sourceUrl":"","createdAt":"2026-03-28T11:57:50.609Z"},{"id":"scr-1779710258323-vxntck","title":"[講義アナウンス] @everyone\n教育記事の添削会を\n4/4(土)の21時30分より行います！...","category":"instructor","content":"@everyone\n教育記事の添削会を\n4/4(土)の21時30分より行います！\n\n内容は\n【教育記事添削会】\nスクール生が書いた教育記事を添削し、\n教育記事を書ける力を身につけていく回になります！\n\n教育記事は教育導線の要で、\n「この人の記事おもろい」「もっと読みたい・知りたい」と\n思わせられるかどうかが、ここで決まります。\nつまり、教育記事の質＝成約率に直結する部分です。\n\n今回はいくつかの事例をもとに、\n教育記事・教育導線の添削をしていきます！\n\n記事の段階で詰まっている人も多いと思いますが、\n実際の事例を見ることで\n「こう書けばいいのか」がかなりクリアになるので、\nだいぶ書きやすくなるはずです！\n\n自分の記事が添削されなくても、\n他の人の添削を見るだけで\n「あ、自分もこれやってた」という気づきが必ずあります。\n添削会は\"見るだけ\"でもめちゃくちゃ学びになるので、\nぜひ参加してください！\n\n今回もリアルタイムで行い、\nその場で質問にも答えるので、是非ご参加くださいー！","sourceUrl":"","createdAt":"2026-04-03T04:56:10.452Z"},{"id":"scr-1779710258323-bstdua","title":"[講義アナウンス] @everyone   3/28(土)の21時より、 リアルタイムにてアカウント...","category":"instructor","content":"@everyone   3/28(土)の21時より、 リアルタイムにてアカウント添削会を行います！  明日の添削会に向けて、 アカウントを1つ1つ見ていますが、 みんなの学びになるアカウントを中心に添削アカウントを選んでます。  実際に見てて思うのが、  ほんのちょっとのズレを直すだけで 反応が全然変わりそうなアカウントがめちゃくちゃ多い。  ただこのズレ、自分じゃ気づけません。  だから僕が直接見て、一気に修正かけるのがこの添削会です。  ぶっちゃけ、  ここで学んだことをどれだけ自分のアカウントに反映できるか。  ここが売上に一番直結します。  添削内容もかなり濃くなりそうだし、  今回もしっかり本質をぶつけていくので、  人の添削を見てるだけでも自分のアカウントに活かせるヒントは絶対見つかるはずです  リアルタイムで参加して、 吸収できるもの全部持ち帰ってください","sourceUrl":"","createdAt":"2026-04-03T13:09:12.691Z"},{"id":"scr-1779710258324-igifpt","title":"[講義アナウンス] @everyone 教育記事の添削会を 4/4(土)の21時30分より行います！...","category":"instructor","content":"@everyone 教育記事の添削会を 4/4(土)の21時30分より行います！  内容は 【教育記事添削会】 スクール生が書いた教育記事を添削し、 教育記事を書ける力を身につけていく回になります！  教育記事は教育導線の要で、 「この人の記事おもろい」「もっと読みたい・知りたい」と 思わせられるかどうかが、ここで決まります。 つまり、教育記事の質＝成約率に直結する部分です。  今回はいくつかの事例をもとに、 教育記事・教育導線の添削をしていきます！  記事の段階で詰まっている人も多いと思いますが、 実際の事例を見ることで 「こう書けばいいのか」がかなりクリアになるので、 だいぶ書きやすくなるはずです！  自分の記事が添削されなくても、 他の人の添削を見るだけで 「あ、自分もこれやってた」という気づきが必ずあります。 添削会は\"見るだけ\"でもめちゃくちゃ学びになるので、 ぜひ参加してください！  今回もリアルタイムで行い、 その場で質問にも答えるので、是非ご参加くださいー！","sourceUrl":"","createdAt":"2026-04-03T14:59:06.631Z"},{"id":"scr-1779710258325-mndgwl","title":"[講義アナウンス] @everyone \n本日の講義はこちらからどうぞ！\n\nhttps://us06...","category":"instructor","content":"@everyone \n本日の講義はこちらからどうぞ！\n\nhttps://us06web.zoom.us/j/81021528698?pwd=re2LfXHuUZXofU8clJhK1ROQgFw0E5.1","sourceUrl":"","createdAt":"2026-04-04T12:01:59.974Z"},{"id":"scr-1779710258325-xwreid","title":"[講義アナウンス] @everyone\n\nテーマ別講義を 本日4/11(土)の21時より行います！\n...","category":"instructor","content":"@everyone\n\nテーマ別講義を 本日4/11(土)の21時より行います！\n\n内容は \n【SNSマーケティング完全攻略】 \n・テクより先に「地図」を持て\n・バラバラ技術、実は1本の流れ\n・詰まりどころが見えれば勝てる\nこちらになります！\n\n今回から新シリーズ「テーマ別講義」がスタートします。 \n\nスクール生が今詰まってるテーマを中心に、\n成果に直結する集中講義をやっていきます。\n\n今回はSNSマーケティング完全攻略として、 \nXマネタイズの全体像＝マーケの設計図を頭に叩き込む回です。\n\n今のスクール生を見てて、\n個別のテクニックは学んでるのに \nマーケの全体像がわからないまま動いてる人がかなり多いです。 \n\n全体像が見えてないと、\nポストもLINEも教育記事も 全部「なんとなく」になって、部分最適にしかなりません。 \n\n逆に全体像さえわかれば、\n全てのパーツに目的が見えるようになり、 \n「今自分は何をやるべきか」が明確になります。\n\n講義が終わったあと、\n自分の現在地と次にやるべきことが ハッキリわかる状態になるので、\n今回は全員必須です！\n\n今回もリアルタイムで講義を行い、 \nその場で質問にも答えるので、是非ご参加くださいー！","sourceUrl":"","createdAt":"2026-04-11T07:26:08.665Z"},{"id":"scr-1779710258326-mqqbwv","title":"[講義アナウンス] @everyone \n\n本日の講義はこちらからどうぞ！\n\nhttps://us0...","category":"instructor","content":"@everyone \n\n本日の講義はこちらからどうぞ！\n\nhttps://us06web.zoom.us/j/83811728398?pwd=Lul6GBkqCXfawvpBMbQqRaegPDaPpa.1","sourceUrl":"","createdAt":"2026-04-11T11:57:44.823Z"},{"id":"scr-1779710258326-olrhua","title":"[講義アナウンス] @everyone \n\n4/11(土)講義お疲れ様でした！\n\n復習しやすいように...","category":"instructor","content":"@everyone \n\n4/11(土)講義お疲れ様でした！\n\n復習しやすいように講義スライドや資料を配布しますのでご確認ください！\n\n【講義スライド】\n\nSNSマーケティング 完全攻略①\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/aDlibzuEi6Ao.pdf\n\nSNSマーケティング 完全攻略②\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/hxng1wdbFaED.pdf\n\nSNSマーケティング完全攻略③\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/BG16BYRzQNbv.pdf\n\nSNSマーケティング完全攻略④\nhttps://utagesystem.s3.ap-northeast-1.wasabisys.com/c3xYR6qKJz0G/HOK2MOqKcQur.pdf","sourceUrl":"","createdAt":"2026-04-12T04:44:32.402Z"},{"id":"scr-1779710258327-tatxjv","title":"[講義アナウンス] @everyone\n\n今週は質問会を 4/18(土) 21時 から行います。\n\n...","category":"instructor","content":"@everyone\n\n今週は質問会を 4/18(土) 21時 から行います。\n\n内容は 【なんでも質問会】 です。\n\n今回はスクール生からの質問にリアルタイムで答えていく回になりま n\nhttps://us06web.zoom.us/j/85761088545?pwd=QYWFatejS5axIDFwHfaAuzW37K863E.1 (編集済)\n2026年5月4日月曜日 21:08","sourceUrl":"","createdAt":"2026-05-04T12:08:10.666Z"},{"id":"scr-1779710258335-dryfyy","title":"[講義アナウンス] @everyone \n\n今週5/9(土)の講義は、休講にします！！\n\n前回の【教...","category":"instructor","content":"@everyone \n\n今週5/9(土)の講義は、休講にします！！\n\n前回の【教育記事完全攻略】は、\n2回に分けないと話せないくらい内容が多かったし、\n事例の解説もめちゃくちゃ入れてるので、\nまずはそこをがっつり咀嚼してほしいです！\n\n自分なりの動線や教育記事を作っていく、\n実践に挑戦する時間にあててもらえると最高です\n\n今、裏側ではみんなの現状を徹底的に分析しながら、\n「どこを強化したら一番、成果に直結するか」を\nチームでめちゃくちゃ考えてます！\n\n今後の講義では、\n今詰まってるポイントとか、\n「ここやったら売上最大化に効く」みたいな話を、\nピンポイントで教えていきたいと思ってます！！\n\n次回の講義は5月16日（土）を予定してるので、\n楽しみにしておいてください！！","sourceUrl":"","createdAt":"2026-05-08T03:25:04.680Z"},{"id":"scr-1779710258335-zvrtue","title":"[講義アナウンス] @everyone  今週は、先週から持ち越しになった 教育記事完全攻略講義を ...","category":"instructor","content":"@everyone  今週は、先週から持ち越しになった 教育記事完全攻略講義を 5/2(土)の21時より行います！  内容は、スライド確認してもらったと思いますが 【教育記事完全攻略】 ・教育記事の本質（気づき→期待感→不足感の3ステージ） ・実際に売れている記事4本の構造分解 ・自分の記事を組む6ステップ（目的から執筆までの順番） こちらになります！  前回のマーケティング全体像の講義で、 集客→リスト化→教育コンテンツ→CTAの流れと、 一番勝敗が分かれるのが教育だ、という話をしましたよね。  今回は【教育記事完全攻略】として、 その教育を「記事」という形でどう設計すればいいのか、 考え方の根本からパート1〜3で一気通貫で話していきます！  ノウハウを並べるだけじゃなくて、 読者が自分からCTAを踏みたくなる感情の設計図を、 自分の頭で組めるようになるのがゴールです。  講義が終わったあとには、 いきなり書き始める前に何を決めるべきかが見えて、 添削で書き直しになる前に、方向と構成を固められるはずです！  今回もリアルタイムで講義を行い、 その場で質問にも答えるので、是非リアルタイムでご参加くださいー！","sourceUrl":"","createdAt":"2026-05-10T14:20:25.756Z"},{"id":"scr-1779710258336-bcuqqy","title":"[講義アナウンス] @everyone\n\n1周目の講義ではありますが、今回は入会時期に関わらず全員リ...","category":"instructor","content":"@everyone\n\n1周目の講義ではありますが、今回は入会時期に関わらず全員リアルタイムで参加することを推奨します。\n\n今週は「コンセプト設計徹底解説」ということで\n5/16(土)の21時より行います！\n\n今回このテーマに決めたのは、\n受講生のなかでコンセプトのところで\n詰まってる人が圧倒的に多いと感じたからです！\n\nこれまで何回か添削会をしてきましたが、\nそのうち8～9割の受講生が\nコンセプトのところで詰まっています。\n\n逆にいうと、ここを突破すれば、\n圧倒的にマネタイズに繋がりやすくなります。\n\n・インプは取れているのにファンがつかない\n・売上に直結するポストが作れない\n・「自分を見る理由」が作れない\n\nみたいな人は要必見！\n\n今回の内容↓↓↓\n\n【コンセプト設計】\n――――――――――――――――――――\n・売れるコンセプトとは何か？\n・需要がある穴場ポジションの見つけ方\n・0からコンセプトを見つける全手順\n・マネタイズに繋がる発信軸の作り方\n――――――――――――――――――――\nこちらになります！\n\nコンセプトが決まらないと\nポストも導線も全部ブレるので、\n設計の考え方から手順まで\n一気に固めていきましょう！\n\n今回の講義で裏側の思考まで語るので、\nしっかりチェックして下さい。\n\n今回もリアルタイムで講義を行い、\nその場で質問にも答えるので、是非リアルタイムでご参加くださいー！","sourceUrl":"","createdAt":"2026-05-14T03:38:51.366Z"},{"id":"scr-1779710258336-uxguar","title":"[講義アナウンス] @everyone \n\n遅れましたが、本日の講義はこちらからお願いします!\n\nh...","category":"instructor","content":"@everyone \n\n遅れましたが、本日の講義はこちらからお願いします!\n\nhttps://us06web.zoom.us/j/85884120947?pwd=22EbZ4i1XGOJaLCau331qUUNFkEBBY.1","sourceUrl":"","createdAt":"2026-05-16T12:06:49.791Z"},{"id":"scr-1779710258337-fvnuwo","title":"[講義アナウンス] @everyone  1周目の講義ではありますが、今回は入会時期に関わらず全員リ...","category":"instructor","content":"@everyone  1周目の講義ではありますが、今回は入会時期に関わらず全員リアルタイムで参加することを推奨します。  今週は「コンセプト設計徹底解説」ということで 5/16(土)の21時より行います！  今回このテーマに決めたのは、 受講生のなかでコンセプトのところで 詰まってる人が圧倒的に多いと感じたからです！  これまで何回か添削会をしてきましたが、 そのうち8～9割の受講生が コンセプトのところで詰まっています。  逆にいうと、ここを突破すれば、 圧倒的にマネタイズに繋がりやすくなります。  ・インプは取れているのにファンがつかない ・売上に直結するポストが作れない ・「自分を見る理由」が作れない  みたいな人は要必見！  今回の内容↓↓↓  【コンセプト設計】 ―――――――――――――――――――― ・売れるコンセプトとは何か？ ・需要がある穴場ポジションの見つけ方 ・0からコンセプトを見つける全手順 ・マネタイズに繋がる発信軸の作り方 ―――――――――――――――――――― こちらになります！  コンセプトが決まらないと ポストも導線も全部ブレるので、 設計の考え方から手順まで 一気に固めていきましょう！  今回の講義で裏側の思考まで語るので、 しっかりチェックして下さい。  今回もリアルタイムで講義を行い、 その場で質問にも答えるので、是非リアルタイムでご参加くださいー！","sourceUrl":"","createdAt":"2026-05-17T06:15:01.445Z"},{"id":"scr-1779710258338-afpemo","title":"[質問部屋] 【グループ質問の利用方法】\n\n講義の学習効果を最大化するため\nグループ質問を解放...","category":"feedback","content":"【グループ質問の利用方法】\n\n講義の学習効果を最大化するため\nグループ質問を解放します！\n\nこちら積極的に質問してもらうことで\n自分1人では解決できない悩みを即解消できますし\n\n他のメンバーの質問も見ることで\n1人でやってるだけでは\n決して辿り着かなかった視点も得られます。\n\n存分に活用してください！\n\n以下質問時のルールだけ共有しておきます。\n\n・質問の際のルール\n\n①すでに授業で扱った内容に関する質問のみを可とします。\n\nチームなまいきメンバーが成果出るようにカリキュラムを組んでいるので、\nまだ授業で扱ってない先走った内容の質問は、一旦なしでお願いします！\n\n②完全に思考放棄するのは絶対に辞めること\n\nポスト何やればいいですか？\nアイコン何がいいと思いますか？\nローンチでどうすればいいですか？\n\nみたいな何も考えずに\nとりあえずぶん投げるみたいなのは禁止です\n\n当然サポートはしますが\n今後個人で稼いでいきたいなら\n自分で適切な解を捻り出すという業務は一生付きまといます\n\n思考放棄＝個人で稼ぐ道の断念なので\n必ず自分で考えられるだけ考えてから質問してください\n\nただ、悩みすぎも良くないので\n行き詰まったら即質問してください！\n\n\n③思考回路を必ず記載すること\n\n一番大事なのは具体事例のインプットや添削ではなく\nそもそもの思考回路をビジネスで結果が出るようなものに変えていくことです\n\nポストの質問で一旦そのポストは良くなったとて\nそれを再現性持って生み出せるようにならなければ\n結果を出し続けることはできません。\n\nなので必ずあなたがどう考え\n何をすべきだと思ってるのか\n必ず思考の形跡を明示した上で質問してください。\n\n\n\n\n\n━━━━━━━━━━\n\n【質問フォーマット】\n\n❶質問のおおまかなテーマ\n❷現在の状態、目指すゴール\n❸自分なりの意見や仮説\n❹質問内容\n\n-------------\n\n例1)\n\n❶アカウント買収について質問です。\n\n❷https://x.com/~~~\n\nこちらの物販系アカウントを今買収検討中です。自分は運用開始3ヶ月以内にはマネタイズ0→1達成していきたいと考えてます。\n\n❸今回、上記アカウントの買収に10万円かけようと思ってます。理由は〜〜〜だからです。\n\n❹この場合の10万円の値段は妥当でしょうか？\n\n-------------\n\n例2)\n\n❶X初期の運用について質問です。\n\n❷https://x.com/~~~\n\n現在、こちらの裏垢系アカウントをゼロから立ち上げて、1日3ポストを1ヶ月継続中です。\n\n授業で言われた通り、〜〜を意識してるのですが、中々インプもフォロワーも増えません。\n\n1ヶ月後には、〇〇フォロワー、平均インプ△△、まで伸ばせたらと思ってます。\n\n❸自分的には、〇〇が足りないのかなと思います。なので、これからはをやっていこうと思ってます。\n\n❹こちらの考えや方向性で合ってますでしょうか？ (編集済)\n2025年8月24日日曜日 12:34","sourceUrl":"","createdAt":"2025-08-24T03:05:22.485Z"},{"id":"scr-1779710258338-ouvsqv","title":"[質問部屋] 【グループ質問の利用方法】  講義の学習効果を最大化するため グループ質問を解放...","category":"feedback","content":"【グループ質問の利用方法】  講義の学習効果を最大化するため グループ質問を解放します！  こちら積極的に質問してもらうことで 自分1人では解決できない悩みを即解消できますし  他のメンバーの質問も見ることで 1人でやってるだけでは 決して辿り着かなかった視点も得られます。  存分に活用してください！  以下質問時のルールだけ共有しておきます。  ・質問の際のルール  ①すでに授業で扱った内容に関する質問のみを可とします。  チームなまいきメンバーが成果出るようにカリキュラムを組んでいるので、 まだ授業で扱ってない先走った内容の質問は、一旦なしでお願いします！  ②完全に思考放棄するのは絶対に辞めること  ポスト何やればいいですか？ アイコン何がいいと思いますか？ ローンチでどうすればいいですか？  みたいな何も考えずに とりあえずぶん投げるみたいなのは禁止です  当然サポートはしますが 今後個人で稼いでいきたいなら 自分で適切な解を捻り出すという業務は一生付きまといます  思考放棄＝個人で稼ぐ道の断念なので 必ず自分で考えられるだけ考えてから質問してください  ただ、悩みすぎも良くないので 行き詰まったら即質問してください！   ③思考回路を必ず記載すること  一番大事なのは具体事例のインプットや添削ではなく そもそもの思考回路をビジネスで結果が出るようなものに変えていくことです  ポストの質問で一旦そのポストは良くなったとて それを再現性持って生み出せるようにならなければ 結果を出し続けることはできません。  なので必ずあなたがどう考え 何をすべきだと思ってるのか 必ず思考の形跡を明示した上で質問してください。      ━━━━━━━━━━  【質問フォーマット】  ❶質問のおおまかなテーマ ❷現在の状態、目指すゴール ❸自分なりの意見や仮説 ❹質問内容  -------------  例1)  ❶アカウント買収について質問です。  ❷https://x.com/~~~  こちらの物販系アカウントを今買収検討中です。自分は運用開始3ヶ月以内にはマネタイズ0→1達成していきたいと考えてます。  ❸今回、上記アカウントの買収に10万円かけようと思ってます。理由は〜〜〜だからです。  ❹この場合の10万円の値段は妥当でしょうか？  -------------  例2)  ❶X初期の運用について質問です。  ❷https://x.com/~~~  現在、こちらの裏垢系アカウントをゼロから立ち上げて、1日3ポストを1ヶ月継続中です。  授業で言われた通り、〜〜を意識してるのですが、中々インプもフォロワーも増えません。  1ヶ月後には、〇〇フォロワー、平均インプ△△、まで伸ばせたらと思ってます。  ❸自分的には、〇〇が足りないのかなと思います。なので、これからはをやっていこうと思ってます。  ❹こちらの考えや方向性で合ってますでしょうか？ (編集済)\n2025年8月24日日曜日 12:34","sourceUrl":"","createdAt":"2025-08-24T03:34:33.986Z"},{"id":"scr-1779710258339-ulvfbh","title":"[質問部屋] 柴田@運営\n がメッセージをチャンネルにピン留めしました。ピン留めされたメッセー...","category":"feedback","content":"柴田@運営\n がメッセージをチャンネルにピン留めしました。ピン留めされたメッセージを全て表示。\n — \n2025/08/24 17:17\n2025年8月24日日曜日 17:17","sourceUrl":"","createdAt":"2025-08-24T08:17:23.199Z"},{"id":"scr-1779710258339-ptjejg","title":"[質問部屋] すみません！気付くの遅れました！\n\n 質問内容がちょっと分かりづらいのですが、 ...","category":"feedback","content":"すみません！気付くの遅れました！\n\n 質問内容がちょっと分かりづらいのですが、 まず、③の自分がどうしていきたいかで選ぶってのは、何を選ぶ話でしょうか？ また確認したいのは何になりますでしょうか？ \n\n④のこれはのこれは発信コンセプトのことを指してるのでしょうか？","sourceUrl":"","createdAt":"2025-08-28T10:24:12.773Z"},{"id":"scr-1779710258340-dwvzzy","title":"[質問部屋] 私も発信コンセプトAIでちょっと引っかかった部分があったので、拓巳（コウタ）さん...","category":"feedback","content":"私も発信コンセプトAIでちょっと引っかかった部分があったので、拓巳（コウタ）さんも同じ考えなのかどうか分かりませんが、私が感じた内容を勝手に追記させていただきます。  これから約3か月間はアカウントを育成する期間で、アカウント育成後に商材を決定してマネタイズを目指していくという流れになると思うのですが、発信コンセプト設計AIでは、最初に売りたい商材のことを詳しく答えることになるので、 「ジャンルとかターゲットとかは決まっているけど、ゴールとか提供手段とか、自分の理想と合う商材があるかどうか分からないのに理想論で答えてしまって良いのかなぁ」 と、少し悩んでしまった部分がありました。（結局、有名な方の商材の内容等を参考にしつつ、理想論で進めてしまいましたが…笑）","sourceUrl":"","createdAt":"2025-08-28T15:39:15.533Z"},{"id":"scr-1779710258341-ldyzxs","title":"[質問部屋] このなまいきスクールに例えると分かりやすいかもなので補足しておくと、\n\n僕が言っ...","category":"feedback","content":"このなまいきスクールに例えると分かりやすいかもなので補足しておくと、\n\n僕が言ってる商品というのは、集客に特化することで限りなく楽に稼ぐXマネタイズの講座\n\n(もっと言うとなるべく楽にXで稼ぐ講座)\n\nみたいなもんです。\n\n決して、毎週動画講義が24週あって、グループ質問が出来て、スタンダードプランは~~~\n\nみたいな具体的な特徴を伴う商品ではないです。\n\nこれである程度伝わりますか？","sourceUrl":"","createdAt":"2025-08-28T15:49:07.953Z"},{"id":"scr-1779710258341-lmbaec","title":"[質問部屋] ん、まあそうとも言えますが、多分伝わってなさそうな人もいるので、1講義目のスライ...","category":"feedback","content":"ん、まあそうとも言えますが、多分伝わってなさそうな人もいるので、1講義目のスライド修正して再度動画撮り直しますね！商品から逆算した発信ってのがややこしくしてる気がするので！","sourceUrl":"","createdAt":"2025-08-28T16:02:49.705Z"},{"id":"scr-1779710258342-tskwul","title":"[質問部屋] 分かりづらくて、すみません  ③の選ぶってのは、 「自分のアカウントをAI系のコ...","category":"feedback","content":"分かりづらくて、すみません  ③の選ぶってのは、 「自分のアカウントをAI系のコンテンツ販売してるアカウントにしたい！」 みたいな感じのコンセプトです。 また確認したいのは②に書いてあることです。  ④のこれは、は 発信コンセプト設計AIのことです！  これもリッキーさんの質問の解答で細かい事は考えなくて良いと認識しました！  だいたいはリッキーさんの質問と同じです！ 返信見て解決したと思うのですが、 「高単価アフィのテーマ（AI系）に沿っていれば、細かい内容（手段）は何でも良いのでAI系の魅力などを発信して行きましょう！」 って事でしょうか？ (編集済)\n2025年8月29日金曜日 10:48","sourceUrl":"","createdAt":"2025-08-29T01:48:09.697Z"},{"id":"scr-1779710258342-lacxry","title":"[質問部屋] @なまいきくん @あか@運営  お世話になっております。 下記2点についてご相談...","category":"feedback","content":"@なまいきくん @あか@運営  お世話になっております。 下記2点についてご相談させていただきます。  ① 現在運用中のアカウントでの目標達成可否  現在、https://x.com/kyonamn  のアカウントを運用しております。  目標は「運用開始から4ヶ月以内にマネタイズ（報酬200万円）」です。  試算としては、  ・運用2ヶ月目でフォロワー700名／平均インプ1,000達成 ・3ヶ月目でフォロワー1,000名に到達し、そのうち20%（=200件）のリストを獲得 ・100万円の商品 × 成約5% × 報酬率40% = 200万円  ※リストイン率は以前の講義を参考にしております。 (最低でも20%は取れると仰っていた気がします。違っていたらすみません)  この計算に基づき、現状のアカウント運用で目標達成が可能かどうか、ご意見をいただけますでしょうか。  ② アカウント買収の妥当性について  以下のアカウントの買収も検討しております。 https://x.com/makoto_rakuraku  ただし、①の現アカウントで十分達成可能との判断をいただける場合には、こちらの購入は行いません。  現状は買収金額20万円で提示されていますが、①の目標達成可否に応じて検討を進めたいと考えております。  以下、買収を検討している理由になります。  ・フォロワー数2,000人超え、直近のインプレッション1,000超え(8ヶ月前)と、ボーダーラインを満たしており、すぐにXTEPフェーズへ移行できる可能性がある ・運用が1年前に止まっているものの、200〜400件程度のリストは獲得できる見込み  ・リストから成約率5%で十分目標達成できそう  このような状況を踏まえ、買収金額20万円は妥当でしょうか。 (編集済)\n2025年8月31日日曜日 18:11","sourceUrl":"","createdAt":"2025-08-31T09:11:54.571Z"},{"id":"scr-1779710258343-tvtdpt","title":"[質問部屋] @なまいきくん @あか@運営   ❶プロフィールに関する質問です。  ❷恋愛系の...","category":"feedback","content":"@なまいきくん @あか@運営   ❶プロフィールに関する質問です。  ❷恋愛系の発信をしつつ、美女・東カレ攻略の高単価アフィリエイトをしようと思っています。  僕自身と浮かれや美女を抱いた経験はないので、アプリやナンパなどで女性経験を積み美女を抱いていく、ストーリー型の運用をしていく予定です。  ▼アカウント https://x.com/men_imp  ❸アカウントを持っていないためゼロからのスタートとなり、アカウント名は「モテゴリラ」にしようと考えています。  背景として、  ①僕自身が中性的なモテる男よりかは、ゴリラみたいな漢らしいモテ男になりたいと考えている ②世間一般的に、ゴリラっぽい人の方が美女にモテるようなイメージがある  という2つの理由です。  ❹この場合のプロフィールは適切か添削をお願いできますでしょうか？  グループでのアカウント添削不可でしたらご教示いただけますと幸いですm( )m (編集済)\n2025年9月12日金曜日 15:19","sourceUrl":"","createdAt":"2025-09-12T06:19:18.766Z"},{"id":"scr-1779710258344-orepsf","title":"[質問部屋] @なまいきくん @あか@運営  お世話になっています。 私も渡辺さんと同様にプロ...","category":"feedback","content":"@なまいきくん @あか@運営  お世話になっています。 私も渡辺さんと同様にプロフィールとアカウントについてお聞きしたいことがあります。  ①プロフィール、アカウントについての質問  ②提供して頂いたGPTsを用いて発信コンセプト、発信の10要素、プロフィール作成をしました。  発信コンセプト Who：誰に向けて発信するか？ 【読者の現状】 AI副業に興味がある 30代会社員（収入300万円台後半） で、実績やレベル感は 副業未経験・ゼロから何を始めていいかわからない状態  【悩み・課題】 初期費用がかかりそうで不安 本業にバレるのではないかと心配 副業禁止の会社でもできるか不安 情報が多すぎて何を信じていいかわからない 自分でも本当にできるのか不安  What：どんなゴールに連れて行くか？ 半年で安定的に月30万円を稼げるようになる  【理想の状態】 会社の給料以外に毎月30万円入るので将来の不安が減る 趣味や旅行に我慢せず自由にお金を使える 貯金や投資にまわせて余裕のある生活を送れる 自分に自信がついて他のことにもチャレンジできる   How：どんなロードマップで連れて行くか？ 初期費用ゼロで始められるAI副業を選ぶ 顔出し不要・匿名での発信方法を身につける 最初の収益化（1〜5万円）を達成 効率化＆仕組み化して10万円へ 複数手法を組み合わせて月30万円を安定化  発信の10要素 他の副業と比べたAI副業の魅力（ゼロ資金・顔出し不要・匿名OK） 他のAI副業手法と比べた「匿名型」の魅力（スキル不要・会社バレ回避） 半年で月30万円稼ぐためのロードマップ公開 AI副業を始めて得られた変化（収入源の複数化・安心感） AI副業で自由な生活を得た様子（旅行・趣味・投資に余裕） 実績の積み上げ報告（1万円→5万円→10万円→30万円） 初心者が最初にやるべきこと（匿名アカウント・最初の手法） よくある誤解の否定（費用・難易度・会社バレの不安を解消） AI副業の裏ワザ・ラク技（ChatGPTなどで効率化） 実践している様子の発信（リアルな過程で信頼感UP）  プロフィール作成 アカウント https://x.com/sponge_ai315  ヘッダーの作成はしました。XのヘッダーサイズをChatGPTで依頼しましたが1日の質問上限を超えてしまい貼り付けができていません。 アカウントのスクショとヘッダーで利用する予定の写真を添付します。  ④プロフィール、アカウントの添削をお願いしたいです。 添削不可の場合、ご教授して頂きたいです。","sourceUrl":"","createdAt":"2025-09-12T16:14:47.252Z"},{"id":"scr-1779710258345-dhmvex","title":"[質問部屋] 質問フォーマットを再度確認しました。フォーマットをもとに再度作成したので確認して...","category":"feedback","content":"質問フォーマットを再度確認しました。フォーマットをもとに再度作成したので確認して頂きたいです。  ①プロフィールについての質問  ②ビジネス用のアカウントをもっていないため、買収はせず新規でのスタートにしています。 AI副業の発信をしながら副業未経験の人、副業に手を出しても結果が出なかった人が徐々に収入が増えていくストーリー型の運用をしていこうと検討しています。  ③アカウント名は『スポンジ』にしました。 アカウント名の理由としては ・キャラクターのアイコンにすることで性別関係なく親しみ感を出して興味を持ってもらえるのではと考えている ・自分自身、副業に手を出した経験があるが全てうまくいくことができずにいたため同じ境遇のひとでももう一度 できるんだ！という意図で知識を吸収してもらいたくスポンジのキャラクターとして設定しました。  ④作成したプロフィールは適切かどうか添削をお願いしたいです。  アカウント https://x.com/sponge_ai315","sourceUrl":"","createdAt":"2025-09-13T02:08:44.665Z"},{"id":"scr-1779710258346-aceknp","title":"[質問部屋] 添削していただきありがとうございます。 肩書きの変更ヘッダーを追加しましたので再...","category":"feedback","content":"添削していただきありがとうございます。 肩書きの変更ヘッダーを追加しましたので再度添削をお願いしたいです。  アカウント https://x.com/sponge_ai315","sourceUrl":"","createdAt":"2025-09-14T10:44:16.247Z"},{"id":"scr-1779710258348-zsjtff","title":"[質問部屋] 質問させてください。  ❶質問のおおまかなテーマ 　プロフィールについて  ❷現...","category":"feedback","content":"質問させてください。  ❶質問のおおまかなテーマ 　プロフィールについて  ❷現在の状態、目指すゴール 　・アカウント作成、アカウント名、プロフィール文を作ったところ。（AIジャンルです） 　・合格点のプロフィールを作ることがゴール。  ❸自分なりの意見や仮説 　・コンセプトは、「AI時代と言われているのに食わず嫌いでいじってこなかったけど、生成AIにチャレンジしていく人」。 　・そそっかしくドジな雰囲気で名前はそそっ子、忙しく動いていて、愛されイメージでカワウソのアイコンを描きました。AI使えない人設定なので、アイコンとヘッダーはあえてAIで生成したものではないほうが良いと考えました。 　・実際にAIを勉強する様子、いじっていく様子を発信していく予定です。 　・「それ違うよ！」と突っ込みたくなるような感じだったり、「これなら自分にも活用できそう」とわくわくするような発信を目指していこうと考えています。  ❹質問内容 　・このコンセプトでスタートしてよろしいでしょうか？ 　・プロフィールはこれでよろしいでしょうか？  以下、アカウントです。 https://x.com/sosoccoai  ご回答のほどよろしくお願いいたします。","sourceUrl":"","createdAt":"2025-10-02T16:15:30.241Z"},{"id":"scr-1779710258348-lbiquh","title":"[質問部屋] ご回答ありがとうございます   センスあるとおっしゃっていただけてめちゃくちゃ嬉...","category":"feedback","content":"ご回答ありがとうございます   センスあるとおっしゃっていただけてめちゃくちゃ嬉しいです！  プロフはもっとテンポ良い方が良いということですね！ 属性を出すのは、プロフィール文の冒頭ということで合っていますでしょうか？それともアカウント名の右側でしょうか？  どんどん発信していきます","sourceUrl":"","createdAt":"2025-10-02T16:26:22.667Z"},{"id":"scr-1779710258349-remzdb","title":"[質問部屋] @Yusuke＠講師  @あか@運営  @なまいきくん   お世話になっておりま...","category":"feedback","content":"@Yusuke＠講師  @あか@運営  @なまいきくん   お世話になっております！  ❶質問のおおまかなテーマ アカウントロックに関する質問です。  ❷現在の状態、目指すゴール 以下アカウントを運用しており、現在、フォローやいいねに制限がある状態です。 https://x.com/men_imp  ▼詳細  ・フォローに関しては、フォローしようとすると「現在これ以上はフォローできません」というメッセージが表示される  ・いいねに関しては、いいねして一時反映されるものの、リロードするといいねが取り消される  ・昨日17:00頃にフォロー操作をしようとしたところ「アカウントに制限がかかった（3日間）」のようなメッセージが届いた →すぐに消えてしまい、現在は確認できない  ・リプや投稿は通常通り行える  ・検索窓でセルフチェックしたところ、シャドウバンはされていない  ❸自分なりの意見や仮説 過剰なフォローやいいねにより、フォローやいいねに関するロックがかかっていると思います。  （アカウントに関するロックはかかっていない）  ❹質問内容 この場合、一旦いいねやフォローは行わず、リプや投稿のみ通常通り行い、3日ほど経過してからいいね・フォローを行う運用方針で問題ないでしょうか？  それとも、アカウント自体を3日ほど放置した方がよろしいでしょうか？ (編集済)\n2025年10月7日火曜日 15:48","sourceUrl":"","createdAt":"2025-10-07T06:48:06.954Z"},{"id":"scr-1779710258350-klqbrm","title":"[質問部屋] @Yusuke＠講師   @あか@運営   @なまいきくん   ❶質問のおおまか...","category":"feedback","content":"@Yusuke＠講師   @あか@運営   @なまいきくん   ❶質問のおおまかなテーマ コンセプト、プロフィールについて  ❷現在の状態、目指すゴール 現在2つのアカウントがあります  ・1つ目は、女性向け恋愛で低単価noteを売っている非稼ぐ系 こちらは900フォロワーくらいでインプは1~4万程度です。しかしそんなに売り上げが立ってない ・2つ目は、今回から始めるビジネス系(AI占いかスピ系の物販の予定)  目指すゴール 1つ目の方で実績を作りつつ、2つ目の方のアカウントで成長していく感じにしたい  ❸自分なりの意見や仮説 低単価コンテンツ販売で疲弊した層と、これから副業を始めたいと思ってる人に向けるイメージにしようと思ってます。 私自身が1年やってきて成果があまり出せず疲れてしまったので… 共感と再スタートのきっかけを届けられたらと思います。  既存の恋愛垢では、インプは出てるのでなんとか活かしたいです。 note販売自体は教育と興味付けポストに課題があることを面談でご指摘いただいたので、そこの改善を図りたいと思います。  よく反応くれるフォロワー層は占いとかスピ系を好む人も多いため、徐々にスピ要素のある投稿を増やし反応見ながら、無料noteとか挟んで、新たに作った占いやスピ商品へ流せたら、みたいなイメージでいます。   ❹質問内容 このような感じでビジネス系アカウントの実績を作っていきたいのですが、考え方とか大丈夫そうでしょうか？ なにかズレてたらご教示いただければ幸いです。 以下のプロフィールも見ていただけたらありがたいです。 なにとぞよろしくお願い致します。  https://x.com/iki_kaerunrun","sourceUrl":"","createdAt":"2025-10-08T09:49:27.164Z"},{"id":"scr-1779710258350-chgqlj","title":"[質問部屋] @なまいきくん  @Yusuke＠講師  @あか@運営   お世話になります。 ...","category":"feedback","content":"@なまいきくん  @Yusuke＠講師  @あか@運営   お世話になります。 そしてご相談ください  ❶質問のおおまかなテーマ アカウント設定と運用について  ❷現在の状態、目指すゴール 現在このインスタ副業をテーマにアカウントを立ち上げ発信をしています。 https://x.com/yuri_n_hukugyou?s=21&t=zq-Nph1UuawDVTMmpjgkEw  【相談1】 本業の知識を活かせたらと思い看護師をターゲットにしました。 (夜勤をしたくない、夜勤なしに転職したら給料が下がる、パートは一般職に比べると時間に制約がある、高給のイメージがあるがそうでもない) しかし看護師に限定するとターゲットが狭すぎるのか不安になってきました。  【相談2】 ジャンルをインスタ副業にしましたが、実績がありません。(過去に挑戦するも当時は時間が取れず2～3ヶ月で断念→𝕏へ) 現在の投稿内容がインスタ副業のメリットやHowToのみとなっているのですが、少しでも実績のある他ジャンルから𝕏運用を始めた方がいいのか悩んでいます(裏垢数万円程度) 補足ですがインスタでの実績がある方がいいと考え、再始動させるためにアカウント設計を終えるところまでしました。他のインスタ講座生の方にも相談し、上手く運用できれば収益化できるとお言葉をいただいてます。 しかし同時運用となると作業量も時間もかかってしまうため、インスタ副業の発信と他ジャンルの発信どちらにするか決めきれずにいます。  ❸自分なりの意見や仮説  【相談1に対して】 𝕏には愚痴を呟いている看護師がたくさん居るため、そういう人にリーチしアカウントを伸ばせれば収益化は可能だと考えています。 (看護師をターゲットした転職アフィのアカウントが複数あり、悩みによっては転職ではやく副業をする方がいいと思わせるなど)  【相談2に対して】 インスタ運用が軌道に乗れば安定した収益をあげることができ、𝕏での看護師向けのインスタ副業の運用も信頼性が増すと考えています。しかし、それならターゲットを看護師と限定しない方がいいのではないかとも思い始めました。  ❹質問内容 𝕏でのターゲットはこのまま看護師に限定していてもいいのでしょうか？ そもそも、ジャンルをインスタ副業から少しでも実績のあるものに変えた方がいいのでしょうか？","sourceUrl":"","createdAt":"2025-10-10T14:12:49.363Z"},{"id":"scr-1779710258351-aqmyio","title":"[質問部屋] お忙しいなかご返信ありがとうございます。 そして追加で質問させてください  相談...","category":"feedback","content":"お忙しいなかご返信ありがとうございます。 そして追加で質問させてください  相談1のターゲットは広げるように設計し直します！アカウントは変えた方がいいと思うのですが、2年程前に作ったビジ垢を使ってもいいものでしょうか？ 発信はブログ→note販売やTipsアフィ→裏垢発信とTips販売をしていましたが、投稿は1年半程していません。 https://x.com/riri_bloglog?s=21&t=zq-Nph1UuawDVTMmpjgkEw  相談2についてはインスタ熱が今は高いので、挑戦してみようと思います！ 𝕏での投稿はインスタ運用を始めるところからリアルタイムで見せた方が副業を始める人にはリアリティがあるのかなと考えたのですが、ある程度インスタを運用して数字を見せられる状態にしてからの方がいいのでしょうか？","sourceUrl":"","createdAt":"2025-10-10T14:54:57.193Z"},{"id":"scr-1779710258351-noqvjz","title":"[質問部屋] @なまいきくん  @Yusuke＠講師  @あか@運営   お世話になっておりま...","category":"feedback","content":"@なまいきくん  @Yusuke＠講師  @あか@運営   お世話になっております。 質問させてください。  ❶質問のおおまかなテーマ 買収したアカウントコンセプトと活かし方について  ❷現在の状態、目指すゴール 買収したアカウントでAI×ビジネスアカウントを運営したいのですが、元々考えていたコンセプトとだいぶズレがあります。  A.元々考えていたコンセプト →ワーママ×管理職がAIとSNSでゆるっと稼ぐつかれない副業術を発信（等身大の自分の設定、ゆるい雰囲気）  B.買収したアカウント（7800フォロワー） ・アカウント画像が美女 ・金持ちブランディングをしている（美女写真の投稿あり） ・主に投資（海外不動産、事業投資など）、会社運営などで稼いでいる設定 ・辛口、自己啓発感強め  目指すゴール Bの方は最初エアプになってしまうが副業、投資で稼いでる設定のままコンテンツなどを売り、Aのアカウントでは元のコンセプト通り等身大の自分で成長していく→本当の実績を元に商品作りをしたい。  ❸自分なりの意見や仮説 Bの元の持ち主の方も金持ちブランディングは作ったものと言っていたかつ、ファンもある程度ついているためこのコンセプトは引き継ぎつつ、今後顔出しなどはあまり考えてないためアカウントはAIで美女風にする。 投資やAI、副業についてはエアプになってしまうがこれまで学んできた内容から無料note作成し、ファン層を活用してまずはメンバーシップ等に繋げる。  Bのプロフィール案 セレナ＠資産思考ラボ ・行動しない人に“自由”は訪れない ・投資×AI×副業マインドで資産を増やす思考法を発信 ・AI・副業・投資で「人生を変えたい人」だけフォロー  Aの方はなまいきくんスクール生とも活発に絡みつつ、実績を徐々に作り有料note等を作成する。 ※AIやインスタではある程度実績があるためまずはこの辺から参入してみる。 ※Aを運用するのも元は日常アカだが買収したアカなのでフォロワーは2000弱いる  ❹質問内容 このような感じでビジネス系アカウントの実績を作っていきたいのですが、考え方とか大丈夫そうでしょうか？ 特にBのアカウント設計や引き継ぎ方針についてご意見を伺えると助かります。 以下のプロフィールも見ていただけたらありがたいです。 なにとぞよろしくお願い致します。  Aのアカウント https://x.com/aoaibusiness24?s=21  Bのアカウント（変更前） https://x.com/2nd1435?s=21","sourceUrl":"","createdAt":"2025-10-12T07:28:33.835Z"},{"id":"scr-1779710258352-oxylrg","title":"[質問部屋] @Yusuke＠講師   ご回答いただきありがとうございます。Aの方はこのままで...","category":"feedback","content":"@Yusuke＠講師   ご回答いただきありがとうございます。Aの方はこのままでいこうと思います。 Bですが、当方投資の知識なく仰る通り負荷が高いため、投資はジャンルから外し、今までの自己啓発系のツイートは維持しながら美女や金持ちブランディング→AIスキルと副業は資産になる！みたいな方針で、商材というよりは高単価アフィ狙いでツイートをバズらせる方針で運用してみようかと思います。 上記について、何かご意見等あればいただけると幸いです。","sourceUrl":"","createdAt":"2025-10-12T09:27:45.358Z"},{"id":"scr-1779710258353-bibihu","title":"[質問部屋] @なまいきくん  @Yusuke＠講師  @あか@運営   お世話になっておりま...","category":"feedback","content":"@なまいきくん  @Yusuke＠講師  @あか@運営   お世話になっております。 質問させてください。   ❶質問のおおまかなテーマ コンセプト、プロフィールついて ❷現在の状態、目指すゴール ・現在、物販の方で高単価アフィリエイトに繋げる方向で 進めていきたいと思っています。 AIを使って、xのプロフィール作成やコンセプト作りしました。ご確認お願いいたします。  ❸ コンセプトは、  物販に興味がある副業初心者の会社員で、「今の給料に＋5～10万円の副収入を得て、将来的に脱サラを目指している人」。 実績やレベル感は「これから物販を始めたい、もしくは始めたばかりの段階」の人達に 発信していきたいと思っています。  ❹質問内容 このコンセプトでスタートしてよろしいでしょうか？ ・プロフィールの確認 よろしくお願いいたします。 以下アカウントです。  https://x.com/hu_08_05  只今プレミアム審査中で編集できないのですが 名前の方をゆめり @スマホ1台で叶える自由副業に変える予定です。 ご確認お願いいたします。","sourceUrl":"","createdAt":"2025-10-16T04:45:44.336Z"},{"id":"scr-1779710258353-vdimno","title":"[質問部屋] @なまいきくん  @Yusuke＠講師  @あか@運営   ❶質問のおおまかなテ...","category":"feedback","content":"@なまいきくん  @Yusuke＠講師  @あか@運営   ❶質問のおおまかなテーマ プロフィール、コンセプトの方向性について  ❷現在の状態、目指すゴール  •現在の状態 https://x.com/ai_soraneko?s=21  AIアカウントを準備中となります。  •目指すゴール 直近は、AIジャンルの高単価アフィで3ヶ月後に月100万マネタイズが目標です。  ❸自分なりの意見や仮説 まだ実績はないですが、これからちゃんと学んでおきたいと思いAIジャンルに決めました。  実績がないので、まずはAI初心者をターゲットに自ら学びながらAIのノウハウ、情報、知識を発信。  慣れてきたらAI副業にもチャレンジし、実績がでてきたら既存フォロワーも育てつつ、AI副業の領域にも展開していこうかと考えております。  ❹質問内容 プロフィールの内容、コンセプトの方向性に改善点などあればご教示頂きたいです！","sourceUrl":"","createdAt":"2025-10-16T04:48:42.524Z"},{"id":"scr-1779710258354-ipgnen","title":"[質問部屋] ご確認ありがとうございます！  承知しました、アイコンはモブ感を修正して  また...","category":"feedback","content":"ご確認ありがとうございます！  承知しました、アイコンはモブ感を修正して  また、ヘッダー、プロフ文もプレイヤー感が出るように修正してみます  ちなみ初歩的な質問ですみませんが、アイコンやヘッダーは基本外注で作成するのが良いでしょうか？  よろしくお願いします。","sourceUrl":"","createdAt":"2025-10-16T11:04:34.720Z"},{"id":"scr-1779710258355-zoompi","title":"[質問部屋] @なまいきくん  @Yusuke＠講師  @あか@運営   お世話になります。 ...","category":"feedback","content":"@なまいきくん  @Yusuke＠講師  @あか@運営   お世話になります。 ご相談させてください。  ❶質問のおおまかなテーマ 今週のタスク（Lv.1 はじめに） 4.気になるジャンルの入門動画を10本見る　について。  ❷現在の状態、目指すゴール X物販アカウントの立ち上げ  ❸自分なりの意見や仮説 物販に関する知識として、ポケモンカードをカードショップで仕入れて、メモアプリとエクセルで管理しながらメルカリで500回販売した実績がある為、不要。  ❹質問内容 「発信テーマの基礎知識をつけるために、 ロードマップ、入門的な動画を 10本見ましょう！」  とあります。 私の場合、物販の知識がメインではなく、ポケカの仕入れ→メルカリでの販売、に精通しています。この場合物販の知識を新しく獲得するべきでしょうか？ （備考:ポケカ絶賛バブルの為インプは取れそう）  お忙しい中、ここまで読んでいただき、ありがとうございました (編集済)\n2025年10月20日月曜日 16:23","sourceUrl":"","createdAt":"2025-10-20T07:23:05.093Z"},{"id":"scr-1779710258355-ddlqsn","title":"[質問部屋] @なまいきくん  @Yusuke＠講師  @あか@運営   追加での質問失礼しま...","category":"feedback","content":"@なまいきくん  @Yusuke＠講師  @あか@運営   追加での質問失礼します。 ご相談させてください。  ❶質問のおおまかなテーマ アカウント買収について。  ❷現在の状態、目指すゴール 物販アカウントにてフォロワー500人達成  ❸自分なりの意見や仮説 フォロワー400〜500人程度のアカウントを買収した方がフォロワー数は得られるが、ファン数という意味では今のアカウントの方が高い。その為現状のアカウントを回した方が信頼感は得られるのでは。  ❹質問内容 アカウント買収をするのと、現在のアカウントを継続運用するのはどちらの方が良いでしょうか？ 現在のアカウント https://x.com/moon_sight22?s=21 では、2023年ごろ、 DMで10人程からポケカの相談を受けており、当時「ピチュンさんがポケカ販売では一番信頼できる」と言われていました。当時の分析もメディア欄に大量に残っていて、流用できるのに加えて信頼度もあると思います。 2023年ごろにポケモンカードのアカウントを趣味で運用していて、当時200フォロワーいましたが現在140人の為、内容を流用して新規アカウントを立ち上げた方が良いのか迷っています。  いつもお忙しい中ありがとうございます！ (編集済)\n2025年10月26日日曜日 16:10","sourceUrl":"","createdAt":"2025-10-26T07:10:31.037Z"},{"id":"scr-1779710258356-rwkyrq","title":"[質問部屋] @なまいきくん  @Yusuke＠講師  @あか@運営   お世話になっておりま...","category":"feedback","content":"@なまいきくん  @Yusuke＠講師  @あか@運営   お世話になっております。 10/11に質問させていただいた内容に関連して、恐れ入りますが再度ご質問させてください。（リアルタイム講義に追いつけておらず、こちらでのご質問多くなり申し訳ございません。）  ❶質問のおおまかなテーマ 買収したアカウントのアカウント設計とアカウントパワーについて（講義3おまけ、講義4-1の内容に関連）  ❷現在の状態、目指すゴール 以前ご回答いただいた内容を参考にして、買収したアカウントで以下のようなAIジャンルのアカウントを運営しようとしております。  投資・自己啓発中心の発信→AIを副業ツールとしてだけではなく、これから必須の知識＝資産として学べる場を提供するために、主に以下を発信予定。 ・AIで文章を作るスキル ・AIで収益を生む仕組み ・AIを自分の分身のように動かす考え方  目指すゴール 既存フォロワーの規模を活かしつつ、新規フォロワーにもアプローチしてアカウントの表示パワーを高めたい。  ❸自分なりの意見や仮説 既存フォロワーには以下の要因によりほぼタイムラインにポストが表示されておらず、アカウント規模のレバレッジが効かずアカウントの表示パワーが思ったより伸びないのではないかということが悩み。 また、既存のアカウントに引きづられて美女・金持ちブランディングを続けようとしているが、教師型の運用が強すぎると新規層からのウケもイマイチと考えている。  ＜既存フォロワーの表示パワーが弱い理由＞ ・美女ブランディングにより裏垢？系のフォロワーが多くAIには興味がない ・いきなり投資、自己啓発からAIに発信内容が変わったことによる戸惑い、ファン離れ  ❹質問内容 講義4の内容に従って、初期アカウントの運用ルーティーンを継続することは大前提として、買収したアカウントの表示パワーを強めるために、以下の方針でアカウントを運用していくことで問題ないでしょうか。特に、既存フォロワーの表示パワーを強めてレバレッジを効かせる方法について悩んでいるため、追加のアドバイス等あればいただけると幸いです。  ＜既存フォロワーの表示パワーを強める施策＞ ・美女画像の素材が多数手元にあるため、美女画像を添付したポストをして既存フォロワーのタイムラインへの露出を狙う（AIの勉強も兼ねる） ・既存フォロワーはAIというよりは単純にお金が欲しい層？が多そうなので、マネタイズ実績なども多めにアピールしていく　※プレゼント企画も有効？？  ＜新規層へのアプローチ施策＞ ・既存の発信に引きづられて教師型のポストが多くなりがちなので、これまでの背景や価値観を丁寧に語っていくことで、ストーリー型のポスト比率を多めにして共感を得る。 ※生活のビフォーアフターなども載せる  また、前回の質問の中で聞き忘れてしまったのですが、目指すゴールがある程度権威性がないと達成できないかつ、今までのアカウントが実写アカウントだったことから、現状アカウントが美女風ドット絵イラスト(美女ブランディング×AIっぽさ)なのですが、視認性とインパクトがイマイチなので、スクール性のみなさんのようにうさぎ、ねこなどもう少しキャラクターに寄せるべきでしょうか。  長文となり恐縮ですが、ご確認いただけると幸いです。  ・アカウント https://x.com/2nd1435?s=21","sourceUrl":"","createdAt":"2025-10-28T03:04:05.483Z"},{"id":"scr-1779710258357-muhzaz","title":"[質問部屋] @なまいきくん  @Yusuke＠講師  @あか@運営   お忙しいところすみま...","category":"feedback","content":"@なまいきくん  @Yusuke＠講師  @あか@運営   お忙しいところすみません。質問させてください！  ❶質問のおおまかなテーマ 発信ジャンルと既存アカウントの使用可否について  ❷現在の状態、目指すゴール 現在レベル2の動画が完了し、投資ジャンルで発信をして高額アフィしていきたい。 運用３か月目に100万円を目指していきたいと思っています。  既存のアカウントは2つ A:現在ダイエットの発信をしていますが、その前は副業系とかの発信もしていた https://x.com/mi17je90 B:リサーチ用に作ったもの https://x.com/surch1chan3350?s=21&t=HPBGqxDkUrvRAjkZAflkOQ  ❸自分なりの意見や仮説 投資系の発信を行っていくアカウントは既存のAを使うor買収をして、0ではない状態でスタートしたい。 Aアカウントのフォロワーは副業系、懸賞垢、健康美容系発信してる人が多いが、アクティブな人は多くないと思うので、これから投稿で増やしたフォロワーで高額アフィを行っていく。  Aアカウントの方向性： まっちょ＠ゆるっと資産運用 ・14時間勤務の限界OLがNISAや外貨積み立てでゆるっと資産1000万円 ・時間なくても入れておくだけで資産が増える  Bアカウントではスクール生の方との交流やA垢での実践している様子や実績を載せながら成長していく →Tipsアフィなどを行う  という感じで行っていくことを考えています。  ❹質問内容  質問①A垢は、既存のフォロワーを使う前提でなかったら使えますか？それとも新しいアカウントor買収したほうがいいですか？ 質問②投資系の発信をしていく際にNISA中心の発信でもいいんでしょうか？ 質問③Aのアカウントの方向性についてご意見いただけると嬉しいです。  宜しくお願いいたします。 (編集済)\n2025年10月28日火曜日 22:35","sourceUrl":"","createdAt":"2025-10-28T13:35:10.985Z"},{"id":"scr-1779710258357-suyjpg","title":"[質問部屋] @Yusuke＠講師  @あか@運営  @なまいきくん   お忙しいところすみま...","category":"feedback","content":"@Yusuke＠講師  @あか@運営  @なまいきくん   お忙しいところすみません。 質問させてください。  ❶ 質問のおおまかなテーマ  　・プロフィール・発信方向性のチェック    ❷ 現在の状態・目指すゴール  　・プロフィール文、アイコン作成。  　・発信にむけて準備中。  　・ゴールは見る人、特に40代が「自分もAIを使えるかも」と感じフォロー・共感されるプロフィールにすること。    ❸ 自分なりの意見・仮説  　・名前をホコタテに変更。  　・アイコンも添付のものに変更。  　・プロフィールは 「AIは若い人のもの」そう思ってた40代が、隙間時間と寝る前の30分でChatGPTに挑戦中。 会社ではAIで残業を減らし、自分を守る盾を。副業ではスキルを磨き、未来を切り開く矛を手に入れる。  　・AIを「矛」と「盾」に変えて40代から働き方をアップデートする。守り（時短・安定）と攻め（副業・自由）の両立がテーマ。  　・コンセプトは40代、なんとなく使ってた人が本格的にチャレンジしていく様子を発信。  　・40代の会社でもある程度地位がありやめるつもりはないけどAI使って業務効率化できないかという人とやはり今のままではダメやけどどうすればいいかわからない、でもＡＩわからない人でも40代で始めてもこんなんできるよ、マネタイズできるよとストーリー型で発信。 前者向けを少し織り交ぜつつ、メインは後者を多めにしたいと思っています。    ❹ 質問内容  ・このコンセプトでスタートしてよいでしょうか？ ・プロフィール文は現状のままで十分伝わりますか？  ご指導いただければ幸いです。 よろしくお願い致します。","sourceUrl":"","createdAt":"2025-11-01T10:21:14.984Z"},{"id":"scr-1779710258358-yfsccz","title":"[質問部屋] @Yusuke＠講師 @あか@運営  @なまいきくん   お忙しいところすみませ...","category":"feedback","content":"@Yusuke＠講師 @あか@運営  @なまいきくん   お忙しいところすみません。 再度、質問させてください。  ❶ 質問のおおまかなテーマ  　・プロフィール・発信方向性のチェック    ❷ 現在の状態・目指すゴール  　・プロフィール文、アイコン作成。  　・発信にむけて準備中。  　・合格点の発信アカウントの完成がゴール。 　   ❸ 自分なりの意見・仮説 　◦AI活用副業で月5万円の安定収入を得れることを、 　　・AI画像生成に興味がある30〜40代の「会社に依存せず働きたい人」 　　・実績やレベル感は「X発信未経験・趣味レベル・情報収集止まり・副業に時間を割けない」 　　という人にむけてもの。  　・コンセプトは、 　　①　AI初心者が、AI画像生成を学び、月5万円の安定収入を得るための実践型発信。 　　②　再現性のあるAI副業の始め方と、発信×販売で0→1を達成するプロセスを体系的に共有。 　　自身も初心者の中、忙しくも隙間時間を使ってできる様子を見せながら成長し自分もできるやんの人を増やし巻き込みたいです。 　 ❹ 質問内容  ・このコンセプトでスタートしてよいでしょうか？ ・プロフィール文は現状のままで十分伝わりますか？  アカウントは以下です。 https://00m.in/sNazJ  ご指導いただければ幸いです。 よろしくお願い致します。 (編集済)\n2025年11月4日火曜日 11:06","sourceUrl":"","createdAt":"2025-11-04T02:06:47.829Z"},{"id":"scr-1779710258359-tqicti","title":"[質問部屋] お世話になっております。 コンセプト設計について質問があります。  ❶質問のおお...","category":"feedback","content":"お世話になっております。 コンセプト設計について質問があります。  ❶質問のおおまかなテーマ コンセプト設計とアフィ商材の組み合わせが正しい確認かしたい  ❷現在の状態、目指すゴール 現在の状態：コンセプト設計をしてみたが、この設計で進めていいのか不安がある。 目指すゴール：コンセプト設計が問題ないことを確認して、進めていけるようにしたい  ❸自分なりの意見や仮説 Lv.2講義QAに「株式投資の発信をしつつ、裏垢や占いの商材を売るのは可能」とありました。 発信テーマと違う商材でも売るのは可能ということなので、自分の場合は「株式投資の発信をしつつ、AI商材を売る」というコンセプトで進めてきたいと考えています。 自分としては問題ないコンセプトかと思っています。  ❹質問内容 「株式投資の発信をしつつ、AI商材を売る」というコンセプトで進めてきたいと考えています。 株式投資に興味があるが資金力がない人に対して、AI副業して入金力を高めようという発信をする予定です。発信は投資系ですが、アフィしたい商材はAIです。 このコンセプトで進めて問題ないか確認したいです。  よろしくお願いいたします。","sourceUrl":"","createdAt":"2025-11-04T04:15:05.535Z"},{"id":"scr-1779710258359-veflnz","title":"[質問部屋] @なまいきくん  @Yusuke＠講師   @あか@運営   お疲れ様です！ 質...","category":"feedback","content":"@なまいきくん  @Yusuke＠講師   @あか@運営   お疲れ様です！ 質問させてください。  ❶質問のおおまかなテーマ 昔のアカウントが見つかったため、継続利用するべきか確認したい  ❷現在の状態、目指すゴール 現在の状態：2年前と3年前の2つのアカウントが見つかりました。１ポストもせず放置されていたものです。 目指すゴール：昔のアカウントのほうがアルゴリズム的に有利であれば継続利用したいので、その可否を伺いたい  ❸自分なりの意見や仮説 新規でアカウントを作成するより、昔のアカウントのほうが伸びやすいという話を聞いたため、アルゴリズム的に有利であれば継続利用するべきと思う。  ❹質問内容 昔のアカウントが見つかり、新規で作成するよりも伸びやすいという話を聞きました。 1ポストもせず放置されていたもので、このアカウントのほうが伸びやすいのであれば、継続利用するべきと思いますが、デメリットもあるのでしょうか？ Xについて知見がないため、この放置アカウントで運用するべきか新規で作成するべきかご意見を伺いたいです。  よろしくお願いいたします。","sourceUrl":"","createdAt":"2025-11-05T04:46:24.811Z"},{"id":"scr-1779710258360-tljufv","title":"[質問部屋] @なまいきくん  @Yusuke＠講師  @あか@運営   お疲れ様です！ 質問...","category":"feedback","content":"@なまいきくん  @Yusuke＠講師  @あか@運営   お疲れ様です！ 質問させてください。  ❶質問のおおまかなテーマ アバター、ヘッダー、プロフ設定をしたので、問題ないか講師の意見を伺いたい  ❷現在の状態、目指すゴール 現在の状態：プロフ設定しました。 目指すゴール：目立つプロフになっているか確認したい  ❸自分なりの意見や仮説 アバターは埋もれないよう目立つ色にしました。モブ感もでていないと思います。 ヘッダーはテキストにして注意を引ける文言だと思っています。  ❹質問内容 目立ち埋もれないアバターになっているか？注意を引けるヘッダーになっているか？プロフ文も注意を引けるものになっているか？ この3点について、講師の意見を伺いたいです。  よろしくお願いいたします。","sourceUrl":"","createdAt":"2025-11-05T10:29:14.041Z"},{"id":"scr-1779710258361-fflwdi","title":"[質問部屋] ありがとうございます！ プロフ画像を変更しましたので、もう一度ご意見いただきたい...","category":"feedback","content":"ありがとうございます！ プロフ画像を変更しましたので、もう一度ご意見いただきたいです！ よろしくお願いいたします！ https://x.com/hanayama6107","sourceUrl":"","createdAt":"2025-11-05T11:26:32.763Z"},{"id":"scr-1779710258361-kxtzhd","title":"[質問部屋] すみません！もしかしたら矛盾さんのアカウントと混同されておりませんでしょうか？汗...","category":"feedback","content":"すみません！もしかしたら矛盾さんのアカウントと混同されておりませんでしょうか？汗 プロフ設定して質問した際、アカウントリンク張っておりませんでした！ 改めてヘッダーやプロフ文が問題ないかご意見いただけますでしょうか？すみません！","sourceUrl":"","createdAt":"2025-11-05T11:58:34.654Z"},{"id":"scr-1779710258362-lytbph","title":"[質問部屋] @Yusuke＠講師  @あか@運営  @なまいきくん   お疲れ様です！質問さ...","category":"feedback","content":"@Yusuke＠講師  @あか@運営  @なまいきくん   お疲れ様です！質問させてください！  ❶質問のおおまかなテーマ DMを送ってくるユーザーとどの程度絡んだらいいか  ❷現在の状態、目指すゴール 現在の状態：フォローするとDMを送ってきてライン誘導するユーザーがいる 目指すゴール：どう対応したらいいか分からず、対応方法を確認し適切に対処したい  ❸自分なりの意見や仮説 フォローするだけでDMを送ってくるユーザーがいるが、露骨に無視すると通報されたりする可能性を考え、適切に対応したほうがいいと思うが、ラインまで登録するつもりがない。 ある程度会話した上で、ラインは断るのがいいと考えている。  ❹質問内容 DMを送ってきて、公式ラインに誘導するユーザーへの対応方法を確認したい。 今後のことを考えて、積極的に絡んだほうがいいのか？ある程度対応してライン誘導は断る姿勢がいいのか、講師の意見を伺いたい。  よろしくお願いいたします。 (編集済)\n2025年11月7日金曜日 0:33","sourceUrl":"","createdAt":"2025-11-06T15:33:25.806Z"},{"id":"scr-1779710258363-uaphzc","title":"[質問部屋] @なまいきくん  @Yusuke＠講師  @あか@運営  いつもお世話になってお...","category":"feedback","content":"@なまいきくん  @Yusuke＠講師  @あか@運営  いつもお世話になっております！ ご相談させてください  ❶ 質問のおおまかなテーマ 　アイコンとプロフィールの添削  https://x.com/kurasandayooo?s=21  ❷ 現在の状態・目指すゴール 　未経験のAIジャンルの運用に決定。アイコンとプロフィールを整えたい  ❸自分なりの意見や仮説 　・アイコンは、マス受けする為に、万人に好かれるような優しいゆるキャラに設定。 　 ・プロフィールは、実績もないため現状のみを記入。 フレーズは、フォロワーが私と同じだ！もしくは私より下だと共感を持たれるようにした。  ❹ 質問内容 アイコン、ヘッダー、プロフィールの統一は保たれているでしょうか？ モブ感はありますでしょうか？  プロフィールがよくあるパターンな事が気になってます。 (編集済)\n2025年11月7日金曜日 2:30","sourceUrl":"","createdAt":"2025-11-06T17:30:15.482Z"},{"id":"scr-1779710258363-oveqcb","title":"[質問部屋] @なまいきくん  @Yusuke＠講師  @あか@運営   お疲れ様です！質問さ...","category":"feedback","content":"@なまいきくん  @Yusuke＠講師  @あか@運営   お疲れ様です！質問させてください！  ❶質問のおおまかなテーマ 自分のアカウントの属性認知について  ❷現在の状態、目指すゴール 現在の状態：投資・AI・副業の3つで発信していてカテゴリ3つは範囲を広げすぎているのではないかと思う 目指すゴール：属性認知の観点からカテゴリを絞ったほうがいいのか、このまま続けていいのか講師の意見を伺いたい  ❸自分なりの意見や仮説 投資・AI・副業で実際に発信を始めてみたが、属性認知のことを考えるとカテゴリを広げすぎているのではないかと感じた。ポストのネタ探しや集客できる層の広さを考え、カテゴリを3つにしたが、広すぎると属性認知が上手くいかずインプレッション数が上がりにくいのではないという心配もある。  ❹質問内容 属性認知の観点から、投資・AI・副業の3つのカテゴリで発信を続けていいのか、カテゴリを絞ったほうがいいのか講師の意見を伺いたい。  アカウント https://x.com/hanayama6107  よろしくお願いいたします。","sourceUrl":"", ・平均imp：1000未満  ❸自分なりの意見や仮説 ・自分が現在恋愛系（美女を彼女化）の発信をしており親和性は問題ないと仮説 ・フォロワーも多く、平均800〜1000impあるので、これから伸ばしていけば悪くない数値 ・自分自身の問題点だが、「彼女作り」の発信がなかなか刺さらない。。本当は即S◯X系の発信をしたい→しかしプレイヤー感出せない この問題について、ナンパ・アプリ攻略中の知人の様子をあたかも自分が動いているかのように発信すればプレイヤー感は出せる（知人にもその旨を話している/スクールのノウハウ等の流出はもちろんしない）  ❹質問内容 ・ナンパ系発信のアカウントを買収し、アプリ攻略の発信をしても問題ないか ・エアプのようになるが、プレイヤーの知人を使って自分がその知人になりきりアカウントを発信するのは問題ないか（≒エアプ）  お忙しいところ恐れ入りますがご確認の程よろしくお願いいたします","sourceUrl":"","createdAt":"2025-11-13T14:49:45.904Z"},{"id":"scr-1779710258366-yjwgbd","title":"[質問部屋] @なまいきくん  @Yusuke＠講師  @あか@運営   お疲れ様です！ アカ...","category":"feedback","content":"@なまいきくん  @Yusuke＠講師  @あか@運営   お疲れ様です！ アカウント添削とコンセプト設計の質問になります！  ❶ 質問のおおまかなテーマ  　・アカウントと発信方向性のチェック   ❷ 現在の状態・目指すゴール  　現在の状態：アカウント作成、コンセプト（AIジャンル）決定  　目指すゴール：アカウントとコンセプトの確定   ❸ 自分なりの意見・仮説  　・アイコンはクセが強いキャラと視認性を意識。ヘッダーは実績が何もないので一旦アイコンに合いそうなもので選びました。  　・プロフィールは実績がないので自分の立ち位置と今やってることだけを記載してます。  　・コンセプトは20代後半〜30代のAI、脱会社に興味がある人に向けて、AIスキルがなくても、マネタイズまでの道筋が見えなくても、３ヶ月で収益化の仕組みを作る方法を発信。 実績はないのでストーリー型で発信する予定です。   ❹ 質問内容  ・アカウントで修正した方がいい箇所はありますでしょうか？  ・このコンセプトでスタートしてよいでしょうか？  ⚫︎アカウント https://x.com/katsuo_ai_gg?s=21&t=owVyofzyxe5EwqdocuWDgA   よろしくお願いいたします！","sourceUrl":"","createdAt":"2025-11-17T13:35:18.306Z"},{"id":"scr-1779710258366-nzrirb","title":"[質問部屋] あと、AIスキルがなくても、マネタイズの道筋が見えてなくても、3ヶ月で収益化の仕...","category":"feedback","content":"あと、AIスキルがなくても、マネタイズの道筋が見えてなくても、3ヶ月で収益化の仕組みを作る方法を発信していくとのことですが、最終的に売りたいのはAI系ではないのでしょうか？\n\nその場合、AIスキル不要を押し出すのは、Xマネタイズのスクールを売ろうとして、X不要！を謳うようなものなので、ちょっと微妙かなと思いますね、、","sourceUrl":"","createdAt":"2025-11-17T13:39:12.472Z"},{"id":"scr-1779710258367-easwne","title":"[質問部屋] 売る売らないに関わらず、発信していく上で、\n\n何系のAIに触れるのか？AIをどう...","category":"feedback","content":"売る売らないに関わらず、発信していく上で、\n\n何系のAIに触れるのか？AIをどう活用するのか？あるいは、特定のテーマは決めないけどとにかくAI関連の最新情報を出していくのか？などの方向性がないと、発信軸がないのでかなり発信ムズいと思いますね！\n\nAIと広く言っても、画像生成や、動画編集、GPT:作成、AIライティングなどテーマが色々あるわけで、その利用目的を絞らないのは、パソコン攻略していくぜ！(具体的な方法性は特にない)みたいな感じなので、\n\n発信していく上で、ある程度AIをどう使うのか？は決めたいです。\n\nそして、今そのAI系の切り口を思いついておらず、「なんとなくAI調べときゃ稼げるっしょ！」というAI素人感を出しつつ、それすらもストーリーに組み込んでいくという形なら、漠然とAI攻略していく！みたいな粒度でもいいのかなとは思います。\n\nただ、どのみち、どんなシーンで、あるいはどんな使用用途で、あるいはどんな目的でAIを活用していくかは検討はつけておいた方が発信はしやすいかなと。\n\nもしこの辺が定まってないなら参考までに他のスクール生のアカウント見たり、AIジャンル部屋で皆がどんなテーマのAI扱ってるか聞いてみたりするといいかなと思います！","sourceUrl":"","createdAt":"2025-11-17T20:32:29.185Z"},{"id":"scr-1779710258368-ypxjjv","title":"[質問部屋] 追記:AI攻略！が特に発信軸になってないのが分からなければ、投資に置き換えて考え...","category":"feedback","content":"追記:AI攻略！が特に発信軸になってないのが分からなければ、投資に置き換えて考えるとちょっとは分かりやすいかも？\n\n投資と言っても、株式投資もあれば、FX、仮想通貨、不動産もあるわけで、(もっと言うと株の中でもインデックスや個別株など分けれる)、\n\n投資攻略！と言うのは、流石に幅が広すぎて、発信軸が見えてこないよね\n\nそれじゃあ投資の中でもどの投資に取り組んでいくの？みたいなことを、AI版で聞いてるって感じですね！","sourceUrl":"","createdAt":"2025-11-17T20:47:35.691Z"},{"id":"scr-1779710258368-zjvyjn","title":"[質問部屋] @なまいきくん  @Yusuke＠講師  @あか@運営   お世話になっておりま...","category":"feedback","content":"@なまいきくん  @Yusuke＠講師  @あか@運営   お世話になっております 現在副業占いジャンルで発信しているのですが ジャンル認知のためのリプライ等絡みについて 質問があります  現在副業占いのジャンル認知のために 同じ占い系の方のみに積極的に交流を行っているのですが 他の副業系ジャンル（物販やAI系）の方とも積極的に交流をした方が いいのでしょうか？  考えとしては 発信内容が占いに興味が特にない副業をやりたい層を意識しています。 なのですでに占いをやっている層だけではなくて 大きく副業系の方とも絡んで副業アカウントという属性認知を 取った方がいいのかな？と考えました  よろしくお願いします (編集済)\n2025年11月18日火曜日 9:37","sourceUrl":"","createdAt":"2025-11-18T00:37:42.258Z"},{"id":"scr-1779710258369-bswvag","title":"[質問部屋] @なまいきくん   @Yusuke＠講師   @あか@運営    お世話になって...","category":"feedback","content":"@なまいきくん   @Yusuke＠講師   @あか@運営    お世話になっております！運用をスタートしようとしているところで、質問させていただきました！お忙しいかと思いますが、よろしくお願いします  ❶質問のおおまかなテーマ アカウントを0から作るのか、既存でエンゲージメントが死んでいるフォロワー300人のアカウントを運用するのか そのアカウント→https://x.com/nkwh0409  ❷現在の状態、目指すゴール 現在の状態→マインド30daysマインド変革を視聴完了したばかりで、アカウント運用を開始していないです。  サラリーマンがAIを使って仕事の業務効率化につながるAI術を超具体で発信すると考えております  ゴール→AIのスクールへの面談   ❸自分なりの意見や仮説 僕はこの❷のアカウントを使用してもいいと思っています。　理由はエンゲージメントがないとはいえ、フォロワー300人いるので、ある程度のインプは出るのではないのか？と考えております。  ❹質問内容 僕の場合は、②が良いのでしょうか？ ①新しいアカウントを作り始める ②一旦このアカウントで走り出したほうがいい","sourceUrl":"","createdAt":"2025-11-19T16:17:31.393Z"},{"id":"scr-1779710258370-hdyinq","title":"[質問部屋] NISAってただの制度なわけで、NISAで別に米国株でも投資信託でも扱えると思う...","category":"feedback","content":"NISAってただの制度なわけで、NISAで別に米国株でも投資信託でも扱えると思うので、NISAから米国株や投資信託とかに変えるってのがよく分からないです\n\nここ僕が理解出来ず、質問回答が難しくなってるので、再度質問内容を明確にしてもらったら答えやすいです！\n\nプロフィールに関しては、コンセプト決まった後に、決められるものなので、一旦上記回答だけお願いします！","sourceUrl":"","createdAt":"2025-11-21T11:14:30.519Z"},{"id":"scr-1779710258370-rfzytx","title":"[質問部屋] あと、仮想通貨のコンセプトでOKか？みたいなのも、かなり質問が抽象的なので、\n\n...","category":"feedback","content":"あと、仮想通貨のコンセプトでOKか？みたいなのも、かなり質問が抽象的なので、\n\nかなさんの経歴、背景、このコンセプトにする理由、そして、何観点でOKか聞いてるのか、この辺を明示して欲しいです！\n\n例えば、かなさんが仮想通貨ごりごりやってて、もう仮想通貨のプロレベルで、競合に対して実績だけでこりごりにアドバンテージ取りまくれる状況だから、仮想通貨押しのコンセプトでいく！ってなってたら、当然それでいいと思う！ってなりますが、\n\n仮に全くの未経験者で、全く触れたことすらない、これから始める状況みたいな感じだったら、別に仮想通貨をわざわざ攻める必要はないんじゃないかな？と回答が変わるといった感じで\n\nかなさんはどんな経歴があって、どんな背景でこのコンセプトになってるのか、ここが見えないと正直適当な回答しか出来ないので、こちら記載の上再質問お願いします！","sourceUrl":"","createdAt":"2025-11-21T11:32:35.027Z"},{"id":"scr-1779710258371-yydivg","title":"[質問部屋] 追記:別に実績ゴリゴリないと発信しちゃいけないという意味ではなく、かなさんの背景...","category":"feedback","content":"追記:別に実績ゴリゴリないと発信しちゃいけないという意味ではなく、かなさんの背景や経歴によって、コンセプトの善し悪しも変わるので、そこを明示して欲しいということですね！","sourceUrl":"","createdAt":"2025-11-21T11:35:49.802Z"},{"id":"scr-1779710258371-vpqacz","title":"[質問部屋] 背景は分かりました！その上で、そのコンセプトにする理由、何観点でそのコンセプトに...","category":"feedback","content":"背景は分かりました！その上で、そのコンセプトにする理由、何観点でそのコンセプトについて評価して欲しいのか送って欲しいです！\n\n今の情報だと、集客したい！そして、仮想通貨が好きだから仮想通貨にする。これでOK？と聞かれてる感じなので！","sourceUrl":"","createdAt":"2025-11-21T20:37:36.772Z"},{"id":"scr-1779710258371-qunlaj","title":"[質問部屋] もしかしたらこの理解がないから、質問も曖昧になってるかもしれないので一つだけ補足...","category":"feedback","content":"もしかしたらこの理解がないから、質問も曖昧になってるかもしれないので一つだけ補足すると、\n\n集客するというのは、読者の興味を惹きつけて、この人の発信もっと追いたい！となる人を増やしていく作業で、\n\nコンセプト設計というのは、その発信の軸を決める工程です。\n\nそして、当然読者にウケる発信軸を作っていくのに1番必要なのは読者目線で\n\nコンセプトを決める際はかなさんの都合ではなく、読者視点で、\n\nどういうコンセプトを設定すれば見る人をワクワクさせられるか？\n\n勉強になるなぁと思わせられるか？\n\nもっと学びたい！と思わせられるか？(講義で言うところのこの山を登りたい！と思わせられるか)\n\nこれが1番重要になります。\n\n今はその読者に選ばれる理由とか、読者視線での強みみたいなのがなく、\n\nほぼ全てかなさん都合でコンセプトが考えられてるので、もうちょっと読者目線を取り入れると質問の質も上がると思いますし、僕も回答しやすいです。\n\n繰り返しにはなりますが、かなさんが仮想通貨好き！だから仮想通貨発信する！これでいい？だけやと、何も返答が出来ないので、以上踏まえた上で再質問お願いします！\n\nまた僕の言ってる意味が理解出来なければ気軽に聞いてください！","sourceUrl":"","createdAt":"2025-11-21T21:07:08.257Z"},{"id":"scr-1779710258372-ekwtcp","title":"[質問部屋] @なまいきくん@Yusuke＠講師@あか@運営  お世話になります。 ❶プロフィ...","category":"feedback","content":"@なまいきくん@Yusuke＠講師@あか@運営  お世話になります。 ❶プロフィールとアカウントコンセプトに関する質問です。  ❷AI系の情報発信とAI×ライティング副業を軸に、高単価アフィリエイトを狙った運用をしていこうと考えています。 ターゲットは、副業未経験・発信未経験の社会人1〜5年目で、最短で0→1を達成したい層です。 最終的には、AI×発信で月5〜10万円を達成し、毎月1〜3万円を安定化できる状態に連れていくことをゴールにしています。  ▼アカウント https://x.com/kakashi__AI  ❸仮説として、 AI市場リサーチやライティング時短術、最短収益化の型を提示しながら、自分の成長ストーリーを発信することで、  ・AIが難しそうで動けない初心者が「自分でもできそう」と感じる ・学び→発信→収益化の流れが再現しやすくなる ・副業が習慣化し成果が出やすくなる  という流れが作れると考えています。 情報が多すぎて動けない初心者にとって、ロードマップと実践例を見せることが刺さると仮説立てています。  ❹実績として、AI×ライティングで月10万円達成、YouTube台本で30万〜95万回再生の実績があります。 この場合、  ①最初から実績を前面に出して信頼構築する運用 ②「AIを学びながら成長していくストーリー型」の運用  どちらの発信スタイルでいくべきでしょうか？ 添削とご意見をいただきたいです。よろしくお願いいたします 。","sourceUrl":"","createdAt":"2025-11-22T13:05:42.235Z"},{"id":"scr-1779710258372-qhqkjm","title":"[質問部屋] @なまいきくん  @Yusuke＠講師  @あか@運営   お世話になります。 ...","category":"feedback","content":"@なまいきくん  @Yusuke＠講師  @あか@運営   お世話になります。 質問失礼致します！  ❶質問のおおまかなテーマ アイコンとプロフィール添削  ❷現在の状態、目指すゴール  現在の状態：女攻略ジャンルに 目指すゴール: 最適なプロフィール設計  ❸自分なりの意見や仮説 ・アイコンはブルーロックのいさぎをイメージして作成しています。成り上がり系みたいなイメージです。 ・プロフは実績をかけるだけ書いてます。 ・コンセプトは30代で非モテの男性向けに効率よく女遊びしたい層向けに発信しています。  ❹質問内容 ・この方向性でいいか？それとももっとます向けにネトナンという括りなどにして広げたほうがいいか？ ・プロフィール設計の改善策を教えていただきたいです ・もしこのアカウントじゃ成果でないということであればアカウント買収します！  よろしくお願いいたします (編集済)\n2025年11月23日日曜日 21:02","sourceUrl":"","createdAt":"2025-11-23T12:02:05.735Z"},{"id":"scr-1779710258373-lzkvdh","title":"[質問部屋] 裏アカを実践していくアカウントってことで合ってますか？\n\nまずパッと見プロフが裏...","category":"feedback","content":"裏アカを実践していくアカウントってことで合ってますか？\n\nまずパッと見プロフが裏アカ感ないですね！\n\nあと、裏アカで月1000はほぼ不可能なのと、(少なくとも僕は1人も見たことない)\n\n完全ゼロの弱者男性が月1000目指してるみたいなのは、\n\n別に内に秘めておくのはいいかなと思いますが、\n\nそれを叶えられそうな片鱗・センスの良さ見せれないと\n\n全くリアリティーなくて、ワクワクせず逆に追いたくなくなるので、\n\nそこまで変に期待値上げない方がいいかなと思いますね！","sourceUrl":"","createdAt":"2025-11-23T16:32:04.825Z"},{"id":"scr-1779710258373-ikehvi","title":"[質問部屋] 追記\n\nおそらくこのアカウントで行う高単価アフィ含め月1000万円目指していくっ...","category":"feedback","content":"追記\n\nおそらくこのアカウントで行う高単価アフィ含め月1000万円目指していくってことやと思うんですが、\n\nこのアカウントは裏アカで稼ぎたい人に向けたアカウントやと思うので、その目標値はズレすぎてるって感じですね！\n\nもし、言ってる意味が分かりにくければ、物販アカやってて、そのプロフに月1000万いくぞ！ってぽっと出のセンスのかけらもなさそうな人が言ってるのを想像すればいいかなと。\n\nこれもコンセプトが自分目線になってることが根本原因で、その指摘についてもつい最近質疑応答の欄で記載したので、ちょっと遡ってもらって見て見るといいかなと思います。","sourceUrl":"","createdAt":"2025-11-23T16:37:05.009Z"},{"id":"scr-1779710258374-cnxcuc","title":"[質問部屋] 回答ありがとうございます！  ・裏アカを実践していくアカウントってことで合ってま...","category":"feedback","content":"回答ありがとうございます！  ・裏アカを実践していくアカウントってことで合ってますか？ ➡︎合っています  目標値がズレすぎているという指摘をいただいて、コンセプトが自分目線になっているという根本原因に気づけました。再度練り直して見ます  あわせて、いただいた回答に関して質問させてください  ・パッと見プロフが裏垢感ない ➡︎裏垢、裏〇などの文言がないのでジャンルが分かりにくいということでしょうか？それともプロフの構成自体が裏垢ジャンルの発信者ぽさが無いということでしょうか？  ・最近質疑応答の欄で記載した ➡︎LV2～lv11の講義ごとにある講義QAのどこかに記載されているという認識で誤解ないでしょうか？  ご回答よろしくお願いします (編集済)\n2025年11月24日月曜日 8:05","sourceUrl":"","createdAt":"2025-11-23T23:05:41.090Z"},{"id":"scr-1779710258374-nehnqe","title":"[質問部屋] 投稿内容で質問です。よろしくお願いします。  インスタの発信者さんとやり取りして...","category":"feedback","content":"投稿内容で質問です。よろしくお願いします。  インスタの発信者さんとやり取りして入手した情報で、 インスタのメッセージ機能(DM)でURLを貼ったら7日間メッセージを送信できないという制限がかかる人がちょこちょこ出てきてるそうです。この方は自分の投稿を2人に送っただけで制限かかったとのこと。また、私のいる占い講座の講座生さんからも数名制限かかったとの情報入ってきてまして、 これらを元に、Xの投稿ネタにしたら良いかなと思った反面、自分に起こったことじゃないし、もし混乱招くような発言になったら良くないのかな、と迷ってます。(不安になる投稿？)  「DMで導線組んでるAI占い売れっ子さん注意」 みたいな投稿しようと思いました。どうでしょうか？  また、今後もこのようなネタは どう考えて判断したら良いか教えてください","sourceUrl":"","createdAt":"2025-11-24T12:40:17.818Z"},{"id":"scr-1779710258375-oqegdc","title":"[質問部屋] その辺は最終的には個人の感覚の問題になってくるので、ほしのさんがやりたくないと思...","category":"feedback","content":"その辺は最終的には個人の感覚の問題になってくるので、ほしのさんがやりたくないと思うならやらなくてもいいかなとは思います！\n\n僕的な意見としては、それ知らずに制限食らっちゃう方が、読者のマイナスになるので、多少強い言葉を使ったとしても周知すべきかなと思いますが！","sourceUrl":"","createdAt":"2025-11-24T13:36:11.642Z"},{"id":"scr-1779710258376-zbonoc","title":"[質問部屋] @なまいきくん  @Yusuke＠講師  @あか@運営   お世話になります。 ...","category":"feedback","content":"@なまいきくん  @Yusuke＠講師  @あか@運営   お世話になります。 質問失礼致します！  ❶質問のおおまかなテーマ アイコンとプロフィール添削 https://x.com/panda_kurosir  ❷現在の状態、目指すゴール 現在の状態：裏垢マネタイズジャンルに決定 目指すゴール: プレイヤー感のある最適なプロフィール設計  ❸自分なりの意見や仮説 ・アイコンはお菓子のキャラクターから拾ってきました。誰しも1度はヤンヤンつけぼー食べたことがあると思っているので、覚えやすいかなと思い選びました。 ・ヘッダーは何をやっているかをわかるようにシンプルに「裏垢」のみを記載しました。パンダなので白黒で。 ・プロフは現在の状態と何をしていくのかをシンプルに記載。 ・コンセプトは Who：ビジネスを始めたい初心者 What：再現性高く、手離れ良く、月100万稼ぐ How：⑤月100万狙える 　　　④ローンチを勉強する 　　　③商品作成を覚える 　　　②X集客を身につける 　　　①アカウント作成を身につける と考えています。  ❹質問内容 ・このコンセプトでいいのか？ ・プロフには「まずは月10万目標」など具体的かつ、初心者がまず通る金額（高すぎない）を明記した方がよかったりしますか？ ・プレイヤー感あるのか？ ・一旦昨日のポスト作成会で作成した投稿をポストしたが、ポスト内容についても添削いただきたいです！  よろしくお願いいたします (編集済)\n2025年11月27日木曜日 16:38","sourceUrl":"","createdAt":"2025-11-27T07:38:02.483Z"},{"id":"scr-1779710258376-zibvwn","title":"[質問部屋] @なまいきくん  @Yusuke＠講師  @あか@運営   お世話になっておりま...","category":"feedback","content":"@なまいきくん  @Yusuke＠講師  @あか@運営   お世話になっております。 質問お願い致します。  ❶アカウントについて発信の方向性についての質問です。  ❷現在の状態:高単価アフィのジャンル・発信内容に躓いています。  目指すゴール:発信コンセプトを決めて、アカウントを育てたい  ❸ 激辛くんのアフィの教科書を元にそこにBrainアフィを置いてアフィ実況をして行こうと思っていました。 が、アフィリンクは置かない方がいいということで、方向を変えようと思いました。  ターゲットは、 何かしらの副業を始めたいが何をしたらいいのかわからない。 みんな実績が凄すぎて、少し不信感がある。 もっと実際にやっているところを見たいと思っている。 仕事でAIを触ることがないAI初心者。 時間がない、体力もない40代   前にやっていた恋愛アカで少しnoteが売れた経験があるので、恋愛コンテンツを元に恋愛アカを始めたストーリー運用。 ただ、高単価アフィに女性恋愛ジャンルがないので、AI×noteはどうかと考えています。 (AIジャンル)  恋愛アカの運用をいれるのは、 アカウントを運用している様子が見れるので信頼されやすい。 初心者が副業始める時に、実績がないと稼ぐ系には入りづらいので実績作り。 私自身占いアカの経験もありますが恋愛の方が簡単だった。 鑑定書は作るのが大変だけど、noteなら置いておくだけ。 ほとんどの人が恋愛経験あるので入りやすい。 のではと考えました。  ❹このコンセプトの方向性がずれていないか、アドバイス頂きたいです。  よろしくお願いします。 (編集済)\n2025年11月27日木曜日 18:00","sourceUrl":"","createdAt":"2025-11-27T09:00:51.029Z"},{"id":"scr-1779710258377-cnsryy","title":"[質問部屋] お返事ありがとうございます！ 実績は金額は正直全然ありませんが、運用開始5日でフ...","category":"feedback","content":"お返事ありがとうございます！ 実績は金額は正直全然ありませんが、運用開始5日でフォロワー10人の時に980円の復縁noteが10冊ほど売れました。 スピ寄りにしたくて今試行錯誤しているところですが、収益を伸ばしていく予定です。","sourceUrl":"","createdAt":"2025-11-27T10:59:02.524Z"},{"id":"scr-1779710258377-ydanzc","title":"[質問部屋] @なまいきくん  @Yusuke＠講師  @あか@運営   いつもお世話なります...","category":"feedback","content":"@なまいきくん  @Yusuke＠講師  @あか@運営   いつもお世話なります。  現状について質問です。  現在、Lv4まで完了しております。 理解は進んでいるのですが、まだまだポスト作成に時間を要する段階にあり、Xポスト作成に頼って投稿している次第です。 おかげで1日3〜5ポストはできているのですが、当分はこのように続けていても大丈夫でしょうか？  以上、ご教授の程、よろしくお願いいたします。 (編集済)\n2025年11月28日金曜日 12:47","sourceUrl":"","createdAt":"2025-11-28T03:47:54.372Z"},{"id":"scr-1779710258378-jllxzi","title":"[質問部屋] @なまいきくん  @Yusuke＠講師  @あか@運営   お世話になっておりま...","category":"feedback","content":"@なまいきくん  @Yusuke＠講師  @あか@運営   お世話になっております！ 質問お願いいたします  ❶質問のおおまかなテーマ 発信方向性チェックとプロフィール添削 https://x.com/katsuo_ai_gg?s=21&t=owVyofzyxe5EwqdocuWDgA  ❷現在の状態、目指すゴール 現在の状態：コンセプト決定（AI×ライティング） 目指すゴール: アカウントとコンセプトの確定  ❸自分なりの意見や仮説 ・アイコンはクセが強いキャラと視認性を意識。ヘッダーは実績が何もないので一旦アイコンに合いそうなもので選びました。 ・プロフィールは実績がないので自分の立ち位置と今やってることだけを記載してます。 ・コンセプトは Who：文章が書ければ稼げると分かっているのに、文章が書けずに毎回詰んでしまう20〜30代の副業初心者 What：文章作成が苦手な初心者がAIライティングで発信できる人になる 　　　発信できるようになったら、副業で収益化できるようにする（高単価アフィにつなげる） 　　　月10万稼げる仕組みを持つ How：①書けないを解決する 　　　②発信できる人にする 　　　③Xで集客できるようにする 　　　④note、プロンプト、GPTsをリリースして収益を作る 　　　⑤仕組み化 で考えています。  ❹質問内容 ・アカウントで修正した方がいい箇所はありますでしょうか？ ・このコンセプトでスタートしてよいでしょうか？  よろしくお願いいたします！ (編集済)\n2025年11月29日土曜日 4:06","sourceUrl":"","createdAt":"2025-11-28T19:06:37.821Z"},{"id":"scr-1779710258379-dmfqdy","title":"[質問部屋] @Yusuke＠講師  @なまいきくん  @あか@運営  いつもお世話になってお...","category":"feedback","content":"@Yusuke＠講師  @なまいきくん  @あか@運営  いつもお世話になっております！  ❶質問のおおまかなテーマ ポストのターゲットについて  ❷現在の状態、目指すゴール 基本的にほぼ全てのポストでターゲットが恋愛初心者になっている  ❸自分なりの意見や仮説 以下などでポストごとにターゲットを分ける ①恋愛熟練度：初心者（童貞）、中級者（5〜50即）、上級者（100即〜） ②スペック：エリサラ、ニート、フリーランス、会社員 ③チャネル：ナンパ、アプリ、裏垢、SNS  ポスト例） ・①即数30以下は泥を啜れ ・②ニートは逆に東カレやるべき ・③いまだにペアーズやってるやつはオワコン  ❹質問内容 教材を見返していると、画像のようにターゲットを分散させた方がいいと記載がありましたが、恋愛だと主婦や投資の方に向けたポストは出来ず...。  ターゲットをどのように絞れば良いか、❸に自分なりのセグメント方法を記載していますので問題ないか、またはもっと良いやり方があればご教示いただけますと幸いです。","sourceUrl":"","createdAt":"2025-11-29T05:42:28.037Z"},{"id":"scr-1779710258379-qvpzzy","title":"[質問部屋] ライティング自体が、かなりコンセプト弱い(伸ばすのマジで難しい)ので、よっぽどラ...","category":"feedback","content":"ライティング自体が、かなりコンセプト弱い(伸ばすのマジで難しい)ので、よっぽどライティングでの実績がある、元々ブログで稼いでたとかない限り基本的に避けた方が無難ですね！\n\n多分僕でも伸ばせないかなと思います","sourceUrl":"","createdAt":"2025-11-29T08:07:07.568Z"},{"id":"scr-1779710258380-hucayi","title":"[質問部屋] ありがとうございます！ ライティングではなく、まだnoteなどに絞った方がコンセ...","category":"feedback","content":"ありがとうございます！ ライティングではなく、まだnoteなどに絞った方がコンセプトとして強いという認識であってますでしょうか？ (編集済)\n2025年11月29日土曜日 17:29","sourceUrl":"","createdAt":"2025-11-29T08:29:39.321Z"},{"id":"scr-1779710258381-dtexzu","title":"[質問部屋] 特に問題ないです！というより、これから裏アカチャレンジしていくっていうプロセスエ...","category":"feedback","content":"特に問題ないです！というより、これから裏アカチャレンジしていくっていうプロセスエコノミー型の運用になると思うので、逆に現時点で決めれることはほぼないですね！なので、プロフとかを悩みすぎず、裏アカやるなら実際にゴリゴリ実践していってもらうのがいいかなと！","sourceUrl":"","createdAt":"2025-11-30T05:01:58.127Z"},{"id":"scr-1779710258381-jivyhk","title":"[質問部屋] まず前提としてhowの部分がどうでもいいと言うのは、本当に適当でいいという意味じ...","category":"feedback","content":"まず前提としてhowの部分がどうでもいいと言うのは、本当に適当でいいという意味じゃなくて、\n\n別に読者は手法を求めてるわけじゃなくて結果を求めてて（恋愛なら例えば美女を抱けるようになるという結果）それを成し遂げられるhowを探してるので、手段が先行することはない、howの部分は求める”結果が成し遂げられると分からせられるhowなら”なんでもいいという意味です。\n\n金稼ぎの場合だとわかりやすいと思うのでこちらを例に出すと、読者は金を稼ぐという結果を求めてる、そして究極それが成し遂げられるなら手段はなんでもいいという話しで（もちろんその上でもなるべく楽に結果を得られたり、再現性高かったり、グダが少ないものがいいが）\n\n前提として、”結果を達成できるなら”と言うのはついてます。当然全く稼げないのならそれはそもそも結果を提供できるhowとして成り立ってないです。\n\n一応howはどうでもいいと言うとここの認識がズレてる人もいるかもなので補足しましたが、上記が前提として今回の質問に回答していくと\n\n①コンセプトとして設定するhowがなんでもいいと言う話と発信で出すhowの話がごちゃまぜになってるかなと思いますね。\n\n例えばXマネタイズの発信をしていくとして、コンセプトとして別に高単価アフィだろうが、note販売だろうが、Brain販売だろうが、運用代行だろうが、スクール販売だろうが、なんの発信軸に据えるかは究極何選んでも問題ないが、\n\n発信で全部盛りにするのは違うよねって感じです。\n\nまあ究極の話すると複数を兼ねるのはXマネタイズという軸におさまってたらまあいいっちゃいいんですが、あまりに出すhowがかけ離れてるとそれはむしろ読者に混乱を起こすのでその塩梅は考えた方がいいです。\n\nその意味で言うとインスタ、ナンパ、アプリの3本立てはちょい多すぎかなと思います。しかもオフラインもオンラインもやってるので、どんな活動方針で動いてるのかが読者からして見えにくいですね。\n\n例えば僕だったら基本表に出すhowはXマネタイズかつなるべく最小労力で最大の成果を出す（楽稼ぎ）と言う点で一貫してますが、\n\n表に出すhowに一貫性がないと、発信見てて、ずっとこの人はなにやってるんだろ？なんの人なんだろ？となるので伸びにくくなりますね。\n\nなので手法を絞る以前にhowを選ぶ際の軸を明確にした方がいいと思いますね。\n\nそれこそ女の子を抱けるならもうどんなチャネルだろうが全部活用する！てスタンスでそれを表にも出していくなら究極別に全部盛りでもいいちゃいいので、まずはこのhowの軸を定めましょう\n\nこれさえきまれば自然と発信で出していくhowは決まってくるかなと。\n\n（例えばなるべく楽に美女を抱くって軸ならしんどいイメージが強いストナンは出さない方がいいなとか自然と決まります。）\n\n②これは要は嘘をつくって話だと思うので僕がおおやけの場でそれを推奨することはできないです。自己責任でお願いします\n\n③これは問題ないです。僕もストナンとネトナンの発信を分けるためにストナンはぶんじろうで、ネトナンはあぱぱでという風に分けてるたので。ただ目的からの逆算は必須ですね。そもそもなんのためにアカウント２個作るのか？ここが明確になってるかは確認して欲しいですね (編集済)\n2025年11月30日日曜日 18:21","sourceUrl":"","createdAt":"2025-11-30T07:44:19.501Z"},{"id":"scr-1779710258382-quqxzr","title":"[質問部屋] あとぴーまんさん以前アカウント添削会で一瞬取り扱ったので（リアルタイムでいなかっ...","category":"feedback","content":"あとぴーまんさん以前アカウント添削会で一瞬取り扱ったので（リアルタイムでいなかったので途中でやめたのでアーカイブは残ってない）発信見てるのは見てるのですが活動軸が本当にわかりにくいですね！\n\n純愛しようとして活動してる感もあれば、なんか遊びまくりたい感出してる時もあって、いやどっちなん！ってなった記憶があります。\n\nそれが結局わからなかったので添削やめたのですが、そのあたりも一貫性を意識するといいですね。見ててちょっと困惑しますね！","sourceUrl":"","createdAt":"2025-11-30T07:56:40.345Z"},{"id":"scr-1779710258383-yxbshg","title":"[質問部屋] @なまいきくん @Yusuke＠講師 @あか@運営  質問失礼します。 質問・相...","category":"feedback","content":"@なまいきくん @Yusuke＠講師 @あか@運営  質問失礼します。 質問・相談失礼します。 Amazno規制解除記事のnoteを配布予定だったのですが、XTEPでシャドバンになり、あまり配布できませんでした。またあまり良くないことだと思いますが、炎上が怖くて名前とプロフを変えてしまいました。  noteの内容にはかなり自信があります。 ただ規制解除はナマモノ過ぎて状況がすぐに変わるので、自分的にはシャドバン中だろうが変わらず出したい気持ちです。また、ようやく興味付けができた状況ですので、これを逃すのが非常にもったいなく思います。 同じくシャドバン中のトッティさんが1万5000インプ出してることからある程度はいけるだろうと考えているのと、大手の人が投稿する可能性もあるようで、パクリと言われるのが嫌だったりもします。  公開すべきか、待つべきか、また、100円の拡散0円noteにするか、下書き状態のURLで共有するか これらを相談したく存じます。今回はインプ稼ぎというよりは、信頼度を高めたいと思っております。 自分としては垢BANになるのはさすがに嫌ですが、今回の投稿でシャドバン期間が1か月伸びるぐらいだったら許容範囲です。 (編集済)\n2026年1月26日月曜日 21:04","sourceUrl":"","createdAt":"2026-01-26T12:04:57.727Z"},{"id":"scr-1779710258383-yslejy","title":"[質問部屋] @everyone\n\nなまいきくん復活させたからか、なまいきくんに絡んでいいのか...","category":"feedback","content":"@everyone\n\nなまいきくん復活させたからか、なまいきくんに絡んでいいのか？属性ブレないか？\n\nみたいな属性認知の質問がちょこちょこ来るのですが、\n\n結論フォロワー500人以上いるようだったら基本問題ないですね！てか、むしろメリットの方が大きいです。\n\n他のジャンルと絡まない方がいいと言ったのは、アカウント初期のアルゴリズムに全くその発信者がどんな属性のアカウントか認知されてない段階の話で\n\nフォロワー500人とか1000人超えていったらむしろ他界隈にもちょこちょこ絡んでいった方が新規層にもリーチしやすくていいですよ！\n\nある程度フォロワーがいれば、多少の絡みで属性がブレることはないですし、\n\n特に、金稼ぎ系であれば、AIだろうが物販だろうが、裏垢だろうが、金を稼ぎたい層がフォロワーにいるという点で\n\nそもそも明確に他界隈と分ける必要もないくらいではあります。\n\nただし、まだ初期アカで属性固まってなさそうだなって人は、まだ他ジャンルに絡まない方がいいのと、\n\n既に伸びてる人でもメインでの絡みが別ジャンルになってくると流石に属性がブレてきたりするので、\n\nメインジャンル8.5割、他ジャンル1.5割くらいの絡みにするのだけ注意してもらえると！\n\nまたこの件に関してなにか分からないことがあれば質問待ってます！","sourceUrl":"","createdAt":"2026-02-05T06:20:21.147Z"},{"id":"scr-1779710258384-rluozw","title":"[質問部屋] きっと理解できると信じて、端的に言うと、最初は顕在層取りに行って、徐々に潜在層も...","category":"feedback","content":"きっと理解できると信じて、端的に言うと、最初は顕在層取りに行って、徐々に潜在層も取り込む動きを入れていくみたいな感じですね！\n\n最初から潜在層いくと、Xのアルゴ的にも、マーケ観点でも悪手だけど、ある程度顕在層取っていったら、\n\n徐々に潜在層取りに行った方が売上も最大化されます！","sourceUrl":"","createdAt":"2026-02-05T06:28:35.162Z"},{"id":"scr-1779710258384-fiiitu","title":"[質問部屋] なまいきくんに絡みに行ってもいいのは普通にめっちゃ嬉しいです！！笑  質問なので...","category":"feedback","content":"なまいきくんに絡みに行ってもいいのは普通にめっちゃ嬉しいです！！笑  質問なのですが、 現在フォロワー1800人いるので他界隈にもちょこちょこ絡みにいこうと思うんですが、 他界隈の人をフォローする行為も全然やって問題ないという認識であっていますか？","sourceUrl":"","createdAt":"2026-02-05T06:40:31.010Z"},{"id":"scr-1779710258385-ihnigj","title":"[質問部屋] @なまいきくん  @あか@運営  @Yusuke＠講師   いつもお世話になりま...","category":"feedback","content":"@なまいきくん  @あか@運営  @Yusuke＠講師   いつもお世話になります！質問させてください！  ❶質問のおおまかなテーマ\n,\n恋愛アカウントをAIアカウントにする是非\n,\nAIアカウントにする場合のコンセプト設計\n,\n ❷現在の状態、目指すゴール\n,\nhttps://x.com/kakeru_mul?s=21&t=8JYYYCn841petmQSjAS_GA  現在かけるという上記アカウントを恋愛界隈で運用してきましたが、家庭の事情でこれ以上このテーマで続けていくことができなくなりました。 そこでジャンルをAIに切り替え、AI高単価アフィをにゴールにしようと考えています。  ❸自分なりの意見や仮説\n,\nアカウントのジャンル移行について\n,\n以下A~Cの方針があると思いますが、Bがいいと考えています。  —-  方針A\n,\n 同じアカウントで、恋愛 x AI→AIと少しずつテーマをずらす  方針B（推し案）\n,\n 同じアカウントで、テーマをいきなりAIに切り替える  方針C\n,\n アカウントはゼロペースで作り直すか買収する  —-  AとBは今のアカウントパワーが引き継げるので初動がラクになります。  テーマの引継ぎが大変になるのを緩和するためにA案を考えましたが、恋愛寄せのコンテンツも作りづらい状況なのとどうせAIにするなら最初からやればいいのかなと思うのとでBが推し案となってます。  AIアカウントのコンセプト設計\n,\n次に、ジャンルをAIにしたときのコンセプト設計を以下のように考えています。  コンセプト\n,\n「AIを使って人生をハックし、自由を謳歌しているかっこいい大人」  私自身がフリーランスのソフトウェアエンジニアとしてAIを使って楽に稼ぎ、 余った時間を新規事業投資、家族や友人、趣味のボディメイクの時間にあてているので、 今のライフスタイルをそのまま発信します。  送客のイメージ\n,\nフロント（X）: 「真面目にAIを勉強するな。期待値調整と最小限のAI活用で、仕事してるフリして自由を掴め」という逆説的な発信で集客。  教育（公式LINE/メルマガ等）: 「俺がサボれるのは、最低限『これだけ』はAIに任せられるという基盤があるからだ。その基盤すら持っていないなら、一生労働からは抜け出せない」  クロージング（アフィ送客）: 「最短でその基盤（＝日銭を稼ぐAIスキル）を手に入れるなら、この環境が一番手っ取り早い。俺もここにある要素の一部を使って、今の自由な時間を生み出している」  ❹質問内容\n,\n質問1\n,\n現在のアカウントからジャンルの移行はA~C案のどれが最適そうでしょうか。 また、その際に注意事項などはありますでしょうか。  質問2\n,\nAIアカウントのコンセプト設計についてご指摘があればお願いします。 (編集済)\n2026年2月10日火曜日 22:42","sourceUrl":"","createdAt":"2026-02-10T13:42:02.551Z"},{"id":"scr-1779710258385-qsxhur","title":"[質問部屋] @なまいきくん  @Yusuke＠講師  @あか@運営   初めての質問です。 ...","category":"feedback","content":"@なまいきくん  @Yusuke＠講師  @あか@運営   初めての質問です。  ❶質問のおおまかなテーマ 発信コンセプトについて  ❷現在の状態、目指すゴール 現在の状態：スクールに入り、ジャンルはAIで決定 ・AIを普段から利用し、AIの魅力・可能性を感じている ・まず実店舗での集客事例（webマーケティング事例）があるのでジャンルとしてはAI×SNS(集客） ・X/インスタ/スレッズで同じソースを配信しスクール系に誘導しマネタイズをしようかと考えている  目指すゴール：発信コンセプトを決めて、アカウントを育てていきたい  ❸自分なりの意見や仮説 【ターゲット読者の現状】  ・40代以上の社畜 ・PCも苦手の方 ・本業が忙しい ・現在の職種に漠然と不安を頂いている ・AIを利用して未来を変えたい（副業も視野） ・ビジネス初心者／何から始めればいいかわからない層。 ・40代以降でも遅くない稼ぎ方に興味がある ・40代男性会社員・夫婦家庭持ちの会社員    Who：誰に向けて発信するか？  【ターゲットの悩み・課題】  ・自分はパソコンが苦手だから無理そう ・何から始めればいいのかわからない ・40代から新しいことを始めるのは遅いと感じている ・AIは若い人や詳しい人しか使いこなせないと思っている ・今後AIを利用しないといけないと感じている ・難しい設定や専門用語が多そうで拒否感がある ・本業と家庭が忙しくて作業・副業の時間が取れない   What：どんなゴールに連れていくか？ 3～6ヶ月で“40代未経験からAIを利用してAI人材になり付加価値として収益化の仕組みを作り、AI活用or副業で月30〜100万円を達成する 【ゴール達成後の理想の状態】 AIを使いこなせる自信がつく（AI人材） 毎月の生活費に余裕ができる 将来への漠然とした不安が減る 定年後にも続けられる収入源ができる  ❹質問内容 2点あります。  ・発信コンセプトのWHO、WHATをみていただき 改善点などがあればアドバイスをいただきたい。  ・AI×SNS（集客）は高単価アフィリと相性はいいでしょうか？  ご教授ください。","sourceUrl":"","createdAt":"2026-04-21T10:38:28.567Z"},{"id":"scr-1779710258386-dihydj","title":"[講義アナウンス] @everyone \n\n【2周目講義】\n\n本日11/30(日)の21時より、2周...","category":"instructor","content":"@everyone \n\n【2周目講義】\n\n本日11/30(日)の21時より、2周目講義の第2回目を行います！\n\n10/1以降〜スクールに入会された方や、すでに運用を開始しているがフォロワーがまだ500人以下など伸び悩んでいる方、初期運用フェーズの方は必ず参加ください！\n\n内容は\n\n・はじめに~ポスト作成【入門】\n・なんのためにポストするのか？\n・ポスト作成3ステップ\n・伸びるポストのコツ\n\nこちらになります！\n\n前回の講義でアカウントの準備に関しては問題ないはずなので、今回の授業聞いてポストを作れるようになればマネタイズまで近付いていきます！\n\n今回もリアルタイムで質問に答えていくので、ぜひご参加ください！","sourceUrl":"","createdAt":"2025-11-30T05:11:54.176Z"},{"id":"scr-1779710258386-hlvzpc","title":"[講義アナウンス] @everyone \n【2周目講義】\n本日の2周目リアルタイム講義はこちらからど...","category":"instructor","content":"@everyone \n【2周目講義】\n本日の2周目リアルタ
